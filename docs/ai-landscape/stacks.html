<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Stack</title>
  <meta name="description" content="An interactive map of the AI industry: 11 layers from power plants to applications, with the companies in each bucket.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23007577'/><text x='50' y='66' font-family='Arial' font-weight='700' font-size='46' fill='white' text-anchor='middle'>AI</text></svg>">
  <style>
/* ===== Tokens =====
   Palette: The Modern Data Company brand guide (v1.01), as used in the Vulcan training pages.
   Cream background, Slate text, Dark Teal accent, Ember only for problems. Arial for text. */
:root {
  --font: Arial, Helvetica, sans-serif;
  --display: Arial, Helvetica, sans-serif;
  --radius: 12px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --h: 10;
}
:root, :root[data-theme="light"] {
  --bg: #EDE9E5;            /* Cream */
  --bg2: #F5F4F0;           /* Card */
  --panel: #F5F4F0;
  --panel-solid: #FFFFFF;
  --panel-hi: #FFFFFF;
  --line: #D6CDC6;          /* Sandpaper */
  --text: #242422;          /* Slate */
  --muted: #6B6966;
  --chip: #E4DED8;
  --accent: #007577;        /* Dark Teal, darkened for text contrast on Cream */
  --accent-soft: #DDF1EE;   /* Teal tint */
  --accent-ink: #FFFFFF;
  --layer-from: #35505B;    /* Iron: L0 */
  --brand: #54DED1;         /* Primary Teal: only on dark fills */
  --ember: #FF5537;
  --ember-soft: #FDE0DC;
  --ember-ink: #733635;     /* Dusky Ember */
  --shadow: 0 18px 40px -24px rgba(36, 36, 34, .35);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #242422;            /* Slate */
  --bg2: #2E2E2B;
  --panel: #2E2E2B;
  --panel-solid: #363632;
  --panel-hi: #3A3A36;
  --line: #45453F;
  --text: #EDE9E5;
  --muted: #B5AFA8;
  --chip: #363632;
  --accent: #54DED1;        /* Primary Teal */
  --accent-soft: #1E3F3E;
  --accent-ink: #242422;
  --layer-from: #D6CDC6;    /* Sandpaper: L0 */
  --ember-soft: #3D2826;
  --ember-ink: #FFA797;
  --shadow: 0 20px 50px -20px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
/* Layer color: The script below sets --h to the layer's position (0 = L0). L0 starts at Iron and each layer moves 10% toward the accent. */
:root, [style*="--h:"] { --lc: color-mix(in srgb, var(--accent) calc(var(--h) * 10%), var(--layer-from)); }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--text);
  font: 15px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
  transition: background .4s var(--ease), color .4s var(--ease);
}
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4 { font-family: var(--display); letter-spacing: -.01em; margin: 0; }
h1, h2 { font-weight: 400; }
h3, h4 { font-weight: 700; }
kbd {
  font: 600 11px var(--font); padding: 2px 6px; border-radius: 6px;
  background: var(--chip); border: 1px solid var(--line); color: var(--muted);
}
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ===== Background (static, subtle) ===== */
.bg { display: none; position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.blob {
  position: absolute; width: 50vmax; height: 50vmax; border-radius: 50%;
  filter: blur(100px); opacity: var(--blob-a);
  transition: background 1.2s var(--ease);
}
.b1 { background: var(--lc); top: -22vmax; left: -14vmax; }
.b2 { background: var(--lc); bottom: -26vmax; right: -16vmax; }
.b3 { display: none; }
.grid { display: none; }

/* ===== Top bar ===== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 24px;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 17px; white-space: nowrap; }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); }
.brand b { color: var(--accent); }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); overflow: hidden; white-space: nowrap; }
.crumbs a:hover { color: var(--text); }
.crumbs i { font-style: normal; opacity: .4; }
.crumbs span { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.actions { display: flex; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 12px;
  font: 500 13px var(--font); color: var(--text);
  background: var(--panel); border: 1px solid var(--line);
  cursor: pointer; transition: transform .25s var(--spring), background .2s, border-color .2s;
}
.btn:hover { background: var(--panel-hi); border-color: color-mix(in srgb, var(--lc) 45%, transparent); }
.btn.icon { padding: 8px 11px; min-width: 38px; justify-content: center; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 85%, var(--text)); }

/* ===== Home ===== */
main { outline: none; }
.home { max-width: 1240px; margin: 0 auto; padding: 48px 24px 80px; }
.hero { max-width: 820px; animation: rise .5s var(--ease) both; }
.eyebrow { font-size: 16px; font-weight: 400; color: var(--accent); margin: 0 0 10px; }
.hero h1 { font-size: clamp(34px, 5vw, 56px); line-height: 1.05; }
.grad { color: var(--accent); }
.brand-mark { color: var(--accent-ink); background: var(--accent) !important; font: 700 13px var(--font); }
.lede { color: var(--muted); font-size: 17px; max-width: 760px; margin: 16px 0 0; }
.stats { display: flex; gap: 36px; margin-top: 28px; flex-wrap: wrap; }
.stats div { display: flex; flex-direction: column; }
.stats b { font: 700 30px var(--display); }
.stats span { color: var(--muted); font-size: 13px; }

.home-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(300px, 1fr); gap: 40px; margin-top: 44px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.stack-label { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 14px 0 4px 2px; }
.stack-label.top { margin-top: 0; }
.slab {
  view-transition-class: lyr;
  display: grid; align-items: center; grid-template-columns: 48px 1fr auto; gap: 12px;
  padding: 13px 18px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line);
  box-shadow: inset 3px 0 0 var(--lc);
  animation: rise .4s var(--ease) both; animation-delay: calc(var(--i) * 25ms);
  transition: background .2s, border-color .2s, transform .25s var(--ease);
}
.slab:hover, .slab:focus-visible, .slab.active {
  background: color-mix(in srgb, var(--lc) 10%, transparent); border-color: color-mix(in srgb, var(--lc) 40%, transparent);
  transform: translateX(4px); outline: none;
}
.slab-id { font: 700 17px var(--display); color: var(--lc); }
.slab-name { font: 600 16px var(--display); }
.slab-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
.hint { color: var(--muted); font-size: 13px; margin-top: 16px; }

.peek { position: sticky; top: 90px; }
.peek-inner {
  position: relative; overflow: hidden;
  padding: 26px; border-radius: 18px;
  background: var(--panel); border: 1px solid var(--line);
  border-top: 3px solid var(--lc);
  animation: fadeIn .25s var(--ease) both;
}
@keyframes fadeIn { from { opacity: 0; } }
.peek-top { display: flex; justify-content: space-between; align-items: center; }
.peek-id { font: 700 40px/1 var(--display); color: var(--lc); }
.peek-icon { font-size: 32px; }
.peek h2 { font-size: 22px; margin: 10px 0 6px; }
.peek p { color: var(--muted); margin: 0 0 14px; }
.peek-list { list-style: none; padding: 0; margin: 16px 0 20px; display: grid; gap: 6px; }
.peek-list li { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 7px 10px; border-radius: 10px; background: var(--chip); }
.peek-list em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 12px; }
.test {
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px 14px; border-radius: 10px;
  background: var(--chip); border-left: 3px solid var(--lc);
  font-size: 14px;
}
.test span { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-weight: 600; }
.test.def { border-left-color: var(--line); background: var(--panel); }
.test.def span { color: var(--muted); }
.test + .test { margin-top: 10px !important; }
.mece {
  display: flex; gap: 14px; align-items: flex-start;
  margin-top: 56px; padding: 18px 22px; border-radius: 14px;
  background: var(--panel); border: 1px dashed var(--line);
}
.mece span { font-size: 22px; }
.mece p { margin: 0; color: var(--muted); }
.mece a { color: var(--accent); font-weight: 600; }

/* ===== Layer & bucket views ===== */
.layer { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 32px; max-width: 1400px; margin: 0 auto; padding: 30px 24px 90px; }
.rail { position: sticky; top: 84px; align-self: start; display: flex; flex-direction: column; gap: 5px; }
.rail-item {
  view-transition-class: lyr;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 10px; font-size: 13px; color: var(--muted);
  border: 1px solid transparent;
  box-shadow: inset 3px 0 0 color-mix(in srgb, var(--lc) 70%, transparent);
  transition: background .2s, color .2s;
}
.rail-item b { font-family: var(--display); width: 30px; flex: none; color: var(--lc); }
.rail-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-item:hover { background: var(--chip); color: var(--text); }
.rail-item.on { background: color-mix(in srgb, var(--lc) 14%, transparent); border-color: color-mix(in srgb, var(--lc) 40%, transparent); color: var(--text); }
/* Fallback when the browser has no View Transitions: the rail slides in from where the list was */
.slide-in .rail-item { animation: railIn .5s var(--ease) both; animation-delay: calc(var(--n, 0) * 20ms); }
@keyframes railIn { from { opacity: 0; transform: translateX(40vw) scale(1.25); } }

.layer-head, .bucket-head { position: relative; padding: 10px 0 26px; animation: rise .4s var(--ease) both; }
.watermark { display: none; }
.lh-row, .bh-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.lh-icon { display: grid; place-items: center; width: 56px; height: 56px; font-size: 28px; border-radius: 14px; background: var(--chip); border: 1px solid var(--line); }
.layer-head h1, .bucket-head h1 { font-size: clamp(30px, 4vw, 48px); line-height: 1.05; }
.layer-head .eyebrow { margin-bottom: 4px; }
.layer-head .test { margin-top: 18px; max-width: 640px; }
.pn { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.back { display: inline-block; color: var(--muted); font-size: 14px; margin-bottom: 14px; transition: color .2s, transform .3s var(--spring); }
.back:hover { color: var(--accent); }
.code {
  display: inline-flex; align-items: center; justify-content: center;
  font: 700 12px var(--display); padding: 3px 8px; border-radius: 8px;
  color: var(--lc); background: color-mix(in srgb, var(--lc) 15%, transparent);
  white-space: nowrap;
}
.code.xl { font-size: 20px; padding: 6px 14px; border-radius: 12px; }

.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 8px; }
.card {
  position: relative; display: flex; flex-direction: column; gap: 12px;
  padding: 20px; border-radius: var(--radius);
  background: var(--panel); border: 1px solid var(--line);
  animation: rise .35s var(--ease) both; animation-delay: calc(min(var(--i), 8) * 30ms);
  transition: border-color .2s, opacity .3s;
}
.card:hover { border-color: color-mix(in srgb, var(--lc) 45%, transparent); }
.card.dim { opacity: .38; }
.card.dim:hover { opacity: .8; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-head h3 { font-size: 18px; line-height: 1.2; flex: 1; }
.card-head .go {
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: var(--chip); color: var(--muted);
  transition: transform .2s var(--ease), color .2s;
}
.card-head:hover .go { transform: translateX(3px); color: var(--accent); }
.card-head:hover h3 { color: var(--accent); }
.arch-icon { font-size: 26px; }
.desc { margin: 0; color: var(--muted); font-size: 14px; }
.card-foot { margin-top: auto; padding-top: 6px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); }
.card.big .card-head h3 { font-size: 22px; }

.subs { display: grid; gap: 10px; }
.subs.nested { margin-top: 4px; padding-left: 10px; border-left: 2px solid color-mix(in srgb, var(--lc) 25%, transparent); }
.sub { padding: 12px; border-radius: 12px; background: var(--chip); transition: opacity .3s, background .2s; }
.sub.dim { display: none; }
.sub.dim + .sub.dim { display: none; }
.sub .sub { background: transparent; padding: 6px 4px; }
.sub-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.sub-head:hover span:nth-child(2) { color: var(--accent); }
.sub-head .count { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 500; }
.sub-desc { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
.sub .chips { margin-top: 8px; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  position: relative;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 4px; border-radius: 999px;
  background: var(--panel-solid); border: 1px solid var(--line);
  font-size: 13px; font-weight: 500;
  transition: border-color .15s, background .15s;
}
.chip:hover { border-color: var(--accent); background: var(--panel-hi); }
.chip.more { padding: 4px 12px; color: var(--accent); font-weight: 600; background: transparent; border-style: dashed; }
.av {
  display: grid; place-items: center; flex-shrink: 0;
  width: 24px; height: 24px; border-radius: 50%;
  font: 700 10px var(--display); color: #fff;
  background: var(--av, #35505B);
}
:root[data-theme="dark"] .av { background: color-mix(in srgb, var(--av, #35505B) 60%, #8B857D); }
.av.big { width: 40px; height: 40px; font-size: 14px; border-radius: 10px; }
.ind-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--ih) 40% 46%); margin-left: -2px; }
.chip.flash, .tile.flash { animation: flash 2.4s var(--ease); }
@keyframes flash {
  0%, 30%, 60% { box-shadow: 0 0 0 3px var(--accent), 0 0 24px #54DED1; transform: scale(1.1); }
  15%, 45%, 100% { box-shadow: 0 0 0 0 transparent; transform: scale(1); }
}
.concepts { display: flex; flex-wrap: wrap; gap: 6px; }
.concept { font-size: 12px; padding: 3px 9px; border-radius: 8px; color: var(--muted); border: 1px dashed var(--line); }
.empty { color: var(--muted); font-size: 13px; font-style: italic; margin: 0; }

/* tiles (bucket view) */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 18px; }
.tile {
  position: relative; display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; row-gap: 2px; align-content: start;
  padding: 12px 14px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line);
  animation: rise .3s var(--ease) both; animation-delay: calc(min(var(--i), 12) * 15ms);
  transition: border-color .2s, background .2s;
}
.tile:hover { border-color: var(--accent); background: var(--panel-hi); }
.tile .av.big { grid-row: span 4; }
.tile > :not(.av) { grid-column: 2; }
.t-name { font: 600 15px var(--display); }
.t-of { font-size: 12px; color: var(--muted); }
.t-ind { display: flex; flex-wrap: wrap; gap: 4px; }
.t-ind span { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: hsl(var(--ih) 40% 50% / .16); color: hsl(var(--ih) 35% 72%); }
:root[data-theme="light"] .t-ind span { color: hsl(var(--ih) 45% 30%); }
.t-cta { position: absolute; top: 10px; right: 12px; font-size: 16px; line-height: 1; color: var(--muted); }
.tile:hover .t-cta { color: var(--text); }
.concept-panel { margin-top: 22px; padding: 16px; border-radius: 14px; border: 1px dashed var(--line); }
.concept-panel h4 { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }

/* L10 flow + filters */
.flow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.flow-step {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--panel); border: 1px solid var(--line);
  animation: rise .4s var(--ease) both; animation-delay: calc(var(--i) * 50ms);
  transition: transform .3s var(--spring), background .2s, border-color .2s;
}
.flow-step:hover { border-color: color-mix(in srgb, var(--lc) 50%, transparent); }
.flow-step.on { background: color-mix(in srgb, var(--lc) 16%, transparent); border-color: color-mix(in srgb, var(--lc) 60%, transparent); }
.flow .arrow { color: var(--muted); }
.flow .sep { color: var(--line); margin: 0 4px; }
.flow-note { font-size: 12px; color: var(--muted); margin-left: 6px; font-style: italic; }
.filterbar {
  position: sticky; top: 64px; z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
  padding: 12px 14px; margin: 0 0 18px; border-radius: 16px;
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px);
  border: 1px solid var(--line);
}
.fb-label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; margin-right: 4px; }
.fchip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 999px; cursor: pointer;
  font: 500 13px var(--font); color: var(--text);
  background: var(--chip); border: 1px solid var(--line);
  transition: transform .25s var(--spring), background .2s, border-color .2s;
}
.fchip b { font-size: 11px; color: var(--muted); font-weight: 600; }
.fchip:hover { border-color: hsl(var(--ih, 180) 55% 58%); }
.fchip.on { background: hsl(var(--ih, 180) 55% 55% / .18); border-color: hsl(var(--ih, 180) 55% 60%); }
.fchip.on b { color: var(--text); }
.fchip.zero { opacity: .45; }

/* ===== Drawer ===== */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 40;
  width: min(560px, 100vw);
  background: var(--bg2); border-left: 1px solid var(--line);
  box-shadow: -30px 0 60px -20px rgba(0, 0, 0, .5);
  transform: translateX(105%); transition: transform .5s var(--ease);
  overflow-y: auto;
}
.drawer-open .drawer { transform: none; }
.drawer-inner { position: relative; padding: 32px 28px 60px; }
.drawer .close { position: absolute; right: 20px; top: 22px; }
.drawer h2 { font-size: 26px; margin-bottom: 8px; padding-right: 50px; }
.drawer h3 { font-size: 17px; margin: 28px 0 10px; }
.rules { padding-left: 20px; margin: 0; display: grid; gap: 10px; }
.rules li::marker { color: var(--accent); font-weight: 700; }
.tags { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tags th { text-align: left; white-space: nowrap; padding: 8px 12px 8px 0; vertical-align: top; font-weight: 600; }
.tags th .code { margin-right: 8px; min-width: 38px; }
.tags td { padding: 8px 0; color: var(--muted); border-bottom: 1px solid var(--line); }
.tags th { border-bottom: 1px solid var(--line); }
.legend { padding-left: 18px; display: grid; gap: 10px; font-size: 14px; color: var(--muted); }
.chip.demo { animation: none; vertical-align: middle; color: var(--text); }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(5, 5, 15, .45); opacity: 0; pointer-events: none; transition: opacity .4s; }
.drawer-open .scrim { opacity: 1; pointer-events: auto; }

/* ===== Search ===== */
.search {
  position: fixed; inset: 0; z-index: 50;
  display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 0;
  background: rgba(5, 5, 15, .5); backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.search-open .search { opacity: 1; pointer-events: auto; }
.search-box {
  width: min(640px, 100%); border-radius: 20px; overflow: hidden;
  background: var(--bg2); border: 1px solid var(--line); box-shadow: var(--shadow);
  transform: translateY(-14px) scale(.97); transition: transform .35s var(--spring);
}
.search-open .search-box { transform: none; }

.load-error h2 { font-size: 28px; margin-bottom: 12px; }

/* Page changes: the layer list morphs between the home page and the left sidebar */
::view-transition-old(root) { animation: vtOut .2s ease both; }
::view-transition-new(root) { animation: vtIn .35s .2s ease both; }
@keyframes vtOut { to { opacity: 0; } }
@keyframes vtIn { from { opacity: 0; } }
::view-transition-group(*.lyr) { animation-duration: .55s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
::view-transition-image-pair(*.lyr) { overflow: hidden; border-radius: 10px; }
::view-transition-old(*.lyr), ::view-transition-new(*.lyr) { height: 100%; width: auto; }
::view-transition-old(*.lyr) { animation-duration: .25s; }


[hidden] { display: none !important; }

  .pn .btn { min-width: 0; max-width: 49%; font-size: 12px; }
  .pn .btn { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* L10: tie-breaker strip and industry filter become single swipeable rows */
  .flow, .filterbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

  <script>
/* Turns window.TAXONOMY_DATA (from data.js) into window.TAXONOMY for the app below. */
(function () {
  "use strict";

  // "Rufus~Amazon#Retail" -> { name, slug, of, q, ind }. A leading + (older data) is ignored.
  function parseCompany(s, slugs) {
    s = String(s);
    var o = { name: "", slug: null, of: null, q: null, ind: null };
    if (s.charAt(0) === "+") s = s.slice(1);
    var parts = s.split(/(?=[@~?#])/);
    o.name = parts[0].trim();
    for (var i = 1; i < parts.length; i++) {
      var p = parts[i], v = p.slice(1).trim();
      if (p[0] === "@") o.slug = v;
      else if (p[0] === "~") o.of = v;
      else if (p[0] === "?") o.q = v;
      else if (p[0] === "#") o.ind = v.split(",").map(function (x) { return x.trim(); });
    }
    if (!o.slug) o.slug = slugs[o.name] || (o.of && slugs[o.of]) || null;
    return o;
  }

  function build(doc) {
    var slugs = doc.slugs || {};
    (function walk(nodes) {
      (nodes || []).forEach(function (n) {
        if (n.companies) n.companies = n.companies.map(function (c) { return parseCompany(c, slugs); });
        walk(n.children);
      });
    })((doc.layers || []).reduce(function (all, l) { return all.concat(l.buckets || []); }, []));
    // The app expects these two lists as [code, name, desc] and [rule, example] rows.
    doc.filterTags = (doc.filterTags || []).map(function (f) { return [f.code, f.name, f.desc]; });
    doc.rules = (doc.rules || []).map(function (r) { return [r.rule, r.example]; });
    delete doc.slugs;
    return doc;
  }

  if (!window.TAXONOMY_DATA) {
    document.getElementById("app").innerHTML = '<div class="load-error"><h2>The map could not load its data</h2>' +
      '<p>Make sure that <code>data.js</code> is in the same folder as <code>index.html</code>, and that it has no syntax errors. Open the browser console to see the error.</p></div>';
    return;
  }
  window.TAXONOMY = build(window.TAXONOMY_DATA);
})();
</script>
  <script>
/* AI Stack: rendering and interaction. Data lives in data.js. */
(function () {
  "use strict";

  var T = window.TAXONOMY;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var app = $("#app");

  // Layer position (0 = bottom layer). The CSS turns it into a shade between Iron and Dark Teal.
  var HUES = {};
  T.layers.forEach(function (l, i) { HUES[l.id] = T.layers.length > 1 ? Math.round(i * 10 / (T.layers.length - 1)) : 10; });
  // Company avatar colors from the Modern brand palette: Slate, Iron, Midnight, Dark Teal, Dusky Ember.
  var AV = ["#242422", "#35505B", "#202F36", "#007577", "#733635"];
  var IND_HUES = { Horizontal: 220, Legal: 30, Healthcare: 150, Finance: 120, Insurance: 190, Education: 50, Retail: 330, Manufacturing: 15, Media: 290, Government: 0, Science: 260 };
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var state = {
    industries: new Set()
  };

  /* ---------- small helpers ---------- */
  function store(k, d) { try { var v = localStorage.getItem("aistack." + k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem("aistack." + k, v); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function hashHue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function initials(n) {
    var w = n.replace(/[^A-Za-z0-9 .]/g, " ").trim().split(/\s+/);
    if (/^\d/.test(n)) return n.slice(0, 2);
    return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase();
  }
  function linkedin(c) {
    if (c.slug && /^https?:\/\//.test(c.slug)) return c.slug; // a full link: a LinkedIn showcase page or the company website
    if (c.slug) return "https://www.linkedin.com/company/" + c.slug + "/";
    return "https://www.linkedin.com/search/results/companies/?keywords=" + encodeURIComponent(c.q || c.of || c.name);
  }
  function layerById(id) { return T.layers.filter(function (l) { return l.id === id; })[0]; }
  function findNode(nodes, code, trail) {
    for (var i = 0; i < (nodes || []).length; i++) {
      var n = nodes[i], t = trail.concat([n]);
      if (n.code === code) return t;
      var f = findNode(n.children, code, t);
      if (f) return f;
    }
    return null;
  }
  function visible(c, layer) {
    if (layer && layer.isApps && state.industries.size) {
      var ind = c.ind || ["Horizontal"];
      for (var i = 0; i < ind.length; i++) if (state.industries.has(ind[i])) return true;
      return false;
    }
    return true;
  }
  function allCompanies(node) {
    var out = (node.companies || []).slice();
    (node.children || []).forEach(function (ch) { out = out.concat(allCompanies(ch)); });
    return out;
  }
  function countVisible(node, layer) { return allCompanies(node).filter(function (c) { return visible(c, layer); }).length; }
  function layerCount(layer) { return layer.buckets.reduce(function (s, b) { return s + countVisible(b, layer); }, 0); }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }



  /* ---------- pieces ---------- */
  function chip(c, layer, i) {
    var title = (c.of ? c.name + " (by " + c.of + ")" : c.name) +
      (!c.slug ? " · search LinkedIn for " + (c.q || c.of || c.name) : /linkedin\.com/.test(linkedin(c)) ? " · open LinkedIn page" : " · open website");
    var dots = layer && layer.isApps ? (c.ind || ["Horizontal"]).map(function (d) {
      return '<i class="ind-dot" style="--ih:' + IND_HUES[d] + '" title="' + esc(d) + '"></i>';
    }).join("") : "";
    return '<a class="chip" data-name="' + esc(c.name) + '" href="' + linkedin(c) +
      '" target="_blank" rel="noopener noreferrer" title="' + esc(title) + '" style="--av:' + AV[hashHue(c.of || c.name) % AV.length] + ';--i:' + (i || 0) + '">' +
      '<span class="av">' + esc(initials(c.name)) + "</span>" +
      '<span class="cn">' + esc(c.name) + "</span>" + dots +
      "</a>";
  }

  function chips(list, layer, limit, href) {
    var v = (list || []).filter(function (c) { return visible(c, layer); });

  }

  function emptyNote(node, layer) {
    var hasAny = allCompanies(node).length > 0;
    if (countVisible(node, layer) || (node.concepts && node.concepts.length)) return "";

    return "";
  }

  function subBlock(node, layer, depth) {
    var n = countVisible(node, layer);
    var dim = layer.isApps && state.industries.size && !n ? " dim" : "";
    return '<div class="sub' + dim + '">' +
      '<a class="sub-head" href="#/' + layer.id + "/" + encodeURIComponent(node.code) + '"><span class="code">' + esc(node.code) + "</span><span>" + esc(node.name) + "</span>" +
      '<span class="count">' + n + "</span></a>" +
      (node.desc && depth < 2 ? '<p class="sub-desc">' + esc(node.desc) + "</p>" : "") +
      chips(node.companies, layer, 8, nodeHref(layer, node)) + concepts(node.concepts) +
      (node.children ? '<div class="subs nested">' + node.children.map(function (ch) { return subBlock(ch, layer, depth + 1); }).join("") + "</div>" : "") +
      "</div>";
  }

  function card(node, layer, i, big) {
    var n = countVisible(node, layer);
    var dim = layer.isApps && state.industries.size && !n ? " dim" : "";
    return '<article class="card' + (big ? " big" : "") + dim + '" style="--i:' + i + '">' +
      '<a class="card-head" href="#/' + layer.id + "/" + encodeURIComponent(node.code) + '" title="Open ' + esc(node.code) + '">' +
      (node.icon ? '<span class="arch-icon">' + node.icon + "</span>" : "") +
      '<span class="code">' + esc(node.code) + "</span>" +
      "<h3>" + esc(node.name) + "</h3>" +
      '<span class="go" aria-hidden="true">→</span></a>' +
      (node.desc ? '<p class="desc">' + esc(node.desc) + "</p>" : "") +
      chips(node.companies, layer, 12, nodeHref(layer, node)) + concepts(node.concepts) + emptyNote(node, layer) +
      (node.children ? '<div class="subs">' + node.children.map(function (ch) { return subBlock(ch, layer, 1); }).join("") + "</div>" : "") +
      '<div class="card-foot">' + plural(n, "example") + (node.children ? " · " + plural(node.children.length, "sub-bucket") : "") + "</div>" +
      "</article>";
  }

  function tile(c, layer, i) {
    return '<a class="tile" data-name="' + esc(c.name) + '" href="' + linkedin(c) + '" target="_blank" rel="noopener noreferrer" style="--av:' + AV[hashHue(c.of || c.name) % AV.length] + ";--i:" + i + '">' +
      '<span class="av big">' + esc(initials(c.name)) + "</span>" +
      '<span class="t-name">' + esc(c.name) + "</span>" +
      (c.of ? '<span class="t-of">by ' + esc(c.of) + "</span>" : "") +
      (layer.isApps ? '<span class="t-ind">' + (c.ind || ["Horizontal"]).map(function (d) { return '<span style="--ih:' + IND_HUES[d] + '">' + esc(d) + "</span>"; }).join("") + "</span>" : "") +

  }

  function industryBar(layer) {
    var counts = {};
    T.industries.forEach(function (d) { counts[d] = 0; });
    var all = layer.buckets.reduce(function (a, b) { return a.concat(allCompanies(b)); }, []);
    all.forEach(function (c) { (c.ind || ["Horizontal"]).forEach(function (d) { counts[d]++; }); });
    return '<div class="filterbar" role="group" aria-label="Filter by industry">' +
      '<span class="fb-label">F1 Industry filter</span>' +
      '<button class="fchip' + (state.industries.size ? "" : " on") + '" data-ind="">All <b>' + all.length + "</b></button>" +
      T.industries.map(function (d) {
        return '<button class="fchip' + (state.industries.has(d) ? " on" : "") + (counts[d] ? "" : " zero") + '" data-ind="' + esc(d) + '" style="--ih:' + IND_HUES[d] + '">' +
          '<i class="ind-dot" style="--ih:' + IND_HUES[d] + '"></i>' + esc(d) + " <b>" + counts[d] + "</b></button>";

  function flowStrip(layer, activeCode) {
    return '<div class="flow" aria-label="Tie-breaker order">' + layer.buckets.map(function (b, i) {

        "<span>" + b.icon + "</span>" + b.code + " " + esc(b.name) + "</a>";
    }).join("") + '<span class="flow-note">first match wins</span></div>';
  }

  function rail(active) {
    return '<nav class="rail" aria-label="Layers">' + T.layers.slice().reverse().map(function (l, i) {
      return '<a href="#/' + l.id + '" class="rail-item' + (l.id === active ? " on" : "") + '" style="--h:' + HUES[l.id] + ";--n:" + i + ";view-transition-name:lyr-" + l.id + '" title="' + esc(l.name) + '">' +
        "<b>" + l.id + "</b><span>" + esc(l.name) + "</span></a>";

  }

  /* ---------- views ---------- */
  function viewHome() {
    var total = T.layers.reduce(function (s, l) { return s + layerCount(l); }, 0);
    var buckets = T.layers.reduce(function (s, l) { return s + l.buckets.length; }, 0);

      return (l.id === "L9" ? '<div class="stack-label">Enabling stack · L0 to L9 · what builders buy</div>' : "") +
        '<a class="slab" href="#/' + l.id + '" data-id="' + l.id + '" style="--h:' + HUES[l.id] + ";--i:" + i + ";view-transition-name:lyr-" + l.id + '">' +
        '<b class="slab-id">' + l.id + "</b>" +

    return '<section class="home">' +
      '<div class="hero">' +
      '<p class="eyebrow">First-principles map' + (T.author ? " · by " + esc(T.author) : "") + " · as of " + esc(T.asOf) + "</p>" +
      "<h1>Every AI company sits on a <span class=\"grad\">stack</span>.</h1>" +
      '<p class="lede">' + esc(T.overview) + "</p>" +
      '<div class="stats"><div><b data-count="' + T.layers.length + '">' + T.layers.length + '</b><span>layers</span></div><div><b data-count="' + buckets + '">' + buckets + "</b><span>buckets &amp; archetypes</span></div><div><b data-count=\"" + total + "\">" + total + "</b><span>products &amp; companies</span></div></div>" +
      "</div>" +
      '<div class="home-grid">' +
      '<div class="stack-wrap" id="stackWrap"><div class="stack-label top">Applications · what users buy</div><div class="stack" id="stack">' + slabs + "</div>" +

      "</div>" +
      '<div class="mece"><span>💡</span><p>' + esc(T.mece) + ' <a href="#" data-open="rules">See the five classification rules →</a></p></div>' +
      "</section>";
  }

  function peekHtml(l) {
    return '<div class="peek-inner" style="--h:' + HUES[l.id] + '">' +
      '<div class="peek-top"><span class="peek-id">' + l.id + '</span><span class="peek-icon">' + l.icon + "</span></div>" +
      "<h2>" + esc(l.name) + "</h2>" +
      "<p>" + esc(l.tagline) + "</p>" +
      (l.definition ? '<div class="test def"><span>Definition</span>' + esc(l.definition) + "</div>" : "") +
      '<div class="test"><span>Placement test</span>' + esc(l.test) + "</div>" +
      '<ul class="peek-list">' + l.buckets.map(function (b, i) {
        return '<li style="--i:' + i + '"><span class="code">' + esc(b.code) + "</span>" + esc(b.name) + '<em>' + countVisible(b, l) + "</em></li>";
      }).join("") + "</ul>" +
      '<a class="btn primary" href="#/' + l.id + '">Explore ' + l.id + " →</a></div>";
  }

  function layerHeader(l, crumbExtra) {
    var idx = T.layers.indexOf(l);
    var prev = T.layers[idx - 1], next = T.layers[idx + 1];
    return '<header class="layer-head">' +
      '<span class="watermark">' + l.id + "</span>" +
      '<div class="lh-row"><span class="lh-icon">' + l.icon + '</span><div><p class="eyebrow">Layer ' + l.id.slice(1) + " of 10</p><h1>" + esc(l.name) + "</h1></div></div>" +
      '<p class="lede">' + esc(l.tagline) + "</p>" +
      (l.definition ? '<div class="test def"><span>Definition</span>' + esc(l.definition) + "</div>" : "") +
      '<div class="test"><span>Placement test</span>' + esc(l.test) + "</div>" +
      '<div class="pn">' +
      (prev ? '<a class="btn" href="#/' + prev.id + '" title="Previous layer (←)">← ' + prev.id + " " + esc(prev.name) + "</a>" : "<span></span>") +
      (next ? '<a class="btn" href="#/' + next.id + '" title="Next layer (→)">' + next.id + " " + esc(next.name) + " →</a>" : "") +
      "</div></header>";
  }

  function viewLayer(l) {
    var body = l.isApps ? flowStrip(l) + industryBar(l) : "";
    return '<section class="layer" style="--h:' + HUES[l.id] + '">' + rail(l.id) +
      '<div class="layer-main">' + layerHeader(l) + body +
      '<div class="cards' + (l.isApps ? " apps" : "") + '">' + l.buckets.map(function (b, i) { return card(b, l, i, l.isApps); }).join("") + "</div>" +
      "</div></section>";
  }

  function viewBucket(l, trail) {
    var node = trail[trail.length - 1];
    var parentList = trail.length > 1 ? trail[trail.length - 2].children : l.buckets;
    var idx = parentList.indexOf(node);
    var prev = parentList[idx - 1], next = parentList[idx + 1];
    var vis = (node.companies || []).filter(function (c) { return visible(c, l); });
    var top = l.isApps ? flowStrip(l, trail[0].code) + industryBar(l) : "";
    var content = "";
    if (node.children) {
      content += '<div class="cards">' + node.children.map(function (ch, i) { return card(ch, l, i); }).join("") + "</div>";
    }
    if (vis.length) content += '<div class="tiles">' + vis.map(function (c, i) { return tile(c, l, i); }).join("") + "</div>";
    if (node.concepts) content += '<div class="concept-panel"><h4>Also in this bucket</h4>' + concepts(node.concepts) + "</div>";
    content += emptyNote(node, l);
    if (!node.children && !vis.length && !node.concepts && !emptyNote(node, l)) content += '<p class="empty">No named examples yet.</p>';

    return '<section class="layer bucket" style="--h:' + HUES[l.id] + '">' + rail(l.id) +
      '<div class="layer-main">' +
      '<header class="bucket-head">' +
      '<a class="back" href="#/' + l.id + (trail.length > 1 ? "/" + encodeURIComponent(trail[trail.length - 2].code) : "") + '">← ' +
      (trail.length > 1 ? esc(trail[trail.length - 2].code + " " + trail[trail.length - 2].name) : esc(l.id + " " + l.name)) + "</a>" +
      '<div class="bh-row">' + (node.icon ? '<span class="lh-icon">' + node.icon + "</span>" : "") +
      '<span class="code xl">' + esc(node.code) + "</span><h1>" + esc(node.name) + "</h1></div>" +
      (node.desc ? '<p class="lede">' + esc(node.desc) + "</p>" : "") +
      '<div class="pn">' +
      (prev ? '<a class="btn" href="#/' + l.id + "/" + encodeURIComponent(prev.code) + '">← ' + esc(prev.code + " " + prev.name) + "</a>" : "<span></span>") +
      (next ? '<a class="btn" href="#/' + l.id + "/" + encodeURIComponent(next.code) + '">' + esc(next.code + " " + next.name) + " →</a>" : "") +
      "</div></header>" + top + content +
      "</div></section>";
  }

  function viewMissing() {
    return '<section class="missing"><h1>Lost in the stack</h1><p>That page does not exist.</p><a class="btn primary" href="#/">Back to the stack</a></section>';
  }

  /* ---------- routing ---------- */
  function parse() {
    var h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var q = "";
    var qi = h.indexOf("?");
    if (qi >= 0) { q = h.slice(qi + 1); h = h.slice(0, qi); }
    var parts = h.split("/").filter(Boolean);
    var hl = (q.match(/hl=([^&]*)/) || [])[1];
    return { layer: parts[0], bucket: parts[1], hl: hl ? decodeURIComponent(hl) : null };
  }

  var lastKey = null;
  function render(opts) {
    var r = parse();
    var html, crumbs = [{ t: "Stack", h: "#/" }], l = r.layer && layerById(r.layer);
    if (!r.layer) html = viewHome();
    else if (!l) html = viewMissing();
    else {
      crumbs.push({ t: l.id + " " + l.name, h: "#/" + l.id });
      if (r.bucket) {
        var trail = findNode(l.buckets, r.bucket, []);
        if (!trail) html = viewMissing();
        else {
          trail.forEach(function (n) { crumbs.push({ t: n.code + " " + n.name, h: "#/" + l.id + "/" + encodeURIComponent(n.code) }); });
          html = viewBucket(l, trail);
        }
      } else html = viewLayer(l);
    }
    var key = (r.layer || "") + "/" + (r.bucket || "");
    var canMorph = document.startViewTransition && !reduceMotion;
    // Without the View Transitions API, fake the "list slides into the sidebar" move with a CSS animation.
    var slideIn = !canMorph && lastKey === "/" && !!r.layer;
    var swap = function () {
      app.innerHTML = html;
      app.classList.toggle("slide-in", slideIn);
      $("#crumbs").innerHTML = crumbs.map(function (c, i) {
        return i === crumbs.length - 1 ? '<span aria-current="page">' + esc(c.t) + "</span>" : '<a href="' + c.h + '">' + esc(c.t) + "</a><i>/</i>";
      }).join("");
      document.documentElement.style.setProperty("--h", l ? HUES[l.id] : 10);
      document.title = (l ? l.id + " " + l.name + " · " : "") + "AI Stack";
      wire();
      revealRail();
      if (key !== lastKey && !(opts && opts.keepScroll)) window.scrollTo(0, 0);
      lastKey = key;
      if (r.hl) highlight(r.hl);
    };
    if (opts && opts.keepScroll) { var y = window.scrollY; swap(); window.scrollTo(0, y); return; }
    if (canMorph && key !== lastKey) document.startViewTransition(swap);
    else swap();
  }

  function highlight(name) {
    setTimeout(function () {
      var el = $$("[data-name]").filter(function (e) { return e.getAttribute("data-name") === name; })[0];
      if (!el) return;
      el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
      el.classList.add("flash");
      setTimeout(function () { el.classList.remove("flash"); }, 2600);
    }, 350);
  }

  /* ---------- wiring after each render ---------- */
  function wire() {
    // industry filter
    $$(".fchip").forEach(function (b) {
      b.addEventListener("click", function () {
        var d = b.getAttribute("data-ind");
        if (!d) state.industries.clear();
        else if (state.industries.has(d)) state.industries.delete(d);
        else state.industries.add(d);
        render({ keepScroll: true });
      });
    });

    // home stack: peek on hover
    var wrap = $("#stackWrap"), peek = $("#peek");
    if (wrap) {
      $$(".slab").forEach(function (s) {
        var show = function () {
          var l = layerById(s.getAttribute("data-id"));
          $$(".slab").forEach(function (o) { o.classList.toggle("active", o === s); });
          if (peek.getAttribute("data-id") !== l.id) {
            peek.setAttribute("data-id", l.id);
            peek.innerHTML = peekHtml(l);
          }
        };
        s.addEventListener("mouseenter", show);
        s.addEventListener("focus", show);
      });
      var first = $('.slab[data-id="L10"]'); if (first) first.classList.add("active");
      countUp();
    }
    $$('[data-open="rules"]').forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); openDrawer(); }); });
  }

  function countUp() {
    if (reduceMotion) return;
    $$("[data-count]").forEach(function (el) {
      var end = +el.getAttribute("data-count"), t0 = performance.now();
      (function step(t) {
        var p = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(end * e);
        if (p < 1) requestAnimationFrame(step);
      })(t0);
    });
  }

  /* ---------- drawer (rules + tags) ---------- */
  function openPanel(html) {
    $("#drawerBody").innerHTML = html;
    document.body.classList.add("drawer-open");
    $("#drawer").setAttribute("aria-hidden", "false");
    var first = $("#drawerBody input, #drawerBody select"); if (first) setTimeout(function () { first.focus({ preventScroll: true }); }, 50);
  }
  function openDrawer() {
    openPanel(
      '<h2>How the taxonomy works</h2><p class="muted">' + esc(T.mece) + "</p>" +
      '<h3>Five classification rules</h3><ol class="rules">' + T.rules.map(function (r) { return "<li><b>" + esc(r[0]) + "</b> " + esc(r[1]) + "</li>"; }).join("") + "</ol>" +
      '<h3>Filter tags</h3><p class="muted">Every product carries these tags; filter on them within a bucket. This site lets you filter L10 by F1 Industry.</p>' +
      '<table class="tags"><tbody>' + T.filterTags.map(function (t) { return "<tr><th><span class=\"code\">" + t[0] + "</span>" + esc(t[1]) + "</th><td>" + esc(t[2]) + "</td></tr>"; }).join("") + "</tbody></table>" +
      '<h3>Reading the chips</h3><ul class="legend">' +
      '<li><span class="chip demo"><span class="av" style="--av:#007577">AB</span><span class="cn">Name</span></span>' + " opens the company's LinkedIn page. A few companies link to their website instead, and a company without a confirmed page opens a LinkedIn search.</li>" +
      '<li>Coloured dots on L10 chips are F1 Industry tags.</li>' +
      "</ul>" +
      '<p class="muted small">Company names are illustrative and reflect the landscape as of roughly mid-2026.</p>');
  }
  function closeDrawer() { document.body.classList.remove("drawer-open"); $("#drawer").setAttribute("aria-hidden", "true"); }

  /* ---------- search ---------- */
  var index = [];
  function buildIndex() {
    index = [];
    T.layers.forEach(function (l) {
      index.push({ kind: "layer", label: l.id + " " + l.name, sub: l.tagline, href: "#/" + l.id, h: HUES[l.id] });
      (function walk(nodes, path) {
        (nodes || []).forEach(function (n) {
          var p = path.concat([n.code + " " + n.name]);
          index.push({ kind: "bucket", label: n.code + " " + n.name, sub: l.id + " · " + p.slice(0, -1).join(" › "), href: "#/" + l.id + "/" + encodeURIComponent(n.code), h: HUES[l.id] });
          (n.companies || []).forEach(function (c) {
            index.push({ kind: "company", c: c, label: c.name, sub: (c.of ? "by " + c.of + " · " : "") + l.id + " › " + p.join(" › "), href: "#/" + l.id + "/" + encodeURIComponent(n.code) + "?hl=" + encodeURIComponent(c.name), h: HUES[l.id] });
          });
          walk(n.children, p);
        });
      })(l.buckets, []);
    });
  }
  var sel = 0, results = [];
  function runSearch() {
    var q = $("#searchInput").value.trim().toLowerCase();
    if (!q) { results = index.filter(function (r) { return r.kind === "layer"; }).reverse(); }
    else {
      results = index.filter(function (r) {
        return (r.label + " " + (r.c && r.c.of || "")).toLowerCase().indexOf(q) >= 0;
      }).sort(function (a, b) {
        var as = a.label.toLowerCase().indexOf(q) === 0 ? 0 : 1, bs = b.label.toLowerCase().indexOf(q) === 0 ? 0 : 1;
        return as - bs || (a.kind === "company" ? 0 : 1) - (b.kind === "company" ? 0 : 1);
      }).slice(0, 40);
    }
    sel = 0;
    $("#searchResults").innerHTML = results.length ? results.map(function (r, i) {
      return '<a class="sr' + (i === sel ? " sel" : "") + '" href="' + r.href + '" style="--h:' + r.h + '"><span class="sr-kind">' + r.kind + "</span><span class=\"sr-main\"><b>" + esc(r.label) + "</b><small>" + esc(r.sub) + "</small></span></a>";
    }).join("") : '<p class="empty">Nothing matches “' + esc(q) + "”.</p>";
  }
  function moveSel(d) {
    var items = $$(".sr"); if (!items.length) return;
    sel = (sel + d + items.length) % items.length;
    items.forEach(function (el, i) { el.classList.toggle("sel", i === sel); });
    items[sel].scrollIntoView({ block: "nearest" });
  }
  function openSearch() {
    document.body.classList.add("search-open");
    $("#search").setAttribute("aria-hidden", "false");
    $("#searchInput").value = ""; runSearch();
    setTimeout(function () { $("#searchInput").focus(); }, 30);
  }
  function closeSearch() { document.body.classList.remove("search-open"); $("#search").setAttribute("aria-hidden", "true"); }

  /* ---------- global controls ---------- */
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }
  function setTheme(t) { document.documentElement.setAttribute("data-theme", t); save("theme", t); $("#themeBtn").textContent = t === "dark" ? "☀" : "☾"; }
  setTheme(store("theme", window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  $("#themeBtn").addEventListener("click", function () { setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); });

  $("#rulesBtn").addEventListener("click", openDrawer);
  $("#drawerClose").addEventListener("click", closeDrawer);
  $("#scrim").addEventListener("click", closeDrawer);
  $("#searchBtn").addEventListener("click", openSearch);
  $("#search").addEventListener("click", function (e) { if (e.target.id === "search") closeSearch(); });
  $("#searchInput").addEventListener("input", runSearch);
  $("#searchInput").addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); moveSel(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveSel(-1); }
    else if (e.key === "Enter") { var a = $$(".sr")[sel]; if (a) { location.hash = a.getAttribute("href"); closeSearch(); } }
  });
  $("#searchResults").addEventListener("click", function (e) { if (e.target.closest(".sr")) closeSearch(); });

  document.addEventListener("keydown", function (e) {
    var typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (e.key === "Escape") {
      if (document.body.classList.contains("search-open")) return closeSearch();
      if (document.body.classList.contains("drawer-open")) return closeDrawer();
      var back = $(".back"); if (back) { location.hash = back.getAttribute("href"); return; }
      if (parse().layer) location.hash = "#/";
      return;
    }
    if (typing) return;
    if (e.key === "/" || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k")) { e.preventDefault(); openSearch(); return; }
    var r = parse(), l = r.layer && layerById(r.layer);
    if (l && !r.bucket && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
      var n = T.layers[T.layers.indexOf(l) + (e.key === "ArrowRight" ? 1 : -1)];
      if (n) location.hash = "#/" + n.id;
    }
  });


  // On phones, hand LinkedIn links to the LinkedIn app when it is installed.
  // Android: an intent URL opens the app, or falls back to the web page if it is missing.
  // iOS: LinkedIn's universal links only open the app reliably when followed in the same tab.
  var UA = navigator.userAgent || "";
  var isAndroid = /Android/i.test(UA);
  var isIOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  document.addEventListener("click", function (e) {
    if (!isAndroid && !isIOS) return;
    var a = e.target.closest && e.target.closest('a[href^="https://www.linkedin.com/"]');
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var href = a.href;
    if (isAndroid && /linkedin\.com\/company\//.test(href)) {
      e.preventDefault();
      location.href = "intent://" + href.replace(/^https:\/\//, "") + "#Intent;scheme=https;package=com.linkedin.android;S.browser_fallback_url=" + encodeURIComponent(href) + ";end";
    } else if (isIOS) {
      e.preventDefault();
      location.href = href;
    }
  });

  // Keep the active layer visible in the sidebar when it scrolls sideways (phones, tablets).
  function revealRail() {
    var on = $(".rail-item.on"), rail = $(".rail");
    if (on && rail && rail.scrollWidth > rail.clientWidth) rail.scrollLeft = on.offsetLeft - rail.clientWidth / 2 + on.offsetWidth / 2;
  }

  window.addEventListener("hashchange", function () { render(); });
  buildIndex();
  render();
})();
  </script>
</body>
</html>
