<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Landscape</title>
  <meta name="description" content="An interactive map of the AI industry: 11 layers from power plants to applications, with the companies in each bucket.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2323407C'/><text x='50' y='66' font-family='Arial' font-weight='700' font-size='46' fill='white' text-anchor='middle'>AI</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* ===== Tokens =====
   Style: the essay pages. IBM Plex Sans for text, IBM Plex Mono for small labels,
   a white page with navy accents, amber for warnings, thin grey lines and small radii. */
:root {
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 10px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --h: 10;
}
:root, :root[data-theme="light"] {
  --bg: #FFFFFF;            /* paper */
  --bg2: #FFFFFF;
  --panel: #FAFAF8;
  --panel-solid: #FFFFFF;
  --panel-hi: #FFFFFF;
  --line: #E3E4E0;
  --text: #171A20;          /* ink */
  --muted: #4A4F5A;         /* ink-soft */
  --chip: #F2F3F5;
  --accent: #23407C;        /* navy */
  --accent-soft: #EFF3FA;
  --accent-line: #C4D0E8;
  --accent-ink: #FFFFFF;
  --layer-from: #8A8F99;    /* L1: grey, each layer moves toward navy */
  --ember: #B7791F;         /* amber */
  --ember-soft: #FDF6E3;
  --ember-ink: #8A5A13;
  --shadow: 0 16px 40px -24px rgba(23, 26, 32, .35);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #14161B;
  --bg2: #171A20;
  --panel: #181B21;
  --panel-solid: #1A1C22;
  --panel-hi: #1D2027;
  --line: #2C3038;
  --text: #E7E9EE;
  --muted: #A3A9B5;
  --chip: #1D2027;
  --accent: #8FB0EE;
  --accent-soft: #1B2539;
  --accent-line: #34466B;
  --accent-ink: #14161B;
  --layer-from: #6B717D;
  --ember: #E0A54A;
  --ember-soft: #2A2215;
  --ember-ink: #EBC07F;
  --shadow: 0 20px 50px -20px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
/* Layer colour: one accent for every layer. */
:root { --lc: var(--accent); }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--text);
  font: 15px/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
  transition: background .4s var(--ease), color .4s var(--ease);
}
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4 { font-family: var(--display); letter-spacing: -.02em; margin: 0; font-weight: 700; }
kbd {
  font: 600 11px var(--font); padding: 2px 6px; border-radius: 6px;
  background: var(--chip); border: 1px solid var(--line); color: var(--muted);
}
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ===== Background (static, subtle) ===== */
.bg { display: none; position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.blob {
  position: absolute; width: 50vmax; height: 50vmax; border-radius: 50%;
  filter: blur(100px); opacity: var(--blob-a);
  transition: background 1.2s var(--ease);
}
.b1 { background: var(--lc); top: -22vmax; left: -14vmax; }
.b2 { background: var(--lc); bottom: -26vmax; right: -16vmax; }
.b3 { display: none; }
.grid { display: none; }

/* ===== Top bar ===== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 24px;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 17px; white-space: nowrap; }
.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: var(--accent-soft); }
.brand b { color: var(--accent); }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); overflow: hidden; white-space: nowrap; }
.crumbs a:hover { color: var(--text); }
.crumbs i { font-style: normal; opacity: .4; }
.crumbs span { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.actions { display: flex; gap: 8px; }

/* List | Treemap switch (same on index.html and treemap.html) */
.view-switch { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
.view-switch a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 6px; font: 500 13px var(--font); color: var(--muted); }
.view-switch a:hover { color: var(--text); }
.view-switch a.on { background: var(--accent-soft); color: var(--accent); }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 8px;
  font: 500 13px var(--font); color: var(--text);
  background: var(--panel); border: 1px solid var(--line);
  cursor: pointer; transition: transform .25s var(--spring), background .2s, border-color .2s;
}
.btn:hover { background: var(--panel-hi); border-color: color-mix(in srgb, var(--lc) 45%, transparent); }
.btn.icon { padding: 8px 11px; min-width: 38px; justify-content: center; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 85%, var(--text)); }

/* ===== Home ===== */
main { outline: none; }
.home { max-width: 1240px; margin: 0 auto; padding: 48px 24px 80px; }
.hero { max-width: 820px; animation: rise .5s var(--ease) both; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.hero h1 { font-size: clamp(34px, 5vw, 56px); line-height: 1.05; }
.grad { color: var(--accent); }
.brand-mark { color: var(--accent-ink); background: var(--accent) !important; font: 700 13px var(--font); }
.lede { color: var(--muted); font-size: 17px; max-width: 760px; margin: 16px 0 0; }
.lede a { color: var(--accent); border-bottom: 1px solid var(--accent-line); }
.lede a:hover { border-bottom-color: var(--accent); }
.stats { display: flex; gap: 36px; margin-top: 28px; flex-wrap: wrap; }
.stats div { display: flex; flex-direction: column; }
.stats b { font: 700 30px var(--display); }
.stats span { color: var(--muted); font-size: 13px; }

/* home: the stack as a crowding graph */
.stack-graph { margin-top: 40px; }
.stack-label.top { margin-top: 0; }
.home .crowd-row { grid-template-columns: 300px minmax(0, 1fr) 44px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.home .crowd-cells { height: 28px; }
.home .crowd-name { display: flex; align-items: baseline; gap: 10px; white-space: normal; }
.home .crowd-name b { flex: none; width: 36px; }
.home .crowd-name span { min-width: 0; font-weight: 600; }
.home .crowd-name small { display: block; margin-top: 1px; font-size: 12px; font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home .crowd-name:hover span { color: var(--accent); }
@keyframes fadeIn { from { opacity: 0; } }
.mece {
  display: flex; gap: 14px; align-items: flex-start;
  margin-top: 56px; padding: 18px 22px; border-radius: 8px;
  background: var(--panel); border: 1px dashed var(--line);
}
.mece p { margin: 0; color: var(--muted); }
.mece a { color: var(--accent); font-weight: 600; }

/* ===== Layer & bucket views ===== */
.layer { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 32px; max-width: 1400px; margin: 0 auto; padding: 30px 24px 90px; }
.rail-wrap { position: sticky; top: 84px; align-self: start; }
.rail { display: flex; flex-direction: column; gap: 5px; }
.rail-toggle { display: none; }
.rail-item {
  view-transition-class: lyr;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--muted);
  transition: background .2s, color .2s;
}
.rail-item b { font-family: var(--display); width: 30px; flex: none; font-weight: 600; color: inherit; }
.rail-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-item:hover { background: var(--chip); color: var(--text); }
.rail-item.on { background: var(--tint, var(--accent-soft)); color: var(--accent); font-weight: 600; }

.layer-head, .bucket-head { position: relative; padding: 10px 0 26px; animation: rise .4s var(--ease) both; }
.watermark { display: none; }
.lh-row, .bh-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.layer-head h1, .bucket-head h1 { font-size: clamp(30px, 4vw, 48px); line-height: 1.05; }
.layer-head .eyebrow { margin-bottom: 4px; }
.pn-links { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; }
.pn-links a { min-width: 0; max-width: 48%; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .15s; }
.pn-links a:hover { color: var(--accent); }
.pn-links .pn-next { margin-left: auto; text-align: right; }
.pn-links.top { display: none; margin: 0 0 18px; }   /* phones only, where the layer list is folded away */
.pn-hint { align-self: center; font-size: 12px; color: var(--muted); }
.placement { margin-top: 14px; max-width: 760px; font-size: 14px; }
.placement summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.placement p { margin: 8px 0 0; padding-left: 14px; border-left: 2px solid var(--line); color: var(--text); }
.pn-links.bottom { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); }
.code {
  display: inline-flex; font-family: var(--mono) !important; align-items: center; justify-content: center;
  font: 700 12px var(--display); padding: 3px 8px; border-radius: 8px;
  color: var(--lc); background: color-mix(in srgb, var(--lc) 15%, transparent);
  white-space: nowrap;
}
.code.xl { font-size: 20px; padding: 6px 14px; border-radius: 8px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.tile.flash { animation: flash 2.4s var(--ease); }
@keyframes flash {
  0%, 60% { background: var(--accent-soft); box-shadow: 0 0 0 4px var(--accent-soft); }
  100% { background: transparent; box-shadow: 0 0 0 4px transparent; }
}
.catlist { max-width: 820px; margin-top: 8px; border-top: 1px solid var(--line); }
.catrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 4px; border-bottom: 1px solid var(--line); color: var(--text); }
.catrow b { display: block; font-size: 16px; font-weight: 600; color: var(--accent); }
.catrow small { display: block; margin-top: 2px; font-size: 14px; color: var(--muted); }
.catrow .go { color: var(--muted); transition: transform .2s var(--ease), color .2s; }
.catrow:hover { background: var(--tint, transparent); }
.catrow:hover .go { transform: translateX(3px); color: var(--accent); }
.catrow.dim { opacity: .4; }
.catrow.subrow { padding: 9px 4px 9px 24px; }
.catrow.subrow b { font-size: 15px; font-weight: 500; }
.catrow:has(+ .subrow) { border-bottom: 0; padding-bottom: 6px; }
.catrow .arch-label { margin-bottom: 1px; }
.concepts { display: flex; flex-wrap: wrap; gap: 6px; }
.concept { font-size: 12px; padding: 3px 9px; border-radius: 8px; color: var(--muted); border: 1px dashed var(--line); }
.empty { color: var(--muted); font-size: 13px; font-style: italic; margin: 0; }

/* company list (bucket view): one text link per line, in columns */
/* bucket view: one company per row in a single column, sorted A to Z */
.tiles { max-width: 820px; margin-top: 18px; }
.tile { position: relative; padding: 12px 8px; border-bottom: 1px solid var(--line); border-radius: 4px; transition: background .15s; }
/* the whole row opens the company (same as its name); Website and LinkedIn stay separate links on top */
.tile:has(a.t-name):hover { background: var(--tint, var(--chip)); }
.tile a.t-name::after { content: ""; position: absolute; inset: 0; border-radius: 4px; }
.t-head { line-height: 1.5; }
.t-name { font: 600 15px/1.5 var(--font); color: var(--accent); border-bottom: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); transition: border-color .15s; }
.t-name:hover { border-bottom-color: var(--accent); }
.t-name.plain { color: var(--text); border-bottom: 0; }
.t-of, .t-ind { font-size: 13px; color: var(--muted); }
.t-desc { margin: 3px 0 0; font-size: 14px; line-height: 1.5; color: var(--text); }
.t-links { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.t-links a { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); transition: color .15s; }
.t-links a:hover { color: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.concept-panel { margin-top: 22px; padding: 16px; border-radius: 8px; border: 1px dashed var(--line); }
.concept-panel h4 { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }

/* Applications layer: industry filter, archetype labels, see-also links */
.ind-select { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 18px; }
.ind-select span { font: 600 13px var(--font); color: var(--muted); }
.ind-select select { font: 500 14px var(--font); color: var(--text); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; padding: 7px 30px 7px 10px; cursor: pointer; }
.ind-select select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.arch-label { display: block; margin-bottom: 2px; font: 500 12px var(--font); color: var(--muted); }
.see-also { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.see-also a { color: var(--accent); border-bottom: 1px solid var(--accent-line); }
.see-also a:hover { border-bottom-color: var(--accent); }

/* ===== Layer colour groups =====
   Five pastel hues, one per group of layers (checked with the data-viz colour checker for
   colour-blind separation in light and dark mode). Text and links never use them. */
[data-hue="peach"] { --hue: #E8915A; }
[data-hue="lilac"] { --hue: #9B83D8; }
[data-hue="mint"]  { --hue: #4FB58E; }
[data-hue="sky"]   { --hue: #5B95DE; }
[data-hue="rose"]  { --hue: #DE7396; }
:root[data-theme="dark"] [data-hue="peach"] { --hue: #CC7A47; }
:root[data-theme="dark"] [data-hue="lilac"] { --hue: #9580D5; }
:root[data-theme="dark"] [data-hue="mint"]  { --hue: #3A9C77; }
:root[data-theme="dark"] [data-hue="sky"]   { --hue: #5891DA; }
:root[data-theme="dark"] [data-hue="rose"]  { --hue: #C9628A; }
[data-hue] {
  --tint: color-mix(in srgb, var(--hue) 14%, var(--bg));
  --g0: color-mix(in srgb, var(--hue) 22%, var(--bg)); --g1: color-mix(in srgb, var(--hue) 40%, var(--bg));
  --g2: color-mix(in srgb, var(--hue) 58%, var(--bg)); --g3: color-mix(in srgb, var(--hue) 78%, var(--bg)); --g4: var(--hue);
}
.gdot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--hue, var(--accent)); vertical-align: 1px; }

/* ===== Crowding ===== */
:root { --crowd-0: color-mix(in srgb, var(--accent) 14%, var(--bg)); --crowd-1: color-mix(in srgb, var(--accent) 32%, var(--bg));
  --crowd-2: color-mix(in srgb, var(--accent) 52%, var(--bg)); --crowd-3: color-mix(in srgb, var(--accent) 74%, var(--bg)); --crowd-4: var(--accent); }
.crowd-cells { display: flex; gap: 2px; height: 22px; min-width: 0; }
.crowd-cell { min-width: 3px; border-radius: 3px; transition: outline-color .1s; outline: 2px solid transparent; outline-offset: 1px; }
.crowd-cell:hover, .crowd-cell:focus-visible { outline-color: var(--text); }
.crowd-cell.s0 { background: var(--g0, var(--crowd-0)); }
.crowd-cell.s1 { background: var(--g1, var(--crowd-1)); }
.crowd-cell.s2 { background: var(--g2, var(--crowd-2)); }
.crowd-cell.s3 { background: var(--g3, var(--crowd-3)); }
.crowd-cell.s4 { background: var(--g4, var(--crowd-4)); }
.crowd-one { max-width: 820px; margin: 4px 0 26px; }
.crowd-title { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.crowd-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.crowd-more { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--accent); }
.crowd-more:hover { text-decoration: underline; text-underline-offset: 3px; }
.crowd-all { margin-top: 16px; }
.crowd-row { display: grid; grid-template-columns: 240px minmax(0, 1fr) 44px; align-items: center; gap: 14px; padding: 6px 0; }
.crowd-name { font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crowd-name b { display: inline-block; width: 34px; color: var(--accent); }
.crowd-name:hover { color: var(--accent); }
.crowd-total { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.crowd-tip { position: fixed; z-index: 70; pointer-events: none; padding: 5px 9px; border-radius: 6px; font-size: 12px; color: var(--text); background: var(--panel-solid); border: 1px solid var(--line); box-shadow: var(--shadow); opacity: 0; transition: opacity .1s; white-space: nowrap; }
.crowd-tip.on { opacity: 1; }

/* ===== Drawer ===== */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 40;
  width: min(560px, 100vw);
  background: var(--bg2); border-left: 1px solid var(--line);
  box-shadow: -30px 0 60px -20px rgba(0, 0, 0, .5);
  transform: translateX(105%); transition: transform .5s var(--ease);
  overflow-y: auto;
}
.drawer-open .drawer { transform: none; }
.drawer-inner { position: relative; padding: 32px 28px 60px; }
.drawer .close { position: absolute; right: 20px; top: 22px; }
.drawer h2 { font-size: 26px; margin-bottom: 8px; padding-right: 50px; }
.drawer h3 { font-size: 17px; margin: 28px 0 10px; }
.rules { padding-left: 20px; margin: 0; display: grid; gap: 10px; }
.rules li::marker { color: var(--accent); font-weight: 700; }
.tags { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tags th { text-align: left; white-space: nowrap; padding: 8px 12px 8px 0; vertical-align: top; font-weight: 600; }
.tags th .code { margin-right: 8px; min-width: 38px; }
.tags td { padding: 8px 0; color: var(--muted); border-bottom: 1px solid var(--line); }
.tags th { border-bottom: 1px solid var(--line); }
.legend { padding-left: 18px; display: grid; gap: 10px; font-size: 14px; color: var(--muted); }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(5, 5, 15, .45); opacity: 0; pointer-events: none; transition: opacity .4s; }
.drawer-open .scrim { opacity: 1; pointer-events: auto; }

/* ===== Search ===== */
.search {
  position: fixed; inset: 0; z-index: 50;
  display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 0;
  background: rgba(5, 5, 15, .5); backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.search-open .search { opacity: 1; pointer-events: auto; }
.search-box {
  width: min(640px, 100%); border-radius: 8px; overflow: hidden;
  background: var(--bg2); border: 1px solid var(--line); box-shadow: var(--shadow);
  transform: translateY(-14px) scale(.97); transition: transform .35s var(--spring);
}
.search-open .search-box { transform: none; }
#searchInput { width: 100%; padding: 20px 22px; font: 500 18px var(--font); color: var(--text); background: transparent; border: 0; border-bottom: 1px solid var(--line); outline: none; }
.search-results { max-height: 52vh; overflow-y: auto; padding: 8px; }
.search-results .empty { padding: 14px; }
.sr { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; }
.sr.sel, .sr:hover { background: color-mix(in srgb, var(--lc) 16%, transparent); }
.sr-kind { flex-shrink: 0; font-size: 12px; width: 64px; color: var(--lc); font-weight: 700; }
.sr-main { display: flex; flex-direction: column; min-width: 0; }
.sr-main small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-hint { padding: 10px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: center; }

/* ===== Toast & misc ===== */
.toast {
  position: fixed; bottom: 24px; left: 50%; z-index: 60;
  padding: 10px 18px; border-radius: 8px; font-size: 14px;
  background: var(--panel-solid); border: 1px solid var(--line); box-shadow: var(--shadow);

  <script>
/* Turns window.TAXONOMY_DATA (from data.js) into window.TAXONOMY for the app below. */
(function () {
  "use strict";

  // "Rufus~Amazon#Retail" -> { name, slug, of, q, ind }. A leading + (older data) is ignored.
  function parseCompany(s, slugs) {
    s = String(s);
    var o = { name: "", slug: null, of: null, q: null, ind: null };
    if (s.charAt(0) === "+") s = s.slice(1);
    var parts = s.split(/(?=[@~?#])/);
    o.name = parts[0].trim();
    for (var i = 1; i < parts.length; i++) {
      var p = parts[i], v = p.slice(1).trim();
      if (p[0] === "@") o.slug = v;
      else if (p[0] === "~") o.of = v;
      else if (p[0] === "?") o.q = v;
      else if (p[0] === "#") o.ind = v.split(",").map(function (x) { return x.trim(); });
    }
    if (!o.slug) o.slug = slugs[o.name] || (o.of && slugs[o.of]) || null;
    return o;
  }

  function build(doc) {
    var slugs = doc.slugs || {}, profiles = doc.profiles || {};
    (function walk(nodes) {
      (nodes || []).forEach(function (n) {
        if (n.companies) n.companies = n.companies.map(function (c) {
          var o = parseCompany(c, slugs), p = profiles[o.name];
          if (p) { o.desc = p.desc || ""; o.web = p.web || ""; }
          return o;
        });
        walk(n.children);
      });
    })((doc.layers || []).reduce(function (all, l) { return all.concat(l.buckets || []); }, []));
    // The app expects these two lists as [code, name, desc] and [rule, example] rows.
    doc.filterTags = (doc.filterTags || []).map(function (f) { return [f.code, f.name, f.desc]; });
    doc.rules = (doc.rules || []).map(function (r) { return [r.rule, r.example]; });
    delete doc.slugs; delete doc.profiles;
    return doc;
  }

  if (!window.TAXONOMY_DATA) {
    document.getElementById("app").innerHTML = '<div class="load-error"><h2>The map could not load its data</h2>' +
      '<p>Make sure that <code>data.js</code> is in the same folder as <code>index.html</code>, and that it has no syntax errors. Open the browser console to see the error.</p></div>';
    return;
  }
  window.TAXONOMY = build(window.TAXONOMY_DATA);
})();
</script>
  <script>
/* AI Landscape: rendering and interaction. Data lives in data.js. */
(function () {
  "use strict";

  var T = window.TAXONOMY;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var app = $("#app");

  // Layer position (0 = bottom layer). The CSS turns it into a shade between Iron and Dark Teal.
  var HUES = {};
  T.layers.forEach(function (l, i) { HUES[l.id] = T.layers.length > 1 ? Math.round(i * 10 / (T.layers.length - 1)) : 10; });
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var state = {
    industries: new Set()
  };

  /* ---------- small helpers ---------- */
  function store(k, d) { try { var v = localStorage.getItem("aistack." + k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem("aistack." + k, v); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function linkedin(c) {
    if (c.slug && /^https?:\/\//.test(c.slug)) return c.slug; // a full link: a LinkedIn showcase page or the company website
    if (c.slug) return "https://www.linkedin.com/company/" + c.slug + "/";
    return "https://www.linkedin.com/search/results/companies/?keywords=" + encodeURIComponent(c.q || c.of || c.name);
  }
  function layerById(id) { return T.layers.filter(function (l) { return l.id === id; })[0]; }
  function findNode(nodes, code, trail) {
    for (var i = 0; i < (nodes || []).length; i++) {
      var n = nodes[i], t = trail.concat([n]);
      if (n.code === code) return t;
      var f = findNode(n.children, code, t);
      if (f) return f;
    }
    return null;
  }
  function visible(c, layer) {
    if (layer && layer.isApps && state.industries.size) {
      var ind = c.ind || ["Horizontal"];
      for (var i = 0; i < ind.length; i++) if (state.industries.has(ind[i])) return true;
      return false;
    }
    return true;
  }
  function allCompanies(node) {
    var out = (node.companies || []).slice();
    (node.children || []).forEach(function (ch) { out = out.concat(allCompanies(ch)); });
    return out;
  }
  function countVisible(node, layer) { return allCompanies(node).filter(function (c) { return visible(c, layer); }).length; }
  function layerCount(layer) { return layer.buckets.reduce(function (s, b) { return s + countVisible(b, layer); }, 0); }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }



  /* ---------- pieces ---------- */
  function byName(a, b) { return a.name.localeCompare(b.name, undefined, { sensitivity: "base" }); }

  function nodeHref(layer, node) { return "#/" + layer.id + "/" + encodeURIComponent(node.code); }
  // Bucket codes stay in the data and the address, but the page shows names only.
  function codeBadge() { return ""; }
  function nodeTitle(node) { return node.name; }
  function seeAlso(node, layer) {
    if (!node.seeAlso || !node.seeAlso.length) return "";
    return '<p class="see-also">See also: ' + node.seeAlso.map(function (x) {
      var t = findNode(layer.buckets, x.code, []), target = t && t[t.length - 1];
      return target ? '<a href="' + nodeHref(layer, target) + '">' + esc(target.name) + "</a>" + (t.length > 1 ? " in " + esc(t[0].name) : "") : "";
    }).join("; ") + "</p>";
  }

  function concepts(list) {
    if (!list || !list.length) return "";
    return '<div class="concepts">' + list.map(function (s) { return '<span class="concept">' + esc(s) + "</span>"; }).join("") + "</div>";
  }

  function emptyNote(node, layer) {
    var hasAny = allCompanies(node).length > 0;
    if (countVisible(node, layer) || (node.concepts && node.concepts.length)) return "";
    if (layer.isApps && state.industries.size && hasAny) return '<p class="empty">No examples tagged with this industry here yet.</p>';
    return "";
  }

  // Layer pages: an outline. Each category is a row; its sub-categories are indented rows below it.
  function outlineRow(node, layer, sub) {
    var off = layer.isApps && state.industries.size && !countVisible(node, layer) ? " dim" : "";
    return '<a class="catrow' + (sub ? " subrow" : "") + off + '" href="' + nodeHref(layer, node) + '"><span>' +
      (node.label && !sub ? '<span class="arch-label">' + esc(node.label) + "</span>" : "") +
      "<b>" + esc(node.name) + "</b>" + (node.desc && !sub ? "<small>" + esc(node.desc) + "</small>" : "") +
      '</span><span class="go" aria-hidden="true">→</span></a>';
  }
  function outline(layer) {
    return '<div class="catlist">' + layer.buckets.map(function (b) {
      return outlineRow(b, layer, false) + (b.children || []).map(function (ch) { return outlineRow(ch, layer, true); }).join("");
    }).join("") + "</div>";
  }

  // Bucket pages: one row per company with a short description, its website and its LinkedIn page.
  var ICON_WEB = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9s1.3-6.3 3.8-9Z"/></g></svg>';
  var ICON_IN = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm7 0h3.8v1.7h.05c.53-1 1.84-2.05 3.78-2.05 4.04 0 4.79 2.66 4.79 6.12V21h-4v-5.6c0-1.34-.02-3.06-1.86-3.06-1.87 0-2.16 1.46-2.16 2.96V21h-4V9Z"/></svg>';
  function webUrl(c) { return c.web || (c.slug && /^https?:\/\//.test(c.slug) && !/linkedin\.com/.test(c.slug) ? c.slug : ""); }
  function liUrl(c) { var u = c.slug ? linkedin(c) : ""; return /linkedin\.com/.test(u) ? u : ""; }
  function tile(c, layer, i) {
    var web = webUrl(c), li = liUrl(c), main = web || li;
    var ext = ' target="_blank" rel="noopener noreferrer"';
    var name = main ? '<a class="t-name" href="' + main + '"' + ext + ' title="' + (web ? "Opens website" : "Opens LinkedIn") + '">' + esc(c.name) + "</a>"
      : '<span class="t-name plain">' + esc(c.name) + "</span>";
    return '<div class="tile" data-name="' + esc(c.name) + '">' +
      '<div class="t-head">' + name +
      (c.of ? ' <span class="t-of">by ' + esc(c.of) + "</span>" : "") +
      (layer.isApps ? ' <span class="t-ind">· ' + esc((c.ind || ["Horizontal"]).join(", ")) + "</span>" : "") + "</div>" +
      (c.desc ? '<p class="t-desc">' + esc(c.desc) + "</p>" : "") +
      (web || li ? '<div class="t-links">' +
        (web ? '<a href="' + web + '"' + ext + ">" + ICON_WEB + "Website</a>" : "") +
        (web && li ? '<span class="t-sep" aria-hidden="true">|</span>' : "") +
        (li ? '<a href="' + li + '"' + ext + ">" + ICON_IN + "LinkedIn</a>" : "") + "</div>" : "") +
      "</div>";
  }

  function industrySelect(layer) {
    var counts = {};
    T.industries.forEach(function (d) { counts[d] = 0; });
    var all = layer.buckets.reduce(function (a, b) { return a.concat(allCompanies(b)); }, []);
    all.forEach(function (c) { (c.ind || ["Horizontal"]).forEach(function (d) { counts[d]++; }); });
    var cur = state.industries.size ? Array.from(state.industries)[0] : "";
    return '<label class="ind-select"><span>Industry</span><select data-ind-select aria-label="Filter by industry">' +
      '<option value="">All</option>' +
      T.industries.map(function (d) {
        return '<option value="' + esc(d) + '"' + (d === cur ? " selected" : "") + (counts[d] ? "" : " disabled") + ">" + esc(d) + "</option>";
      }).join("") + "</select></label>";
  }

  function rail(active) {
    var cur = layerById(active);
    return '<aside class="rail-wrap">' +
      '<button class="rail-toggle" type="button" aria-expanded="false" aria-controls="railNav">' +
      '<span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>' +
      '<span class="rail-label">Layers</span><span class="rail-current">' + (cur ? cur.id + " " + esc(cur.name) : "") + "</span></button>" +
      '<nav class="rail" id="railNav" aria-label="Layers">' + T.layers.slice().reverse().map(function (l, i) {
      return '<a href="#/' + l.id + '" class="rail-item' + (l.id === active ? " on" : "") + '" data-hue="' + l.hue + '" style="--h:' + HUES[l.id] + ";--n:" + i + ";view-transition-name:lyr-" + l.id + '" title="' + esc(l.name) + '">' +
        "<b>" + l.id + "</b><span>" + esc(l.name) + "</span></a>";
    }).join("") + "</nav></aside>";
  }

  /* ---------- views ---------- */
  // Text with links written as [words](address). Addresses can be https:// links or site links such as #/L1.
  function richText(t) {
    return esc(t).replace(/\[([^\]]+)\]\(((?:https?:\/\/|#\/)[^)\s]*)\)/g, function (m, words, href) {
      return '<a href="' + href + '"' + (/^https?:/.test(href) ? ' target="_blank" rel="noopener noreferrer"' : "") + ">" + words + "</a>";
    });
  }

  function viewHome() {
    var total = T.layers.reduce(function (s, l) { return s + layerCount(l); }, 0);
    var buckets = T.layers.reduce(function (s, l) { return s + leaves(l).length; }, 0);
    return '<section class="home">' +
      '<div class="hero">' +
      '<p class="eyebrow">First-principles map · ' + esc(T.asOf) + (T.author ? " · " + esc(T.author) : "") + "</p>" +
      "<h1>AI Companies <span class=\"grad\">Landscape</span></h1>" +
      '<p class="lede">' + richText(T.overview) + "</p>" +
      '<div class="stats"><div><b data-count="' + T.layers.length + '">' + T.layers.length + '</b><span>layers</span></div><div><b data-count="' + buckets + '">' + buckets + "</b><span>buckets</span></div><div><b data-count=\"" + total + "\">" + total + "</b><span>products &amp; companies</span></div></div>" +
      "</div>" + stackGraph() +
      '<div class="mece"><p>' + esc(T.mece) + ' <a href="#" data-open="rules">See the five classification rules →</a></p></div>' +
      "</section>";
  }


  // Previous / next links, shown as a quiet row at the top and again at the bottom of a page.
  function pnLinks(prevHref, prevText, nextHref, nextText, where) {
    if (!prevHref && !nextHref) return "";
    return '<nav class="pn-links ' + where + '" aria-label="Previous and next">' +
      (prevHref ? '<a href="' + prevHref + '" title="Previous (←)">← ' + esc(prevText) + "</a>" : "<span></span>") +
      (where === "bottom" ? '<span class="pn-hint">Tip: use the ← and → keys</span>' : "") +
      (nextHref ? '<a class="pn-next" href="' + nextHref + '" title="Next (→)">' + esc(nextText) + " →</a>" : "") + "</nav>";
  }
  function layerPn(l, where) {
    var idx = T.layers.indexOf(l), prev = T.layers[idx - 1], next = T.layers[idx + 1];
    return pnLinks(prev && "#/" + prev.id, prev && prev.id + " " + prev.name, next && "#/" + next.id, next && next.id + " " + next.name, where);
  }

  function layerHeader(l, crumbExtra) {
    return '<header class="layer-head">' + layerPn(l, "top") +
      '<span class="watermark">' + l.id + "</span>" +
      '<div class="lh-row"><div><p class="eyebrow"><i class="gdot" aria-hidden="true"></i>Layer ' + l.id.slice(1) + " of " + T.layers.length + "</p><h1>" + esc(l.name) + "</h1></div></div>" +
      '<p class="lede">' + esc(l.definition || l.tagline) + "</p>" +
      '<details class="placement"><summary>How products are placed here</summary><p>' + esc(l.test) + "</p></details>" +
      "</header>";
  }

  /* ---------- crowding: how many companies sit in each bucket ---------- */
  // Five steps of one hue (sequential): more companies = darker in light mode, brighter in dark mode.
  var CROWD_BINS = [[1, 6], [7, 10], [11, 14], [15, 20], [21, Infinity]];
  function crowdBin(n) { for (var i = 0; i < CROWD_BINS.length; i++) if (n <= CROWD_BINS[i][1]) return i; return CROWD_BINS.length - 1; }
  function leaves(l) {
    var out = [];
    (function walk(nodes) { (nodes || []).forEach(function (n) { if (n.children) walk(n.children); else out.push(n); }); })(l.buckets);
    return out;
  }
  function crowdCells(l) {
    return '<div class="crowd-cells" data-hue="' + l.hue + '">' + leaves(l).map(function (b) {
      var n = (b.companies || []).length;
      return '<a class="crowd-cell s' + crowdBin(n) + '" style="flex:' + Math.max(n, 1) + '" href="' + nodeHref(l, b) + '" data-tip="' + esc(b.name + ": " + n + (n === 1 ? " company" : " companies")) + '" aria-label="' + esc(b.name + ", " + n + " companies") + '"></a>';
    }).join("") + "</div>";
  }
  function layerCrowd(l) {
    return '<div class="crowd crowd-one"><p class="crowd-title">How crowded each part of this layer is</p>' + crowdCells(l) +
      '<a class="crowd-more" href="#/">Compare all layers →</a></div>';
  }
  // Home: the stack drawn as a crowding graph. Select a layer name to open the layer, or a block to open the bucket.
  function stackGraph() {
    var stack = T.layers.filter(function (x) { return !x.isApps; }), lastStack = stack[stack.length - 1];
    var rows = T.layers.slice().reverse().map(function (l) {
      var total = leaves(l).reduce(function (s, b) { return s + (b.companies || []).length; }, 0);
      return (l.isApps ? '<p class="stack-label top">Applications · what users buy</p>' : "") +
        (l === lastStack ? '<p class="stack-label">Enabling stack · ' + T.layers[0].id + " to " + lastStack.id + " · what builders buy</p>" : "") +
        '<div class="crowd-row"><a class="crowd-name" href="#/' + l.id + '"><b>' + l.id + "</b><span>" + esc(l.name) + "<small>" + esc(l.tagline) + "</small></span></a>" +
        crowdCells(l) + '<span class="crowd-total" title="' + total + ' companies">' + total + "</span></div>";
    }).join("");
    return '<div class="stack-graph">' +
      '<div class="crowd crowd-all">' + rows + "</div>" +
      '<p class="crowd-note">Wider blocks have more companies. These are examples, not the full market.</p>' +
      "</div>";
  }

  function viewLayer(l) {
    var body = l.isApps ? industrySelect(l) : "";
    return '<section class="layer" data-hue="' + l.hue + '" style="--h:' + HUES[l.id] + '">' + rail(l.id) +
      '<div class="layer-main">' + layerHeader(l) + layerCrowd(l) + body +
      outline(l) +
      layerPn(l, "bottom") + "</div></section>";
  }

  function viewBucket(l, trail) {
    var node = trail[trail.length - 1];
    var parentList = trail.length > 1 ? trail[trail.length - 2].children : l.buckets;
    var idx = parentList.indexOf(node);
    var prev = parentList[idx - 1], next = parentList[idx + 1];
    var pn = function (where) {
      return pnLinks(prev && "#/" + l.id + "/" + encodeURIComponent(prev.code), prev && nodeTitle(prev, l),
        next && "#/" + l.id + "/" + encodeURIComponent(next.code), next && nodeTitle(next, l), where);
    };
    var vis = (node.companies || []).filter(function (c) { return visible(c, l); }).sort(byName);
    var top = l.isApps ? industrySelect(l) : "";
    var content = "";
    if (node.children) {
      content += '<div class="catlist">' + node.children.map(function (ch) {
        var off = l.isApps && state.industries.size && !countVisible(ch, l) ? " dim" : "";
        return '<a class="catrow' + off + '" href="' + nodeHref(l, ch) + '"><span><b>' + esc(ch.name) + "</b>" +
          (ch.desc ? "<small>" + esc(ch.desc) + "</small>" : "") + '</span><span class="go" aria-hidden="true">→</span></a>';
      }).join("") + "</div>";
    }
    if (vis.length) content += '<div class="tiles">' + vis.map(function (c, i) { return tile(c, l, i); }).join("") + "</div>";
    if (node.concepts) content += '<div class="concept-panel"><h4>Also covers</h4>' + concepts(node.concepts) + "</div>";
    content += emptyNote(node, l);
    if (!node.children && !vis.length && !node.concepts && !emptyNote(node, l)) content += '<p class="empty">No named examples yet.</p>';

    return '<section class="layer bucket" data-hue="' + l.hue + '" style="--h:' + HUES[l.id] + '">' + rail(l.id) +
      '<div class="layer-main">' +
      '<header class="bucket-head">' + pn("top") +
      '<div class="bh-row">' +
      codeBadge(node, l, "xl") + '<div><p class="eyebrow"><i class="gdot" aria-hidden="true"></i>' + esc(l.id + " " + l.name) + (node.label ? " · " + esc(node.label) : "") + "</p><h1>" + esc(node.name) + "</h1></div></div>" +
      (node.desc ? '<p class="lede">' + esc(node.desc) + "</p>" : "") + seeAlso(node, l) +
      "</header>" + top + content + pn("bottom") +
      "</div></section>";
  }

  function viewMissing() {
    return '<section class="missing"><h1>Page not found</h1><p>That page does not exist.</p><a class="btn primary" href="#/">Back to all layers</a></section>';
  }

  /* ---------- routing ---------- */
  function parse() {
    var h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var q = "";
    var qi = h.indexOf("?");
    if (qi >= 0) { q = h.slice(qi + 1); h = h.slice(0, qi); }
    var parts = h.split("/").filter(Boolean);
    var hl = (q.match(/hl=([^&]*)/) || [])[1];
    var ind = (q.match(/ind=([^&]*)/) || [])[1];
    return { layer: parts[0], bucket: parts[1], hl: hl ? decodeURIComponent(hl) : null, ind: ind ? decodeURIComponent(ind) : null };
  }

  var lastKey = null;
  function render(opts) {
    var r = parse();
    if (r.ind && T.industries.indexOf(r.ind) >= 0) state.industries = new Set([r.ind]);
    var html, crumbs = [{ t: "Layers", h: "#/" }], l = r.layer && layerById(r.layer);
    if (!r.layer) html = viewHome();
    else if (r.layer === "crowding") { location.replace("#/"); return; } // the crowding graph now lives on the home page
    else if (!l) html = viewMissing();
    else {
      crumbs.push({ t: l.id + " " + l.name, h: "#/" + l.id });
      if (r.bucket) {
        var trail = findNode(l.buckets, r.bucket, []);
        if (!trail) {
          var moved = findOld(l.buckets, r.bucket);
          if (moved) { location.replace("#/" + l.id + "/" + encodeURIComponent(moved.code)); return; }
          html = viewMissing();
        }
        else {
          trail.forEach(function (n) { crumbs.push({ t: nodeTitle(n, l), h: "#/" + l.id + "/" + encodeURIComponent(n.code) }); });
          html = viewBucket(l, trail);
        }
      } else html = viewLayer(l);
    }
    var key = (r.layer || "") + "/" + (r.bucket || "");
    var canMorph = false; // page-change animation turned off: it could briefly show the previous page
    // Without the View Transitions API, fake the "list slides into the sidebar" move with a CSS animation.
    var slideIn = false;
    var swap = function () {
      app.innerHTML = html;
      app.classList.toggle("slide-in", slideIn);
      $("#crumbs").innerHTML = crumbs.map(function (c, i) {
        return i === crumbs.length - 1 ? '<span aria-current="page">' + esc(c.t) + "</span>" : '<a href="' + c.h + '">' + esc(c.t) + "</a><i>/</i>";
      }).join("");
      document.documentElement.style.setProperty("--h", l ? HUES[l.id] : 10);
      document.title = (l ? l.id + " " + l.name + " · " : "") + "AI Landscape";
      wire();
      // The switch opens the same place in the treemap (same address after the #, without the filter).
      $("#toTreemap").setAttribute("href", "treemap.html" + (l ? "#/" + l.id + (r.bucket ? "/" + encodeURIComponent(r.bucket) : "") : ""));
      // Keep the industry filter in the address so a filtered view can be shared.
      if (l && l.isApps) {
        var base = "#/" + l.id + (r.bucket ? "/" + encodeURIComponent(r.bucket) : "");
        var ind = state.industries.size ? Array.from(state.industries)[0] : "";
        var want = base + (ind ? "?ind=" + encodeURIComponent(ind) : "");
        if (!r.hl && location.hash !== want && history.replaceState) history.replaceState(null, "", want);
      }
      if (key !== lastKey && !(opts && opts.keepScroll)) window.scrollTo(0, 0);
      lastKey = key;
      if (r.hl) highlight(r.hl);
    };
    if (opts && opts.keepScroll) { var y = window.scrollY; swap(); window.scrollTo(0, y); return; }
    if (canMorph && key !== lastKey) document.startViewTransition(swap);
    else swap();
  }

  // An old address (for example #/L11/A1.1·a) finds the bucket that now holds that code.
  function findOld(nodes, code) {
    for (var i = 0; i < (nodes || []).length; i++) {
      var n = nodes[i];
      if (n.was === code || (n.wasAlso || []).indexOf(code) >= 0) return n;
      var hit = findOld(n.children, code); if (hit) return hit;
    }
    return null;
  }

  function highlight(name) {
    setTimeout(function () {
      var el = $$("[data-name]").filter(function (e) { return e.getAttribute("data-name") === name; })[0];
      if (!el) return;
      el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
      el.classList.add("flash");
      setTimeout(function () { el.classList.remove("flash"); }, 2600);
    }, 350);
  }

  /* ---------- wiring after each render ---------- */
  function wire() {
    // industry filter (applications layer)
    $$("[data-ind-select]").forEach(function (sel) {
      sel.addEventListener("change", function () {
        state.industries = new Set(sel.value ? [sel.value] : []);
        var r = parse(), base = "#/" + r.layer + (r.bucket ? "/" + encodeURIComponent(r.bucket) : "");
        if (history.replaceState) history.replaceState(null, "", base + (sel.value ? "?ind=" + encodeURIComponent(sel.value) : ""));
        render({ keepScroll: true });
      });
    });

    if ($(".home")) countUp();
    $$('[data-open="rules"]').forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); openDrawer(); }); });
  }

  function countUp() {
    if (reduceMotion) return;
    $$("[data-count]").forEach(function (el) {
      var end = +el.getAttribute("data-count"), t0 = performance.now();
      (function step(t) {
        var p = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(end * e);
        if (p < 1) requestAnimationFrame(step);
      })(t0);
    });
  }

  /* ---------- drawer (rules + tags) ---------- */
  function openPanel(html) {
    $("#drawerBody").innerHTML = html;
    document.body.classList.add("drawer-open");
    $("#drawer").setAttribute("aria-hidden", "false");
    var first = $("#drawerBody input, #drawerBody select"); if (first) setTimeout(function () { first.focus({ preventScroll: true }); }, 50);
  }
  function openDrawer() {
    var appsId = (T.layers.filter(function (l) { return l.isApps; })[0] || {}).id || "the applications layer";
    openPanel(
      '<h2>How the taxonomy works</h2><p class="muted">' + esc(T.mece) + "</p>" +
      '<h3>Five classification rules</h3><ol class="rules">' + T.rules.map(function (r) { return "<li><b>" + esc(r[0]) + "</b> " + esc(r[1]) + "</li>"; }).join("") + "</ol>" +
      '<h3>Filter tags</h3><p class="muted">Every product carries these tags; filter on them within a bucket. This site lets you filter ' + appsId + " by F1 Industry.</p>" +
      '<table class="tags"><tbody>' + T.filterTags.map(function (t) { return "<tr><th><span class=\"code\">" + t[0] + "</span>" + esc(t[1]) + "</th><td>" + esc(t[2]) + "</td></tr>"; }).join("") + "</tbody></table>" +
      '<h3>Finding companies</h3><ul class="legend">' +
      "<li>Layer pages list categories only. Open a category to see its companies, each with a short description and links to its website and LinkedIn page.</li>" +
      "<li>Search finds any company or category directly.</li>" +
      "</ul>" +
      '<p class="muted small">Company names are illustrative and reflect the landscape as of roughly mid-2026.</p>');
  }
  function closeDrawer() { document.body.classList.remove("drawer-open"); $("#drawer").setAttribute("aria-hidden", "true"); }

  /* ---------- search ---------- */
  var index = [];
  function buildIndex() {
    index = [];
    T.layers.forEach(function (l) {
      index.push({ kind: "layer", label: l.id + " " + l.name, sub: l.tagline, href: "#/" + l.id, h: HUES[l.id], hue: l.hue });
      (function walk(nodes, path) {
        (nodes || []).forEach(function (n) {
          var p = path.concat([nodeTitle(n, l)]);
          index.push({ kind: "bucket", label: nodeTitle(n, l), sub: l.id + " · " + p.slice(0, -1).join(" › "), href: "#/" + l.id + "/" + encodeURIComponent(n.code), h: HUES[l.id], hue: l.hue });
          (n.companies || []).forEach(function (c) {
            index.push({ kind: "company", c: c, label: c.name, sub: (c.of ? "by " + c.of + " · " : "") + l.id + " › " + p.join(" › "), href: "#/" + l.id + "/" + encodeURIComponent(n.code) + "?hl=" + encodeURIComponent(c.name), h: HUES[l.id], hue: l.hue });
          });
          walk(n.children, p);
        });
      })(l.buckets, []);
    });
  }
  var sel = 0, results = [];
  function runSearch() {
    var q = $("#searchInput").value.trim().toLowerCase();
    if (!q) { results = index.filter(function (r) { return r.kind === "layer"; }).reverse(); }
    else {
      results = index.filter(function (r) {
        return (r.label + " " + (r.c && r.c.of || "")).toLowerCase().indexOf(q) >= 0;
      }).sort(function (a, b) {
        var as = a.label.toLowerCase().indexOf(q) === 0 ? 0 : 1, bs = b.label.toLowerCase().indexOf(q) === 0 ? 0 : 1;
        return as - bs || (a.kind === "company" ? 0 : 1) - (b.kind === "company" ? 0 : 1);
      }).slice(0, 40);
    }
    sel = 0;
    $("#searchResults").innerHTML = results.length ? results.map(function (r, i) {
      return '<a class="sr' + (i === sel ? " sel" : "") + '" href="' + r.href + '" style="--h:' + r.h + '"' + (r.hue ? ' data-hue="' + r.hue + '"' : "") + '><span class="sr-kind">' + (r.hue ? '<i class="gdot" aria-hidden="true"></i>' : "") + r.kind + "</span><span class=\"sr-main\"><b>" + esc(r.label) + "</b><small>" + esc(r.sub) + "</small></span></a>";
    }).join("") : '<p class="empty">Nothing matches “' + esc(q) + "”.</p>";
  }
  function moveSel(d) {
    var items = $$(".sr"); if (!items.length) return;
    sel = (sel + d + items.length) % items.length;
    items.forEach(function (el, i) { el.classList.toggle("sel", i === sel); });
    items[sel].scrollIntoView({ block: "nearest" });
  }
  function openSearch() {
    document.body.classList.add("search-open");
    $("#search").setAttribute("aria-hidden", "false");
    $("#searchInput").value = ""; runSearch();
    setTimeout(function () { $("#searchInput").focus(); }, 30);
  }
  function closeSearch() { document.body.classList.remove("search-open"); $("#search").setAttribute("aria-hidden", "true"); }

  /* ---------- global controls ---------- */
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }
  var SUN_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>';
  var MOON_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>';
  function setTheme(t) { document.documentElement.setAttribute("data-theme", t); save("theme", t); $("#themeBtn").innerHTML = t === "dark" ? SUN_SVG : MOON_SVG; }
  setTheme(store("theme", window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  $("#themeBtn").addEventListener("click", function () { setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); });

  $("#rulesBtn").addEventListener("click", openDrawer);
  $("#drawerClose").addEventListener("click", closeDrawer);
  $("#scrim").addEventListener("click", closeDrawer);
  $("#searchBtn").addEventListener("click", openSearch);
  $("#search").addEventListener("click", function (e) { if (e.target.id === "search") closeSearch(); });
  $("#searchInput").addEventListener("input", runSearch);
  $("#searchInput").addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); moveSel(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveSel(-1); }
    else if (e.key === "Enter") { var a = $$(".sr")[sel]; if (a) { location.hash = a.getAttribute("href"); closeSearch(); } }
  });
  $("#searchResults").addEventListener("click", function (e) { if (e.target.closest(".sr")) closeSearch(); });

  function r0() { return parse(); }
  document.addEventListener("keydown", function (e) {
    var typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (e.key === "Escape") {
      var rw = $(".rail-wrap.open"); if (rw) { setRail(false); $(".rail-toggle").focus(); return; }
      if (document.body.classList.contains("search-open")) return closeSearch();
      if (document.body.classList.contains("drawer-open")) return closeDrawer();
      var crumbsUp = $$("#crumbs a"); if (r0().bucket && crumbsUp.length) { location.hash = crumbsUp[crumbsUp.length - 1].getAttribute("href"); return; }
      if (parse().layer) location.hash = "#/";
      return;
    }
    if (typing) return;
    if (e.key === "/" || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k")) { e.preventDefault(); openSearch(); return; }
    var r = parse(), l = r.layer && layerById(r.layer);
    if (l && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
      // Follow the page's own previous / next links (layers on a layer page, sibling buckets on a bucket page).
      var a = e.key === "ArrowRight" ? $(".pn-links .pn-next") : $(".pn-links a:not(.pn-next)");
      if (a) location.hash = a.getAttribute("href");
    }
  });


  // On phones, hand LinkedIn links to the LinkedIn app when it is installed.
  // Android: an intent URL opens the app, or falls back to the web page if it is missing.
  // iOS: LinkedIn's universal links only open the app reliably when followed in the same tab.
  var UA = navigator.userAgent || "";
  var isAndroid = /Android/i.test(UA);
  var isIOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  document.addEventListener("click", function (e) {
    if (!isAndroid && !isIOS) return;
    var a = e.target.closest && e.target.closest('a[href^="https://www.linkedin.com/"]');
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var href = a.href;
    if (isAndroid && /linkedin\.com\/company\//.test(href)) {
      e.preventDefault();
      location.href = "intent://" + href.replace(/^https:\/\//, "") + "#Intent;scheme=https;package=com.linkedin.android;S.browser_fallback_url=" + encodeURIComponent(href) + ";end";
    } else if (isIOS) {
      e.preventDefault();
      location.href = href;
    }
  });

  // Small screens: the layer list is a menu bar. Tap the bar to open or close it.
  function setRail(open) {
    var w = $(".rail-wrap"); if (!w) return;
    w.classList.toggle("open", open);
    $(".rail-toggle", w).setAttribute("aria-expanded", open ? "true" : "false");
  }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest(".rail-toggle")) setRail(!$(".rail-wrap").classList.contains("open"));
  });

  // Tooltip for crowding blocks (mouse and keyboard focus).
  (function () {
    var tip = $("#crowdTip");
    function show(el, x, y) { tip.textContent = el.getAttribute("data-tip"); tip.style.left = Math.min(x + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (y + 14) + "px"; tip.classList.add("on"); }
    document.addEventListener("mousemove", function (e) { var c = e.target.closest && e.target.closest(".crowd-cell"); if (c) show(c, e.clientX, e.clientY); else tip.classList.remove("on"); });
    document.addEventListener("focusin", function (e) { var c = e.target.closest && e.target.closest(".crowd-cell"); if (c) { var r = c.getBoundingClientRect(); show(c, r.left, r.bottom); } });
    document.addEventListener("focusout", function () { tip.classList.remove("on"); });
  })();

  window.addEventListener("hashchange", function () { render(); });
  buildIndex();
  render();
})();
  </script>
</body>
