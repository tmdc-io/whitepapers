<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DataOS Vulcan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a contents rail on the left, one module at a time on the right. */
/* Design language shared with the DataOS Certification course: Bricolage Grotesque headings, Hanken Grotesk text, JetBrains Mono labels and code, teal accent, dark code blocks. */
:root{
  --paper:#ffffff; --bg:#ffffff; --surface:#ffffff; --panel:#f4f1ee; --sunk:#ede9e5; --code:#f4f1ee;
  --ink:#242422; --muted:#4f504c; --line:#dcd6d0;
  --accent:#009293; --accent-ink:#ffffff; --accent-soft:#e3f6f4; --link-line:#9fd3cd; --brand:#54ded1;
  --primary:#202f36; --primary-ink:#ffffff;
  --amber:#733635; --amber-tint:#f8e9e6; --ember:#a33a2f;
  --ok:#2d7a4f; --ok-soft:#e6f2ea; --warn:#9a6a12; --warn-soft:#f7efdc; --bad:#a33a2f; --bad-soft:#f8e9e6;
  --info:#009293; --info-soft:#e3f6f4; --idle:#7a7b76;
  --bronze:#ede9e5; --silver:#f4f1ee; --gold:#e3f6f4; --sem:#cdeeea;
  --code-bg:#202f36; --code-fg:#e8efef;
  --hl-kw:#54ded1; --hl-str:#f0c987; --hl-num:#f2a07b; --hl-com:#8aa3a8; --hl-key:#9fd0ff; --hl-fn:#c8b6ff; --hl-type:#9fd0ff;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Hanken Grotesk", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --label:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151c1f; --bg:#151c1f; --surface:#151c1f; --panel:#1c2528; --sunk:#243034; --code:#1c2528;
  --ink:#ecebe7; --muted:#c3c4bf; --line:#33413f;
  --accent:#54ded1; --accent-ink:#0f1619; --accent-soft:#173a3a; --link-line:#2e6e6c; --brand:#54ded1;
  --primary:#54ded1; --primary-ink:#0f1619;
  --amber:#e09a95; --amber-tint:#3a1f1b; --ember:#f19a8e;
  --ok:#7fd3a0; --ok-soft:#173528; --warn:#e8c172; --warn-soft:#3a2f14; --bad:#f19a8e; --bad-soft:#3a1f1b;
  --info:#54ded1; --info-soft:#173a3a; --idle:#8f918b;
  --bronze:#243034; --silver:#1c2528; --gold:#173a3a; --sem:#1f4a48;
  --code-bg:#0d1315; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151c1f; --bg:#151c1f; --surface:#151c1f; --panel:#1c2528; --sunk:#243034; --code:#1c2528;
  --ink:#ecebe7; --muted:#c3c4bf; --line:#33413f;
  --accent:#54ded1; --accent-ink:#0f1619; --accent-soft:#173a3a; --link-line:#2e6e6c; --brand:#54ded1;
  --primary:#54ded1; --primary-ink:#0f1619;
  --amber:#e09a95; --amber-tint:#3a1f1b; --ember:#f19a8e;
  --ok:#7fd3a0; --ok-soft:#173528; --warn:#e8c172; --warn-soft:#3a2f14; --bad:#f19a8e; --bad-soft:#3a1f1b;
  --info:#54ded1; --info-soft:#173a3a; --idle:#8f918b;
  --bronze:#243034; --silver:#1c2528; --gold:#173a3a; --sem:#1f4a48;
  --code-bg:#0d1315; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-padding-top:82px}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,3.6vw,40px);font-weight:700}
h1 .accent{color:var(--accent)}
h2{font-size:26px;font-weight:700;color:var(--ink)}
h3{font-size:17px;font-weight:700}
h4{font-size:14.5px;font-weight:600}
p{margin:0}
strong,b{font-weight:600}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--link-line)}
a:hover{border-bottom-color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.88em}
:not(pre)>code{background:var(--sunk);padding:0 4px;border-radius:3px;overflow-wrap:anywhere}
p,li,dd,td,legend,label{overflow-wrap:break-word}
pre{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--code-bg);border:0;border-radius:8px;padding:16px 18px;margin:0;overflow-x:auto;white-space:pre;color:var(--code-fg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* syntax colors */
.hljs-keyword,.hljs-selector-tag,.hljs-operator{color:var(--hl-kw);font-weight:600}
.hljs-literal{color:var(--hl-num)}
.hljs-string,.hljs-regexp{color:var(--hl-str)}
.hljs-number{color:var(--hl-num)}
.hljs-comment,.hljs-quote{color:var(--hl-com);font-style:italic}
.hljs-attr,.hljs-attribute,.hljs-property,.hljs-symbol{color:var(--hl-key)}
.hljs-built_in,.hljs-title,.hljs-title.function_,.hljs-section{color:var(--hl-fn)}
.hljs-meta,.hljs-decorator{color:var(--hl-key)}
.hljs-type,.hljs-params{color:var(--hl-type)}
.hljs-variable,.hljs-template-variable,.hljs-subst{color:var(--hl-num)}
.hljs-bullet,.hljs-punctuation{color:var(--hl-com)}
.csv-h{font-weight:600;color:var(--hl-key)} .csv-c0{color:var(--code-fg)} .csv-c1{color:var(--hl-str)} .csv-c2{color:var(--hl-fn)} .csv-c3{color:var(--hl-type)} .csv-sep{color:var(--hl-com)}

/* top bar, shared with the DataOS Certification course */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{max-width:1240px;margin:0 auto;padding-inline:max(16px, env(safe-area-inset-left, 0px));display:flex;align-items:center;gap:16px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;border-bottom:none;color:var(--ink);font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap}
.brand-mark{width:26px;height:26px;flex:none;fill:currentColor}
.crumbs{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--idle);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumbs a{color:var(--muted);border-bottom:none}
.crumbs a:hover{color:var(--accent)}
.top .spacer{flex:1}
.top .btn,.brand{white-space:nowrap}
.docs .sm{display:none}
.btn.ghost{border-color:transparent;background:transparent}
.top a.btn{color:var(--ink);text-decoration:none}
@media (max-width:560px){
  .crumbs{display:none}
  .top .wrap{gap:8px}
  .top .btn{padding-inline:10px}
  .brand{font-size:16px;gap:8px}
  .docs .lg,.top .sync{display:none}
  .docs .sm{display:inline}
}
@media (max-width:380px){.brand-name{display:none}}
.app{max-width:1240px;margin:0 auto;padding-inline:max(16px, env(safe-area-inset-left, 0px));display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;min-height:100vh}
.rail{position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);z-index:4;overflow-y:auto;overscroll-behavior:contain;padding:28px 4px 24px 0;display:flex;flex-direction:column;gap:14px}
.toc-title{font-family:var(--label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--idle);padding:0 10px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;border-bottom:none;color:var(--muted);font-size:14px;line-height:1.35}
.nav a:hover{background:var(--panel);color:var(--muted)}
.nav a .num{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px}
.nav a.active{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav a.seen .num{background:var(--accent);border-color:var(--accent);color:#fff}
.nav .subs{display:flex;flex-direction:column}
.nav a.sub{padding-left:38px;font-size:12.5px;font-weight:400}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}

main{padding-block:28px 88px;min-width:0}
.module{max-width:780px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--label);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.subtitle{font-family:var(--label);font-size:14px;color:var(--muted);margin-top:-12px}
.lede{font-size:17px;color:var(--muted);max-width:68ch}
.prose{max-width:72ch;display:flex;flex-direction:column;gap:10px}
.prose ul,.prose ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.concept{display:flex;flex-direction:column;gap:12px}
.concept>h3{font-size:20px;padding-top:14px}
.term{font-weight:600}
.callout{border-left:3px solid var(--amber);background:var(--amber-tint);padding:9px 13px;border-radius:0 6px 6px 0;max-width:78ch;font-size:14.5px}
.callout>b:first-child{font-family:var(--label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-right:6px;font-weight:600}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)} .callout.warn>b:first-child{color:var(--warn)}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)} .callout.bad>b:first-child{color:var(--bad)}
.bench{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.bench.flat{background:none;border:0;border-radius:0;padding:0}
.bench.try{border-left:3px solid var(--brand);padding-left:18px}
.bench.try>.bench-head>h3{padding-top:0}
.bench.try>.bench-head>h3::before{content:"Try it";display:inline-block;font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--brand);color:#242422;padding:2px 8px;border-radius:999px;margin-right:10px;vertical-align:3px}
.bench.flat>.bench-head>h3{font-size:20px;padding-top:14px}
.bench-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.bench-head .tag{font-family:var(--label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:14px}
.cols>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 15px;border-radius:999px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.1);color:var(--primary-ink)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:3px 10px;border-radius:999px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--label);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.idle{background:var(--sunk);color:var(--muted)}
.next{display:flex;justify-content:flex-end}
.next-bottom{padding-top:8px}
/* A result that changed after the reader used a control: a light pastel lavender layer over the block,
   above its own backgrounds, for 1.5 s, then a 0.25 s fade. Multiply keeps the text dark and readable. */
.flash-layer{position:absolute;pointer-events:none;z-index:60;border-radius:var(--r);background:#F6F3FE;mix-blend-mode:multiply;opacity:0;transition:opacity .25s ease}
.flash-layer.on{opacity:.9}
.flash-layer.off{opacity:0;transition:opacity .25s ease}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flash-layer{background:#B9A8F0;mix-blend-mode:normal}:root:not([data-theme="light"]) .flash-layer.on{opacity:.1}}
:root[data-theme="dark"] .flash-layer{background:#B9A8F0;mix-blend-mode:normal}:root[data-theme="dark"] .flash-layer.on{opacity:.1}
@media (prefers-reduced-motion: reduce){.flash-layer,.flash-layer.off{transition:none}}
.mod-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mod-top .btn{padding:4px 12px;font-size:13px}
input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
textarea{font-family:var(--mono);font-size:12.5px;width:100%;resize:vertical;line-height:1.5;background:var(--code)}
label{font-size:13px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-family:var(--label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:8px 12px;border-bottom:1.5px solid var(--ink);color:var(--ink);font-weight:600;white-space:nowrap}
td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:0}
tr.new td{background:var(--ok-soft)} tr.chg td{background:var(--warn-soft)} tr.gone td{background:var(--bad-soft);color:var(--muted)}
td.badcell{color:var(--bad);font-weight:600;background:var(--bad-soft)}
td.okcell{color:var(--ok)}
.grid-in td{padding:2px 3px} .grid-in th{padding:6px 6px} .grid-in input{width:100%;min-width:64px;font-family:var(--mono);font-size:12px;padding:3px 5px;border-radius:4px}
.log{font-family:var(--mono);font-size:12px;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:70px;max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.log .ok{color:var(--ok)} .log .bad{color:var(--bad)} .log .warn{color:var(--warn)} .log .muted{color:var(--muted)}
.notice{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.notice .who{font-family:var(--label);font-size:11px;letter-spacing:.04em;color:var(--muted)}
.notice.bad{border-left:3px solid var(--bad)}
.notice.ok,.notice.bad{position:relative;padding-right:42px}
.notice.ok::after,.notice.bad::after{position:absolute;top:9px;right:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;line-height:1;color:var(--paper)}
.notice.ok::after{content:"✓";background:var(--ok)}
.notice.bad::after{content:"✕";background:var(--bad)} .notice.ok{border-left:3px solid var(--ok)} .notice.warn{border-left:3px solid var(--warn)} .notice.info{border-left:3px solid var(--info)} .notice.idle{border-left:3px solid var(--idle);color:var(--muted)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:7px 12px;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted)}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.quiz{border-left:3px solid var(--amber);padding-left:18px;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.quiz .quiz-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qpill{display:inline-block;font-family:var(--label);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--amber);color:var(--paper);padding:2px 8px;border-radius:999px}
.qdots{display:flex;gap:6px;margin-left:auto}
.qdots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.qdots i.cur{background:var(--accent)} .qdots i.ok{background:var(--ok)} .qdots i.bad{background:var(--bad)}
.qmeta{font-family:var(--label);font-size:12px;color:var(--muted)}
.qresult{display:flex;flex-direction:column;gap:4px}
.qbig{font-size:28px;font-weight:700;color:var(--accent)}
.q .opt input:disabled{cursor:default}
.quiz-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.quiz-head h3{font-size:20px;color:var(--accent)}
.q{display:flex;flex-direction:column;gap:6px}
.q{border:0;margin:0;padding:0;min-width:0}
.q legend{font-weight:600;padding:0;margin-bottom:6px}
.q .opts{display:flex;flex-direction:column;gap:2px}
.q .opt{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:4px 8px;border-radius:6px;font-size:14px;color:var(--ink)}
.q .opt input{accent-color:var(--accent);margin:3px 0 0;flex:none;width:15px;height:15px;cursor:pointer}
.q .opt:hover{background:var(--sunk)}
.q .opt.right{background:var(--ok-soft)} .q .opt.right input{accent-color:var(--ok)}
.q .opt.wrong{background:var(--bad-soft)} .q .opt.wrong input{accent-color:var(--bad)}
.q .why{font-size:14px;color:var(--muted);font-style:italic}
.readmore{display:flex;flex-direction:column;gap:8px}
.readmore .lbl{font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.readmore ul{list-style:disc;margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.readmore li::marker{color:var(--accent)}
.fig{display:flex;flex-direction:column;gap:6px;margin:0}
.fig svg{display:block}
.fig figcaption{font-size:13px;color:var(--muted)}
.fig svg text,svg text{font-family:var(--body)}
.svgwrap{overflow-x:auto}
.fbox{stroke:var(--line);stroke-width:1.5}
.fbox.acc{stroke:var(--accent);stroke-width:1.75}
.ft{fill:var(--ink);font-size:13px;font-weight:600}
.fs{fill:var(--muted);font-size:10.5px;font-family:var(--label)}
.fc{fill:var(--muted);font-size:11.5px}
.fa{stroke:var(--idle);stroke-width:1.5;fill:none}
.fal{fill:var(--muted);font-size:10.5px;font-family:var(--label);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.fbound{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.fbl{fill:var(--amber);font-size:10px;font-family:var(--label);letter-spacing:.1em;font-weight:600}
.dag-node{cursor:pointer}
.dag-node rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.dag-node text{fill:var(--ink);font-size:13px}
.dag-node .k{fill:var(--muted);font-size:10px;font-family:var(--label);letter-spacing:.04em}
.dag-node .ord{fill:var(--accent-ink);font-size:11px;font-family:var(--label);font-weight:600}
.dag-node .ordbg{fill:var(--accent);stroke:none}
.dag-node.sel rect{stroke:var(--accent);stroke-width:2.5}
.dag-node.s-bad rect{fill:var(--bad-soft);stroke:var(--bad)}
.dag-node.s-ok rect{fill:var(--ok-soft);stroke:var(--ok)}
.dag-node.s-warn rect{fill:var(--warn-soft);stroke:var(--warn)}
.dag-node.s-info rect{fill:var(--info-soft);stroke:var(--info)}
.dag-node.s-idle rect{fill:var(--sunk);stroke:var(--idle);stroke-dasharray:4 3}
.dag-node.s-new rect{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:6 3}
.dag-edge{stroke:var(--idle);stroke-width:1.5;fill:none}

<script>
/* =================== shared data =================== */
const STORES={S1:"Harbor",S2:"Market",S3:"Station"};
const PRODUCTS=[["Latte",4.5],["Espresso",3.0],["Cappuccino",4.2],["Croissant",3.5]];
const DAYS=["2026-10-01","2026-10-02","2026-10-03","2026-10-04","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10"];
function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
const MEMBERS=Array.from({length:12},(_,k)=>({customer_id:k+1,tier:k%3===0?"gold":"silver"}));
function tierOn(cid,day){if(cid===7)return day>="2026-10-05"?"gold":"silver";return MEMBERS[cid-1].tier}
const ORDERS=(()=>{const r=rng(7),out=[];let id=1000;DAYS.slice(0,8).forEach(d=>{Object.keys(STORES).forEach(st=>{const n=6+Math.floor(r()*5);for(let i=0;i<n;i++){const p=PRODUCTS[Math.floor(r()*4)];const c=1+Math.floor(r()*12);out.push({order_id:id++,store_id:st,customer_id:c,product:p[0],amount:p[1],status:r()<.9?"completed":"refunded",order_date:d,loyalty_tier:tierOn(c,d)})}})});return out})();

"models/silver/orders.sql":{node:"orders",text:`MODEL (
  name bean_internal.orders,
  kind INCREMENTAL_BY_TIME_RANGE (
    time_column order_date
  ),
  start '2026-10-01',
  cron '@daily',
  grains (order_id),
  description 'Clean orders, one row for each order.',
  signals (
    pos_day_closed()
  ),
  assertions (
    not_null(columns := (order_id, amount)),
    accepted_range(column := amount, min_v := 0, max_v := 100)
  )
);

SELECT
  order_id,
  store_id,
  customer_id,
  product,
  amount,
  status,
  order_date
FROM raw.pos_orders
WHERE order_date BETWEEN @start_ds AND @end_ds`,
 explain:["The <code>MODEL</code> block tells Vulcan how to build the table. The <code>SELECT</code> tells Vulcan what goes in the table. You write only the logic of this one step.","<code>INCREMENTAL_BY_TIME_RANGE</code> means that each run adds only the days that are missing. Module 6 shows this.","<code>signals</code> makes Vulcan wait until all stores closed the day in the POS system. Module 5 shows this.","The <span class='term'>assertions</span> are rules that every row must obey. A coffee order of more than 100 is not real. If a row breaks a rule, Vulcan does not build the gold models.","In a model, the list can have the name <code>assertions</code> or <code>audits</code>. Both names do the same thing. Use one of them in a model, not both.","Vulcan replaces <code>@start_ds</code> and <code>@end_ds</code> with the first and the last day that it processes."]},

"models/gold/daily_sales.sql":{node:"daily_sales",text:`MODEL (
  name bean_street.daily_sales,
  kind FULL,
  cron '@daily',
  grains (store_id, product, order_date, status, loyalty_tier),
  description 'Sales for each store, product, day, status and loyalty tier.',
  column_mask_expressions (
    loyalty_tier = 'hidden'
  )
);

SELECT
  o.store_id,
  s.store_name,
  o.product,
  o.order_date,
  o.status,
  c.tier AS loyalty_tier,
  SUM(o.amount) AS revenue,
  COUNT(*) AS order_count
FROM bean_internal.orders AS o
JOIN bean_internal.stores AS s
  ON o.store_id = s.store_id
LEFT JOIN bean_internal.customers AS c
  ON o.customer_id = c.customer_id
  AND o.order_date >= c.valid_from
  AND (o.order_date < c.valid_to OR c.valid_to IS NULL)
GROUP BY 1, 2, 3, 4, 5, 6`,
 explain:["This is the only physical table that consumers use. It is in the <code>bean_street</code> schema. The silver tables are in <code>bean_internal</code>.","<code>FULL</code> means that Vulcan builds the full table again on each run. This is correct for a small summary table.","The model reads three silver tables. Vulcan finds them in the <code>FROM</code> and <code>JOIN</code> clauses, and it builds this model after all three. You do not write the order.","The join on <code>valid_from</code> and <code>valid_to</code> finds the tier on the day of the order, not the tier of today.","<code>column_mask_expressions</code> tells Vulcan how to hide <code>loyalty_tier</code> for a group that must not see it. Module 12 shows this."]},

"signals/__init__.py":{node:"orders",text:`import typing as t
from vulcan import signal, DatetimeRanges, ExecutionContext


@signal()
def pos_day_closed(
    batch: DatetimeRanges, context: ExecutionContext
) -> t.Union[bool, DatetimeRanges]:
    # Each store writes one row to raw.pos_closures when it closes the day.
    rows = context.engine_adapter.fetchall(
        "SELECT closed_date FROM raw.pos_closures "
        "GROUP BY closed_date HAVING COUNT(*) = 3"
    )
    closed = {row[0] for row in rows}
    # Give back only the days that all three stores closed.
    return [(start, end) for start, end in batch if start.date() in closed]`,
 explain:["A <span class='term'>signal</span> is a Python function that tells Vulcan which days are ready to build.","Vulcan gives the function a batch of missing days. The function gives back <code>True</code> (all ready), <code>False</code> (none ready), or a list of the ready days.","This signal makes the orders model wait until all three stores closed the day. Module 5 shows this."]},
"plugins/auth_ext.py":{node:null,text:`from schema.auth import AuthExtensionContext, SecurityContext

STORE_TAG = "bean:store:"


async def resolve_user_groups(ctx: AuthExtensionContext) -> SecurityContext:
    tags = set(ctx.user_tags)

    if "bean:finance" in tags:
        return SecurityContext(group="finance")

    stores = [t[len(STORE_TAG):] for t in tags if t.startswith(STORE_TAG)]
    if stores:
        return SecurityContext(group="store_manager", store_id=stores[0])

    if "bean:partner" in tags:
        return SecurityContext(group="partner")

    # No group: the policy gives no access.
    return SecurityContext(group="")`,
 explain:["The <span class='term'>auth extension</span> is your Python function that tells Vulcan who the API user is.","It gets the user ID, the tags of the user and the request headers. It gives back a group and, if necessary, more values such as <code>store_id</code>.","The access policy uses the group and the values. Module 12 shows this."]},

depends_on:

  - group: partner
    mask:
      - loyalty_tier`,
 explain:["An <span class='term'>access policy</span> tells Vulcan which group can see which rows and columns of a model.","Finance sees all rows. A store manager sees only the rows of the store in the security context. A partner sees all rows, but <code>loyalty_tier</code> is hidden.","A group that is not in the list gets no access."]},

function drawGraph(el,g,{states={},sel=null,onPick=null,labels={},order={}}={}){

  let s=`<svg viewBox="0 0 ${g.W} ${g.H}" width="100%" style="min-width:${Math.min(g.W,740)}px" role="img" aria-label="Model dependency graph">${ARROW}`;

function flow(nodes,{labels=[],w=150,gap=46,caption="",boundary=null,boundaryLabel="CONSUMER BOUNDARY"}={}){
  const LL=labels.map(t=>{if(!t)return[];if(t.length<=12)return[t];const ws=t.split(" ");let best=[t],bw=1e9;for(let j=1;j<ws.length;j++){const a=ws.slice(0,j).join(" "),b=ws.slice(j).join(" ");const m=Math.max(a.length,b.length);if(m<bw){bw=m;best=[a,b]}}return best});
  gap=Math.max(gap,...LL.map(ls=>ls.length?Math.max(...ls.map(x=>x.length))*6.6+18:0));
  const hasCap=nodes.some(n=>n.cap);const H=(hasCap?118:74)+(boundary!==null?18:0),W=nodes.length*w+(nodes.length-1)*gap+8;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,700)}px" role="img" aria-label="${esc(caption)}">${ARROW}`;
  nodes.forEach((n,k)=>{const x=4+k*(w+gap);
    s+=`<rect class="fbox${n.tone==="accent"?" acc":""}" x="${x}" y="12" width="${w}" height="54" rx="8" fill="${TONE[n.tone||"plain"]}"/><text class="ft" x="${x+w/2}" y="35" text-anchor="middle">${esc(n.t)}</text>`;
    if(n.s)s+=`<text class="fs" x="${x+w/2}" y="53" text-anchor="middle">${esc(n.s)}</text>`;
    if(n.cap)n.cap.split("\n").forEach((line,j)=>{s+=`<text class="fc" x="${x+w/2}" y="${86+j*14}" text-anchor="middle">${esc(line)}</text>`});
    if(boundary===k){const bx=x+w+gap/2;s+=`<line class="fbound" x1="${bx}" y1="4" x2="${bx}" y2="${H-20}"/><text class="fbl" x="${bx}" y="${H-6}" text-anchor="middle">${boundaryLabel}</text>`}
    if(k<nodes.length-1){s+=`<path class="fa" d="M${x+w+2},39 L${x+w+gap-3},39" marker-end="url(#ar)"/>`;(LL[k]||[]).forEach((line,j)=>{s+=`<text class="fal" x="${x+w+gap/2}" y="${(LL[k].length>1?22:31)+j*11}" text-anchor="middle">${esc(line)}</text>`})}});
  return`<figure class="fig" style="margin:0"><div class="svgwrap">${s}</svg></div>${caption?`<figcaption>${caption}</figcaption>`:""}</figure>`}

  m.append(concept("Why data products",`<div class="prose"><p>A pipeline can give a correct table. But the people who use it also need its meaning, its freshness, its access rules and its owner. In most teams, these are in different tools: a catalog, a quality tool, a governance tool and a BI tool. Each tool keeps its own copy. When a definition changes in one place, the other copies stay old. This <span class="term">drift</span> causes no error. It causes wrong answers that nobody sees, and an AI agent repeats them with confidence.</p>
   <p>A <span class="term">data product</span> removes the gap. It is one managed unit with a named owner, a published contract (schema, meaning and freshness), rules for quality and access, and named consumers. You write all these parts together, so there is nothing to keep in agreement.</p></div>`));
  m.append(concept("Where Vulcan fits",`${flow([{t:"Discover",s:"find what exists"},{t:"Design",s:"write the contract"},{t:"Build",s:"with Vulcan",tone:"accent"},{t:"Publish",s:"to DataOS"},{t:"Consume",s:"SQL, APIs, BI, agents"}],{w:150,gap:36,caption:"The journey of a data product in DataOS. Vulcan is the tool for the Build step."})}
   <div class="prose"><p>In one Vulcan project, you write the models that transform the data, the checks that examine it, the semantic models that give it business meaning, and the access rules. Vulcan reads all these files together, so it knows how each part connects to the others. It sends the SQL to your engine, for example Postgres, Snowflake, Databricks or Trino. Your data stays in your warehouse.</p></div>`));

/* ---------- 4 The graph ---------- */
function mGraph(i){
  const m=section(eb(i),"Write one step of logic. Vulcan connects the rest.");
  m.append(concept("The problem with job schedules",`<div class="prose"><p>In many tools, you write the logic of each step. Then you also write a schedule that tells the tool the order of the steps. When you add a step, you must find its correct place in the schedule. When you change a step, you must find all steps that come after it.</p><p>The schedule and the logic are in two places, so they can disagree. A step can run before its data is ready, or a change can break a step that nobody remembered.</p></div>`));
  m.append(concept("How Vulcan finds the order",`<div class="prose"><p>In Vulcan, you write one model at a time. Each model is one piece of business logic. You do not write the order.</p><p>Vulcan reads the tables in the <code>FROM</code> and <code>JOIN</code> clauses of each model. From these, it builds a <span class="term">graph</span>: a map of which table feeds which table. The tables that a model reads are its <span class="term">parents</span>. The models that read a table are its <span class="term">children</span>.</p><p>Vulcan uses the graph in two ways. First, it builds parents before children. Second, when a model changes, it finds all the models after it that must be built again.</p></div>
   ${flow([{t:"You write SQL",s:"one model"},{t:"Vulcan reads",s:"FROM and JOIN"},{t:"Graph",s:"parents, children",tone:"accent"},{t:"Run order",s:"parents first"}],{caption:"Vulcan gets the order of the steps from the SQL. You do not write it."})}
   <div class="callout">A graph cannot have a loop. If model A reads model B and model B reads model A, Vulcan shows an error.</div>`));
  const b=h(`<div class="bench flat"><div class="bench-head"><h3>Add a model</h3><span class="tag">type SQL, then click Add model</span></div>
   <div class="cols"><div class="stack">
    <div class="row"><label for="gname">Model name</label><input type="text" id="gname" style="flex:1"></div>
    <textarea id="gsql" rows="9" aria-label="Model SQL"></textarea>
    <div class="row"><button class="btn primary" id="gadd">Add model</button><button class="btn" id="gex">Show a different example</button><button class="btn" id="greset">Reset the graph</button></div>
    <div id="gmsg"></div></div>
    <div class="prose" style="font-size:14px"><p>Things to try:</p><ul><li>Add the first example. It reads <code>bean_internal.orders</code>.</li><li>Add the second example. It reads two tables.</li><li>Add the third example. It reads a gold table, so it goes one column more to the right.</li><li>Type a table that does not exist, for example <code>bean_internal.payments</code>.</li></ul></div></div>
   <div id="gg"></div></div>`);m.append(b);
  const b2=h(`<div class="bench flat" data-try="1"><div class="bench-head"><h3>Change a model and see what runs</h3><span class="tag">click a box in the graph above</span></div><div id="gimp" class="mini">Click a box in the graph to change that model.</div></div>`);m.append(b2);
  const EX=[["bean_street.top_products",`SELECT\n  product,\n  SUM(amount) AS revenue\nFROM bean_internal.orders\nWHERE status = 'completed'\nGROUP BY product`],
   ["bean_street.gold_member_sales",`SELECT\n  o.order_date,\n  SUM(o.amount) AS revenue\nFROM bean_internal.orders AS o\nJOIN bean_internal.customers AS c\n  ON o.customer_id = c.customer_id\nWHERE c.tier = 'gold'\nGROUP BY o.order_date`],
   ["bean_street.store_ranking",`SELECT\n  store_name,\n  SUM(revenue) AS revenue,\n  RANK() OVER (ORDER BY SUM(revenue) DESC) AS rank\nFROM bean_street.daily_sales\nGROUP BY store_name`]];
  const FQN={pos_orders:"raw.pos_orders",loyalty_members:"raw.loyalty_members",orders:"bean_internal.orders",customers:"bean_internal.customers",stores:"bean_internal.stores",daily_sales:"bean_street.daily_sales"};
  let exi=0;const base=()=>({nodes:DAG.nodes.filter(n=>FQN[n.id]).map(n=>({id:n.id,label:n.label,kind:n.kind,fqn:FQN[n.id]})),edges:DAG.edges.filter(([a,c])=>FQN[a]&&FQN[c]).map(e=>[...e])});
  let G=base(),added=new Set(),pick=null;
  function layout(){const depth={};const parents=id=>G.edges.filter(e=>e[1]===id).map(e=>e[0]);
    const d=id=>{if(depth[id]!==undefined)return depth[id];const p=parents(id);depth[id]=p.length?1+Math.max(...p.map(d)):0;return depth[id]};G.nodes.forEach(n=>d(n.id));
    const cols={};G.nodes.forEach(n=>{(cols[depth[n.id]]=cols[depth[n.id]]||[]).push(n)});const maxRows=Math.max(...Object.values(cols).map(c=>c.length));
    Object.entries(cols).forEach(([c,ns])=>ns.forEach((n,k)=>{n.x=20+c*200;n.y=20+k*70}));
    return{nodes:G.nodes,edges:G.edges,W:20+Object.keys(cols).length*200,H:20+maxRows*70}}
  function topo(ids){const order=[],seen=new Set();const visit=id=>{if(seen.has(id))return;seen.add(id);G.edges.filter(e=>e[1]===id&&ids.includes(e[0])).forEach(e=>visit(e[0]));order.push(id)};ids.forEach(visit);return order}
  function paint(){const g=layout();const states={},labels={},order={};added.forEach(a=>{states[a]="new"});
    if(pick){states[pick]="warn";labels[pick]="changed";topo(downstream(pick,G.edges)).forEach((d,k)=>{states[d]="info";labels[d]="runs after";order[d]=k+1})}
    drawGraph(b.querySelector("#gg"),g,{states,labels,order,sel:pick,onPick:id=>{pick=id;paint();impact()}})}
  function impact(){const ds=topo(downstream(pick,G.edges));const n=G.nodes.find(x=>x.id===pick);
    b2.querySelector("#gimp").innerHTML=ds.length?`<p>You changed <code>${esc(n.fqn)}</code>. Vulcan builds these models after it, in this order. The numbers in the graph show the same order.</p><ol>${ds.map(d=>`<li><code>${esc(G.nodes.find(x=>x.id===d).fqn)}</code></li>`).join("")}</ol><p class="mini">Models that do not read from it, directly or through a different model, do not run.</p>`:`<p><code>${esc(n.fqn)}</code> has no children. Only this model runs.</p>`}
  function setEx(k){exi=k;b.querySelector("#gname").value=EX[k][0];b.querySelector("#gsql").value=EX[k][1]}
  function add(){const name=b.querySelector("#gname").value.trim().toLowerCase(),sql=b.querySelector("#gsql").value;const msg=b.querySelector("#gmsg");
    if(!/^[a-z_]+\.[a-z_0-9]+$/.test(name)){msg.innerHTML=`<div class="notice bad">Write the name as schema.table, for example <code>bean_street.top_products</code>.</div>`;return}
    if(name.startsWith("raw.")){msg.innerHTML=`<div class="notice bad">The raw schema belongs to other systems. Put the model in bean_internal or bean_street.</div>`;return}
    if(G.nodes.some(n=>n.fqn===name)){msg.innerHTML=`<div class="notice bad">A model with the name <code>${esc(name)}</code> exists. Use a different name.</div>`;return}
    const refs=[...new Set([...sql.matchAll(/\b(?:from|join)\s+([a-z_]+\.[a-z_0-9]+)/gi)].map(x=>x[1].toLowerCase()))];
    if(!refs.length){msg.innerHTML=`<div class="notice bad">The SQL has no FROM clause with a table name such as <code>bean_internal.orders</code>.</div>`;return}
    const unknown=refs.filter(r=>!G.nodes.some(n=>n.fqn===r));
    if(unknown.length){msg.innerHTML=`<div class="notice bad"><span class="who">vulcan plan</span><b>Vulcan does not know <code>${esc(unknown[0])}</code>.</b><p>Add it as an input in <code>inputs/</code>, or write a model that builds it.</p></div>`;return}
    const id=name.replace(".","__");const ids=refs.map(r=>G.nodes.find(n=>n.fqn===r).id);
    G.nodes.push({id,label:name.split(".")[1],kind:name.startsWith("bean_street")?"GOLD":"SILVER",fqn:name});ids.forEach(p=>G.edges.push([p,id]));added.add(id);
    msg.innerHTML=`<div class="notice ok"><b>Vulcan added <code>${esc(name)}</code>.</b><p>It found ${ids.length} parent table${ids.length>1?"s":""}: ${refs.map(r=>`<code>${esc(r)}</code>`).join(", ")}. The model runs after ${ids.length>1?"them":"it"}. You did not write an order.</p></div>`;pick=null;paint();setEx((exi+1)%EX.length)}
  setEx(0);b.querySelector("#gadd").onclick=add;b.querySelector("#gex").onclick=()=>setEx((exi+1)%EX.length);
  b.querySelector("#greset").onclick=()=>{G=base();added=new Set();pick=null;setEx(0);b.querySelector("#gmsg").innerHTML="";b2.querySelector("#gimp").innerHTML="Click a box in the graph to change that model.";paint()};
  paint();
  m.append(h(`<div class="callout"><b>What this gives your team.</b> Each person can own one step of the logic and write it without knowledge of the full schedule. Vulcan keeps the graph correct. When a step changes, the correct steps after it run, and no others.</div>`));
  m.append(quiz([{q:"You add a model that reads bean_street.daily_sales. Where do you write that it runs after daily_sales?",o:["In a schedule file","Nowhere, because Vulcan reads the FROM clause","In config.yaml"],a:1,w:"The dependency comes from the SQL."},
   {q:"You change bean_internal.customers. Which models run after it?",o:["All models","Only the models that read it, directly or through other models","Only customers"],a:1,w:"Vulcan follows the graph from the changed model."},
   {q:"What is a parent of daily_sales?",o:["bean_internal.orders","weekly_revenue","sales"],a:0,w:"daily_sales reads orders, so orders is a parent."},
   {q:"A model reads bean_internal.payments, but no model or input has that name. What does the plan do?",o:["It makes an empty table","It shows that Vulcan does not know the table","It ignores the model"],a:1,w:"Each table that a model reads must be an input or a model."},
   {q:"Model A reads model B, and model B reads model A. What occurs?",o:["Vulcan builds both two times","Vulcan shows an error, because a graph cannot have a loop","Vulcan builds A first"],a:1,w:"A loop has no first step, so Vulcan cannot find an order."},
   {"q": "How does Vulcan find the parents of a SQL model?", "o": ["From a list that you write in config.yaml", "From the tables in the FROM and JOIN clauses", "From the file name"], "a": 1, "w": "Vulcan reads the SQL of each model and finds the tables that it reads."},
   {"q": "In which order does Vulcan build orders and daily_sales?", "o": ["daily_sales first", "orders first, because it is a parent of daily_sales", "Both at the same time"], "a": 1, "w": "Vulcan builds parents before children."}]));
  m.append(nextBtn(i));return m}

const SQL_OUT={
postgres:`SELECT\n  store_id,\n  SUM(amount) AS revenue,\n  COUNT(*) AS order_count\nFROM bean_internal.orders\nWHERE\n  product ILIKE '%latte%' AND order_date >= CURRENT_DATE - INTERVAL '7 DAYS'\nGROUP BY\n  store_id\nORDER BY\n  revenue DESC\nLIMIT 10`,
snowflake:`SELECT\n  store_id,\n  SUM(amount) AS revenue,\n  COUNT(*) AS order_count\nFROM bean_internal.orders\nWHERE\n  product ILIKE '%latte%' AND order_date >= CURRENT_DATE - INTERVAL '7 DAYS'\nGROUP BY\n  store_id\nORDER BY\n  revenue DESC\nLIMIT 10`,
bigquery:`SELECT\n  store_id,\n  SUM(amount) AS revenue,\n  COUNT(*) AS order_count\nFROM bean_internal.orders\nWHERE\n  LOWER(product) LIKE LOWER('%latte%')\n  AND order_date >= CURRENT_DATE - INTERVAL '7' DAY\nGROUP BY\n  store_id\nORDER BY\n  revenue DESC NULLS FIRST\nLIMIT 10`,
databricks:`SELECT\n  store_id,\n  SUM(amount) AS revenue,\n  COUNT(*) AS order_count\nFROM bean_internal.orders\nWHERE\n  product ILIKE '%latte%' AND order_date >= CURRENT_DATE - INTERVAL '7' DAYS\nGROUP BY\n  store_id\nORDER BY\n  revenue DESC NULLS FIRST\nLIMIT 10`,
trino:`SELECT\n  store_id,\n  SUM(amount) AS revenue,\n  COUNT(*) AS order_count\nFROM bean_internal.orders\nWHERE\n  LOWER(product) LIKE LOWER('%latte%')\n  AND order_date >= CURRENT_DATE - INTERVAL '7' DAY\nGROUP BY\n  store_id\nORDER BY\n  revenue DESC NULLS FIRST\nLIMIT 10`};
const SQL_NOTE={postgres:"This is the SQL that you wrote. Postgres uses it with no change.",snowflake:"Snowflake accepts the same syntax, so the SQL does not change.",
bigquery:"BigQuery has no ILIKE, so Vulcan writes LOWER(...) LIKE LOWER(...). It also adds NULLS FIRST, because Postgres puts empty values first in a DESC sort and BigQuery does not. The result stays the same.",
databricks:"Databricks writes the interval in a different way. Vulcan also adds NULLS FIRST to keep the Postgres sort order.",
trino:"Trino has no ILIKE, so Vulcan writes it in a different way. The interval and the sort order also change, to keep the same result."};
function mEngine(i){

  m.append(concept("What occurs in each run",`<div class="prose"><p>A <span class="term">run</span> is one operation of Vulcan that builds the data that is due. Your platform starts a run on a schedule, for example every 15 minutes. In each run, Vulcan does three things:</p>
   <ol><li>It finds which models are due and which time periods each model is missing.</li><li>It translates the SQL of each model into the SQL of your engine.</li><li>It sends the SQL to your engine, parents first, and records which time periods are done.</li></ol></div>
   ${flow([{t:"Find due work",s:"cron and records"},{t:"Translate",s:"your dialect to engine"},{t:"Build",s:"in your engine",tone:"accent"},{t:"Record",s:"periods that are done"}],{caption:"The steps of one run."})}`));
  m.append(concept("Dialects",`<div class="prose"><p>Each database understands a slightly different version of SQL. This version has the name <span class="term">dialect</span>. You write all models in one dialect. Bean Street uses Postgres. Vulcan translates each model into the dialect of the engine.</p><p>Vulcan supports Postgres, Snowflake, BigQuery, Databricks, Spark, Trino, Redshift, Athena, ClickHouse, MySQL, SQL Server and Microsoft Fabric.</p></div>`));

  const eng=b.querySelector("#eng");

  eng.querySelector("button").click();
  m.append(concept("Cron and intervals",`<div class="prose"><p>Each model has a <span class="term">cron</span>. The cron tells Vulcan how frequently the model is due, for example <code>@daily</code> or <code>@hourly</code>.</p>
   <p>The cron also sets the size of each <span class="term">interval</span>. An interval is one time period of data, for example one day of orders. A daily model has one interval for each day. An hourly model has one interval for each hour.</p>
   <p>Vulcan records each interval that it built. In each run, it compares the intervals that are due with the intervals that it built. It builds only the difference. If you start a second run directly after the first, Vulcan finds no missing intervals and does nothing.</p>
   <p>Vulcan builds an interval only when the interval is completed. At 10:30, an hourly model gets the interval from 9:00 to 10:00, but not the interval from 10:00 to 11:00. A daily model gets yesterday, but not today.</p></div>`));
  const b2=h(`<div class="bench flat"><div class="bench-head"><h3>Runs over time</h3><span class="tag">today is <b id="today"></b></span></div>

    <div class="svgwrap"><div class="days" id="grid"></div></div>

  let today,done,lastFull;const grid=b2.querySelector("#grid"),log=b2.querySelector("#slog");
  function reset(){today=5;done=new Set([0,1,2,3,4]);lastFull=null;log.innerHTML=`<span class="muted">Vulcan built 2026-10-01 to 2026-10-05 before.</span>`;paint()}
  function paint(hl={}){b2.querySelector("#today").textContent=DAYS[today];
    let s=`<div class="lab"></div>`+DAYS.map(d=>`<div class="lab" style="text-align:center">${d.slice(8)}</div>`).join("");
    s+=`<div class="lab">orders<br>INCREMENTAL</div>`+DAYS.map((d,k)=>{let c=k>today?"future":done.has(k)?"done":"";if(hl.o&&hl.o.includes(k))c="now";return`<div class="cell ${c}">${k>today?"":done.has(k)?"✓":"·"}</div>`}).join("");
    s+=`<div class="lab">daily_sales<br>FULL</div>`+DAYS.map((d,k)=>{const built=lastFull!==null&&done.has(k);let c=k>today?"future":hl.f&&done.has(k)?"rebuild":built?"done":"";return`<div class="cell ${c}">${k>today?"":hl.f&&done.has(k)?"↻":built?"✓":"·"}</div>`}).join("");
    grid.innerHTML=s}
  function L(t,c=""){log.append(h(`<div class="${c}">${t}</div>`));log.scrollTop=log.scrollHeight}

    L("pos_orders: input assertions passed.","ok");L(`orders: build ${missing.map(k=>DAYS[k]).join(", ")} (${missing.length} day${missing.length>1?"s":""}). The other days stay as they are.`,"ok");missing.forEach(k=>done.add(k));

  reset();
  m.append(concept("Different crons in one graph",`<div class="prose"><p>Models in one graph can have different crons. Vulcan obeys these rules:</p>

   <div class="svgwrap"><div class="hours" id="hrs"></div></div><div id="hmsg"></div></div>`);m.append(b3);
  function hours(){const pc=b3.querySelector("#pc").value,cc=b3.querySelector("#cc").value;
    const cols=[...Array(24).keys()].map(x=>String(x).padStart(2,"0")).concat(["next"]);
    let s=`<div class="lab">run at</div>`+cols.map(c=>`<div class="lab" style="text-align:center">${c==="next"?"+1d":c}</div>`).join("");

function mSignals(i){
  const m=section(eb(i),"Build a day only when its data is ready.");
  m.append(concept("The problem",`<div class="prose"><p>A cron tells Vulcan when an interval is due. It does not tell Vulcan if the source data is ready. At Bean Street, each store sends its orders to the POS system when it closes the day. One store sometimes sends its orders two hours late.</p><p>Without a signal, the next run builds the day with orders from only two stores. Vulcan records the day as done, and revenue for that day is too low.</p></div>`));
  m.append(concept("What a signal is",`<div class="prose"><p>A <span class="term">signal</span> is a Python function that tells Vulcan which missing intervals are ready to build. Vulcan uses the signal in each run, before it builds the model.</p>
   <ul><li>If the signal gives back <code>True</code>, all intervals in the batch are ready.</li><li>If the signal gives back <code>False</code>, no interval is ready.</li><li>If the signal gives back a list of intervals, only those intervals are ready.</li></ul>
   <p>Vulcan does not build the intervals that are not ready. They stay missing. In the next run, Vulcan uses the signal again. The children of the model also wait for those intervals.</p></div>
   ${flow([{t:"Run starts",s:"cron is due"},{t:"Missing days",s:"from the records"},{t:"Signal",s:"pos_day_closed()",tone:"accent"},{t:"Build ready days",s:"and the children",tone:"ok"}],{labels:["","","ready"],caption:"The days that the signal does not give back stay missing until the next run."})}`));
  m.append(concept("Write a signal",`<div class="prose"><p>Put the function in the <code>signals/</code> folder of the project, for example in <code>signals/__init__.py</code>. Put <code>@signal()</code> on the function.</p></div><pre>${esc(FILES["signals/__init__.py"].text)}</pre>
   <div class="prose"><p>The first argument, <code>batch</code>, is the list of missing intervals. Each interval is a start time and an end time. The argument <code>context</code> gives access to your engine, so the function can read a table. You can also add your own arguments.</p></div>`));
  m.append(concept("Attach the signal to a model",`<div class="prose"><p>Name the signal in the MODEL block. A model can have more than one signal. An interval is ready only when all signals give it back.</p></div><pre>MODEL (
  name bean_internal.orders,
  kind INCREMENTAL_BY_TIME_RANGE (time_column order_date),
  signals (
    pos_day_closed()
  ),
  ...
);</pre>
   <div class="callout">Vulcan also has a built-in signal with the name <code>freshness</code>. It makes a model wait until an input table changed after the last build of the model.</div>`));
  const b=h(`<div class="bench flat"><div class="bench-head"><h3>The POS closes the day</h3><span class="tag">today is 2026-10-10, at 06:30</span></div>
   <p class="mini">Each row is one missing day. Select the stores that closed each day, then click <b>Run</b>. Clear the signal box to see a run without the signal.</p>
   <div id="sgrid"></div>
   <div class="row"><label class="row" style="gap:6px"><input type="checkbox" id="use" checked> The orders model has the signal pos_day_closed()</label><button class="btn primary" id="srun">Run</button><button class="btn" id="sreset">Reset</button></div>
   <div class="cols"><div class="log" id="slog"></div><div id="sout" class="stack"></div></div></div>`);m.append(b);
  const sd=["2026-10-07","2026-10-08","2026-10-09"];let closed,built;
  function reset(){closed={"2026-10-07":{S1:1,S2:1,S3:1},"2026-10-08":{S1:1,S2:1,S3:1},"2026-10-09":{S1:1,S2:0,S3:1}};built={};paint();b.querySelector("#slog").innerHTML=`<span class="muted">Click Run.</span>`;b.querySelector("#sout").innerHTML=""}
  function paint(){b.querySelector("#sgrid").innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>day</th>${Object.values(STORES).map(s=>`<th>${s} closed</th>`).join("")}<th>orders</th></tr></thead><tbody>${sd.map(d=>`<tr><td>${d}</td>${Object.keys(STORES).map(s=>`<td><input type="checkbox" data-d="${d}" data-s="${s}" ${closed[d][s]?"checked":""} ${built[d]?"disabled":""} aria-label="${STORES[s]} closed ${d}"></td>`).join("")}<td>${built[d]==="full"?'<span class="pill ok">built, complete</span>':built[d]==="half"?'<span class="pill bad">built, orders missing</span>':'<span class="pill idle">missing</span>'}</td></tr>`).join("")}</tbody></table></div>`;
    b.querySelectorAll("#sgrid input").forEach(x=>x.onchange=()=>{closed[x.dataset.d][x.dataset.s]=x.checked?1:0})}
  b.querySelector("#sreset").onclick=reset;
  b.querySelector("#srun").onclick=()=>{const log=b.querySelector("#slog");log.innerHTML="";const L=(t,c="")=>log.append(h(`<div class="${c}">${t}</div>`));
    const use=b.querySelector("#use").checked;const missing=sd.filter(d=>!built[d]);
    L("Run started. Missing days for orders: "+(missing.join(", ")||"none")+".");
    if(!missing.length){L("Nothing to do.","muted");return}
    let ready=missing;
    if(use){ready=missing.filter(d=>Object.values(closed[d]).every(Boolean));L("Signal pos_day_closed gives back: "+(ready.join(", ")||"no days")+".",ready.length?"ok":"warn");
      missing.filter(d=>!ready.includes(d)).forEach(d=>L(`${d}: not ready. Vulcan waits. daily_sales also waits for this day.`,"warn"))}
    else L("No signal. Vulcan builds all missing days.","warn");
    ready.forEach(d=>{const full=Object.values(closed[d]).every(Boolean);built[d]=full?"full":"half";L(`orders: build ${d}.`+(full?"":" One store had not closed. Its orders are not in the table."),full?"ok":"bad")});
    if(ready.length)L("daily_sales: build again with the new days.","ok");
    if(!ready.length)L("Run finished: no models ready to run.","muted");else L("Run finished.","muted");
    const half=ready.filter(d=>built[d]==="half");
    b.querySelector("#sout").innerHTML=(half.length?`<div class="notice bad"><b>Wrong revenue for ${half.join(", ")}.</b><p>Vulcan recorded the day as done. The late orders do not get into the table in the next run. You must restate the day (Module 8).</p></div>`:"")+
      (use&&missing.length>ready.length?`<div class="notice warn"><b>Some days wait.</b><p>Select the missing store and click Run again. Vulcan builds the day in the next run.</p></div>`:"")+
      `<div class="notice idle"><span class="who">no message</span><p>Vulcan does not send a message when a signal makes a day wait. If a day can wait for a long time, add a data quality check for freshness or watch the run messages (Module 10).</p></div>`;paint()};
  reset();
  m.append(quiz([{q:"A signal gives back False. What does Vulcan do with the missing intervals?",o:["It builds them with the data that it has","It does not build them, and it uses the signal again in the next run","It deletes them"],a:1,w:"Intervals that are not ready stay missing."},
   {q:"Where do you write a signal?",o:["In a Python file in signals/","In config.yaml","In the SELECT of the model"],a:0,w:"Signals are Python functions with @signal()."},
   {q:"A model has two signals. When is an interval ready?",o:["When one signal gives it back","When all signals give it back","Always"],a:1,w:"All signals must agree."},
   {q:"The orders model waits for 2026-10-09. What does daily_sales do?",o:["It builds 2026-10-09 with no orders","It also waits for that day","It shows an error"],a:1,w:"Children wait for the intervals that their parents did not build."},
   {q:"Does Vulcan send a message when a signal makes a day wait?",o:["Yes, an alert to the owner","No, so add a freshness check or watch the run messages","Only on Slack"],a:1,w:"The run only reports that no models were ready to run."},
   {"q": "What does the signal pos_day_closed examine?", "o": ["That all stores closed the day in the POS system", "That the warehouse is online", "That the owner approved the run"], "a": 0, "w": "The orders model waits until the POS system has all orders of the day."},
   {"q": "Why use a signal and not a later cron?", "o": ["A signal waits until the source is ready, at any time", "A signal makes the run faster", "A signal changes the dialect"], "a": 0, "w": "A fixed time cannot know when the source is ready. A signal examines the source itself."}]));
  m.append(nextBtn(i));return m}

const KIND_OTHERS=[["INCREMENTAL_BY_PARTITION","Replaces full partitions. Always forward-only."],["INCREMENTAL_UNMANAGED","Only adds rows. Vulcan does not build history again."],["SCD_TYPE_2_BY_COLUMN","History, when a change in the listed columns starts a new version."],["MANAGED","The engine keeps the table current, for example a Snowflake dynamic table."],["CUSTOM","Your own build method, written in Python."],["SEMANTIC","A semantic model in YAML. Module 11."],["METRIC","A metric in YAML. Module 11."]];
function mKinds(i){
  const m=section(eb(i),"The kind tells Vulcan how to update a table.");
  m.append(concept("What a kind is",`<div class="prose"><p>Each model has a <span class="term">kind</span>. The kind tells Vulcan what to do with the table in each run. The SQL of the model stays the same. Only the method of the update changes.</p>
   <p>The kind is important for cost and for correctness. A <code>FULL</code> model builds all rows each time, which is simple but expensive for a large table. An incremental model builds only the new intervals, which is cheap but needs a date or a key. A history model keeps old versions, so that you can answer questions about the past.</p>
   <p>Use the questions in the first bench to find the kind for your table. Then use the second bench to see how each kind changes a table.</p></div>`));
  const w=h(`<div class="bench"><div class="bench-head"><h3>Which kind do I need?</h3><span class="tag">answer the questions</span></div><div class="stack" id="wiz"></div></div>`);m.append(w);
  const b=h(`<div class="bench flat"><div class="bench-head"><h3>See each kind</h3><span class="tag">before, new data, after</span></div><div class="tabs" role="tablist" id="kt"></div><div id="kb" class="cols"></div></div>`);m.append(b);
  m.append(concept("Other kinds",`<div class="tbl-wrap"><table><thead><tr><th>Kind</th><th>Use</th></tr></thead><tbody>${KIND_OTHERS.map(k=>`<tr><td><code>${k[0]}</code></td><td style="white-space:normal">${k[1]}</td></tr>`).join("")}</tbody></table></div>`));
  const kt=b.querySelector("#kt"),kb=b.querySelector("#kb");
  function show(k){kt.querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",x.dataset.k===k));const K=KINDS[k];const cols=r=>Object.keys(r[0]).filter(c=>c!=="_c");
    kb.innerHTML=`<div class="stack"><h4>When to use it</h4><p>${K.when}</p><pre>${esc(K.snip)}</pre><p class="mini">${K.note}</p></div><div class="stack"><h4>Before the run</h4>${table(K.before,cols(K.before))}<div class="callout">${K.incoming}</div><h4>After the run</h4>${table(K.after,cols(K.after),r=>r._c||"")}<p class="mini"><span class="pill ok">new</span> <span class="pill warn">changed</span></p></div>`}
  Object.keys(KINDS).forEach(k=>{const x=h(`<button role="tab" data-k="${k}">${k.replace(/_/g," ").toLowerCase()}</button>`);x.onclick=()=>show(k);kt.append(x)});show("INCREMENTAL_BY_TIME_RANGE");
  const wiz=w.querySelector("#wiz");const ans={};
  const Q=[["store","Who writes this table?",[["yes","Vulcan builds it from other tables"],["no","A different system writes it"],["csv","It is a small CSV file in Git"]]],
   ["shape","How does new data arrive?",[["time","New rows with a date, and old rows do not change"],["key","Rows change, and I need only the latest version"],["hist","Rows change, and I need the old versions also"],["small","The table is small, so build it again each time"]]],
   ["store2","Must Vulcan store the result, or can the database calculate it at the time of the query?",[["stored","Store it"],["live","Calculate at the time of the query"]]]];
  function rec(){if(ans.store==="no")return"INPUT";if(ans.store==="csv")return"SEED";if(ans.store2==="live")return"VIEW";return{time:"INCREMENTAL_BY_TIME_RANGE",key:"INCREMENTAL_BY_UNIQUE_KEY",hist:"SCD_TYPE_2_BY_TIME",small:"FULL"}[ans.shape]}
  function paint(){wiz.innerHTML="";Q.forEach(([k,q,opts],qi)=>{if(qi>0&&ans.store!=="yes")return;if(qi===2&&!ans.shape)return;
      const r=h(`<div class="q"><b>${q}</b><div class="row"></div></div>`);opts.forEach(([v,t])=>{const c=h(`<button class="chip" aria-pressed="${ans[k]===v}">${t}</button>`);c.onclick=()=>{ans[k]=v;if(k==="store"){delete ans.shape;delete ans.store2}if(k==="shape")delete ans.store2;paint()};r.querySelector(".row").append(c)});wiz.append(r)});
    if((ans.store&&ans.store!=="yes")||(ans.shape&&ans.store2)){const k=rec();const r=h(`<div class="callout"><b>Use ${k==="INPUT"?"an input file in <code>inputs/</code>":"<code>"+k+"</code>"}.</b> <button class="btn" style="margin-left:8px">Show it</button></div>`);r.querySelector("button").onclick=()=>{show(k);kt.scrollIntoView({behavior:"smooth",block:"center"})};wiz.append(r)}}

  m.append(nextBtn(i));return m}

import pandas as pd
from vulcan import ExecutionContext, model


@model(
    "bean_street.revenue_forecast",
    cron="@daily",
    columns={
        "store_id": "varchar",
        "forecast_date": "date",
        "revenue": "decimal(10,2)",
    },
    description="Revenue forecast for the next 7 days for each store.",
)
def execute(
    context: ExecutionContext,
    start: datetime,
    end: datetime,
    execution_time: datetime,
    **kwargs: t.Any,
) -> t.Iterator[pd.DataFrame]:
    sales_table = context.resolve_table("bean_street.daily_sales")
    sales = context.fetchdf(
        f"SELECT store_id, order_date, SUM(revenue) AS revenue "
        f"FROM {sales_table} GROUP BY 1, 2"
    )

        return

    last_week = sales[sales.order_date >= sales.order_date.max() - pd.Timedelta(days=6)]
    average = last_week.groupby("store_id", as_index=False).revenue.mean()
    days = pd.DataFrame({"forecast_date": pd.date_range(execution_time.date(), periods=7)})
    yield average.merge(days, how="cross")[["store_id", "forecast_date", "revenue"]]`,

    const rd=[];added.forEach(c=>rd.push(`<tr class="new"><td>added</td><td><code>${esc(c)}</code></td><td style="white-space:normal">no model reads it at this time</td></tr>`));
    removed.forEach(c=>rd.push(`<tr class="gone"><td>removed</td><td><code>${esc(c)}</code></td><td style="white-space:normal">${(READERS[model][c]||[]).join(", ")||"no model"}</td></tr>`));
    changed.forEach(c=>rd.push(`<tr class="chg"><td>changed</td><td><code>${esc(c)}</code></td><td style="white-space:normal">${(READERS[model][c]||[]).join(", ")||"no model"}</td></tr>`));
    if(whereCh)rd.push(`<tr class="chg"><td>changed</td><td>WHERE filter</td><td style="white-space:normal">all columns, because the set of rows changes</td></tr>`);
    if(reordered&&!removed.length)rd.push(`<tr class="chg"><td>changed</td><td>column order</td><td style="white-space:normal">a change of order is an edit, not an addition</td></tr>`);
    if(descCh)rd.push(`<tr><td>metadata</td><td>description</td><td style="white-space:normal">documentation only</td></tr>`);
    const guard=fo&&removed.length?`<div class="notice bad"><span class="who">vulcan plan · schema guard</span><b>The plan stopped.</b><p>A forward-only change keeps the old table. A removed column erases data in that table, so Vulcan refuses it by default. You can add a column.</p></div>`:"";
    const why={BREAKING:"You changed or removed something that existed. Data in the children can change, so Vulcan uses the category breaking.",NON_BREAKING:"You only added columns. The values of the old columns stay the same, so the children stay as they are.",METADATA:"Only the description changed. The data is the same."}[cat];
    const work=cat==="METADATA"?"Vulcan builds nothing. It only records the new description.":fo?"Vulcan builds nothing again. The new logic applies from the next day that Vulcan builds. The old days keep the old logic.":rebuild.map(r=>r==="orders"?`<b>orders</b>: build ${days.length} days again (${days[0]} to ${days[days.length-1]})`:`<b>${r}</b>: build the full table again`).join("<br>");
    out.innerHTML=`${guard}<div class="row"><b>Category for ${model}:</b> <span class="pill ${pill}">${cat}</span></div><p>${why}</p><div id="pd"></div>
     <div class="cols"><div><h4>Column changes, and the models that read them</h4><div class="tbl-wrap"><table><thead><tr><th>change</th><th>what</th><th>read by</th></tr></thead><tbody>${rd.join("")}</tbody></table></div></div>
     <div class="stack"><h4>Work that Vulcan will do</h4><p>${work}</p><div class="notice info"><span class="who">Slack · plan_change</span><b>Plan applied by Emily</b><span class="mini">directly modified: ${model} · downstream affected: ${down.length} · breaking: ${cat==="BREAKING"?"yes":"no"} · backfill: ${rebuild.length&&!fo?"yes":"no"}</span></div></div></div>`;
    drawDag(out.querySelector("#pd"),{states,labels})};
  load();
  m.append(h(`<div class="callout"><b>What this gives you for MTTR.</b> Without a plan, a person guesses what a change touches, and often finds the problem the next morning. With a plan, the effect shows before the build, and the build includes only what the change affects.</div>`));
  m.append(quiz([{q:"You add a new column to orders. What does Vulcan build again?",o:["orders and daily_sales","Only orders","Nothing"],a:1,w:"An added column is non-breaking. The children do not read it."},
   {q:"You change amount to amount * 1.23 in orders. What occurs to daily_sales?",o:["Vulcan builds it again, because its input data changed","Nothing","Vulcan removes it"],a:0,w:"The change is breaking, so daily_sales is indirectly breaking."},
   {q:"You remove revenue from daily_sales. Why does the plan stop?",o:["Because the measure total_revenue reads that column","Because FULL models cannot change","Because of a syntax error"],a:0,w:"Vulcan makes sure that semantic terms point to real columns before it applies the plan."},
   {q:"You change only the description of a model. Which category does Vulcan give?",o:["BREAKING","NON_BREAKING","METADATA"],a:2,w:"A metadata change builds nothing."},
   {q:"The POS system sent wrong data for two days. The logic is correct. What do you do?",o:["Make a breaking change","Restate those two days","Remove the model"],a:1,w:"A restatement builds only the days that you select, and their children."},
   {"q": "You make a breaking change forward-only. What occurs to the old days?", "o": ["Vulcan builds them again", "They stay as they are, and only new data uses the change", "Vulcan deletes them"], "a": 1, "w": "Forward-only applies the change only to new intervals."},
   {"q": "What do you read before you apply a change?", "o": ["The plan", "The run log of yesterday", "The seed file"], "a": 0, "w": "The plan lists each model that the change affects, and its category."},
   {"q": "Which change is breaking?", "o": ["A new column at the end of the SELECT", "A new filter in the WHERE clause", "A new description"], "a": 1, "w": "A new filter changes the rows that the children read, so they must be built again."}]));

/* ---------- 9 Quality ---------- */
function mQuality(i){
  const m=section(eb(i),"Four checks, each at a different time.","A problem costs less when you find it early. Vulcan examines your work when you write it, when you plan it, when the data arrives, and after the data is in the table.");
  m.append(concept("When each check operates",`${flow([{t:"Write",s:"in your editor",cap:"Linter"},{t:"Plan",s:"before a build",cap:"Unit tests\nLinter"},{t:"Run",s:"each build",tone:"accent",cap:"Assertions"},{t:"After the run",s:"if no errors",cap:"Data quality checks"}],{caption:"Each check finds a different type of problem. Click the tabs to use each one."})}
   <div class="tbl-wrap"><table class="compare"><thead><tr><th>Check</th><th>Finds</th><th>Stops data?</th></tr></thead><tbody>
   <tr><td><b>Linter</b></td><td>Mistakes in the code, for example SELECT * or a model with no owner.</td><td>Rules in <code>rules</code> stop the plan. Rules in <code>warnRules</code> only warn.</td></tr>
   <tr><td><b>Unit test</b></td><td>Wrong logic, with fixed input rows.</td><td>A failed test stops the plan.</td></tr>
   <tr><td><b>Assertion</b></td><td>Bad rows in real data, in each run.</td><td>Yes, by default. The children do not run.</td></tr>
   <tr><td><b>Data quality check</b></td><td>Bad patterns over time, for example fewer orders than usual.</td><td>No. It reports and sends a message.</td></tr></tbody></table></div>`));
  const b=h(`<div class="bench flat"><div class="bench-head"><h3>Try each check</h3><span class="tag">select a check</span></div><div class="tabs" role="tablist" id="qt"></div><div id="qb" class="stack" style="gap:14px"></div></div>`);m.append(b);
  const tabs=[["test","Unit tests"],["assert","Assertions"],["dq","Data quality"],["lint","Linter"]];const qt=b.querySelector("#qt"),qb=b.querySelector("#qb");
  tabs.forEach(([k,t])=>{const x=h(`<button role="tab" data-k="${k}">${t}</button>`);x.onclick=()=>show(k);qt.append(x)});
  function show(k){qt.querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",x.dataset.k===k));qb.innerHTML="";({lint,test,assert,dq})[k]()}

  function lint(){qb.append(h(`<div class="prose"><p>The <span class="term">linter</span> reads your SQL and your MODEL block, and finds frequent mistakes. It operates when you write and during each plan. Edit the model and click <b>Lint</b>. Try to correct all findings.</p></div>`));
    const ta=h(`<textarea rows="11" aria-label="Model SQL">MODEL (\n  name bean_internal.refunds,\n  kind FULL\n);\n\nSELECT *\nFROM bean_internal.orders\nWHERE status = 'refunded'</textarea>`);qb.append(ta);const out=h(`<div class="stack"></div>`);const bt=h(`<div class="row"><button class="btn primary">Lint</button></div>`);qb.append(bt,out);
    bt.querySelector("button").onclick=()=>{const s=ta.value;const f=[];
      if(/select\s+\*/i.test(s)||/\.\*/.test(s))f.push(["bad","noselectstar","SELECT * hides the columns that the model gives. If orders gets a new column, this model changes without a plan. Write the list of columns."]);

      out.innerHTML=f.length?f.map(x=>`<div class="notice ${x[0]}"><span class="who">${x[0]==="bad"?"error":"warning"} · ${x[1]}</span><p>${x[2]}</p></div>`).join(""):`<div class="notice ok"><b>No findings.</b> The model is ready for a plan.</div>`}}

  function test(){
    qb.append(h(`<div class="prose"><p>A <span class="term">unit test</span> makes sure that the logic of one model is correct. It does not use warehouse data. You give the model fixed input rows for each table that it reads. You also give the rows that you expect. During the plan, Vulcan does the query on your input rows and compares the result with your expected rows. If they are different, the plan stops and nothing is built.</p>
     <p>The test here is for <code>daily_sales</code>. It makes sure of two business rules:</p>
     <ol><li>The loyalty tier is the tier on the day of the order. Ana was silver on 10-01 and gold on 10-06.</li><li>An order from a person who is not a member stays in the result, with an empty tier. Customer 99 is not a member.</li></ol>

      customers:[{customer_id:"7",name:"Ana",tier:"silver",valid_from:"2026-09-01",valid_to:"2026-10-05"},{customer_id:"7",name:"Ana",tier:"gold",valid_from:"2026-10-05",valid_to:"null"}],
      stores:[{store_id:"S1",store_name:"Harbor",city:"Lisbon"}],
      expected:[{order_date:"2026-10-01",loyalty_tier:"silver",revenue:"4.50",order_count:"1"},{order_date:"2026-10-06",loyalty_tier:"gold",revenue:"4.50",order_count:"1"},{order_date:"2026-10-06",loyalty_tier:"null",revenue:"4.50",order_count:"1"}]};
    let T;
    const grid=(key,el)=>{const rows=T[key];const cols=Object.keys(rows[0]);el.innerHTML=`<div class="tbl-wrap"><table class="grid-in"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map((r,ri)=>`<tr>${cols.map(c=>`<td><input type="text" value="${esc(r[c])}" data-k="${key}" data-r="${ri}" data-c="${c}" aria-label="${key} row ${ri+1} ${c}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      el.querySelectorAll("input").forEach(x=>x.oninput=()=>{T[x.dataset.k][+x.dataset.r][x.dataset.c]=x.value;yaml()})};
    const yv=v=>v===""?"null":v;
    function yaml(){const row=r=>"{"+Object.entries(r).map(([k,v])=>`${k}: ${yv(v)}`).join(", ")+"}";
      w.querySelector("#tyaml").textContent=`test_daily_sales_tier_on_order_date:\n  model: bean_street.daily_sales\n  inputs:\n    bean_internal.orders:\n${T.orders.map(r=>"      - "+row(r)).join("\n")}\n    bean_internal.stores:\n${T.stores.map(r=>"      - "+row(r)).join("\n")}\n    bean_internal.customers:\n${T.customers.map(r=>"      - "+row(r)).join("\n")}\n  outputs:\n    query:\n      partial: true\n      rows:\n${T.expected.map(r=>"        - "+row(r)).join("\n")}`;
      const b1=w.querySelector("#bug1").checked,b2=w.querySelector("#bug2").checked;
      w.querySelector("#tsql").textContent=`SELECT\n  o.store_id, s.store_name, o.product, o.order_date, o.status,\n  c.tier AS loyalty_tier,\n  SUM(o.amount) AS revenue,\n  COUNT(*) AS order_count\nFROM bean_internal.orders AS o\nJOIN bean_internal.stores AS s\n  ON o.store_id = s.store_id\n${b2?"JOIN":"LEFT JOIN"} bean_internal.customers AS c\n  ON o.customer_id = c.customer_id\n${b1?"  AND c.valid_to IS NULL":"  AND o.order_date >= c.valid_from\n  AND (o.order_date < c.valid_to OR c.valid_to IS NULL)"}\nGROUP BY 1, 2, 3, 4, 5, 6`}
    function compute(){const b1=w.querySelector("#bug1").checked,b2=w.querySelector("#bug2").checked;const nul=v=>v===""||v==="null";const groups=new Map();
      T.orders.forEach(o=>{const st=T.stores.find(s=>s.store_id===o.store_id);if(!st)return;
        const c=T.customers.find(c=>c.customer_id===o.customer_id&&(b1?nul(c.valid_to):(o.order_date>=c.valid_from&&(nul(c.valid_to)||o.order_date<c.valid_to))));

        const g=groups.get(key)||{store_id:o.store_id,product:o.product,order_date:o.order_date,status:o.status,loyalty_tier:tier,revenue:0,order_count:0};g.revenue+=parseFloat(o.amount)||0;g.order_count+=1;groups.set(key,g)});
      return[...groups.values()].map(g=>({...g,revenue:money(g.revenue),order_count:String(g.order_count)}))}
    function run(){const actual=compute();const ecols=Object.keys(T.expected[0]);const used=new Set();
      const norm=(c,v)=>c==="revenue"?(isNaN(parseFloat(v))?v:money(v)):(v===""?"null":String(v));

      if(!ok&&b1)why+="<p>The current tier of Ana is gold. With the bug, her order of 10-01 gets gold, but she was silver on that day. Finance reports for the past change each time a member changes tier.</p>";
      if(!ok&&b2)why+="<p>Customer 99 is not a member. With JOIN, the order has no partner row in customers, so it is not in the result. Revenue from people who are not members disappears.</p>";
      w.querySelector("#tres").innerHTML=`<div class="notice ${ok?"ok":"bad"}"><span class="who">vulcan plan · test_daily_sales_tier_on_order_date</span><b>${ok?"The test passed.":"The test failed. The plan stops, and Vulcan builds nothing."}</b>${ok?"<p>The result agrees with the expected rows. The plan can continue.</p>":why||"<p>The red cells show the expected value and, after the arrow, the value that the model gave.</p>"}</div><div class="tbl-wrap"><table><thead><tr>${ecols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rowsHtml}</tbody></table></div><p class="mini">Green cells agree. Red cells show the expected value, then the value that the model gave.</p>`}
