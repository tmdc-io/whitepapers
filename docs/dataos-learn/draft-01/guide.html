    w.querySelector("#trun").onclick=run;w.querySelector("#treset").onclick=reset;w.querySelector("#bug1").onchange=yaml;w.querySelector("#bug2").onchange=yaml;reset()}

  function assert(){qb.append(h(`<div class="prose"><p>An <span class="term">assertion</span> is a rule that real data must obey. It is a query that finds bad rows. If it finds bad rows and it is <span class="term">blocking</span> (the default), Vulcan stops all children of the table.</p>
     <p>Assertions on an input operate before a model reads the input. Assertions on a model operate right after Vulcan builds the model. Vulcan writes the rows of the model first, then it does the assertions. If an assertion fails, the bad rows are in that table, but the children do not read them. Vulcan also does not record the interval as done, so the next run tries it again.</p>
     <p>Below is the batch of POS orders for 2026-10-08. Add a problem, then click <b>Run</b>. Look where each problem stops.</p></div>`));
    const base=ORDERS.filter(o=>o.order_date==="2026-10-08").slice(0,6).map(o=>({order_id:o.order_id,store_id:o.store_id,product:o.product,amount:o.amount,status:o.status}));
    const w=h(`<div class="stack" style="gap:12px"><div class="row" id="inj"></div><div class="row"><label class="row" style="gap:6px"><input type="checkbox" id="nb"> Make accepted_range on orders non-blocking</label><button class="btn primary" id="ra">Run</button><button class="btn" id="rr">Reset</button></div><div id="rows"></div><div id="ad"></div><div class="cols"><div class="log" id="al"></div><div id="an" class="stack"></div></div></div>`);qb.append(w);
    const inj={nul:["Missing order_id",r=>{r[1].order_id=null;r[1]._bad=["order_id"]}],dup:["Duplicate order_id",r=>{r[3].order_id=r[2].order_id;r[3]._bad=["order_id"];r[2]._bad=["order_id"]}],cents:["Amount in cents (450, not 4.50)",r=>{r.forEach(x=>{x.amount=Math.round(x.amount*100);x._bad=(x._bad||[]).concat("amount")})}]};
    const on=new Set();let rows;
    function build(){rows=base.map(o=>({...o}));on.forEach(k=>inj[k][1](rows));w.querySelector("#rows").innerHTML=table(rows,["order_id","store_id","product","amount","status"]);drawDag(w.querySelector("#ad"),{});w.querySelector("#al").innerHTML=`<span class="muted">Click Run.</span>`;w.querySelector("#an").innerHTML=""}
    Object.entries(inj).forEach(([k,[t]])=>{const c=h(`<button class="chip" aria-pressed="false">${t}</button>`);c.onclick=()=>{on.has(k)?on.delete(k):on.add(k);c.setAttribute("aria-pressed",on.has(k));build()};w.querySelector("#inj").append(c)});
    w.querySelector("#rr").onclick=()=>{on.clear();w.querySelectorAll("#inj .chip").forEach(c=>c.setAttribute("aria-pressed","false"));w.querySelector("#nb").checked=false;build()};
    w.querySelector("#ra").onclick=()=>{const log=w.querySelector("#al");log.innerHTML="";const L=(t,c="")=>log.append(h(`<div class="${c}">${t}</div>`));
      const nb=w.querySelector("#nb").checked;const states={},labels={},msgs=[];const later=["daily_sales","sales","weekly_revenue"];
      const nn=rows.filter(r=>r.order_id==null).length;const ids=rows.map(r=>r.order_id).filter(x=>x!=null);const du=ids.length-new Set(ids).size;
      L("pos_orders (input): assertions for 2026-10-08.");
      if(nn||du){L(nn?`assertion not_null: failed, ${nn} row`:"assertion not_null: passed",nn?"bad":"ok");L(du?`assertion unique_values: failed, ${du*2} rows`:"assertion unique_values: passed",du?"bad":"ok");
        states.pos_orders="bad";labels.pos_orders="assertion failed";["orders",...later].forEach(d=>{states[d]="idle";labels[d]="skipped"});
        L("orders: skipped, because its input failed. Silver does not change.","bad");L("daily_sales: skipped.","bad");L("Run failed. The problem stopped at bronze.","bad");
        if(nn)msgs.push(["bad","pos_orders","not_null",nn,"The silver and gold tables did not change."]);if(du)msgs.push(["bad","pos_orders","unique_values",du*2,"The silver and gold tables did not change."])}
      else{L("assertions not_null and unique_values: passed","ok");states.pos_orders="ok";labels.pos_orders="passed";
        const ar=rows.filter(r=>r.amount<0||r.amount>100).length;L(`orders (silver): build 2026-10-08. Rows written: ${rows.length}.`);L("assertion not_null: passed","ok");
        if(!ar){L("assertion accepted_range: passed","ok");states.orders="ok";labels.orders="passed";states.daily_sales="ok";labels.daily_sales="built";L("daily_sales (gold): built.","ok");L("Run finished.","ok")}
        else if(!nb){L(`assertion accepted_range: failed, ${ar} rows (blocking)`,"bad");states.orders="bad";labels.orders="assertion failed";later.forEach(d=>{states[d]="idle";labels[d]="skipped"});
          L("orders: 2026-10-08 is not recorded as done. The next run tries it again.","bad");L("daily_sales: skipped. Gold keeps the data of 2026-10-07.","bad");L("Run failed. The bad rows stay in silver.","bad");msgs.push(["bad","orders","accepted_range",ar,"Gold and the semantic layer show the last correct data."])}
        else{L(`assertion accepted_range: failed, ${ar} rows (non-blocking, warning only)`,"warn");states.orders="warn";labels.orders="warning";states.daily_sales="bad";labels.daily_sales="has bad data";
          L("daily_sales (gold): built with the bad amounts.","warn");L("Run finished with warnings. The bad rows got to gold.","warn");msgs.push(["warn","orders","accepted_range",ar,"The rule did not block, so the bad amounts are in gold."])}}
      drawDag(w.querySelector("#ad"),{states,labels});
      w.querySelector("#an").innerHTML=msgs.length?msgs.map(([c,mo,a,n,t])=>`<div class="notice ${c}"><span class="who">Slack · audit_failure</span><b>Audit ${a} failed on model ${mo} (${n} row${n>1?"s":""})</b><p class="mini">${t} Module 10 shows who gets this message.</p></div>`).join(""):`<div class="notice ok"><b>All assertions passed.</b> Vulcan sends no message for assertions that pass.</div>`};
    build();
    qb.append(h(`<div class="callout"><b>Where to put which rule.</b> On inputs, examine what the source must always give, such as IDs that exist and are unique. On silver, examine the business rules after your cleaning logic, such as a price range. Then a problem in the source stops at bronze, and a problem in your logic stops at silver. Neither gets to gold.</div>`))}

  function dq(){qb.append(h(`<div class="prose"><p>A <span class="term">data quality check</span> looks for patterns that one row cannot show. Examples are a decrease in the number of orders, or a column that suddenly has new values. Vulcan does the data quality checks after a run or a plan that had no errors. If the run had an error, Vulcan does not do them.</p>
     <p>Data quality checks do not stop data. They record a result (pass, warn or fail) and group it by a dimension such as completeness or validity. Then Vulcan sends a <code>dq_end</code> message. A pattern problem is not blocked, so it can get to gold.</p><p>Click a button to simulate a quiet day at the registers.</p></div>`));
    const counts=DAYS.map((d,k)=>ORDERS.filter(o=>o.order_date===d).length||[24,25][k%2]);let drop=-1;
    const w=h(`<div class="stack" style="gap:12px"><div class="svgwrap" id="ch"></div><div class="row"><button class="btn" id="dr">Simulate a decrease on 10-10</button><button class="btn" id="dn">Usual day</button></div><div id="dqo"></div></div>`);qb.append(w);
    function paint(){const c=counts.map((v,k)=>k===drop?6:v);const W=640,H=200,pl=36,pb=26,max=40,bw=(W-pl-10)/c.length;const y=v=>H-pb-(v/max)*(H-pb-10);const mean=counts.slice(0,9).reduce((a,x)=>a+x)/9;
      let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Orders each day"><rect class="band" x="${pl}" y="${y(mean+8)}" width="${W-pl-10}" height="${y(mean-8)-y(mean+8)}"/>`;
      [0,10,20,30,40].forEach(v=>{s+=`<line class="grid" x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
      c.forEach((v,k)=>{s+=`<rect class="bar${k===drop?" badbar":""}" x="${pl+k*bw+4}" y="${y(v)}" width="${bw-8}" height="${y(0)-y(v)}" rx="2"/><text x="${pl+k*bw+bw/2}" y="${H-8}" text-anchor="middle">${DAYS[k].slice(5)}</text>`});
      s+=`<text x="${W-14}" y="${y(mean+8)-4}" text-anchor="end">usual range</text></svg>`;w.querySelector("#ch").innerHTML=s;
      w.querySelector("#dqo").innerHTML=drop<0?`<div class="notice ok"><span class="who">Slack · dq_end</span><b>bean_internal.orders: 2 of 2 checks passed</b><span class="mini">normal_order_volume: pass · known_status: pass</span></div>`:`<div class="notice warn"><span class="who">Slack · dq_end</span><b>bean_internal.orders: 1 of 2 checks failed</b><span class="mini">normal_order_volume: fail (6 rows, much less than the usual 20 to 35) · known_status: pass</span><p class="mini">The run passed, and Vulcan built gold. A person must now examine the registers.</p></div>`}
    w.querySelector("#dr").onclick=()=>{drop=9;paint()};w.querySelector("#dn").onclick=()=>{drop=-1;paint()};paint();
    qb.append(h(`<div class="callout warn"><b>Assertion or data quality check?</b> Use an assertion when one bad row is sufficient to stop the data, for example a missing ID. Use a data quality check when the problem is a pattern, for example fewer orders than usual.</div>`))}
  show("test");
  m.append(h(`<div class="callout"><b>What this gives you for MTTD.</b> Without these checks, the person who finds a problem is usually the person who reads the dashboard. With them, Vulcan finds the problem in the run that brings the bad data.</div>`));
  m.append(quiz([{q:"When does Vulcan do the unit tests?",o:["During the plan, before it builds anything","After each run","Only at night"],a:0,w:"A failed test stops the plan."},
   {q:"Why must the test of daily_sales give rows for customers and stores?",o:["Because daily_sales reads those tables","Because all tests need three tables","It is not necessary"],a:0,w:"A test gives input rows for each table that the model reads."},
   {q:"The POS system sends an order with no order_id. Where does Vulcan stop it?",o:["At the input pos_orders, before silver runs","In gold","Vulcan does not stop it"],a:0,w:"The not_null assertion on the input fails, so the children do not run."},
   {q:"An assertion on orders fails, and it is blocking. Where are the bad rows?",o:["In all tables after orders","Only in the silver table orders","In no table"],a:1,w:"Vulcan writes orders, then the assertion fails, and Vulcan skips gold."},
   {q:"The number of orders decreases by 75% on one day. Which check finds it?",o:["not_null","A data quality check for anomalies on row_count","The linter"],a:1,w:"No single row is wrong. Only the pattern is wrong."},
   {"q": "What does a unit test use as input?", "o": ["Rows from the warehouse", "Fixed rows that you write in the test", "The rows of yesterday"], "a": 1, "w": "A unit test does not use warehouse data. It proves the logic with rows that you know."},
   {"q": "Does a data quality check stop the run?", "o": ["Yes, always", "No. It records pass, warn or fail, and sends a message", "Only on gold tables"], "a": 1, "w": "Assertions stop the run. Data quality checks report."},
   {"q": "Where can you write an assertion?", "o": ["In the MODEL block, in an input file, or as a standalone file in audits/", "Only in config.yaml", "Only in tests/"], "a": 0, "w": "All three places run the same kind of rule on real data."}]));
  m.append(nextBtn(i));return m}

/* ---------- 10 Notifications ---------- */
const EVENTS=[["run_start","A run started"],["run_end","A run finished"],["run_failure","A run failed"],["audit_failure","An assertion failed"],["plan_change","A plan was applied with changes"],["apply_failure","A plan failed"],["dq_end","Data quality checks finished"]];
function mNotify(i){
  const m=section(eb(i),"Tell the correct people at the correct time.");
  m.append(concept("Why notifications",`<div class="prose"><p>A check that finds a problem is useful only when a person knows about it. If nobody reads the result, MTTD stays long. Vulcan sends a message for each important <span class="term">event</span>, for example a failed run or a failed assertion.</p></div>`));
  m.append(concept("Events, targets and owners",`<div class="prose"><p>Three parts control the messages:</p>
   <ul><li>An <span class="term">event</span> is a thing that occurs in Vulcan. Examples are <code>run_failure</code>, <code>audit_failure</code>, <code>plan_change</code> and <code>dq_end</code>.</li>
   <li>A <span class="term">target</span> is a place that gets messages: a Slack channel, a Microsoft Teams channel, e-mail, a CloudEvents endpoint, or the console. Each target has a list of the events that it gets, in <code>notifyOn</code>.</li>

    <rect class="fbox" x="250" y="20" width="200" height="54" rx="8" fill="var(--surface)"/><text class="ft" x="350" y="43" text-anchor="middle">Project targets</text><text class="fs" x="350" y="61" text-anchor="middle">notificationTargets</text>
    <rect class="fbox" x="250" y="122" width="200" height="54" rx="8" fill="var(--surface)"/><text class="ft" x="350" y="145" text-anchor="middle">Targets of the owner</text><text class="fs" x="350" y="163" text-anchor="middle">only for audit_failure</text>
    <rect class="fbox" x="560" y="20" width="200" height="54" rx="8" fill="var(--ok-soft)"/><text class="ft" x="660" y="43" text-anchor="middle">#data-alerts</text><text class="fs" x="660" y="61" text-anchor="middle">if the event is in notifyOn</text>
    <rect class="fbox" x="560" y="122" width="200" height="54" rx="8" fill="var(--ok-soft)"/><text class="ft" x="660" y="145" text-anchor="middle">E-mail to Emily</text><text class="fs" x="660" y="163" text-anchor="middle">if the event is in notifyOn</text>
    <path class="fa" d="M162,90 C200,90 210,47 247,47" marker-end="url(#ar)"/><path class="fa" d="M162,104 C200,104 210,149 247,149" marker-end="url(#ar)"/>
    <path class="fa" d="M452,47 L557,47" marker-end="url(#ar)"/><path class="fa" d="M452,149 L557,149" marker-end="url(#ar)"/></svg></div>`));
  m.append(concept("The configuration",`<pre>notificationTargets:
  - type: slack_webhook
    url: "{{ env_var('SLACK_WEBHOOK_URL') }}"
    notifyOn: [run_failure, audit_failure, plan_change, dq_end]

users:
  - username: emily
    email: emily@beanstreet.example

      - type: smtp

        user: vulcan
        password: "{{ env_var('SMTP_PASSWORD') }}"
        sender: vulcan@beanstreet.example
        notifyOn: [audit_failure]</pre>
   <div class="prose"><p>The e-mail target of Emily has no <code>recipients</code>. In that case, Vulcan sends the e-mail to the <code>email</code> of the user. Each model has an <code>owner</code>. If a model has no owner, Vulcan uses <code>modelDefaults.owner</code>, or the first user in the list.</p></div>`));
  const b=h(`<div class="bench flat"><div class="bench-head"><h3>Route the messages</h3><span class="tag">set the targets, then make events occur</span></div>
   <div class="cols"><div class="stack"><h4>Slack channel #data-alerts</h4><div class="row" id="sev"></div>
    <h4>Teams channel Bean Ops</h4><div class="row" id="tev"></div>
    <h4>E-mail of Emily (owner of orders)</h4><div class="row" id="mev"></div></div>
    <div class="stack"><h4>Make an event occur</h4><div class="row" id="fire"></div><div id="inbox" class="stack"></div><h4>The configuration that you made</h4><pre id="ncfg"></pre></div></div></div>`);m.append(b);
  const cfg={slack:new Set(["run_failure","audit_failure","plan_change","dq_end"]),teams:new Set(["run_end"]),emily:new Set(["audit_failure"])};
  const chips=(key,el)=>{EVENTS.forEach(([e])=>{const c=h(`<button class="chip" aria-pressed="${cfg[key].has(e)}">${e}</button>`);c.onclick=()=>{cfg[key].has(e)?cfg[key].delete(e):cfg[key].add(e);c.setAttribute("aria-pressed",cfg[key].has(e));yaml()};el.append(c)})};
  chips("slack",b.querySelector("#sev"));chips("teams",b.querySelector("#tev"));chips("emily",b.querySelector("#mev"));
  function yaml(){const L=s=>"["+[...s].join(", ")+"]";
    b.querySelector("#ncfg").textContent=`notificationTargets:\n  - type: slack_webhook\n    url: \"{{ env_var('SLACK_WEBHOOK_URL') }}\"\n    notifyOn: ${L(cfg.slack)}\n  - type: teams_webhook\n    url: \"{{ env_var('TEAMS_WEBHOOK_URL') }}\"\n    notifyOn: ${L(cfg.teams)}\n\nusers:\n  - username: emily\n    email: emily@beanstreet.example\n    notificationTargets:\n      - type: smtp\n        ...\n        notifyOn: ${L(cfg.emily)}`}
  const TEXT={run_start:"Vulcan run started.",run_end:"Vulcan run finished.",run_failure:"Vulcan run failed. 1 model failed: bean_internal.orders.",audit_failure:"Audit accepted_range failed on model bean_internal.orders (6 rows).",plan_change:"Plan applied: 1 model directly modified, 3 downstream affected, breaking.",apply_failure:"Plan apply failed.",dq_end:"Data quality: 2 checks, 1 passed, 1 failed. Score 50%."};
  EVENTS.forEach(([e,t])=>{const c=h(`<button class="btn">${t}</button>`);c.onclick=()=>{const out=[];
    if(cfg.slack.has(e))out.push(["ok","Slack #data-alerts",TEXT[e]]);
    if(cfg.teams.has(e))out.push(["ok","Teams Bean Ops",TEXT[e]]);
    if(cfg.emily.has(e))out.push(e==="audit_failure"?["ok","E-mail to emily@beanstreet.example",TEXT[e]+" You are the owner of this model."]:["idle","E-mail to Emily","Not sent. Vulcan sends events to the targets of an owner only for assertion failures."]);
    b.querySelector("#inbox").innerHTML=`<p class="mini">Event: <code>${e}</code></p>`+(out.length?out.map(([c,w,t])=>`<div class="notice ${c}"><span class="who">${w}</span><p>${t}</p></div>`).join(""):`<div class="notice idle"><p>No target lists this event. Nobody gets a message.</p></div>`)};b.querySelector("#fire").append(c)});
  yaml();
  m.append(quiz([{q:"Which part of the configuration tells Vulcan which events a target gets?",o:["notifyOn","owner","modelDefaults"],a:0,w:"Each target lists its events in notifyOn."},
   {q:"A Teams target has notifyOn: [run_end]. When does it get a message?",o:["After each run","Only when a run fails","Never"],a:0,w:"run_end occurs at the end of each run, so the target gets a message each time."},
   {q:"For which event does Vulcan also send a message to the targets of the model owner?",o:["run_start","audit_failure","plan_change"],a:1,w:"Only assertion failures go to the owner."},
   {q:"The e-mail target of a user has no recipients. Where does the e-mail go?",o:["Nowhere","To the email of that user","To all users"],a:1,w:"Vulcan uses the email of the user."},
   {"q": "Which types of target can Vulcan send to?", "o": ["Slack, Microsoft Teams, e-mail, CloudEvents and the console", "Only e-mail", "Only Slack"], "a": 0, "w": "Each target has its own notifyOn list."},
   {"q": "No target lists the event apply_failure. What occurs when a plan fails?", "o": ["Nobody gets a message", "Vulcan sends it to all targets", "Vulcan stops the next run"], "a": 0, "w": "Add the event to notifyOn of a target to get a message."},
   {"q": "A model has no owner. Who is its owner?", "o": ["modelDefaults.owner, or else the first user in the list", "Nobody", "The user who made the last change"], "a": 0, "w": "Each model has an owner, so assertion failures always reach a person."}]));
  m.append(nextBtn(i));return m}

/* ---------- 11 Semantics ---------- */
function mSemantics(i){
  const m=section(eb(i),"Define revenue one time. All consumers get the same number.");
  m.append(concept("The problem",`<div class="prose"><p>Without a semantic layer, each dashboard has its own SQL for revenue. One team leaves out refunds and a different team does not. Both teams show a number with the name revenue, and the numbers are different.</p></div>`));
  m.append(concept("The semantic layer",`<div class="prose"><p>A <span class="term">semantic model</span> gives business names to the columns of a gold table. It has four types of members:</p>
   <ul><li>A <span class="term">dimension</span> is a way to group, for example store or product.</li><li>A <span class="term">measure</span> is a value that you add up, for example total revenue.</li><li>A <span class="term">segment</span> is a saved filter, for example completed orders only.</li><li>A <span class="term">join</span> connects two semantic models.</li></ul>
   <p>A <span class="term">metric</span> is one measure over time, for example revenue for each week. Consumers ask for members by name, and Vulcan writes the SQL.</p>
   <p>During each plan, Vulcan makes sure that each member points to a real column. If a change removes a column that a measure uses, the plan stops (Module 8).</p></div>
   ${flow([{t:"daily_sales",s:"gold table",tone:"gold"},{t:"sales",s:"semantic model",tone:"sem"},{t:"weekly_revenue",s:"metric",tone:"sem"},{t:"APIs",s:"SQL, REST, GraphQL",tone:"accent"}],{caption:"Consumers use the APIs. The APIs use the semantic model. The semantic model reads only gold."})}`));
  m.append(concept("Write a semantic model",`<div class="prose"><p>A semantic model is a YAML file, usually in <code>models/semantics/</code>. It names one physical model in <code>depends_on</code>, and it describes the columns of that model as business members. The physical model must declare its <code>grains</code>, so that Vulcan knows what one row is.</p></div>
   <pre data-lang="yaml">kind: semantic
name: sales                       # the name that consumers use
depends_on: bean_street.daily_sales
description: Sales for each store, product, day and loyalty tier.

dimensions:
  - store_name                    # short form: a column name
  - product
  - name: order_date              # long form: a column with more detail
    description: Day of the order.
  - name: store_id
    behavior:
      type: identifier            # a key: for filters, not for groups
  - loyalty_tier
  - status

measures:
  - name: total_revenue
    type: sum
    expression: "{sales.revenue}" # a column, as {model.column}
    description: Revenue in euros, with tax.
    behavior:
      type: flow                  # can be added across days
  - name: order_count
    type: sum
    expression: "{sales.order_count}"
    behavior:
      type: flow
  - name: avg_order_value
    type: number
    expression: "SUM({sales.revenue}) / NULLIF(SUM({sales.order_count}), 0)"
    behavior:
      type: ratio                 # calculate from the parts
      numerator: total_revenue
      denominator: order_count
  - name: completed_revenue
    type: sum
    expression: "{sales.revenue}"
    filters:
      - "status = 'completed'"    # only these rows

segments:
  - name: completed
    expression: "status = 'completed'"</pre>
   <div class="prose"><ul>
   <li><b>Dimensions</b> are the ways to group and filter. The short form is a column name. The long form adds a <code>description</code>, a <code>format</code>, time <code>granularities</code>, or a <code>behavior</code> type: <code>categorical</code>, <code>identifier</code>, <code>ordinal</code> or <code>bucketing</code>.</li>
   <li><b>Measures</b> are the values that you add up. The <code>type</code> is one of <code>count</code>, <code>count_distinct</code>, <code>count_distinct_approx</code>, <code>sum</code>, <code>avg</code>, <code>min</code>, <code>max</code> or <code>number</code>. The <code>expression</code> refers to columns as <code>{sales.revenue}</code>. <code>filters</code> limit the rows of one measure. <code>behavior</code> tells how the measure adds up. The next section shows this.</li>
   <li><b>Segments</b> are saved filters that consumers can add to any question.</li>
   <li><b>Joins</b> connect two semantic models: <code>name</code> (the other model), <code>type</code> (<code>many_to_one</code>, <code>one_to_many</code> or <code>one_to_one</code>) and <code>on</code> (the column or condition). Then consumers can group by the dimensions of the other model.</li>
   <li><b>Rollups</b> are summaries that Vulcan calculates before the query, so that frequent questions are fast. <a href="${DOC}/models/semantic-models/rollups" target="_blank" rel="noopener">Read more about rollups in the documentation.</a></li></ul></div>
`));
  m.append(concept("How a measure adds up",`<div class="prose"><p>A person, a dashboard or an AI agent often asks for a measure over a longer period, for example a month. Some measures can be added across days, and some cannot. The <code>behavior</code> of a measure tells consumers and AI agents which rule to use. Vulcan includes it in the metadata of the data product.</p></div>
   <table><thead><tr><th>Type</th><th>What the measure is</th><th>Rule</th><th>Example</th></tr></thead><tbody>
   <tr><td><code>simple</code></td><td>A value that adds up</td><td>Add it across any dimension.</td><td>Number of stores</td></tr>
   <tr><td><code>flow</code></td><td>An amount in a period</td><td>Add it across days.</td><td><code>total_revenue</code>, <code>order_count</code></td></tr>
   <tr><td><code>stock</code></td><td>A level at one point in time</td><td>Do not add it across days. Take the value at the end, the start or the average of the period.</td><td>Active loyalty members</td></tr>
   <tr><td><code>ratio</code></td><td>One measure divided by another</td><td>Calculate it from the two parts for the period. Do not take the average of daily ratios.</td><td><code>avg_order_value</code></td></tr>
   <tr><td><code>derived</code></td><td>A calculation from other measures</td><td>Calculate each part with its own rule, then combine them.</td><td>Revenue minus refunds</td></tr></tbody></table>
   <div class="prose"><p>An example: Bean Street has 1,200 active loyalty members on each day of September. A person asks for active members in September. If the agent adds the 30 daily values, it answers 36,000. With <code>stock</code> and <code>period_treatment: last</code>, it takes the value of 30 September: 1,200.</p></div>
   <pre data-lang="yaml">measures:
  - name: active_members
    type: count_distinct
    expression: "{members.customer_id}"
    behavior:
      type: stock
      time_dimension: snapshot_date   # the date of each level
      period_treatment: last          # last, avg or first
      period_grain: day               # one level for each day</pre>
   <div class="prose"><ul><li>A <code>stock</code> measure needs <code>time_dimension</code>, <code>period_treatment</code> and <code>period_grain</code>.</li>
   <li>A <code>ratio</code> measure needs <code>numerator</code> and <code>denominator</code>, the names of two other measures.</li>
   <li>A <code>derived</code> measure lists its parts in <code>measure_refs</code>.</li>
   <li>Only <code>simple</code> and <code>flow</code> measures are additive. Vulcan sets <code>is_additive</code> from the type.</li></ul></div>`));
  m.append(concept("Write a metric",`<div class="prose"><p>A metric is a YAML file, usually in <code>models/metrics/</code>. It takes one measure and puts it on a time axis.</p></div>
   <pre data-lang="yaml">kind: metric
name: weekly_revenue
measure: sales.total_revenue      # model.measure
ts: sales.order_date              # the time dimension
granularity: week                 # second, minute, hour, day, week, month, quarter or year
description: Revenue for each week for all stores.
dimensions:
  - sales.store_name              # optional: ways to slice the metric
segments:
  - sales.completed               # optional: saved filters</pre>
   <div class="prose"><p>Use a metric when people ask for the same number over time again and again, for example in a weekly report or in a question to an AI agent. The metric fixes the measure, the time column and the time grain, so all consumers get the same series.</p></div>`));
  m.append(concept("What the plan examines",`<div class="prose"><p>During each plan, Vulcan makes sure that the semantic layer agrees with the physical models. The plan stops when:</p><ul>
   <li>a dimension names a column that does not exist;</li><li>a reference such as <code>{sales.revenu}</code> points to nothing;</li><li>two members (dimensions, measures or segments) have the same name;</li><li>the <code>ts</code> of a metric is not a date or a timestamp;</li><li>the physical model has no <code>grains</code>.</li></ul></div>`));
  const SB_COLS={store_id:"varchar",store_name:"varchar",product:"varchar",order_date:"date",status:"varchar",loyalty_tier:"varchar",revenue:"decimal",order_count:"bigint"};
  const sb={dims:{store_name:"",product:"",order_date:"",loyalty_tier:"",status:"",store_id:"identifier"},meas:[["total_revenue","sum","{sales.revenue}",{type:"flow"}],["order_count","sum","{sales.order_count}",{type:"flow"}]],seg:["completed","status = 'completed'"],metric:{measure:"total_revenue",ts:"order_date",gran:"week"}};
  const bb=h(`<div class="bench"><div class="bench-head"><h3>Build the sales model</h3><span class="tag">select, type, and read the result</span></div>
   <div class="stack"><h4>Dimensions: columns of bean_street.daily_sales</h4><div id="sbd" class="tbl-wrap"></div>
   <h4>Measures</h4><div id="sbm" class="stack" style="gap:6px"></div><div class="row"><button class="btn" id="sbadd">Add a measure</button></div>
   <h4>Segment</h4><div class="row"><input type="text" id="sbsn" aria-label="Segment name" style="width:160px"><input type="text" id="sbse" aria-label="Segment expression" style="flex:1"></div>
   <h4>Metric</h4><div class="row"><label for="sbmm">measure</label><select id="sbmm"></select><label for="sbts">ts</label><select id="sbts"></select><label for="sbg">granularity</label><select id="sbg">${["day","week","month","quarter","year"].map(g=>`<option>${g}</option>`).join("")}</select></div>
   <h4>Result of the plan</h4><div id="sbv" class="stack"></div>
   <h4>models/semantics/sales.yml</h4><pre id="sby" data-lang="yaml"></pre>
   <h4>models/metrics/sales_metric.yml</h4><pre id="sbmy" data-lang="yaml"></pre></div></div>`);m.append(bb);
  bb.querySelector("#sbsn").value=sb.seg[0];bb.querySelector("#sbse").value=sb.seg[1];
  bb.querySelector("#sbsn").oninput=e=>{sb.seg[0]=e.target.value;sbOut()};bb.querySelector("#sbse").oninput=e=>{sb.seg[1]=e.target.value;sbOut()};

/* ---------- 12 Access policies ---------- */
const PEOPLE=[["Rui","finance team","bean:finance"],["Ana","manager of the Market store","bean:store:S2"],["Partner Co","delivery partner","bean:partner"],["Joe","new employee","bean:staff"]];
function mPolicies(i){
  const m=section(eb(i),"Control who sees which rows and columns.");
  m.append(concept("The problem",`<div class="prose"><p>Many people use the same data product. Finance must see all stores. A store manager must see only the store that they manage. A delivery partner can see sales, but must not see the loyalty tier of customers. One table cannot serve all three groups without rules.</p></div>`));
  m.append(concept("How access works in Vulcan",`<div class="prose"><p>When a person sends a query to a Vulcan API, four steps occur:</p>
   <ol><li>The DataOS authorization service identifies the person and gives Vulcan the tags of the person.</li><li>Your <span class="term">auth extension</span>, a Python function, reads the tags and gives back a <span class="term">security context</span>. The security context has a group, and more values if necessary, for example a store ID.</li><li>The <span class="term">access policy</span> of the model finds the rule for that group. The rule can add a row filter and hide columns.</li><li>Vulcan changes the query so that it obeys the rule. Then it sends the query to the engine.</li></ol></div>
   ${flow([{t:"Person",s:"sends a query"},{t:"DataOS auth",s:"tags of the person"},{t:"Your extension",s:"group, store_id",tone:"accent"},{t:"Policy",s:"filter and mask",tone:"accent"},{t:"Engine",s:"changed query",tone:"ok"}],{w:140,gap:40,caption:"The path of an API query. Your extension and your policy decide what the person sees."})}
   <div class="callout warn"><b>Policies apply to the APIs only.</b> They apply to the SQL, REST and GraphQL APIs of Vulcan. They do not apply when a person reads the warehouse directly, and they do not apply to builds. Give consumers access through the APIs, not to the warehouse tables.</div>`));
  m.append(concept("Write the policy",`<pre>${esc(FILES["policies/daily_sales_access.yml"].text)}</pre><div class="prose">
   <ul><li><code>depends_on</code> names the physical model that the policy protects. A model can have only one policy.</li><li>Each rule names one group. A group with no filter and no mask sees all rows and columns.</li><li><code>filter</code> keeps only the rows that agree with the condition. The value <code>{securityContext.store_id}</code> comes from the extension. Other operators include <code>notEquals</code>, <code>in</code>, <code>gt</code> and <code>beforeDate</code>, and you can combine conditions with <code>and</code> and <code>or</code>.</li><li><code>mask</code> lists the columns to hide for the group.</li><li>A group that is not in the list gets no access. If the extension gives no group, the person gets no access.</li></ul></div>`));
  m.append(concept("Tell Vulcan how to hide a column",`<div class="prose"><p>The policy says which group gets a hidden column. The MODEL block says what a hidden column contains, with <code>column_mask_expressions</code>. If a policy hides a column with no mask expression, the query fails.</p></div><pre>MODEL (
  name bean_street.daily_sales,
  ...
  column_mask_expressions (
    loyalty_tier = 'hidden'
  )
);</pre>`));
  m.append(concept("Write the auth extension",`<div class="prose"><p>The extension is a Python function in the <code>plugins/</code> folder. Vulcan calls it after the DataOS authorization service accepts the request. Register it in <code>config.yaml</code> with the format <code>module:function</code>:</p></div><pre>afterAuthorize: "plugins.auth_ext:resolve_user_groups"</pre>
   <pre>${esc(FILES["plugins/auth_ext.py"].text)}</pre>
   <div class="prose"><p>The function gets an <code>AuthExtensionContext</code> with three values: <code>user_id</code>, <code>user_tags</code> and <code>request_headers</code>. It gives back a <code>SecurityContext</code>. The first value is <code>group</code>. You can add more values, for example <code>store_id</code>. The names of these values must be in lowercase with underscores, with a maximum of 32 characters. The values must be text, numbers or true and false.</p>
   <p>The extension and the authorization service together have a time limit, 10 seconds by default. Keep the function fast, and do not call slow services from it.</p></div>`));
  const b=h(`<div class="bench flat"><div class="bench-head"><h3>Who sees what</h3><span class="tag">select a person, or type tags</span></div>
   <div class="row" id="pp"></div><div class="row"><label for="tags">Tags of the person</label><input type="text" id="tags" style="flex:1;min-width:200px"><button class="btn primary" id="ask">Send the query</button></div>
   <pre>SELECT store_name, loyalty_tier, SUM(revenue) AS revenue
FROM bean_street.daily_sales
GROUP BY 1, 2</pre>
   <div class="cols"><div class="stack"><h4>1. Your extension gives back</h4><pre id="ctx"></pre><h4>2. The rule of the policy</h4><div id="rule"></div></div><div class="stack"><h4>3. The result</h4><div id="pres"></div></div></div></div>`);m.append(b);
  PEOPLE.forEach(([n,r,t])=>{const c=h(`<button class="chip">${n}, ${r}</button>`);c.onclick=()=>{b.querySelectorAll("#pp .chip").forEach(x=>x.setAttribute("aria-pressed","false"));c.setAttribute("aria-pressed","true");b.querySelector("#tags").value=t;ask()};b.querySelector("#pp").append(c)});
  function ask(){const tags=b.querySelector("#tags").value.split(/[\s,]+/).filter(Boolean);let ctx;
    if(tags.includes("bean:finance"))ctx={group:"finance"};else{const st=tags.filter(t=>t.startsWith("bean:store:")).map(t=>t.slice(11));if(st.length)ctx={group:"store_manager",store_id:st[0]};else if(tags.includes("bean:partner"))ctx={group:"partner"};else ctx={group:""}}
    b.querySelector("#ctx").textContent=`SecurityContext(${Object.entries(ctx).map(([k,v])=>`${k}="${v}"`).join(", ")})`;
    const R={finance:"<p><b>finance</b>: no filter, no mask. All rows and columns.</p>",store_manager:`<p><b>store_manager</b>: filter <code>store_id equals {securityContext.store_id}</code>, which is <code>${esc(ctx.store_id||"")}</code>.</p>`,partner:"<p><b>partner</b>: mask <code>loyalty_tier</code>. The column shows the mask expression <code>'hidden'</code>.</p>"};
    b.querySelector("#rule").innerHTML=R[ctx.group]||`<div class="notice bad"><p>The group ${ctx.group?`<code>${esc(ctx.group)}</code>`:"is empty, and it"} is not in the policy. Vulcan refuses the query.</p></div>`;
    if(!R[ctx.group]){b.querySelector("#pres").innerHTML=`<div class="notice bad"><span class="who">API response</span><b>Access denied</b><p>The person has no rule for bean_street.daily_sales.</p></div>`;return}
    const g=new Map();ORDERS.filter(o=>ctx.group!=="store_manager"||o.store_id===ctx.store_id).forEach(o=>{const tier=ctx.group==="partner"?"hidden":o.loyalty_tier;const k=STORES[o.store_id]+"|"+tier;const c=g.get(k)||{store_name:STORES[o.store_id],loyalty_tier:tier,revenue:0};c.revenue+=o.amount;g.set(k,c)});
    const rows=[...g.values()].map(r=>({...r,revenue:money(r.revenue)}));
    b.querySelector("#pres").innerHTML=(rows.length?table(rows,["store_name","loyalty_tier","revenue"]):`<div class="notice warn"><p>The filter keeps no rows. No store has the ID <code>${esc(ctx.store_id)}</code>.</p></div>`)}
  b.querySelector("#ask").onclick=ask;b.querySelector("#pp .chip").click();
  m.append(quiz([{q:"Joe has no tag that the extension knows. What does Joe see?",o:["All rows","No rows, because the query is refused","Only his store"],a:1,w:"A group that is not in the policy gets no access."},
   {q:"Where do you tell Vulcan what a hidden column contains?",o:["In the policy, under mask","In column_mask_expressions in the MODEL block","In config.yaml"],a:1,w:"The policy says who. The MODEL block says what."},
   {q:"Where does the value of {securityContext.store_id} come from?",o:["From the auth extension","From the warehouse","From the cron"],a:0,w:"The extension adds store_id to the security context."},
   {q:"An analyst reads bean_street.daily_sales directly in the warehouse. Does the policy apply?",o:["Yes","No, policies apply only to the Vulcan APIs","Only for finance"],a:1,w:"Give consumers access through the APIs."},
   {q:"How do you register the extension?",o:["afterAuthorize: \"plugins.auth_ext:resolve_user_groups\" in config.yaml","In the policy file","In the MODEL block"],a:0,w:"The format is module:function."},
   {"q": "A partner reads daily_sales through the API. What does the partner see in loyalty_tier?", "o": ["The real tier", "The value hidden, because of the mask", "An error"], "a": 1, "w": "The mask expression in the MODEL block replaces the value for groups that must not see it."},
   {"q": "A group is not in the list of the policy. What does it get?", "o": ["All rows", "No access", "Only the hidden columns"], "a": 1, "w": "A policy gives access only to the groups that it names."}]));
  m.append(nextBtn(i));return m}

/* ---------- 13 AI readiness ---------- */
const MEMBERS_AI=[["store_name","dimension"],["product","dimension"],["order_date","dimension"],["status","dimension"],["loyalty_tier","dimension"],["total_revenue","measure"],["order_count","measure"]];
function mAI(i){
  const m=section(eb(i),"Help AI agents give correct answers.");
  m.append(concept("Why AI readiness",`<div class="prose"><p>People ask questions in plain language, for example "what was our coffee income last week?". An AI agent changes the question into a query on the semantic layer. The agent knows only what the data product tells it.</p><p>If a measure has only a name, the agent must guess. It can select the wrong measure, or leave out refunds. If the measure has instructions, other names and example questions, the agent selects correctly.</p></div>`));
  m.append(concept("What you give to AI agents",`<div class="prose"><p>Vulcan reads three sources of meaning:</p>
   <ol><li><b>AI context</b> on semantic models, metrics, and each dimension and measure. It has <code>instructions</code>, <code>synonyms</code> (other names that people use), <code>caveats</code> (limits of the data), and <code>examples</code> (questions with their queries).</li>
   <li><b>Data product metadata</b> in <code>config.yaml</code>: description, domain, tags, business terms, SLA, owners and support. Two more files can give more detail. <code>usage.yml</code> tells what the data product is good for and not good for. <code>agreement.md</code> is the agreement with consumers.</li>
   <li><b>Descriptions</b> on each model and column.</li></ol>
   <p>Profiles in the data quality file also help. They give value ranges and empty values for each column, so a person or an agent can see what the data looks like.</p></div>`));
  m.append(concept("AI context in YAML",`<pre>measures:
  - name: total_revenue
    type: sum
    expression: "{sales.revenue}"
    ai_context:
      instructions: >
        Revenue in euros, with tax. Use the completed segment
        to leave out refunds.
      synonyms: [income, takings, sales amount]
      caveats:
        - Data for today is not complete until the stores close.
      examples:
        - description: revenue for each store last week
          format: sql
          query: |
            SELECT sales.store_name, MEASURE(sales.total_revenue)
            FROM sales WHERE completed IS TRUE GROUP BY 1;</pre>`));
  const b=h(`<div class="bench flat"><div class="bench-head"><h3>AI readiness of the sales model</h3><span class="tag">select what each member has</span></div>
   <p class="mini">A member passes when it has instructions, synonyms and examples. The tier comes from the percent of members that pass.</p>
   <div class="tbl-wrap"><table><thead><tr><th>member</th><th>type</th><th>instructions</th><th>synonyms</th><th>examples</th><th>passes</th></tr></thead><tbody id="aib"></tbody></table></div>
   <div class="stack"><div class="row"><b id="aitier"></b><span class="mini" id="aipct"></span></div><div class="meter"><i id="aibar"></i></div></div></div>`);m.append(b);
  const st=MEMBERS_AI.map(([n,t],k)=>({n,t,ins:k===5,syn:k===5,ex:k===5}));
  function paint(){b.querySelector("#aib").innerHTML=st.map((r,k)=>{const pass=r.ins&&r.syn&&r.ex;return`<tr><td><code>${r.n}</code></td><td>${r.t}</td>${["ins","syn","ex"].map(f=>`<td><input type="checkbox" data-k="${k}" data-f="${f}" ${r[f]?"checked":""} aria-label="${r.n} ${f}"></td>`).join("")}<td>${pass?'<span class="pill ok">yes</span>':'<span class="pill idle">no</span>'}</td></tr>`}).join("");
    b.querySelectorAll("#aib input").forEach(x=>x.onchange=()=>{st[+x.dataset.k][x.dataset.f]=x.checked;paint()});
    const p=Math.round(st.filter(r=>r.ins&&r.syn&&r.ex).length/st.length*100);const tier=p>=75?["AGENT-READY","var(--ok)"]:p>=34?["NEEDS WORK","var(--warn)"]:["NOT AGENT-READY","var(--bad)"];
    b.querySelector("#aitier").textContent=tier[0];b.querySelector("#aitier").style.color=tier[1];b.querySelector("#aipct").textContent=`${p}% of members pass. Agent-ready needs 75% or more. Needs work is 34% to 74%.`;b.querySelector("#aibar").style.width=p+"%";b.querySelector("#aibar").style.background=tier[1]}
  paint();
  m.append(h(`<div class="callout"><b>Behavior is also necessary.</b> The count above uses only <code>ai_context</code>. AI agents also read the <code>behavior</code> of each measure, so that they add up numbers correctly over a period. Read <a class="seclink" data-mod="semantics" data-sec="how-a-measure-adds-up" href="#semantics/how-a-measure-adds-up">How a measure adds up</a> in Module 11.</div>`));
  m.append(h(`<div class="callout"><b>For information: vulcan review.</b> Your team can do an AI review of the full data product with the command <code>vulcan review</code>. The review reads the models, the semantic layer, the metadata and the description of the project. It writes a report with findings from blocker to low, in three areas: structure, semantics and the contract with consumers. The report also gives the AI readiness tier that this bench shows. The review uses an AI model that your team sets in the <code>review</code> block of <code>config.yaml</code>. The review does not stop a plan. Its findings are advice.</div>`));
  m.append(quiz([{q:"An agent selects order_count when a person asks for income. What helps the most?",o:["A larger warehouse","Synonyms and instructions on total_revenue","A shorter cron"],a:1,w:"Synonyms tell the agent the other names that people use."},
   {q:"When does a member pass the AI readiness count?",o:["When it has a name","When it has instructions, synonyms and examples","When it has a description only"],a:1,w:"All three parts are necessary."},
   {q:"What percent of members must pass for the tier agent-ready?",o:["34%","50%","75%"],a:2,w:"75% or more is agent-ready."},
   {q:"Does vulcan review stop a plan?",o:["Yes, for blocker findings","No, its findings are advice","Only on Fridays"],a:1,w:"The review operates only when you ask for it."},
   {q:"Which file tells consumers what the data product is not good for?",o:["usage.yml","stores.csv","auth_ext.py"],a:0,w:"usage.yml has good_for and not_for."},
   {"q": "What does ai_context add to a member?", "o": ["Instructions, synonyms and examples for AI agents", "A new column", "A new cron"], "a": 0, "w": "AI agents use this context to pick the correct member for a question."},
   {"q": "When does vulcan review operate?", "o": ["Only when you ask for it", "In each run", "Each hour"], "a": 0, "w": "The review is a command that you start. Its findings are advice."}]));

function mIncident(i){
  const without=[["Thu 06:00","bad","The nightly job loads orders. The POS update sends amounts in cents: a latte costs 450, not 4.50. Nothing examines the values."],["Thu 06:20","bad","The job builds daily sales and updates the revenue dashboard. Revenue for Thursday is 100 times too high."],["Thu 09:30","bad","A finance report uses the dashboard numbers and goes to the leadership team."],["Fri 10:00","warn","A store manager asks why Harbor made approximately 3,000 in one day. A usual day is approximately 30. This is the moment of detection."],["Fri 11:00","warn","An analyst opens four SQL scripts and a BI tool to find the source of the number."],["Fri 15:00","warn","The analyst finds the problem and corrects the script. Nobody knows which tables used the bad data, so the team does the full pipeline again for all days."],["Fri 18:00","ok","The data is correct again. Finance sends a correction for the report."]];
  const withv=[["Thu 06:00","info","Vulcan examines the input pos_orders. Each order has a unique ID, so the input assertions pass."],["Thu 06:01","bad","Vulcan builds orders in silver. The assertion accepted_range (amount from 0 to 100) fails. This is the moment of detection."],["Thu 06:01","bad","Vulcan skips daily_sales in gold. The semantic layer and the dashboard keep the correct data of Wednesday."],["Thu 06:01","warn","A Slack message goes to #data-alerts, and an e-mail goes to Emily, the owner of orders. The message names the model, the assertion and the number of bad rows."],["Thu 08:15","info","Emily opens the query from the message and sees amounts such as 450. Column lineage shows that orders.amount comes from pos_orders.amount. Only rows with pos_version 2.0 are wrong."],["Thu 08:40","info","Emily changes amount in orders: divide by 100 when pos_version is 2.0. She makes the change forward-only. The plan shows that no old day is built again."],["Thu 08:45","ok","Emily restates Thursday for orders. Vulcan builds that one day, the assertions pass, and daily_sales follows."],["Thu 08:55","ok","Emily compares Thursday before and after the correction with table diff. Only the amounts of POS version 2.0 changed. The data quality checks pass."]];
  const m=section(eb(i),"The same bad data, with Vulcan and without Vulcan.","On Thursday, the POS vendor sends an update. The new version sends prices in cents. Click Next event to see the two timelines next to each other.");
  m.append(h(`<div class="callout warn">The times in this example show the order of events. They are not measured results.</div>`));
  const b=h(`<div class="bench flat"><div class="bench-head"><h3>Play the two timelines</h3><span class="tag">click next event</span></div><div class="row"><button class="btn primary" id="ne">Next event</button><button class="btn" id="all">Show all</button><button class="btn" id="rz">Reset</button></div><div class="cols"><div class="lane"><h3>Without Vulcan</h3><div id="lw" class="lane"></div></div><div class="lane"><h3>With Vulcan</h3><div id="lv" class="lane"></div></div></div></div>`);m.append(b);
  let step=0;const lw=b.querySelector("#lw"),lv=b.querySelector("#lv");const ev=x=>h(`<div class="ev ${x[1]}"><div class="t">${x[0]}</div><div class="b">${x[2]}</div></div>`);
  without.forEach(x=>lw.append(ev(x)));withv.forEach(x=>lv.append(ev(x)));const N=Math.max(without.length,withv.length);
  function paint(){[lw,lv].forEach(l=>l.querySelectorAll(".ev").forEach((e,k)=>e.classList.toggle("on",k<step)));b.querySelector("#ne").disabled=step>=N}
  b.querySelector("#ne").onclick=()=>{step++;paint()};b.querySelector("#all").onclick=()=>{step=N;paint()};b.querySelector("#rz").onclick=()=>{step=0;paint()};paint();
  m.append(concept("What changed",`<div class="tbl-wrap"><table class="compare"><thead><tr><th></th><th>Without Vulcan</th><th>With Vulcan</th></tr></thead><tbody>
   <tr><td><b>Who finds it</b></td><td>A store manager who reads a dashboard</td><td>An assertion on silver, in the run that loads the data</td></tr>
   <tr><td><b>When</b></td><td>The next day</td><td>Minutes after the data arrives</td></tr>
   <tr><td><b>What consumers see</b></td><td>Wrong revenue in a dashboard and in a report</td><td>The correct data of the day before, one day late</td></tr>
   <tr><td><b>How the cause is found</b></td><td>A person reads scripts</td><td>The query in the message, and column lineage</td></tr>
   <tr><td><b>What is built again</b></td><td>The full pipeline, all days</td><td>One day of one model, and its children</td></tr>
   <tr><td><b>How the correction is proved</b></td><td>A person compares numbers by hand</td><td>Table diff shows the rows that changed</td></tr></tbody></table></div>
   <div class="prose"><p><span class="term">Column lineage</span> is the path of a column from the input, through each model, to gold. Vulcan finds it from your SQL. <span class="term">Table diff</span> compares two tables by columns and by rows. It shows what a correction changed before you tell consumers.</p></div>`));
  m.append(quiz([{q:"In the Vulcan timeline, why does the dashboard not show the wrong revenue?",o:["Vulcan deletes the bad rows","The assertion on silver stops the gold table, and the dashboard reads gold","The dashboard is off"],a:1,w:"The bad rows stay in silver."},
   {q:"Which part of Vulcan finds the source column of a wrong number?",o:["Column lineage","Signals","Seeds"],a:0,w:"Lineage shows the path of each column."},
   {q:"Why is the correction forward-only?",o:["Because only new data from POS version 2.0 has the problem, so old days do not need a new build","Because forward-only is faster to type","Because breaking changes are not permitted"],a:0,w:"Forward-only keeps the old rows and uses the new logic for new intervals."},
   {q:"How does Emily prove what the correction changed?",o:["With table diff","With a new cron","With a seed"],a:0,w:"Table diff compares the rows before and after."},
   {"q": "In the timeline without Vulcan, who finds the problem?", "o": ["A store manager, the next day", "An assertion, in the same run", "The owner, in a message"], "a": 0, "w": "Without checks in each run, a consumer finds the problem late."},
   {"q": "Which day does Emily restate?", "o": ["All days", "Only Thursday, the day with the problem", "No day"], "a": 1, "w": "Restatement builds again only the days with the problem, and the models after them."},
   {"q": "What does the message to Emily name?", "o": ["The model, the assertion and the number of bad rows", "Only that something failed", "All rows of the table"], "a": 0, "w": "With these details, the owner can start at the cause."}]));
  m.append(nextBtn(i));return m}

function mDaily(i){
  const rows=[["Morning check","Open the dashboard, compare numbers with yesterday, and hope that nothing is wrong.","Read the Slack channel. Failed assertions, failed runs and data quality results are there, with the owner."],
   ["Add a step of logic","Write the SQL, then find its place in the job schedule.","Write one model. Vulcan puts it in the graph from its FROM and JOIN clauses."],
   ["Change a model","Edit SQL, run it, and examine the tables after it by hand.","Edit SQL and read the plan: the category, the column changes and the models that read them. Then apply."],
   ["Add a column","Build everything again to be safe.","Vulcan sees a non-breaking change and builds one model."],
   ["Remove a column","Find out next week that a dashboard broke.","The plan stops and names the measure that reads the column."],
   ["Late source data","The job runs and loads half a day.","A signal waits until the source is ready."],
   ["Bad source data","It goes into all tables.","An input assertion stops it at bronze."],
   ["Correct bad data","Do the full pipeline again.","Restate the days of the model that had the problem."],
   ["Give access to a new team","Make a copy of the table with fewer columns.","Add a rule to the access policy."],
   ["Answer a business question","Copy SQL from a different dashboard and hope that it is current.","Ask the semantic layer for a measure by name."],

  m.append(h(`<div class="cols"><div class="bench"><h3>Shorter MTTD comes from</h3><div class="prose"><ul><li>The linter and unit tests, before a change is built</li><li>Plans that show the effect before you apply</li><li>Blocking assertions on inputs and on silver, in each run</li><li>Data quality checks for patterns</li><li>Messages that go to the owner of the model</li></ul></div></div>
   <div class="bench"><h3>Shorter MTTR comes from</h3><div class="prose"><ul><li>Layers that keep bad data out of gold</li><li>Column lineage to the source of a problem</li><li>Plans that build only what a correction affects</li><li>Restatement of single days</li><li>Table diff to prove a correction</li><li>One definition of each measure, so a correction gets to all consumers</li></ul></div></div></div>`));
  m.append(concept("Next step",`<div class="prose"><p>When the project is ready, your team deploys it to a DataOS environment with the <code>deployment</code> block of <code>config.yaml</code>. Then Vulcan builds the data on a schedule and serves the APIs.</p></div>`));
  m.append(quiz([{q:"Which of these makes detection faster?",o:["A larger warehouse","A blocking assertion where data enters","A less frequent cron"],a:1,w:"The assertion operates in the same run that brings the bad data."},
   {q:"Which of these makes recovery faster?",o:["Do all models again for all days","Restate only the days of the model that had the problem","Wait for the next run"],a:1,w:"A restatement builds only what the correction touches, and the children."},
   {q:"A new team needs sales without the loyalty tier. What do you do?",o:["Make a copy of the table","Add a rule with a mask to the access policy","Give them access to silver"],a:1,w:"One table serves all groups through the policy."},
   {"q": "The source sends its data half a day late. What keeps a half day out of gold?", "o": ["A signal", "A bigger warehouse", "A seed file"], "a": 0, "w": "The signal waits until the source is ready."},
   {"q": "You must remove a column. How do you find out which measures use it?", "o": ["The plan stops and names the measure that reads the column", "Wait one week", "Ask each team"], "a": 0, "w": "The plan shows the effect before you apply the change."},
   {"q": "Your team moves to a different engine. What do you change in the models?", "o": ["Nothing, because Vulcan writes the new dialect", "All SQL", "Only the semantic layer"], "a": 0, "w": "You keep the models. Vulcan translates them to the dialect of the new engine."}]));
  return m}

function guessLang(t){const s=t.trim();
  if(/^(MODEL|ASSERTION)\s*\(|^(SELECT|WITH)\b|^--/i.test(s))return"sql";
  if(/^(import|from)\s|^@signal|^async def|^def |^SecurityContext\(/m.test(s))return"python";
  if(/^\{\s*\n?\s*"/.test(s))return"json";
  if(/^\{\s*\n\s*vulcan/.test(s))return"graphql";
  if(/^[\w.-]+:(\s|$)|^- /m.test(s))return"yaml";
  return null}
function csvHL(t){return t.split("\n").map((line,r)=>line.split(",").map((c,i)=>`<span class="csv-${r===0?"h":"c"+(i%4)}">${esc(c)}</span>`).join('<span class="csv-sep">,</span>')).join("\n")}
function hl(el){const t=el.textContent;if(el.dataset.hl===t&&(el.dataset.hlplain==="1"||el.firstElementChild))return;const lang=el.dataset.lang||guessLang(t);let out=null;
  if(lang==="csv")out=csvHL(t);
  else if(lang&&window.hljs&&hljs.getLanguage(lang)){try{out=hljs.highlight(t,{language:lang,ignoreIllegals:true}).value}catch(e){out=null}}
  el.dataset.hl=t;el.dataset.hlplain=out===null?"1":"0";if(out!==null)el.innerHTML=out}
const hlObs=new MutationObserver(ms=>{const set=new Set();ms.forEach(mu=>{let n=mu.target;if(n.nodeType!==1)n=n.parentElement;const p=n&&n.closest?n.closest("pre"):null;if(p)set.add(p)});set.forEach(hl)});

applyTheme(store("vlab3-theme"));
themeBtn.onclick=()=>{const order=[null,"light","dark"];const nx=order[(order.indexOf(store("vlab3-theme"))+1)%3];store("vlab3-theme",nx);applyTheme(nx)};
function go(k){hlObs.disconnect();modObs.disconnect();main.innerHTML="";const m=MODULES[k].render(k);main.append(m);
  const rm=readMore(MODULES[k].id),qz=m.querySelector(".quiz");if(rm){qz?m.insertBefore(rm,qz):m.append(rm)}
  const nx=m.querySelector(".next"),ebw=m.querySelector(".eyebrow");if(nx&&ebw){const top=h(`<div class="mod-top"></div>`);ebw.before(top);top.append(ebw,nx);const nb=nextBtn(k);nb.classList.add("next-bottom");m.append(nb)}
  m.querySelectorAll(".bench").forEach(bn=>{bn.classList.add("flat");if(bn.dataset.try||bn.querySelector("button,input,select,textarea,[role=button]"))bn.classList.add("try")});
  main.querySelectorAll("pre").forEach(hl);hlObs.observe(main,{childList:true,subtree:true,characterData:true});linkMods(main);modObs.observe(main,{childList:true,subtree:true});
  seen.add(k);store("vlab3-seen",[...seen]);
  nav.querySelectorAll("li").forEach((li,j)=>{const a=li.querySelector("a");a.classList.toggle("active",j===k);a.classList.toggle("seen",seen.has(j));a.querySelector(".num").textContent=seen.has(j)?"✓":"";a.setAttribute("aria-current",j===k?"page":"false");
});
  mnav.value=k;setCrumbs(k);$("#progtext").textContent=`${seen.size} of ${MODULES.length} modules opened`;$("#progbar").style.width=(seen.size/MODULES.length*100)+"%";
  try{history.replaceState(null,"","#"+MODULES[k].id)}catch(e){}window.scrollTo(0,0);snapAll(m);if(typeof clearFlashes==="function")clearFlashes()}
function linkMods(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("a,pre,code,button,select,option,label,.eyebrow,.mod-top,svg,textarea")||!/Module \d/.test(n.data)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const f=document.createDocumentFragment();let last=0;n.data.replace(/\bModule (\d+)/g,(mt,d,off)=>{const i=+d-1;if(!MODULES[i])return mt;f.append(n.data.slice(last,off));const a=document.createElement("a");a.href="#"+MODULES[i].id;a.className="modlink";a.dataset.mod=i;a.textContent=mt;f.append(a);last=off+mt.length;return mt});
    if(last){f.append(n.data.slice(last));n.replaceWith(f)}})}
function goSection(id,sec){const k=MODULES.findIndex(x=>x.id===id);if(k<0)return;go(k);const el=document.getElementById("sec-"+sec);if(el){el.scrollIntoView({block:"start"});try{history.replaceState(null,"","#"+id+"/"+sec)}catch(e){}}}
main.addEventListener("click",e=>{const s=e.target.closest("a.seclink");if(s){e.preventDefault();goSection(s.dataset.mod,s.dataset.sec);return}const a=e.target.closest("a.modlink");if(!a)return;e.preventDefault();go(+a.dataset.mod)});
const modObs=new MutationObserver(ms=>ms.forEach(r=>r.addedNodes.forEach(x=>{if(x.nodeType===1)linkMods(x);else if(x.nodeType===3&&x.parentElement)linkMods(x.parentElement)})));
/* Highlight the results that change after the reader uses a control in a Try it section. */
let actEl=null,actAt=0;
function noteAct(e){if(e.target.closest&&e.target.closest(".bench")){actEl=e.target;actAt=performance.now()}}
["input","change","click"].forEach(ev=>main.addEventListener(ev,noteAct,true));
function flashTarget(node,bench){for(let t=node;t&&t!==bench&&bench.contains(t);t=t.parentElement){
  if(t.matches("button,input,select,textarea,option,label"))return null;
  if(t.matches(FLASH_SEL)){if(t.contains(actEl))return null;if(!t.matches("pre,svg")&&t.querySelector("button,input,select,textarea"))return null;return t}}return null}
const FLASH_SEL="pre,table,svg,.notice,.log,.svgwrap,[id]";const flashSnap=new WeakMap();
function snapAll(root){root.querySelectorAll(".bench").forEach(b=>b.querySelectorAll(FLASH_SEL).forEach(el=>flashSnap.set(el,el.textContent)))}
const flashLayers=new Map();
function placeLayer(el,L){const r=el.getBoundingClientRect();if(!r.width||!el.isConnected){L.remove();flashLayers.delete(el);return false}
  Object.assign(L.style,{left:(r.left+scrollX)+"px",top:(r.top+scrollY)+"px",width:r.width+"px",height:r.height+"px"});return true}
function flash(el){let rec=flashLayers.get(el);if(rec){clearTimeout(rec.a);clearTimeout(rec.b);clearInterval(rec.t);rec.L.classList.remove("off")}
  else{const L=document.createElement("div");L.className="flash-layer";L.setAttribute("aria-hidden","true");document.body.append(L);rec={L};flashLayers.set(el,rec)}
  const L=rec.L;if(!placeLayer(el,L))return;requestAnimationFrame(()=>L.classList.add("on"));
  rec.t=setInterval(()=>placeLayer(el,L),200);
  rec.a=setTimeout(()=>{L.classList.add("off");L.classList.remove("on")},1500);
  rec.b=setTimeout(()=>{clearInterval(rec.t);L.remove();flashLayers.delete(el)},1800)}
function clearFlashes(){flashLayers.forEach(r=>{clearTimeout(r.a);clearTimeout(r.b);clearInterval(r.t);r.L.remove()});flashLayers.clear()}
const flashObs=new MutationObserver(ms=>{if(!actEl||performance.now()-actAt>700)return;const bench=actEl.closest&&actEl.closest(".bench");if(!bench||!document.body.contains(bench))return;
  const found=new Set();ms.forEach(m=>{if(m.type==="attributes")return;const n=m.target.nodeType===3?m.target.parentElement:m.target;if(!n)return;const t=flashTarget(n.closest?n:n.parentElement,bench);if(t)found.add(t)});
  [...found].filter(t=>![...found].some(o=>o!==t&&o.contains(t))).forEach(t=>{const prev=flashSnap.get(t),cur=t.textContent;flashSnap.set(t,cur);if(prev!==cur)flash(t)})});
flashObs.observe(main,{childList:true,subtree:true,characterData:true});
const [hMod,hSec]=location.hash.slice(1).split("/");const start=MODULES.findIndex(x=>x.id===hMod);if(start>=0&&hSec)goSection(hMod,hSec);else go(start>=0?start:0);
</script>
