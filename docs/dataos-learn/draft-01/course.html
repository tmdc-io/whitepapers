 and data are deleted** |\n| `use.volumes` (`id`, `directory`, `readOnly`) | Separate Volume resource | Volume survives |\n\nUse `disk` for scratch data or test data that can be deleted with the workload. Use a Volume for all data that must continue to exist after the workload. Stateful services with a single writer, such as one Postgres instance, usually run with `replicas: 1`.\n\n### Workers: background, no ports\n\nA Worker has the same shape, but without `servicePorts`. Add `executionMode`. Use `default` for it, unless the stack requires another value. If the logic is safe to run in parallel, add `replicas`. Also add `resources`. Common stacks are `container` for custom loops, `bento` for stream processing and `fastfun` for sink-style runtimes.\n\n```yaml\nversion: v2alpha\nname: ${WORKER_NAME}\ntype: worker\nspec:\n  compute: ${COMPUTE_NAME}\n  replicas: 1\n  executionMode: default\n  resources:\n    requests: { cpu: 50m, memory: 64Mi }\n    limits:   { cpu: 200m, memory: 256Mi }\n  stack: container\n  stackSpec:\n    image: docker.io/library/alpine:3.20\n    command: [sh]\n    arguments: [\"-c\", \"while true; do echo heartbeat; sleep 30; done\"]\n```\n\nWorkers can project files as well as variables. For example, use `projections.files` with `name`, `directory` and `template`, or use a block of `envVarsTemplate`.\n\n### High availability across failure domains\n\nSince September 2026 Services and Workers accept `highAvailabilityConfig`. This field spreads replicas with pod anti-affinity:\n\n```yaml\nspec:\n  highAvailabilityConfig:\n    mode: preferred\n    level: zone\n```\n\n* `level`: `hostname` (separate machines), `zone` (separate data centers in a region) or `region`.\n* `mode: preferred` spreads replicas where it can. If there are not enough distinct units, it still schedules replicas together. If the separation cannot be fully met, `mode: required` does not schedule them, and the workload fails.\n* Set multiple replicas **before** you enable placement rules. A single replica has nothing to spread.\n\n> **Note:** The September 2026 release notes list the modes as `preferred/default`. But the Service and Worker reference pages document `preferred` and `required`. Before you rely on strict placement, find out which values your instance accepts.\n\n### Verification as a first-class step\n\nThe documented pattern for both resources is a Bundle. The Bundle deploys the workload and then runs a verification Workflow. The Workflow starts after the workload reports `active` status and a runtime that contains `running`. The verification script reads `status.aggregateStatus` and `status.runtimeState.status`. If they do not match, the script fails the step. Thus the test changes from \"it applied\" to \"it is actually running\". That is the standard for CI.","sources":["https://v2.dataos.info/references/resources/service","https://v2.dataos.info/references/resources/service/core-concepts","https://v2.dataos.info/references/resources/service/example","https://v2.dataos.info/references/resources/service/field-reference","https://v2.dataos.info/references/resources/worker","https://v2.dataos.info/references/resources/worker/core-concepts","https://v2.dataos.info/references/resources/worker/example","https://v2.dataos.info/references/resources/worker/field-reference","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Bundles: deploying resource graphs","body":"### What a Bundle is\n\nA Bundle deploys a collection of resources in one operation. Its `bundle.resources` list forms a flattened DAG. Each entry is a node with a unique `id` and a manifest. The manifest is a `file` path or an inline `spec`, never both. An entry can also have `dependencies` and `dependencyConditions`.\n\n```yaml\nversion: v2alpha\nname: test-service-tcp-postgres\ntype: bundle\nbundle:\n  resources:\n    - id: tcp-pg-secret\n      file: tests/service/tcp-postgres/secret.yaml\n    - id: tcp-pg-service\n      file: tests/service/tcp-postgres/service.yaml\n      dependencies:\n        - tcp-pg-secret\n      dependencyConditions:\n        - resourceId: tcp-pg-secret\n          status:\n            is:\n              - active\n    - id: verify-tcp-pg\n      file: tests/service/tcp-postgres/verify-workflow.yaml\n      dependencies:\n        - tcp-pg-service\n      dependencyConditions:\n        - resourceId: tcp-pg-service\n          status:\n            is:\n              - active\n          runtime:\n            contains:\n              - \"running\"\n```\n\n### Dependencies versus dependency conditions\n\n* `dependencies` defines **order**: the listed IDs are processed first.\n* `dependencyConditions` defines **readiness**: the dependent entry waits until the `status` or the `runtime` of the named resource matches, or both match. Each accepts `is` (exact values) and `contains` (fragments).\n\nA Service with the status `active` is possibly not serving yet. For a meaningful downstream verification Workflow, the condition must wait for `runtime contains running`. If \"applied\" is not the same as \"ready\", use conditions.\n\n### Placement, inline specs and optional sections\n\n* `workspace` on an entry places a workspace-level resource (Workers, Workflows, Services, Secrets) in a specific workspace. Instance-level resources do not belong to a workspace.\n* Inline `spec` is convenient for tiny resources, but separate files are easier to review and reuse.\n* `bundle.schedule` can create and delete the whole bundle on crons (`initialState`, `timezone`, `create`, `delete`). This is useful for temporary test environments.\n* `bundle.workspaces` creates the workspaces that the bundle needs. `bundle.properties` adds metadata. `bundle.manageAsUser` sets the management identity.\n\n### Lifecycle\n\n```bash\ndataos-ctl resource apply -f bundle.yaml\ndataos-ctl resource get -t bundle -n ${{bundle-name}} -d\ndataos-ctl resource delete -t bundle -n ${{bundle-name}}\n```\n\n> **Warning:** If you delete a Bundle, DataOS can delete the resources that it manages. It deletes them in **reverse dependency order**, so dependents go first. If a bundled Service uses an inline `disk`, the data on that disk is deleted too.\n\nA September 2026 fix stopped Bundles from staying in `pending` after their children are running. If you still see that state on an older instance, inspect the child resources directly. Do this before you assume a failure.\n\n### Designing bundles for CI/CD\n\nUse a Bundle as the deployable unit for anything with more than one moving part:\n\n1. **Phase infrastructure first**: Depots, Volumes and Secrets with no dependencies.\n2. **Then runtimes**: Services and Workers that depend on infrastructure that is `active`.\n3. **Then batch**: Workflows that depend on the services they call.\n4. **Finally verification**: a Workflow that asserts the status and runtime of the resources that you deployed.\n\nKeep each manifest in its own file in source control. Then reviewers see one resource per diff. Use this together with the runtime commands from the Workflow lesson. If a deployed Service must pause for maintenance, `dataos-ctl resource runtime stop` and `resume` act on it. The Bundle does not change.\n\n### Where Vulcan fits\n\nA Vulcan Data Product deploys as its own `type: vulcan` resource. `vulcan create_deploy_yaml` renders this resource, and DataOS expands it into `plan`, `run` and `api` components. Do not put those components in a Bundle. Instead, bundle the **supporting** resources around a product. An example is a Postgres Service and its depot Secret for integration tests. Deploy the product itself through its rendered manifest.","sources":["https://v2.dataos.info/references/resources/bundle","https://v2.dataos.info/references/resources/bundle/core-concepts","https://v2.dataos.info/references/resources/bundle/field-reference","https://v2.dataos.info/build/productize/git-and-deploy","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Data applications and the Perspective recipe","body":"### Two ways to put an application on a Data Product\n\nA data application calls the APIs of a Data Product and shows the result to a team. Both patterns create a catalog entry that links to the product:\n\n| Pattern | Resource | You provide |\n| --- | --- | --- |\n| Deploy a data application | `type: app` (`version: v1alpha`) | A container image, command, port and runtime configuration. DataOS runs it |\n| Link an external application | `type: link` (`version: v1alpha`) | The URL of an app already hosted elsewhere |\n\nThe runtime connection uses environment variables: `VULCAN_BASE_URL` and an auth token. The catalog relationship comes from `spec.app.products` or `spec.link.products`.\n\n### The app manifest, field by field\n\n```yaml\nspec:\n  compute: pacific\n  runAsUser: iamgroottmdcio\n  replicas: 1\n  resources:\n    requests: { cpu: 250m, memory: 256Mi }\n    limits:   { cpu: 500m, memory: 512Mi }\n  service:\n    type: python\n    image: <registry>/<image>:<tag>\n    imagePullSecret: docker-secret\n    command: [streamlit]\n    arguments: [run, app.py, --server.port=8501, --server.address=0.0.0.0]\n    port: 8501\n    secrets:\n      - id: <TENANT>:orders360-vulcan-token\n        contextAlias: appSecret\n    workingDirs:\n      - id: app-cache\n        directory: /var/cache/orders360-dashboard\n    http:\n      path: /orders360-dashboard\n      stripPath: false\n      ingress:\n        enabled: true\n        path: /orders360-dashboard\n        stripPath: false\n        appDetailSpec: orders360-dashboard\n  app:\n    domain: sales_operations\n    description: KPI dashboard for orders360\n    owners: [iamgroottmdcio]\n    products: [orders360-vdetrue]\n    link:\n      title: Open dashboard\n      url: /orders360-dashboard\n    visibility:\n      scope: tenants\n      tenants: [<TENANT>]\n```\n\nThese details matter in production:\n\n* **Open link as a path.** Set `spec.app.link.url` to a path such as `/orders360-dashboard`. Full `https://` URLs still work, but they are deprecated (September 2026) and support will be removed. With a path, one manifest can move across environments. If you omit the link, DataOS uses `spec.service.http.ingress.path`, then `spec.service.http.path`, then `/`.\n* **Tenant-qualified secrets.** `spec.service.secrets[].id` must be `<tenant>:<secret-name>`. DataOS records the Secret as a dependency.\n* **Visibility.** Set `scope: global`, `tenants` (a non-empty list) or `pattern` (a glob such as `\"eng-*\"`). If you omit it, only your own tenant can see the app.\n* **Stricter runtime permissions.** If the image writes to `/var/cache`, `/run` or a similar directory, list those directories under `spec.service.workingDirs`. If you do not, the app fails with permission errors.\n* **Network authorization.** By default, the ingress path is access-controlled and needs a path-ingress grant (`get-path-ingress`, `put-path-ingress`, ...). `noNetworkAuthorization: true` under `spec.service.http` exposes the path without that access check. If you change it on a deployed app, the change possibly does not take effect. Delete the app and apply it again.\n\nFor a `link` resource, `spec.link.url` is the URL of the externally hosted app. `spec.link.domain` and `spec.link.owners` are required. You need the `roles:id:data-developer` tag.\n\n### Recipe: an app on a Perspective\n\nA Perspective turns a governed Studio query into a reusable artifact. The artifact has its own **Data API**, which DataOS provisions automatically. First run the query in Studio, use **Save as Perspective** with **Auto refresh** on, and open **Activate** to get the endpoint. Then build the app against the endpoint, deploy it, and make sure that it appears on the product.\n\n```\nGET https://$BASE_URL/api/v1/perspectives/channel-performance-monthly/result?format=json\nAuthorization: Bearer <api-token>\n```\n\nThe app never queries the semantic layer directly. It reads the Perspective result, for example with `VulcanClient(...).perspectives.get_result(PERSPECTIVE_SLUG)` from the Python SDK. Keep the FQDN, tenant, product name, token and slug in environment variables. Then one image can serve any Perspective.\n\nThese build and deploy traps come from the troubleshooting table of the recipe:\n\n| Symptom | Cause | Fix |\n| --- | --- | --- |\n| Blank or endlessly loading Streamlit page | Websocket on the wrong path | Add `--server.baseUrlPath=<ingress-path>` matching `spec.service.http.path` |\n| Pod crashes after a successful pull | Image built for `linux/arm64` on Apple Silicon | `docker buildx build --platform linux/amd64 -t <image> --push .` |\n| Data API returns 401/403 | `runAsUser` lacks **Can Use** on the product itself | Grant Use on the product, not just the Perspective |\n| Dashboard link 401/403 even for the owner | No per-user Can Use exists for Apps | `noNetworkAuthorization: true`, then delete and re-apply |\n| Stale data | Auto refresh was off when saved | Re-save with Auto refresh |\n\nThe app reads a governed Perspective. Thus it inherits the access rules and freshness of the product, and does not implement them again.","sources":["https://v2.dataos.info/consume/activate/apis/data-application","https://v2.dataos.info/consume/activate/apis/data-application/deploy","https://v2.dataos.info/consume/activate/apis/data-application/link","https://v2.dataos.info/references/interfaces/apps/deploy-a-data-application","https://v2.dataos.info/references/interfaces/apps/link-an-external-application","https://v2.dataos.info/consume/recipes/deploy-a-data-application-on-a-perspective","https://v2.dataos.info/releasenotes/september-2026"]}],"lab":{"title":"Ship a verified workload bundle and a Perspective-backed data app","goal":"Deploy a Worker and a verification Workflow as one Bundle with readiness conditions. Use the runtime lifecycle commands. Then deploy a Streamlit data application on an orders-analytics Perspective, and make sure that it appears on the product page.","duration":"90 min","prereqs":["A Compute resource you can use (placeholder `<compute-name>`) and `dataos-ctl` configured for your tenant","orders-analytics deployed and queryable in Studio","Docker with buildx and a registry the compute can pull from (placeholder `<your-registry>`)","A DataOS API token for the app runtime. If your image is private, also a container-registry Secret"],"steps":["**Write the Worker.** Save the documented sleep Worker as `worker.yaml`. Use `version: v2alpha`, `type: worker`, `executionMode: default`, `replicas: 1`, and plural `resources.requests`/`limits`. Use the `container` stack to run the heartbeat loop. Set `compute: <compute-name>`.","**Write a verification Workflow.** Save `verify-workflow.yaml` as `type: workflow` with `spec.type: instance` and one `container` step. If the step needs a token, put it under `spec.dag[].spec.use.projection` of that step. Do not put it under the top-level `spec`.","**Bundle them with a readiness condition.**\n```yaml\nversion: v2alpha\nname: worker-verify-bundle\ntype: bundle\nbundle:\n  resources:\n    - id: sleep-worker\n      file: worker.yaml\n    - id: verify-sleep-worker\n      file: verify-workflow.yaml\n      dependencies:\n        - sleep-worker\n      dependencyConditions:\n        - resourceId: sleep-worker\n          status:\n            is:\n              - active\n          runtime:\n            contains:\n              - \"running\"\n```\nApply with `dataos-ctl resource apply -f bundle.yaml`.","**Observe ordering.** Run `dataos-ctl resource get -t bundle -n worker-verify-bundle -d` and `dataos-ctl resource get -t worker -n <worker-name> -d`. Make sure that the verification Workflow started only after the Worker reported `active` and `running`. Read the Workflow logs with `dataos-ctl resource log -t workflow -n <verify-workflow-name>`.","**Exercise runtime control.** Stop the Worker and resume it. Do not edit the manifests:\n```bash\ndataos-ctl resource runtime stop -t worker -n <worker-name> -v <resource-version>\ndataos-ctl resource runtime resume -t worker -n <worker-name> -v <resource-version>\n```\nRecord the status after each command.","**Save a Perspective.** In Studio, run a revenue query by channel or category against orders-analytics. Choose **Save as Perspective**. Set the visibility, and turn on **Auto refresh**. Open **Activate**. Copy the endpoint and the slug.","**Build the app image.** Use `app.py`, `requirements.txt` (with the Python SDK wheel) and `Dockerfile` from the recipe. Keep `--server.baseUrlPath=<app-path>` in the Streamlit command. Build the image for the cluster architecture:\n```bash\ndocker buildx build --platform linux/amd64 -t <your-registry>/<image-name>:<tag> --push .\n```","**Deploy the app.** Write `app.yaml` with `version: v1alpha` and `type: app`. Set `spec.service.http.path` and `ingress.path` to `/<app-path>`. Add the env vars `VULCAN_FQDN`, `VULCAN_DP_NAME`, `VULCAN_TENANT`, `VULCAN_AUTH_TOKEN` and `PERSPECTIVE_SLUG`. List your product in `spec.app.products`. Set `spec.app.link.url: /<app-path>` as a **path**. Add `workingDirs` for each writable directory. If the image is private, add `imagePullSecret`. Apply the app with `dataos-ctl resource apply -f app.yaml`.","**Clean up deliberately.** Delete the bundle with `dataos-ctl resource delete -t bundle -n worker-verify-bundle`. Make sure that DataOS removes the child resources in reverse dependency order."],"verify":"The bundle detail shows that both entries were processed and that the verification Workflow `succeeded`. The Workflow log shows that the Worker was `active` with a `running` runtime. After `runtime stop`, the Worker is no longer running. After `resume`, it runs again. The app opens at `/<app-path>` and shows the Perspective rows. Through `spec.app.products`, it appears as a tab on the orders-analytics catalog page. Its manifest has a path, not a full URL, in `spec.app.link.url`.","sources":["https://v2.dataos.info/references/resources/bundle","https://v2.dataos.info/references/resources/bundle/core-concepts","https://v2.dataos.info/references/resources/worker/example","https://v2.dataos.info/references/resources/workflow/field-reference","https://v2.dataos.info/references/interfaces/command-line-interface/resource","https://v2.dataos.info/consume/recipes/deploy-a-data-application-on-a-perspective","https://v2.dataos.info/references/interfaces/apps/deploy-a-data-application"]},"takeaways":["Workflows run to completion. DataOS reconciles Services and Workers until you stop them. Bundles set the order and the readiness gates for the rest","`spec.type` decides whether the cron of a Workflow starts runs. Scheduled workflows must set `concurrencyPolicy` explicitly","Projections go in each Workflow step. DataOS silently drops a top-level projection","Inline disks are deleted with the workload. Volumes stay after the workload is deleted","Use `dependencyConditions` on status and runtime. Then the verification step tests a workload that is actually running","Set the open link of an app as a path. List writable directories in `workingDirs`. The runtime identity needs Can Use on the product"],"quiz":[{"q":"A Workflow step reads `API_TOKEN` from a Secret. The manifest validates and applies, but the step fails because `$API_TOKEN` is empty. The projection block is directly under the top-level `spec` of the Workflow. What is wrong?","options":["`contextAlias` must be uppercase","Projections require `spec.type: template`","The top-level Workflow `spec` has no `use` field, so the projection was silently dropped. Move it to `spec.dag[].spec.use.projection` for each step that needs it","The secret must be mounted as a Volume instead"],"answer":2,"explain":"The docs warn that a projection under the top-level spec passes validation, but DataOS drops it at runtime. Each step has its own projections, and steps do not inherit them.","source":"https://v2.dataos.info/references/resources/workflow/core-concepts"},{"q":"A team writes a Workflow with `spec.type: instance` and a nightly cron under `spec.schedule`. It never runs at night. Why?","options":["`timezone` defaults to US/Pacific","Instance workflows must be wrapped in a Bundle","`concurrencyPolicy` defaults to Replace","Only `spec.type: schedule` uses `spec.schedule` for execution. With `instance`, the cron does not trigger runs"],"answer":3,"explain":"`instance` runs once per apply or re-run. A cron in `spec.schedule` triggers runs only with `spec.type: schedule`. That type also requires an explicit `concurrencyPolicy`, because the field has no default.","source":"https://v2.dataos.info/references/resources/workflow/field-reference"},{"q":"A stateful Postgres Service stores its data on an inline `disk`. The team plans to delete the Service and create it again during a migration. They expect the data to survive. What do you tell them?","options":["Deleting the Service deletes the inline `disk` and its data. Mount an existing Volume with `use.volumes` for data that must outlive the Service","Inline disks survive deletion if `stateful: true` is set","Data survives if `replicas` is greater than 1","Use `dataos-ctl resource runtime suspend` instead of delete to keep the disk forever"],"answer":0,"explain":"Inline disk storage belongs to the lifecycle of the Service and is deleted with it. A separately managed Volume, mounted through `use.volumes`, is not deleted with the Service.","source":"https://v2.dataos.info/references/resources/service"},{"q":"In a Bundle, a verification Workflow starts before the Service it tests is actually serving, and fails intermittently. The entry already lists the Service under `dependencies`. What change makes it reliable?","options":["Move both resources into one inline `spec`","Add `dependencyConditions` on the Service requiring `status.is: [active]` and `runtime.contains: [\"running\"]`","Set `bundle.manageAsUser` to the Service owner","Add `workspace: sandbox` to the Workflow entry"],"answer":1,"explain":"`dependencies` only sets the order of processing. `dependencyConditions` makes the dependent wait until status and runtime match. This is the documented verification pattern.","source":"https://v2.dataos.info/references/resources/bundle/core-concepts"},{"q":"A Streamlit app, deployed as an `app` resource on a Perspective, shows only a blank page. The pod is healthy, and the Data API works with curl. What is the documented fix?","options":["Set `stripPath: true` on the ingress","Rebuild the image without `--platform linux/amd64`","Change `spec.app.link.url` to a full https URL","Add `--server.baseUrlPath=<ingress-path>` to the Streamlit arguments so its websocket uses the path-prefixed route"],"answer":3,"explain":"Behind a proxy with a path prefix, the Streamlit websocket connects to the wrong path unless `baseUrlPath` matches `spec.service.http.path`. Full-URL links are deprecated. The amd64 platform flag is required, not harmful.","source":"https://v2.dataos.info/consume/recipes/deploy-a-data-application-on-a-perspective"}]},{"id":"e8","title":"AI Activation Architecture","track":"Advanced Engineering & AI","duration":"2 h 15 min","objectives":["Explain Data Product MCP components, layers, lifecycle and request flow well enough to debug an agent integration","Configure least-privilege MCP access and reason about the platform-governed and assistant-shaped trust layers","Use the consumer journey (Find, Trust, Ask, Act) and the builder journey, including the builder skills","Design and review Data Products for agent fitness using ai_context, behaviors, joins, usage guidance and policies"],"lessons":[{"title":"Data Product MCP: components, layers, lifecycle and request flow","body":"### Governed assistant access, not a database connection\n\nAI activation is the DataOS pattern that makes governed Data Products usable from AI assistants and agentic applications. **Data Product MCP** delivers it. Data Product MCP is the MCP server that hosts Data Product tools. With these tools, assistants can build, discover, inspect and consume products. The key idea fits in one sentence. Data Product MCP gives an assistant a governed interface to Data Products, but **it does not grant direct database access**. The Data Product remains the system of record for semantics, contracts, policies, quality, lineage, ownership and runtime access.\n\n### Components: host, client, server\n\nMCP uses a host-client-server model:\n\n| Component | In MCP | In AI activation |\n| --- | --- | --- |\n| Host | The app that provides the UX and contains the model | Cursor, Claude, Copilot in VS Code, ChatGPT Desktop (Codex), or a custom agent |\n| Client | The protocol connector the host creates **per server** | The MCP connection configured for Data Product MCP |\n| Server | The endpoint that exposes capabilities | Data Product MCP |\n| Tools | Callable operations | Build, discover, query and inspect Data Products |\n| Resources | Read-only context, where supported | Docs, metadata, examples, schema context |\n| Prompts | Reusable templates, where supported | Guided investigation or builder workflows |\n\nA host can hold many clients at once, one per server. For example, it can connect to Data Product MCP and also to a code server or a ticketing server. Each client connects to one server, negotiates capabilities, lists tools to the model, and sends tool calls. The host uses the prompt and the plan of the model to choose which connection to use.\n\n### Layers: meaning versus transport\n\n| Layer | Handles | Example |\n| --- | --- | --- |\n| Data layer | JSON-RPC messages, lifecycle, capability negotiation, requests, responses, notifications, errors, tools, resources, prompts | A `tools/call` request with structured arguments, and a structured result or error |\n| Transport layer | The channel carrying those messages | A local MCP process for a desktop assistant, or HTTP to hosted Data Product MCP |\n\nTool semantics are in the data layer. Thus a local assistant and a hosted agent call the same tools and get the same response shape, although they connect in different ways. Every documented client connects over **streamable HTTP**.\n\n### Lifecycle: initialization, operation, shutdown\n\n1. **Initialization** runs once per session. The client sends its protocol version and capabilities. The server answers with its version, server details and capabilities, including the tool catalog. No tool calls occur in this phase. If the versions are incompatible, the session does not continue.\n2. **Operation** is the phase where all work occurs. The model sees the prompt and the negotiated tool descriptions, and requests a call. Then the client sends a JSON-RPC request. The server validates the identity, applies DataOS authorization and policies, calls the Data Product API and returns a structured response. One question can start several calls in sequence: search, then check quality, then query.\n3. **Shutdown** needs no dedicated message. The session ends at the moment the transport closes. For HTTP, that is the release of the connection. A new session starts with a fresh initialization.\n\n### Request flow end to end\n\n1. The user asks a question in the host.\n2. The host sends the prompt to the model with the available tool descriptions.\n3. The model decides whether a Data Product MCP tool is necessary.\n4. The host asks the client to call the tool with structured arguments.\n5. The client sends the request to Data Product MCP.\n6. Data Product MCP validates the request and calls the DataOS or Data Product APIs.\n7. DataOS applies identity, tenant, policy, masking, semantic, quality, lineage and contract checks.\n8. Data Product MCP returns a structured response with data, metadata, warnings, citations or errors.\n9. The host shows the explanation of the model, which is based on that response.\n\nTake the question \"Is orders360 fresh enough for today's revenue review?\". The model inspects recent runs and quality status. If necessary, it also looks up the owner. The answer comes from tool responses, not from a freeform guess.\n\n### Engine cost of agent traffic\n\nThe engine guides state what each MCP tool costs on the engine. `about` is static. `lineage` reads the parsed graph. `quality` returns the last check results. `activity` reads workflow history from DataOS. The `data` tool runs a **live query**. On Spark it can start scans and shuffles. On Redshift it competes for WLM queue slots. On Athena it scans billable bytes. When you size API replicas, warehouses and workgroup limits, treat agent-driven `data` calls like production dashboard traffic.","sources":["https://v2.dataos.info/references/interfaces/ai-activation","https://v2.dataos.info/references/interfaces/ai-activation/mcp-components","https://v2.dataos.info/references/interfaces/ai-activation/mcp-layers","https://v2.dataos.info/references/interfaces/ai-activation/data-product-mcp-lifecycle","https://v2.dataos.info/references/interfaces/ai-activation/request-flow","https://v2.dataos.info/references/engine-guide/spark-1","https://v2.dataos.info/references/engine-guide/redshift","https://v2.dataos.info/references/engine-guide/athena"]},{"title":"Authentication, authorization and the trust model","body":"### Identity flows through, end to end\n\nMCP itself only defines how clients and servers exchange messages. The Data Product MCP implementation and the transport configuration enforce authentication and authorization. DataOS evaluates every request with the **caller's own DataOS identity**:\n\n* If a user cannot access a product, table, column or value in DataOS, the assistant cannot access it through MCP.\n* If a value is masked for the user, the assistant receives the masked value.\n* An inaccessible product never appears in discovery, lineage, profile or query responses.\n\nOn each request, the server authenticates the caller and authorizes the operation. It applies Data Product policies and returns only what the caller has permission to receive. The host can improve the conversation around the answer, but **it does not expand the user's access**. Every tool call runs through the same policy enforcement point (PEP) as the rest of the platform.\n\nFor this reason, the role-based masking that you built in the Advanced Vulcan module matters for AI. The `after_authorize` hook and `column_mask_expressions` protect the REST API. They also protect the agent path, because both paths go through the same query layer.\n\n### Granting MCP access\n\nYou configure access as for any platform service, through standard policy grants. Use the `mcp-tool-read` grant under the `use-mcp-service` policy use case, or a tenant role such as `data_consumer` or `data_developer`. An authentication error right after setup almost always means that one of these is missing.\n\n### Endpoints and credentials\n\n| Method | Endpoint | Credential |\n| --- | --- | --- |\n| OAuth | `https://<instance-url>/mcp/api/v1` | Browser sign-in with the user's DataOS account |\n| API token | `https://<instance-url>/dataproduct-mcp/api/v1` | `apikey: <API_TOKEN>` header |\n\nAgentic frameworks (LangChain, Vercel AI SDK, AgentScope, custom) use the API-token endpoint. This is a generic server definition:\n\n```json\n{\n  \"DataProduct-MCP\": {\n    \"transport\": \"http\",\n    \"url\": \"https://<instance-url>/dataproduct-mcp/api/v1\",\n    \"headers\": { \"apikey\": \"<API_TOKEN>\" }\n  }\n}\n```\n\nAPI tokens are secrets. Inject them from environment variables, and keep project-level configuration files out of Git. In an organization-wide Claude connector, each member signs in with their own DataOS account. Thus the admin who added the connector does not share their access.\n\n> **Note:** The Claude Code OAuth example in the docs uses the `/dataproduct-mcp/api/v1` path. But the endpoint table lists `/mcp/api/v1` for OAuth. Get the correct OAuth path for your instance from **Activate → MCP**.\n\n### Two layers of trust\n\n| Layer | Who controls it | What it covers |\n| --- | --- | --- |\n| Platform-governed trust | DataOS | Authorization, filtering, masking, semantic validation, quality and lineage retrieval, and owner lookup. DataOS enforces all of them before the response reaches the assistant |\n| Assistant-shaped trust | The assistant | Which tools to call, which arguments, and the final wording. Data Product MCP reduces risk with tool descriptions, strict parameters, structured fields, warnings and citations |\n\nAI activation is **governed assistant access, not autonomous data authority**.\n\n### Boundaries you can rely on\n\nData Product MCP does not:\n\n* expose raw SQL for arbitrary querying,\n* return data the user is not authorized to see,\n* invent missing measures, owners, quality results or lineage,\n* modify, retrigger or remediate runtime jobs through the consumption tools,\n* remove the need to review work that AI helps to build.\n\nIf the semantic surface cannot answer a question, the response states a clear limitation. It does not fabricate a measure. If the row limit of the platform capped the output, the query response says so. Thus you can tell a preview from a full result.\n\n### Designing agents on top\n\nFor agentic applications, frameworks get the same tool surface as desktop clients. DataOS still enforces authorization, tenant boundaries, masking and contracts. At the application layer, you add **citation discipline**. Instruct the agent to show the metric, source product, filters and time window for every analytical answer. Then a reviewer can audit the \"assistant-shaped trust\".","sources":["https://v2.dataos.info/references/interfaces/ai-activation/authentication-and-authorization","https://v2.dataos.info/references/interfaces/ai-activation/trust-model","https://v2.dataos.info/consume/consume-with-ai/overview","https://v2.dataos.info/consume/consume-with-ai/connect-a-client","https://v2.dataos.info/consume/consume-with-ai/connect-a-client/claude","https://v2.dataos.info/consume/consume-with-ai/connect-an-agentic-framework","https://v2.dataos.info/consume/consume-with-ai/connect-an-agentic-framework/custom"]},{"title":"Consumer and builder journeys with AI","body":"### The consumer journey: intent first\n\nManual consumption starts with a destination. You search the Hub, open the product, explore it, and then query through BI, API or an app. AI activation starts with **intent**. The user can ask a question before they know which product, metric, owner, table or interface is relevant.\n\n| Stage | Example prompt | What comes back |\n| --- | --- | --- |\n| Find | `What Data Products do we have for supplier performance?` | Products or tables scoped to what the user can access |\n| Trust | `Is this data fresh enough to act on?` | Semantic fields, quality status, run history, lineage, profile, limitations, owner |\n| Ask | `What was quarterly revenue by customer segment?` | A governed answer from the semantic layer naming the metric or measure and source model |\n| Act | `Why did this query fail, and who owns the Data Product?` | A clear failure reason and owner context |\n\n### Discover and understand: what each capability actually does\n\nDiscovery returns matches with name, domain, owner, lifecycle stage and a link. Table searches add table type, column count, engine and PII status. Responses are non-deterministic, so order and wording vary.\n\nThe understand capabilities have precise behaviors. An engineer must know them to debug an agent:\n\n| Capability | Returns | Does not |\n| --- | --- | --- |\n| Queryable surface | Measures, dimensions, time dimensions, segments, metrics, joins | Return numbers |\n| Lineage | Upstream sources, downstream dependents, impact summary, sensitive tables, owners | Accept fuzzy names (needs an exact product or table name) or return row values |\n| Table profile | Row count, size, last-profiled time, null rates, distinct counts, min/max, distributions | Re-run the profiler or return row contents |\n| Quality | Per-dimension summary, last evaluation, failing checks with model and column | Modify or retrigger checks |\n| Run history | Latest status, timestamp, rows processed, models affected, errors, next scheduled run | Retrigger or schedule runs |\n\nA typical trust flow is: schema, then quality, then runs, then lineage or profile, then ask. Use lineage or profile only for questions that need them.\n\n### The builder journey\n\nFor builders, AI activation covers the full lifecycle:\n\n| Stage | Assistant helps with |\n| --- | --- |\n| Discover | Searching the catalog and table index for existing coverage |\n| Design | Clarifying the business problem, consumers and key questions |\n| Plan | Locking entities, joins, measures, dimensions, grain and freshness into a reviewed spec |\n| Build | Scaffolding the project, applying syntax templates, reviewing SQL/YAML |\n| Validate | Checking syntax, quality rules, tests, metadata and assumptions |\n| Deploy | Handing the validated project to Git and deployment |\n\nThe assistant must mark assumptions, show TODOs and ask for confirmation at checkpoints. It must not fill gaps silently.\n\n### Builder skills in practice\n\nScaffold skills, docs and the CLI wheel into the project:\n\n```bash\nnpx dataproduct-builder-skills\n# or\nuvx dataproduct-builder-skills\n# or\npipx run dataproduct-builder-skills\n```\n\nThis command creates `.cursor/skills/` with three skills. It also creates `dpbs-docs/` with Vulcan docs, engine examples, DataOS philosophy and the `vulcan-*.whl` wheel. Install the CLI from that wheel in a Python 3.10-3.13 virtual environment, with your engine as an extra:\n\n```bash\npython -m venv .venv\nsource .venv/bin/activate\npip install \"dpbs-docs/vulcan-*.whl[<engine>]\"\nvulcan --version\n```\n\n| Skill | Role |\n| --- | --- |\n| `design-data-product` | Structured Q&A on context, sources, grain, measures and metrics. It discovers tables through MCP, classifies model kinds, suggests joins, and drafts quality rules and `ai_context`. It outputs a confirmed `data-product-plan.md` |\n| `build-data-product` | Turns the confirmed spec into SQL/YAML models, DQ checks and tests. It runs `vulcan plan` and carries the product through dev and prod |\n| `fix-data-product` | Reads an **existing** `vulcan review` report and summarizes it by severity. With approval, it fixes blocker and high issues and the required AI-readiness gaps |\n\nStart with `/design-data-product`. Before it begins, it makes sure that Data Product MCP is connected and that the search tool is available. Design works **right to left**: business question, required metric, measures and dimensions, grain, joins, source columns. Every model and column exists because a question required it. Discovered raw tables stay `EXTERNAL`. Files that you own, such as a status lookup CSV, become `SEED`.\n\nValidation uses the normal CLI: `vulcan info` (DAG resolves, linter clean, no cycles), `vulcan plan dev --auto-apply`, and `vulcan test`. `vulcan review` is optional. It needs the separate `review` extra (extras are not cumulative) and a `review.model` in `config.yaml` or `--llm`. It writes an HTML report under `.vulcan/reviews`. The agent does **not** run `vulcan review`. You run it, and then you invoke `/fix-data-product`.\n\n> **Warning:** Before you commit a design, make sure that the recommendations and profile statistics are correct. Table search and profiling in discovery are flagged experimental, so treat their results as directional.","sources":["https://v2.dataos.info/references/interfaces/ai-activation/consumer-journey","https://v2.dataos.info/references/interfaces/ai-activation/builder-journey","https://v2.dataos.info/consume/consume-with-ai/discover-in-natural-language","https://v2.dataos.info/consume/consume-with-ai/understand-in-natural-language","https://v2.dataos.info/build/get-started/build-journey-with-ai"]},{"title":"Designing products fit for agents","body":"### Why agents raise the bar\n\nThe DataOS philosophy page gives a concrete argument. A human analyst absorbs drift. The analyst knows that revenue moved to net of refunds last week, although the catalog still approves the gross table. An agent has none of that context. It resolves the stale `revenue` at machine speed and returns the wrong number with the same confidence as the right one. The fix is not another layer but one object. Semantics, contract, quality and access are authored **with** the data, so they cannot fall out of sync.\n\nOne line from that page is the design principle for this lesson: a product built for a dashboard is **not automatically fit for an agent**. Data that is summarized for human readers often does not have the detail that a model needs. **Fitness is per consumer, and it is designed, not inherited.**\n\n### What \"fit for an agent\" means in Vulcan terms\n\n| Agent failure mode | Design lever |\n| --- | --- |\n| Picks the wrong field for a business term | `ai_context.synonyms` on the measure or model |\n| Adds a filter the measure already contains | `ai_context.instructions` stating what is baked in |\n| Sums a point-in-time balance across days | Measure `behavior` (for example `type: stock`) plus `ai_context.caveats` |\n| Hand-rolls a filter instead of a governed segment | Segments plus `ai_context.examples` showing the segment in use |\n| Guesses join paths | Explicit semantic `joins` (also the biggest avoidable latency risk on every engine) |\n| Uses data outside its purpose | `usage.yaml` `not_for` and `caveats`, and `agreement.md` terms |\n| Answers from stale data | Freshness caveats, signals on late sources, failure notifications to the owner |\n| Sees values that it must not see | Standalone policies with `column_mask_expressions` and `after_authorize` |\n\nYou can attach `ai_context` to semantic models, dimensions, granularities, measures, segments and joins, but not to rollups or policies. All fields are optional. Unknown keys fail validation:\n\n```yaml\nmeasures:\n  - name: total_arr\n    type: sum\n    expression: \"{subscriptions.arr}\"\n    filters:\n      - \"{subscriptions.status} = 'active'\"\n    behavior:\n      type: stock\n      time_dimension: start_date\n      period_treatment: last\n      period_grain: day\n    ai_context:\n      instructions: Primary ARR KPI; active-status filter is baked into the measure.\n      synonyms:\n        - ARR\n        - annual recurring revenue\n      caveats:\n        - Pin start_date to period end; do not sum ARR across daily rows in a range.\n      examples:\n        - description: total ARR for enterprise (REST API)\n          format: rest\n          query: |\n            {\n              \"measures\": [\"subscriptions.total_arr\"],\n              \"segments\": [\"subscriptions.enterprise_subscriptions\"]\n            }\n```\n\nEach example declares a `format` of `sql`, `rest` or `graphql`. Thus an agent sees the exact shape for the API that it calls.\n\n### Designing per consumer\n\nTreat the agent as a named consumer in the product spec, alongside the dashboard team:\n\n1. **Name the agent consumer and its questions** in the design conversation, as you do for a human team. Right-to-left design then forces the grain and measures that those questions need.\n2. **Keep grain explicit.** Agents misuse pre-aggregated marts built for a single chart. If an agent needs drill-down, the semantic model must expose a grain that supports it. The `instructions` must state that grain (\"one row = one order_date x region x customer x product\").\n3. **Prefer governed objects to free SQL.** Metrics (`kind: metric` with `measure`, `ts`, `granularity`) and segments give agents named, reviewable building blocks.\n4. **Write limitations down.** The MCP server refuses to invent missing measures. Your `usage.yaml` caveats and `ai_context.caveats` tell it, and the user, why.\n5. **Make trust signals real.** The Trust stage returns quality, runs and lineage. Products without DQ checks, assertions and declared `inputs.yaml` lineage give agents nothing to cite.\n6. **Budget for agent load.** `data` tool calls are live engine queries. Pre-aggregate hot paths, limit the query shapes, and size API replicas separately from engine compute.\n\n### A fitness review checklist\n\nBefore you declare a product agent-ready, you must be able to answer yes to each item:\n\n* Every measure that an agent can use has a description. If the measure is ambiguous, it also has `ai_context` instructions, synonyms or caveats.\n* Stock and ratio measures carry `behavior` so they are not summed incorrectly.\n* Multi-entity questions route through declared joins.\n* A policy masks sensitive columns for the roles that agents run as, and a test through the API proves it.\n* `usage.yaml` states `good_for`, `not_for` and freshness caveats. If consumers must accept terms, `agreement.md` exists.\n* The builder `vulcan review` pass, followed by `/fix-data-product`, shows no open blocker or high AI-readiness gaps.\n* A test prompt such as `What metrics does <product> expose?` returns the intended surface. A question outside that surface returns a limitation, not a fabricated answer.","sources":["https://v2.dataos.info/readme-1","https://v2.dataos.info/references/resources/vulcan/models/semantic-models/ai-context","https://v2.dataos.info/references/resources/vulcan/configurations/usage","https://v2.dataos.info/references/resources/vulcan/configurations/agreement","https://v2.dataos.info/build/get-started/build-journey-with-ai","https://v2.dataos.info/consume/consume-with-ai/overview"]}],"lab":{"title":"Audit and raise the agent-fitness of orders-analytics","goal":"Connect an agent to Data Product MCP with least-privilege credentials. Run the Find-Trust-Ask-Act flow against orders-analytics. Make sure that masking holds on the agent path. Then ship ai_context and usage improvements that change how the agent answers.","duration":"75 min","prereqs":["orders-analytics deployed, with the SCD2 dimension and masking policy from the Advanced Vulcan Patterns lab (or any masked column)","The `mcp-tool-read` grant under the `use-mcp-service` policy use case, or a tenant role such as `data_consumer` or `data_developer`","A DataOS API token (placeholder `<API_TOKEN>`) and an MCP-capable client or framework","Node.js 16+ or Python with `uvx`/`pipx` for the builder skills scaffolder"],"steps":["**Connect a client over streamable HTTP.** For a custom client or framework, use the server name `DataProduct-MCP`. Use the URL `https://<instance-url>/dataproduct-mcp/api/v1`. Supply the header `apikey: <API_TOKEN>` from an environment variable. With Claude Code, run this command:\n```bash\nclaude mcp add --scope user --transport http DataProduct-MCP \\\n  https://<instance-url>/dataproduct-mcp/api/v1 --header \"apikey: <API_TOKEN>\"\n```","**Verify scope.** Ask `What data products am I authorized to access?` Make sure that the answer lists only the products that your identity can access. If you get an authentication error, stop and request the MCP grant. Do not use the token of another person.","**Run the trust flow.** Ask these questions in sequence: `What metrics does orders-analytics expose?`, `Are the quality checks on orders-analytics passing?`, `When was orders-analytics last refreshed?`, and `Where does the revenue figure in orders-analytics come from?`. For lineage, use the exact product name. Record which capability answered each question. Also record whether the answer cited a metric, model, run or owner.","**Test the boundaries.** Ask for a measure that does not exist, for example `What is the net promoter score in orders-analytics?`. Make sure that the response states a limitation and does not invent a value. Then ask the agent to re-run the pipeline. Record what happens. The trust model says that consumption tools do not retrigger runtime jobs. If the result is different, report it to your platform team.","**Verify masking on the agent path.** Use a token whose role resolves to the masked group. Ask for customer emails by segment. Make sure that the values come back masked, as in the REST API test that you did earlier.","**Find a fitness gap.** Ask an ambiguous question such as `What was revenue last week?`. Note whether the agent picked the right measure and grain. Find at least two gaps from the failure-mode table in the lesson.","**Close the gaps.** Add `ai_context` to the relevant semantic model and measure. Include instructions, synonyms, caveats, and at least one example with `format: sql` or `format: rest`. Add `good_for`, `not_for` and a freshness `caveats` entry with `severity` to `usage.yaml`. Run `vulcan plan` to validate the changes. Unknown `ai_context` keys fail validation.","**Optional builder pass.** In a scratch directory, run `npx dataproduct-builder-skills`. Install the scaffolded wheel with your engine extra. Start `/design-data-product` for a small agent-focused extension. Keep the generated `data-product-plan.md` as evidence of right-to-left design.","**Redeploy and re-ask.** Deploy with `vulcan create_deploy_yaml -o - | dataos-ctl resource apply --in`. Start a new MCP session to get a fresh initialization. Ask the ambiguous question again."],"verify":"Your evidence shows these results. Product discovery is limited to your identity. Trust-flow answers cite metrics, runs, quality and lineage. The non-existent measure returns a limitation, not a fabricated number. The agent path returns masked values for the restricted role. `vulcan plan` passes with the new `ai_context` and `usage.yaml` content. A before-and-after transcript shows that the ambiguous revenue question resolves to the intended measure and grain after the redeploy.","sources":["https://v2.dataos.info/consume/consume-with-ai/connect-a-client","https://v2.dataos.info/consume/consume-with-ai/connect-a-client/custom","https://v2.dataos.info/consume/consume-with-ai/connect-a-client/claude","https://v2.dataos.info/consume/consume-with-ai/understand-in-natural-language","https://v2.dataos.info/references/interfaces/ai-activation/trust-model","https://v2.dataos.info/references/resources/vulcan/models/semantic-models/ai-context","https://v2.dataos.info/build/get-started/build-journey-with-ai"]},"takeaways":["Data Product MCP is a governed interface, not a database connection. The product stays the system of record","The client and server negotiate the tool catalog at initialization. If the transport closes, the session ends","Every MCP call runs with the DataOS identity of the caller, through the policy enforcement point of the platform. Thus masking and access carry over","The `data` tool is a live engine query. Plan capacity for agent traffic as you do for dashboard traffic","Builder skills design right to left into `data-product-plan.md`. You run `vulcan review`, then `/fix-data-product`","Agent fitness is per consumer, and you design it. The levers are ai_context, behaviors, joins, usage caveats and policies"],"quiz":[{"q":"A user connected to Data Product MCP asks for customer emails. In the REST API that user sees `email` masked. What does the assistant receive through MCP?","options":["Unmasked values, because MCP uses a service connection","The masked value, because every MCP request is evaluated with the caller's DataOS identity and policies","An error, because MCP never returns PII columns","Unmasked values only if the host is Claude Desktop with an admin-added connector"],"answer":1,"explain":"Data Product MCP authenticates the caller, applies DataOS policies, and returns only what the caller has permission to receive. A masked value comes back masked. Organization connectors do not share the access of the admin.","source":"https://v2.dataos.info/references/interfaces/ai-activation/authentication-and-authorization"},{"q":"The agent framework of an engineer can list Data Product MCP tools. But after a server upgrade in the middle of the session, the session silently uses an older tool set. In which lifecycle phase does the tool catalog get set, and what restores the new catalog?","options":["Operation. Call `tools/call` with a refresh argument","Shutdown. Send a dedicated shutdown message","Initialization. End the session (close the transport) and start a new one so capabilities and the tool catalog are renegotiated","Transport layer. Switch from HTTP to a local process"],"answer":2,"explain":"The client and server exchange capabilities and the tool catalog during initialization, which runs once per session. MCP has no dedicated shutdown message. Closing the transport ends the session, and a new session starts with a fresh initialization.","source":"https://v2.dataos.info/references/interfaces/ai-activation/data-product-mcp-lifecycle"},{"q":"Finance complains that an agent answers ARR questions by summing daily ARR values across a quarter. The semantic measure is a plain `sum`. What is the most targeted fix?","options":["Add measure `behavior` with `type: stock` and an `ai_context` caveat telling the agent not to sum across daily rows, then redeploy","Give the agent raw SQL access so it can write the correct query","Rename the measure to `arr_do_not_sum`","Add a `rollups` block with `ai_context`"],"answer":0,"explain":"Stock behavior plus `ai_context.caveats` is the documented way to stop the most common wrong use of a point-in-time measure. MCP does not expose raw SQL, and rollups do not accept `ai_context`.","source":"https://v2.dataos.info/references/resources/vulcan/models/semantic-models/ai-context"},{"q":"After running the build skill, a developer types `/fix-data-product` but the agent reports there is nothing to fix. They never ran `vulcan review`. What is the correct sequence?","options":["The agent runs `vulcan review` automatically. Reinstall the skills","Run `vulcan info --review`","Run `vulcan test` and then `/fix-data-product`","Install the `review` extra, configure `review.model` (or pass `--llm`), run `vulcan review -e <environment>` yourself, then invoke `/fix-data-product` to interpret the report"],"answer":3,"explain":"`fix-data-product` reads an existing review report. The agent does not run `vulcan review`. Review needs the separate `review` extra and a configured model.","source":"https://v2.dataos.info/build/get-started/build-journey-with-ai"},{"q":"A dashboard-oriented product exposes only a weekly revenue mart. An agent asked about daily revenue by customer returns weak answers. According to the DataOS design principle, what is the right response?","options":["Nothing, because agent fitness is inherited from dashboard fitness","Grant the agent access to the raw `_ext` tables","Treat the agent as a named consumer, design the grain, measures and `ai_context` its questions need (right to left), and validate it with test prompts","Increase API replicas"],"answer":2,"explain":"A product built for a dashboard is not automatically fit for an agent. Fitness is per consumer and designed, not inherited. Raw-table access bypasses the contract, and replicas address concurrency, not fitness.","source":"https://v2.dataos.info/readme-1"}]}],"capstone":"### Expert capstone\n\nThe capstone has two halves. Complete the half for your track, or both for the full Expert credential.\n\n#### Part A: Platform Operations & Governance\n\n## Expert capstone, operator half: run orders-analytics as a platform\n\n### Scenario\n\nA retail organization runs the **orders-analytics** Data Product. The product reads order and customer data from PostgreSQL and Snowflake and lands curated tables in a Lakehouse. It serves a semantic model to BI dashboards, a Workbench analyst group, and an AI assistant that connects through MCP. These parties are involved:\n\n* An **orders domain team** (four developers, one product owner) that builds and operates the product.\n* A **finance analytics team** that only consumes it.\n* A **platform team** of two Operators and one Tenant Admin per Tenant.\n* An **external logistics consultancy** that wants to build a delivery-forecasting product on order data.\n* A **compliance requirement**: only administrators hold production credentials, every production data path must survive staff changes, and access must be auditable.\n\nThe engineering half of the capstone (Track B) builds the product. Your half designs and proves the platform that it runs on. If a real value (FQDN, Data Plane ID, bucket, database host) is not supplied, use `<placeholders>`. Do not invent values.\n\n### Deliverables\n\n1. **Tenancy decision record** (1-2 pages)\n   * The Instance-versus-Tenant decision for the orders team and for the consultancy. Walk through the six documented questions in order, and cite the question that decides.\n   * A slicing pattern (environment, business unit, domain, or hybrid) and Tenant names under a stable convention. Name the owner and the Tenant Admin of each Tenant. Make an explicit statement about the Instance-wide visibility of dataset metadata.\n   * A Data Plane plan: cloud (AWS or Azure), CLI or UI route, application-user ownership, release inputs (snapshot `artifactIdentifier`, CLI version), egress requirements, and credential rotation.\n   * A readiness and hand-off plan. It states who connects the Data Plane and who attaches Compute. It also states who makes sure that the Stacks are present (`lakehouse-mruntime`, MCP server, broker) and who registers the first Secret and Depot.\n\n2. **Resource and access model**\n   * An inventory of shared Resources per Tenant, and the role that creates each one. The Resources are Compute with selectors and taints, Secrets, Depots with purposes, a Lakehouse with a dedicated metastore database, and a Minerva Cluster.\n   * A persona-by-Resource **access matrix**. It lists every `Can Use`, `Can Edit`, and `Can Manage Access` grant, including the linked Secret of each Depot. For each grant, it states whether the grantee is a user, a Tenant Role, or an application user. Justify the choice between role and individual grants for production against the August 2026 guidance.\n   * A **runtime identity design**: application users per product or pipeline (Vulcan, Nilus, Minerva, Lakehouse `spec.runAsUser`) and their grants. Name who holds Run As User against each application user. Add a revocation procedure that makes an inventory of dependants first.\n   * An **API token policy**: who can hold tokens, maximum duration, rotation, and when MCP OAuth replaces tokens.\n\n3. **Monitoring and operations runbook**\n   * A monitoring map per layer (Instance, Data Plane, Tenant, Lakehouse, Data Product). It names the owner, signals, cadence, and escalation path.\n   * A **health-sweep** command set that you can run (`dataos-ctl` commands only, as taught). Add the checks on the Instance Status page, with documented actions for Healthy, Degraded, and Down.\n   * An **upgrade checklist** from the June-September 2026 release notes, with owners and verification steps.\n   * A **troubleshooting playbook** for at least six failure signatures across at least four layers.\n\n4. **Evidence** (if a sandbox is available): CLI output or screenshots. They show the Tenant, an active Compute, an active Depot, and a healthy Lakehouse. They also show a Minerva Cluster that runs with `runAsUser` set to an application user, and a rejected `runAsUser` apply by an unauthorized user.\n\n### Grading rubric (100 points, pass at 75)\n\n| Criterion | Excellent (full marks) | Adequate (about half) | Insufficient (0) | Points |\n| --- | --- | --- | --- | --- |\n| Tenancy decisions | Both decisions follow the documented criteria in order. Slicing, naming, ownership, and metadata visibility are explicit and justified | Decisions are reasonable but skip criteria or leave ownership vague | Wrong boundary (for example, consultancy in a shared Tenant) or no rationale | 20 |\n| Data Plane and hand-off plan | Application-user ownership, short-lived key, lint-before-apply, snapshot artifact, egress, rotation, readiness checklist with named owners | Most elements present, with one or two hygiene gaps | Personal keys, no readiness criteria, or missing Stacks | 15 |\n| Access matrix | Complete dependency chains (linked Secrets included), least privilege, creation kept for admins on sensitive Resources, defensible choices between role and individual grants | Minor omissions (one missing linked Secret, or unjustified role grants) | `Can Edit` or `Can Manage Access` used in place of `Can Use`, or chains incomplete | 20 |\n| Runtime identity and tokens | Every production workload runs as an application user. The Run As User direction is correct. Revocation and token rotation are planned | Runtime identity is used, but grants or the revocation plan are incomplete | Production depends on personal grants, or the Run As User grant is on the wrong profile | 15 |\n| Monitoring and upgrade runbook | Correct layer ownership, executable sweep, status-page actions, dated upgrade items with verification | Generic monitoring with partial upgrade coverage | Missing layers or no upgrade plan | 15 |\n| Troubleshooting playbook and evidence | Six or more accurate signatures, top-down triage, sandbox evidence that matches the design | Fewer signatures or partial evidence | Inaccurate causes or no playbook | 15 |\n\nAutomatic deductions: 10 points for any command, YAML key, role, or permission that is not in the v2 documentation. 10 points for any credential value committed in a deliverable.\n\n\n#### Part B: Advanced Engineering & AI\n\n## Expert Capstone, Part B: Engineering orders-analytics for production and agents\n\nYou will extend the **orders-analytics** Data Product that you built in the Intermediate track. The result is a production-grade product that is safe for human and AI consumers. Work in a branch of your own repository, and deploy to a non-production environment of your tenant. Replace every `<placeholder>` with your own values. Do not use the credentials of another person.\n\n### Scenario\n\nSales Operations now has five new needs. (1) It needs the history of customer plan tiers for revenue attribution. (2) It needs a churn-risk score from an ML model. (3) It needs PII hidden from operators and from agents that run as operators. (4) It needs on-call alerts for product failures. (5) It needs an AI assistant that answers revenue questions correctly on the first try.\n\n### Required deliverables\n\n1. **SCD Type 2 dimension.** Convert `dim_customer_profile` (or your equivalent) to `SCD_TYPE_2_BY_TIME`, keyed on `customer_id`. If the source has no change timestamp, you can use `SCD_TYPE_2_BY_COLUMN` instead, and you must give the reason. State your choice for `invalidate_hard_deletes`. Give a point-in-time query with bounds on both `valid_from` and `valid_to`.\n2. **Python model.** Add a `@model` Python model, for example a churn-risk score or an RFM clustering score. Give it an explicit `columns` schema, an explicit `depends_on`, an empty-input guard (`yield from (); return`), central dtype casting and a `model_version` column. Use `column_tags` to separate predictions from dimensions. If your engine is Spark, follow the Spark ML pattern with a scikit-learn fallback and an `engine_used` column. If your engine does not support Python models (for example Trino), document the constraint and the alternative that you chose.\n3. **Role-based masking.** Implement `plugins/auth_ext.py` with `after_authorize`. Add `column_mask_expressions` on the physical model. Add a standalone policy under `policies/access/` that masks at least `email` and `customer_name` for an `operator` group. A `developer` group sees the real values. No policy or mask is allowed on a semantic model or a metric model.\n4. **Readiness and failure alerts.** Add a signal that holds the daily fact model until the source data arrives. Add `notification_targets` that send `apply_failure` and `run_failure` to a Slack or Teams channel (`<channel-name>`). In the managed deployment, a DataOS Secret supplies the webhook URL.\n5. **MCP-ready semantic layer.** Each semantic model that consumers use needs these items. Add descriptions on measures. Add `ai_context` with instructions, synonyms, caveats, and at least one example per model with an explicit `format`. Set the correct measure `behavior` for stock or ratio measures. Declare joins for multi-entity questions. Add a `usage.yaml` with `good_for`, `not_for` and freshness `caveats`.\n6. **Deployment.** Write a `deployment:` block with the plural keys `resources`/`requests`/`limits`. Use a UTC schedule with an end date 1-2 years in the future. Use an ApplicationUser as `run_as_user`, or document the reason why you do not. Make sure that `vulcan create_deploy_yaml -o - | dataos-ctl resource apply --in -l` is lint-clean and that the apply succeeds.\n7. **Evidence pack.** Write it in Markdown, in the repo under `capstone/`. It contains the plan output for the SCD2 switch and the two-token masking test through `/api/v1/query`. It also contains a screenshot or log of a delivered `apply_failure` alert, and the `vulcan check_intervals` output with and without `--no-signals`. Add an MCP transcript of the Find-Trust-Ask-Act flow, with one out-of-scope question that returns a limitation. As an option, add a `vulcan review` report with the `/fix-data-product` outcome.\n\n### Grading rubric (100 points, pass at 75)\n\n| Criterion | Points | Full marks when |\n| --- | --- | --- |\n| SCD Type 2 dimension | 15 | Correct kind and unique key. You review the full rebuild before apply. The point-in-time query returns the historical row. Each key has exactly one current row |\n| Python model | 15 | Schema, dependencies, empty guard and dtype casting are correct. The physical table shows the output. Engine constraints are handled and documented |\n| Role-based masking | 20 | Standalone policy on the physical model, with `after_authorize` wired. The same query returns masked values for operator and real values for developer, through the deployed API and through MCP |\n| Signals and alerts | 15 | The `check_intervals` comparison proves that the signal gates intervals. An alert arrives on a deliberate failure. No webhook secret is committed to Git |\n| MCP-ready semantic layer | 20 | `ai_context`, behaviors, joins and `usage.yaml` are present and valid. The ambiguous revenue question resolves to the intended measure and grain. The out-of-scope question returns a limitation |\n| Deployment hygiene | 10 | Plural resource keys, UTC, end date, Forbid concurrency and a lint-clean render. The live product passes `livez` and appears in discovery |\n| Evidence and reasoning | 5 | The evidence pack is complete. Trade-offs (engine choice, SCD2 cost, fallback behavior) are explained in plain language |\n\n**Automatic fail conditions:** credentials or tokens committed to the repository. Masking that works only through `vulcan fetchdf` or a direct warehouse connection. Deprecated anomaly-detection or change-over checks used as quality gates.","exam":{"passMark":75,"timeMinutes":90,"questions":[{"domain":"Architecture and Tenancy Design","q":"A regulated subsidiary requires that its workloads never share infrastructure with the parent company's teams. Which choice follows the evaluation criteria?","options":["A dedicated Tenant with its own Compute on the shared Data Plane","A separate DataOS Instance","A hybrid Tenant set with separate `dev` and `prod`","A Tenant on the shared Data Plane with taints on its node pool"],"answer":1,"explain":"Strict infrastructure isolation (question 2) points to a separate Instance. Tenants on an Instance share one Data Plane, so dedicated Compute or taints do not meet the requirement.","source":"https://v2.dataos.info/operate/dataos-operator/choosing-between-instance-and-tenant"},{"domain":"Architecture and Tenancy Design","q":"Which statement about Tenants on an Instance is accurate in the current deployment model?","options":["All Tenants share one Data Plane and draw Compute from it, isolated by namespace, Tenant-scoped Secrets and Depots, and Tenant-scoped grants","Each Tenant gets its own Data Plane","Tenants share Secrets automatically but not Depots","Tenant isolation also hides dataset metadata from other Tenants"],"answer":0,"explain":"One Data Plane is shared. Isolation is enforced at the namespace, data-connection, and access layers. Metadata stays visible Instance-wide.","source":"https://v2.dataos.info/operate/architecture"},{"domain":"Architecture and Tenancy Design","q":"An Operator plans to reuse a Data Plane manifest next quarter. Which `artifactIdentifier` form guarantees that each install uses the same manifests?","options":["`release:dataos-v2-install-manifests:prd_...`","`latest`","Leave it empty so that `dataos-manager` chooses","`artifact:aft_...` (snapshot)"],"answer":3,"explain":"The snapshot form pins one exact set of manifests. The release form installs whatever is currently latest behind the release.","source":"https://v2.dataos.info/operate/dataos-operator/provision-data-plane/azure"},{"domain":"Architecture and Tenancy Design","q":"A firewall team allowed HTTPS egress only. The new Data Plane installs, but the tunnel never establishes. What must be opened?","options":["Inbound port 443 to the cluster","Inbound port 7432 for Minerva","Outbound to `region1.v2.argotunnel.com` and `region2.v2.argotunnel.com` on 7844 (UDP/QUIC, TCP fallback), plus `*.cftunnel.com` if SNI filtering is used","Outbound SSH to the bastion host"],"answer":2,"explain":"The tunnel goes outbound to the Cloudflare edge on 7844 and needs no inbound ports. Port 7432 is the gateway protocol port of Minerva and is not related to the tunnel.","source":"https://v2.dataos.info/operate/dataos-operator/provision-data-plane/aws"},{"domain":"Architecture and Tenancy Design","q":"An Operator wants a Data Product MCP server deployed for a new Tenant. It is the third Tenant on the Instance. What does Deploy Stacks say?","options":["Deploy a new MCP server per Tenant with `TENANT_ID` set","The MCP server is deployed once, for the first Tenant. Later Tenants use the existing deployment","MCP servers are deployed by the Data Admin","MCP servers cannot run on Tenants created after August 2026"],"answer":1,"explain":"The hint states that the MCP server is deployed only once. The broker and its OAuth configuration come with that deployment.","source":"https://v2.dataos.info/operate/dataos-operator/create-tenants/deploy-stacks"},{"domain":"Architecture and Tenancy Design","q":"Which item is on the Operator's hand-off readiness checklist?","options":["A sanity Data Product deploys and runs without errors","Every developer holds `Can Edit` on shared Compute","The Lakehouse is always provisioned, regardless of need","All consumers have API tokens"],"answer":0,"explain":"The checklist includes a sanity Data Product. The Lakehouse is necessary only if the team requires managed Iceberg storage.","source":"https://v2.dataos.info/operate/dataos-operator/create-tenants/hand-off-tenant"},{"domain":"Tenant and Data Administration","q":"A Tenant Admin renames `analytics-compute` to `analytics-mem-compute`. What prevents existing workloads from breaking during migration?","options":["Granting `Can Edit` to all workload owners","Setting the same `nodePool.labels`","Re-applying all workloads with `--disable-interpolation`","Adding `analytics-compute` to `spec.aliases` of the renamed Compute before deleting the old one"],"answer":3,"explain":"`aliases` lets workloads keep resolving the old name until they migrate. Labels and interpolation flags do not affect name resolution.","source":"https://v2.dataos.info/operate/tenant-admin/create-compute"},{"domain":"Tenant and Data Administration","q":"A Depot manifest references `secrets: - id: orders-pg-cred` and fails with `secret not found`, although `orders-pg-cred` exists in the same Tenant. What is the likely fix?","options":["Add `layer: system` to the Secret","Apply the Depot before the Secret","Tenant-qualify the reference as `<tenant>:orders-pg-cred`, matching case exactly","Use `secret.files` instead of `secret.data`"],"answer":2,"explain":"Depot Secret IDs must be Tenant-qualified and exact. Secrets use `layer: user`, and you must apply the Secret before the Depot.","source":"https://v2.dataos.info/operate/tenant-admin/add-data-sources-and-secrets"},{"domain":"Tenant and Data Administration","q":"A Data Admin needs a Lakehouse, but `dataos-ctl develop stack versions` does not list `lakehouse-mruntime`. What must they do?","options":["Omit the `sparkCluster` block so no runtime is needed","Ask the Operator to provision the `lakehouse-mruntime` Stack before creating the Lakehouse","Create the Lakehouse anyway; the runtime installs on demand","Switch `metastore.type` to a non-JDBC catalog"],"answer":1,"explain":"The Spark Cluster always runs on `lakehouse-mruntime`. If you omit `sparkCluster`, the Lakehouse only uses the defaults. The Operator provisions the Stack.","source":"https://v2.dataos.info/references/resources/lakehouse/create-a-lakehouse"},{"domain":"Tenant and Data Administration","q":"Which command submits a compaction job for `sales.orders` in Lakehouse `s3pglh`?","options":["`dataos-ctl lakehouse operation apply -n s3pglh -f ./compact-orders.yaml`","`dataos-ctl resource apply -f ./compact-orders.yaml -t lakehouse`","`dataos-ctl lakehouse table compact -i s3pglh:sales:orders`","`dataos-ctl resource runtime run -t lakehouse -n s3pglh`"],"answer":0,"explain":"Maintenance runs as a Lakehouse operation from a manifest with `operation: COMPACT`. There is no `table compact` subcommand.","source":"https://v2.dataos.info/references/resources/lakehouse/command-reference"},{"domain":"Tenant and Data Administration","q":"A BI team plans to run nightly multi-terabyte transformations on a shared Minerva Cluster. What does the Minerva guidance say?","options":["Minerva autoscales, so this is fine","Add more depots to the cluster","Use nested views to spread the load","Minerva is not a full ETL engine. Heavy batch transformation belongs in Spark-based processing, with reporting on curated datasets"],"answer":3,"explain":"The performance considerations list large-scale ETL as not recommended, and clusters have fixed capacity. Nested views increase cost.","source":"https://v2.dataos.info/references/resources/minerva/limitations"},{"domain":"Tenant and Data Administration","q":"A Worker writes a cache that must survive redeploys and later be read by a Workflow. Which storage design fits?","options":["Inline `disk` on the Worker","A projection file under `/etc/dataos/work`","A standalone Volume mounted with `use.volumes` by `volumeId`, used by one pod at a time","An inline `disk` on the Workflow"],"answer":2,"explain":"Volumes outlive workloads, and workloads can share them one after another. Inline disk is deleted with its workload. `/etc/dataos/work` is a reserved path.","source":"https://v2.dataos.info/references/resources/volume"},{"domain":"Access Control in Depth","q":"A user signs in successfully through SSO but sees no Tenants. Which statement explains this?","options":["SSO failed silently","The `User` Instance role allows sign-in but grants no access inside any Tenant. A Tenant role must be assigned","The user needs the Operator role to see Tenants","API tokens are required for the UI"],"answer":1,"explain":"Successful authentication does not grant Tenant access. A Tenant Admin or Operator must assign a Tenant role. Operator is an administrative role, not a prerequisite for using Tenants.","source":"https://v2.dataos.info/operate/access-control/roles-and-permissions"},{"domain":"Access Control in Depth","q":"Which Resource types have no `Can Use` permission at all?","options":["Vulcan, Nilus, Service, Workflow, and Worker","Lakehouse and Minerva Cluster","Compute, Depot, Secret","Data Product and App"],"answer":0,"explain":"Those workload Resources carry only `Can Edit` and `Can Manage Access`. Their dependencies control their runtime reach.","source":"https://v2.dataos.info/operate/access-control"},{"domain":"Access Control in Depth","q":"The original creator of a production Depot left the company. A Tenant Admin must update its endpoint. What is the documented approach?","options":["Ask an Operator to transfer ownership in Bifrost","Edit it directly. Tenant Admins already hold `Can Edit` on all Resources","Recreate the Depot under a new name","Grant themselves `Can Edit` on the Depot from its Access tab, then update it. The grant is audited"],"answer":3,"explain":"Tenant Admins hold `Can Manage Access` everywhere, but they must self-grant `Can Edit` on Resources of other users. They do not hold `Can Edit` by default.","source":"https://v2.dataos.info/operate/access-control/roles-and-permissions"},{"domain":"Access Control in Depth","q":"To create a Nilus pipeline that reads a PostgreSQL Depot, which grants does a Data Developer need?","options":["`Can Use Nilus` only","`Can Edit` on the Depot","`Can Use` on the Compute, the Depot, and the Secret linked to that Depot","`Can Use` on the Depot only. Its Secret is implied"],"answer":2,"explain":"Nilus needs Compute, Depot, and the linked Secret. Use of a Depot does not include its Secret. Nilus itself has no `Can Use`.","source":"https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/nilus-access-control"},{"domain":"Access Control in Depth","q":"Which statement about the `runAsUser` identities is correct?","options":["Setting `runAsUser` transfers ownership to that user","`runAsUser` controls only the runtime identity. Owner and submitter do not change, and deletion depends on ownership","Only the `runAsUser` identity can delete the Resource","The submitter's permissions are merged with the `runAsUser` permissions at runtime"],"answer":1,"explain":"DataOS tracks owner, submitter, and runAsUser separately. Runtime permissions are those of the runAsUser identity, not a merge.","source":"https://v2.dataos.info/operate/access-control/roles-and-permissions/runasuser-permissions"},{"domain":"Access Control in Depth","q":"An Operator revokes a developer's Run As User grant on `orders-analytics-app`. What happens to Resources already running with `runAsUser: orders-analytics-app`?","options":["They fail at runtime","They switch to running as the submitter","Nothing; revocation affects only new manifests","They are automatically quarantined and then unquarantined"],"answer":0,"explain":"The grant-permissions page gives this warning: after revocation, any Resource that uses that `runAsUser` fails at runtime. Make an inventory of dependants first.","source":"https://v2.dataos.info/operate/access-control/roles-and-permissions/runasuser-permissions/grant-permissions"},{"domain":"Access Control in Depth","q":"A partner integration authenticates with a DataOS API token against the production Instance. The partner wants to reuse the same token against the staging Instance. What happens?","options":["It works, because tokens are tied to the user, not the Instance","It works if the staging Instance uses the same IdP","It works only for read requests","It fails; a token is tied to the Instance where it was created"],"answer":3,"explain":"Tokens are valid across the interfaces of one Instance only. They do not authenticate against another Instance, even for the same user.","source":"https://v2.dataos.info/references/key-concepts/api-tokens"},{"domain":"Observability and Operations","q":"Which role owns monitoring of a Data Product's quality-check results and freshness?","options":["Operator","Tenant Admin","The developer who owns the product","Data Steward"],"answer":2,"explain":"The observability model assigns Data Product runs, quality, and freshness to the developer who owns the product. Consumers judge trust from the published signals.","source":"https://v2.dataos.info/operate/observability-model"},{"domain":"Observability and Operations","q":"A Service misbehaves, and you must pause
