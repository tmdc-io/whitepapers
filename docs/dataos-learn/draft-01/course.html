mportant rule: **the Instance exchanges only metadata, policies, operational telemetry, and execution instructions with the Data Plane. Customer data never leaves the customer's environment.** The Instance governs and monitors Data Products. It does not take part in data processing.\n\nThe Data Plane hosts:\n\n- **Compute and workload execution** on Kubernetes.\n- **Runtime services**: the Stacks (Vulcan, Nilus, and custom engines) that run Data Products.\n- **Data source connectivity**: Depots and credential Secrets.\n- **Workload isolation**: namespace boundaries and node pools that Compute resources allocate.\n\n> **Note:** The glossary describes a **Tunnel**. A Tunnel is an outbound encrypted connection from the Data Plane to Modern Cloud. With it, the platform manages your cluster without open inbound ports on the cluster.\n\n### Tenants\n\nA **Tenant** is the main isolation boundary in DataOS. It is an authorization and governance boundary inside an Instance. Each Tenant has its own namespace, data source connections, access controls, and Compute. An **Operator** creates Tenants on the Instance.\n\nIn the current deployment model, **all Tenants on an Instance share one Data Plane**. Isolation applies at three layers:\n\n- **Namespace**: resources do not resolve across Tenant boundaries.\n- **Data source connections**: Secrets and Depots belong to one Tenant. No Tenant inherits them from another.\n- **Access**: policies and role grants apply only in the Tenant where you define them.\n\n### Metadata is shared, data is not\n\nThis part is easy to miss. **Ingested dataset metadata is visible across all Tenants on the Instance.** A user in another Tenant can *discover* a dataset. To *read* it, that user needs a Depot, a Secret, and access policies in their own Tenant. Workloads and Data Products stay in the Tenant where they were created.\n\n### Instance or Tenant?\n\nThe docs give a series of questions for each new requirement. Usually, a Tenant is the correct starting point:\n\n| Requirement | Recommended model |\n|---|---|\n| Proof of concept or focused initiative | Tenant with shared compute |\n| Strict infrastructure isolation | Separate Instance |\n| Participants from other departments or from outside | Separate Instance |\n| Full control of upgrades and maintenance | Separate Instance |\n| Predictable workloads, low impact on neighbors | Tenant with shared compute |\n\n### How to divide Tenants\n\nCommon patterns are **by environment** (`dev`, `stg`, `prod`), **by business unit**, **by domain** (`orders`, `customers`), or **hybrid** (`marketing-dev`, `marketing-prod`). The docs give this guide: create a Tenant for the smallest team, business area, environment, or domain that needs its own isolation, owner, and lifecycle. Many organizations start with Tenants per environment and change the pattern later.","sources":["https://v2.dataos.info/operate/architecture","https://v2.dataos.info/operate/dataos-operator/design-tenants","https://v2.dataos.info/operate/dataos-operator/choosing-between-instance-and-tenant","https://v2.dataos.info/references/glossary"]},{"title":"Resources as declarative YAML","body":"### Declare the desired state\n\n**DataOS Resources** are the declarative building blocks of a Data Product. You do not manage raw infrastructure. You describe the **desired state** in a YAML file (a **manifest**). DataOS then does the provisioning, the reconciliation, and the lifecycle management. The platform continuously compares the actual state with your declared state and corrects the difference.\n\nKey characteristics:\n\n| Characteristic | Meaning |\n|---|---|\n| Declarative | You describe the desired state, and DataOS makes it real |\n| Version-controlled | Resources carry an API version, and Git tracks them |\n| Lifecycle-managed | Resources move through defined states |\n| Relationship-aware | Resources can depend on and refer to other resources |\n| Runnable or non-runnable | Some run code. Others are configuration only |\n\n### Runnable and non-runnable\n\n**Runnable resources** run code, have runtime state, and have logs: Workflow, Service, Worker, Minerva, Lakehouse, Vulcan, Nilus, App.\n\n**Non-runnable resources** are configuration only. They have no runtime state and no logs: Depot, Secret, Compute, Volume, Bundle, Link.\n\n> **Tip:** The docs give a one-line test: **if you would ever ask \"what are its logs?\", the resource is runnable.** If the resource only describes a connection, a credential, or a capacity profile, it is not runnable.\n\n### Parts of a manifest\n\nEvery resource has five required fields: `name`, `version`, `type`, `owner`, and `spec`. Optional metadata includes `description`, `tags`, `title`, and `layer`. This is the example Depot from the docs:\n\n```yaml\nname: customerordersdepot\nversion: v2alpha\ntype: depot\ndescription: \"PostgreSQL database containing customer and order data\"\ntags:\n  - sales\n  - postgresql\n  - production\nowner: data-engineering-team\nlayer: user\nspec:\n  type: postgresql\n  spec:\n    host: ${DEPOT_POSTGRES_HOST}\n    port: 5432\n    database: ${DEPOT_POSTGRES_DATABASE}\n  secrets:\n    - id: \"public:postgres-credentials\"\n      purpose: query\n    - id: \"public:postgres-credentials\"\n      purpose: rw\n```\n\nThe file contains no credentials. The Depot refers to a Secret by id. **Projections** extend this idea. At deploy time, they inject secrets, environment variables, and platform metadata. Thus, the YAML does not depend on one environment.\n\nTags such as domain, team, environment, owner, and project let users find and filter resources.\n\n### Lifecycle states\n\n| State | Meaning |\n|---|---|\n| `creating` | Submitted, and provisioning is in progress |\n| `active` | Deployed and available |\n| `failed` | Provisioning or reconciliation stopped with an error |\n| `deleted` | Removed. If you need it again, redeploy it with `apply` |\n\nWhen you apply a manifest again, DataOS does a **rolling update**. The new version must be healthy before DataOS removes the old one.\n\n### Manage resources with the CLI\n\n```bash\ndataos-ctl resource apply -f <manifest.yaml>      # deploy or update\ndataos-ctl resource apply -f <manifest.yaml> -l   # lint before deploying\ndataos-ctl resource get -t <type> -n <name>       # inspect\ndataos-ctl resource log -t <type> -n <name>       # logs (runnable only)\ndataos-ctl resource delete -t <type> -n <name>    # remove\n```\n\n> **Warning:** Before you delete a resource, always make sure that it is the correct one. Deletion is permanent. The platform looks for dependents before it removes a resource.","sources":["https://v2.dataos.info/references/resources/overview","https://v2.dataos.info/references/glossary"]},{"title":"Interfaces: CLI, Hub, Studio, Workbench, APIs, MCP","body":"### Many ways in, one governed product\n\n**Interfaces** are how users and systems reach DataOS and its Data Products. Some interfaces are for queries. Others are for integration, analysis, automation, or operations. A newcomer must recognize these interfaces.\n\n| Interface | What it is | Typical user |\n|---|---|---|\n| **DataOS CLI** (`dataos-ctl`) | Command-line tool to apply, inspect, delete, and debug Resources | Developers, operators |\n| **Data Product Hub** | The catalog UI. Consumers browse, search, filter, and open the Data Products, Metrics, and Perspectives of a Tenant | Everyone |\n| **Studio** | The semantic query UI on a Data Product page. You select dimensions and measures, run governed queries, and save Perspectives | Consumers, analysts |\n| **Workbench** | General SQL exploration UI. It queries physical tables across connected sources | Builders during Understand |\n| **APIs** | Data Product APIs: GraphQL, Data APIs, Metadata, Activity, and Quality APIs, plus Python and TypeScript SDKs | Application developers |\n| **BI tools and DB clients** | Tableau, Power BI, and desktop SQL clients that connect over the MySQL protocol | Analysts |\n| **Data Product MCP** | The MCP server. With it, AI assistants discover, inspect, and query governed Data Products | AI clients and agents |\n\n### Studio and Workbench\n\nThe two names sound similar, but each tool serves a different stage:\n\n- **Workbench** queries **physical tables** in connected sources. You use it while you *build*. It lets you make sure that the source data is correct before you model it.\n- **Studio** queries the **semantic models** of a product. Its visual builder, Semantic SQL, and GraphQL modes all go through the semantic layer. Thus, they apply the same governed definitions. (The exception is the Source SQL mode of Studio. It queries the underlying physical models directly.)\n\nIn Semantic SQL, you write queries against semantic model names, not raw warehouse tables:\n\n```sql\nSHOW TABLES;                 -- semantic models the product exposes\nDESCRIBE customer_profile;   -- its dimensions and measures\n```\n\n### The semantic layer is the common path\n\nEvery consumption path queries the same thing: the semantic layer of the product.\n\n```text\nYour query -> semantic layer -> warehouse SQL (joins, aggregations, policies applied) -> result\n```\n\nFor this reason, a number is the same in Power BI and in an API.\n\n### Data Product MCP and AI activation\n\n**AI activation** is the DataOS pattern that makes governed Data Products usable through AI assistants. **Data Product MCP** delivers it. The key idea: Data Product MCP gives an assistant a **governed interface**. It **does not grant direct database access**. The assistant calls named MCP tools. The Data Product stays the system of record for semantics, contracts, policies, quality, lineage, and ownership.\n\nAI activation supports two journeys. You can **consume** governed data: ask questions, find products, and inspect trust signals. You can also **build** Data Products: discover, design, plan, scaffold, and validate them with help from the assistant.\n\n### Glossary checkpoint\n\nBefore you continue, make sure that you can define each of these glossary terms in one sentence: **Instance, Tenant, Data Plane, Control Plane, Resource, Manifest, Depot, Secret, UDL, Compute, Stack, Vulcan, Nilus, Minerva, Workbench, Studio, Data Product Hub, Perspective, MCP.**\n\n### Explore\n\nOpen the [Interfaces overview](https://v2.dataos.info/references/interfaces/overview) and the [AI activation](https://v2.dataos.info/references/interfaces/ai-activation) pages. For each case below, write down the interface that you pick. The cases are a quarterly board dashboard, a nightly script that pulls revenue, and an assistant that answers \"which product has customer churn data?\"","sources":["https://v2.dataos.info/references/interfaces/overview","https://v2.dataos.info/references/interfaces/ai-activation","https://v2.dataos.info/consume/evaluate/query-in-studio","https://v2.dataos.info/build/understand/explore-data/workbench","https://v2.dataos.info/consume/activate/querying-data-products","https://v2.dataos.info/consume/activate/apis","https://v2.dataos.info/references/glossary"]}],"lab":null,"takeaways":["The DataOS Instance is the Control Plane. The Data Plane runs in the cloud of the customer.","Only metadata, policies, telemetry, and instructions move between the planes. Customer data never leaves the customer environment.","Tenants share one Data Plane, but each Tenant isolates its namespace, connections, and access. Dataset metadata is visible across Tenants. The data is not.","Resources are declarative YAML manifests. Runnable Resources have logs and runtime state. Non-runnable Resources are configuration only.","Resource states: creating, active, failed, deleted.","Workbench queries physical tables. Studio and every activation path query the semantic layer."],"quiz":[{"q":"What moves between the DataOS Instance and the Data Plane?","options":["Full copies of customer tables for central processing","Only metadata, policies, operational telemetry, and execution instructions","Nothing. They are not connected","Raw data, but encrypted"],"answer":1,"explain":"The Instance exchanges only metadata, policies, telemetry, and execution instructions. Customer data never leaves the environment of the customer.","source":"https://v2.dataos.info/operate/architecture"},{"q":"A user in the `finance` Tenant finds a dataset in the catalog. The `marketing` Tenant ingested it. What can the user do?","options":["Query it immediately, because metadata is shared","Nothing. They cannot see it at all","See its metadata, but read the data only with a Depot, Secret, and access policies in their own Tenant","Copy the Secret of the marketing Tenant"],"answer":2,"explain":"Dataset metadata is visible across the Instance, but data access belongs to one Tenant. No Tenant inherits Secrets or Depots from another Tenant.","source":"https://v2.dataos.info/operate/architecture"},{"q":"Which of these Resources is non-runnable?","options":["Depot","Workflow","Nilus","Vulcan"],"answer":0,"explain":"A Depot only describes a connection, so it has no logs or runtime state. Workflow, Nilus, and Vulcan run code, so they are runnable.","source":"https://v2.dataos.info/references/resources/overview"},{"q":"Your team starts a proof of concept for one data initiative. Which model do the docs recommend?","options":["A separate Instance","A Tenant with shared compute","A new Data Plane per user","A Bundle"],"answer":1,"explain":"For a proof of concept or a focused initiative, the docs recommend a Tenant with shared compute. Use a separate Instance for strict isolation, external participants, or full control of the infrastructure.","source":"https://v2.dataos.info/operate/dataos-operator/choosing-between-instance-and-tenant"},{"q":"During Understand, a builder runs SQL against physical source tables. Which interface does the builder use?","options":["Studio","Data Product Hub","Data Product MCP","Workbench"],"answer":3,"explain":"Workbench is the general SQL exploration UI for physical tables in connected sources. Studio queries the semantic models of a product.","source":"https://v2.dataos.info/build/understand/explore-data/workbench"}]},{"id":"p6","title":"Roles and consumption","duration":"25 min","objectives":["Name the DataOS roles and the level (Instance or Tenant) of each role","Tell the difference between the work of a Tenant Admin and the work of a Data Admin","Explain why access is denied by default and how the Can Use grant gives access","Select a consumption path (BI, DB client, APIs, AI via MCP) for your deliverable","Read masking, row filters, and trust signals as a consumer"],"lessons":[{"title":"The DataOS roles","body":"### The roles work at different levels\n\nDataOS divides operational responsibility among roles. The roles work at three levels: **Instance**, **Tenant**, and **Resource**. The Operate section of the docs names five roles. The docs also describe a **Data Steward** role for the business glossary.\n\n| Role | Level | What they run and maintain |\n|---|---|---|\n| **DataOS Operator** | Instance | Provision the Data Plane, create and configure Tenants, set up authentication, invite Tenant Admins |\n| **Tenant Admin** | Tenant | Run Compute, data sources, and Stacks. Grant access. Keep the Tenant healthy |\n| **Data Admin** | Tenant | Create and govern Lakehouse namespaces, schemas, tables, and views |\n| **Data Product Developer** | Tenant | Make sure that the product is ready, deploy and promote, operate live products, write access policies |\n| **Data Product Consumer** | Tenant | Consume Data Products under the governance that DataOS enforces, assess trust, report issues |\n| **Data Steward** | Instance (DataOS-level) | View and update business glossary term descriptions in the Data Product Hub |\n\n> **Note:** In the Tenant role list, the developer and consumer roles have other names: **Data Developer** and **Data Consumer**. Examples are the `data_developer` and `data_consumer` tenant roles. The Operate pages call the same people the Data Product Developer and the Data Product Consumer.\n\n### DataOS Operator\n\nThe Operator is the Instance-level role with the highest privileges. The Operator works in the **Instance Admin** application. The checklist of the Operator has phases. First, the Operator provisions the Data Plane and designs the Tenants. Next, the Operator creates and sets up the Tenant (invite users, attach the Data Plane and Compute). Then the Operator configures the Tenant resources (deploy Stacks such as the Data Product MCP server, connect data sources).\n\nLast, the Operator **hands off** the Tenant to a Tenant Admin. Four conditions make a Tenant ready. The Data Plane and Compute are active. The Stacks are healthy. At least one Secret and one Depot are active. A sanity Data Product deploys and runs without errors.\n\n### Tenant Admin and Data Admin\n\nBoth roles are senior Tenant roles. The docs draw a clear line between them:\n\n- **Tenant Admin** runs the *Tenant*: users, roles, Compute, Secrets, Depots, and grants. If the question is \"who can use this Compute or data source, or who belongs to this Tenant,\" the job belongs to the Tenant Admin.\n- **Data Admin** runs the *Lakehouse*: its namespaces, schemas, tables, views, and access to that data. If the question is \"how is the Lakehouse data organized and who can query it,\" the job belongs to the Data Admin.\n\nA Tenant Admin cannot act outside the Tenant. Creating Tenants is the job of the Operator. A Tenant Admin also does not automatically get every capability that other roles hold.\n\n### Data Product Developer\n\nThe developer builds and operates Data Products with **Vulcan**. The developer builds data movement with **Nilus**. For this work, the developer uses Secrets and Depots.\n\nThe developer has four parts of operational work. The developer gets access and makes sure that the product is ready. The developer deploys and promotes the product across environments. The developer manages the access policies that the product enforces. The developer also monitors runs, failures, versioning, and cost.\n\n### Deny by default\n\nOne rule applies to every role: **access is denied by default**. A role does not automatically give access to shared Resources. By default, no Tenant role has use access to Compute, Secrets, Depots, or clusters. Each role needs an explicit **`Can Use`** permission. Even a Tenant Admin grants `Can Use` to their own account, and that grant is audited.\n\n> **Tip:** The first step for a developer is almost always \"Get access\". Ask the Tenant Admin for `Can Use` on the Compute and Depots that the product needs.\n\n### Data Product Consumer and Data Steward\n\nThe **Consumer** is the read-only role. A Consumer cannot build or change products and cannot grant access. A Consumer finds products in the **Data Product Hub**, not in the Resource Catalog.\n\nThe **Data Steward** role is not granted by default. A user requests it from a DataOS Operator. The one permission that the docs state for it is to update business glossary descriptions. These descriptions are maintained globally at the Data Plane level.","sources":["https://v2.dataos.info/operate/readme","https://v2.dataos.info/operate/dataos-operator/operator","https://v2.dataos.info/operate/tenant-admin/tenant-admin","https://v2.dataos.info/operate/data-admin/data-admin","https://v2.dataos.info/operate/data-developer/data-product-developer","https://v2.dataos.info/operate/data-consumer/data-product-consumer","https://v2.dataos.info/operate/data-steward/overview","https://v2.dataos.info/operate/access-control/roles-and-permissions"]},{"title":"Consumption paths, governance, and trust","body":"### Discover, evaluate, activate\n\nThe docs describe three stages for consumers:\n\n1. **Discover** the right product. Use the **Data Product Hub** (select **Products** on the DataOS home page), or ask a connected AI client.\n2. **Evaluate** the product: can you trust it? Explore its assets, examine trust and freshness, look at recent activity, and query it in **Studio**.\n3. **Activate** the product where you work.\n\nYou discover and evaluate a product one time. After that, you activate it as often as you want, and you do not evaluate it again. AI runs through all three stages \"as a mode, not a separate track.\"\n\n### The consumption paths\n\nOn a product page, the **Activate** menu lists **MCP**, **BI Tools**, **APIs**, and **Database Client**.\n\n| Path | Use it when |\n|---|---|\n| BI tools (Power BI, Tableau) | Your deliverable is a report or dashboard |\n| Database clients (over the MySQL protocol) | You want to explore in a familiar desktop SQL client |\n| APIs (GraphQL, Data APIs, SDKs) | An application or automation needs governed data through code |\n| Consume with AI (Data Product MCP) | You want an AI client or agent to query data within governance |\n\nThe rule in the docs: **the right path depends on your deliverable, not the product.** Each path queries the same governed semantic layer.\n\nThe Orders Analytics example has three consumers on three paths. A finance analyst builds a revenue dashboard in Power BI. An application calls the APIs for daily order counts. An assistant answers \"how did revenue trend last quarter?\" through MCP. All three read the same `revenue` definition.\n\n### AI agents through Data Product MCP\n\nThe assistant **does not get an unrestricted database connection**. It calls Data Product MCP tools. These tools go through the Data Product APIs, authorization, semantic definitions, quality checks, lineage, and ownership metadata.\n\nEvery request carries the **user's own credentials**. Thus the assistant sees only the data that the user has access to. A masked column comes back masked, and an inaccessible product never appears. If the semantic surface cannot answer a question, the assistant returns a clear limitation. It does not fabricate a measure.\n\n### How governance affects your results\n\nAs a consumer, you do not configure policies. But the policies shape your results:\n\n- **Masked columns**: sensitive fields still appear, but `null`, a hash, or another masked expression replaces the values.\n- **Row-level filters**: a filter can limit your view to your region or business unit.\n\n> **Warning:** Before you report a bug, find out whether a policy causes the result. A masked or empty column is usually a **policy, not a data-quality problem**. A total that looks low can come from a row filter.\n\nIf you need more access, the **product owner** makes the decision. Find the owner in the **Contacts** section of the product page in the Hub. Approved changes arrive as an audited grant or policy update.\n\n### Trust signals\n\nBefore you rely on a product, read its signals:\n\n| Signal | What it tells you |\n|---|---|\n| **Quality** | Whether the checks pass. A gauge shows this, with dimensions such as Validity, Uniqueness, and Completeness |\n| **Freshness** | The time since the last run, and whether recent runs succeeded |\n| **Lineage** | Where a figure comes from |\n| **Run history** | Whether the product runs reliably |\n| **AI-readiness** | Whether it is safe to point an agent at it. **Tier A** means production-ready |\n\nFollow these good habits. **Examine trust before first use, not after a bad number.** Examine it again after a version change or a breaking change. Follow the products that you depend on. If data is stale or failing, escalate it to the owner. Do not work around it.\n\n### Consume responsibly\n\n- **Keep governed logic in DataOS.** Use approved metrics and Perspectives. Do not export data and rebuild the logic in a spreadsheet, because that recreates drift.\n- **Protect your API token.** Do not commit it. Set an expiry, and rotate it.\n- **Reuse, do not rebuild.** A published product can be the input to a new product.","sources":["https://v2.dataos.info/consume/get-started/readme","https://v2.dataos.info/consume/activate/overview","https://v2.dataos.info/consume/consume-with-ai/overview","https://v2.dataos.info/operate/data-consumer/modes-of-consumption","https://v2.dataos.info/operate/data-consumer/governance-enforced","https://v2.dataos.info/operate/data-consumer/trust-and-monitor","https://v2.dataos.info/consume/evaluate/trust-and-freshness"]}],"lab":null,"takeaways":["The Operator works at the Instance level. Tenant Admin, Data Admin, Data Developer, and Data Consumer work inside a Tenant.","Tenant Admin runs the Tenant (users, Compute, connections, grants). Data Admin runs the Lakehouse.","Access is denied by default. Resources such as Compute and Depots need an explicit Can Use grant.","Consumers discover, evaluate, and then activate. The path depends on the deliverable, not the product.","Data Product MCP gives agents a governed interface that uses the user's own credentials. It does not give direct database access.","A masked column or a low total is usually policy, not a bug. For more access, ask the product owner."],"quiz":[{"q":"Who creates Tenants and attaches the Data Plane?","options":["Tenant Admin","Data Admin","DataOS Operator","Data Product Developer"],"answer":2,"explain":"The Operator creates Tenants and attaches the Data Plane. This is Instance-level work. The authority of a Tenant Admin stops at the Tenant boundary.","source":"https://v2.dataos.info/operate/dataos-operator/operator"},{"q":"You get this question: 'What is the right structure for the Lakehouse namespaces and tables, and who can query them?' Whose job is it?","options":["Data Admin","Tenant Admin","Data Product Consumer","Data Steward"],"answer":0,"explain":"The docs give Lakehouse structure and data governance to the Data Admin. The Tenant Admin handles users, Compute, connections, and grants.","source":"https://v2.dataos.info/operate/tenant-admin/tenant-admin"},{"q":"A new Data Product Developer cannot reference a team Compute in a deployment. What is the most likely cause?","options":["Compute resources cannot be shared","Access is denied by default, and they have no Can Use grant","Developers must create a new Data Plane","Their Tenant has no Lakehouse"],"answer":1,"explain":"By default, no Tenant role has use access to Compute, Secrets, or Depots. Each role needs an explicit Can Use grant from the Tenant Admin.","source":"https://v2.dataos.info/operate/data-developer/data-product-developer"},{"q":"In Orders Analytics, an analyst sees hashed values in the `email` column. What is the best first explanation?","options":["The pipeline corrupted the data","The product is not fresh","The BI tool has a bad configuration","A masking policy applies to them. This is policy, not a data-quality problem"],"answer":3,"explain":"The docs say that a masked or empty column is usually a policy, not a data-quality issue. If you need more access, ask the product owner through Contacts.","source":"https://v2.dataos.info/operate/data-consumer/governance-enforced"},{"q":"How does an AI assistant access data through Data Product MCP?","options":["It calls governed MCP tools with the user's own credentials","It receives a direct database connection with admin rights","It reads a nightly export of every table","It goes around policies to answer faster"],"answer":0,"explain":"Data Product MCP does not give direct database access. Each request carries the credentials of the user. The request goes through the same policy enforcement as the rest of the platform.","source":"https://v2.dataos.info/consume/consume-with-ai/overview"}]}],"exam":{"passMark":70,"timeMinutes":35,"questions":[{"domain":"The half-product problem","q":"Which pattern does the DataOS Philosophy page call *correct* but incomplete for consumers?","options":["ETL","ELT","Federated querying","Manual spreadsheets"],"answer":1,"explain":"ELT is correct because of cheap storage, elastic compute, and a raw layer that survives. But ELT does nothing for consumption. The page criticizes ETL because it discards raw data.","source":"https://v2.dataos.info/readme-1"},{"domain":"The half-product problem","q":"In the drift example, which tool is the *last* to show the revenue change, after it re-crawls on Thursday?","options":["The semantic layer","The quality platform","The governance tool","The catalog"],"answer":3,"explain":"The catalog re-crawls on Thursday. It still labels revenue 'gross sales' until a person edits the description.","source":"https://v2.dataos.info/readme-1"},{"domain":"The half-product problem","q":"Why does a fifth tool not fix drift?","options":["It adds a fifth clock, but the separation that causes drift stays","You cannot integrate the tools with each other","Five tools are more than the license limits allow","Drift affects only dashboards"],"answer":0,"explain":"Separation causes drift. A new tool is one more system with its own schedule.","source":"https://v2.dataos.info/readme-1"},{"domain":"The half-product problem","q":"In the example in the docs, an analyst reports Q3 revenue of $4.21M. An agent reports $4.88M. What causes the difference?","options":["The agent used a newer snapshot of the data","The analyst rounded the numbers","The agent used the deprecated gross table that the catalog still blessed, with no flag","The agent applied a row filter to the data"],"answer":2,"explain":"The agent used the stale gross definition at machine speed. The analyst knew from context that revenue is net of refunds.","source":"https://v2.dataos.info/readme-1"},{"domain":"What a Data Product is","q":"Which phrase is the informal definition of a Data Product in DataOS?","options":["Any table with a description","Data you can hand to someone, or something, that never met you, and trust them to use it correctly","A pipeline with a schedule","A dashboard with certified metrics"],"answer":1,"explain":"That is the informal definition in the docs. The formal definition adds a named owner, a contract, consumers, and a versioned lifecycle.","source":"https://v2.dataos.info/readme-1"},{"domain":"What a Data Product is","q":"Which property is mainly about serving the product through interfaces that suit each consumer, such as SQL, BI, APIs, or AI?","options":["Natively accessible","Addressable","Secure","Understandable"],"answer":0,"explain":"Natively accessible means that consumers get to the product through output interfaces that suit their tools.","source":"https://www.moderndata101.com/chapters/introduction-to-data-products"},{"domain":"What a Data Product is","q":"Why is a pipeline not a Data Product?","options":["Pipelines cannot run on a schedule","Pipelines are always streaming","Consumers own the pipelines","It is only plumbing. The product is the owned, contracted output built on it"],"answer":3,"explain":"The docs say: 'The pipeline is plumbing. The product is the owned, contracted output built on top of it.'","source":"https://v2.dataos.info/readme-1"},{"domain":"What a Data Product is","q":"According to the glossary, what does an SLA cover for a Data Product?","options":["Limits on the cost of compute","Measurable commitments on freshness, availability, completeness, and quality","The list of approved BI tools","The branch strategy in Git"],"answer":1,"explain":"The glossary defines an SLA as published, measurable commitments on freshness, availability, completeness, and quality.","source":"https://v2.dataos.info/references/glossary"},{"domain":"What a Data Product is","q":"A team wants to give an AI agent a product that they built for an executive dashboard, with no changes. What caution do the docs give?","options":["Agents cannot read Data Products","Dashboards and agents always need the same data","Fitness is per consumer. Summaries for humans often lack the detail a model needs","You must convert the product into a pipeline first"],"answer":2,"explain":"The docs warn that a product built for a dashboard is not automatically fit for an agent. You design fitness. A product does not inherit it.","source":"https://v2.dataos.info/readme-1"},{"domain":"Product thinking and the journey","q":"Why does complexity grow additively with Discover, and not multiplicatively?","options":["New questions reuse existing products and do not start a new pipeline from zero","It deletes the tables that nobody uses","It moves all of the data into one Lakehouse","It skips the Design stage"],"answer":0,"explain":"When you reuse or extend existing products, you do not need a new pipeline for every question.","source":"https://v2.dataos.info/data-product-journey-v2"},{"domain":"Product thinking and the journey","q":"In software, you publish an interface and hide the implementation. What is the equivalent for a Data Product?","options":["Hide the schema from the consumers","Give consumers direct paths to storage","Publish only dashboards","Declare schema, semantics, and SLA first. Consumers bind to the contract, not to storage paths"],"answer":3,"explain":"In contract-first design, consumers depend on the contract. So the implementation can change underneath.","source":"https://v2.dataos.info/readme-1"},{"domain":"Product thinking and the journey","q":"In the Build step of Orders Analytics, which artifact blocks records such as duplicate order IDs or negative revenue?","options":["Metrics","Assertions","Seeds","Semantic models"],"answer":1,"explain":"Assertions block bad records. Metrics define time-series measures. Seeds are static CSVs.","source":"https://v2.dataos.info/data-product-journey-v2"},{"domain":"Product thinking and the journey","q":"In the product roles of Modern Data 101, who owns the backlog, delivery quality, and acceptance?","options":["Data Product Manager","Platform engineer","Data Product Owner","Executive sponsor"],"answer":2,"explain":"The Data Product Owner owns the backlog and acceptance. The Data Product Manager owns the vision, the roadmap, and the business case.","source":"https://www.moderndata101.com/blogs/what-are-data-products-the-complete-guide"},{"domain":"How DataOS builds","q":"Which Build stage comes *before* the ELP pattern?","options":["Move","Productize","Publish","Understand"],"answer":3,"explain":"Understand is reconnaissance before the pattern. Move is Extract + Load. Productize is P.","source":"https://v2.dataos.info/build/get-started/readme"},{"domain":"How DataOS builds","q":"A team must capture every insert, update, and delete from an operational database in near real-time, without full reloads. Which Nilus type fits?","options":["Change data capture (CDC)","Batch","Streaming from Kafka","Seeds"],"answer":0,"explain":"CDC captures row-level changes from transactional databases. Batch is for scheduled loads. Streaming is for event streams.","source":"https://v2.dataos.info/build/move/overview"},{"domain":"How DataOS builds","q":"What does a UDL look like?","options":["jdbc://host:port/db","dataos://[depot-name]/[source-path]","s3://bucket/key?password=...","vulcan://tenant/product"],"answer":1,"explain":"The Uniform Data Link (UDL) is dataos://[depot]/[source-path]. So tools never need credentials at the point of use.","source":"https://v2.dataos.info/build/understand/connect-sources"},{"domain":"How DataOS builds","q":"In Vulcan governance, where do you attach access policies?","options":["Directly to the semantic models","To the Depot","To the physical model. Semantic and metric models inherit them","To the BI tool"],"answer":2,"explain":"The Governance page states that policies attach to physical models only. Semantic and metric models inherit the rules.","source":"https://v2.dataos.info/build/productize/governance"},{"domain":"How DataOS builds","q":"Which command validates a Vulcan project locally? It detects changes, classifies impact, materializes, and runs assertions.","options":["vulcan plan","vulcan run","dataos-ctl resource delete","vulcan create_deploy_yaml"],"answer":0,"explain":"vulcan plan is the validation step. vulcan run refreshes data on an applied shape. create_deploy_yaml renders the deploy manifest.","source":"https://v2.dataos.info/build/productize/plan-and-run"},{"domain":"The platform at a glance","q":"Where does the Data Plane run?","options":["Only on the hosted cloud of the vendor","On each user's laptop","In the customer cloud environment, usually on Kubernetes","Inside the BI tool"],"answer":2,"explain":"The Data Plane runs entirely in the customer cloud. The Instance (Control Plane) is hosted.","source":"https://v2.dataos.info/operate/architecture"},{"domain":"The platform at a glance","q":"What test do the docs give to decide whether a Resource is runnable?","options":["If you would ever ask 'what are its logs?', it is runnable","If it has a name field","If it uses v2alpha","If it has tags"],"answer":0,"explain":"Runnable resources execute code and have logs and runtime state. Non-runnable resources only describe connections, credentials, or capacity.","source":"https://v2.dataos.info/references/resources/overview"},{"domain":"The platform at a glance","q":"A Resource is shown with status `failed`. What does that mean?","options":["Someone removed it, and you must deploy it again","Provisioning or reconciliation had an error","Provisioning is not complete yet","It is deployed and available"],"answer":1,"explain":"failed means that provisioning or reconciliation had an error. The other states are creating, active, and deleted.","source":"https://v2.dataos.info/references/resources/overview"},{"domain":"The platform at a glance","q":"Which requirement points to a separate Instance and not a Tenant?","options":["A proof of concept","Predictable workloads with low neighbor impact","Cost efficiency first, through shared infrastructure","External vendors or consultants take part"],"answer":3,"explain":"If participants come from other departments or from outside, use a separate Instance. The other requirements favor a Tenant.","source":"https://v2.dataos.info/operate/dataos-operator/choosing-between-instance-and-tenant"},{"domain":"Roles and consumption","q":"How do you get the Data Steward role, and what is its confirmed permission?","options":["Every Tenant Admin gets it automatically. It creates Tenants","You request it from a DataOS Operator. It updates business glossary descriptions","A Data Consumer assigns it. It grants Can Use","It is part of the Data Admin role. It manages Lakehouse tables"],"answer":1,"explain":"DataOS does not grant Data Steward by default. Request it from an Operator. Its confirmed permission is to update glossary descriptions.","source":"https://v2.dataos.info/operate/data-steward/overview"},{"domain":"Roles and consumption","q":"A product manager wants a quarterly dashboard in Power BI on Orders Analytics. Which consumption path fits?","options":["APIs","Data Product MCP","BI tools","Workbench"],"answer":2,"explain":"The docs say: if the deliverable is a report or dashboard, pick BI tools. The path depends on the deliverable.","source":"https://v2.dataos.info/operate/data-consumer/modes-of-consumption"},{"domain":"Roles and consumption","q":"On the Trust and freshness page, what does AI-readiness Tier A mean?","options":["Production-ready. You can connect an AI agent with confidence","All quality checks are off","The product has no semantic layer","Only humans can consume the product"],"answer":0,"explain":"Tier A means production-ready for AI use. Lower tiers show a checklist of gaps, such as MCP server, validated prompts, rich descriptions, and semantic layer.","source":"https://v2.dataos.info/consume/evaluate/trust-and-freshness"}]},"reviewNotes":["Eight properties: the v2 Philosophy page (readme-1) says 'Eight properties define one' but lists them only in an image (DP_properties.png); no v2 text page (including the glossary) names them. The course uses the Modern Data 101 list (Discoverable, Addressable, Understandable, Natively accessible, Trustworthy, Interoperable, Independent/self-contained, Secure). An SME should confirm it matches the image labels.","Stage naming differs across v2 pages: Philosophy lists Understand/Productize/Consume; Build intro lists Understand/Move/Productize; the Journey uses Discover/Design/Build/Publish/Consume. The course teaches Understand/Move/Productize for Build and explains the others as different zoom levels.","Governance conflict: the Build intro (build/get-started/readme) says 'semantic-model policies mask or filter', while Productize > Governance says policies attach to physical models only and semantic/metric models inherit them. The course follows the Governance page.","Engine list mismatch: the Engine guide and Connect sources list nine engines (incl. Redshift, Athena, Trino), but the Supported connectors Vulcan column ticks only DataOS Lakehouse, Databricks, Fabric, SQL Server, PostgreSQL, Snowflake. The course cites the Engine guide.","Version fields: Resources overview says 'Use v2alpha for all current resources', but the docs' Nilus batch template and rendered Vulcan deploy manifest use v1alpha. Lessons show YAML as given; no question tests version strings.","Role naming: Operate pages say Data Product Developer/Consumer; Tenant role list and glossary say Data Developer/Data Consumer. Operate intro names five roles; Data Steward is documented separately as an Instance-level role. The course lists six and explains the naming.","Data Product Manager/Owner, RACI, Design/Develop/Deploy/Evolve and product-thinking elements come from Modern Data 101 (undated pages), not v2 docs; they are labeled as such.","Glossary still defines Bento and mentions Flare under Lakehouse; the course does not teach them."]}</script>
<script type="application/json" id="data-beginner">{"id":"beginner","title":"Practitioner","tagline":"Take your first hands-on steps. Set up your tools, build a Data Product locally, connect and explore data, manage Resources, and consume governed products.","audience":"This course is for data engineers, Data Product developers, and operators who take their first hands-on steps with DataOS v2.","prerequisites":["DataOS Primer (or equivalent): Data Products, Extract-Load-Productize, the Understand / Move / Productize stages, Resources, and roles","Comfort with a terminal, basic SQL, and YAML","A DataOS user account in a sandbox or dev tenant (ask your administrator)","Python 3.10-3.13 and Docker on your workstation"],"duration":"~7 hours","outcomes":["Install, initialize, and authenticate the DataOS CLI, and manage multiple tenant contexts","Set up the Local Development Kit and build a tested Data Product locally with seeds, a transform, assertions, a semantic model, and a metric","Create a Secret and Depot, address data by UDL, and explain how a Nilus metadata scan makes a source discoverable","Inspect datasets in the catalog, and make sure that the values are correct in Workbench before you commit to a source","Write, lint, apply, inspect, and delete Resource manifests, and choose the correct commands for runnable and non-runnable types","Discover and evaluate Data Products in the Hub by their assets, trust, freshness, and activity signals, and save a Perspective from Studio","Connect SQL clients and BI tools (Tableau, Power BI) to a Data Product over the MySQL wire protocol with the correct settings"],"examBlueprint":[{"domain":"Environment setup","weight":13},{"domain":"Local build with Vulcan","weight":20},{"domain":"Understanding data sources","weight":17},{"domain":"Resources and the CLI","weight":20},{"domain":"Discover and evaluate","weight":17},{"domain":"Activation","weight":13}],"modules":[{"id":"b1","title":"Set up your environment","duration":"60 min","objectives":["Install the DataOS CLI (dataos-ctl) and make sure that it works with --help","Create a tenant context with dataos-ctl init, log in, and make sure that the CLI is healthy","Set up the Local Development Kit: a supported Python, a virtual environment, Vulcan, and a local engine","Explain how DataOS uses a Git repository and a git-sync Secret to pull your project at deploy time"],"lessons":[{"title":"What you need before your first build","body":"You write a Data Product in DataOS on your own machine, and then you deploy it to a tenant. Before you write the first model, you need three tools and one type of access. This lesson describes them and shows how to install the first tool: the DataOS Command Line Interface.\n\n### The three prerequisites\n\n| Prerequisite | What it is for |\n| --- | --- |\n| **DataOS CLI** (`dataos-ctl`) | Apply and inspect DataOS Resources from your terminal |\n| **Local Development Kit (LDK)** | Write and test Data Products on your machine: Python, a virtual environment, Vulcan, and a local engine |\n| **Git repository** | Holds your Vulcan project. DataOS pulls it at deploy time |\n\nYou set these up one time. After that, every build uses the same pattern. You write and test locally with the LDK, push to Git, and deploy with the CLI.\n\nNote that the list does *not* include data source connections. In the v2 docs, a source connection (a Secret plus a Depot) is the first step of the **Understand** stage. The reason is that to connect a source is part of how you understand it. You do that in module b3.\n\n### Access is granted, not self-served\n\nDataOS is **deny-by-default**. A new `Data Developer` starts with no access to shared Compute, Depots, or Secrets. Your tenant admin gives each of these as a `Can Use` grant. You can write and test locally without these grants. But you cannot deploy until you have them, so ask for them early.\n\n> **Note:** Before you start, your DataOS administrator must make sure that you have a user account and access to your organization's DataOS context. If you do not have access to a DataOS instance at all, ask your administrator to invite you.\n\n### Installing the CLI\n\nThe CLI runs on macOS, Linux, and Windows. On macOS and Linux, you need `curl`. To find out whether you have it, run `curl --version`. On Windows, you need `tar`. It is part of Windows 10 version 1803 and later, and of Windows 11.\n\nThe install command is not a public download link. You get it from your own instance:\n\n1. Open the home page of your DataOS instance and log in.\n2. Find the **Setup DataOS CLI** section on the landing page.\n3. Copy the install command from that section.\n\nOn macOS and Linux, the command downloads an installer script with your bearer token and sends it to the shell:\n\n```bash\ncurl --request GET 'https://<instance-url>/home/dataos/cli-dev-v2/install.sh' \\\n  --header 'Authorization: Bearer <your-token>' | sh\n```\n\nThe installer downloads the package for your OS and architecture and makes sure that its checksum is correct. Then it prints the line to add to your `PATH`:\n\n```bash\nexport PATH=$PATH:$HOME/.dataos/v2/bin\n```\n\nAdd that line to your shell startup file (`~/.zshrc` for Zsh, `~/.bash_profile` for Bash). Then open a new terminal.\n\nOn Windows, you download a pre-built package from the same **Setup DataOS CLI** section. Its name looks like `dataos-cli--aa.bb.cc-windows-amd64.tar.gz`. Use `tar` to extract `dataos-ctl.exe` into `%LOCALAPPDATA%\\Programs\\dataos-cli\\bin`, and add that folder to your user `PATH`. The `PATH` change applies only to terminals that you open after the change. Restart your terminal and any IDE (VS Code, Cursor) before you continue.\n\n### Confirm the install the right way\n\n```bash\ndataos-ctl --help\n```\n\nA working install prints the list of command groups: `depot`, `develop`, `health`, `init`, `lakehouse`, `login`, `resource`, `tenant`, `user`, `version`, and others.\n\n> **Warning:** Use `--help`, not `version`, to make sure that the install works. Before you initialize the CLI, most commands (`version` too) stop and ask whether you want to run initialization. They do not do what you asked. `--help` is the one command that skips that test.\n\n### Common install problems\n\n- **`command not found`**: the install directory is not on your `PATH`. On macOS and Linux, the directory is `$HOME/.dataos/v2/bin`. On Windows, it is `$env:LOCALAPPDATA\\Programs\\dataos-cli\\bin`. To look at it, run `echo $PATH`.\n- **Checksum mismatch** (`sha256sum: WARNING: 1 computed checksum did NOT match`): the download is corrupt. Download the package for your OS and architecture again.\n\nWhen the binary is in place, the next step is to connect it to your tenant.","sources":["https://v2.dataos.info/build/get-started/prerequisites","https://v2.dataos.info/build/get-started/prerequisites/cli-setup","https://v2.dataos.info/references/interfaces/command-line-interface"]},{"title":"Connect the CLI: contexts, login, and health","body":"An installed CLI does not yet know which DataOS instance or tenant to use. You tell it with a **tenant context**. A tenant context is a named profile on your machine that records the instance domain and the tenant identifier. Every later command acts on the active context.\n\n### Create a context with `init`\n\n```bash\ndataos-ctl init\n```\n\nThe CLI shows a short interactive prompt and asks for three values:\n\n```\nINFO[0000] 🚀 initialization...\nINFO[0000] The DataOS® is not initialized, do you want to proceed with initialization? (Y,n)\n-> Y\nPlease enter a name for the current DataOS® Context?\n-> my-tenant\nPlease enter the Fully Qualified Domain Name of the DataOS® instance?\n-> dataossanbox.instance.dataos.cloud\nPlease enter the Tenant Identifier to use for the DataOS® instance?\n-> engineering\nentered DataOS®: my-tenant : dataossanbox.instance.dataos.cloud : engineering\n🚀 initialization...complete\n```\n\n| Prompt | What to enter |\n| --- | --- |\n| Context name | Any local label, for example `my-tenant` or `dev` |\n| Fully Qualified Domain Name | The instance domain **without** `https://` |\n| Tenant Identifier | Your tenant name, in **lowercase** |\n\n> **Warning:** If you type `https://` into the domain prompt, login fails later with an error like `Post \"https://https//...\" : lookup https: no such host`. To correct it, run `dataos-ctl init` again and enter only the domain.\n\nYou can also skip the prompts and give the values as flags. This is useful in scripts:\n\n```bash\ndataos-ctl init \\\n  --flag-init \\\n  --context-name my-tenant \\\n  --fully-qualified-domain-name dataossanbox.instance.dataos.cloud \\\n  --tenant-identifier engineering\n```\n\n### Several tenants, one CLI\n\nTeams often keep separate tenants for `dev`, `stg`, and `prod`. To add another context, run `dataos-ctl init` again. A context already exists, so the CLI first asks whether you want to add a new tenant context. Then it shows the standard initialization prompt again. That second prompt is not an error. Answer `Y` and continue.\n\nList your contexts. The `*` marks the active context, and its instance and tenant follow:\n\n```bash\ndataos-ctl tenant list\n```\n\n```\n  my-tenant2\n  my-tenant3\n* my-tenant\n\n🔗...https://dataossanbox.instance.dataos.cloud\n⛺️...engineering\n```\n\nSwitch the active context:\n\n```bash\ndataos-ctl tenant select --name my-tenant2\n```\n\n`tenant` has several aliases: `context`, `tnt`, `tent`, `tents`, `tt`, `tenants`. For example, `dataos-ctl context list` does the same thing as `dataos-ctl tenant list`.\n\n> **Tip:** Before you apply anything, run `dataos-ctl tenant list` and look at the `*`. After you have more than one context, the most common beginner mistake is to apply a manifest to the wrong tenant.\n\n### Log in\n\n```bash\ndataos-ctl login\n```\n\nThis command authenticates the CLI against the **active** context. It opens a browser window. Complete the sign-in there and go back to your terminal.\n\n### Check health and versions\n\n```bash\ndataos-ctl health\n```\n\n```\nDataOS® CLI...OK\nDataOS® CK...OK\nhub-fqdn        : dataossanbox.instance.dataos.cloud\nhub-tcp-fqdn    : tcp.dataossanbox.instance.dataos.cloud\ntenant-id       : engineering\n```\n\n`DataOS® CLI...OK` tells you that the binary works. `DataOS® CK...OK` tells you that the CLI reached the control kernel of the instance. If you think that you have a connection or authentication problem, run `health` first. Also note the `hub-tcp-fqdn` value. SQL and BI clients in module b6 connect to a TCP host. You can compare this value with the value that the product page gives you.\n\nAfter initialization, `dataos-ctl version` prints only the version of the CLI and needs no live connection. To also query the instance, add `--all`:\n\n```bash\ndataos-ctl version --all --disableLogo\n```\n\n### Finding your way around\n\n- `dataos-ctl --help` lists every command group. `dataos-ctl [command] --help` explains one group.\n- `dataos-ctl user get` shows your user information and role tags. Use it to find out whether you have the role that you need to create Secrets and Depots.\n- `dataos-ctl tui` opens an interactive terminal UI to browse Resources. It needs an interactive terminal.\n\nYour CLI is now installed, connected to a tenant, and authenticated. Next, you set up the toolkit that you build with.","sources":["https://v2.dataos.info/build/get-started/prerequisites/cli-setup","https://v2.dataos.info/references/interfaces/command-line-interface","https://v2.dataos.info/operate/cli","https://v2.dataos.info/operate/data-developer/cli-dev-cheatsheet"]},{"title":"The Local Development Kit and your repository","body":"The **Local Development Kit (LDK)** is the local toolkit that you use to write and test Data Products. Its setup has four parts: a supported Python, an isolated virtual environment, Vulcan, and an engine that Vulcan writes to. Your project then lives in a Git repository that DataOS can read at deploy time.\n\n### 1. A supported Python\n\nVulcan requires **Python 3.10 to 3.13** (`>=3.10,<3.14`). Vulcan does not support Python 3.9 and earlier, or 3.14 and later.\n\n```bash\npython --version\n```\n\nOn some macOS and Linux systems, the command is `python3`. Use the command that reports a supported version.\n\n### 2. A virtual environment\n\nAlways install Vulcan in an isolated environment, so that it cannot conflict with other Python projects:\n\n```bash\npython -m venv .venv\nsource .venv/bin/activate\npip install --upgrade pip\n```\n\nOn Windows, activate with `.venv\\Scripts\\activate.bat` (Command Prompt) or `.\\.venv\\Scripts\\Activate.ps1` (PowerShell). If PowerShell blocks the script, run `Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned` one time. This command does not need administrator access.\n\n### 3. Vulcan\n\nVulcan is a Python wheel that you download from the LDK setup page. Put the `.whl` file in your working folder. Install it with the extra for your target engine. Put quotes around the path, so that your shell does not interpret the brackets:\n\n```bash\npip install \"./vulcan-0.228.1.30-py3-none-any.whl[postgres]\"\nvulcan --version\n```\n\nThe available extras include `postgres`, `snowflake`, `databricks`, `spark`, `trino`, `mssql`, `fabric`, `redshift`, and `athena`.\n\n> **Note:** The wheel version in the example (`0.228.1.30`) is the version in the current docs. The version number changes between releases, so use the file that you downloaded.\n\nThere are two classic errors. `... is not a supported wheel on this platform` means that your Python is outside 3.10–3.13 and not supported. Make a new venv with a supported Python. `zsh: no matches found` means that you did not put quotes around the `[engine]` extra.\n\n### 4. A project and an engine\n\n`vulcan init` creates the structure of a project:\n\n| Folder / file | Holds |\n| --- | --- |\n| `config.yaml` | Connections, model defaults, linting, and the `deployment:` block |\n| `models/` | SQL and Python models. `models/semantics/` holds semantic models and `models/metrics/` holds metrics |\n| `seeds/` | CSV files that Vulcan loads as static tables |\n| `audits/`, `dq/`, `tests/` | Blocking audits, non-blocking data quality checks, and YAML unit tests |\n| `macros/`, `plugins/`, `policies/` | Reusable SQL, the `after_authorize` auth hook, and access and masking policies |\n| `usage.yml`, `agreement.md` | Usage metadata and an optional data-sharing agreement. Consumers see both |\n\nFor local work, the running example in the docs uses **PostgreSQL**. You have two choices. You can point `config.yaml` at an existing Postgres and keep the password in an environment variable (`password: \"{{ env_var(POSTGRES_PASSWORD) }}\"`). Or you can start a Postgres with Docker and the compose file from the LDK setup page. That compose file exposes a `warehouse` database on `localhost:5433`:\n\n```bash\ndocker network create vulcan\ndocker compose -f docker/docker-compose.warehouse.yml up -d\n```\n\nThen make sure that Vulcan can connect to it:\n\n```bash\nvulcan info\n```\n\nA successful `vulcan info` means that the project is ready to build. The Quickstart looks for `Data warehouse connection succeeded`.\n\n### 5. The repository\n\nVulcan projects live in Git. At deploy time, DataOS reads a manifest that Vulcan renders from `config.yaml`. At runtime, DataOS pulls your files through **git-sync**. The supported providers are GitHub, Bitbucket, and AWS CodeCommit.\n\nThe `deployment:` block in `config.yaml` names the repo, the Compute, and the run-as user. The keys are `snake_case`:\n\n```yaml\ndeployment:\n  repo:\n    url: <git repo url>\n    base_dir: <repo-name>/<path-to-the-project>\n    secret_id: <workspace>:<secret-name>   # the Git credentials Secret, created below\n    sync_flags:\n      - '--ref=main'           # the branch to deploy\n      - '--submodules=off'\n  compute: <compute-resource-name>\n  run_as_user: <service-user>\n```\n\n`repo.url`, `repo.base_dir`, `compute`, and `run_as_user` are required. For a private repository, store a personal access token in a `key-value` Secret with `GITSYNC_USERNAME` and `GITSYNC_PASSWORD`. Read access is enough for the token. Apply the Secret with `dataos-ctl resource apply` and reference it as `repo.secret_id`. Since the September 2026 release, `secret_id` is required only for a repository that needs authentication.\n\n> **Warning:** Never commit the Secret manifest. Its `data` block is plaintext. Add `git-sync-secret.yml` to `.gitignore`. Use a dedicated service account, not a personal one, and rotate the token regularly.\n\nBefore you deploy anything, render and **lint** the manifest without applying it:\n\n```bash\nvulcan create_deploy_yaml -o - | dataos-ctl resource apply --in -l\n```\n\n`--in` reads the manifest from stdin. `-l` makes sure that the manifest is valid and creates nothing. If there are errors, correct them in `config.yaml`. Run the command again until it passes with no errors.","sources":["https://v2.dataos.info/build/get-started/prerequisites/ldk-setup","https://v2.dataos.info/build/get-started/prerequisites/repository-setup","https://v2.dataos.info/releasenotes/september-2026"]}],"lab":{"title":"Lab: Ready your workstation","goal":"A DataOS CLI that is installed, initialized, logged in and healthy, plus a Vulcan virtual environment connected to a local Postgres engine.","duration":"40 min","prereqs":["A DataOS user account and the URL of your instance (ask your administrator)","curl (macOS/Linux) or tar (Windows), Python 3.10-3.13, and Docker","The Vulcan wheel downloaded from the LDK setup page"],"steps":["**Install the CLI.** Log in to `https://<your-instance-url>/` and open **Setup DataOS CLI**. Run the install command that it shows. On macOS and Linux, the command looks like this:\n\n```bash\ncurl --request GET 'https://<instance-url>/home/dataos/cli-dev-v2/install.sh' \\\n  --header 'Authorization: Bearer <your-token>' | sh\n```\n\nAdd `export PATH=$PATH:$HOME/.dataos/v2/bin` to `~/.zshrc` or `~/.bash_profile`. Then open a new terminal.","**Make sure that the binary works.**\n\n```bash\ndataos-ctl --help\n```\n\nThe output shows `Available Commands:` with `init`, `login`, `resource`, and `tenant`.","**Create a context.** Run `dataos-ctl init`. At the prompts, enter these values:\n\n- A context name, for example `dev`.\n- Your instance FQDN **without** `https://` (`<your-instance-fqdn>`).\n- Your tenant identifier in lowercase (`<your-tenant-id>`).","**Log in and make sure that the CLI is healthy.**\n\n```bash\ndataos-ctl login\ndataos-ctl health\ndataos-ctl tenant list\n```\n\nWrite down the `hub-tcp-fqdn` value from `health`. You need it in module b6.","**Look at your roles.** Run `dataos-ctl user get` and note the `roles:id:...` tags. To create Secrets and Depots in module b3, you need a Data Developer-type role.","**Create a working folder and virtual environment.**\n\n```bash\nmkdir dataos-lab && cd dataos-lab\npython --version\npython -m venv .venv && source .venv/bin/activate\npip install --upgrade pip\n```","**Install Vulcan with the Postgres extra.** Copy the wheel that you downloaded into the folder. Then run these commands:\n\n```bash\npip install \"./vulcan-0.228.1.30-py3-none-any.whl[postgres]\"\nvulcan --version\n```\n\nReplace the file name with the name of the wheel that you downloaded.","**Start a local Postgres.** Save the compose file below as `docker/docker-compose.warehouse.yml`:\n\n```yaml\nvolumes:\n  warehouse:\n    driver: local\nnetworks:\n  vulcan:\n    external: true\nservices:\n  warehouse:\n    image: postgres:17-alpine\n    environment:\n      POSTGRES_DB: warehouse\n      POSTGRES_USER: vulcan\n      POSTGRES_PASSWORD: vulcan\n      POSTGRES_HOST_AUTH_METHOD: trust\n    ports:\n      - \"5433:5432\"\n    volumes:\n      - warehouse:/var/lib/postgresql/data\n    networks:\n      - vulcan\n```\n\nThen run:\n\n```bash\ndocker network create vulcan\ndocker compose -f docker/docker-compose.warehouse.yml up -d\n```","**(Optional, if you already have a Git repo and Compute.)** Write a draft of the `deployment:` block in a scratch `config.yaml`. Practice the lint-only pipe `vulcan create_deploy_yaml -o - | dataos-ctl resource apply --in -l`. Do not apply it for real yet."],"verify":"- `dataos-ctl health` prints `DataOS® CLI...OK` and `DataOS® CK...OK` with your `tenant-id`.\n- `dataos-ctl tenant list` shows your context marked with `*`.\n- `vulcan --version` prints a version from inside the activated `.venv`.\n- Docker shows that the `warehouse` container is running and that port `5433` is mapped.\n\nAt the start of module b2, you run `vulcan init` and `vulcan info` against this engine.","sources":["https://v2.dataos.info/build/get-started/prerequisites/cli-setup","https://v2.dataos.info/build/get-started/prerequisites/ldk-setup","https://v2.dataos.info/build/get-started/prerequisites/repository-setup"]},"takeaways":["A build needs three things: the DataOS CLI, the LDK (Python, venv, Vulcan, engine), and a Git repository that DataOS can read.","Use `dataos-ctl --help` to make sure that the CLI install works. Until you run `init`, `version` asks you to run initialization.","A tenant context has a name, an FQDN (no https://), and a lowercase tenant ID. `tenant list` marks the active context with `*`.","Vulcan supports Python 3.10 to 3.13 only. Always install it in a virtual environment with the correct engine extra.","DataOS is deny-by-default. Before you deploy, your tenant admin must give you `Can Use` grants for Compute, Depots, and Secrets.","Lint before you apply: `vulcan create_deploy_yaml -o - | dataos-ctl resource apply --in -l`."],"quiz":[{"q":"You installed the CLI and did not run `init` yet. Which command reliably shows that the binary works?","options":["`dataos-ctl version`","`dataos-ctl health`","`dataos-ctl --help`","`dataos-ctl login`"],"answer":2,"explain":"`--help` is the one command that skips the initialization test. `version` and most other commands ask whether you want to run initialization. `health` and `login` need an initialized context.","source":"https://v2.dataos.info/build/get-started/prerequisites/cli-setup"},{"q":"During `dataos-ctl init`, a learner enters `https://dataossanbox.instance.dataos.cloud` as the domain. What happens?","options":["Login later fails with a duplicate `https://` lookup error, and they must re-run `init` with the domain only","The CLI strips the prefix automatically","The CLI connects over HTTP instead of HTTPS","The tenant identifier is rejected"],"answer":0,"explain":"You must enter the FQDN without `https://`. If you include it, you get an error like `Post \"https://https//...\": lookup https: no such host`. To correct it, run `dataos-ctl init` again.","source":"https://v2.dataos.info/references/interfaces/command-line-interface"},{"q":"Which Python versions does Vulcan support?","options":["3.9 to 3.12","3.11 and later","Any Python 3 version","3.10 to 3.13"],"answer":3,"explain":"Vulcan requires `>=3.10,<3.14`. Vulcan does not support Python 3.9 and earlier, or 3.14 and later.","source":"https://v2.dataos.info/build/get-started/prerequisites/ldk-setup"},{"q":"You keep `dev` and `prod` contexts. How do you make `prod` the context that `dataos-ctl resource apply` acts on?","options":["`dataos-ctl login --tenant prod`","`dataos-ctl tenant select --name prod`","`dataos-ctl init --context-name prod`","Pass `-w prod` to every command"],"answer":1,"explain":"`tenant select --name` switches the active context, and every later command acts on it. `init` creates a new context. It does not switch contexts.","source":"https://v2.dataos.info/references/interfaces/command-line-interface"},{"q":"What does `vulcan create_deploy_yaml -o - | dataos-ctl resource apply --in -l` do?","options":["Renders the Vulcan manifest from `config.yaml` and lints it without applying it","Deploys the Data Product to the active tenant","Creates the git-sync Secret","Runs the unit tests in `tests/`"],"answer":0,"explain":"`create_deploy_yaml -o -` writes the rendered manifest to stdout. `--in` makes `apply` read stdin, and `-l` lints the manifest and does not apply it. Without `-l`, the command deploys for real.","source":"https://v2.dataos.info/build/get-started/prerequisites/repository-setup"}]},{"id":"b2","title":"Your first Data Product locally","duration":"75 min","objectives":["Scaffold a Vulcan project and point `config.yaml` at a local Postgres engine","Load seeds as SEED models with columns, grains, and blocking assertions","Write a VIEW transform that joins seeds into an analytics-ready model","Define a semantic model and a metric on top of the transform","Run `vulcan plan` and `vulcan audit` and interpret the results"],"lessons":[{"title":"Anatomy of a Vulcan project","body":"The Quickstart builds a small but complete Data Product on your own machine. It has seeds, a transform, quality gates, a semantic model, and a metric. Nothing touches DataOS or a cloud warehouse until you decide to deploy. It is the fastest way to see the full build pattern before you meet the larger `orders-analytics` example in later levels.\n\n### The scenario\n\nA retail team sells in four regions and keeps four spreadsheets that do not agree. The team wants **one trusted answer** to \"daily revenue by region\". At the end of this module, you have that answer as a metric. You define it one time, and auto-generated APIs can serve it.\n\n### The build chain\n\nEvery Vulcan project follows the same chain in one direction:\n\n```\nInputs + Seeds  -->  Data model  -->  Semantic model  -->  Metrics\n```\n\n| Asset | What it is | In the Quickstart |\n| --- | --- | --- |\n| Inputs | Upstream tables that your models read, declared as external models | Not used (seeds replace sources) |\n| Seeds | Small static CSV files that Vulcan loads as tables | `raw_customers`, `raw_orders`, `raw_order_items` |\n| Data model | SQL or Python files. Each file produces a table or a view | `order_lines_enriched` (a view) |\n| Semantic model | Maps physical columns to dimensions and measures | `order_lines` |\n| Metric | A measure plus a time column, as a time series that you can query | `daily_revenue_by_region` |\n\nVulcan reads your SQL and calculates the run order. You declare what you want, and Vulcan does the orchestration.\n\n### Scaffolding\n\nFrom an activated virtual environment, run:\n\n```bash\nvulcan init\n```\n\nChoose `DEFAULT` for the project type and `postgres` for the engine. Vulcan creates `models/`, `seeds/`, `dq/`, `audits/`, `tests/`, `macros/`, `plugins/`, `policies/`, `config.yaml`, `usage.yml`, and `agreement.md`.\n\n### `config.yaml` for local work\n\nThe Quickstart configuration names the project, declares an owner, and defines one **gateway**. A gateway is a connection to the engine where models materialize, plus a separate connection for the internal state of Vulcan.\n\n```yaml\nname: workspace\ndescription: Local quickstart product tracking daily revenue by region.\n\nusers:\n  - username: vulcan\n    type: OWNER\n\ndefault_gateway: postgres\ngateways:\n  postgres:\n    connection:\n      type: postgres\n      host: localhost\n      port: 5433\n      database: warehouse\n      user: vulcan\n      password: vulcan\n    state_connection:\n      type: duckdb\n      database: ./.state/vulcan.db\nmodel_defaults:\n  dialect: postgres\n  start: 2025-01-01\n  cron: '@daily'\n```\n\nThree parts are important:\n\n- **`connection`** is the engine: the place where transforms run and outputs land. It matches the Docker Postgres from module b1 (`localhost:5433`, database `warehouse`).\n- **`state_connection`** keeps the plan and interval state of Vulcan in a local DuckDB file. Thus, you do not need a second database.\n- **`model_defaults`** sets the SQL `dialect`, the `start` date from which Vulcan backfills models, and a default `cron`. The seed dates in this module are in January 2025 so that they align with `start: 2025-01-01`.\n\n> **Note:** A plaintext password is acceptable only for a throwaway local container. For any shared engine, use an environment variable, as LDK setup shows: `password: \"{{ env_var(POSTGRES_PASSWORD) }}\"`.\n\n### A tenant, even locally\n\nVulcan always requires a tenant, even for local work with no deployment. For local work, export a placeholder before you run commands:\n\n```bash\nexport DATAOS_TENANT_ID=local\n```\n\nAs an alternative, set `tenant` directly in `config.yaml`. Nothing in this module needs real DataOS access or an API token.\n\n### Check the connection before you build\n\n```bash\nvulcan info\n```\n\nLook for the line `Data warehouse connection succeeded`. Do not continue until you see it. If the command fails, the usual causes are a stopped Docker container, a wrong `port`, or an inactive virtual environment. The container maps `5433` on your machine to `5432` inside it.\n\n### Connection vs. data connection\n\nKeep two ideas separate. The **engine** in `config.yaml` answers this question: *where do transformations run and where do outputs land?* A **data connection** (a Secret plus a Depot, in module b3) answers a different question: *where does the source data live and how do we authenticate to it?* One system can have both roles, but you configure each role separately.","sources":["https://v2.dataos.info/build/get-started/quickstart","https://v2.dataos.info/build/productize/assets","https://v2.dataos.info/build/understand/connect-sources"]},{"title":"Seeds, models, and assertions","body":"The project now has a structure, and Vulcan can connect to the engine. Next, you add the data and the first models. Every model is a `.sql` file under `models/`. The file starts with a `MODEL (...)` block that declares what the model is. For transforms, a `SELECT` follows the block.\n\n### Seed data\n\nPut three CSV files under `seeds/`. They are the source of truth for this product:\n\n| File | Holds | Key columns |\n| --- | --- | --- |\n| `raw_customers.csv` | Customer identity and region | `customer_id`, `name`, `email`, `region` |\n| `raw_orders.csv` | Order headers | `order_id`, `customer_id`, `order_date` |\n| `raw_order_items.csv` | Line-level detail | `order_id`, `item_id`, `product_id`, `quantity`, `unit_price` |\n\n### Seeds become SEED models\n\nA CSV file alone is not a model. A `SEED` model loads a CSV into the engine and declares its contract:\n\n```sql\nMODEL (\n  name workspace.raw_orders,\n  kind SEED (path '../seeds/raw_orders.csv'),\n  columns (order_id INTEGER, customer_id INTEGER, order_date DATE),\n  grains (order_id),\n  references customer_id,\n  assertions (\n    not_null(columns := (order_id, customer_id, order_date)),\n  ),\n);\n```\n\nRead it one property at a time:\n\n- **`name`**: `schema.model`. Other models refer to it as `workspace.raw_orders`.\n- **`kind SEED (path ...)`**: load this CSV. The path is relative to the model file.\n- **`columns`**: explicit types, so that the engine does not guess.\n- **`grains`**: the column or columns that identify a row uniquely. `raw_order_items` uses a composite grain, `(order_id, item_id)`.\n- **`references`**: a column that points to the grain of another model. This documents the relationship.\n- **`assertions`**: rules that must be true every time the model materializes.\n\n### Assertions block bad data\n\nAn assertion is the **blocking** layer of the contract of a Data Product. It runs at materialization. If it finds bad rows, Vulcan stops the run, and the bad data never gets to a consumer. The line-items seed shows two built-in assertion functions:\n\n```sql\n  assertions (\n    not_null(columns := (order_id, item_id, product_id, quantity, unit_price)),\n    forall(criteria := (quantity > 0)),\n    forall(criteria := (unit_price >= 0)),\n  ),\n```\n\n`not_null` rejects nulls in the listed columns. `forall` requires every row to satisfy a condition. A null key or a negative price stops the model from materializing.\n\nInternally, an assertion runs a query. If the query returns **zero rows**, the assertion passes. Each returned row is a failing row. Built-in functions need no SQL. You can also attach named audits that you write in `audits/*.sql`. The docs summarize the vocabulary as: *audits define a rule, assertions attach it to a model.* The `MODEL` block also accepts `audits(...)` as an alias for `assertions(...)`.\n\n### The transform\n\nThe transform joins the three seeds into one analytics-ready view, `models/order_lines_enriched.sql`:\n\n```sql\nMODEL (\n  name workspace.order_lines_enriched,\n  kind VIEW,\n  grains (order_id, item_id),\n  assertions (\n    not_null(columns := (order_id, item_id, customer_id, order_date, region, line_revenue)),\n    forall(criteria := (line_revenue >= 0)),\n  ),\n);\n\nSELECT\n  i.order_id, i.item_id, i.product_id, i.quantity, i.unit_price,\n  (i.quantity * i.unit_price)::DOUBLE PRECISION AS line_revenue,\n  o.customer_id, o.order_date,\n  c.name AS customer_name, c.email AS customer_email, c.region\nFROM workspace.raw_order_items AS i\nINNER JOIN workspace.raw_orders AS o ON i.order_id = o.order_id\nINNER JOIN workspace.raw_customers AS c ON o.customer_id = c.customer_id;\n```\n\n`kind VIEW` means that the engine stores a view, not a table. The model also has its own assertions, so a bad join is also caught here. An example is a customer with no region. Vulcan sees the references to `workspace.raw_*` in the SQL and runs the seeds first.\n\n### Four quality tools, four jobs\n\nThe Quickstart uses only assertions. This table shows where they fit among the quality tools of Vulcan:\n\n| Tool | Where it lives | What it does |\n| --- | --- | --- |\n| Unit test | `tests/*.yaml` | Tests the SQL logic of a model against hand-written fixtures, with no warehouse. Run with `vulcan test`. |\n| Audit | `audits/*.sql` | Defines a reusable validation rule |\n| Assertion | `assertions(...)` in `MODEL` | Attaches a rule to a model and **blocks** the run on failure |\n| DQ check | `dq/*.yml` (`kind: dq`) | Scores data over time and **warns without blocking** |\n\n> **Note:** As of the September 2026 release, DQ checks use a new `expectations:` format. Legacy `rules:` definitions still work, so you can migrate existing projects gradually. Use `expectations:` for new checks.\n\nIf a failure must stop the run (null keys, negative prices), use an assertion. If a failure must only give a warning (row-count trends), use a DQ check.","sources":["https://v2.dataos.info/build/get-started/quickstart","https://v2.dataos.info/build/productize/assertions","https://v2.dataos.info/build/productize/data-quality","https://v2.dataos.info/build/productize/unit-test","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Semantic model, metric, and the plan-audit loop","body":"Engineers query tables and views. Business users, dashboards, and AI agents need something different: names that they know and numbers with one definition. The **semantic model** and the **metric** give them that.\n\n### The semantic model\n\nA semantic model maps physical columns to business concepts. **Dimensions** are what you group and filter by. **Measures** are what you aggregate. The semantic model also powers the REST, GraphQL, and MySQL wire-protocol APIs of the Data Product automatically. You write no API code.\n\nCreate `models/semantics/order_lines.yml`:\n\n```yaml\nkind: semantic\nname: order_lines\ndepends_on: workspace.order_lines_enriched\ndescription: Order lines enriched with customer region and line revenue.\ndimensions:\n  - order_date\n  - region\nmeasures:\n  - name: total_line_revenue\n    type: sum\n    expression: \"{order_lines.line_revenue}\"\n    description: Sum of line-level revenue.\n```\n\n- **`kind: semantic`** marks the file as a semantic model.\n- **`depends_on`** names the physical model that it wraps.\n- **`dimensions`** exposes `order_date` and `region` for slicing.\n- **`measures`** defines `total_line_revenue`, a `sum` over the `line_revenue` column of the view. The expression refers to the column through the name of the semantic model: `{order_lines.line_revenue}`.\n\nMeasure types matter downstream. Later, a consumer can query this model over SQL (module b6). The consumer can then wrap a `sum` measure in `MEASURE()` or `SUM()`. An aggregate that does not match the measure type causes an error.\n\n### The metric\n\nA metric takes a measure and a time column and makes them into one time series that you can query. It references the semantic model, never raw columns. Create `models/metrics/daily_revenue_by_region.yml`:\n\n```yaml\nkind: metric\nname: daily_revenue_by_region\nmeasure: order_lines.total_line_revenue\nts: order_lines.order_date\ngranularity: day\ndimensions:\n  - order_lines.region\ndescription: Daily gross revenue from order lines, broken out by customer region.\n```\n\n| Key | Meaning |\n| --- | --- |\n| `measure` | Which semantic measure to compute |\n| `ts` | The time dimension the series runs along |\n| `granularity` | The time grain (`day` here) |\n| `dimensions` | What the series can be broken out by |\n\nOne metric has one definition. Every dashboard, report, and AI agent now reads the same number. The team with four spreadsheets did not have this. Semantic models can also carry `ai_context`, which makes a metric safe for an agent to query. You learn about that at later levels.\n\n### Plan, apply, audit\n\nVulcan works in two steps. First, it calculates a **plan** of what will change. Then it applies the plan.\n\n```bash\nvulcan plan\n```\n\nVulcan makes sure that every model is valid and shows what it will materialize. Review the plan. It must show the three seed models, the view, the semantic model, and the metric. At the prompt `Apply the plan? [y/n]`, type `y`. The apply step materializes the models into Postgres and runs their assertions. Each time you apply a plan, Vulcan also runs any unit tests in `tests/`.\n\nThen run the quality checks on their own:\n\n```bash\nvulc
