variables. Never hard-code them.\n\n### Verify any connection\n\nAsk: `What data products am I authorized to access?` A working connection returns the products that your identity can access. Then try follow-up questions such as `Is the orders-analytics data product fresh and healthy?` or `What was daily revenue by region last week?`.","sources":["https://v2.dataos.info/consume/consume-with-ai/overview","https://v2.dataos.info/consume/consume-with-ai/connect-a-client","https://v2.dataos.info/consume/consume-with-ai/connect-a-client/claude","https://v2.dataos.info/consume/consume-with-ai/connect-a-client/cursor","https://v2.dataos.info/consume/consume-with-ai/connect-a-client/copilot-vs-code","https://v2.dataos.info/consume/consume-with-ai/connect-a-client/custom","https://v2.dataos.info/consume/consume-with-ai/connect-an-agentic-framework","https://v2.dataos.info/releasenotes/august-2026"]}],"lab":{"title":"Consume orders-analytics from code, an app link and an AI assistant","goal":"Query the deployed `orders-analytics` product through the Python SDK, Semantic GraphQL, paginated Semantic REST and transpile-only SQL. Register a link to a hosted app. Connect an MCP client that answers a question from the product under your own permissions.","duration":"2 hours","prereqs":["The lab for module i6 is complete: `orders-analytics` is deployed and its API is `running`","A DataOS API token exported as `DATAOS_TOKEN`","Python 3.9+ with the Vulcan SDK wheel that your platform distributes","Claude Code, Cursor, VS Code with Copilot, or another MCP client"],"steps":["**Set the URLs.**\n\n```bash\nexport PRODUCT_BASE_URL=\"https://<DATAOS_FQDN>/vulcan/tenants/<TENANT_ID>/data-products/<TENANT_ID>-orders-analytics\"\nexport API_BASE_URL=\"$PRODUCT_BASE_URL/api/v1\"\nexport DATAOS_TOKEN=\"<dataos-access-token>\"\ncurl \"$PRODUCT_BASE_URL/livez\"\n```","**(Optional) Explore in Postman.** On the product page, select **Activate → APIs → Postman collection → Download**. Import the collection. Set `baseUrl` and the Bearer `token`. Run **Health → Liveness probe**. Then browse the Semantic SQL folder.","**Query with the Python SDK.** Install the SDK wheel (for example `pip install vulcan_sdk-0.228.1.28-py3-none-any.whl`). Then run this script:\n\n```python\nimport os, time\nfrom vulcan_sdk import VulcanClient\n\nclient = VulcanClient(\n    fqdn=\"<DATAOS_FQDN>\",\n    dp_name=\"orders-analytics\",\n    access_token=os.environ[\"DATAOS_TOKEN\"],\n    tenant=\"<TENANT_ID>\",\n)\n\nschema = client.metadata.get_semantic()\nfor model in schema.models:\n    print(model[\"name\"], [c[\"name\"] for c in model.get(\"columns\", [])])\n\nstmt = client.query.submit_semantic_sql(\n    \"SELECT daily_sales.region_name, MEASURE(daily_sales.total_daily_revenue) \"\n    \"FROM daily_sales GROUP BY 1\"\n)\nwhile stmt.status.upper() not in {\"SUCCESS\", \"SUCCEEDED\", \"FAILED\", \"CANCELLED\"}:\n    time.sleep(2)\n    stmt = client.query.get_statement(stmt.id)\n\nresult = client.query.get_statement_result(stmt.id)\nprint(result.cols)\nfor row in result.rows:\n    print(row)\n```","**Query with Semantic GraphQL** (one response, no polling):\n\n```bash\ncurl --location \"$API_BASE_URL/query/semantic/graphql\" \\\n  --header 'Content-Type: application/json' \\\n  --header \"Authorization: Bearer ${DATAOS_TOKEN}\" \\\n  --data '{\n    \"query\": \"query CustomerProfile($limit: Int!) {\\n  table(limit: $limit) {\\n    customer_profile {\\n      customer_count\\n      region_name\\n    }\\n  }\\n}\",\n    \"variables\": { \"limit\": 10 }\n  }'\n```\n\nMake sure that the response has no `errors` array and that `extensions.status` is `SUCCESS`.","**Page through Semantic REST.** Submit the first batch, poll, and fetch. Then send the request again with `\"offset\": 1000`:\n\n```bash\ncurl --request POST \"$API_BASE_URL/query/semantic/rest\" \\\n  --header 'Content-Type: application/json' \\\n  --header \"Authorization: Bearer ${DATAOS_TOKEN}\" \\\n  --data '{\n    \"query\": {\n      \"measures\": [\"daily_sales.total_daily_revenue\"],\n      \"dimensions\": [\"daily_sales.customer_id\"],\n      \"order\": { \"daily_sales.customer_id\": \"asc\" },\n      \"limit\": 1000,\n      \"offset\": 0,\n      \"timezone\": \"UTC\"\n    }\n  }'\n\ncurl --request GET \"$API_BASE_URL/query/statement/<statement-id>\" \\\n  --header \"Authorization: Bearer ${DATAOS_TOKEN}\"\n\ncurl --request GET \"$API_BASE_URL/query/statement/<statement-id>/result?format=json\" \\\n  --header \"Authorization: Bearer ${DATAOS_TOKEN}\"\n```\n\n(The recipe uses 50,000. A small `limit` lets you practice paging on demo-sized data.)","**Transpile without executing.**\n\n```bash\ncurl --location \"$API_BASE_URL/query/semantic/sql?transpile_only=true\" \\\n  --header 'Content-Type: application/json' \\\n  --header \"Authorization: Bearer ${DATAOS_TOKEN}\" \\\n  --data '{\n    \"sql\": \"SELECT customer_profile.region_name, MEASURE(customer_profile.customer_count) FROM customer_profile GROUP BY customer_profile.region_name LIMIT 10\"\n  }'\n```\n\nThe response is PostgreSQL SQL against `silver.dim_customer_profile`, with no statement id. Your token can belong to a user in the masked group. In that case, find the policy filter in the generated SQL.","**Register a hosted app with a `link` resource.** Make sure that `roles:id:data-developer` appears in the output of `dataos-ctl user get`. Then save `app-link.yaml`. Use any reachable app URL that you own, such as a notebook or dashboard:\n\n```yaml\nversion: v1alpha\ntype: link\nname: orders-analytics-dashboard-link\ntitle: Orders Analytics Dashboard\ndescription: Hosted dashboard built on the orders-analytics Data Product.\nowner: <dataos-username>\ntags:\n  - app\n  - hosted-app\nspec:\n  link:\n    domain: sales_operations\n    description: Revenue and customer segment dashboard on orders-analytics.\n    owners:\n      - <dataos-username>\n    products:\n      - orders-analytics\n    title: Open dashboard\n    url: <hosted-app-url>\n    visibility:\n      scope: tenants\n      tenants:\n        - <TENANT_ID>\n```\n\n```bash\ndataos-ctl resource apply -f app-link.yaml\n```","**Connect an MCP client.** For Claude Code with an API token, run:\n\n```bash\nclaude mcp add --scope user --transport http DataProduct-MCP \\\n  https://<instance-url>/dataproduct-mcp/api/v1 --header \"apikey: <API_TOKEN>\"\n```\n\nRestart Claude Code. Make sure that **DataProduct-MCP** appears in the MCP tools list. For Cursor or Copilot, use the JSON configurations from the lesson. Keep tokens out of committed files.","**Ask governed questions.** In the client, ask:\n\n```\nWhat data products am I authorized to access?\n```\n\nThen ask `Is the orders-analytics data product fresh and healthy?` and `What was total daily revenue by region for the last 7 days in orders-analytics?`. Make sure that the answer names the metric or measure and the source product. Make sure that it includes a trust summary."],"verify":"- The Python script prints `result.cols` and one row per region.\n- The GraphQL response has `extensions.status: SUCCESS` and no `errors` array.\n- Paging with the same `order` and increasing `offset` returns non-overlapping batches. The last batch has fewer rows than `limit`.\n- The transpile-only call returns SQL and no statement id.\n- `dataos-ctl resource apply -f app-link.yaml` succeeds, and the link's catalog entry lists `orders-analytics` under Products.\n- The MCP client lists `orders-analytics` among authorized products and answers the revenue question citing the measure and product.","sources":["https://v2.dataos.info/consume/activate/apis","https://v2.dataos.info/references/interfaces/apis/data-product-apis/sdks/python-sdk","https://v2.dataos.info/consume/recipes/query-semantic-model-with-graphql","https://v2.dataos.info/consume/recipes/retrieve-large-result-sets-with-pagination","https://v2.dataos.info/consume/recipes/transpile-semantic-queries-to-native-warehouse-sql","https://v2.dataos.info/consume/activate/apis/data-application/link","https://v2.dataos.info/consume/consume-with-ai/connect-a-client/claude"]},"takeaways":["All APIs share the product base URL and a Bearer token. Health probes are at the root, and data APIs are under `/api/v1`.","Semantic SQL and REST are async: submit, poll, fetch. GraphQL returns data and metadata in one response.","Page with a fixed `order` and an increasing `offset`. Parquet returns everything and ignores paging.","`transpile_only=true` returns native SQL without executing or creating a statement.","`app` runs a container, and `link` registers a hosted URL. Both link to the product through `products`. Use path links.","MCP uses OAuth at `/mcp/api/v1` or a token at `/dataproduct-mcp/api/v1`, and enforces the caller's own policies."],"quiz":[{"q":"A web app needs three measures for a small dashboard tile, already uses GraphQL, and must render without a polling loop. Which interface fits?","options":["Semantic REST with `limit` and `offset`","Semantic GraphQL, which returns data and execution metadata in one response","Raw SQL via `submit_statement`","Semantic SQL with `transpile_only=true`"],"answer":1,"explain":"GraphQL returns the result and the `extensions` metadata in one response. With the status SUCCESS, no polling is necessary. Transpile-only returns SQL, not data.","source":"https://v2.dataos.info/consume/recipes/query-semantic-model-with-graphql"},{"q":"A job pages a 300,000-row Semantic REST result in 50,000-row JSON batches and finds duplicate and missing records across batches. What is the fix?","options":["Switch to `format=parquet` while keeping `offset`","Raise `limit` to 300000","Use the same deterministic `order` on every request and change only `offset`","Add `transpile_only=true`"],"answer":2,"explain":"Duplicates or gaps come from inconsistent ordering. Keep `order` identical and vary only `offset`. Parquet ignores `limit` and `offset` and returns the full result.","source":"https://v2.dataos.info/consume/recipes/retrieve-large-result-sets-with-pagination"},{"q":"An `app` manifest sets `spec.app.link.url: https://dev.example.dataos.app/orders-dashboard`, and the team plans to promote it to prod. What must change?","options":["Use a path such as `/orders-dashboard`. Full URLs still work, but their support will end, and paths work across environments","Nothing; full URLs are required","Move the URL into `spec.service.envs`","Use `spec.link.url` instead"],"answer":0,"explain":"Since September 2026, App links can be paths, so one manifest works across environments. Support for full URLs will be removed in a future release.","source":"https://v2.dataos.info/consume/activate/apis/data-application/deploy"},{"q":"A Team-plan Claude admin adds Data Product MCP as a custom connector. A member then asks about a product the admin can see but the member cannot. What happens?","options":["The member sees it, because the admin's access is shared through the connector","The member sees the product with all columns masked","The connector fails for everyone until the member gets admin rights","The product does not appear; each member signs in with their own DataOS account and gets only their authorized products"],"answer":3,"explain":"Each member signs in with their own DataOS account, so Claude returns only the products that the member can access. The admin who added the connector does not share their access.","source":"https://v2.dataos.info/consume/consume-with-ai/connect-a-client/claude"},{"q":"A developer adds an API token to `.vscode/mcp.json` for Copilot. What is the main risk, and the documented mitigation?","options":["Copilot ignores headers; switch to OAuth","The file is at the project root and easy to commit. Use a user-level configuration or an environment variable, or add it to `.gitignore` at once","Tokens in VS Code expire hourly; rotate them","The endpoint must be `/mcp/api/v1` when using a token"],"answer":1,"explain":"The docs say that `.vscode/mcp.json` is easy to commit by accident. The API-token endpoint is `/dataproduct-mcp/api/v1`. `/mcp/api/v1` is the OAuth endpoint.","source":"https://v2.dataos.info/consume/consume-with-ai/connect-a-client/copilot-vs-code"}]}],"exam":{"passMark":70,"timeMinutes":60,"questions":[{"domain":"Data movement with Nilus","q":"A marketing team needs HubSpot data refreshed once a day for reporting. Which Nilus configuration is the best starting point?","options":["`spec.type: cdc` with a replication slot","`spec.type: batch` with a daily `schedule.crons` entry","`spec.type: stream` reading HubSpot as a topic","`spec.type: metadata` with lineage"],"answer":1,"explain":"SaaS sources with daily freshness fit batch on a schedule. CDC needs a transactional database log, and streaming needs Kafka or NATS.","source":"https://v2.dataos.info/build/move/mode/batch"},{"domain":"Data movement with Nilus","q":"A pipeline was applied with `source_table: public.orders`. You change it to `source_table: \"query:SELECT ..., extra_col FROM public.orders\"` with the same `dest_table` and apply it again, but nothing changes. What must you do?","options":["Use a new `dest_table` (or drop and reload), and delete/recreate or rename the resource so the changed spec runs","Switch `incremental_strategy` to `append`","Wait for schema evolution to add `extra_col` on the next run","Raise `max_table_nesting`"],"answer":0,"explain":"Schema evolution does not add columns that a `query:` SELECT creates. Also, a second apply of an unchanged nilus resource does not run it again. Use a new dest_table and recreate or rename the resource.","source":"https://v2.dataos.info/references/resources/nilus/concepts/schema-evolution"},{"domain":"Data movement with Nilus","q":"Two PostgreSQL CDC pipelines on the same server were configured with the same `slot.name`. What problem will occur?","options":["Duplicate destination schemas only","No problem. Slots are shared by design","Both pipelines silently switch to batch mode","Replication conflicts. Each PostgreSQL CDC pipeline needs a unique `slot.name`"],"answer":3,"explain":"For PostgreSQL, each pipeline must use a unique `slot.name`. If two pipelines use the same slot, replication conflicts occur.","source":"https://v2.dataos.info/build/move/mode/cdc"},{"domain":"Data movement with Nilus","q":"A pipeline must load `public.users` into a shared analytics environment, but email addresses must never land in clear text. What is the Nilus-native approach?","options":["Set `incremental_strategy: replace`","Write a Vulcan model that hashes email after loading","Add a `mask` map (for example `email: hash`) under `sink.options`","Use `sql_exclude_columns` on the sink"],"answer":2,"explain":"Nilus masks values in flight with a `mask` map. The preferred place for the map is under `sink.options`. Masking is a handling policy, not a transform. If you mask after the data lands, the clear text lands first.","source":"https://v2.dataos.info/references/resources/nilus/concepts/understanding-data-masking"},{"domain":"Data movement with Nilus","q":"A Nilus pipeline fails at apply with `invalid resource dependency, not found: depot:salesdb`. What is the first step?","options":["Increase `page_size`","Create the missing Depot (or fix its name and workspace) before applying the pipeline","Add `primary_key` to the source options","Grant `SELECT` on the source schema"],"answer":1,"explain":"At apply time, the runtime makes sure that all dependencies exist. This error means that the referenced Depot does not exist in the tenant.","source":"https://v2.dataos.info/references/resources/nilus/troubleshooting/common-errors"},{"domain":"Vulcan project foundations","q":"A developer exports `DATAOS_TENANT_ID` locally and removes `tenant` from `config.yaml`. Is this valid?","options":["Yes, the tenant can come from `DATAOS_TENANT_ID` locally or be injected by the platform in production","Only if `vde: true`","Only for Trino gateways","No, `tenant` must always be in config.yaml"],"answer":0,"explain":"Vulcan needs a tenant. The tenant comes from config.yaml, from `DATAOS_TENANT_ID`, or from the platform in production. If no tenant is set, Vulcan does not load.","source":"https://v2.dataos.info/build/productize/init-and-configuration"},{"domain":"Vulcan project foundations","q":"A team wants consumers to know the product is not suitable for real-time shipment alerting before they query it. Where does this information go?","options":["`agreement.md`, which Vulcan parses into fields","The `license` field in config.yaml","A `caveats` comment in a SQL model","`not_for` in `usage.yaml`"],"answer":3,"explain":"`usage.yaml` declares `good_for`, `not_for`, `caveats` and `references`, and the Data Product Hub shows them. `agreement.md` is terms text that Vulcan does not parse.","source":"https://v2.dataos.info/build/productize/init-and-configuration"},{"domain":"Vulcan project foundations","q":"Your PostgreSQL-backed project runs `CREATE EXTENSION` in a model's `pre_statements`, and it executes every time you run `vulcan plan`. How do you make it run only on real execution?","options":["Add it to `ignore_patterns`","Move it into `inputs.yaml`","Wrap it in `@IF(@runtime_stage = 'evaluating', ...)`","Set `--ignore-warnings`"],"answer":2,"explain":"You must guard lifecycle DDL with `@IF(@runtime_stage = 'evaluating', ...)`. If you do not, `vulcan plan` executes it. `--ignore-warnings` only hides parser warnings.","source":"https://v2.dataos.info/build/productize/connect-engine/postgres"},{"domain":"Vulcan project foundations","q":"Which statement about `vulcan info` is correct?","options":["It applies pending model changes to dev","It validates config.yaml, tests warehouse and state backend connections, and reports model and macro counts","It renders the deploy manifest","It runs all unit tests"],"answer":1,"explain":"`vulcan info` prints project counts and tests the warehouse and state backend connections. It changes nothing.","source":"https://v2.dataos.info/references/resources/vulcan/cli"},{"domain":"Vulcan project foundations","q":"An external input is reached through a Trino catalog that actually points at Redshift, and you want lineage to show that. What do you add to its `inputs.yaml` entry?","options":["`remote_engine: redshift`","`kind: EXTERNAL_REDSHIFT`","`grains: [redshift]`","`dialect: redshift`"],"answer":0,"explain":"`remote_engine` is free-text metadata that records where the data really lives. `dialect` tells Vulcan how to parse SQL references in a different dialect.","source":"https://v2.dataos.info/build/productize/assets/inputs"},{"domain":"Modeling: data, semantic and metric models","q":"A model must hold the latest version of each customer. It must update existing rows and insert new ones without a rebuild of the whole table. Which kind fits?","options":["`SEED`","`VIEW`","`EMBEDDED`","`INCREMENTAL_BY_UNIQUE_KEY (unique_key customer_id)`"],"answer":3,"explain":"INCREMENTAL_BY_UNIQUE_KEY upserts on the key. Rows with new keys are inserted, and rows with existing keys are updated. EMBEDDED creates no table at all.","source":"https://v2.dataos.info/references/resources/vulcan/models/data-models/model-kinds"},{"domain":"Modeling: data, semantic and metric models","q":"In an INCREMENTAL_BY_TIME_RANGE model, the `WHERE` clause filters on `shipped_date`, but `time_column` is `order_date`. What does Vulcan do?","options":["Converts the model to FULL","Rejects the model because the filter must use the time column","Adds its own filter on `order_date` to the output so no rows outside the interval are stored","Ignores the WHERE clause"],"answer":2,"explain":"Your WHERE clause filters the input. Vulcan also adds a filter on the time column of the model to the output. This filter prevents data leakage outside the interval.","source":"https://v2.dataos.info/references/resources/vulcan/models/data-models/model-kinds"},{"domain":"Modeling: data, semantic and metric models","q":"A semantic model declares a measure named `total_revenue` with expression `{daily_sales.total_revenue}`, and validation fails. Why?","options":["Measures cannot use `sum`","Measure names must not collide with column names","Expressions cannot use braces","`total_revenue` must be declared as a segment first"],"answer":1,"explain":"`vulcan plan` makes sure that measure names do not collide with column names. Use a different name, such as `total_daily_revenue`.","source":"https://v2.dataos.info/build/productize/assets/semantic-model"},{"domain":"Modeling: data, semantic and metric models","q":"A segment on `daily_sales` is written as `{customer_profile.customer_segment} = 'Churned'`. What happens?","options":["It fails: segments can only reference the current model's own columns","It is converted into a measure filter","It becomes a metric automatically","It works because `daily_sales` joins to `customer_profile`"],"answer":0,"explain":"Segment expressions must reference only the columns of the model that declares them. Instead, use a measure `filters` entry or a segment on `customer_profile`.","source":"https://v2.dataos.info/build/productize/assets/semantic-model"},{"domain":"Modeling: data, semantic and metric models","q":"Two semantic models, `orders` and `customers`, join to each other in both directions. Validation complains about the reciprocal join. What is required?","options":["`many_to_many` on both sides","`description` on both joins","`public: false` on both joins","`skip_for_bi` on exactly one side, with join types that are proper inverses"],"answer":3,"explain":"Reciprocal joins require `skip_for_bi` on exactly one side, and the join types must be inverses. Joins do not accept description or public keys.","source":"https://v2.dataos.info/build/productize/assets/semantic-model"},{"domain":"Modeling: data, semantic and metric models","q":"A metric defined with `slices:` instead of `dimensions:` fails validation. Why?","options":["Slices only work with `granularity: day`","Slices must be declared in usage.yaml","`slices` is a legacy key that is rejected. Use `dimensions`","Slices require `join_path: connected`"],"answer":2,"explain":"Vulcan rejects two old metric keys. Use `ts` instead of `time`, and use `dimensions` instead of `slices`.","source":"https://v2.dataos.info/build/productize/assets/metrics"},{"domain":"Modeling: data, semantic and metric models","q":"You want daily, weekly and monthly views of the same revenue measure. What is the recommended design?","options":["Three metrics with different `granularity`","One metric with a default `granularity`; consumers override it at query time","Three semantic models over the same table","A rollup per granularity, with no metric"],"answer":1,"explain":"`granularity` is only the default bucket. Consumers can override it at query time, so you do not need separate daily, weekly and monthly metrics.","source":"https://v2.dataos.info/build/productize/assets/metrics"},{"domain":"Quality gates","q":"A model uses `CURRENT_DATE` to compute `days_since_last_order`, and its unit test passes today but fails tomorrow. What must the test set?","options":["`vars.execution_time` to freeze time","`--preserve-fixtures`","`format: csv`","`partial: true`"],"answer":0,"explain":"When you set `vars.execution_time`, models that use CURRENT_TIMESTAMP/CURRENT_DATE give the same result on every run.","source":"https://v2.dataos.info/build/productize/unit-test"},{"domain":"Quality gates","q":"A test file named `fct_daily_sales_checks.yaml` in `tests/` is never run by `vulcan test`. Why?","options":["Tests only run during `vulcan run`","Only one test per project is allowed","Tests must be SQL files","Test filenames must start with `test`"],"answer":3,"explain":"Test files must start with `test` and end in .yaml or .yml. One file can hold more than one test.","source":"https://v2.dataos.info/build/productize/unit-test"},{"domain":"Quality gates","q":"Your team wants an `assert_positive_order_ids` audit applied to every model in the project without editing each MODEL block. How do you do this?","options":["Put it in `inputs.yaml`","Attach it to the semantic model","List it under `model_defaults` (`assertions` or `audits`) in config.yaml","Add it to every DQ pack"],"answer":2,"explain":"You attach global assertions through `model_defaults` in config.yaml. You can use `assertions` or `audits` as the key.","source":"https://v2.dataos.info/references/resources/vulcan/quality/assertions"},{"domain":"Quality gates","q":"A custom audit on an INCREMENTAL_BY_TIME_RANGE model selects from `@this_model`. Which rows does it check during a run?","options":["The entire table history","Only the interval that just ran, because Vulcan adds an automatic time-range filter","Only rows in the upstream input","No rows; audits skip incremental models"],"answer":1,"explain":"For incremental models, Vulcan adds a time-range filter. The audit then tests only the interval that just ran.","source":"https://v2.dataos.info/build/productize/assertions"},{"domain":"Quality gates","q":"In a bronze → silver → gold pipeline, where does the Write-Audit-Publish guidance recommend that you put the heavy blocking checks?","options":["On the layer that first turns raw data into something trustworthy, typically silver","Only in DQ packs on bronze","On semantic models","On gold, closest to the dashboard"],"answer":0,"explain":"WAP works best with the heavy checks on the layer where data first becomes trustworthy (silver). Downstream models inherit that trust.","source":"https://v2.dataos.info/references/resources/vulcan/concepts/write-audit-publish"},{"domain":"Quality gates","q":"A DQ pack contains both a `rules:` list and an `expectations:` list. What is wrong?","options":["`expectations:` must be in a MODEL block","`rules:` requires `profiles:`","Nothing. Vulcan merges them","A pack contains one of the two lists, not both. Migrate everything to `expectations:`"],"answer":3,"explain":"A pack holds either `rules:` or `expectations:`. `rules:` still loads, but it will be deprecated in December 2026, so use `expectations:`.","source":"https://v2.dataos.info/build/productize/data-quality"},{"domain":"Governance and access","q":"A team writes two policy files that both have `depends_on: [silver.dim_customer_profile]`, one for analysts and one for executives. What must they do instead?","options":["Put both groups in `column_classifications`","Keep both; Vulcan merges them","Combine them into one policy file with a rule per group. Only one policy can target a physical model","Attach one to the semantic model instead"],"answer":2,"explain":"Only one policy file can target a physical model, and `depends_on` allows exactly one entry. Use multiple rules in one file.","source":"https://v2.dataos.info/references/resources/vulcan/policies"},{"domain":"Governance and access","q":"A filter value is `\"{securityContext.region}\"`, but the plugin never returns a `region` claim. What does a caller experience?","options":["The filter is ignored","The request returns `403` because the referenced key is missing","The region column is masked","All rows are returned"],"answer":1,"explain":"If a filter value references a `securityContext` key that is missing, the request returns 403 at query time.","source":"https://v2.dataos.info/references/resources/vulcan/policies"},{"domain":"Governance and access","q":"Which mask can be used on a column that backs a rollup's `group by` dimension when `enable_rollup: true`?","options":["`CAST(NULL AS TIMESTAMP)`","`SUBSTRING(industry FROM 3)`","`SPLIT_PART(email, '.', 2)`","`CONCAT(LEFT(email, 2), '***')`"],"answer":0,"explain":"Rollup group-by dimensions only accept constant masks such as `CAST(NULL AS TIMESTAMP)` or a string literal. Masks that reference the column value are rejected.","source":"https://v2.dataos.info/build/productize/governance"},{"domain":"Governance and access","q":"Where must `after_authorize` be configured, and what form does its value take?","options":["In usage.yaml, as a URL","In the deploy manifest, as a container image","In each policy file, as a Python function body","At the root of config.yaml, as `module:function`, for example `plugins.auth_ext:resolve_user_groups`"],"answer":3,"explain":"`after_authorize` is a field at the root of config.yaml. It holds a Python import path in `module:function` form.","source":"https://v2.dataos.info/references/resources/vulcan/plugins-and-auth"},{"domain":"Governance and access","q":"A Vulcan service account can query the Depot, but `vulcan plan` fails to create schemas on PostgreSQL. A colleague says that the Depot grant is enough. What is correct?","options":["Set `vde: true`","The Depot grant covers engine DDL","Engine privileges such as `CREATE` on the database are provisioned separately on PostgreSQL. A Depot grant alone does not allow creating or writing tables","Add `Can Use` on the Vulcan resource"],"answer":2,"explain":"The minimum grants of the engine are separate. A Depot grant does not give Vulcan permission to create or write tables on the engine.","source":"https://v2.dataos.info/build/productize/git-and-deploy"},{"domain":"Governance and access","q":"Who controls whose identity a deployed resource executes under, and does it affect who can delete it?","options":["Only Tenant Admins can delete resources with `runAsUser` set","`runAsUser` sets the runtime identity only. Deletion follows ownership, not `runAsUser`","`runAsUser` transfers ownership to that user","The submitter always becomes the runtime identity"],"answer":1,"explain":"DataOS tracks owner, submitter and runAsUser separately. runAsUser controls only the runtime identity, and deletion depends on ownership.","source":"https://v2.dataos.info/operate/access-control/roles-and-permissions/runasuser-permissions"},{"domain":"Plan, deploy and operate","q":"You need to reprocess `silver.fct_daily_sales` and everything downstream after fixing a source data issue, without changing code. Which command fits?","options":["`vulcan plan --restate-model silver.fct_daily_sales`","`vulcan migrate`","`vulcan create_test silver.fct_daily_sales`","`vulcan run --skip-janitor`"],"answer":0,"explain":"`-r/--restate-model` restates data for the specified model and models downstream of it.","source":"https://v2.dataos.info/references/resources/vulcan/cli"},{"domain":"Plan, deploy and operate","q":"A project sets `vde: true` with a `trino` gateway. What happens?","options":["Trino gains a virtual layer","Only VIEW models are versioned","It is silently treated as false","It is rejected. `vde: true` is not supported on spark or trino gateways"],"answer":3,"explain":"`vde: true` is rejected outright on spark and trino gateways.","source":"https://v2.dataos.info/build/productize/init-and-configuration"},{"domain":"Plan, deploy and operate","q":"Which `deployment:` fields are required?","options":["`repo.secret_id` and `sync_flags`","`api.replicas` and `workflow.log_level`","`repo.url`, `repo.base_dir`, `compute` and `run_as_user`","`name`, `engine`, `crons` and `depots`"],"answer":2,"explain":"Only repo.url, repo.base_dir, compute and run_as_user are required. name, engine and crons are derived. secret_id is only for private repos.","source":"https://v2.dataos.info/references/resources/vulcan/deployment"},{"domain":"Plan, deploy and operate","q":"After deployment, `dataos-ctl resource get runtime -t vulcan -n orders-analytics -r` shows the API container groups `running` and `orders-analytics-plan-execute` `completed`. What does this mean?","options":["The plan failed because it is not running","This is the healthy state: API serving, plan workflow finished","The run component is missing and must be redeployed","The product is paused"],"answer":1,"explain":"For a healthy product, API groups are usually `running`. Plan and run workflow groups are `completed` after they finish.","source":"https://v2.dataos.info/build/productize/monitor-and-delete"},{"domain":"Plan, deploy and operate","q":"You must delete a Vulcan product, but `dataos-ctl resource deps` shows another resource depends on it. Which statement is correct?","options":["`--cascade` also deletes every dependent resource. `--force` deletes past the dependency check. Both are irreversible, so coordinate first","Dependencies are removed automatically with no flags","Deletion is reversible within 24 hours","Delete it from the Data Product Hub instead"],"answer":0,"explain":"There is no delete in the Hub. `--cascade` deletes dependents, and `--force` bypasses the check. You cannot undo a deletion.","source":"https://v2.dataos.info/build/productize/monitor-and-delete"},{"domain":"Plan, deploy and operate","q":"An API call to the product returns `DATA_MANIPULATION_DETECTED`. What happened?","options":["A policy masked a column","The semantic model has no dimensions","The token expired","A write or DDL statement was sent to the read-only SQL endpoint"],"answer":3,"explain":"The raw SQL endpoint accepts only read-only statements. It blocks INSERT, UPDATE, CREATE and similar statements. Move logic that changes data into a model or pipeline.","source":"https://v2.dataos.info/references/resources/vulcan/troubleshooting"},{"domain":"Programmatic and AI consumption","q":"Which Python SDK call runs a query against physical tables rather than the semantic layer?","options":["`client.query.submit_semantic_sql(sql)`","`client.query.submit_semantic_rest(query=...)`","`client.query.submit_statement(sql)`","`client.query.get_metric(name)`"],"answer":2,"explain":"`submit_statement` runs raw SQL against physical tables. The semantic_* methods and the metric methods go through the semantic layer.","source":"https://v2.dataos.info/references/interfaces/apis/data-product-apis/sdks/python-sdk"},{"domain":"Programmatic and AI consumption","q":"A Semantic SQL request returns a statement with status `QUEUED`. What must the client do next?","options":["Treat it as failed","Poll `/query/statement/<statement-id>` until it leaves ACCEPTED, QUEUED or IN_PROGRESS, then fetch `/result`","Resend the query with `transpile_only=true`","Switch to Parquet immediately"],"answer":1,"explain":"Semantic SQL and Semantic REST are asynchronous. Submit the query, poll the statement until it completes, and then fetch the result.","source":"https://v2.dataos.info/consume/recipes/retrieve-large-result-sets-with-pagination"},{"domain":"Programmatic and AI consumption","q":"A dashboard app deployed as an `app` resource opens on the wrong page. What is the first thing to look at?","options":["That `spec.service.http.path`, `spec.service.http.ingress.path` and `spec.app.link.url` use the same route","That `imagePullSecret` is set","That `replicas` is 2 or more","That `spec.app.products` is empty"],"answer":0,"explain":"When an app opens on the wrong path, the documented fix is to align the HTTP path, the ingress path and the link URL.","source":"https://v2.dataos.info/consume/activate/apis/data-application/deploy"},{"domain":"Programmatic and AI consumption","q":"A user connects an MCP client with an API token and gets authentication errors, but the endpoint is correct. What must they ask their administrator for?","options":["`Can Edit` on the Data Product","A git-sync secret","The Data Steward role","The `mcp-tool-read` grant under the `use-mcp-service` use case, or a tenant role such as `data_consumer` or `data_developer`"],"answer":3,"explain":"MCP access comes from `mcp-tool-read` under `use-mcp-service`, or from a tenant role such as data_consumer or data_developer.","source":"https://v2.dataos.info/consume/consume-with-ai/connect-a-client"},{"domain":"Programmatic and AI consumption","q":"You are building a LangChain agent on Data Product MCP and want answers to be auditable. What does the documentation recommend?","options":["Hard-code the API token in the agent script","Disable the trust summary to reduce latency","Use application-level prompts so the agent shows the metric, source product, filters and time window for every analytical answer","Give the agent a direct database connection"],"answer":2,"explain":"The docs recommend prompts that make the agent cite the metric, source product, filters and time window. Keep tokens in environment variables. MCP never gives direct DB access.","source":"https://v2.dataos.info/consume/consume-with-ai/connect-an-agentic-framework"}]},"reviewNotes":["Worked example scope: the docs' orders-analytics assumes the nine `public.*_ext` tables already exist in PostgreSQL. Module i1's lab framing (landing them with Nilus from an operational PostgreSQL source into `postgresdepot`) is course design, not a documented recipe; Depot names `<orders-src-depot>`/`postgresdepot` and `<compute-profile>` are placeholders.","i1 lab: the docs' `public.orders_ext` column list has no `updated_at`; the lab keeps `incremental_key: updated_at` with an instruction to remove it if absent. Also confirm `dataos-ctl resource log -t nilus ... --tailLines` works for nilus resources (flag taken from the Data Developer CLI cheatsheet).","Metric `ts` conflict in the docs: the metrics page says DATE columns are rejected for `ts`, yet the Build-journey example's `silver.fct_daily_sales` selects `o.order_date::DATE` and `daily_sales_performance` uses `ts: daily_sales.order_date`. The course's lab uses `DATE_TRUNC('day', o.order_date)` (timestamp) instead. SME should confirm which is correct.","The course's silver/gold SQL (fct_daily_sales without shipment metrics and macros, dim_customer_profile with customer_segment, the three custom audits, the RFM champion unit test fixture) is reconstructed/simplified from the docs' fragments; the `@revenue_order_filter` and `@safe_ratio` macro definitions are not published, so the lab inlines the logic.","`vulcan init`: Build/LDK pages say it scaffolds starter folders, while the July 2026 release notes say new projects init empty by default and the CLI shows `-t default|empty`. The course tells learners to use `-t default` for the starter template; confirm the current default.","The scaffold writes `usage.yml` (LDK page) but the orders-analytics example uses `usage.yaml`; confirm both names are accepted.","LDK page shows `password: \"{{ env_var(POSTGRES_PASSWORD) }}\"` without quotes around the variable name; the course uses the quoted form `env_var('PG_PASSWORD')` from the Build pages.","Postgres prerequisites mention a `roles:id:data-dev`-equivalent role tag while the Link page uses `roles:id:data-developer`; i5's lab assumes tags `roles:id:data-developer` / `roles:id:data-consumer` mapping to groups `data_developer` / `data_consumer` — verify the real tenant role tag IDs.","i5 lab relies on `vulcan transpile --security-context group=...` showing masks and filters in the generated SQL, and on a group with no rule being denied; the CLI docs say transpile propagates security context for testing row/column security but do not show sample output. Also confirm whether `--security-context group=` bypasses the plugin (expected) and whether models without a policy remain queryable by any authorized group.","`/operate/data-developer/manage-data-product-access` still describes policies as defined 'in the semantic model'; this contradicts the July 2026 change (physical-model-only policies). The course teaches the current physical-model rule.","Liveness URL differs across pages: Git & deploy uses `https://<env-fqn>/vulcan/tenants/<tenant>/vulcan/orders-analytics/livez`, Deployment steps uses `https://<env-fqn>/<tenant>/vulcan/<dp>/livez`, and the API reference uses `$PRODUCT_BASE_URL/livez` (`.../vulcan/tenants/<T>/data-products/<T>-<name>`). The course uses the API-reference form.","MCP OAuth endpoint: Connect-a-client lists OAuth at `/mcp/api/v1`, but the Claude Code 'OAuth' tab uses `/dataproduct-mcp/api/v1` without a header. The course follows each page as written; confirm the canonical OAuth URL for Claude Code.","`vulcan audit --verbose` appears in the Build pages but the CLI reference for `audit` lists no `--verbose` option (plan does have `-v/--verbose`). Labs use `vulcan plan dev --verbose`; confirm audit's flag.","i6 lab design: keeping a `type: depot` default gateway for deployment plus a raw `local` gateway selected with `vulcan --gateway local` is inferred from the derivation rules (engine/depots come from the default gateway) and the global `--gateway` option; not shown as a documented pattern.","Python SDK wheel versions differ between pages (0.228.1.28 on Consume, 0.228.1.29 in References) while Vulcan is 0.228.1.30 as of September 2026; labs say 'use the wheel your platform distributes'.","Redshift and Athena engines are beta (September 2026). Course mentions them only in comparison tables.","Deprecations applied: plural `resources/requests/limits` deployment keys; standalone physical-model policies; `expectations:` over `rules:` (rules deprecated Dec 2026); anomaly-detection and change-over-time checks not taught; MODEL-level `profiles` not used; app link URLs as paths; no standalone `trino-deploy.yaml`.","Avoided v1-era components. Note that the Data Developer access page still mentions 'Metis-powered' resource tabs and the runAsUser page mentions 'Bifrost' for the grant; the course omits both names."]}</script>
<script type="application/json" id="data-expert">{"id":"expert","title":"Expert","tagline":"Run DataOS in production and engineer advanced, AI-ready Data Products, across two specialist tracks and a capstone.","audience":"Platform operators, tenant and data admins, and senior data engineers or Data Product developers who hold the Intermediate certification.","prerequisites":["DataOS Intermediate certification or equivalent experience","Comfortable with YAML, SQL, Git and a cloud provider (AWS or Azure)"],"duration":"~20–24 hours plus capstone","outcomes":["Justify an Instance-versus-Tenant decision and a Tenant slicing model with the documented criteria","Plan and do Data Plane provisioning on AWS or Azure through the CLI or UI, with sound credential hygiene","Create, configure, and hand off a Tenant that passes the readiness checklist","Provision and operate Compute, Secrets, Depots, a Lakehouse, Minerva Clusters, Projections and Volumes","Select an engine and Trino deployment shape by matching model-kind support, casing, state-store and serving constraints to a workload","Provision least-privilege engine and DataOS access and predict each model kind's native operation on a given engine","Diagnose engine failures and tune Vulcan workloads and Nilus pipelines with documented tuning orders and the measurement loop","Build composed products with Python and Spark ML models, signals, failure notifications, SCD Type 2 history and role-based masking"],"examBlueprint":[{"domain":"Architecture and Tenancy Design","weight":13},{"domain":"Tenant and Data Administration","weight":13},{"domain":"Access Control in Depth","weight":16},{"domain":"Observability and Operations","weight":10},{"domain":"Engine Mastery","weight":13},{"domain":"Advanced Vulcan Patterns","weight":13},{"domain":"Orchestration and Data Applications","weight":11},{"domain":"AI Activation Architecture","weight":11}],"modules":[{"id":"e1","title":"Architecture and Tenancy Design","track":"Platform Operations & Governance","duration":"~2 h 30 min","objectives":["Explain what crosses the Control Plane–Data Plane boundary and how Tenants are isolated on a shared Data Plane","Decide between a new Tenant and a separate Instance using the documented evaluation criteria","Design a Tenant slicing model (environment, business unit, domain, hybrid) with naming and ownership conventions","Plan Data Plane provisioning on AWS or Azure through the CLI route or the UI route, with safe handling of credentials","Create a Tenant, attach the Data Plane and Compute, make sure that the Stacks work, and hand off the Tenant with the readiness checklist"],"lessons":[{"title":"Control Plane, Data Plane and multi-tenancy","body":"### Two planes, one platform\n\nDataOS uses the **Control Plane–Data Plane** pattern. The **DataOS Instance** is the Control Plane. It is a central management layer that Modern Cloud hosts. The **Data Plane** is the execution layer. It runs fully inside the cloud account of the customer, near the data.\n\nFor an operator, the most important property is what goes across the boundary. The Instance and the Data Plane exchange only **metadata, policies, operational telemetry, and execution instructions**. Customer data never leaves the customer environment. All your later design decisions follow from that rule: where Secrets are, where Compute runs, and how the network opens.\n\n| Layer | Provides | Runs where |\n| --- | --- | --- |\n| DataOS Instance (Control Plane) | Access control, Data Product orchestration, metadata management, observability, the DataOS web applications | Modern Cloud |\n| Data Plane | Compute and workload execution on Kubernetes, runtime Stacks (Vulcan, Nilus, custom engines), Depot and Secret connectivity, workload isolation through Compute | Customer cloud (EKS or AKS) |\n\nThe Instance governs, orchestrates, and monitors Data Products across one or more Data Planes. But it never takes part in data processing.\n\n### How the planes talk\n\nThe Data Plane opens an **outbound** tunnel to the Instance, and TLS encrypts the tunnel. The customer cluster exposes no inbound ports. During provisioning, the Instance uses a kubeconfig that you supply to connect to the Kubernetes API one time. It installs `dataos-manager`. After that, it manages the Data Plane through the tunnel. The kubeconfig is only for the management path. It is never part of data traffic.\n\n> **Note:** The tunnel is outbound. Thus, firewall teams must allow egress to the tunnel edge (`region1.v2.argotunnel.com` and `region2.v2.argotunnel.com` on port `7844`). The tunnel tries UDP/QUIC first and uses TCP as fallback. If TLS inspection or SNI filtering is in place, also allow `*.cftunnel.com`.\n\n### Multi-tenancy on a shared Data Plane\n\nAn Operator creates Tenants on the Instance. In the current deployment model, **one Data Plane is shared across all Tenants on an Instance**. Each Tenant gets Compute from that same Data Plane. Isolation is enforced at three layers:\n\n* **Namespace:** The Resources of each Tenant are scoped to its own Kubernetes namespace. They do not resolve across Tenant boundaries.\n* **Data source connections:** Secrets and Depots are Tenant-scoped. Another Tenant never inherits them implicitly.\n* **Access:** Policies and role grants apply only inside the Tenant that defines them.\n\nThere is one intentional exception, and it often surprises designers: **ingested dataset metadata is visible across all Tenants on the Instance**. If the `finance` Tenant scans a warehouse, users in `marketing` can find those datasets in the catalog. Discovery is not access. To read the data, a `marketing` workload still needs its own Depot and its own Secret (or an explicitly granted Secret). It also needs the applicable policies inside its own Tenant. If a requirement says \"other teams must not even know this table exists\", Tenant isolation alone does not meet it. That requirement then becomes an input to the Instance-versus-Tenant decision in the next lesson.\n\n### Who operates which layer\n\nOperate responsibilities are in layers: the Instance level, the Tenant level, and the Resource level. Five roles map onto these levels:\n\n| Role | Scope of work |\n| --- | --- |\n| DataOS Operator | Provision the Data Plane, create and configure Tenants, set up authentication, invite Tenant Admins |\n| Tenant Admin | Manage Compute, data sources, and Stacks. Grant access. Keep the Tenant healthy |\n| Data Admin | Create and govern Lakehouse namespaces, schemas, tables, and views |\n| Data Product Developer | Make sure that products are ready, deploy and promote, operate live products, author access policies |\n| Data Product Consumer | Consume Data Products within enforced governance, assess trust, raise issues |\n\nThe Operator journey is a checklist with four phases:\n\n* **provision the Data Plane**\n* **design and create Tenants** (attach Data Plane and Compute, assign roles)\n* **configure Tenant resources** (Stacks, data sources, optional Lakehouse)\n* **hand off** to a Tenant Admin\n\nAfter hand-off, the scope of the Operator goes back to the Instance. This scope has these tasks: assign Tenant Admins, keep role design consistent, audit high-privilege access, and monitor the Instance and the Data Plane.\n\n> **Tip:** Before all of this, you must connect DataOS to the enterprise identity provider so that people can sign in. This is a one-time setup, and module e3 covers it. But it is a hard prerequisite. You cannot invite even one Tenant Admin without it.\n\n### What this means for your designs\n\n* Put the Data Plane where the data and the network paths are. The Instance never needs a connection on the data path.\n* Treat a Tenant as a boundary for namespaces, credentials, and policies. It is not a boundary for metadata visibility.\n* Plan the Data Plane capacity for **all** Tenants together, because they share it.","sources":["https://v2.dataos.info/operate/architecture","https://v2.dataos.info/operate/readme","https://v2.dataos.info/operate/dataos-operator/operator","https://v2.dataos.info/operate/dataos-operator/provision-data-plane/aws"]},{"title":"Designing Tenants: Instance or Tenant, and how to slice","body":"### First decision: Tenant or separate Instance?\n\nEach new requirement starts with one question. Does a **Tenant in an existing Instance** serve it, or a **separate DataOS Instance**? The docs give a list of evaluation questions in order. Answer them in that order. Usually, the first \"yes\" with a clear outcome decides the answer.\n\n| # | Question | If yes | If no |\n| --- | --- | --- | --- |\n| 1 | Is it a proof of concept, pilot, or focused data initiative? | Tenant with shared compute | Continue |\n| 2 | Does it require strict infrastructure isolation (security or compliance)? | Separate Instance | Continue |\n| 3 | Will it include users from other departments, external vendors, or consultants? | Separate Instance | Continue |\n| 4 | Does the operating team need full control over upgrades and maintenance schedules? | Separate Instance | Continue |\n| 5 | Is shared infrastructure a higher priority than dedicated resources? | Continue | Separate Instance |\n| 6 | Are workloads predictable and unlikely to affect neighboring Tenants? | Tenant with shared compute | Separate Instance |\n\nIn most cases, a Tenant is the correct starting point. It costs less, it is faster to set up, and it reuses shared platform operations. Three reasons justify a separate Instance: **strict isolation**, **independent infrastructure control** (for example, an upgrade calendar that the shared platform cannot support), and **boundaries that span organizations**. The docs say that this is a governance and operating-model decision, not only an infrastructure decision.\n\n> **Note:** The previous lesson showed that dataset metadata is visible across all Tenants on an Instance. Sometimes even catalog visibility must be separate, for example for an external partner. In that case, question 3 already points you to a separate Instance.\n\n### Second decision: how to slice Tenants\n\nA **Tenant** is the main isolation boundary in DataOS. It has its own namespace, data source connections (Depots and Secrets), access controls, and Compute. Learn this guiding sentence from the docs:\n\n> Create a Tenant for the smallest team, business area, environment, or domain that needs its own isolation, owner, and lifecycle.\n\nFour blueprints cover most estates:\n\n| Pattern | One Tenant per... | Best when |\n| --- | --- | --- |\n| By environment | `dev`, `stg`, `prod` | A team needs clear separation between development, testing, and production |\n| By business unit | `marketing`, `finance`, `supply-chain` | Ownership, budget, and governance follow the org chart |\n| By domain | `orders`, `customers`, `inventory` | Domain teams own products from development through operation |\n| Hybrid | `marketing-dev`, `marketing-prod` | You need business separation and environment separation |\n\nMany organizations start with environment-based Tenants for their first team. As adoption grows, they move toward business-unit, domain, or hybrid patterns.\n\n### The trade-offs you are making\n\n| Area | More Tenants | Fewer Tenants |\n| --- | --- | --- |\n| Isolation | Stronger separation | More workloads share a boundary |\n| Cost | More setup and operating overhead | Better reuse of shared infrastructure |\n| Governance | Clearer ownership, more boundaries to manage | Fewer boundaries, ownership can blur |\n| Operations | More Tenants to create, configure, monitor | Easier to manage, each Tenant carries more |\n| Promotion | Clear dev-to-prod path when split by environment | Promotion happens inside one Tenant |\n| Sharing | Cross-Tenant sharing needs explicit access | Sharing is easier |\n\n### A five-step method\n\n1. **Start with ownership.** The team that is accountable each day for data, workloads, and products is often the correct boundary.\n2. **Separate environments when production stability matters.** Use `dev`/`stg`/`prod` or a hybrid pattern so that experiments cannot break production.\n3. **Separate areas that must not affect each other.** Some areas must be safe from a failed workload, a configuration change, or an access mistake in another area. Split these areas.\n4. **Consider the operating effort.** You must create, configure, govern, monitor, and review each Tenant. Create only the Tenants that your team is ready to run.\n5. **Plan shared resources early.** Decide which data sources, Computes, and reference datasets are shared and which stay isolated. Cross-Tenant access must be granted explicitly. For example, another Tenant can use a Secret from one Tenant only after an explicit grant.\n\n### Operating practices\n\n* **Use stable names**, such as `<business-unit>-<environment>` or `<domain>`. Workflows and references can depend on a Tenant name, so do not rename a Tenant. You can change titles and descriptions later, but frequent changes disrupt references and communication.\n* **Keep role design consistent** across Tenants so that access stays predictable.\n* **Review Tenants regularly.** Each Tenant must have an owner, a purpose, and active workloads. Retire the other Tenants.\n\n> **Warning:** The name `system` is reserved for the Instance-level Tenant in which the Data Plane is provisioned. Since the September 2026 release, an attempt to create a Tenant named `system` fails. The error message has the same style as the message for a duplicate name.\n\n### Worked example\n\nAn organization runs an `orders-analytics` Data Product. The orders domain team owns it, and production stability matters. Also, an external logistics consultancy needs to build a separate forecasting product on shared order data. Apply the method. The internal work fits a **hybrid** slice (`orders-dev`, `orders-prod`) on the existing Instance. The consultancy triggers question 3 (external participants). Thus, its workspace belongs in a **separate Instance**. Data is shared through governed interfaces, not through a shared Tenant.","sources":["https://v2.dataos.info/operate/dataos-operator/choosing-between-instance-and-tenant","https://v2.dataos.info/operate/dataos-operator/design-tenants","https://v2.dataos.info/references/resources/secret/consume","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Provisioning the Data Plane on AWS and Azure","body":"### What you are provisioning\n\nYou install the Data Plane **onto an existing Kubernetes cluster** (EKS on AWS, AKS on Azure). The SRE team of the customer provisions this cluster to the published requirements of Modern. You provision the Data Plane at the Instance level, in the **`system`** Tenant. When it is active, every Tenant on the Instance can attach to it and get Compute from it.\n\nEach cloud has two routes. The **CLI route** uses a Data Plane manifest that you apply with `dataos-ctl domain apply`. The **UI route** goes through **Instance Admin → Dataplanes → + Provision Dataplane**. Both routes install the same thing.\n\n### Prerequisites common to both clouds\n\n* A working **Instance FQDN**, for example `pacific-staging.instance.dataos.cloud`.\n* **Roles** `roles:id:user`, `roles:id:operator`, and `roles:id:super-user`. Make sure that you have them in Bifrost at `https://<instance-fqdn>/platform/bifrost/users`.\n* An external **PostgreSQL** server with two databases that already exist. One database is for **System HealthD** (Data Plane health tracking). The other database is for **Vesta** (the state store).\n* A valid **kubeconfig** that `kubectl` can use to connect to the cluster. You encode it in base64 as a single line.\n* **Release inputs from Modern**: the install artifact (`artifactIdentifier`), the DataOS Manager image tag (`imageTag`), and the DataOS CLI version to install on the bastion host.\n\n> **Warning:** For production, use the **snapshot** form of `artifactIdentifier` (`artifact:aft_...`). The **release** form (`release:dataos-v2-install-manifests:prd_...`) installs the latest build behind that release. Thus, a later apply of the same manifest can silently get a newer build.\n\n### The CLI route in eight moves\n\nRun all commands from the **bastion host**, because production cluster API servers accept traffic only from authorized ranges. The bastion keeps no logged-in session. Thus, never run `dataos-ctl init` or `dataos-ctl login` there. Instead, each command carries `USER_ID`, `DATAOS_FQDN`, `APIKEY`, and `DATAOS_TENANT_ID=system`.\n\n1. **Collect your own user ID and a personal API key** (`dataos-ctl user get`, `dataos-ctl user apikey create`). You use this key for one command only.\n2. **Create a dedicated application user** in Bifrost, named `<dataplane-name>-user`, with the same three roles. The application user owns the deployment. Thus, the Data Plane is never tied to a person.\n3. **Issue a short-lived API key for the application user** with your personal key:\n\n```bash\nUSER_ID=<your-user-id> \\\n  DATAOS_FQDN=<instance-fqdn> \\\n  APIKEY=<your-personal-apikey-token> \\\n  DATAOS_TENANT_ID=system \\\n  dataos-ctl user apikey create -i <dataplane-name>-user -d 24h\n```\n\n4. **Base64-encode the kubeconfig** (`kubectl config view --minify --flatten | base64 -w 0` on Linux). The macOS and Windows commands are different.\n5. **Export the variables** that the manifest resolves: `KUBECONFIG_BASE64`, `IMAGE_TAG`, and `ARTIFACT_IDENTIFIER`. On AWS, also export `REGION`, `AWS_ACCESS_KEY_ID`, and `AWS_SECRET_ACCESS_KEY`. The AWS keys must also be base64-encoded.\n6. **Prepare the manifest** (`entity: domain`, `type: dataplane`, `networkType: tunnel`, kernel template `dataplane-kernel-system-existing-compute-tunnel-v1`). Fill in the identity, `workpiece.name` (it must end in `.dataplane`), and the PostgreSQL fields. Keep all other fields as shown.\n7. **Lint, then apply**, authenticated as the application user:\n\n```bash\nUSER_ID=<dataplane-name>-user \\\n  DATAOS_FQDN=<instance-fqdn> \\\n  APIKEY=<application-user-apikey-token> \\\n  DATAOS_TENANT_ID=system \\\n  INSTANCE_TENANT_ID=<instance-name> \\\n  DATAPLANE_ID=<dataplane-name> \\\n  dataos-ctl domain apply -f aws-dataplane.yaml -l\n```\n\nRun the same command again **without `-l`** to provision. A lint that \"succeeds but creates nothing\" means that `-l` is still on.\n8. **Monitor** with `dataos-ctl domain get -t dataplane -n <dataplane-name> -v v1alpha -d`, or watch with `dataos-ctl domain ls -r`. Provisioning usually completes within 30 minutes. `workpiece-forge-kernel: success` means that the infrastructure step is done. If provisioning stops, follow `kubectl logs -n <instance_name>-0-dsm dataos-manager-0 -f`.\n\n> **Warning:** Never provision with your personal API key. Treat the manifest (kubeconfig, cloud credentials, and database credentials) as a secret. Store it encrypted, and decrypt it only at apply time.\n\n### AWS versus Azure\n\n| Aspect | AWS | Azure |\n| --- | --- | --- |\n| Cluster | Existing EKS | Existing AKS |\n| Cloud credentials | `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY` (base64) in `directInputs` and `kubeAuthConfigs`, plus `region` | None in the manifest. Kubeconfig only |\n| Kernel `cloud` value | `aws` | `azure` |\n| Kubeconfig helper (UI guide) | `aws eks update-kubeconfig --region <region> --name <cluster-name>` | `az aks get-credentials --resource-group <resource-group> --name <cluster-name> --admin` |\n| RBAC to examine when reconciliation stops | IAM access entry or `aws-auth` mapping | Kubeconfig identity bound to a Kubernetes RBAC role |\n\n### The UI route\n\nGo to **Instance Admin → Dataplanes → + Provision Dataplane**. A wizard with five screens collects the same inputs:\n\n* **Prerequisites**.\n* **Identity**: the Data Plane ID and a description. The ID has a maximum of 30 characters. It must stay stable, because it generates domain names. The description can have up to 200 characters.\n* **Cluster Access**: the cloud, the fixed `Tunnel` network type, and the base64 kubeconfig. On AWS, also the AWS region and keys.\n* **Node Pool**: the default selector is `dataos.io/purpose: core-kernel`.\n* **PostgreSQL**: the host, port `5432`, and the two databases.\n\nSelect **Create Dataplane** to start. To make sure that the Data Plane exists, look at the Dataplanes page, or run `dataos-ctl domain get -a`.\n\n### Day-2: rotating credentials\n\nSince the September 2026 release, you can **rotate a Data Plane's credentials in place** from Instance Admin: **Dataplanes → Manage (gear) → ⋮ → Rotate credentials**. On AWS, you supply new access keys and a new kubeconfig. On Azure, you supply a new kubeconfig. When the current credentials expire, DataOS starts to use the new credentials. Thus, you no longer delete the Data Plane and create it again.\n\n### Common failure signatures\n\n* `domain apply` returns **forbidden**: you authenticate as yourself, or the application user does not have a role.\n* Pods are **Pending**: the `dataos.io/purpose: core-kernel` label is missing, or the node pool does not have capacity.\n* **Tunnel does not establish**: something blocks egress to the tunnel edge on `7844`, or blocks DNS.\n* **Install step fails**: the `artifactIdentifier` is wrong for the release, or Prime is not reachable.\n\n> **Tip:** Use the `core-kernel` node pool only for platform components. Never schedule user Data Product workloads on it.","sources":["https://v2.dataos.info/operate/dataos-operator/provision-data-plane","https://v2.dataos.info/operate/dataos-operator/provision-data-plane/aws","https://v2.dataos.info/operate/dataos-operator/provision-data-plane/azure","https://v2.dataos.info/operate/dataos-operator/provision-data-plane/aws-ui","https://v2.dataos.info/operate/dataos-operator/provision-data-plane/azure-ui","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Creating Tenants, deploying Stacks and handing off","body":"### Phase 2: create the Tenant\n\nWhen the Data Plane reports healthy, open **Profile → Instance Admin** and select **Create New Tenant**. Enter a title and a description, then select **Create**. The Tenant shows **yellow** during creation, which can take up to 10 minutes. Use the stable name from your design.\n\nSince the August 2026 release, Instance Admin has a pre-filled workflow for Tenant creation. Also, **every new Tenant arrives with default Stacks and Secrets already set up**, ready for Data Product deployment.\n\n> **Warning:** Tenants that were created **before the August 2026 release** must be migrated to the new Tenant definition. Contact SRE to upgrade them. Also, the July 2026 release changed how Tenant domains are configured. An Operator had to apply the domains of existing Tenants again with the refreshed Tenant manifest from Modern.\n\n### Invite people: Tenant Admin first\n\nOpen the **Access** tab of the Tenant and select **+ Grant**. Choose the user, or enter an email to invite the user. Then assign a Tenant role: **Tenant Admin**, **Data Admin**, **Data Developer**, or **Data Consumer**. The invitee gets an email and holds the role after they accept.\n\nGrant **Tenant Admin first**. A Tenant Admin can invite all other people and assign Data Developer, Data Consumer, and Data Admin roles. They do not have to come back to you.\n\n### Connect the Data Plane and attach Compute\n\nThe Tenant cannot run a Data Product workload until these two steps are done. But you do not have to do them yourself. Do them now, or hand off and let the Tenant Admin do them. The important thing is to agree who owns them.\n\n* **Connect dataplane:** In the Tenant, go to **Settings → Dataplane → + Connect**, select the Data Plane, then select **Create Connection**. The status stays gray for up to 10 minutes. When the connection is made, it turns green. The Data Plane must already exist.\n* **Attach Compute:** In Instance Admin, open the **Compute** section of the Tenant. Select **+ Add**, and give the node pool selector and the infrastructure details. Compute changes from **Pending** to **Active** in 2 to 3 minutes. Without Compute, the Tenant cannot run workloads.\n\n### Phase 3: deploy and confirm Stacks\n\nThe Deploy Stacks runbook lists three components that a Tenant depends on:\n\n| Stack | Why it matters | Notes |\n| --- | --- | --- |\n| `lakehouse-mruntime` | Runtime for the Lakehouse Spark Cluster. No Lakehouse can be created without it | Manifest and version are environment-specific. Get them from your DataOS representative |\n| Data Product MCP server | Data Product tooling for AI clients | Deployed **once**, for the first Tenant. Later Tenants reuse it |\n| MCP OAuth broker | Lets clients authenticate to the MCP server through OAuth | Needs four values (below) |\n\nFirst, make sure that the runtime is active:\n\n```bash\ndataos-ctl develop stack versions\n```\n\nMake sure that the output lists `lakehouse-mruntime` in an active state. To apply the MCP server, pass the Tenant and the Compute as environment variables:\n\n```bash\n# Service: set tenant and compute for your environment\nTENANT_ID=qa COMPUTE_NAME=qa-compute \\\n  dataos-ctl resource apply -f installs/instance-platform-shell/artifacts/dataproduct-mcp-service.yaml\n```\n\nThe broker needs these values: `JWT_PRIVATE_KEY_B64` (an RSA 3072 key, base64 on one line), `FORWARD_AUTH_SHARED_SECRET` (`openssl rand -base64 48`), and the `UPSTREAM_CLIENT_ID` / `UPSTREAM_CLIENT_SECRET` of a dedicated confidential **Heimdall OIDC client**. Request this client from the person who administers Heimdall. Apply `broker-secret.yaml`, then `mcp-broker.yaml`, in the same way.\n\n> **Warning:** The redirect URI of the Heimdall OIDC client must be `https://<dataOsFqdn>/mcp/api/v1/oauth/callback`. If it is not, OAuth fails. Never commit the JWT key, the shared secret, or the client secret to Git. After you encode the key, delete the generated key file.\n\n> **Note:** Some Stack manifests contain Instance-level `${ENV}` placeholders that must not be resolved at apply time. For these manifests, add `--disable-interpolation` to `dataos-ctl resource apply`. Secret and Depot manifests do not need it.\n\nPhase 3 also covers data source access (at least one Secret and a matching Depot, module e2) and an optional Lakehouse.\n\n### Phase 4: hand off\n\nA configured Tenant is not complete until a person owns it. Before you hand it over, go through the readiness checklist:\n\n* The **Data Plane** is connected, and at least one **Compute** is attached and active.\n* The required **Stacks** are installed and healthy.\n* At least one data source **Secret** and its matching **Depot** are active.\n* If the team needs managed Iceberg storage, a **Lakehouse** is provisioned.\n* A sanity **Data Product** deploys and runs without errors.\n\nThe Tenant Readiness page adds two items: the mandatory state store Secrets in the `system` Tenant, and a Tenant Admin who holds the role and can sign in. Then give the new Tenant Admin their first tasks: make sure that Compute and data sources work, invite the team, and grant developers `Can Use` on the resources that they need.\n\n### Why delegation matters\n\nIn a small estate, you can administer every Tenant yourself. As the estate grows, delegation keeps it manageable. The Tenant Admin handles the users, resources, and grants of the Tenant. You keep the Instance, the Data Planes, and the Tenant lifecycle. The docs state it clearly: Instance authority never leaks into the Tenant, and Tenant authority never reaches the Instance. After this point, your ongoing work is governance at the Instance level, and monitoring. Governance has these tasks: assign and review Tenant Admins, audit delegated identities, and retire Tenants that have no owner.","sources":["https://v2.dataos.info/operate/dataos-operator/create-tenants","https://v2.dataos.info/operate/dataos-operator/create-tenants/deploy-stacks","https://v2.dataos.info/operate/dataos-operator/create-tenants/hand-off-tenant","https://v2.dataos.info/operate/tenant-readiness","https://v2.dataos.info/operate/dataos-operator/governance","https://v2.dataos.info/operate/cli","https://v2.dataos.info/releasenotes/august-2026","https://v2.dataos.info/releasenotes/july-2026"]}],"lab":{"title":"Design and stand up an orders-analytics Tenant","goal":"Three results. First, a written tenancy decision record for the orders domain. Second, a linted (not applied) Data Plane manifest. Third, a new Tenant with a Data Plane, Compute, Stacks, and a Tenant Admin. You compare the Tenant with the readiness checklist.","duration":"75 min","prereqs":["Operator access to a sandbox DataOS Instance (`roles:id:user`, `roles:id:operator`, `roles:id:super-user`). If you do not have it, do steps 1-3 as a design exercise only","`dataos-ctl` installed at the CLI version named in the release notes","Values from your instructor or SRE team for every `<placeholder>` below. Do not invent them"],"steps":["**Write the decision record.** Use this brief: *The orders domain team owns `orders-analytics`. Production stability matters. A finance analyst team will only consume. An external logistics consultancy wants to build a forecasting product on order data*. Answer the six Instance-vs-Tenant questions in order for (a) the orders team and (b) the consultancy. Record the first question that decides each case.","**Choose the slicing pattern and names.** Select a pattern (environment, business unit, domain, or hybrid). Write the Tenant names with a stable convention such as `<domain>-<environment>`. List the Tenant Admin for each Tenant. List which resources (Computes, data sources) are shared and which are isolated. Dataset metadata will be visible across all Tenants on the Instance. Write down whether that is acceptable.","**Prepare the Data Plane variables** (do not apply). On the bastion host, export the variables that the manifest resolves:\n\n```bash\nexport KUBECONFIG_BASE64=<base64-encoded-kubeconfig>\nexport IMAGE_TAG=<dataos-manager-image-tag>\nexport ARTIFACT_IDENTIFIER=<install-artifact>\nexport REGION=<aws-region>\n```\n\nMake sure that `ARTIFACT_IDENTIFIER` uses the snapshot form (`artifact:...`). Explain why in one sentence.","**Lint the manifest only.** Save the sample AWS (or Azure) manifest from the runbook as `aws-dataplane.yaml`. Run lint as the Data Plane application user:\n\n```bash\nUSER_ID=<dataplane-name>-user \\\n  DATAOS_FQDN=<instance-fqdn> \\\n  APIKEY=<application-user-apikey-token> \\\n  DATAOS_TENANT_ID=system \\\n  INSTANCE_TENANT_ID=<instance-name> \\\n  DATAPLANE_ID=<dataplane-name> \\\n  dataos-ctl domain apply -f aws-dataplane.yaml -l\n```\n\nIn a shared sandbox, do **not** remove `-l` unless your instructor tells you to provision.","**Inspect the existing Data Plane.** List the Data Planes, including the Data Planes that other people created:\n\n```bash\ndataos-ctl domain get -a\n```\n\nRecord the name and status of the Data Plane that your Tenant will attach to.","**Create the Tenant.** In **Profile → Instance Admin**, select **Create New Tenant**. Enter the title and description from your decision record, and select **Create**. Wait until the status is no longer yellow (up to 10 minutes).","**Assign the Tenant Admin.** Open the **Access** tab of the Tenant and select **+ Grant**. Choose the designated user, or enter the email of the user. Assign **Tenant Admin**.","**Connect the Data Plane and attach Compute.** In the Tenant, go to **Settings → Dataplane → + Connect → Create Connection**. The status changes from gray to green in up to 10 minutes. Then, in the **Compute** section of the Tenant, select **+ Add**. Give the node pool selector from your instructor. The status changes from Pending to Active in 2-3 minutes.","**Confirm the Lakehouse runtime and Stacks.** Initialize the CLI for the new Tenant. Then run:\n\n```bash\ndataos-ctl develop stack versions\ndataos-ctl resource get -t stack -a\n```","**Run the hand-off checklist.** Tick each readiness item. Record who owns each open item. For example, the Tenant Admin will create the data source Secret and Depot in module e2."],"verify":"- Lint completes without errors, and **nothing** is provisioned (`-l` was on).\n- `dataos-ctl domain get -a` shows the target Data Plane as active.\n- In Instance Admin, the new Tenant is no longer yellow, the Dataplane connection is green, and the Compute is **Active**.\n- `dataos-ctl develop stack versions` lists `lakehouse-mruntime` as active.\n- The decision record names a deciding question for the orders team (Tenant) and for the consultancy (separate Instance, because of external participants). Every Tenant in your design has a named Tenant Admin.","sources":["https://v2.dataos.info/operate/dataos-operator/choosing-between-instance-and-tenant","https://v2.dataos.info/operate/dataos-operator/design-tenants","https://v2.dataos.info/operate/dataos-operator/provision-data-plane/aws","https://v2.dataos.info/operate/dataos-operator/provision-data-plane/azure","https://v2.dataos.info/operate/dataos-operator/create-tenants","https://v2.dataos.info/operate/dataos-operator/create-tenants/deploy-stacks","https://v2.dataos.info/operate/dataos-operator/create-tenants/hand-off-tenant","https://v2.dataos.info/operate/tenant-readiness"]},"takeaways":["The Instance exchanges only metadata, policies, telemetry, and instructions with the Data Plane. Data stays in the customer cloud.","All Tenants share one Data Plane. Isolation comes from namespaces, Tenant-scoped Secrets and Depots, and Tenant-scoped grants. But dataset metadata is visible across the full Instance.","Start with a Tenant. Choose a separate Instance for strict isolation, external participants, or independent upgrade control.","Provision the Data Plane as a dedicated application user with a short-lived key. Lint with `-l` first, and pin a snapshot artifact in production.","Grant Tenant Admin first. Agree who connects the Data Plane and attaches Compute. Hand off only after the readiness checklist passes."],"quiz":[{"q":"A compliance officer asks whether order rows that a Vulcan Data Product processes ever go through the DataOS Instance in Modern Cloud. What is the accurate answer?","options":["Yes, the Instance caches query results for observability","No. The Instance exchanges only metadata, policies, telemetry, and execution instructions, and data stays in the customer's Data Plane","Only when the Data Plane uses `networkType: tunnel`","Only for Tenants that have a Lakehouse"],"answer":1,"explain":"The architecture page states that customer data never leaves the customer environment. The tunnel carries management traffic, not data. The tunnel option is tempting, but the tunnel is the outbound management path, not a data path.","source":"https://v2.dataos.info/operate/architecture"},{"q":"The `marketing` Tenant can see a `finance` warehouse table in the catalog. A marketing developer thinks that they can now query it. What does marketing still need?","options":["Nothing, because catalog visibility means read access","Only a `Can Use Cluster` grant on finance's Minerva Cluster","Its own Depot and Secret for that source (or an explicitly granted one) plus the applicable policies inside the marketing Tenant","A separate Instance, because cross-Tenant reads are impossible"],"answer":2,"explain":"Metadata is discoverable across the Instance, but data access is Tenant-scoped. The requesting Tenant needs a Depot, a Secret, and policies. Cross-Tenant use is possible with explicit grants, so a separate Instance is not necessary.","source":"https://v2.dataos.info/operate/architecture"},{"q":"A team wants a 6-week proof of concept on order data with only internal users. Which model do the evaluation criteria recommend?","options":["A Tenant with shared compute","A separate Instance with dedicated compute","A new Data Plane in the same Instance","A hybrid Tenant set (`poc-dev`, `poc-prod`)"],"answer":0,"explain":"Question 1 (proof of concept or focused initiative) points directly to a Tenant with shared compute. A separate Instance is only for strict isolation, external participants, or independent control.","source":"https://v2.dataos.info/operate/dataos-operator/choosing-between-instance-and-tenant"},{"q":"While you provision an AWS Data Plane, `dataos-ctl domain apply -f aws-dataplane.yaml -l` succeeds, but no Data Plane appears after an hour. What is the most probable cause?","options":["The kubeconfig was not base64-encoded","The `-l` (lint) flag was left on, so nothing was provisioned","`DATAOS_TENANT_ID` must be the Tenant name, not `system`","The application user lacks `roles:id:user`"],"answer":1,"explain":"The troubleshooting section says that a successful lint with nothing provisioned means that `-l` is still set. Run the command again without it. Missing roles cause a forbidden error, not a silent success.","source":"https://v2.dataos.info/operate/dataos-operator/provision-data-plane/aws"},{"q":"You must add data-source connections and a Lakehouse for a new Tenant. The operator already assigned a Tenant Admin. The connect-Data-Plane and attach-Compute steps are not done yet. What do the docs say about who must do them?","options":["Only the Operator can connect the Data Plane and attach Compute","They are optional and can be skipped if the Tenant only uses a Lakehouse","The Data Admin must do them before creating the Lakehouse","Either the Operator or the Tenant Admin can do them. Agree who owns them so they are not left undone"],"answer":3,"explain":"The create-tenants page says that these steps are optional for the Operator but required for the Tenant. After hand-off, the Tenant Admin can complete them. The Tenant can never run workloads without them.","source":"https://v2.dataos.info/operate/dataos-operator/create-tenants"}]},{"id":"e2","title":"Tenant and Data Administration","track":"Platform Operations & Governance","duration":"~2 h 45 min","objectives":["Provision Compute with correct selectors, taints, and aliases
