, and retire it safely","Create Tenant-scoped Secrets and Depots with purpose-scoped credentials and rotate them without downtime","Provision and operate a Lakehouse: dedicated metastore, current manifest keys, verification, and Iceberg maintenance operations","Size and operate a Minerva Cluster within its documented limits","Apply Projections and Volumes correctly, and avoid the silent-drop and mount-ID pitfalls"],"lessons":[{"title":"Compute, Secrets and Depots: the Tenant's foundation","body":"### Compute: the node pools every workload lands on\n\nDuring the initial setup, DataOS creates a base Compute and attaches it to the Data Plane and the Tenant. As a Tenant Admin, you add more Compute for specific needs, such as data processing, query execution, or machine learning. Compute abstracts the cloud infrastructure into standard pools. Vulcan, Nilus, Minerva Clusters, Lakehouses, and Apps use these pools by name through `spec.compute`.\n\n```yaml\nname: compute-analytics\nversion: v2alpha\ntype: compute\ndescription: \"High-memory compute for analytics workloads\"\nspec:\n  dataplane: dp-prod-01            # must reference an existing Data Plane\n  aliases:\n    - analytics-compute\n  nodeSelector:                    # required, non-empty\n    dataos.io/purpose: analytics\n  nodePool:\n    labels:\n      dataos.io/purpose: analytics\n    taints:\n      - key: dedicated\n        value: analytics\n        effect: NoSchedule\n```\n\nApply, inspect, and delete Compute with the generic Resource commands:\n\n```bash\ndataos-ctl resource apply -f artifacts/compute/compute.yaml\ndataos-ctl resource get -t compute -n <compute-name>\ndataos-ctl resource delete -t compute -n <compute-name>\n```\n\nThree distinctions are important at expert level:\n\n* **`nodeSelector` vs `nodePool.labels`.** `nodeSelector` is the strict node-level filter that decides where a Pod can land. `nodePool.labels` describes the pool for grouping and autoscaling. If two Computes share the same `nodeSelector`, workloads land on the wrong nodes. Keep selectors disjoint. Use `nodePool.taints` on premium (GPU, high-memory) pools so that cheap workloads cannot take them.\n* **Renames and deletes.** If you delete a Compute that workloads still reference, the workloads cannot be scheduled on their next reconcile. Add the old name to `spec.aliases`, migrate the consumers, then delete the Compute.\n* **Creating is not using.** The creator gets `Can Edit` and `Can Manage Access`. But to run a workload, you need `Can Use Compute`, even as the creator.\n\n> **Tip:** Name Compute by intent (`analytics-compute`, `ml-gpu-compute`), not by hardware (`m5-xlarge-compute`). Document it in `description` and `tags`. Hardware changes, but intent does not.\n\n### Secrets: credentials stored once\n\nA Secret stores credentials as encrypted key-value pairs at the Tenant level. No workload reads these values directly. Other Resources reference the Secret by name.\n\n```yaml\nname: postgres-cred\nversion: v2alpha\ntype: secret\nlayer: user\ndescription: \"PostgreSQL read/write credentials\"\nsecret:\n  type: key-value\n  data:\n    username: \"<POSTGRES_USERNAME>\"\n    password: \"<POSTGRES_PASSWORD>\"\n```\n\nThese rules cause most validation failures:\n\n* `layer: user` is required for Tenant-scoped Secrets.\n* `secret.type` is `key-value` for data source credentials. BigQuery uses `secret.files` instead of `secret.data`.\n* Every value must be a string, so put numbers in quotes (`PORT: \"5432\"`).\n* Names must match `[a-z]([-_.a-z0-9]*[a-z0-9])`, have fewer than 60 characters, and end in a letter or digit.\n* You cannot restore a deleted Secret. Before you delete a Secret, look for the Resources that depend on it.\n\n### Depots: endpoints that reference Secrets\n\nA Depot declares the connection endpoint and references the Secret. Workloads reference only the Depot, through its UDL, such as `dataos://postgresdepot`. DataOS injects the credentials at runtime.\n\n```yaml\nname: postgresdepot\nversion: v2alpha\ntype: depot\nlayer: user\nspec:\n  type: postgresql\n  spec:\n    host: \"<POSTGRES_HOST>\"\n    port: 5432\n    database: \"<POSTGRES_DATABASE>\"\n    subprotocol: \"postgresql\"\n  secrets:\n    - id: \"<TENANT_NAME>:postgres-cred\"\n      purpose: scan\n    - id: \"<TENANT_NAME>:postgres-cred\"\n      purpose: query\n    - id: \"<TENANT_NAME>:postgres-cred\"\n      purpose: rw\n```\n\nThe Secret reference is **Tenant-qualified** (`<tenant>:<secret-name>`) and case-sensitive. A Depot can attach a different Secret for each purpose (`scan`, `query`, `rw`). If a Tenant must only read, omit `rw`. Apply the Secret first, because DataOS validates the Secret reference of the Depot at apply time:\n\n```bash\ndataos-ctl resource apply -f postgres-cred.yaml\ndataos-ctl resource apply -f postgresdepot.yaml\ndataos-ctl resource get -t depot -n postgresdepot -d\n```\n\n### Operating the connections\n\n* **Own the privileged sources.** The Tenant Admin (or a designated Data Admin) must create and hold production credentials. Do not spread them across Secrets that developers own.\n* **Rotate by re-applying the Secret.** You do not apply the Depot again, because it reads the Secret at runtime.\n* **Grant use, do not share.** Developers get to a Depot through `Can Use` grants on the Depot and its linked Secret. They never hold the credentials.\n* **Cross-Tenant reuse is explicit.** Another Tenant in the same environment can use a Secret from one Tenant only after an explicit grant. A Data Admin, an Operator, or a Tenant Admin gives this grant.\n\n> **Note:** A Depot that stays in `pending` means that the connection test did not finish, or failed. Read `status.message` in `dataos-ctl resource get -t depot -n <name> -d`. Sometimes a Depot is active, but workloads still cannot reach the source. This usually points to the network (peering, firewall) or to IAM on the source side.","sources":["https://v2.dataos.info/operate/tenant-admin/tenant-admin","https://v2.dataos.info/operate/tenant-admin/create-compute","https://v2.dataos.info/operate/tenant-admin/add-data-sources-and-secrets","https://v2.dataos.info/references/resources/secret","https://v2.dataos.info/references/resources/secret/manifest-configuration","https://v2.dataos.info/references/resources/secret/consume"]},{"title":"Running the Lakehouse","body":"### What a Lakehouse is made of\n\nA Lakehouse is a DataOS Resource. It combines Apache Iceberg tables (Parquet data files) with cloud object storage, and it bundles the services that are necessary to run it. When you apply a Lakehouse, DataOS provisions these components:\n\n| Component | Role |\n| --- | --- |\n| Object storage | S3, ABFSS, or GCS holds Parquet data and Iceberg metadata |\n| REST Catalog | The metastore: schemas, snapshots, views, and file locations, persisted through a JDBC catalog on **PostgreSQL** |\n| Catalog Runtime (`lakehouse-cruntime`) | Exposes the Iceberg REST Catalog and the Lakehouse governance APIs |\n| Spark Cluster | Query and maintenance engine (server, driver, executors). Always provisioned |\n| Sherpa server and worker | Queues maintenance jobs one at a time, retries failures, and delegates execution to Spark |\n\nThe maintenance flow is `User → REST Catalog → Sherpa Server → Spark Cluster`. The `sparkCluster` and `sherpa` manifest blocks are optional **to configure**, but they are never optional to run. If you omit the blocks, the defaults apply. Consumers never query the Lakehouse resource directly. They use a compute engine that reads through a Lakehouse Depot: Minerva for interactive SQL, or Vulcan for governed products.\n\n### Before you apply\n\n* **Permissions:** You need the Tenant Admin, Data Admin, or Data Developer role. You also need `Can Use` on the Compute and Secrets (and Depot) that the Lakehouse depends on. The creator becomes the owner with `Can Edit` and `Can Manage Access`.\n* **Domain:** Make sure that a Lakehouse domain exists (`dataos-ctl domain get -t resource -a`). If it does not exist, ask your Operator or Tenant Admin.\n* **Runtime:** `dataos-ctl develop stack versions` must list `lakehouse-mruntime` with that exact name.\n* **Metastore:** Use a **dedicated PostgreSQL database per Lakehouse**. Several databases on one server are acceptable. If Lakehouses share one database, their metadata paths mix and metadata operations break. The docs call this the most common Lakehouse failure.\n* **Storage layout:** Decide the bucket and the relative path at the start. It is expensive to move data later.\n\n### The manifest\n\nFirst, create two Secrets: one for the metastore credentials and one for the object-storage credentials. Then create the Lakehouse:\n\n```yaml\nname: s3pglh\nversion: v1alpha\ntype: lakehouse\nspec:\n  compute: \"${compute-name}\"\n  runAsUser: \"${user-id}\"\n  iceberg:\n    metastore:\n      type: iceberg-jdbc-catalog\n      replicas: 1\n      secret: \"${tenant}:lh-metastore-secret\"\n      postgresql:\n        host: \"${postgres-host}\"\n        port: \"5432\"\n        database: \"${database-name}\"\n        schema: public\n    storage:\n      type: s3\n      s3:\n        bucket: \"${s3-bucket-name}\"\n        relativePath: \"${relative-path}\"\n        scheme: s3a\n        format: ICEBERG\n        endpoint: \"${s3-endpoint}\"\n      secret: \"${tenant}:lh-storage-secret\"\n    sparkCluster:\n      resources:\n        requests:\n          cpu: 200m\n          memory: 512Mi\n        limits:\n          cpu: 500m\n          memory: 1000Mi\n      executor:\n        cores: 1\n        memory: \"2048m\"\n        instances: 1\n  logLevel: INFO\n```\n\n> **Warning:** Since the September 2026 release, the CPU and memory of the Spark Cluster belong under `sparkCluster.resources`. DataOS still accepts the older `sparkCluster.server` location for a short time. If both are set, `resources` wins. But some examples still show `server`. Move sizing to `resources` before DataOS removes the deprecated field.\n\n`spec.runAsUser` is mandatory. Lakehouse operations run under that identity. For this reason, module e3 recommends an application user here.\n\n### Apply, verify, connect\n\n```bash\ndataos-ctl resource apply -f lakehouse.yaml\ndataos-ctl resource get -t lakehouse -n s3pglh -d   # spec, runtime state, status\ndataos-ctl resource get -t lakehouse -n s3pglh -b   # Kubernetes resources created by the build\n```\n\nDataOS creates a Depot with an automatic name (`<lakehouse-name>-depot`). You can also create a Depot of type `lakehouse` yourself. Set `storageType`, `catalogType: REST`, `metastoreUrl` (the internal Kubernetes service address), `metastoreRelativePath`, a matching storage block, and a Secret with the `rw` purpose.\n\n### Day-2 operations from the CLI\n\nThe `dataos-ctl lakehouse` group (alias `lh`) covers namespaces, tables, schema evolution, partitions, snapshots, branches, metadata, properties, and maintenance operations. Identifiers use the form `lakehouse:namespace:table`:\n\n```bash\ndataos-ctl lakehouse namespace list -n s3pglh\ndataos-ctl lakehouse table list -n s3pglh --namespace sales\ndataos-ctl lakehouse table snapshot list -i s3pglh:sales:orders\ndataos-ctl lakehouse table snapshot rollback -i s3pglh:sales:orders --sid <snapshot-id>\n```\n\nMaintenance runs as **operations** that you submit from a small manifest:\n\n```yaml\nnamespace: sales\ntable: orders\noperation: EXPIRE_SNAPSHOTS\noptions:\n  older_than: \"<ISO-8601-timestamp>\"\n  retain_last: 1\n```\n\n```bash\ndataos-ctl lakehouse operation apply -n s3pglh -f ./expire-orders.yaml\ndataos-ctl lakehouse operation get -n s3pglh --status FAILED\n```\n\nThe supported operations are `COMPACT`, `COMPACT_DELETE_FILES`, `EXPIRE_SNAPSHOTS`, `REWRITE_MANIFESTS`, `DROP_TABLE`, `REMOVE_ORPHAN_FILES`, and `DELETE_FROM_DATASET`. The statuses are `QUEUED`, `RUNNING`, `COMPLETED`, and `FAILED`.\n\n> **Tip:** Set a maintenance schedule (snapshot expiry and compaction) for busy tables. Iceberg collects snapshots. If they grow without control, query planning becomes slow and storage becomes larger.\n\n### Governing the data inside\n\nResource permissions on the Lakehouse (`Can Edit`, `Can Manage Access`, `Can Use`) do **not** give access to its namespaces, tables, and views. The Data Admin structures and governs these from the **Manage Lakehouse** interface. Name namespaces by domain or product. Separate read from write, and restrict write to producing pipelines. Grant standard read access to roles. Let products read and write under an application user, not under a person.","sources":["https://v2.dataos.info/operate/data-admin/data-admin","https://v2.dataos.info/operate/data-admin/manage-lakehouse","https://v2.dataos.info/references/resources/lakehouse","https://v2.dataos.info/references/resources/lakehouse/architecture","https://v2.dataos.info/references/resources/lakehouse/create-a-lakehouse","https://v2.dataos.info/references/resources/lakehouse/create-a-lakehouse-depot","https://v2.dataos.info/references/resources/lakehouse/configurations","https://v2.dataos.info/references/resources/lakehouse/command-reference","https://v2.dataos.info/operate/data-admin/access-control","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Minerva Clusters, Projections and Volumes","body":"### Minerva: a Trino-based query layer on demand\n\nMinerva is a dynamic Resource. It provisions a Trino-compatible distributed SQL engine (a coordinator and workers) over the Depots that you declare. When Minerva is ready, the gateway registers it over the Trino protocol on port `7432`. Workbench and SQL clients see one catalog for each declared Depot. You manage Minerva with the generic Resource commands. There is no `minerva` command group.\n\n```yaml\nversion: v1alpha\ntype: minerva\nname: orders-minerva\nspec:\n  coordinator:\n    replicas: 1\n    resources:\n      requests: {cpu: \"1\", memory: \"1Gi\"}\n      limits: {cpu: \"2\", memory: \"4Gi\"}\n  worker:\n    replicas: 1\n    resources:\n      requests: {cpu: \"1\", memory: \"1Gi\"}\n      limits: {cpu: \"2\", memory: \"4Gi\"}\n  compute: ${MINERVA_COMPUTE_NAME}\n  runAsUser: ${RUN_AS_USER}\n  depots:\n    - address: ${DEPOT_ADDRESS}\n```\n\n```bash\ndataos-ctl resource apply -f resource-spec.yaml\ndataos-ctl resource get -t minerva -a\ndataos-ctl resource log -t minerva -n <name>\n```\n\nPlan around these operational facts:\n\n* **Fixed capacity.** Clusters do not autoscale. To grow a cluster, you must resize it manually and plan capacity. Dashboards and interactive users compete on a shared cluster.\n* **Not an ETL engine.** Large batch transformations belong in Spark-based processing or Vulcan, not in Minerva. Point reporting at curated, pre-aggregated datasets. Logical, nested, and cross-catalog views compute again on every access.\n* **Failure map.** If the Minerva domain is missing, creation fails. If Depots or Secrets are not valid or not accessible, catalog initialization fails. If Compute is configured incorrectly, services do not start.\n* **Least privilege.** Keep the `runAsUser` identity and the Depot Secret scopes minimal.\n\n> **Warning:** The July 2026 release made the default runtime permissions stricter. After that upgrade, restart existing `minerva` workloads so that they stop running on the old permission model.\n\n### Projections: runtime configuration without hardcoding\n\nProjections are the DataOS templating system. They inject environment variables, files, command arguments, and dictionary values into containers at runtime. The values come from Secrets, Depots, addresses, and the default DataOS context. With Projections, platform teams keep one Stack or Resource reusable across Tenants and environments.\n\n```yaml\nspec:\n  use:\n    projection:\n      secrets:\n        - id: \"database-credentials\"\n          contextAlias: \"db\"\n      projections:\n        envVars:\n          - key: \"DATABASE_URL\"\n            template: \"postgresql://{{ secrets['db'].username | base64_decode }}@{{ secrets['db'].host | base64_decode }}:5432/{{ secrets['db'].database | base64_decode }}\"\n          - key: \"TENANT_ID\"\n            template: \"{{ defaultProjections.dataOsTenantId }}\"\n```\n\nWhat an operator needs to know:\n\n* **Engine.** Liquid is the default `templateType`. The `none` type treats the value as static text. Go-template syntax with a leading dot is not supported. Every item uses `template`. There is no `value` field (`envVar template is required`).\n* **Levels.** A Stack-level `projection` applies to every job, Service, and Worker on that Stack. `spec.use.projection` applies to one workload. Both run. If the names clash, the workload value wins.\n* **Workflows.** Put `use.projection` under each DAG step (`spec.dag[].spec.use.projection`). At the top-level `spec`, DataOS silently drops it. Steps do not inherit projections from each other.\n* **Mounts.** DataOS stores the values in Kubernetes Secrets and then mounts them. Env vars mount through `envFrom.secretRef`. Files without a directory mount under `/etc/dataos/secret/`. The directories `/etc/dataos/config`, `/etc/dataos/secret`, and `/etc/dataos/work` are reserved. Use custom directories.\n* **Depot secrets.** If the output needs credential values, use `includeSecrets: true` with narrow `secretPurposes`. Otherwise, do not use it.\n* **Testing.** Before you deploy, render templates locally with `dataos develop use`. Then make sure that the full resources are valid with `dataos develop resource`.\n\n### Volumes: storage that outlives workloads\n\nA Volume provisions persistent block storage in the cloud on a specific Data Plane. Its lifecycle is independent of all workloads.\n\n```yaml\nname: orders-staging-vol\nversion: v2alpha\ntype: volume\nvolume:\n  size: 10Gi\n  type: disk          # only \"disk\" is supported\n  dataplane: ${DATAPLANE_NAME}\n```\n\n| Need | Use |\n| --- | --- |\n| Data must survive redeploys or be handed between stages | Standalone Volume mounted with `use.volumes` (Service, Worker, Workflow) |\n| Scratch space owned by one workload | Inline `disk` block (Service with `stateful: true`, or Worker) |\n\nKey behaviors:\n\n* Only **one pod at a time** can mount a Volume.\n* To resize a Volume in place, apply it again with a larger `size`.\n* A Volume is Tenant-scoped.\n* When you delete a Volume, its cloud disk is reclaimed within 30 days.\n\nMount a Volume by its system-generated **`volumeId`**, never by the resource name. Read the ID from `status.activeProperties.volumeId` in `dataos-ctl resource get -t volume -n <name> -d`. First delete the workloads that mount the Volume, then delete the Volume. When you delete a workload, DataOS never deletes a Volume that the workload mounted with `use.volumes`.\n\n> **Note:** To mount an existing Volume, the owner must give you permission to use it. Compute and Depots work the same way.","sources":["https://v2.dataos.info/references/resources/minerva","https://v2.dataos.info/references/resources/minerva/create-a-minerva-resource","https://v2.dataos.info/references/resources/minerva/troubleshoot-and-monitor","https://v2.dataos.info/references/resources/minerva/limitations","https://v2.dataos.info/references/resources/projections","https://v2.dataos.info/references/resources/projections/how-projections-work","https://v2.dataos.info/references/resources/projections/best-practices","https://v2.dataos.info/references/resources/projections/troubleshooting","https://v2.dataos.info/references/resources/volume","https://v2.dataos.info/releasenotes/july-2026"]}],"lab":{"title":"Build the data foundation for orders-analytics","goal":"An `orders` Tenant with a dedicated Compute, a PostgreSQL Secret and Depot, and an S3-backed Lakehouse that uses `sparkCluster.resources`. Also, a completed snapshot-expiry operation and a Minerva Cluster that exposes the Lakehouse Depot.","duration":"90 min","prereqs":["Tenant Admin (or Data Admin) role in a sandbox Tenant, with the CLI initialized for that Tenant","`lakehouse-mruntime` listed as active by `dataos-ctl develop stack versions`","A dedicated PostgreSQL database for the Lakehouse metastore, an S3 bucket path, and source PostgreSQL credentials from your instructor","The Data Plane ID and node labels for your Compute, from your instructor"],"steps":["**Create a Compute.** Save this manifest as `orders-compute.yaml` and apply it:\n\n```yaml\nname: orders-compute\nversion: v2alpha\ntype: compute\ndescription: \"Compute for orders-analytics workloads\"\nspec:\n  dataplane: <DATAPLANE_ID>\n  nodeSelector:\n    dataos.io/purpose: <node-label-from-instructor>\n  nodePool:\n    labels:\n      dataos.io/purpose: <node-label-from-instructor>\n```\n\n```bash\ndataos-ctl resource apply -f orders-compute.yaml\ndataos-ctl resource get -t compute -n orders-compute -d\n```","**Self-grant use.** In the **Resource Catalog**, open `orders-compute` → **Access** → **Grant Permissions**. Grant yourself **Can Use**. DataOS audits the grant.","**Create the source Secret and Depot.** Use the PostgreSQL templates from *Add Depots & Secrets* (`postgres-cred.yaml`, `postgresdepot.yaml`). Replace every `<PLACEHOLDER>`. Apply the Secret before the Depot:\n\n```bash\ndataos-ctl resource apply -f postgres-cred.yaml\ndataos-ctl resource apply -f postgresdepot.yaml\ndataos-ctl resource get -t depot -n postgresdepot -d\n```","**Create the Lakehouse Secrets.** Apply `metastore-secret.yaml` (`lh-metastore-secret`) and `storage-secret.yaml` (`lh-storage-secret`) from *Manage Lakehouse*, and fill in the placeholders. Then, in the Resource Catalog, grant yourself **Can Use** on both Secrets.","**Apply the Lakehouse.** Start from the `s3pglh` manifest in *Manage Lakehouse*. Rename it `orderslh`, and set `compute: orders-compute`. Move the Spark server sizing under `sparkCluster.resources` (not `sparkCluster.server`). Then run:\n\n```bash\ndataos-ctl resource apply -f lakehouse.yaml\ndataos-ctl resource get -t lakehouse -n orderslh -d\ndataos-ctl resource get -t lakehouse -n orderslh -b\n```","**Explore the Lakehouse.** When the Lakehouse is healthy, list the namespaces. If your instructor loaded a sample table, also list its snapshots:\n\n```bash\ndataos-ctl lakehouse namespace list -n orderslh\ndataos-ctl lakehouse table snapshot list -i orderslh:<namespace>:<table>\n```","**Run a maintenance operation.** Create `expire.yaml` with `operation: EXPIRE_SNAPSHOTS` and your namespace and table. Set `older_than` to a timestamp from your instructor, and set `retain_last: 1`. Submit the operation and track it:\n\n```bash\ndataos-ctl lakehouse operation apply -n orderslh -f ./expire.yaml\ndataos-ctl lakehouse operation get -n orderslh --id <operation-id>\n```","**Create a Minerva Cluster.** Use the Minerva template with `compute: orders-compute` and `depots: - address: dataos://orderslh-depot?purpose=rw`. For now, set `runAsUser` to your own user ID. Module e3 replaces it with an application user. Apply the cluster and list it:\n\n```bash\ndataos-ctl resource apply -f orders-minerva.yaml\ndataos-ctl resource get -t minerva -a\n```","**Query it.** In **Workbench**, start a **New bench** and select your Minerva Cluster. Make sure that the Lakehouse Depot appears as a catalog."],"verify":"- `dataos-ctl resource get -t compute -n orders-compute -d` and `dataos-ctl resource get -t depot -n postgresdepot -d` report active with no error message.\n- `dataos-ctl resource get -t lakehouse -n orderslh -d` shows healthy components. The auto-created `orderslh-depot` appears in `dataos-ctl resource get -t depot`.\n- Your Lakehouse manifest has no CPU or memory under `sparkCluster.server`.\n- `dataos-ctl lakehouse operation get -n orderslh --id <operation-id>` reports `COMPLETED`, or `FAILED` with a reason that you can explain.\n- Workbench lists the Lakehouse catalog through your Minerva Cluster.","sources":["https://v2.dataos.info/operate/tenant-admin/create-compute","https://v2.dataos.info/operate/tenant-admin/add-data-sources-and-secrets","https://v2.dataos.info/operate/data-admin/manage-lakehouse","https://v2.dataos.info/references/resources/lakehouse/create-a-lakehouse","https://v2.dataos.info/references/resources/lakehouse/command-reference","https://v2.dataos.info/references/resources/minerva/create-a-minerva-resource","https://v2.dataos.info/references/resources/minerva","https://v2.dataos.info/releasenotes/september-2026"]},"takeaways":["`nodeSelector` decides where Pods land. Keep selectors disjoint, taint premium pools, and use `aliases` before you rename a Compute.","Secrets need `layer: user` and string values. Depots reference them as `<tenant>:<secret-name>`. To rotate credentials, apply only the Secret again.","Every Lakehouse needs its own PostgreSQL metastore database and an active `lakehouse-mruntime`. The September 2026 release moved Spark sizing under `sparkCluster.resources`.","Lakehouse resource permissions do not give data access. The Data Admin governs namespaces, tables, and views separately.","Minerva capacity is fixed, and Minerva is not an ETL engine. Restart clusters after permission-model upgrades.","Put Workflow projections under each DAG step. Mount Volumes by `volumeId`, not by name."],"quiz":[{"q":"After you add a second Compute for GPU work, cheap batch jobs continue to land on the expensive GPU nodes. Both Computes use `nodeSelector: {dataos.io/purpose: runnable}`. What is the documented fix?","options":["Increase `replicas` on the GPU Compute","Make the selectors disjoint and add `nodePool.taints` to the GPU pool so only tolerating workloads schedule there","Move the GPU label into `nodePool.labels` only","Add the GPU Compute name to `spec.aliases` of the batch Compute"],"answer":1,"explain":"Shared selectors cause wrong placement. Disjoint selectors and a taint protect premium pools. `nodePool.labels` only describes the pool and does not filter placement.","source":"https://v2.dataos.info/operate/tenant-admin/create-compute"},{"q":"The source rotates a database password. Twelve workloads reference the PostgreSQL Depot. What is the minimum change?","options":["Re-apply the Depot manifest so it re-reads the credentials","Update and re-apply the Secret manifest. The Depot reads the Secret at runtime","Delete and recreate both Secret and Depot","Edit each workload's manifest with the new password"],"answer":1,"explain":"To rotate, apply the Secret again. The Depot does not need re-applying, and workloads reference the Depot, not credentials. You cannot undo the deletion of a Secret, and the deletion breaks the Resources that depend on it.","source":"https://v2.dataos.info/operate/tenant-admin/add-data-sources-and-secrets"},{"q":"Two Lakehouses, one on S3 and one on ABFSS, were pointed at the same PostgreSQL database to save cost. Metadata operations now fail intermittently. What is wrong?","options":["Each Lakehouse must use its own dedicated metastore database. Sharing mixes metadata paths","PostgreSQL must run on the same cloud as the object storage","ABFSS Lakehouses cannot use an `iceberg-jdbc-catalog` metastore","The two Lakehouses need different `logLevel` values"],"answer":0,"explain":"The docs require one dedicated database per Lakehouse. Multiple databases on one server are acceptable. The docs call a shared database the most common Lakehouse failure.","source":"https://v2.dataos.info/operate/data-admin/manage-lakehouse"},{"q":"A Workflow defines `use.projection` directly under its top-level `spec`. It validates, but the step's environment variables are missing at runtime. Why?","options":["Projections only work on Services","The projection must use `templateType: none`","The Workflow top-level `spec` has no `use` field, so the projection is silently dropped. It belongs under `spec.dag[].spec.use.projection`","Environment variables must be declared with `value` instead of `template`"],"answer":2,"explain":"Workflow projections must be placed under each DAG step. At the top level, DataOS drops them without an error. There is no `value` field. If you use it, you get `envVar template is required`.","source":"https://v2.dataos.info/references/resources/projections/troubleshooting"},{"q":"A Service that uses `use.volumes` fails at deploy time with the resource name of the Volume in `id`. The Volume itself is active. What must the operator do?","options":["Recreate the Volume with `type: block`","Switch the Service to an inline `disk` block","Grant the Service `Can Edit` on the Volume","Read `status.activeProperties.volumeId` from `dataos-ctl resource get -t volume -n <name> -d` and use that value as `id`"],"answer":3,"explain":"`use.volumes[].id` requires the system-generated `volumeId`, not the name. An inline disk loses persistence across workloads, and `disk` is the only supported type.","source":"https://v2.dataos.info/references/resources/volume"}]},{"id":"e3","title":"Access Control in Depth","track":"Platform Operations & Governance","duration":"~2 h 30 min","objectives":["Explain how OIDC/Dex authentication, IdP group mapping, and the five authorization layers work together","Map each Tenant role to what it can create, what it can grant, and what it must request","Find the complete set of `Can Use` grants for any Resource from its dependency chain","Design production runtime identities with application users and Run As User grants from an Operator","Issue, scope, and rotate API tokens safely"],"lessons":[{"title":"Identity and the layered authorization model","body":"### Two questions, answered separately\n\n**Authentication** answers *who is this user or application?* **Authorization** answers *what can this identity do?* DataOS gives the first question to the identity provider (IdP) of the customer. DataOS answers the second question itself, in the correct Tenant context.\n\n### Authentication: IdP first, tokens for machines\n\nDataOS authenticates people through **OpenID Connect (OIDC)** with SSO:\n\n* **OIDC-native IdPs** such as Microsoft Entra ID and Keycloak connect through the standard OIDC flow.\n* **LDAP- or SAML-based systems** connect through **Dex**. Dex federates them as an OIDC provider and translates the response into a token that DataOS accepts.\n\nApplications and APIs are different. They must use a **DataOS API token**. Tokens that the enterprise IdP issues do not work against DataOS APIs.\n\n### IdP groups map to Instance roles only\n\nDuring the IdP configuration, the customer decides which IdP groups DataOS uses for **Instance-level** access. Group membership arrives as identity claims and maps to the two Instance roles:\n\n| Instance role | Grants |\n| --- | --- |\n| `User` | Sign in to DataOS, with no Instance-level administrative privilege and no access inside any Tenant |\n| `Operator` | Operate and administer the Instance through Instance Admin: provision the Data Plane and Compute, create and delete Tenants, invite users, assign Tenant Admins |\n\nThat mapping **never** assigns Tenant roles or Resource permissions. Tenant Admins assign Tenant roles inside DataOS after the user identity exists. Resource permissions, grants, and governed data policies are also managed inside DataOS. The docs also state that DataOS assigns Instance roles at Instance creation. You cannot change them later. For this reason, the IdP group design is a decision that you must get right on day one.\n\n> **Note:** Data Steward (introduced in September 2026) is a DataOS-level role for editing business glossary descriptions. It is a DataOS-level role because DataOS maintains the glossary globally, not per Tenant. DataOS does not grant it by default. Users request it from an Operator.\n\n### Authorization: five layers, evaluated independently\n\nAfter sign-in, DataOS evaluates a request against these layers:\n\n1. **Instance roles**: `User`, `Operator`.\n2. **Tenant roles**: Tenant Admin, Data Admin, Data Developer, Data Consumer. DataOS creates them with each Tenant, and they carry its name (for example, `analytics Tenant Admin`).\n3. **Resource permissions**: `Can Use [Resource]`, `Can Edit`, `Can Manage Access`.\n4. **Grants**: explicit grants such as the Run As User use-case.\n5. **Policies**: governed data policies such as masking and row filters. The semantic layer applies them **at query time** for the identity that sends the request.\n\nA role at one level never automatically grants access at another level. If the required access is not explicitly present, DataOS denies the request. A successful sign-in does not grant access to Tenants, Resources, Data Products, workloads, or data.\n\n### Tenant roles in practice\n\n| Tenant role | Can create Resources | Manages access on | Notable limits |\n| --- | --- | --- | --- |\n| Tenant Admin | Yes | Any Resource in the Tenant | No silent `Can Use` or `Can Edit` on Resources of other users. Cannot act outside the Tenant. Does not inherit Data Admin capabilities such as exporting data from DataOS applications or managing metadata directly |\n| Data Admin | Yes | Any Resource in the Tenant | Owns Lakehouse structure and data governance. Cannot invite users, assign roles, create domains, or release quarantined Resources |\n| Data Developer | Yes | Only Resources they created | Must request `Can Use` on shared Compute, Depots, Secrets, and Clusters |\n| Data Consumer | No | Nothing | Uses permitted products and apps. Needs `Can Use Cluster` to query through Workbench |\n\n> **Warning:** All Tenant roles except Data Consumer *can* create Resources, but do not use this as an operating practice. The Tenant Admin or a designated Data Admin must create and govern sensitive or shared Resources (Compute, Depots, Secrets, Clusters).\n\n### Who does what in access administration\n\n| Task | Done by | Where |\n| --- | --- | --- |\n| Map IdP groups to Instance roles | Customer IdP admin with the Operator | IdP configuration |\n| Create Tenants, assign Tenant Admins | Operator | Instance Admin → Tenant **Access** |\n| Invite users and assign Tenant roles | Tenant Admin | Tenant Admin application |\n| Grant `Can Use` / `Can Edit` / `Can Manage Access` | Anyone who holds `Can Manage Access` on the Resource | Resource Catalog → Resource → **Access** |\n| Grant the Run As User use-case | Operator only | Bifrost → target identity → **Grants** |\n| Masking and row filters | Data Product Developer (product policies), Data Admin (Lakehouse table access) | Product policies, Manage Lakehouse |\n\n### Audit\n\nDataOS logs every allow or deny decision with user, action, resource, decision, reason, and timestamp. You can query the trail from the UI. Every grant is auditable, including the self-grant of a Tenant Admin. For the change history of a user from the CLI, the Operator command map lists `dataos-ctl user changes get --id <user-id>`.\n","sources":["https://v2.dataos.info/operate/authentication-and-authorization","https://v2.dataos.info/operate/access-control","https://v2.dataos.info/operate/access-control/roles-and-permissions","https://v2.dataos.info/operate/tenant-admin/tenant-admin","https://v2.dataos.info/operate/data-admin/data-admin","https://v2.dataos.info/operate/data-steward/overview","https://v2.dataos.info/releasenotes/june-2026","https://v2.dataos.info/operate/cli"]},{"title":"Resource-level permissions and dependency chains","body":"### Three permissions, one rule\n\nResource permissions apply to an individual Resource:\n\n| Permission | Lets the grantee |\n| --- | --- |\n| `Can Use [Resource]` | Reference or consume the Resource (for example, set it in `spec.compute`, read through a Depot, authenticate with a Secret, query through a Cluster) |\n| `Can Edit` | Update or delete the Resource |\n| `Can Manage Access` | Grant or revoke access on it. Does **not** include use or edit |\n\nThe rule that drives everything: **creating a Resource gives you `Can Edit` and `Can Manage Access`, never `Can Use`.** A Tenant Admin who creates a Compute must still grant themselves `Can Use` before they run anything on it. DataOS audits that self-grant like any other grant.\n\n`Can Use` exists only on Resources that other Resources consume, such as Compute, Depot, Secret, Cluster, Lakehouse, Data Product, and App. **Vulcan, Nilus, Service, Workflow, and Worker carry only `Can Edit` and `Can Manage Access`.** The permissions on each of their dependencies control what they reach at runtime.\n\n### Dependency chains by Resource type\n\nTo create a Resource, you need `Can Use` on everything that it depends on. DataOS evaluates each dependency separately.\n\n| Resource | Created by | Needs `Can Use` on | Has `Can Use` itself? |\n| --- | --- | --- | --- |\n| Compute | Tenant Admin, Data Admin, Data Developer | Nothing | Yes (reference in `spec.compute`) |\n| Secret | Same | Nothing | Yes (authenticate to the external system) |\n| Depot | Same | The Secret it links | Yes |\n| Lakehouse | Same | Compute, Secret, Depot | Yes |\n| Minerva Cluster | Same | Compute, each Depot, **and the Secret behind each Depot** | Yes (query through it in Workbench) |\n| Nilus | Same | Compute, Depot, and the Secret of the Depot | No |\n| Vulcan | Same | Compute | No |\n| Service, Worker, Workflow | Same | Compute | No |\n\n> **Warning:** The linked Secret is the grant that people forget. `Can Use Depot` does not include `Can Use Secret`. If you grant the Depot but not its Secret, the read fails at runtime. The error can look unrelated.\n\n### Who can grant\n\nAnyone who holds `Can Manage Access` on a Resource can grant on it. Owners hold it on what they create. **Tenant Admins and Data Admins hold it on every Resource in the Tenant**, including Resources that they did not create. For this reason, an admin can recover a Resource whose creator left: grant yourself `Can Edit`, then update or delete the Resource. Data Developers cannot self-grant on shared Resources. They request access from a Tenant Admin or Data Admin.\n\n### Granting from the Resource Catalog\n\n1. Open the **Resource Catalog** and search for the Resource.\n2. Open it and go to the **Access** tab.\n3. Select **Grant Permissions**.\n4. Under **Grant to**, choose **Users** or **Roles**, then select the target.\n5. Choose the permission and select **Grant**.\n\nYou revoke access on the same tab. After you revoke `Can Use`, new workloads cannot reference the Resource. As part of the change, migrate or stop the running workloads.\n\n### Roles or individuals?\n\nA grant to a **Tenant Role** (available since August 2026) covers everyone who holds the role, including future members. If someone leaves the role, the grant removes their access automatically. The Tenant Admin governance guide recommends roles for standard access, for example every Data Developer who uses a shared development Compute. It recommends individual grants for one-off access that you review periodically. The August 2026 release note adds a caution for **production**: prefer individual grants there to limit the blast radius of any single grant. A defensible expert design uses role grants in non-production Tenants. In production, it uses individual grants or, better, runtime-identity grants (next lesson).\n\n### Worked recipe: a developer building orders-analytics\n\nThe product runs on a shared Compute, reads a Snowflake Depot, and queries through a Minerva Cluster. The developer holds the Data Developer role and nothing else. As Tenant Admin, give these grants:\n\n| Dependency | Grant |\n| --- | --- |\n| Shared Compute | `Can Use Compute` |\n| Snowflake Depot | `Can Use Depot` |\n| Secret linked to that Depot | `Can Use Secret` |\n| Minerva Cluster | `Can Use Cluster` |\n\nFour dependencies, four grants. Each grant covers one Resource and one action.\n\n### Diagnosing access failures\n\n| Symptom | Likely cause |\n| --- | --- |\n| Depot reads fail although `Can Use Depot` is granted | Linked Secret not granted |\n| Cannot run on the shared Compute | `Can Use Compute` missing. Owning or editing never implies use |\n| Can see data but cannot query in Workbench | `Can Use Cluster` missing |\n| Granted, still blocked | Wrong level (`Can Manage Access` or `Can Edit` instead of `Can Use`) or wrong identity |\n| Cannot grant at all | Resource is in another Tenant, or you do not have `Can Manage Access` |\n| Product breaks after the developer changes teams | It runs on the personal grants of the developer. Move it to a runtime identity |\n\n### Lakehouse: two separate layers\n\nPermissions on the Lakehouse **resource** control who can update it or grant on it. They do not grant access to its namespaces, tables, or views. The Data Admin governs those from Manage Lakehouse. Since June 2026, Lakehouse access management (Early Preview) supports read and write control at Lakehouse, namespace, table, or view level. The permissions follow a downward hierarchy.\n","sources":["https://v2.dataos.info/operate/access-control/roles-and-permissions","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/compute-access-control","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/depot-access-control","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/secret-access-control","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/lakehouse-access-control","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/minerva-cluster-access-control","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/nilus-access-control","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/vulcan-access-control","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/service-access-control","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/worker-access-control","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/workflow-access-control","https://v2.dataos.info/operate/tenant-admin/governance","https://v2.dataos.info/operate/recipes/how-to-give-access","https://v2.dataos.info/releasenotes/august-2026","https://v2.dataos.info/releasenotes/june-2026"]},{"title":"Runtime identity: application users, runAsUser and API tokens","body":"### Three identities on every Resource\n\nWhen you apply a Resource, DataOS tracks three identities separately:\n\n| Identity | Who it is | Controls |\n| --- | --- | --- |\n| **owner** | Who the Resource belongs to | Ownership. Deletion depends on this |\n| **submitter** | Who ran the apply command | Who deployed it |\n| **runAsUser** | Whose identity it executes under | Which permissions and policies apply **at runtime** |\n\n`runAsUser` changes only the third identity. If you submit a Resource with `runAsUser` set to another user, you stay its owner and you can still delete it.\n\n### runAsUser is explicit consent, granted by an Operator\n\nYou can set `runAsUser` only after an **Operator** grants the **Run As User** use-case in **Bifrost**. Most people get the direction of that grant wrong:\n\n* The Operator makes the grant on the **target identity's profile** (the identity that you will run as).\n* **Your user ID is the subject** of the grant.\n* The grant authorizes you, and only you, to run Resources as that one identity. Without it, DataOS rejects a manifest that sets `runAsUser`.\n\nSteps for the Operator: go to **Bifrost → Users → open the application user → Grants → Grant Use-Case**. Search for **run as** and select **Run As User**. Enter the grantee in `userId`, and select **Grant**. To revoke, open the `run-as-user` entry on the same Grants tab and delete the subject tag. After revocation, any Resource that uses that `runAsUser` **fails at runtime**. For this reason, make an inventory of the dependants first.\n\n### Application users: identities that outlive people\n\nAn application user is a non-personal identity. You provision it with the roles and permissions that its purpose needs. A person who must act as it receives a Run As User grant against it, instead of individual grants on every Resource. Only an Operator can create users, including application users:\n\n```bash\ndataos-ctl user create -n 'Data Product Developer' -t application -u dpdeveloper -e dpdeveloper@tmdc.io\ndataos-ctl user get -i dpdeveloper\n```\n\nThe new user appears in Bifrost under **Users** (type **application**) with only its identity tag. Give it a Tenant role in its Bifrost **Tags** tab (**Add Role**). If necessary, add use-cases from the **Grants** tab. Grant Resource permissions from the **Access** tab of each Resource in the Resource Catalog. A Tenant Admin can do that part.\n\n### Recipe: a runtime identity for orders-analytics\n\n1. **Create** the application user, for example `orders-analytics-app` (Operator).\n2. **Grant it every runtime dependency** (Tenant Admin): `Can Use Compute`, `Can Use Depot`, `Can Use Secret` on the linked Secret of the Depot, and `Can Use Cluster`. Grant them to the application user, not to a person.\n3. **Authorize the developer** (Operator): grant Run As User on the profile of the application user, with the developer as subject.\n4. **Reference it** (Data Developer):\n\n```yaml\nspec:\n  runAsUser: orders-analytics-app\n```\n\n5. **Deploy and verify.** Remove the personal `Can Use` grants of the developer. Then make sure that the running product continues to work.\n\nThe same pattern applies to Nilus, Vulcan, Minerva, and the mandatory `spec.runAsUser` of the Lakehouse. In general, workload Resources are expected to run under an application identity, not a personal one.\n\n> **Tip:** Treat application users like production credentials. Use one per product or pipeline, name it after what it represents, and give it least-privilege grants. Keep a record of every Run As User grant. The Operator governance runbook requires a periodic review of delegated identities. The review makes sure that each identity is still required, approved, and owned.\n\n### API tokens: credentials, not identities\n\nExternal clients authenticate with **DataOS API tokens**. These clients include REST APIs, BI tools, SQL clients, AI and MCP clients, and the CLI on a bastion host. DataOS issues a token to a specific user or service account. The token can only do what that identity has permission to do. Requests beyond that return `403 Forbidden`.\n\n```bash\ndataos-ctl user apikey create --name ci-pipeline --duration 24h\ndataos-ctl user apikey delete --name ci-pipeline\n```\n\nYou can also create tokens from **Profile → API Tokens** in DataOS Home. Since September 2026, you can also create them through a platform API for automation. Key properties:\n\n* DataOS shows the value **once**. Store it securely.\n* Every token **expires**. To rotate a token, you create a new token and replace the old one. You do not extend it.\n* A token works across every interface of the Instance where you created it, and **only** that Instance.\n* By default, users can create tokens only for themselves. A token for another user needs a separate, elevated permission.\n* Pass it as `Authorization: Bearer <dataos-api-token>`. MySQL-protocol clients use it as the password.\n* You cannot use it to log in to the DataOS UI.\n\nThe Data Plane runbook is the standard example of good hygiene. A dedicated application user owns the deployment, and the runbook issues a short-lived key (`-d 24h`) for that user, never a personal key.\n\n> **Note:** Since August 2026, MCP clients can connect through OAuth with platform sign-in instead of long-lived tokens. This works on an Instance that has OAuth enabled. Prefer OAuth for people, and keep tokens for automation.\n","sources":["https://v2.dataos.info/operate/access-control/roles-and-permissions/runasuser-permissions","https://v2.dataos.info/operate/access-control/roles-and-permissions/runasuser-permissions/create-an-application-user","https://v2.dataos.info/operate/access-control/roles-and-permissions/runasuser-permissions/grant-permissions","https://v2.dataos.info/operate/recipes/how-to-set-a-data-products-runtime-identity","https://v2.dataos.info/operate/dataos-operator/governance","https://v2.dataos.info/references/key-concepts/api-tokens","https://v2.dataos.info/operate/dataos-operator/provision-data-plane/aws","https://v2.dataos.info/releasenotes/september-2026","https://v2.dataos.info/releasenotes/august-2026"]}],"lab":{"title":"Implement the orders-analytics access model","goal":"A documented access matrix for the orders Tenant and a working runtime identity. The identity is an application user that holds exactly the required `Can Use` grants. An Operator grants Run As User on it to one developer. A Minerva Cluster runs under that identity, and the developer has a scoped, short-lived API token.","duration":"75 min","prereqs":["The resources from the e2 lab (`orders-compute`, `postgresdepot`, `postgres-cred`, `orders-minerva`) or equivalents","Operator access (for user creation and Run As User), or an instructor who holds it and works with you","Tenant Admin role in the orders Tenant","A second sandbox user who acts as the Data Developer"],"steps":["**Draw the access matrix.** For each persona, list the Tenant role, the Resources that it can create, and each `Can Use` grant that it needs. The personas are Tenant Admin, Data Admin, Data Developer, Data Consumer, and the runtime identity of the product. Use the dependency table in lesson 2 to find the grants. For Minerva, include the linked Secret of the Depot.","**Create the application user** (Operator):\n\n```bash\ndataos-ctl user create -n 'Orders Analytics App' -t application -u orders-analytics-app -e <app-user-email>\ndataos-ctl user get -i orders-analytics-app\n```","**Give it a Tenant role.** In **Bifrost → Users →** `orders-analytics-app` **→ Tags**, select **Add Role**. Add the Data Developer role for the orders Tenant. Make sure that the role tag appears next to the identity tag.","**Grant runtime dependencies to the application user** (Tenant Admin). In the **Resource Catalog**, open each of `orders-compute`, `postgresdepot`, `postgres-cred`, and `orderslh-depot` (and its storage Secret). For each one, open **Access → Grant Permissions → Users**. Select `orders-analytics-app` and grant **Can Use**.","**Authorize the developer** (Operator). In **Bifrost → Users →** `orders-analytics-app` **→ Grants → Grant Use-Case**, select **Run As User**. Enter the user ID of the developer in `userId`, and select **Grant**.","**Switch the Minerva Cluster to the runtime identity.** As the developer, edit `orders-minerva.yaml` and set `spec.runAsUser: orders-analytics-app`. Then apply it again:\n\n```bash\ndataos-ctl resource apply -f orders-minerva.yaml\ndataos-ctl resource get -t minerva -a\n```","**Negative test.** Ask a third user with **no** Run As User grant to apply a copy of the manifest. The copy uses the same `runAsUser`. Record the rejection.","**Give consumers query access.** Grant **Can Use** on `orders-minerva` to the Data Consumer **role** (non-production). In your matrix, record how you will handle the same grant in production. Cite the August 2026 guidance.","**Issue a short-lived token for CI** as the developer:\n\n```bash\ndataos-ctl user apikey create --name orders-ci --duration 24h\n```\n\nStore the value securely. DataOS shows it only once.","**Audit.** Review the history of the developer and record what changed:\n\n```bash\ndataos-ctl user changes get --id <developer-user-id>\n```"],"verify":"- `dataos-ctl user get -i orders-analytics-app` shows `TYPE` `application`.\n- The **Access** tab of each dependency lists `orders-analytics-app` with **Can Use**. No tab lists it with `Can Edit`, unless your matrix justifies it.\n- The developer applies again with `runAsUser: orders-analytics-app`, and the apply succeeds. The identical apply by the third user is rejected.\n- Workbench queries through `orders-minerva` still work after you remove the personal `Can Use` grants of the developer on the Depot and Secret.\n- The access matrix names four grants for the developer at build time (Compute, Depot, linked Secret, Cluster). It explains the choice between role and individual grants for production.","sources":["https://v2.dataos.info/operate/access-control/roles-and-permissions","https://v2.dataos.info/operate/recipes/how-to-give-access","https://v2.dataos.info/operate/recipes/how-to-set-a-data-products-runtime-identity","https://v2.dataos.info/operate/access-control/roles-and-permissions/runasuser-permissions/create-an-application-user","https://v2.dataos.info/operate/access-control/roles-and-permissions/runasuser-permissions/grant-permissions","https://v2.dataos.info/references/key-concepts/api-tokens","https://v2.dataos.info/releasenotes/august-2026"]},"takeaways":["IdP groups map only to the Instance roles `User` and `Operator`. Tenant roles, Resource permissions, grants, and policies are managed inside DataOS.","Creating a Resource gives you `Can Edit` and `Can Manage Access`, never `Can Use`. Every dependency needs its own `Can Use`, including the linked Secret of a Depot.","Vulcan, Nilus, Service, Workflow, and Worker have no `Can Use`. Their runtime reach comes from their dependencies.","Only an Operator can grant Run As User. The grant goes on the profile of the target identity, with the grantee as subject. Revoking it breaks running Resources.","Production products must run under an application user that holds the grants, not under the personal access of a developer.","API tokens inherit the permissions of their owner. They expire, they work on one Instance only, and DataOS shows them only once."],"quiz":[{"q":"A security architect proposes to map the IdP group `orders-devs` directly to the Data Developer role of the orders Tenant. What does the documentation say?","options":["This is the recommended pattern for large estates","IdP group mapping controls only Instance-level roles (`User`, `Operator`). Tenant Admins assign Tenant roles inside DataOS","It works only with OIDC-native IdPs, not with Dex","It requires the Data Steward role"],"answer":1,"explain":"The authentication page states that group mapping does not assign Tenant roles or Resource permissions. Dex versus OIDC-native changes only how the IdP connects.","source":"https://v2.dataos.info/operate/authentication-and-authorization"},{"q":"A Tenant Admin created `analytics-compute` yesterday. Today, their Vulcan deployment fails because it cannot use that Compute. What is the cause?","options":["Tenant Admins cannot reference Compute in Vulcan manifests","An Operator must approve Compute that the CLI creates","Creating a Resource grants `Can Edit` and `Can Manage Access` but not `Can Use`. They must grant themselves `Can Use Compute`","Vulcan needs `Can Use Vulcan` as well"],"answer":2,"explain":"Owners never get `Can Use` automatically and must grant it to themselves. DataOS audits that grant. Vulcan resources have no `Can Use` permission.","source":"https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/compute-access-control"},{"q":"A developer with `Can Use` on a Compute and on a Snowflake Depot creates a Minerva Cluster that exposes that Depot. Catalog initialization fails. Which grant is most likely missing?","options":["`Can Use Secret` on the Secret linked to the Depot","`Can Edit` on the Depot","`Can Manage Access` on the Compute","`Can Use Vulcan`"],"answer":0,"explain":"Minerva needs Compute, each Depot, and the Secret behind each Depot. Use of a Depot does not include its Secret. Edit or manage-access permissions never give use.","source":"https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/minerva-cluster-access-control"},{"q":"A developer's manifest sets `runAsUser: orders-analytics-app`, and DataOS rejects it. The application user already holds every necessary `Can Use`. Where must the fix be made?","options":["On the developer's own Bifrost profile, adding a Run As User use-case for themselves","In the Resource Catalog, granting the developer `Can Manage Access` on the application user","By an Operator in Bifrost on `orders-analytics-app`'s Grants tab, granting Run As User with the developer's user ID as subject","By the Tenant Admin assigning the developer the Tenant Admin role"],"answer":2,"explain":"The grant lives on the profile of the target identity, with the grantee as subject. Only an Operator can make it. A common mistake is to put it on the profile of the developer.","source":"https://v2.dataos.info/operate/access-control/roles-and-permissions/runasuser-permissions/grant-permissions"},{"q":"A CI job uses an API token that a developer created. The developer then lost `Can Use Cluster`. The job now returns `403 Forbidden`. What is the right long-term fix?","options":["Extend the token's duration","Give the token its own `Can Use Cluster` grant in the Resource Catalog","Generate a new token from the IdP instead","Issue the token for an application user that holds the required permissions, and rotate it before expiry"],"answer":3,"explain":"A token is a credential with no permissions of its own. It inherits the access of its user, and IdP tokens cannot call DataOS APIs. An application user for automation removes the dependency on a person.","source":"https://v2.dataos.info/references/key-concepts/api-tokens"}]},{"id":"e4","title":"Observability and Operations","track":"Platform Operations & Governance","duration":"~2 h","objectives":["Assign each monitoring signal to its layer and owning role","Interpret the Instance Status page and act on Healthy, Degraded, and Down","Use the operator and Tenant Admin CLI to sweep Data Plane, Compute, Stack, Resource, and Lakehouse health","Build an upgrade checklist from the June-September 2026 release notes","Triage incidents top-down from Instance to access, with the documented failure signatures"],"lessons":[{"title":"The observability model and Instance health","body":"### Three layers, each with an owner\n\nMonitoring in DataOS follows the access model: each role watches the layer that it owns.\n\n| Layer | Covers | Who watches |\n| --- | --- | --- |\n| DataOS Instance | Health of Instance services (the Instance Status page) | Operator |\n| Data Plane | Workload execution, Compute health, Tenant runtime services | Operator, Tenant Admin |\n| Data Product | Runs, schedules, quality, freshness, and usage of a deployed product | Developer (owns), Consumer (judges trust) |\n\nThe Data Admin adds a fourth, narrower view: Lakehouse health and usage. Escalation goes upward. A developer whose runs fail looks at their product first. The Tenant Admin looks at Compute and Stacks. The Operator owns the planes and the Instance services that everything else depends on.\n\n### The Instance Status page\n\nThe Instance Status page is the first stop for the Operator. It answers one question: **is the Instance healthy right now?** If you rule the Instance in or out early, teams do not debug Tenant configuration or workload code during a platform incident.\n\nOpen it from the home page (**Get help → Check status → Instance Status**) or directly:\n\n```\nhttps://<instance-name>.instance.dataos.cloud/status/\n```\n\nThe page runs active health checks against Instance endpoints. It reports availability, response time, certificate validity, and recent pass/fail history. A banner gives one verdict for everything (for example, **All Systems Operational**). Read the banner first. The page groups endpoints by capability:\n\n| Group | What it tells you |\n| --- | --- |\n| Control Plane and Data Plane Connectivity | Gateways, inbound API routing, and certificate management between planes |\n| Dataplane Readiness | Whether each attached Data Plane is registered and ready to accept workloads |\n| Data Access & Query | The query and data-access path |\n| Data Product Catalog & Discovery | Catalog services for finding and inspecting products |\n| Lakehouse Management | Lakehouse storage and metadata services |\n| Platform App & Developer APIs | APIs behind the applications and developer interfaces |\n| Platform Internals | Internal dependencies that users never call directly |\n| Resource Logs & Metrics | The logging and metrics pipeline that observability depends on |\n| Resource Orchestration | Services that schedule and run Resources |\n| Sign-In & Access Control | Authentication, sign-in, and authorization |\n\nYour page can show more or fewer groups. This depends on what is configured for the Instance.\n\n### Acting on a status\n\n| Status | Meaning | Action |\n| --- | --- | --- |\n| Healthy | The check passed within its threshold | Nothing |\n| Degraded | Responds, but slowly or intermittently | Look at what changed on the Instance recently. Then inspect the logs of that service |\n| Down | Consecutive checks failed | Treat it as an Instance incident and follow your runbook. If it does not recover, escalate |\n\nLook at the page at these times:\n\n* **at the start of the day**\n* **after any Instance change** (upgrade or configuration)\n* **when a user reports errors or slowness**, before you investigate Tenants or workloads\n* **when you raise an incident**, to record what failed and for how long\n\n> **Note:** The status page covers Instance services only. You watch Data Plane workload and Compute health separately, through the **Operations** application and Data Plane observability. Are Computes healthy? Are workloads scheduling? Are Tenant runtime services up? Use those signals to make sure that the Data Plane has capacity **before attaching more Tenants**.\n\n### Tenant readiness as a monitoring baseline\n\nThe Tenant readiness checklist is also the health baseline for a Tenant in operation. A Tenant is healthy while these statements stay true:\n\n* The Data Plane and at least one Compute are attached and active.\n* The mandatory state store Secrets are applied in the `system` Tenant.\n* The required Stacks are deployed and healthy.\n* A Tenant Admin holds the role and can sign in.\n* At least one data source Secret and Depot are active.\n* If the team needs a Lakehouse, the Lakehouse is provisioned.\n* A sanity Data Product deploys and runs without errors.\n\nAfter an upgrade, run the sanity product again. It is the cheapest end-to-end regression test that you have.\n\n### Metrics for your own dashboards\n\nSince September 2026, a platform API lets you query workload metrics from the Instance Prometheus with PromQL. Use it for custom dashboards, or for apps and AI agents that read runtime metrics directly. For Minerva, the docs list these signals to track: query throughput, p50 and p95 latency, error rate, coordinator and worker CPU and memory, restart frequency, and catalog initialization failures.\n","sources":["https://v2.dataos.info/operate/observability-model","https://v2.dataos.info/operate/instance-status","https://v2.dataos.info/operate/dataos-operator/monitoring","https://v2.dataos.info/operate/tenant-readiness","https://v2.dataos.info/references/resources/minerva/troubleshoot-and-monitor","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Role-specific monitoring and the operator CLI","body":"### The operator's daily CLI\n\nThe CLI (`dataos-ctl`) is the primary tool for administration at Instance and Tenant level. First, set up the context and make sure that it is correct:\n\n| Command | Purpose |\n| --- | --- |\n| `dataos-ctl init` / `dataos-ctl login` | Create a context (Instance FQDN and Tenant) and authenticate |\n| `dataos-ctl tenant list` / `dataos-ctl tenant select --name <context>` | Show and switch the active context |\n| `dataos-ctl health` | Make sure that the CLI can reach and authenticate against the Instance |\n| `dataos-ctl version --all` | Print CLI and Instance versions. Run it after upgrades |\n\n> **Tip:** Most \"the platform is broken\" reports from the CLI come from the wrong active context. Run `dataos-ctl tenant list` before anything destructive.\n\n### Operator scope: the Data Plane\n\n```bash\ndataos-ctl domain get                                  # Data Planes you created\ndataos-ctl domain get -a                               # all Data Planes\ndataos-ctl domain get -t dataplane -n <name> -v v1alpha -d   # detailed status\nkubectl logs -n <instance_name>-0-dsm dataos-manager-0 -f    # installer logs on the cluster\n```\n\nOn the bastion host, these commands use `USER_ID`, `DATAOS_FQDN`, `APIKEY`, and `DATAOS_TENANT_ID=system` instead of a logged-in session.\n\n### Tenant Admin scope: Compute, Stacks, Resources\n\nThe Tenant Admin watches the Resources that teams depend on.\n\n```bash\ndataos-ctl resource get -t compute                 # all Compute in the Tenant\ndataos-ctl resource get -t compute -n <name> -d    # scheduling messages for one\ndataos-ctl resource get -t stack -a                # Stack health\ndataos-ctl resource get -t depot\ndataos-ctl resource get -t secret\ndataos-ctl resource get -t workflow -a             # workflows across the Tenant\n```\n\nIf `get` reports a Resource as `active` with no errors, the Resource is healthy. A workload stuck in `Pending` usually has one of two causes. No nodes match the `nodeSelector` of the Compute, or the pool lacks capacity. Read the detailed status for the scheduling reason. These practices prevent incidents:\n\n* Review capacity **before** you onboard a team or a heavy workload.\n* If a developer reports failures, make sure that Compute and Stacks are healthy first. If the Tenant is healthy, send the developer to their product runs and logs. If the whole Tenant looks down, escalate to the Operator.\n* Review `Can Use` on shared Resources periodically.\n\n### Workload controls\n\nFor logs and lifecycle, use the Resource commands:\n\n```bash\ndataos-ctl resource log -t service -n orders-api -v v1 --tailLines 100\ndataos-ctl resource runtime stop -t service -n orders-api -v v1\ndataos-ctl resource runtime re-run -t <type> -n <name>\n```\n\n`runtime` supports `run`, `re-run`, `stop`, `pause`, `resume`, and `suspend` for runnable Resources (`service`, `worker`, `workflow`). Since September 2026, the stop, resume, and re-run lifecycle also covers Services and Workers, with no manifest changes. Before that release, it applied only to Workflows. Note the difference: `dataos-ctl resource runtime run` triggers an existing Resource. `dataos-ctl resource run` creates a Resource from a manifest and runs it.\n\n### Identity operations\n\n| Command | Use |\n| --- | --- |\n| `dataos-ctl user get --all` | List users |\n| `dataos-ctl user tag add --id <user-id> --tags roles:id:<role>` | Assign a role tag |\n| `dataos-ctl user tag delete --id <user-id> --tags roles:id:<role>` | Remove a role tag |\n| `dataos-ctl user apikey create --id <user-id> --name <key-name>` | Issue a key for a user (an elevated permission for a user other than yourself) |\n| `dataos-ctl user changes get --id <user-id>` | Review the audit history of a user |\n\n### Data Admin scope: the Lakehouse\n\nWatch four things:\n\n* **service health**: the catalog and query services. Their failures show in every product that touches the Lakehouse.\n* **metastore health**: the dedicated PostgreSQL database. Its problems look like tables that disappear or scans that fail.\n* **storage growth and table sprawl**: snapshots accumulate.\n* **usage**: what is queried, by whom, and what is abandoned.\n\n```bash\ndataos-ctl resource get -t lakehouse -a\ndataos-ctl resource get -t lakehouse -n <name> -d\ndataos-ctl lakehouse operation get -n <name> --status FAILED\n```\n\nIf the problem is Instance-wide and not specific to the Lakehouse, escalate to the Tenant Admin or Operator.\n\n### Developer scope, for context\n\nDevelopers own the runs and schedules, failures, quality and freshness, versioning, and Compute cost of their product. Consumers judge trust from published quality, freshness, lineage, and run history in Data Product Hub. Operators rarely act here. But if you know where the boundary is, you can route incidents to the right owner.\n\n> **Note:** Instance and Data Plane health are above the Tenant Admin. The health of an individual product is below. Each role watches its own layer and escalates upward.\n","sources":["https://v2.dataos.info/operate/cli","https://v2.dataos.info/operate/dataos-operator/monitoring","https://v2.dataos.info/operate/tenant-admin/monitoring","https://v2.dataos.info/operate/data-admin/monitoring","https://v2.dataos.info/references/interfaces/command-line-interface/resource","https://v2.dataos.info/references/interfaces/command-line-interface/user","https://v2.dataos.info/references/resources/lakehouse/command-reference","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Upgrade hygiene and the troubleshooting playbook","body":"### Reading release notes like an operator\n\nEach monthly release note has sections that operators can jump to: **Platform**, **Action required**, **Behavior changes**, and **Component version**. Before every upgrade, copy the items that are relevant to operators into a change ticket. Since DataOS 2.0 reached general availability in June 2026, the items in this table affect platform operations.\n\n| Release | Operator-relevant change | What to do |\n| --- | --- | --- |\n| July 2026 | Tenant domain configuration changed | The Operator applies the domains of existing Tenants again with the refreshed Tenant manifest from Modern (`dataos-ctl domain apply` with `INSTANCE_TENANT_ID` and `ENTITY_TENANT_ID` set) |\n| July 2026 | Stricter default runtime permissions for Apps | Add `workingDirs` entries for any directory that an App writes to. If you do not, the App can fail to start |\n| July 2026 | Same permission change reaches Minerva | Restart Minerva Clusters after the upgrade |\n| July 2026 | Tenant Admins can unquarantine their own Resources, and Data Plane provisioning is available in the UI | Update runbooks and escalation paths |\n| August 2026 | New Tenant definition: default Stacks, Secrets, and Vulcan secrets permission | Migrate Tenants created earlier. Contact SRE |\n| August 2026 | Spark operator image upgraded | After the upgrade, look at every Lakehouse. Redeploy any Lakehouse in error or quarantined state |\n| August 2026 | Resource permissions can be granted to Tenant Roles | Decide on a policy for role versus individual grants. Prefer individual grants in production |\n| September 2026 | In-place Data Plane credential rotation | Replace delete-and-recreate procedures with **Rotate credentials** |\n| September 2026 | `sparkCluster.server` sizing deprecated | Move CPU and memory to `sparkCluster.resources` |\n| September 2026 | `unquarantine` now requires a resource identifier | Update scripts that used an empty ID |\n| September 2026 | Data Plane delete moved under Manage with type-to-confirm. A Tenant named `system` is rejected | Update operator runbooks |\n\n### Upgrade hygiene checklist\n\n1. **Pin what you install.** Use the snapshot form of `artifactIdentifier` and the DataOS CLI version that the release notes name. An older CLI does not always support new manifest fields.\n2. **Baseline before.** Capture the Instance Status page, `dataos-ctl version --all`, `dataos-ctl domain get -a`, and `dataos-ctl resource get -t lakehouse -a`.\n3. **Work the Action required list** for every release between your current version and the target.\n4. **Verify after.** Make sure that the status page is healthy again, the Data Planes are active, and the Stacks are healthy. Make sure that no Lakehouse is quarantined, Minerva is restarted where required, and the sanity Data Product runs.\n5. **Record** what changed, for the next incident.\n\n### The troubleshooting playbook\n\nTriage top-down. At each layer, you either clear the layer or find that it owns the problem.\n\n**1. Instance.** Open the Instance Status page. **Down** means an Instance incident: follow the runbook and escalate. **Degraded** means that you look at recent Instance changes, then at the logs of that service. If the page shows Healthy, move down.\n\n**2. Data Plane.** Run `dataos-ctl domain get -a` and the detailed `domain get`. Typical signatures:\n\n| Symptom | Likely cause |\n| --- | --- |\n| Tunnel will not establish | Egress to the tunnel edge on `7844` blocked, DNS failing, or SNI filtering without `*.cftunnel.com` allowed |\n| Reconciliation stalls | Cluster API unreachable, missing IAM access entry or `aws-auth` binding (AWS), or kubeconfig identity without RBAC (Azure) |\n| Pods `Pending` | `dataos.io/purpose: core-kernel` label missing or node pool out of capacity |\n| Apply `forbidden` | You authenticate as yourself, or the application user is missing a role |\n\n**3. Tenant.** Is Compute active? Are Stacks healthy? A workload in `Pending` points to the selector or to capacity. Workloads on the wrong nodes point to overlapping selectors. A broken rename points to missing `aliases`.\n\n**4. Resource.** Read `dataos-ctl resource get -t <type> -n <name> -d`:\n\n| Symptom | Likely cause |\n| --- | --- |\n| Depot apply: `secret not found` | Secret missing, name or case mismatch, not Tenant-qualified, or in another Tenant |\n| Depot `pending` | Connection check not finished or failing. Read `status.message` |\n| Lakehouse cannot be created | Lakehouse domain missing (`dataos-ctl domain get -t lakehouse -a`) or `lakehouse-mruntime` absent |\n| Lakehouse catalog fails | Metastore Secret invalid or PostgreSQL unreachable. Use `-d` before you blame the credentials |\n| Lakehouse storage `403` | Storage Secret lacks bucket or container permissions. Use `-b` for pod-level errors |\n| Minerva creation fails | Minerva domain missing |\n| Projection env vars missing | Workflow projection placed at top-level `spec` |\n\n**5. Access.** If the error names a Resource, compare the grants with the dependency chain. Look for these causes:\n\n* A missing `Can Use Secret` behind a Depot\n* A missing `Can Use Cluster` for Workbench\n* The wrong level (`Can Manage Access` instead of `Can Use`)\n* A rejected `runAsUser` (no Operator grant on the target identity)\n* A product that broke when its developer changed teams (no runtime identity)\n\n> **Warning:** In production, do not \"fix\" access incidents with `Can Edit` grants or broad role grants. Restore the specific missing `Can Use`, preferably on the application user of the product, and record the change.\n\n### Post-incident\n\nWrite down the layer, the signal that identified it, and the fix. Add recurring signatures to your monitoring (for example, Minerva restart frequency or Lakehouse operations stuck in `FAILED`). Also add them to the next upgrade checklist.\n","sources":["https://v2.dataos.info/releasenotes/june-2026","https://v2.dataos.info/releasenotes/july-2026","https://v2.dataos.info/releasenotes/august-2026","https://v2.dataos.info/releasenotes/september-2026","https://v2.dataos.info/operate/dataos-operator/provision-data-plane/aws","https://v2.dataos.info/operate/dataos-operator/provision-data-plane/azure","https://v2.dataos.info/operate/tenant-admin/create-compute","https://v2.dataos.info/operate/tenant-admin/add-data-sources-and-secrets","https://v2.dataos.info/references/resources/lakehouse","https://v2.dataos.info/references/resources/minerva/troubleshoot-and-monitor","https://v2.dataos.info/references/resources/projections/troubleshooting","https://v2.dataos.info/operate/recipes/how-to-give-access","https://v2.dataos.info/operate/recipes/how-to-set-a-data-products-runtime-identity"]}],"lab":{"title":"Health sweep, upgrade checklist and incident drill","goal":"A repeatable health-sweep script for the orders Tenant, an upgrade change ticket for the July-September 2026 action items, and triage write-ups for three injected incidents.","duration":"60 min","prereqs":["Resources from the e2 and e3 labs","Operator or Tenant Admin access in the sandbox. Data Plane commands need Operator.","An instructor who injects incidents, or the three written scenarios in step 6"],"steps":["**Check the Instance.** Open `https://<instance-name>.instance.dataos.cloud/status/`. Record the banner verdict and any group that is not Healthy.","**Confirm CLI context and versions.**\n\n```bash\ndataos-ctl tenant list\ndataos-ctl health\ndataos-ctl version --all\n```","**Sweep the Data Plane** (Operator):\n\n```bash\ndataos-ctl domain get -a\ndataos-ctl domain get -t dataplane -n <dataplane-name> -v v1alpha -d\n```","**Sweep the Tenant.** Save the following commands as `orders-sweep.sh` and run the script:\n\n```bash\ndataos-ctl resource get -t compute\ndataos-ctl resource get -t compute -n orders-compute -d\ndataos-ctl resource get -t stack -a\ndataos-ctl resource get -t depot\ndataos-ctl resource get -t secret\ndataos-ctl resource get -t lakehouse -a\ndataos-ctl resource get -t minerva -a\ndataos-ctl lakehouse operation get -n orderslh --status FAILED\n```","**Write the upgrade ticket.** Use the July, August, and September 2026 release notes. List every Action required item that is relevant to operators. For each item, give the owning role, the command or UI path, and the verification step. Include the Minerva restart, the Lakehouse redeploy check, the `sparkCluster.resources` move, and the migration of pre-August Tenants.","**Triage three incidents.** For each incident, name the layer, the first command or page that you look at, the likely cause, and the fix. (a) *All new workflows in the orders Tenant sit in `Pending`. The Instance Status page is green.* (b) *A new Snowflake Depot fails to apply with `secret not found`, but the Secret exists.* (c) *The orders product failed overnight after its developer moved teams. Nothing else changed.*","**Read logs for one workload.** Select a Service or Workflow in the Tenant and run this command:\n\n```bash\ndataos-ctl resource log -t <type> -n <name> --tailLines 100\n```"],"verify":"- The sweep script runs end to end. Every Resource that you created in e2 and e3 reports `active`, or you wrote down the reason.\n- Your upgrade ticket lists at least eight dated action items. Each item has an owner and a verification step.\n- Triage answers: (a) Tenant layer, `dataos-ctl resource get -t compute -n <name> -d`. No nodes match `nodeSelector`, or the pool lacks capacity. (b) Resource layer. The `spec.secrets[].id` of the Depot is not `<tenant>:<secret-name>` with exact case, or the Secret is in another Tenant. (c) Access layer. The product ran on personal grants, so move it to an application user with `runAsUser`.","sources":["https://v2.dataos.info/operate/instance-status","https://v2.dataos.info/operate/cli","https://v2.dataos.info/operate/tenant-admin/monitoring","https://v2.dataos.info/operate/dataos-operator/monitoring","https://v2.dataos.info/releasenotes/july-2026","https://v2.dataos.info/releasenotes/august-2026","https://v2.dataos.info/releasenotes/september-2026","https://v2.dataos.info/operate/tenant-admin/add-data-sources-and-secrets","https://v2.dataos.info/operate/recipes/how-to-set-a-data-products-runtime-identity"]},"takeaways":["Instance, Data Plane, and Data Product are separate monitoring layers with separate owners. Escalate upward.","The Instance Status page rules the Instance in or out first. It does not cover Data Plane workloads.","`dataos-ctl resource get ... -d` is the universal first look at a failing Resource. `-b` adds build details.","Every upgrade starts with the Action required sections of each release note between the two versions. It ends with the sanity Data Product.","Triage top-down: Instance, Data Plane, Tenant, Resource, access."],"quiz":[{"q":"Users report slow Workbench queries. The Instance Status page shows **Data Access & Q
