it immediately without editing its manifest. Which command applies after the September 2026 release?","options":["`dataos-ctl resource delete -t service -n <name>`","`dataos-ctl resource runtime stop -t service -n <name> -v <version>`","Revoke `Can Use Compute` on the Service's Compute from the Resource Catalog","`dataos-ctl domain apply -l`"],"answer":1,"explain":"Runtime lifecycle commands now extend to Services and Workers. Delete removes the Resource. It does not pause it.","source":"https://v2.dataos.info/references/interfaces/command-line-interface/resource"},{"domain":"Observability and Operations","q":"After upgrading to the July 2026 release, which operator action is required for existing Tenants?","options":["Re-apply the Tenant domains using the refreshed Tenant manifest with `dataos-ctl domain apply`","Re-create every Tenant from Instance Admin","Rotate all Data Plane credentials","Delete and re-attach every Compute"],"answer":0,"explain":"The July release changed how Tenant domains are configured. An Operator applies existing Tenants again with the refreshed manifest. Credential rotation is a September feature, not a July requirement.","source":"https://v2.dataos.info/releasenotes/july-2026"},{"domain":"Observability and Operations","q":"Lakehouse queries fail with **403** or **Permission Denied** on write, while catalog reads succeed. Which check comes first?","options":["Increase `sherpa.replicas`","Recreate the PostgreSQL metastore","Check the Lakehouse domain with `dataos-ctl domain get -t lakehouse -a`","Verify the storage Secret has the required IAM permissions for the bucket, using `-b` to inspect pod-level errors"],"answer":3,"explain":"The Lakehouse troubleshooting table maps 403 on read/write to storage credentials that lack bucket or container permissions. A missing domain blocks creation, not writes.","source":"https://v2.dataos.info/references/resources/lakehouse"},{"domain":"Engine Mastery","q":"A team moving orders-analytics to Databricks wants to keep Vulcan state in the SQL warehouse to avoid running another database. What does the architect tell them?","options":["Set `vde: true` so state is stored in Unity Catalog","Store state in the Delta tables of the target catalog","Use DuckDB for state in production","State cannot be in the SQL warehouse. Databricks requires an external Postgres `state_connection`, for both local development and production"],"answer":3,"explain":"The Databricks guide states that plans, snapshots and intervals cannot be in the SQL warehouse, and that an external Postgres state store is mandatory. DuckDB is a local-only state option on other engines.","source":"https://v2.dataos.info/references/engine-guide/databricks"},{"domain":"Engine Mastery","q":"On Snowflake, a semantic model with dimension `user_id` fails at query time with `object does not exist`. The physical column was created unquoted. What is the fix?","options":["Use UPPERCASE identifiers (`USER_ID`) in dimensions, measures, filters, joins and DQ SQL","Quote the dimension as `\"user_id\"` everywhere","Set `model_defaults.dialect: postgres`","Add the column to `inputs.yaml`"],"answer":0,"explain":"Snowflake stores unquoted identifiers in UPPERCASE. Lowercase semantic references cause `object does not exist`.","source":"https://v2.dataos.info/references/engine-guide/snowflake/materialization-behavior"},{"domain":"Engine Mastery","q":"An engineer adds `GRANT SELECT ON ALL TABLES IN SCHEMA goldv4 TO bi_reader` to `after_all` for an Athena product, and it fails. How do you grant consumer access?","options":["Use `ALTER DEFAULT PRIVILEGES` instead","Wrap the GRANT in `@IF(@runtime_stage = 'evaluating', ...)`","Athena has no SQL GRANT. Grant read-only IAM (and optionally Lake Formation) access on the Glue databases/tables and S3 prefixes","Grant `depot:r` only. No AWS-side access is needed"],"answer":2,"explain":"Athena access is enforced through AWS IAM and optionally Lake Formation, not database-side grants. DataOS depot permissions do not replace engine-side access.","source":"https://v2.dataos.info/references/engine-guide/athena/permissions-and-grants"},{"domain":"Engine Mastery","q":"After deploying a Snowflake product, the catalog shows tables but no lineage edges, tags or Dynamic Table history. The scanner role has USAGE and REFERENCES grants. What is most likely missing?","options":["`GRANT OWNERSHIP` on the target schema to the scanner","`GRANT IMPORTED PRIVILEGES ON DATABASE SNOWFLAKE TO ROLE <scanner_role>`, which requires ACCOUNTADMIN","A second Vulcan service role for scanning","`MAX_CONCURRENCY_LEVEL` above 16"],"answer":1,"explain":"Without imported privileges on the SNOWFLAKE database, lineage, tags, procedures and Dynamic Table history are not populated. The scanner must be separate from the service role, and it never needs ownership.","source":"https://v2.dataos.info/references/engine-guide/snowflake"},{"domain":"Engine Mastery","q":"A Nilus pipeline manifest fails YAML validation after an engineer added `incremental_strategy: merge` under `source.options`. Why?","options":["`merge` is not a valid strategy for Lakehouse sinks","`source.options` and `sink.options` are `additionalProperties: false`. `incremental_strategy` is a sink option and must move to `sink.options`","Correctness knobs must be set as runtime environment variables","`incremental_strategy` requires `sql_limit`"],"answer":1,"explain":"The stack schema rejects unknown keys in both option blocks, and putting a knob in the wrong section is a documented anti-pattern.","source":"https://v2.dataos.info/references/resources/nilus/pipeline-optimization/optimize-sink-datasets"},{"domain":"Engine Mastery","q":"To cut memory on a shared runtime, a team proposes running every Lakehouse load on Nilus defaults. One pipeline loads a narrow table with billions of rows inside a tight window. What does the guidance say?","options":["If time matters, do not resource-optimize narrow, high-row-count tables. Defaults can run 34 minutes to nearly two hours slower than a time-tuned run","Defaults are always within a few minutes of a tuned run","Raise `DATA_WRITER__FILE_MAX_BYTES` to 2 GB for narrow tables","Switch the pipeline to `sql_limit` sampling"],"answer":0,"explain":"Defaults are a good choice for wide tables but carry a severe time penalty on narrow tables. Larger files give narrow tables no time benefit, and `sql_limit` is a testing knob only.","source":"https://v2.dataos.info/references/resources/nilus/pipeline-optimization/optimizing-for-resource"},{"domain":"Advanced Vulcan Patterns","q":"A metric YAML uses `dependsOn:` and `timeDimension:`. `vulcan plan` succeeds but the metric is not linked as expected. What explains it?","options":["Metrics require `type:` instead of `kind:` at the root","Asset YAML must set `strict_semantic_validation: true`","camelCase keys are only allowed in `config.yaml`","Asset YAML loads without key conversion, so camelCase keys are silently not recognized. Rename them to `depends_on` and `time_dimension`"],"answer":3,"explain":"Asset files (semantic, metric, dq, policy) must already be snake_case. Vulcan ignores camelCase keys and does not convert them. The root accepts either `kind:` or `type:`.","source":"https://v2.dataos.info/references/resources/vulcan/configurations"},{"domain":"Advanced Vulcan Patterns","q":"A model declares `owner data_team`, but `config.users` lists only `jen`. What happens?","options":["The owner silently falls back to `jen`","Config load rejects the model, because each model's owner must be a username listed in `config.users`","Vulcan creates the `data_team` user automatically","Only `vulcan review` flags it"],"answer":1,"explain":"At load time, Vulcan validates the owner of each model against `config.users`. An unknown owner is a load error. `model_defaults.owner` defaults to the first listed user.","source":"https://v2.dataos.info/references/resources/vulcan/configurations/model-defaults"},{"domain":"Advanced Vulcan Patterns","q":"While iterating locally, every failed `vulcan plan` posts to the Slack channel of the team. How does the developer stop this without a change to the shared project configuration?","options":["Remove `apply_failure` from `notify_on` in the project config","Delete the `SLACK_WEBHOOK_URL` variable from CI","Set a top-level `username` key in `~/.vulcan/config.yaml` so notifications route only to that user's targets","Rename `notification_targets` to `notificationTargets` locally"],"answer":2,"explain":"A top-level `username` routes every notification to the personal targets of that user. If you put it in the machine-level configuration, it affects only that machine.","source":"https://v2.dataos.info/references/resources/vulcan/configurations/notifications"},{"domain":"Advanced Vulcan Patterns","q":"The configuration of an older project lists `check_failure` under `notify_on`. On a current Vulcan build, data-quality alerts never arrive. What must change?","options":["Migrate the legacy `check_*` event names to the `dq_*` names","Switch the target type to `smtp`","Move the target under a `users` entry","Add `dq: true` to the target"],"answer":0,"explain":"Older builds used `check_start`/`check_end`/`check_failure`. Current builds use `dq_*` names, and you must migrate the older values.","source":"https://v2.dataos.info/build/recipes/route-failures-to-slack-or-teams"},{"domain":"Advanced Vulcan Patterns","q":"A project enables rollups. `vulcan plan` rejects `column_mask_expressions (email = CONCAT(LEFT(email, 2), '***'))` on a column used as a rollup group-by. What is the accepted approach?","options":["Move the mask into the semantic model's dimension `mask_expression`","Disable the auth extension","Add the column to the policy `filter` instead of `mask`","Use a constant mask expression such as a string literal or `CAST(NULL AS TEXT)` for that column"],"answer":3,"explain":"Value-referencing masks cannot be re-derived from aggregated rollup data, so rollup group-by columns need constant masks. Vulcan strips semantic-model mask expressions at load time.","source":"https://v2.dataos.info/build/recipes/mask-sensitive-columns-by-role"},{"domain":"Advanced Vulcan Patterns","q":"An `after_all` macro generates `GRANT SELECT ON VIEW <view> TO ROLE analytics_role` for every view in `evaluator.views`, but the executed SQL grants on physical tables instead. What fixes it?","options":["Move the macro into each model's `post_statements`","Add `/* sqlglot.meta replace=false */` after the view name so Vulcan does not substitute the physical table name","Wrap the statement in `@IF(@runtime_stage = 'promoting', ...)`","Use `@this_model` instead of `evaluator.views`"],"answer":1,"explain":"Without the meta comment, rendering replaces the view name with its physical table. This breaks the GRANT.","source":"https://v2.dataos.info/references/resources/vulcan/configurations/execution-hooks"},{"domain":"Orchestration and Data Applications","q":"A team needs a long-running Kafka consumer that writes to the Lakehouse and exposes no endpoint. Which resource fits?","options":["A Workflow with `spec.type: schedule` every minute","A Service with no `servicePorts`","A Worker, using a stack such as `container` or `bento`","A Bundle with an inline consumer spec and nothing else"],"answer":2,"explain":"Workers are long-running background workloads without exposed ports. They are for stream processors and queue consumers. Workflows run to completion, and Services exist to expose ports.","source":"https://v2.dataos.info/references/resources/worker"},{"domain":"Orchestration and Data Applications","q":"An engineer deletes a Bundle that contains a Secret, a Postgres Service with an inline `disk`, and a verification Workflow. What can they expect?","options":["Deletion can remove the bundled resources in reverse dependency order (dependents first), and the inline disk and data of the Service go with it","Only the Bundle record is removed. All children keep running","Resources are deleted in the order listed, Secret first","Inline disks are retained because the Service was `stateful: true`"],"answer":0,"explain":"Bundle deletion follows reverse dependency order. An inline disk belongs to the Service lifecycle, so its data is deleted with the Service.","source":"https://v2.dataos.info/references/resources/bundle"},{"domain":"Orchestration and Data Applications","q":"A Service sets `replicas: 3` and `highAvailabilityConfig: {mode: required, level: zone}` on a compute pool spanning two zones. What happens?","options":["Two replicas share a zone and the third is placed elsewhere","The setting is ignored because HA needs `executionMode: runnable`","Replicas are placed by hostname instead","Placement cannot be fully met, so with `mode: required` the Service fails to schedule. If distinct zones run out, `mode: preferred` places replicas together"],"answer":3,"explain":"If the separation cannot be exactly met, `required` does not schedule. If there are not enough distinct units, `preferred` continues and puts replicas together.","source":"https://v2.dataos.info/references/resources/service/core-concepts"},{"domain":"Orchestration and Data Applications","q":"An `app` manifest sets `spec.app.link.url: https://dev.example.dataos.app/orders-dashboard`. The same manifest is promoted to production. What is the recommended change?","options":["Remove `spec.service.http.path` so the URL wins","Set `spec.app.link.url` to a path such as `/orders-dashboard`. Full URLs are deprecated, and a path keeps one manifest valid across environments","Duplicate the manifest per environment with different full URLs","Move the URL to `spec.link.url`"],"answer":1,"explain":"Since September 2026 app links must be paths. Full URLs still work, but support will be removed. `spec.link.url` belongs to the separate `link` resource.","source":"https://v2.dataos.info/references/interfaces/apps/deploy-a-data-application"},{"domain":"Orchestration and Data Applications","q":"A Perspective-backed app returns 401/403 from the Data API, although the app's runtime user owns the Perspective. What is the documented fix?","options":["Set `noNetworkAuthorization: true` and re-apply","Turn on Auto refresh for the Perspective","Grant the `runAsUser` identity Can Use on the Data Product itself. Owning a resource does not grant Use on it","Add `/var/cache` to `workingDirs`"],"answer":2,"explain":"The troubleshooting table of the recipe says that the runtime identity needs Can Use on the product, not only on the Perspective. `noNetworkAuthorization` is for opening the dashboard link, not for Data API calls.","source":"https://v2.dataos.info/consume/recipes/deploy-a-data-application-on-a-perspective"},{"domain":"AI Activation Architecture","q":"A developer wires a LangChain agent to Data Product MCP. Which configuration matches the documentation?","options":["Transport `http`, URL `https://<instance-url>/dataproduct-mcp/api/v1`, header `apikey` set from an environment variable holding a DataOS API token","A direct Postgres connection string to the product's warehouse","URL `https://<instance-url>/mcp/api/v1` with a hard-coded token in the script","A Bearer token header against the Vulcan `/api/v1/query` endpoint"],"answer":0,"explain":"Agentic frameworks use the API-token endpoint with the `apikey` header. Tokens are secrets, so inject them from the environment. MCP is not a database connection.","source":"https://v2.dataos.info/consume/consume-with-ai/connect-an-agentic-framework/langchain"},{"domain":"AI Activation Architecture","q":"After enabling an analyst agent on an Athena-backed product, the AWS bill jumps. Which MCP tool is the likely driver, and what control applies?","options":["`about`. Cache tool descriptions","`lineage`. Reduce scanner cadence","`activity`. Trim workflow history","`data`, which runs live Athena queries that scan bytes. Set bytes-scanned and concurrency limits on the workgroup and pre-aggregate hot paths"],"answer":3,"explain":"The Athena guide notes that the `data` tool runs live queries that consume scanned-byte capacity. `about`, `lineage` and `activity` make no engine call.","source":"https://v2.dataos.info/references/engine-guide/athena"},{"domain":"AI Activation Architecture","q":"When a user asks about \"the revenue table\", an agent answers `I could not find lineage for that`. Discovery shows a table named `orders_enriched`. What is the most likely reason?","options":["Lineage is unavailable through MCP","The lineage capability needs an exact product or table name. Search first, then ask about `orders_enriched` by name","The user lacks the `data_developer` role","Lineage requires the profiler to be re-run"],"answer":1,"explain":"Lineage requires an exact product or table name, and it returns no row values. If you are not sure of the name, search first. Profiles are read, not re-run.","source":"https://v2.dataos.info/consume/consume-with-ai/understand-in-natural-language"},{"domain":"AI Activation Architecture","q":"In the AI activation trust model, which layer controls the final wording of an answer, and how does an agent application reduce that risk?","options":["Platform-governed trust. Tighten policies","Transport layer. Switch to OAuth","Assistant-shaped trust. Instruct the agent to cite the metric, source product, filters and time window for every analytical answer","Initialization. Renegotiate capabilities per question"],"answer":2,"explain":"The assistant chooses tools and controls the final wording. Data Product MCP adds structured fields, warnings and citations. Frameworks must enforce citation discipline at the application layer.","source":"https://v2.dataos.info/references/interfaces/ai-activation/trust-model"},{"domain":"AI Activation Architecture","q":"A host session uses Data Product MCP and a separate ticketing MCP server at the same time. How is this structured in MCP?","options":["Both servers share one client that multiplexes tool calls","Each server connection uses its own client. The host chooses which connection to use from the prompt and the plan of the model","The ticketing server must be registered as a Data Product MCP resource","The second server becomes a prompt template inside Data Product MCP"],"answer":1,"explain":"A host can connect to many servers. Each connection has its own client that connects, negotiates capabilities, lists tools and sends calls.","source":"https://v2.dataos.info/references/interfaces/ai-activation/mcp-components"}]},"reviewNotes":["Minerva access control conflict: the Operate page (resource-level-permissions/minerva-cluster-access-control) says a Tenant Admin holds Can Manage Access on every Minerva Cluster and the usage permission is 'Can Use Cluster'; the References page minerva/access-control (marked WIP) says no role, including Tenant Admin, gets automatic access to another user's cluster, and names the permission 'Can Use Minerva'. The course follows the Operate pages. SME to confirm the authoritative behaviour and permission label.","Depot permission conflict: depot-access-control says Can Use Depot lets the grantee 'reference the Depot and its linked Secrets', while roles-and-permissions, the how-to-give-access recipe and the Minerva/Nilus pages say Can Use Depot does NOT include Can Use Secret. The course teaches the separate Secret grant.","Who creates application users: create-an-application-user says only an Operator can create users (via `dataos-ctl user create -t application`), but the runtime-identity recipe says the Tenant Admin creates the ApplicationUser. The course says Operator creates it and the Tenant Admin grants Resource permissions. Confirm.","runAsUser example inconsistency: runasuser-permissions says only an Operator grants Run As User, but its example narrative says 'johndoe ... grants iamgroot the Run As User use-case'. The course teaches Operator-only.","Lakehouse creation prerequisites differ: lakehouse overview and lakehouse-access-control list Can Use on Compute, Secret and Depot; create-a-lakehouse lists only Secret and Compute. The course lists Compute, Secrets (and Depot).","Lakehouse manifest version: create-a-lakehouse and manage-lakehouse use `version: v1alpha`, while the command reference uses `v2alpha` in the delete identifier and schema generate example. Course YAML uses v1alpha; confirm the current version.","manage-lakehouse example still sizes the Spark server under `sparkCluster.server`, which the September 2026 release deprecates in favour of `sparkCluster.resources`. The course uses `resources` per the configurations page and release note; the manage-lakehouse page should be updated.","Depot manifest shape differs: tenant-admin templates use a top-level `spec:` (with nested `spec.type`, `spec.spec`), while the Lakehouse Depot page uses a top-level `depot:` block. Both are reproduced as documented; SME to confirm whether both are valid in v2alpha.","Lakehouse domain check commands differ: create-a-lakehouse uses `dataos-ctl domain get -t resource -a`, the lakehouse troubleshooting table uses `dataos-ctl domain get -t lakehouse -a`. Both are quoted where the docs use them.","Projections pages use `dataos develop use` and `dataos develop resource` (no `-ctl`), while other pages use `dataos-ctl develop ...`. Course quotes the Projections docs verbatim; verify the binary name.","Role versus individual grants: tenant-admin/governance recommends granting standard access to Roles; the August 2026 release note recommends individual-user grants in Production to limit blast radius. The course presents both and asks learners to justify a choice.","Deploy Stacks vs August 2026: the August release says new Tenants come with default Stacks and Secrets, yet deploy-stacks still describes manual MCP server/broker deployment and environment-specific `lakehouse-mruntime`. Tenant readiness also lists 'mandatory state store Secrets in the system Tenant' with no v2 how-to (July notes link a v1 path). Course mentions these items without procedural detail; SME to clarify what remains manual.","AWS UI guide says Super User and Operator roles are needed 'in the target Tenant'; the CLI guides say the three roles are needed on the Instance. Course follows the CLI guides (`roles:id:user`, `roles:id:operator`, `roles:id:super-user`).","Instance Status URL: instance-status uses `/status/`; June 2026 notes say `{instance-fqdn}/status` (Early Preview). Course uses `/status/`.","`unquarantine` appears only in the September/July release notes; the v2 CLI resource reference in docs/pages has no section for it. The course mentions it only as a release-note behaviour change, with no syntax.","The roles-and-permissions page says Instance roles 'are assigned when the Instance is created and cannot be modified afterward', which conflicts with IdP group mapping and `dataos-ctl user tag add`. The course quotes it as stated; SME to clarify the intended meaning.","Data Steward (September 2026) is described as DataOS-level, glossary-only and Operator-granted; Instance Admin and IdP mapping pages still list only User and Operator. Course mentions it only briefly.","The Minerva YAML in lesson e2-3 is condensed (flow-style resources, JVM `envs` omitted) from the documented template; keys are unchanged. Lab manifests use placeholders and assume an instructor-provided sandbox; Operator-only steps need a sandbox Operator.","`dataos-ctl domain task run` appears only in the operate/cli command table with no runbook; it is not taught.","Volume has no page in the v2 resource-level-permissions list; the Volume page says only that the owner must grant use. The course does not name a specific Volume permission.","Release notes (Sept 2026) describe Athena and Redshift Vulcan engine stacks as beta, while the engine-guide pages call the SQL path GA. Lessons tell learners to treat them as beta; confirm the intended support statement.","Minerva is documented as VIEW-only for Vulcan materialization (FULL/SEED/incrementals require a dedicated cluster). This is a heavily tested point (e5 quiz); confirm it is still current.","highAvailabilityConfig modes: Sept 2026 release notes say `preferred/default`; Service and Worker reference pages say `preferred`/`required`. Course teaches the reference pages and flags the discrepancy in a Note.","Data Product MCP OAuth endpoint: connect-a-client table lists `/mcp/api/v1` for OAuth, but the Claude Code OAuth example uses `/dataproduct-mcp/api/v1`. Course flags this; please confirm.","Engine guides (Spark, Redshift, Athena) list an MCP `run` tool that 'triggers workflow', while the AI activation trust model says consumption tools do not modify or retrigger runtime jobs. The e8 lab asks learners to record behavior rather than assert either; please reconcile.","Notifications: the event table lists only dq_start/dq_end while the hint mentions dq_failure; the configurations overview also shows a `console` target with `plan_change`, conflicting with 'four built-in target types'. Course teaches the four documented types and avoids dq_failure/console in questions.","Nilus runtime env placement: pipeline-optimization overview says 'Set runtime environment variables under runtime.env' (and its profiles use `spec.runtime.env`), while optimizing-for-time and CDC pages use `spec.use.projection.projections.envVars`. Course uses the projection form; confirm which is canonical.","`sql_reflection_level` values differ between pages (`minimal|full|full_with_precision` vs `limited`). Not used in questions.","No Nilus-specific log command was found in the provided pages; the e5 lab uses `dataos-ctl resource get -t nilus -n <pipeline-name>` only. Consider adding the official log command.","Rendered Vulcan deploy manifest (git-and-deploy) uses snake_case keys (`run_as_user`, `end_on`, `concurrency_policy`), while engine-guide deploy examples use camelCase (`runAsUser`, `endOn`, `concurrencyPolicy`). Course directs learners to the `deployment:` block in config.yaml plus `vulcan create_deploy_yaml` to sidestep this.","Role tag naming varies: `roles:id:data-dev` (engine permission tables) vs `roles:id:data-developer` (link resource page) vs tenant roles `data_consumer`/`data_developer` (MCP grants). Course quotes each where its source uses it.","Spark ML recipe calls `.toPandas()` on predictions while the Spark engine guide warns against `toPandas()` on large outputs. Lesson reconciles this (bounded output only) in a Warning; SME may want the recipe updated.","Runtime CLI version flag: docs example is `dataos-ctl resource runtime stop -t service -n orders-api -v v1`; manifests are `v2alpha`. The e7 lab uses a `<resource-version>` placeholder; confirm the expected value.","Deprecated anomaly-detection and change-over checks are not taught; the capstone lists their use as an automatic fail. Confirm this is acceptable policy for grading.","Minimum-permissions page lists a `postgres-cross-db-full` secret tier although Postgres is documented as single-database with no cross-database queries. Not used in questions.","Lakehouse `sparkCluster.resources` (replacing `sparkCluster.server`) is mentioned only as a Note in e5 because the assigned pages focus on Vulcan's Spark workflow sizing (`spec.workflow.resources.driver/executor`).","Exam has 22 questions spread 6/6/5/5 across the four Track B domains with blueprint weights 27/27/23/23; weights will need rescaling when merged with Track A.","Durations per module are estimates; the capstone duration is not specified."]}</script>

s, and dynamic values like the user() function."],"https://v2.dataos.info/references/resources/vulcan/deployment":["Deployment steps","Deploy a Vulcan Data Product into a DataOS environment: prerequisites, the deployment: section in config.yaml, linting, deploying, and checking status."],"https://v2.dataos.info/references/resources/vulcan/models/data-models/model-kinds":["Kinds","INCREMENTAL, FULL, VIEW, EMBEDDED, SEED, and SCD Type 2 model kinds, and their materialization strategies by engine."],"https://v2.dataos.info/references/resources/vulcan/models/data-models/types/external-models":["External models","How \\`EXTERNAL\\` models describe schemas for tables Vulcan does not manage, and how to create and validate them."],"https://v2.dataos.info/references/resources/vulcan/models/semantic-models":["Semantic models","Define business-friendly semantic models on top of Vulcan data models."],"https://v2.dataos.info/references/resources/vulcan/models/semantic-models/ai-context":["AI context","Add AI and LLM guidance to semantic models, dimensions, measures, segments, joins, and granularities."],"https://v2.dataos.info/references/resources/vulcan/models/semantic-models/joins":["Joins","Define relationships between semantic models for cross-model analysis."],"https://v2.dataos.info/references/resources/vulcan/monitor-and-delete":["Monitor & delete","Monitor a deployed Vulcan Data Product with the DataOS CLI: read its status and runtime, find the failing container group, read its logs, rerun after a fix, and delete the deployed Resource when it's."],"https://v2.dataos.info/references/resources/vulcan/plugins-and-auth":["Plugins and auth","The plugins/ folder auth extension: configuring the after\\_authorize hook, AuthExtensionContext and SecurityContext, the resolve\\_user\\_groups example, and how policies use resolved groups and claims."],"https://v2.dataos.info/references/resources/vulcan/policies":["Policies","Technical reference for Vulcan access policies, row filters, column masking, auth plugins, and physical-model-only policy inheritance."],"https://v2.dataos.info/references/resources/vulcan/quality/assertions":["Assertions","Audits and assertions: built-in and user-defined rules that block bad rows."],"https://v2.dataos.info/references/resources/vulcan/quality/data-quality":["Data quality","DQ checks (\\`kind: dq\\`): expectations, dimensions, and profiling."],"https://v2.dataos.info/references/resources/vulcan/quality/tests":["Unit tests","Unit tests: YAML fixtures for inputs and outputs, testing incremental models and CTEs, and running tests with the CLI."],"https://v2.dataos.info/references/resources/vulcan/roles-and-permissions":["Roles and permissions","Minimum engine privileges required to run a Vulcan domain resource, engine by engine: PostgreSQL, Snowflake, Databricks, Spark, Trino, Redshift, and Athena."],"https://v2.dataos.info/references/resources/vulcan/roles-and-permissions/snowflake-minimum-permissions":["Snowflake","Minimum Snowflake grants for a Vulcan deployment: source, target, and state schema privileges, by secret\\_name tier."],"https://v2.dataos.info/references/resources/vulcan/troubleshooting":["Troubleshooting","Every validation and request error Vulcan returns, what triggered it, and how to fix it."],"https://v2.dataos.info/references/resources/worker":["Worker","Explains workers for background and task-based execution."],"https://v2.dataos.info/references/resources/worker/core-concepts":["Core concepts","Core concepts specific to Worker resources."],"https://v2.dataos.info/references/resources/worker/example":["Example","End-to-end Worker examples for common deployment patterns."],"https://v2.dataos.info/references/resources/worker/field-reference":["Field reference","Reference for Worker manifest fields and nested runtime configuration."],"https://v2.dataos.info/references/resources/workflow":["Workflow","Explains workflows for orchestrated, multi-step execution."],"https://v2.dataos.info/references/resources/workflow/core-concepts":["Core concepts","Core concepts specific to Workflow resources."],"https://v2.dataos.info/references/resources/workflow/create-a-workflow":["Create a Workflow","Define, apply, and verify a Workflow resource."],"https://v2.dataos.info/references/resources/workflow/example":["Example DAG patterns","End-to-end Workflow examples for common orchestration patterns."],"https://v2.dataos.info/references/resources/workflow/field-reference":["Field reference","Reference for Workflow manifest fields and DAG step configuration."],"https://v2.dataos.info/references/supported-connectors":["Supported connectors","This document lists the data sources supported by DataOS."],"https://v2.dataos.info/releasenotes/august-2026":["August 2026","More ways to land data, more confidence in every AI answer."],"https://v2.dataos.info/releasenotes/july-2026":["July 2026","Tighter contracts on the way in, more ways to query on the way out."],"https://v2.dataos.info/releasenotes/june-2026":["June 2026","A major DataOS release to build governed Data Products on any engine, then serve them to people, tools, and AI."],"https://v2.dataos.info/releasenotes/september-2026":["September 2026","More control over platform operations, broader engine support, and tighter governance over how data gets shared."],"https://www.moderndata101.com/blogs/what-are-data-products-the-complete-guide":["What are data products?","Modern Data 101: a guide to data products."],"https://www.moderndata101.com/chapters/introduction-to-data-products":["Introduction to data products","Modern Data 101: a first chapter on data products."],"https://www.moderndata101.com/modules/bring-product-thinking-to-data":["Bring product thinking to data","Modern Data 101: treat data as a product with users and owners."],"https://www.moderndata101.com/modules/data-product-101":["Data Product 101","Modern Data 101: what a data product is, and why teams build them."]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(() => {
const LEVELS = ["primer","beginner","intermediate","expert"];
const data = {};
const $app = document.getElementById("app");

/* ---------- storage ---------- */
const KEY = "dataos-academy.v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
const S = (k, d) => (k in store ? store[k] : d);
const setS = (k, v) => { store[k] = v; save(); if (/^(quiz|exam):/.test(k)) schedulePush(); };

/* ---------- central learner record (db + user capabilities) ----------
   One document per learner at results/<uid>. Learners write only their own;
   the owner and Editors read everyone's (see the db rules at publish). */
const sync = { db:null, user:null, uid:null, ref:null, state:"local", pushing:false, again:false, timer:null };
const $sync = document.getElementById("sync");
function setSync(state, text){ sync.state=state; $sync.className = "sync" + (state==="on"?" on":state==="err"?" err":""); $sync.textContent = text; }
function mergeRemote(r){
  if (!r) return;
  for (const [k, v] of Object.entries(r.quizzes || {})) {
    const key = "quiz:" + k; const cur = store[key];
    if (!v || typeof v !== "object") continue;
    store[key] = { score: Math.max(cur?.score ?? 0, v.score ?? 0), total: v.total ?? cur?.total, pass: !!(cur?.pass || v.pass), best: Math.max(cur?.best ?? 0, v.best ?? 0) };
  }
  for (const [lv, v] of Object.entries(r.levels || {})) {
    const key = "exam:" + lv; const cur = store[key];
    if (!v || typeof v !== "object") continue;
    const seen = new Set(); const attempts = [...(cur?.attempts || []), ...(v.attempts || [])].filter(a => { const id = a && a.at; if (!id || seen.has(id)) return false; seen.add(id); return true; }).sort((a,b)=>a.at-b.at).slice(-20);
    store[key] = { best: Math.max(cur?.best ?? 0, v.best ?? 0), last: (v.at ?? 0) > (cur?.at ?? 0) ? v.last : cur?.last, pass: !!(cur?.pass || v.pass), at: Math.max(cur?.at ?? 0, v.at ?? 0),
      passedAt: [cur?.passedAt, v.passedAt].filter(Boolean).sort()[0], passScore: Math.max(cur?.passScore ?? 0, v.passScore ?? 0) || undefined, credentialId: cur?.credentialId || v.credentialId, attempts };
  }
  save();
}
function buildRecord(){
  const quizzes = {}, levels = {};
  for (const [k, v] of Object.entries(store)) {
    if (k.startsWith("quiz:")) quizzes[k.slice(5)] = { score: v.score, total: v.total, pass: !!v.pass, best: v.best ?? v.score };
    if (k.startsWith("exam:")) { const lv = k.slice(5); levels[lv] = { best: v.best, last: v.last, pass: !!v.pass, at: v.at, passedAt: v.passedAt ?? null, passScore: v.passScore ?? null, credentialId: v.credentialId ?? null, attempts: (v.attempts || []).slice(-20) }; }
  }
  const modulesPassed = {};
  for (const lv of LEVELS) { if (data[lv]) modulesPassed[lv] = data[lv].modules.filter(m => quizzes[`${lv}:${m.id}`]?.pass).length; }
  return { learner: sync.uid, quizzes, levels, modulesPassed, updatedAt: Date.now() };
}
function schedulePush(){ if (!sync.ref) return; clearTimeout(sync.timer); sync.timer = setTimeout(push, 600); }
async function push(){
  if (!sync.ref) return;
  if (sync.pushing) { sync.again = true; return; }
  sync.pushing = true; setSync("on", "Saving…");
  try { await sync.ref.set(buildRecord()); setSync("on", "Results recorded"); }
  catch (e) {
    if (e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked")) { sync.ref = null; setSync("err", "Saved in this browser only"); document.getElementById("footNote").textContent = "Your access level can't record results centrally. Ask the course owner for Contributor access."; }
    else if (e && e.code === "unavailable") { setTimeout(schedulePush, 1500 + Math.random()*1500); setSync("err", "Retrying save…"); }
    else setSync("err", "Couldn't record results");
  }
  sync.pushing = false;
  if (sync.again) { sync.again = false; push(); }
}
async function initSync(){
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    sync.db = db; sync.user = user;
    if (user && await user.canEdit()) document.getElementById("adminLink").hidden = false;
    const uid = user ? await user.id() : null;
    if (!db || !uid) { setSync("local", "Saved in this browser"); document.getElementById("footNote").textContent = "Sign in to claude.ai to record your results centrally. For now, progress is saved in this browser."; return; }
    sync.uid = uid; sync.ref = db.doc("results/" + uid);
    const snap = await sync.ref.get();
    if (snap.exists) mergeRemote(snap.data());
    setSync("on", "Results recorded");
    // Push local progress that predates the central record (or that the record lacks).
    const hasLocal = Object.keys(store).some(k => /^(quiz|exam):/.test(k));
    if (hasLocal) schedulePush();
    if (!timerId) render();  // never interrupt an exam in progress
  } catch (e) { setSync("local", "Saved in this browser"); }
}

/* ---------- theme ---------- */
const themeBtn = document.getElementById("themeBtn");
function applyTheme(t){ if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); themeBtn.textContent = t === "dark" ? "Dark" : t === "light" ? "Light" : "Auto theme"; }
applyTheme(S("theme", null));
themeBtn.addEventListener("click", () => { const order=[null,"light","dark"]; const cur=S("theme",null); const nx=order[(order.indexOf(cur)+1)%3]; setS("theme", nx); applyTheme(nx); });

/* ---------- markdown ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function md(src, inline){
  const html = inline ? marked.parseInline(String(src ?? "")) : marked.parse(String(src ?? ""));
  return DOMPurify.sanitize(html, {ADD_ATTR:["target","rel"]});
}
function enhance(root){
  root.querySelectorAll("table").forEach(t => { if (!t.parentElement.classList.contains("tbl")) { const w=document.createElement("div"); w.className="tbl"; t.replaceWith(w); w.appendChild(t);} });
  root.querySelectorAll("blockquote").forEach(b => { if (/^\s*(Warning|Caution|Important)\b/i.test(b.textContent)) b.classList.add("warn"); });
  root.querySelectorAll("a[href^='http']").forEach(a => { a.target="_blank"; a.rel="noopener"; });
  root.querySelectorAll("pre > code").forEach(c => {
    try { if (window.hljs) hljs.highlightElement(c); } catch(e){}
    const pre = c.parentElement; if (pre.querySelector(".copy")) return;
    const b = document.createElement("button"); b.type="button"; b.className="copy"; b.textContent="Copy";
    b.addEventListener("click", () => {
      const done = () => { b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1400); };
      const fallback = () => { const r=document.createRange(); r.selectNodeContents(c); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="Selected"; setTimeout(()=>b.textContent="Copy",1400); };
      try { navigator.clipboard.writeText(c.innerText).then(done, fallback); } catch(e){ fallback(); }
    });
    pre.appendChild(b);
  });
}
let DOCLINKS = null;
const docLink = u => { DOCLINKS ??= JSON.parse(document.getElementById("data-doclinks")?.textContent || "{}"); return DOCLINKS[u] || [u, u.replace(/^https?:\/\/(www\.)?/,"")]; };
const srcLinks = list => (list && list.length) ? `<div class="readmore"><span class="lbl">Read more in the documentation</span><ul>${list.map(u => { const [t,d] = docLink(u); return `<li><a href="${esc(u)}" target="_blank" rel="noopener" title="${esc(t)}">${esc(d)}</a></li>`; }).join("")}</ul></div>` : "";

/* ---------- progress ---------- */
const quizKey = (lv, m) => `quiz:${lv}:${m}`;
const modDone = (lv, m) => { const r = S(quizKey(lv,m), null); return !!(r && r.pass); };
function levelProgress(lv){ const L=data[lv]; if(!L) return {done:0,total:0}; const t=L.modules.length; const d=L.modules.filter(m=>modDone(lv,m.id)).length; return {done:d,total:t}; }
const examRes = lv => S(`exam:${lv}`, null);

/* ---------- routing (bare-token hashes) ---------- */
function parse(){ const h=(location.hash||"#home").slice(1); if(!h||h==="home") return {v:"home"}; const [lv, a, b] = h.split("."); if(!LEVELS.includes(lv)) return {v:"home"}; if(!a) return {v:"level",lv}; if(a==="exam") return {v:"exam",lv}; return {v:"module",lv,m:a,tab:b||"learn"}; }
function go(h){ if (location.hash === "#"+h) render(); else location.hash = h; }
window.addEventListener("hashchange", () => { stopTimer(); render(); window.scrollTo(0,0); });

function crumbs(parts){ document.getElementById("crumbs").innerHTML = parts.map((p,i)=> p.h ? `<a href="#${p.h}">${esc(p.t)}</a>` : `<span>${esc(p.t)}</span>`).join(" <span aria-hidden='true'>/</span> "); }

function render(){
  const r = parse();
  if (r.v!=="admin") stopAdmin();
  if (r.v==="admin") return admin();
  if (r.v==="home") return home();
  if (!data[r.lv]) { $app.innerHTML = `<div class="empty">This level is not available yet.</div>`; return; }
  if (r.v==="level") return level(r.lv);
  if (r.v==="exam") return exam(r.lv);
  return module(r.lv, r.m, r.tab);
}

/* ---------- home ---------- */
const LV_LABEL = {primer:"Level 0", beginner:"Level 1", intermediate:"Level 2", expert:"Level 3"};
const LV_NAME = {primer:"Primer", beginner:"Beginner", intermediate:"Intermediate", expert:"Expert"};
function home(){
  crumbs([]);
  const tot = LEVELS.reduce((a,lv)=>{const L=data[lv]; if(!L) return a; a.m+=L.modules.length; a.q+=L.modules.reduce((x,m)=>x+(m.quiz||[]).length,0)+(L.exam?.questions?.length||0); a.l+=L.modules.filter(m=>m.lab).length; return a;},{m:0,q:0,l:0});
  $app.innerHTML = `
  <section class="hero">
    <div>
      <div class="eyebrow">DataOS certification programme</div>
      <h1>Build, govern and ship <em>Data Products</em> on DataOS.</h1>
      <p>Four levels take you from first principles to running DataOS in production. Each level has lessons, hands-on labs and a certification exam. Everything is written against the current DataOS v2 documentation.</p>
    </div>
    <div class="hero-stats" aria-label="Programme size">
      <div><b>${tot.m}</b><span>modules</span></div>
      <div><b>${tot.l}</b><span>hands-on labs</span></div>
      <div><b>${tot.q}</b><span>assessment questions</span></div>
    </div>
  </section>
  <section class="ladder" aria-label="Certification levels">
    ${LEVELS.map((lv,i)=>{ const L=data[lv]; if(!L) return `<div class="rung locked"><div class="lvl">${LV_LABEL[lv]}</div><h2>${LV_NAME[lv]}</h2><p>Coming soon.</p></div>`;
      const p=levelProgress(lv); const ex=examRes(lv);
      const status = ex&&ex.pass ? `<span class="pill ok">Certified</span>` : p.done ? `<span class="pill teal">${p.done}/${p.total} modules</span>` : `<span class="pill">Not started</span>`;
      return `<a class="rung" href="#${lv}">
        <div class="step"><span class="lvl">${LV_LABEL[lv]} · ${LV_NAME[lv]}</span>${status}</div>
        <h2>${esc(L.title)}</h2>
        <p>${esc(L.tagline)}</p>
        <div class="meta"><span>${esc(L.duration)}</span><span>${L.modules.length} modules</span><span>${L.exam.questions.length}-question exam</span></div>
        <div class="bars" aria-hidden="true">${L.modules.map(m=>`<i class="${modDone(lv,m.id)?"on":""}" style="height:${30+((i+1)*15)}%"></i>`).join("")}</div>
      </a>`; }).join("")}
  </section>
  <section class="about">
    <div><h3>How certification works</h3><p>Pass each module's knowledge check (4 out of 5 or better) to mark the module complete. When you're ready, take the level exam. A passing score unlocks your certificate for that level.</p></div>
    <div><h3>Which level to start at</h3><p>Start at Primer if Data Products, ELP or DataOS Resources are new to you. If you already ship Data Products, take a level exam directly. Strong scores show where you can skip ahead.</p></div>
    <div><h3>Sources and currency</h3><p>Lessons cite the DataOS v2 doc pages they draw on. Product thinking comes from Modern Data 101. Older DataOS v1 components such as Flare, Lens and Talos are not taught.</p></div>
  </section>`;
}

/* ---------- level ---------- */

  const L = data[lv]; crumbs([{t:"Levels",h:"home"},{t:LV_NAME[lv]}]);
  const tracks = [...new Set(L.modules.map(m=>m.track).filter(Boolean))];
  const curTrack = S(`track:${lv}`, "all");
  const shown = L.modules.filter(m => curTrack==="all" || m.track===curTrack);
  const p = levelProgress(lv); const ex = examRes(lv);
  $app.innerHTML = `
  <section class="level-head">
    <div>
      <div class="eyebrow">${LV_LABEL[lv]} · ${LV_NAME[lv]} certification</div>
      <h1>${esc(L.title)}</h1>
      <p class="lead">${esc(L.tagline)}</p>
      <dl class="facts">
        <dt>For</dt><dd>${esc(L.audience)}</dd>
        <dt>Time</dt><dd>${esc(L.duration)}</dd>
        <dt>Before</dt><dd>${(L.prerequisites||[]).map(esc).join("; ") || "None"}</dd>
        <dt>Progress</dt><dd><div style="display:flex;gap:10px;align-items:center"><div class="progress" style="flex:1;max-width:240px"><i style="width:${p.total?p.done/p.total*100:0}%"></i></div><span class="muted" style="font-size:14px">${p.done} of ${p.total} modules</span></div></dd>
      </dl>
      <h3 style="font-size:18px;margin:28px 0 12px">You will be able to</h3>
      <ul class="ticks">${(L.outcomes||[]).map(o=>`<li>${md(o,true)}</li>`).join("")}</ul>
    </div>
    <aside class="panel">
      <h3>Exam blueprint</h3>
      <div class="blue">${(L.examBlueprint||[]).map(d=>`<div><span>${esc(d.domain)}</span><b>${d.weight}%</b><div class="track"><i style="width:${d.weight}%"></i></div></div>`).join("")}</div>
      <p class="muted" style="font-size:14px;margin:16px 0 0">${L.exam.questions.length} questions · ${L.exam.timeMinutes} minutes · pass mark ${L.exam.passMark}%</p>
    </aside>
  </section>
  ${tracks.length>1?`<div class="tabs" role="tablist" aria-label="Tracks">${["all",...tracks].map(t=>`<button class="tab" role="tab" data-track="${esc(t)}" aria-selected="${t===curTrack}">${t==="all"?"All modules":esc(t)}</button>`).join("")}</div>`:""}
  <section class="mods">
    ${shown.map(m=>{ const i=L.modules.indexOf(m); const q=S(quizKey(lv,m.id),null);
      return `<a class="mod" href="#${lv}.${m.id}">
        <span class="num">${String(i+1).padStart(2,"0")}</span>
        <div style="min-width:0"><h3>${esc(m.title)}</h3><p>${(m.objectives||[]).slice(0,2).map(o=>esc(o)).join(" · ")}</p></div>
        <div class="right">${m.track&&tracks.length>1?`<span class="pill">${esc(m.track)}</span>`:""}<span class="pill">${esc(m.duration||"")}</span>${m.lab?`<span class="pill">Lab</span>`:""}${q? (q.pass?`<span class="pill ok">Passed ${q.score}/${q.total}</span>`:`<span class="pill warn">${q.score}/${q.total}, retake</span>`):""}</div>
      </a>`; }).join("")}
  </section>
  ${L.capstone?`<section class="panel" style="margin-bottom:24px"><div class="eyebrow">Capstone project</div><div class="prose" id="capstone" style="margin-top:10px">${md(L.capstone)}</div></section>`:""}
  <section class="exam-cta">
    <div><h2>${ex&&ex.pass?"You're certified at this level":"Ready for the "+LV_NAME[lv]+" exam?"}</h2><p>${ex?`Best score ${ex.best}% · last attempt ${new Date(ex.at).toLocaleDateString()}`:`${L.exam.questions.length} questions, ${L.exam.timeMinutes} minutes, pass mark ${L.exam.passMark}%.`}</p></div>
    <a class="btn" href="#${lv}.exam">${ex&&ex.pass?"View certificate":"Go to exam"}</a>

  $app.querySelectorAll("[data-track]").forEach(b=>b.addEventListener("click",()=>{ setS(`track:${lv}`, b.dataset.track); level(lv); }));

}

/* ---------- module ---------- */
function module(lv, mid, tab){
  const L=data[lv]; const idx=L.modules.findIndex(m=>m.id===mid); if(idx<0) return go(lv);
  const m=L.modules[idx]; crumbs([{t:"Levels",h:"home"},{t:LV_NAME[lv],h:lv},{t:m.title}]);
  const tabs=[["learn","Lessons"]]; if(m.lab) tabs.push(["lab","Lab"]); tabs.push(["quiz","Knowledge check"]);
  if(!tabs.find(t=>t[0]===tab)) tab="learn";
  const tracks=[...new Set(L.modules.map(x=>x.track).filter(Boolean))];
  let railHtml=""; let lastTrack=null;
  L.modules.forEach((x,i)=>{ if(tracks.length>1 && x.track!==lastTrack){ railHtml+=`<div class="lbl">${esc(x.track)}</div>`; lastTrack=x.track; }
    railHtml+=`<a href="#${lv}.${x.id}" ${x.id===mid?'aria-current="page"':""}><span class="dot ${modDone(lv,x.id)?"done":""}">${modDone(lv,x.id)?"✓":""}</span><span>${esc(x.title)}</span></a>`; });
  railHtml+=`<div class="lbl">Certification</div><a href="#${lv}.exam"><span class="dot ${examRes(lv)?.pass?"done":""}">${examRes(lv)?.pass?"✓":""}</span><span>${LV_NAME[lv]} exam</span></a>`;
  $app.innerHTML = `<div class="reader">
    <nav class="rail" aria-label="Modules">${railHtml}</nav>
    <article class="content">
      <header>
        <div class="eyebrow">Module ${idx+1} of ${L.modules.length}${m.track?" · "+esc(m.track):""} · ${esc(m.duration||"")}</div>
        <h1>${esc(m.title)}</h1>
        <div class="objectives"><ul class="ticks">${(m.objectives||[]).map(o=>`<li>${md(o,true)}</li>`).join("")}</ul></div>
      </header>
      <div class="section-nav" role="tablist">${tabs.map(([k,t])=>`<button role="tab" data-tab="${k}" aria-selected="${k===tab}">${t}${k==="quiz"&&modDone(lv,mid)?" ✓":""}</button>`).join("")}</div>
      <div id="pane"></div>
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px">
        ${idx>0?`<a class="btn" href="#${lv}.${L.modules[idx-1].id}">← ${esc(L.modules[idx-1].title)}</a>`:`<a class="btn" href="#${lv}">← Level overview</a>`}
        ${idx<L.modules.length-1?`<a class="btn primary" href="#${lv}.${L.modules[idx+1].id}">Next: ${esc(L.modules[idx+1].title)} →</a>`:`<a class="btn primary" href="#${lv}.exam">Go to the exam →</a>`}
      </div>
    </article></div>`;
  $app.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>go(`${lv}.${mid}.${b.dataset.tab}`)));
  const pane=document.getElementById("pane");
  if(tab==="learn"){
    pane.innerHTML = (m.lessons||[]).map((l,i)=>`<section class="lesson"><h2><small>${idx+1}.${i+1}</small>${esc(l.title)}</h2><div class="prose">${md(l.body)}</div>${srcLinks(l.sources)}</section>`).join("")
      + `<div class="takeaways"><h3>Key takeaways</h3><ul class="ticks">${(m.takeaways||[]).map(t=>`<li>${md(t,true)}</li>`).join("")}</ul></div>`
      + `<div style="margin-top:20px"><button class="btn primary" data-goto="${m.lab?"lab":"quiz"}">${m.lab?"Start the lab":"Take the knowledge check"} →</button></div>`;
  } else if(tab==="lab"){
    const lab=m.lab; const kk=`lab:${lv}:${mid}`; const st=S(kk,{});
    pane.innerHTML = `<div class="lab-card"><header><div class="eyebrow">Hands-on lab · ${esc(lab.duration||"")}</div><h2>${esc(lab.title)}</h2><p>${md(lab.goal,true)}</p></header>
      <div class="lab-body">
        ${(lab.prereqs&&lab.prereqs.length)?`<div class="eyebrow" style="margin-bottom:8px">You need</div><ul class="ticks" style="margin-bottom:20px">${lab.prereqs.map(p=>`<li>${md(p,true)}</li>`).join("")}</ul>`:""}
        <div class="eyebrow" style="margin-bottom:12px">Steps <span id="labcount"></span></div>
        <ol class="steps">${(lab.steps||[]).map((s,i)=>`<li class="${st[i]?"done":""}"><input type="checkbox" id="step-${lv}-${mid}-${i}" data-i="${i}" ${st[i]?"checked":""} aria-label="Mark step ${i+1} done"><div class="prose"><label for="step-${lv}-${mid}-${i}" class="eyebrow" style="display:block;margin-bottom:4px">Step ${i+1}</label>${md(s)}</div></li>`).join("")}</ol>
        ${lab.verify?`<div class="verify"><div class="eyebrow">Check your work</div><div class="prose" style="margin-top:6px">${md(lab.verify)}</div></div>`:""}
        ${srcLinks(lab.sources)}
      </div></div>
      <div style="margin-top:20px"><button class="btn primary" data-goto="quiz">Take the knowledge check →</button></div>`;
    const upd=()=>{ const s=S(kk,{}); document.getElementById("labcount").textContent=`· ${Object.values(s).filter(Boolean).length}/${lab.steps.length} done`; };
    pane.querySelectorAll(".steps input").forEach(c=>c.addEventListener("change",()=>{ const s=S(kk,{}); s[c.dataset.i]=c.checked; setS(kk,s); c.closest("li").classList.toggle("done",c.checked); upd(); }));
    upd();
  } else quiz(pane, lv, m);
  pane.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>go(`${lv}.${mid}.${b.dataset.goto}`)));
  enhance(pane);
}

/* ---------- quiz (module knowledge check) ---------- */
const LET="ABCD";
function qBlock(q, n, sel, reveal){
  return `<div class="q"><div class="qhead"><span class="qn">Q${n}</span><div class="qtext">${md(q.q)}</div></div>
    <div class="opts">${q.options.map((o,i)=>{ let cls=""; if(reveal){ if(i===q.answer) cls="right"; else if(i===sel) cls="wrong"; }
      return `<button type="button" class="opt ${cls}" data-i="${i}" aria-pressed="${sel===i}" ${reveal?"disabled":""}><span class="k">${LET[i]}</span><span>${md(o,true)}</span></button>`; }).join("")}</div>
    ${reveal?`<div class="explain"><p><b>${sel===q.answer?"Correct.":"Answer: "+LET[q.answer]+"."}</b> ${md(q.explain,true)}</p>${q.source?`<a href="${esc(q.source)}" target="_blank" rel="noopener" style="font-size:13px">Source</a>`:""}</div>`:""}
  </div>`;
}
function quiz(pane, lv, m){
  const k=quizKey(lv,m.id); const prev=S(k,null); let picks=new Array(m.quiz.length).fill(null); let revealed=false;
  const draw=()=>{
    const score=picks.filter((p,i)=>p===m.quiz[i].answer).length; const total=m.quiz.length; const pass=score>=Math.ceil(total*0.8);
    pane.innerHTML = (revealed?`<div class="scorebar ${pass?"pass":"fail"}"><div><b>${score}/${total}</b> <span class="muted">${pass?"Module complete.":"You need "+Math.ceil(total*0.8)+" to complete this module."}</span></div><button class="btn" id="retry">Retake</button></div>`
      : `<p class="muted">${total} questions. Score ${Math.ceil(total*0.8)} or more to complete the module.${prev?` Your best so far: ${prev.best ?? prev.score}/${total}.`:""}</p>`)
      + m.quiz.map((q,i)=>qBlock(q,i+1,picks[i],revealed)).join("")
      + (revealed?"":`<button class="btn primary" id="submitq" ${picks.includes(null)?"disabled":""}>Check answers</button>`);
    enhance(pane);
    pane.querySelectorAll(".q").forEach((qe,qi)=>qe.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{ if(revealed) return; picks[qi]=+b.dataset.i; const y=scrollY; draw(); scrollTo(0,y); })));
    const sb=document.getElementById("submitq"); if(sb) sb.addEventListener("click",()=>{ revealed=true; const sc=picks.filter((p,i)=>p===m.quiz[i].answer).length; const ps=sc>=Math.ceil(total*0.8); const old=S(k,null); setS(k,{score:sc,total,pass:ps||!!old?.pass,best:Math.max(sc,old?.best??0)}); draw(); pane.scrollIntoView({behavior:"smooth"}); });
    const rb=document.getElementById("retry"); if(rb) rb.addEventListener("click",()=>{ picks=picks.map(()=>null); revealed=false; draw(); });
  };
  draw();
}

/* ---------- exam ---------- */
let timerId=null; const stopTimer=()=>{ if(timerId){ clearInterval(timerId); timerId=null; } };
function shuffle(a, seed){ let s=seed||Date.now(); const r=()=>{ s=(s*1664525+1013904223)%4294967296; return s/4294967296; }; const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function hashId(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return (h>>>0).toString(36).toUpperCase().padStart(7,"0"); }
function exam(lv){
  const L=data[lv]; const E=L.exam; crumbs([{t:"Levels",h:"home"},{t:LV_NAME[lv],h:lv},{t:"Exam"}]);
  const ex=examRes(lv);
  const intro=()=>{
    $app.innerHTML = `<section class="exam-intro">
      <div class="eyebrow">${LV_LABEL[lv]} · ${LV_NAME[lv]} certification exam</div>
      <h1>${esc(L.title)} exam</h1>
      <p class="muted">Questions and answer options are shuffled on every attempt. You can flag questions, move freely between them, and submit early. When time runs out, the exam submits automatically.</p>
      <div class="rules"><div><b>${E.questions.length}</b><span>questions</span></div><div><b>${E.timeMinutes}</b><span>minutes</span></div><div><b>${E.passMark}%</b><span>to pass</span></div><div><b>${ex?ex.best+"%":"—"}</b><span>your best</span></div></div>
      <h3 style="font-size:17px;margin-top:24px">Domains covered</h3>
      <table class="domain-table">${(L.examBlueprint||[]).map(d=>`<tr><td>${esc(d.domain)}</td><td>${d.weight}%</td></tr>`).join("")}</table>
      ${ex&&ex.pass?certHtml(lv,ex):""}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="startExam">${ex?"Start a new attempt":"Start the exam"}</button><a class="btn" href="#${lv}">Back to the level</a></div>
    </section>`;
    document.getElementById("startExam").addEventListener("click", run);
    wireCert(lv);
  };
  const run=()=>{
    const seed=Date.now();
    const qs=shuffle(E.questions,seed).map((q,qi)=>{ const order=shuffle([0,1,2,3].slice(0,q.options.length),seed+qi+1); return {...q, options:order.map(i=>q.options[i]), answer:order.indexOf(q.answer)}; });
    const picks=new Array(qs.length).fill(null); const flags=new Set(); let cur=0; let left=E.timeMinutes*60; let done=false;
    const draw=()=>{
      const q=qs[cur];
      $app.innerHTML = `<div class="exam">
        <section style="min-width:0">
          <div class="bar"><span class="eyebrow">Question ${cur+1} of ${qs.length}${q.domain?" · "+esc(q.domain):""}</span>${done?"":`<span class="timer" id="timer"></span>`}</div>
          <div id="qwrap">${qBlock(q,cur+1,picks[cur],done)}</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between">
            <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="prev" ${cur===0?"disabled":""}>← Previous</button><button class="btn" id="next" ${cur===qs.length-1?"disabled":""}>Next →</button></div>
            ${done?`<a class="btn primary" href="#${lv}.exam" id="toIntro">Back to results</a>`:`<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="flag">${flags.has(cur)?"Unflag":"Flag for review"}</button><button class="btn primary" id="finish">Submit exam</button></div>`}
          </div>
          <div id="confirm"></div>
        </section>
        <aside><div class="panel"><h3>${done?"Review":"Questions"}</h3><div class="grid-nav">${qs.map((x,i)=>{ let c=""; if(done) c=picks[i]===x.answer?"right":"wrong"; else { if(picks[i]!==null) c="answered"; if(flags.has(i)) c+=" flag"; } if(i===cur) c+=" cur"; return `<button data-j="${i}" class="${c}" aria-label="Question ${i+1}">${i+1}</button>`; }).join("")}</div>
          <p class="muted" style="font-size:13px;margin:12px 0 0">${done?"Green is correct, red is incorrect.":`${picks.filter(p=>p!==null).length} answered · ${flags.size} flagged`}</p></div></aside>
      </div>`;
      enhance($app);
      $app.querySelectorAll("#qwrap .opt").forEach(b=>b.addEventListener("click",()=>{ if(done) return; picks[cur]=+b.dataset.i; draw(); }));
      $app.querySelectorAll("[data-j]").forEach(b=>b.addEventListener("click",()=>{ cur=+b.dataset.j; draw(); }));
      document.getElementById("prev").addEventListener("click",()=>{ cur--; draw(); });
      document.getElementById("next").addEventListener("click",()=>{ cur++; draw(); });
      const fl=document.getElementById("flag"); if(fl) fl.addEventListener("click",()=>{ flags.has(cur)?flags.delete(cur):flags.add(cur); draw(); });
      const fin=document.getElementById("finish"); if(fin) fin.addEventListener("click",()=>{ const un=picks.filter(p=>p===null).length;
        document.getElementById("confirm").innerHTML=`<div class="panel" style="margin-top:16px"><p style="margin:0 0 12px">${un?`You have ${un} unanswered question${un>1?"s":""}. Unanswered questions count as incorrect.`:"All questions answered."} Submit now?</p><div style="display:flex;gap:10px"><button class="btn primary" id="yes">Submit</button><button class="btn" id="no">Keep working</button></div></div>`;
        document.getElementById("yes").addEventListener("click",submit); document.getElementById("no").addEventListener("click",()=>document.getElementById("confirm").innerHTML=""); });
      tick();
    };
    const tick=()=>{ const t=document.getElementById("timer"); if(!t) return; const mm=Math.floor(left/60), ss=left%60; t.textContent=`${String(mm).padStart(2,"0")}:${String(ss).padStart(2,"0")}`; t.classList.toggle("low", left<120); };
    const submit=()=>{
      stopTimer(); done=true;
      const right=picks.filter((p,i)=>p===qs[i].answer).length; const pct=Math.round(right/qs.length*100); const pass=pct>=E.passMark;
      const doms={}; qs.forEach((q,i)=>{ const d=q.domain||"General"; doms[d]=doms[d]||{r:0,t:0}; doms[d].t++; if(picks[i]===q.answer) doms[d].r++; });
      const old=examRes(lv); const now=Date.now(); const passedAt = pass? (old?.passedAt||now) : old?.passedAt;
      const rec={best:Math.max(pct,old?.best??0), last:pct, pass:pass||!!old?.pass, at:now, passedAt, passScore: pass? Math.max(pct, old?.passScore??0) : old?.passScore,
        credentialId: old?.credentialId || (passedAt ? `DOS-${lv.slice(0,3).toUpperCase()}-${hashId((sync.uid||"local")+lv+passedAt)}` : undefined),
        attempts:[...(old?.attempts||[]), {at:now, pct, pass, domains:Object.fromEntries(Object.entries(doms).map(([d,v])=>[d, `${v.r}/${v.t}`]))}].slice(-20)};
      setS(`exam:${lv}`, rec);
      $app.innerHTML = `<section class="exam-intro">
        <div class="eyebrow">${LV_NAME[lv]} exam result</div>
        <div class="scorebar ${pass?"pass":"fail"}" style="margin-top:12px"><div><b>${pct}%</b> <span class="muted">${right} of ${qs.length} correct · pass mark ${E.passMark}%</span></div><span class="pill ${pass?"ok":"warn"}">${pass?"Passed":"Not passed yet"}</span></div>
        <h3 style="font-size:17px;margin-top:20px">Score by domain</h3>
        <table class="domain-table">${Object.entries(doms).map(([d,v])=>`<tr><td>${esc(d)}<div class="progress" style="margin-top:6px;max-width:320px"><i style="width:${v.r/v.t*100}%"></i></div></td><td>${v.r}/${v.t}</td></tr>`).join("")}</table>
        ${pass?certHtml(lv,rec):`<p>Review the domains where you scored lowest, revisit those modules, then try again.</p>`}
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="review">Review answers</button><button class="btn" id="again">New attempt</button><a class="btn" href="#${lv}">Back to the level</a></div>
      </section>`;
      document.getElementById("review").addEventListener("click",()=>{ cur=0; draw(); });
      document.getElementById("again").addEventListener("click",run);
      wireCert(lv);
    };
    draw();
    timerId=setInterval(()=>{ left--; tick(); if(left<=0){ submit(); } },1000);
  };
  intro();
}
function certHtml(lv, rec){
  const name=S("name",""); const L=data[lv];
  const id=rec.credentialId || `DOS-${lv.slice(0,3).toUpperCase()}-${hashId((sync.uid||"local")+lv+(rec.passedAt||rec.at))}`;
  return `<div class="cert" id="cert"><div class="eyebrow">DataOS Academy · ${LV_LABEL[lv]}</div><h2>${LV_NAME[lv]} certification</h2><div class="muted" style="color:#c4d3d6">${esc(L.title)}</div>
    <div class="who" id="certName">${name?esc(name):"Add your name below"}</div>
    <dl><div><dt>Score</dt><dd>${rec.passScore ?? rec.best}%</dd></div><div><dt>Passed on</dt><dd>${new Date(rec.passedAt||rec.at).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}</dd></div><div><dt>Credential ID</dt><dd>${id}</dd></div></dl></div>
    <div class="field"><label for="nameInput" class="eyebrow">Name on certificate</label><input id="nameInput" type="text" autocomplete="name" value="${esc(name)}" placeholder="Your full name"></div>
    <p class="muted" style="font-size:13px">${sync.ref?"Your pass and credential ID are recorded centrally, so the programme owner can confirm them.":"This result is saved in this browser only."}</p>`;
}
function wireCert(lv){ const i=document.getElementById("nameInput"); if(!i) return;
  if (!i.value && sync.user) sync.user.me().then(me => { if (!i.value && me.name) { i.value = me.name; const n=document.getElementById("certName"); if(n) n.textContent = me.name; } });
  i.addEventListener("input",()=>{ setS("name", i.value.trim()); const n=document.getElementById("certName"); if(n) n.textContent=i.value.trim()||"Add your name below"; }); }

/* ---------- admin: who passed which level ---------- */
let adminUnsub = null; let adminRows = [];
const stopAdmin = () => { if (adminUnsub) { adminUnsub(); adminUnsub = null; } };
async function admin(){
  crumbs([{t:"Levels",h:"home"},{t:"Results"}]);
  const isAdmin = sync.user ? await sync.user.canEdit() : false;
  if (!sync.db || !isAdmin) { $app.innerHTML = `<div class="empty">Results are visible to the course owner and Editors only.</div>`; return; }
  $app.innerHTML = `<section class="admin-head"><div><div class="eyebrow">Programme results</div><h1>Who passed which level</h1><p class="muted" style="margin:8px 0 0">Live from each learner's record. Learners appear after they finish their first knowledge check or exam.</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><label class="eyebrow" for="lvFilter" style="align-self:center">Show</label><select id="lvFilter" class="btn" style="padding:8px 12px"><option value="all">All learners</option>${LEVELS.map(lv=>`<option value="${lv}">Certified: ${LV_NAME[lv]}</option>`).join("")}</select><button class="btn" id="csvBtn" type="button">Export CSV</button></div></section>
    <div id="adminBody"><div class="empty">Loading learner records…</div></div>`;
  document.getElementById("lvFilter").value = S("adminFilter","all");
  document.getElementById("lvFilter").addEventListener("change", e => { setS("adminFilter", e.target.value); drawAdmin(); });
  document.getElementById("csvBtn").addEventListener("click", exportCsv);
  stopAdmin();
  adminUnsub = sync.db.collection("results").onSnapshot(snap => { adminRows = snap.docs.map(d => ({ id: d.id, ...d.data() })); drawAdmin(); },
    () => { const b = document.getElementById("adminBody"); if (b) b.innerHTML = `<div class="notice">The results feed stopped. Reload the page to reconnect.</div>`; });
}
async function drawAdmin(){
  const body = document.getElementById("adminBody"); if (!body) return;
  const f = S("adminFilter","all");
  const rows = adminRows.filter(r => f === "all" || r.levels?.[f]?.pass).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const ps = sync.user ? await sync.user.profiles(adminRows.map(r=>r.learner||r.id)) : {};
  const cert = lv => adminRows.filter(r=>r.levels?.[lv]?.pass).length;
  const fmt = t => t ? new Date(t).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : "";
  const cell = (r, lv) => { const L=r.levels?.[lv]; const mp=r.modulesPassed?.[lv]??0; const tot=data[lv]?.modules.length??0;
    if (L?.pass) return `<td class="cell"><span class="pill ok">Certified ${L.passScore??L.best}%</span><small>${fmt(L.passedAt)} · ${esc(L.credentialId||"")}</small></td>`;
    if (L?.attempts?.length) return `<td class="cell"><span class="pill warn">Best ${L.best}%</span><small>${L.attempts.length} attempt${L.attempts.length>1?"s":""} · ${mp}/${tot} modules</small></td>`;
    if (mp) return `<td class="cell"><span class="pill teal">${mp}/${tot} modules</span><small>No exam yet</small></td>`;
    return `<td class="cell"><span class="muted">—</span></td>`; };
  body.innerHTML = `<div class="kpis"><div><b>${adminRows.length}</b><span>learners</span></div>${LEVELS.map(lv=>`<div><b>${cert(lv)}</b><span>${LV_NAME[lv]} certified</span></div>`).join("")}</div>
    ${rows.length ? `<div class="roster-wrap"><table class="roster"><thead><tr><th>Learner</th>${LEVELS.map(lv=>`<th>${LV_NAME[lv]}</th>`).join("")}<th>Last activity</th></tr></thead><tbody>
      ${rows.map(r => { const p = ps[r.learner||r.id] || {}; return `<tr><td><div class="who"><img alt="" src="${esc(p.avatarUrl||"")}"><div style="min-width:0"><span data-name="${esc(r.id)}"></span><small data-email="${esc(r.id)}"></small></div></div></td>${LEVELS.map(lv=>cell(r,lv)).join("")}<td class="num">${fmt(r.updatedAt)}</td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="empty">${adminRows.length ? "No learner matches this filter yet." : "No learner records yet. Share the course with Contributor access; each learner's record appears after their first knowledge check or exam."}</div>`}
    <p class="muted" style="font-size:13px">Results are recorded by the course page in each learner's browser. Exams are not proctored, so treat these results as self-assessment unless you add supervision.</p>`;
  body.querySelectorAll("[data-name]").forEach(el => { const p = ps[el.dataset.name]; el.textContent = (p && p.name) || "Learner"; });
  body.querySelectorAll("[data-email]").forEach(el => { const p = ps[el.dataset.email]; el.textContent = (p && p.email) || ""; });
}
async function exportCsv(){
  const btn = document.getElementById("csvBtn");
  const dl = await claude.use("downloads");
  if (!dl) { btn.textContent = "Export unavailable here"; btn.disabled = true; return; }
  const ps = sync.user ? await sync.user.profiles(adminRows.map(r=>r.learner||r.id)) : {};
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const head = ["name",...LEVELS.flatMap(lv=>[`${lv}_status`,`${lv}_best_pct`,`${lv}_passed_on`,`${lv}_credential_id`,`${lv}_attempts`,`${lv}_modules_passed`]),"last_activity"];
  const lines = adminRows.map(r => { const p = ps[r.learner||r.id] || {}; return [p.name||"", ...LEVELS.flatMap(lv=>{ const L=r.levels?.[lv]; return [L?.pass?"certified":L?.attempts?.length?"attempted":(r.modulesPassed?.[lv]?"in progress":"not started"), L?.best??"", L?.passedAt?new Date(L.passedAt).toISOString().slice(0,10):"", L?.credentialId??"", L?.attempts?.length??0, r.modulesPassed?.[lv]??0]; }), r.updatedAt?new Date(r.updatedAt).toISOString():""].map(q).join(","); });
  try { await dl.save({ filename: `dataos-certification-results-${new Date().toISOString().slice(0,10)}.csv`, data: [head.join(","), ...lines].join("\n") }); btn.textContent = "Exported"; setTimeout(()=>btn.textContent="Export CSV", 1600); }
  catch (e) { if (e && e.code !== "declined") { btn.textContent = "Couldn't export"; setTimeout(()=>btn.textContent="Export CSV", 2000); } }
}

/* ---------- boot ---------- */
// Course content ships inline (Safari blocks the relative fetch inside the artifact frame); fetch is only a fallback.
function inlineLevel(lv){ const el=document.getElementById("data-"+lv); if(!el) return null; try { return JSON.parse(el.textContent); } catch(e){ return null; } }
Promise.all(LEVELS.map(lv => { const j=inlineLevel(lv); if(j){ data[lv]=j; return null; }
  return fetch(`data/${lv}.json`).then(r=>r.ok?r.json():null).then(j=>{ if(j) data[lv]=j; }).catch(()=>{}); }))
  .then(() => { render(); if (window.claude && typeof claude.use === "function") initSync(); });
})();
</script>
