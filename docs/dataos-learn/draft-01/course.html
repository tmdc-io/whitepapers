<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>DataOS Certification Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a product console. Top bar + certification ladder on home; level pages use a module rail + reading column; exams run full-width, one question at a time. Palette taken from the DataOS docs diagrams. */
:root{
  --ink:#242422; --ink-2:#4f504c; --ink-3:#7a7b76;
  --paper:#ffffff; --sand:#f4f1ee; --sand-2:#ede9e5; --line:#dcd6d0;
  --teal:#009293; --teal-bright:#54ded1; --teal-wash:#e3f6f4;
  --slate:#35505b; --slate-deep:#202f36;
  --oxblood:#733635; --ok:#2d7a4f; --ok-wash:#e6f2ea; --bad:#a33a2f; --bad-wash:#f8e9e6; --warn:#9a6a12; --warn-wash:#f7efdc;
  --code-bg:#202f36; --code-fg:#e8efef;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Hanken Grotesk", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#ecebe7; --ink-2:#c3c4bf; --ink-3:#8f918b;
  --paper:#151c1f; --sand:#1c2528; --sand-2:#243034; --line:#33413f;
  --teal:#54ded1; --teal-bright:#54ded1; --teal-wash:#173a3a;
  --slate:#9fbcc6; --slate-deep:#0f1619;
  --oxblood:#e09a95; --ok:#7fd3a0; --ok-wash:#173528; --bad:#f19a8e; --bad-wash:#3a1f1b; --warn:#e8c172; --warn-wash:#3a2f14;
  --code-bg:#0d1315; --code-fg:#e8efef; color-scheme:dark }}
:root[data-theme="dark"]{
  --ink:#ecebe7; --ink-2:#c3c4bf; --ink-3:#8f918b;
  --paper:#151c1f; --sand:#1c2528; --sand-2:#243034; --line:#33413f;
  --teal:#54ded1; --teal-bright:#54ded1; --teal-wash:#173a3a;
  --slate:#9fbcc6; --slate-deep:#0f1619;
  --oxblood:#e09a95; --ok:#7fd3a0; --ok-wash:#173528; --bad:#f19a8e; --bad-wash:#3a1f1b; --warn:#e8c172; --warn-wash:#3a2f14;
  --code-bg:#0d1315; --code-fg:#e8efef; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:18px}
.brand-mark{width:26px;height:26px;flex:none;fill:currentColor}
.crumbs{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink-3);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumbs a{color:var(--ink-2);text-decoration:none}
.crumbs a:hover{color:var(--teal)}
.top .spacer{flex:1}
.top .btn,.brand{white-space:nowrap}
.docs .sm{display:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--slate-deep);border-color:var(--slate-deep);color:#fff}
:root[data-theme="dark"] .btn.primary{background:var(--teal);border-color:var(--teal);color:#0f1619}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--teal);border-color:var(--teal);color:#0f1619}}
.btn.primary:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.btn[hidden]{display:none}

/* home */
.hero{padding-block:56px 32px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
.hero h1{font-size:clamp(36px,5.4vw,64px);font-weight:700}
.hero h1 em{font-style:normal;color:var(--teal)}
.hero p{font-size:18px;color:var(--ink-2);max-width:56ch;margin:18px 0 0}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hero-stats div{background:var(--sand);padding:16px}
.hero-stats b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:13px;color:var(--ink-2)}

.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-block:8px 48px;align-items:stretch}
.rung{position:relative;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--paper);text-decoration:none;color:var(--ink);transition:border-color .15s, transform .15s}
.rung:hover{border-color:var(--teal);transform:translateY(-2px)}
.rung .step{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.rung .lvl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.rung h2{font-size:24px}
.rung p{margin:0;color:var(--ink-2);font-size:15px}
.rung .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-3);font-family:var(--f-mono)}
.rung .bars{display:flex;gap:3px;height:48px;align-items:end;margin-top:auto}
.rung .bars i{flex:1;background:var(--sand-2);border-radius:3px}
.rung .bars i.on{background:var(--teal)}
.rung.locked{opacity:.6}
.progress{height:6px;border-radius:99px;background:var(--sand-2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--teal);border-radius:99px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--sand-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-wash);color:var(--ok)}
.pill.teal{background:var(--teal-wash);color:var(--teal)}
.pill.warn{background:var(--warn-wash);color:var(--warn)}

.about{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-block:32px 64px;border-top:1px solid var(--line)}
.about h3{font-size:18px;margin-bottom:8px}
.about p{margin:0;color:var(--ink-2);font-size:15px}

/* level */
.level-head{padding-block:40px 24px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px}
.level-head h1{font-size:clamp(30px,4vw,46px);margin-top:6px}
.level-head .lead{font-size:17px;color:var(--ink-2);margin:12px 0 0;max-width:60ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin-top:20px}
.facts dt{color:var(--ink-3);font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.facts dd{margin:0}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--sand);padding:20px}
.panel h3{font-size:16px;margin-bottom:12px}
.blue{display:grid;gap:8px}
.blue div{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.blue .track{grid-column:1/-1;height:6px;background:var(--sand-2);border-radius:99px;overflow:hidden}
.blue .track i{display:block;height:100%;background:var(--slate)}
.blue b{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-weight:500}
ul.ticks{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.ticks li{position:relative;padding-left:22px}
ul.ticks li::before{content:"";position:absolute;left:2px;top:.55em;width:10px;height:6px;border-left:2px solid var(--teal);border-bottom:2px solid var(--teal);transform:rotate(-45deg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-block:8px 16px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mods{display:grid;gap:10px;padding-bottom:24px}
.mod{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-decoration:none;color:var(--ink);background:var(--paper)}
.mod:hover{border-color:var(--teal)}
.mod .num{font-family:var(--f-mono);font-size:13px;color:var(--ink-3)}
.mod h3{font-size:18px}
.mod p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.mod .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.exam-cta{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;border-radius:var(--r);padding:24px;background:var(--slate-deep);color:#eef3f3;margin-bottom:56px}
.exam-cta h2{font-size:24px;color:#fff}
.exam-cta p{margin:6px 0 0;color:#b9c9cc}
.exam-cta .btn{background:var(--teal-bright);border-color:var(--teal-bright);color:#0f1619}

/* module reader */
.reader{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;padding-block:28px 64px}
.rail{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 74px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;display:grid;gap:4px;padding-right:4px}
.rail a{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:14px;line-height:1.35}
.rail a:hover{background:var(--sand)}
.rail a[aria-current="page"]{background:var(--teal-wash);color:var(--ink);font-weight:600}
.rail .dot{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px}
.rail .dot.done{background:var(--teal);border-color:var(--teal);color:#fff}
.rail .lbl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:12px 10px 4px}
.content{min-width:0;max-width:780px}
.content > header h1{font-size:clamp(28px,3.6vw,40px);margin-top:8px}
.objectives{margin-top:20px}
.section-nav{display:flex;gap:6px;flex-wrap:wrap;margin:28px 0 8px;border-bottom:1px solid var(--line)}
.section-nav button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.section-nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal)}
.lesson{padding-block:20px;border-bottom:1px solid var(--line)}
.lesson:last-child{border-bottom:0}
.lesson > h2{font-size:26px;margin-bottom:6px;display:flex;gap:12px;align-items:baseline}
.lesson > h2 small{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);font-weight:400}
.prose{font-size:16.5px}
.prose p,.prose ul,.prose ol{margin:0 0 14px;max-width:68ch}
.prose h3{font-size:20px;margin:26px 0 10px}
.prose h4{font-size:17px;margin:20px 0 8px}
.prose li{margin-bottom:4px}
.prose code{font-family:var(--f-mono);font-size:.88em;background:var(--sand-2);padding:1px 5px;border-radius:4px}
.prose pre{position:relative;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 16px}
.prose pre code{background:none;padding:0;font-size:inherit;color:inherit}
.prose blockquote{margin:0 0 16px;padding:12px 16px;border-radius:8px;background:var(--teal-wash);border-left:3px solid var(--teal)}
.prose blockquote.warn{background:var(--warn-wash);border-left-color:var(--warn)}
.prose blockquote p:last-child{margin:0}
.prose .tbl{overflow-x:auto;margin:0 0 16px}
.prose table{border-collapse:collapse;font-size:14.5px;min-width:100%}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.prose th{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:500}
.copy{position:absolute;top:8px;right:8px;font-family:var(--f-mono);font-size:11px;border:1px solid #ffffff33;background:#ffffff14;color:#dfe9ea;border-radius:6px;padding:3px 8px}
.readmore{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.readmore .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.readmore ul{list-style:disc;margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.readmore li::marker{color:var(--teal)}
.lab-card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:20px}
.lab-card > header{background:var(--slate-deep);color:#eef3f3;padding:18px 20px}
.lab-card > header h2{font-size:22px;color:#fff;margin-top:4px}
.lab-card > header .eyebrow{color:#9fbcc6}
.lab-card > header p{margin:6px 0 0;color:#c4d3d6}
.lab-body{padding:20px}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;counter-increment:s}
.steps input{width:20px;height:20px;margin-top:3px;accent-color:var(--teal)}
.steps .prose{min-width:0}
.steps li.done .prose{opacity:.6}
.verify{margin-top:20px;padding:14px 16px;border-radius:8px;background:var(--ok-wash)}
.verify .eyebrow{color:var(--ok)}
.takeaways{margin-top:28px;padding:20px;border-radius:var(--r);background:var(--sand)}
.takeaways h3{font-size:17px;margin-bottom:12px}

/* quiz & exam */
.q{border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.q .qhead{display:flex;gap:12px;align-items:baseline}
.q .qn{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);flex:none}
.q .qtext{font-weight:600;font-size:16.5px;min-width:0}
.q .qtext p{margin:0}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt .k{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-wash)}
.opt[aria-pressed="true"] .k{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-wash)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt code{font-family:var(--f-mono);font-size:.88em;background:var(--sand-2);padding:1px 4px;border-radius:4px}
.explain{margin-top:12px;font-size:14.5px;padding:12px 14px;border-radius:8px;background:var(--sand)}
.explain p{margin:0 0 6px}
.scorebar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:16px 20px;border-radius:var(--r);margin:8px 0 18px}
.scorebar.pass{background:var(--ok-wash)}
.scorebar.fail{background:var(--bad-wash)}
.scorebar b{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}

.exam{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:32px;padding-block:28px 64px}
.exam .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.grid-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.grid-nav button{height:36px;border:1px solid var(--line);background:var(--paper);border-radius:6px;font-family:var(--f-mono);font-size:12px}
.grid-nav button.answered{background:var(--teal-wash);border-color:var(--teal)}
.grid-nav button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.grid-nav button.cur{outline:2px solid var(--ink);outline-offset:1px}
.grid-nav button.right{background:var(--ok-wash);border-color:var(--ok)}
.grid-nav button.wrong{background:var(--bad-wash);border-color:var(--bad)}
.exam-intro{max-width:760px;padding-block:40px 64px}
.exam-intro h1{font-size:clamp(28px,4vw,42px);margin:6px 0 12px}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:20px 0}
.rules div{background:var(--sand);padding:14px}
.rules b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.rules span{font-size:13px;color:var(--ink-2)}
.domain-table{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0 20px}
.domain-table td{padding:8px 0;border-bottom:1px solid var(--line)}
.domain-table td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;width:90px}

.cert{position:relative;border-radius:14px;padding:36px;margin:24px 0;background:var(--slate-deep);color:#eef3f3;overflow:hidden}
.cert::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:40px;transform:rotate(18deg);background:linear-gradient(135deg,#54ded133,#00929300);border:1px solid #54ded144}
.cert .eyebrow{color:#9fbcc6}
.cert h2{color:#fff;font-size:clamp(26px,3.6vw,38px);margin:10px 0 4px}
.cert .who{font-family:var(--f-display);font-size:24px;color:var(--teal-bright);margin-top:18px}
.cert dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0 0}
.cert dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9fbcc6}
.cert dd{margin:2px 0 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.field{display:grid;gap:6px;max-width:360px;margin-top:8px}
.field input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.empty{padding:80px 0;text-align:center;color:var(--ink-2)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.on::before{background:var(--ok)}
.sync.err::before{background:var(--warn)}
.admin-head{padding-block:40px 20px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.admin-head h1{font-size:clamp(28px,4vw,42px);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.kpis div{background:var(--sand);padding:14px 16px}
.kpis b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}

<script type="application/json" id="data-primer">{"id":"primer","title":"Foundations","tagline":"Why Data Products exist, what they are, and how DataOS builds, runs, and serves them.","audience":"This course is for anyone new to DataOS: data engineers, data product developers, analysts, and platform operators. You do not need prior DataOS experience.","prerequisites":["Basic knowledge of tables, SQL, and data warehouses or lakehouses","You do not need a DataOS account or a hands-on setup"],"duration":"~3 hours","outcomes":["Explain the half-product problem, tool drift, and why AI agents make these problems more serious","Give the formal definition of a Data Product, list its eight properties, and identify what is not a Data Product","Describe ETL, ELT, and ELP, and explain what 'Productize absorbs Transform' means","Take a business question through Discover, Design, Build, Publish, and Consume with the Orders Analytics example","Describe how DataOS builds a product through Understand, Move (Nilus), and Productize (Vulcan), with Secrets, Depots, and engines","Describe the DataOS architecture (Instance, Data Plane, Tenants), and classify Resources as runnable or non-runnable","Match DataOS roles to their responsibilities, and choose a consumption path for a given deliverable"],"examBlueprint":[{"domain":"The half-product problem","weight":15},{"domain":"What a Data Product is","weight":20},{"domain":"Product thinking and the journey","weight":15},{"domain":"How DataOS builds","weight":20},{"domain":"The platform at a glance","weight":15},{"domain":"Roles and consumption","weight":15}],"modules":[{"id":"p1","title":"The half-product problem","duration":"25 min","objectives":["Explain why ELT is a correct pattern and what problem it does not solve","Describe the half-product problem with the five things that a table does not carry","Explain how a stack of separate tools causes drift","Explain why drift is more dangerous for AI agents than for human consumers"],"lessons":[{"title":"Right numbers, half a product","body":"### Start with a table that you are proud of\n\nPicture the `orders` table that your team maintains. The joins are correct. The table handles the late-arriving rows. Every number agrees with the numbers from finance. By any engineering standard, it is a good table. But the DataOS docs make a strong claim about it: **the numbers are right, and the table is still half a product.**\n\nTo understand why, you must first know what is *not* broken.\n\n### ELT is correct\n\nMost modern teams use **ELT**. ELT has three steps: Extract raw data from a source, Load it as-is into a warehouse or lakehouse, and then Transform it in place. The DataOS docs state clearly that this pattern is sound:\n\n- **Storage is cheap**, so you can keep the raw layer.\n- **Compute is elastic**, so you can transform the data after you load it, not before.\n- **The raw layer survives**, so a wrong join is an edit that you run again. You do not ingest again from a source system that possibly no longer has the data.\n\nNothing in this course asks you to stop using the strengths of ELT. The problem is in a different place.\n\n### What ELT does not do\n\nELT solves the problem of **producing** a transformed table. It does nothing for **consuming** one. A table carries exactly two things: its rows and its schema. A table does not carry the items in this table:\n\n| A consumer needs to know... | Where that knowledge usually is |\n|---|---|\n| How to find the table | The memory of a colleague, a Slack thread |\n| If the data for today is fresh enough to trust | A dashboard that another person maintains, or nowhere |\n| Who can see which rows | A separate governance tool, or a ticket queue |\n| What a column means | A wiki page, or the head of one analyst |\n| Where to report a broken table | Unknown |\n\nThe docs call this missing half the **half-product problem**. The table is a correct *output*. But only the person who built it can use it safely, because only that person has the context.\n\n> **Note:** The docs give a typical example. Everyone on the team \"just knows\" that `revenue` means *net of refunds*. Nothing in the table says so. A new analyst, an application developer, or an AI agent cannot learn this from the data itself.\n\n### Why this matters to every role\n\n- **Data engineers** become a permanent help desk. They answer \"which table should I use?\" and \"is this number right?\"\n- **Consumers** trust the data blindly, or they rebuild their own copy of the logic in a BI tool or spreadsheet. This creates competing definitions of the same metric.\n- **Platform operators** get a large number of tables that nobody can retire with confidence. Nobody knows who depends on these tables.\n\n### Explore\n\nOpen the [DataOS Philosophy](https://v2.dataos.info/readme-1) page. Read the first section, \"Your numbers are right. The table still is not usable.\" Then select one table that you use today. Write down which of the five items in the table above it does not have. Keep that list. In module p2, you map each item to a Data Product property.\n\n### Key idea to remember\n\nThe quality of the transformation is not the problem. The problem is that the knowledge to *consume* the result travels separately from the result. All of this course follows from closing that gap. This includes how DataOS builds products.","sources":["https://v2.dataos.info/readme-1","https://v2.dataos.info/readme"]},{"title":"Tool stacks, drift, and why agents raise the stakes","body":"### The usual fix: put tools around the table\n\nWhen teams see the half-product problem, they usually buy or build one tool for each missing piece:\n\n- A **catalog** for discovery\n- A **quality platform** for freshness and checks\n- A **governance tool** for access\n- A **semantic layer** for definitions\n\nThe DataOS docs are fair about this. Each tool is a real product that solves a real gap. The problem is in the structure. Each tool is a **separate system with its own copy of your table's description and its own clock**. This causes one failure that no amount of integration can remove: **the tools drift away from the table that they describe.**\n\n### What drift looks like\n\nThe docs show one ordinary change. The transform team corrects `revenue` from *gross* to *net of refunds*. The column and the data type stay the same. Every query still runs and still returns a number.\n\n```text\nMonday     transform    revenue corrected: gross → net of refunds (same column, same type)\nMonday →   semantics    layer still defines revenue as gross; every query returns the old meaning, green\nMonday →   quality      freshness and row counts pass; checks watch shape, not meaning\nMonday →   governance   policy still guards the deprecated gross table, not the live one\nThursday   catalog      re-crawls, still labels revenue \"gross sales\" until someone edits the description\n```\n\nFor three days, four systems describe a `revenue` that no longer exists. **None of them raise an alarm.** Drift does not fail loudly. It waits until a person trusts an out-of-date definition and acts on a wrong decision.\n\n> **Warning:** The quality checks *passed*. Checks that watch shape (row counts, nulls, freshness) cannot find a change in meaning. \"Green\" is not the same as \"correct.\"\n\nTeams fight drift with people. They use tickets, sprints, and a recurring meeting with only one job: to keep the tools in agreement with each other. Each change causes more work in three other systems, and the tools never fully come into agreement.\n\n### Why AI agents raise the stakes\n\nA human analyst corrects for drift without noticing it. Last week, the analyst heard that revenue moved to net of refunds. The catalog still says \"gross,\" but the analyst quietly uses the correct figure. That context is only in the head of the analyst.\n\nAn **AI agent does not have that context**. You ask it \"what was Q3 revenue?\" It uses whatever the catalog still approves. It does this at machine speed, and no person is in the loop. The docs show the result:\n\n| Asked by | Answer | What it used |\n|---|---|---|\n| Analyst | $4.21M | Net of refunds, authoritative source |\n| Agent | $4.88M | Gross, deprecated table, no flag |\n\nThe model is not the problem. The data under the model is the problem. If you point an agent at a drifted stack, it returns the wrong answer **with the same confidence as the right one**. While only humans consumed data, the half-product problem was expensive. When machines consume data, it becomes dangerous.\n\n### The fix is one object, not one more layer\n\nBad tools do not cause drift. **Separation** causes drift. Semantics, quality, and access each live in their own system on their own clock. A fifth tool adds a fifth clock.\n\nThe only way to remove drift is to remove the separation. You write the semantics, the contract, the quality rules, and the access policy **with the data, as one object**. Then a change to the data *is* a change to its definition, because they are the same edit. Nothing remains to sync.\n\nThat one object is a **Data Product**. Module p2 gives its exact definition.\n\n### Explore\n\nRead the drift timeline in [DataOS Philosophy](https://v2.dataos.info/readme-1) again. For each of the four tools, write one sentence. Say what must happen for the tool to \"notice\" the revenue change. Each answer requires a person to remember to do something.","sources":["https://v2.dataos.info/readme-1"]}],"lab":null,"takeaways":["ELT is correct. Storage is cheap, compute is elastic, and the raw layer survives. This makes ELT the right way to produce tables.","ELT produces a table, but it does nothing for consuming the table. The table is half a product.","A table carries rows and a schema. It does not carry discoverability, freshness, access rules, meaning, or an owner to report to.","Separate catalog, quality, governance, and semantic tools each keep their own clock. Because of this, the tools drift away from the table.","Drift is silent. When the meaning changes, checks that watch shape stay green.","AI agents do not have human context. They use drifted definitions with confidence and at machine speed."],"quiz":[{"q":"According to the DataOS docs, what is wrong with ELT?","options":["It deletes the raw data, so you must ingest again to fix mistakes","Nothing is wrong with how it makes tables. It does nothing for consuming them.","It needs a scarce warehouse, so transforms must run before loading","It cannot handle late-arriving data"],"answer":1,"explain":"The docs say that ELT is correct. Storage is cheap, compute is elastic, and the raw layer survives. The gap is in consumption. Deleting the raw layer describes ETL, not ELT.","source":"https://v2.dataos.info/readme-1"},{"q":"Which of these does a plain table carry on its own?","options":["Its rows and its schema","Its freshness guarantee","Who may see which rows","What each column means in business terms"],"answer":0,"explain":"A table carries only rows and schema. Freshness, access rules, and meaning live in other places. This is the half-product problem.","source":"https://v2.dataos.info/readme-1"},{"q":"The transform team changes `revenue` from gross to net of refunds. The column name and type stay the same. Why do the quality checks still pass?","options":["Quality checks run only once a week","The governance tool stops the checks from running","The checks watch shape (freshness, row counts), not meaning","Quality tools automatically use the new definition"],"answer":2,"explain":"In the drift example from the docs, freshness and row-count checks pass because they watch shape, not meaning. This is why drift is silent.","source":"https://v2.dataos.info/readme-1"},{"q":"In the DataOS docs, what is the root cause of drift?","options":["Catalog and quality tools that are badly built","Too few integrations between the tools","Analysts who do not read the wiki","Separation: semantics, quality, and access each have their own system and clock"],"answer":3,"explain":"The docs state that bad tools do not cause drift. Separation causes it. More integrations or one more tool add one more clock. They do not remove the problem.","source":"https://v2.dataos.info/readme-1"},{"q":"When AI agents consume data, why is the half-product problem dangerous?","options":["Agents are slower than humans, so out-of-date data builds up","Agents lack the human context that corrects drift, so they answer wrongly with confidence","Agents cannot read tables that have a semantic layer","Agents always use the most recent table version"],"answer":1,"explain":"A human remembers that revenue moved to net of refunds. An agent uses whatever the catalog approves. It returns the wrong number with the same confidence as a right one.","source":"https://v2.dataos.info/readme-1"}]},{"id":"p2","title":"What a Data Product is","duration":"30 min","objectives":["State the formal DataOS definition of a Data Product and its five main elements","Name and explain the eight properties of a Data Product","Tell a Data Product apart from a raw table, a dashboard, a pipeline, and a federated alias","Explain the sequence ETL → ELT → ELP and what 'Productize absorbs Transform' means","Recognize the main glossary terms that a finished product carries (contract, SLA, semantic model, metric)"],"lessons":[{"title":"The definition and the eight properties","body":"### Two definitions, one idea\n\nThe DataOS docs give two definitions of a Data Product. The informal definition is the easiest to remember:\n\n> **Note:** A Data Product is data you can hand to someone, or something, that never met you, and trust them to use it correctly.\n\nThe formal definition is precise enough to test a candidate against:\n\n> A **self-contained, managed unit of data** with a **named owner**, a **published contract**, **named consumers both human and machine**, and a **versioned lifecycle**.\n\nEach phrase has a specific meaning:\n\n| Phrase | What it includes or excludes |\n|---|---|\n| Self-contained, managed unit | Everything that you need to use it travels with it. A person actively runs it. |\n| Named owner | A person or team is accountable for it, and consumers can find that person or team. |\n| Published contract | It gives clear guarantees about schema, semantics, quality, SLAs, and versioning. |\n| Named consumers, human and machine | Its design targets specific users, which include applications and AI agents. |\n| Versioned lifecycle | It changes through versions, so changes do not surprise consumers. |\n\nThe DataOS glossary defines the **Contract** as \"the published guarantees a Data Product makes about its data: schema, semantics, quality rules, SLAs, and versioning policy.\" It defines an **SLA** as the product's \"published, measurable commitments on freshness, availability, completeness, and quality.\"\n\n### The eight properties\n\nThe DataOS Philosophy page states that **eight properties define a Data Product**. Each property earns its place \"by what it removes from your week.\" The list below follows the Modern Data 101 framework, which the docs build on:\n\n| Property | What it means | What it removes from your week |\n|---|---|---|\n| **Discoverable** | You can find it by title, tags, filters, and search | \"Does a table for this exist?\" messages |\n| **Addressable** | It has a unique, stable address | Searches for the right path or copy |\n| **Understandable** | It carries descriptions, semantics, profiles, and usage | The wiki and the one analyst who \"knows\" |\n| **Natively accessible** | Each consumer gets an interface that suits it (SQL, BI, APIs, AI) | Exports and one-off extracts |\n| **Trustworthy** | It shows quality, freshness, and run signals | \"Is this number right?\" escalations |\n| **Interoperable** | It works with other products and systems | Rebuilt logic to join data across sources |\n| **Independent (self-contained)** | Its dependencies live inside the product | Surprise breakage from a change that someone else makes |\n| **Secure** | Access and masking policies are part of the product | Separate access tickets and accidental leaks |\n\n> **Tip:** The docs name one property that \"does the real work,\" although you cannot see it: **a change to the data is a change to its definition, because they are the same edit.** This is the self-contained property applied to meaning. It closes the window for drift that you met in module p1.\n\n### Map the properties to the half-product problem\n\nIn module p1, you made a list of what your table does not have. Each gap maps to a property:\n\n- \"How do I find it?\" → Discoverable, Addressable\n- \"Is today's data fresh enough?\" → Trustworthy\n- \"Who may see which rows?\" → Secure\n- \"What does this column mean?\" → Understandable\n- \"Where do I report problems?\" → the named owner in the formal definition\n\n### Explore\n\nOpen [DataOS Philosophy](https://v2.dataos.info/readme-1). Find the figure of the eight properties under \"The fix is not another layer.\" Compare its labels with the table above. Write down any differences for your own reference.","sources":["https://v2.dataos.info/readme-1","https://v2.dataos.info/references/glossary","https://www.moderndata101.com/chapters/introduction-to-data-products"]},{"title":"What it is not, and ETL → ELT → ELP","body":"### Where the boundary is\n\nA useful definition excludes things. The DataOS docs are direct: a Data Product is **not**\n\n1. **a raw table dumped in the warehouse,**\n2. **a dashboard,**\n3. **a pipeline,**\n4. **a query alias that federates sources no one owns.**\n\nThe formal definition shows why each one fails the test.\n\n| Candidate | Why it is not a Data Product |\n|---|---|\n| Raw table | It has rows and a schema, but no owner, contract, or declared consumers. This is the half product from module p1. |\n| Dashboard | It is a *consumption* surface. It reads from data. It does not publish a contract that others can build on. |\n| Pipeline | It is plumbing. It moves or transforms data, but it guarantees nothing about quality or meaning. The docs say: \"The pipeline is plumbing. The product is the owned, contracted output built on top of it.\" |\n| Federated alias | It points at sources that no one owns. Thus nothing durable exists for a contract to bind to. The docs say: \"That is a query, not a product.\" |\n\n> **Warning:** The docs say that this definition \"will reject things you call Data Products today.\" This is intentional. If you call a shared view a product, the view does not get an owner or a contract.\n\nThe docs give two more cautions:\n\n- **It does not rescue a bad model.** Modeling is still the craft. If you wrap a product around a confused schema, you get a confused product with a contract.\n- **Fitness is per consumer.** A product for a dashboard is not automatically fit for an agent. Data summarized for human readers often lacks the detail that a model needs.\n\n### ETL → ELT → ELP\n\nThe Data Product is not a new tool. The docs present it as **the third pattern** in a sequence that you already work inside.\n\n| Pattern | What it did | Where it stopped |\n|---|---|---|\n| **ETL** | It transformed data before the load, to spare a scarce warehouse | It discarded the raw data. A wrong join meant a new ingest from a source that possibly no longer existed. |\n| **ELT** | When storage became cheap, it loaded raw data, then transformed it in place | It produced a correct table that only its author can safely use. Teams bolt on everything else, and those additions drift. |\n| **ELP** | It loads raw data, then *productizes*: it folds the transform into one authored object | This is the current pattern. Semantics, contract, policy, and serving are part of the object. |\n\n**ELP** stands for **Extract, Load, Productize**. The glossary describes it as the pattern in which \"productization absorbs the transformation phase.\" The docs give a one-line summary: **Productize absorbs Transform.** You still write transformations. But they stop being a phase that you surround with tools, and they become a property of the product.\n\n```text\nExtract  →  Load raw  →  Productize (one authored object)\n                          ├─ Semantic model: measures, contracts\n                          ├─ Physical assets: tables, views\n                          └─ Governance, SLAs, serving: API + AI\n```\n\nThe docs add a line that is easy to miss: **\"ELP is the pattern. DataOS is one implementation of it.\"** You learn a discipline here, and DataOS is the platform that makes it practical.\n\n### It is software engineering applied to data\n\n| In software you already... | A Data Product asks the same of data |\n|---|---|\n| Write a spec before the code | Write a product spec first: its consumers, the questions it answers, and what is out of scope |\n| Publish an interface, hide the implementation | Declare schema, semantics, and SLA. Consumers bind to the contract, not to storage paths. |\n| Let tests gate the merge | Quality runs in the build and blocks publication |\n| Version the API. Deprecate, do not break. | Schema and meaning change through versions |\n\nThe cost is **more work up front**, because a spec and a contract come before the pipeline. In return, the reconciliation program from module p1 disappears.","sources":["https://v2.dataos.info/readme-1","https://v2.dataos.info/references/glossary","https://www.moderndata101.com/blogs/what-are-data-products-the-complete-guide"]},{"title":"The anatomy of a Data Product","body":"### What travels inside a Data Product\n\nModules p4 and p5 cover *how* DataOS builds and runs products. First, learn the words for what a finished product carries. You will see these terms in the Data Product Hub and in the docs. All definitions below come from the DataOS glossary.\n\n### The meaning layer\n\n- **Semantic Model**: \"the business-facing interface for one physical model: dimensions, measures, segments, joins, and descriptions. Consumers query semantic models instead of raw tables.\"\n- **Measure**: a numeric field that you can aggregate, for example total revenue or order count.\n- **Dimension**: a categorical field that you use to filter, group, or slice data, such as customer segment or region.\n- **Segment**: a predefined filter, such as \"corporate customers only,\" that consumers can apply without writing SQL.\n- **Metric**: \"a governed time-series definition built from a measure, time column, granularity, and optional dimensions or segments. Defined once and reused consistently.\"\n\nIn the Orders Analytics example, `revenue` has one definition as a measure. A revenue metric turns it into a time series. Every dashboard, API, and agent reads that same definition. This stops the drift that you saw in module p1.\n\n### The trust layer\n\n- **Contract**: schema, semantics, quality rules, SLAs, and versioning policy.\n- **SLA**: measurable commitments on freshness, availability, completeness, and quality.\n- **Freshness**: how recently the product's data reflects its sources. Hub trust signals show it.\n- **Assertions**: blocking quality rules that stop bad data from moving forward.\n- **In-band Validation**: quality validation that runs *inside* the build or deploy flow. It can block bad data before publication.\n- **Lineage**: how data flows from source assets through transformations, outputs, semantic models, metrics, and downstream consumers.\n\n> **Note:** \"In-band\" is the key word. In the tool-stacking world, quality is an alert that you get after bad data ships. In a Data Product, quality is a gate that the data must pass before it ships.\n\n### The access layer\n\n- **Policy**: access controls, data masking, and row and column rules scoped to data or products.\n- **Governance**: classification, access, retention, tier rules, and compliance policies that all Data Product teams operate within.\n\n### The consumption layer\n\n- **Perspective**: a saved, reusable result created from a validated Data Product query, with its own API.\n- **Activation**: the connection of downstream tools, such as BI, APIs, and notebooks, to the product's semantic layer \"so every surface reads the same governed definitions.\"\n- **MCP**: Model Context Protocol. In DataOS, the Data Product MCP lets supported AI clients search, inspect, and query governed Data Products.\n\n### How the layers map to the properties\n\nEach layer delivers some of the eight properties:\n\n| Layer | Properties it delivers |\n|---|---|\n| Meaning (semantic models, metrics) | Understandable, Interoperable |\n| Trust (contract, SLA, assertions, lineage) | Trustworthy |\n| Access (policies) | Secure |\n| Consumption (Hub, activation paths, MCP) | Discoverable, Addressable, Natively accessible |\n| All of the above authored as one object | Independent (self-contained) |\n\n### Explore\n\nSkim the [Glossary](https://v2.dataos.info/references/glossary). Find three terms that this lesson does not cover (for example **Overlay**, **Engine**, or **Perspective**). Write a one-line explanation of each term in your own words.","sources":["https://v2.dataos.info/references/glossary","https://v2.dataos.info/build/productize/overview"]}],"lab":null,"takeaways":["The formal definition: a Data Product is a self-contained, managed unit of data. It has a named owner, a published contract, named human and machine consumers, and a versioned lifecycle.","The eight properties are: discoverable, addressable, understandable, natively accessible, trustworthy, interoperable, independent, secure.","Raw tables, dashboards, pipelines, and federated aliases are not Data Products.","ELP (Extract, Load, Productize) comes after ETL and ELT. In ELP, Productize absorbs Transform.","A contract covers schema, semantics, quality rules, SLAs, and versioning policy.","ELP is the pattern. DataOS is one implementation of it."],"quiz":[{"q":"Which element is NOT part of the formal DataOS definition of a Data Product?","options":["A named owner","A published contract","A dedicated BI dashboard","A versioned lifecycle"],"answer":2,"explain":"The formal definition names a self-contained, managed unit of data. That unit has a named owner, a published contract, named human and machine consumers, and a versioned lifecycle. A dashboard is a consumption surface. It is not part of the definition.","source":"https://v2.dataos.info/readme-1"},{"q":"A team exposes a view that federates three source systems. The team owns none of them, but it calls the view a Data Product. How do the docs classify it?","options":["As a query, because nothing durable exists for a contract to bind to","As a valid Data Product, because people can discover it","As a pipeline","As a Perspective"],"answer":0,"explain":"A federated alias points at sources that you do not own. The docs say that it has nothing durable for a contract to bind to: 'That is a query, not a product.'","source":"https://v2.dataos.info/readme-1"},{"q":"What does 'Productize absorbs Transform' mean in ELP?","options":["Transformations are no longer needed","Transformation happens before loading, as in ETL","Transformation moves out of the product to the BI layer","The transform joins semantics, contract, policy, and serving in one authored object"],"answer":3,"explain":"In ELP, the transform stops being a phase surrounded by tools. It becomes a property of the product. Transforms still exist, but the product now contains them.","source":"https://v2.dataos.info/references/glossary"},{"q":"Which property means that a product's dependencies live inside the product, so a change by someone else does not silently break it?","options":["Addressable","Independent (self-contained)","Interoperable","Natively accessible"],"answer":1,"explain":"Independent (self-contained) means that the dependencies are inside the product. Interoperable means that the product works with other products and systems.","source":"https://www.moderndata101.com/chapters/introduction-to-data-products"},{"q":"According to the DataOS glossary, what does a Data Product's contract include?","options":["Only the table schema","The pipeline schedule and compute size","Schema, semantics, quality rules, SLAs, and versioning policy","The list of dashboards built on the product"],"answer":2,"explain":"The glossary defines the contract as the published guarantees about schema, semantics, quality rules, SLAs, and versioning policy. A plain table already has a schema, and only a schema.","source":"https://v2.dataos.info/references/glossary"}]},{"id":"p3","title":"Product thinking and the Data Product journey","duration":"35 min","objectives":["Apply product thinking to data: consumers first, value against cost, and say no often","Explain \"think right-to-left, build left-to-right\" and contract-first design","Follow the Orders Analytics example through Discover, Design, Build, Publish, and Consume","Map the Design/Develop/Deploy/Evolve lifecycle to the DataOS journey","Tell the Data Product Manager responsibilities apart from the Data Product Owner responsibilities"],"lessons":[{"title":"Product thinking, right-to-left, and contract-first","body":"### Product thinking for data\n\n**Product thinking** is a way to build things that solve real user problems and also serve business goals. These things are valuable, usable, and desirable. Modern Data 101 lists its key elements as **user-centric, data-driven, iterative, collaborative**, and guided by **visionary leadership**.\n\nFor data, product thinking means the following:\n\n- **Identify the consumers first.** A product without named consumers is only a table that waits for a reason to exist.\n- **Weigh value against cost.** You must maintain, test, and govern every metric and column that you add.\n- **Start with a minimum viable product and success metrics.** Then improve the product in small steps.\n- **Say \"no\" often.** Modern Data 101 calls this essentialism, \"less but better.\" A product that tries to answer every question answers none of them well.\n\n### Think right-to-left, build left-to-right\n\nThe DataOS Data Product Journey describes the work in **two directions**:\n\n```text\nThink right-to-left:  start from the business outcome, then shape the contract\nBuild  left-to-right:  create the artifacts, then deliver a trusted product\n```\n\nTraditional data work starts on the left, with the sources: \"We have these tables, what can we build?\" Product thinking starts on the right, with the consumer: \"Someone needs to answer this question, what must be true for them to trust the answer?\" After that, you work backward to the tables that you need.\n\nThe docs say that designing from the consumer backward \"is what keeps the product purpose-built. You decide what question it answers before you decide what tables it needs.\"\n\n> **Tip:** Use this quick test for right-to-left thinking. Can you name the consumer and the question *before* you name any source table? If you cannot, you still think left-to-right.\n\n### Contract-first\n\nRight-to-left thinking leads directly to **contract-first** design. In software, you publish an interface and hide the implementation. Consumers depend on the interface. A Data Product works the same way:\n\n- You **declare schema, semantics, and SLA first**.\n- **Consumers bind to the contract, not to storage paths.** You can change the structure of the tables later. While the contract holds, consumers see no effect.\n- **Quality runs in the build and blocks publication.** The build catches bad data. It does not send an alert after the release.\n- **Schema and meaning change through versions.** Thus consumers, including models in production, never get a surprise.\n\nModern Data 101 adds a practice from its Design stage: **validate the business model with mock data before building**. Stop physical development until the team agrees on the metrics. This costs far less than finding a wrong definition after the pipelines exist.\n\n### Ownership is part of the product\n\nThe formal definition requires a **named owner**. Ownership turns a dataset into something accountable. Modern Data 101 describes two product roles that complete each other:\n\n| Role | Focus |\n|---|---|\n| **Data Product Manager** | Vision, strategy, roadmap, business case, stakeholder alignment |\n| **Data Product Owner** | Backlog, delivery quality, acceptance |\n\nThese roles work with analytics and data engineers (semantic models, ingestion, transformation), platform engineers, governance and risk, and domain leads. Teams often use a **RACI matrix** during design. It assigns who is Responsible, Accountable, Consulted, and Informed.\n\n> **Note:** Data Product Manager and Data Product Owner are *product-practice* roles from Modern Data 101. They are not DataOS platform roles. Module p6 covers the DataOS platform roles (Operator, Tenant Admin, Data Admin, Data Product Developer, Data Product Consumer, Data Steward). In practice, consumers often find the Data Product Owner in the **Contacts** section of a product page in the Data Product Hub.","sources":["https://v2.dataos.info/data-product-journey-v2","https://v2.dataos.info/readme-1","https://www.moderndata101.com/modules/bring-product-thinking-to-data","https://www.moderndata101.com/blogs/what-are-data-products-the-complete-guide"]},{"title":"The journey with Orders Analytics","body":"### One question, end to end\n\nThe DataOS docs follow one worked example through the full journey: the **Orders Analytics** Data Product. A business team must answer questions about orders and revenue. The team must also trust the answers across reporting, applications, and AI:\n\n- How much revenue did we generate yesterday?\n- Are order volumes rising or falling?\n- Can these numbers be trusted for a board report?\n- Can the same definitions power dashboards, APIs, and AI agents?\n\nAt the highest level, the journey has three stages: **Discover, Productize, Consume**. Productize has three steps: **Design, Build, Publish**. Thus the journey has five steps in total.\n\n### 1. Discover: do we already have this?\n\nStart with the assumption that the work possibly exists already.\n\n1. **Check what exists.** Search the catalog for a Data Product, dataset, or metric that is related to orders.\n2. **Inspect what you find.** Review the metadata, schema, lineage, ownership, and sample data.\n3. **Decide.** Reuse it, extend it, or bring in the missing source data.\n\nDiscover makes complexity grow **additively instead of multiplicatively**. A new question reuses a product that exists. It does not start another pipeline from zero.\n\n### 2. Design: write the contract before the pipeline\n\nDesign turns a business need into a published contract.\n\n- **Consumers first.** Orders Analytics serves analysts, BI users, applications, and AI agents. They all read the same order and revenue logic.\n- **Boundaries.** In scope: orders, order items, customers, products, payments. Out of scope unless a consumer needs them: marketing, inventory, support data.\n- **Trust and reuse.** Quality rules, freshness and completeness checks, shared semantic and metric definitions, a named owner, and supported consumption paths.\n\n> By the end of Design, you know what Orders Analytics includes and what it promises. You also know how consumers trust it and how they consume it. You know all this **before any build logic exists**.\n\n### 3. Build: create the artifacts with Vulcan\n\nThe contract becomes working code. You define and test it locally with **Vulcan**, the declarative build stack of DataOS:\n\n- **Source configuration**: where the input data comes from.\n- **Models**: source models structure the data. Transformed models clean and join it. Semantic models map technical fields to business concepts.\n- **Quality gates**: tests check logic against mock data. Assertions block bad records, such as null required fields, duplicate order IDs, or negative revenue. Data quality checks monitor completeness, freshness, and drift.\n- **Metrics**: measures combined with dimensions and time, such as revenue and average order value.\n\nQuality runs **in the build**, not as an alert after release. If a check fails, it blocks publication.\n\n### 4. Publish: make it governed and discoverable\n\nPublishing deploys the validated product to DataOS. The local build becomes a governed product in the catalog. That product carries its contract, lineage, and quality state.\n\n### 5. Consume: one product, many paths\n\nAnalysts query it with SQL. Business users explore metrics and dashboards. Developers call it through APIs. AI agents read its governed context and do not guess at tables. Other teams reuse it as an input to downstream products. All paths resolve to **the same definitions**. There is one definition, not four copies on four schedules.\n\n### How the journey maps to the product lifecycle\n\nModern Data 101 describes a lifecycle with four stages: **Design → Develop → Deploy → Evolve**. These stages align with the DataOS journey as follows:\n\n| MD101 lifecycle | DataOS journey | What happens |\n|---|---|---|\n| Design | Discover + Design | Work backward from the consumer, validate the model, and write the contract |\n| Develop | Build | One project for models, tests, quality, and policies, which you develop with Vulcan |\n| Deploy | Publish | Declarative deployment with a single command to a governed, discoverable product |\n| Evolve | Consume, and operate over time | Monitor SLOs, handle change requests, version, roll back, or retire. This stage feeds back into Design. |\n\n> **Note:** Evolve is continuous. Consumer feedback and incidents go back into Design. Changes ship as new versions, so existing consumers do not break.\n\n### Explore\n\nRead the [Data Product Journey](https://v2.dataos.info/data-product-journey-v2) page. Pick a business question from your own work. For each of the five steps, write one sentence about how the step applies to that question.","sources":["https://v2.dataos.info/data-product-journey-v2","https://www.moderndata101.com/modules/data-product-101"]}],"lab":null,"takeaways":["Think right-to-left from the business outcome to the contract. Build left-to-right from the sources to a trusted product.","Contract-first means that you declare schema, semantics, and SLA before the pipeline. Consumers bind to the contract, not to storage paths.","The journey is Discover, then Productize (Design, Build, Publish), then Consume.","Discover comes first. Then new questions reuse the products that exist, and complexity grows additively.","Quality runs in the build. If a check fails, it blocks publication.","The Design/Develop/Deploy/Evolve lifecycle maps to the journey. Evolve feeds back into Design."],"quiz":[{"q":"What does \"think right-to-left\" mean in the Data Product Journey?","options":["Start from the source tables and see what you can build","Start from the business outcome and the consumers, then shape the contract","Build the semantic model before the physical models","Publish first, then design"],"answer":1,"explain":"Right-to-left thinking starts from the consumer and the business outcome. A start from the source tables is traditional left-to-right thinking. That is how you *build*, not how you *reason*.","source":"https://v2.dataos.info/data-product-journey-v2"},{"q":"In the Orders Analytics example, what does the Discover step do?","options":["It finds out whether a trusted product, dataset, or metric already answers the question","It ingests raw data with Nilus","It publishes the product to the catalog","It writes unit tests"],"answer":0,"explain":"Discover finds what exists and inspects it. Then it decides to reuse, extend, or bring in new data. Thus complexity grows additively.","source":"https://v2.dataos.info/data-product-journey-v2"},{"q":"What does the team have at the end of the Design step?","options":["A deployed product in the catalog","A set of dashboards","A Nilus pipeline","A product contract: what the product includes and promises, and how consumers trust and consume it"],"answer":3,"explain":"Design ends with a product contract before any build logic exists. Deployment occurs in Publish.","source":"https://v2.dataos.info/data-product-journey-v2"},{"q":"Which Orders Analytics boundary decision agrees with the docs?","options":["Include marketing, inventory, and support data by default","Include only the orders table","Include orders, order items, customers, products, and payments. Exclude marketing, inventory, and support unless a consumer needs them.","Include every table in the source database"],"answer":2,"explain":"The docs limit Orders Analytics to orders, order items, customers, products, and payments. They exclude marketing, inventory, and support data unless a consumer needs them.","source":"https://v2.dataos.info/data-product-journey-v2"},{"q":"In the Modern Data 101 lifecycle, which stage treats metrics as SLOs, handles change requests and versioning, and feeds back into Design?","options":["Evolve","Develop","Deploy","Discover"],"answer":0,"explain":"Evolve is the continuous stage. It covers monitoring, incidents, change requests, versioning, rollback, and retirement, and it feeds back into Design. Discover is a step of the DataOS journey, not a stage of the MD101 lifecycle.","source":"https://www.moderndata101.com/modules/data-product-101"}]},{"id":"p4","title":"How DataOS builds Data Products","duration":"35 min","objectives":["Describe the three Build stages (Understand, Move, Productize) and how they map to ELP","Explain how Secrets, Depots, UDLs, and environment variables connect data","Explain when and how Nilus moves data, and name its three movement types","List the components of a Vulcan project, and tell the difference between unit tests, assertions, and DQ checks","Describe how governance and publishing work, and name the supported engines"],"lessons":[{"title":"ELP and the three Build stages","body":"### ELP in practice\n\nIn DataOS, you build every Data Product with one pattern: **Extract, Load, Productize (ELP)**. First, you pull raw data from a source. Then you put the data where your engine can reach it. Last, you turn the data into a product that has an owner and a contract. People and AI agents can trust that product.\n\nThe Build section of the docs puts this pattern into **three stages**:\n\n| Stage | What you do | Where it sits in ELP |\n|---|---|---|\n| **Understand** | Look at the sources that you can use: schema, lineage, quality, freshness | Before the pattern |\n| **Move** | Bring in raw data that your engine cannot already reach | Extract + Load |\n| **Productize** | Turn the data into a product that is tested, governed, and served | Productize |\n\n```text\nUnderstand ──► Move ──► Productize\n     └──── (data already reachable) ────┘\n```\n\n> **Note:** **Move is conditional.** If the data is already where your engine can read it, you go directly from Understand to Productize. You move data only to close a gap.\n\n### The end-to-end path\n\nThe docs show the full path from the source to the consumer:\n\n1. The data starts in an engine or a source system.\n2. **Connect Data** registers a Secret, a Depot, or environment variables. DataOS can then reach the data.\n3. **Nilus** brings in raw data with stream, CDC, or batch ingestion. It does this *only if* the engine cannot already reach the data.\n4. **Vulcan** builds the product: models, semantic model, metrics, tests, assertions, and data quality.\n5. **Govern** attaches the access policy.\n6. **Publish** deploys the result as a governed product that people can discover. Publish serves the product to BI tools, APIs, a DB client, SDKs, and MCP.\n\n### Stage 1: Understand\n\nUnderstand answers one question: **is this the right data?** This stage is reconnaissance, a first look before you build. It has three tasks:\n\n- **Connect sources**: Register an authenticated connection. DataOS can then reach the source without moving data.\n- **Scan metadata**: If DataOS has no metadata for the source yet, scan the source. Its tables, columns, lineage, and usage then become discoverable.\n- **Explore data**: Browse datasets and lineage in the catalog. Then query samples in **Workbench**, the general SQL exploration UI.\n\nAt the end of this stage, you can answer four questions: What exists? Can I trust it? Does it fit? What is missing? You leave with evidence, not assumptions.\n\n### Stage 2: Move\n\nMove is the Extract and the Load. It runs on **Nilus**, the DataOS data movement framework. You declare a `nilus` resource that names a source, a destination (sink), and a type. Then you apply the resource with the CLI. There are three types:\n\n| Type | Best for | Freshness |\n|---|---|---|\n| Batch | Large volumes, with full or incremental loads on a schedule | Minutes to hours |\n| Change data capture (CDC) | Operational databases where you must capture every insert, update, and delete | Near real-time |\n| Streaming | Event streams and message queues such as Kafka or NATS | Near real-time |\n\nIf you are not sure, the docs recommend that you start with **Batch**. One rule is more important than all others: **Move never transforms. It only relocates.** The data lands unchanged. Productize gives the data its meaning.\n\n### Stage 3: Productize\n\nProductize is **the core of Build**. In this stage, you create the physical asset and its meaning as **one object**. The transform, the semantic model, the quality contract, and the access policy form a single unit. Because of this, they cannot drift apart. You build this object with the **Vulcan** resource. Lesson 3 gives the details.\n\n### Stage names in the docs\n\nDifferent pages of the docs use slightly different lists of stages. The Philosophy page summarizes the end-to-end flow as *Understand, Productize, Consume*. The Build section uses *Understand, Move, Productize*. The Data Product Journey uses *Discover, Design, Build, Publish, Consume*. These lists describe the same work at different levels of detail. When you build, use **Understand / Move / Productize**.","sources":["https://v2.dataos.info/build/get-started/readme","https://v2.dataos.info/build/understand/overview","https://v2.dataos.info/build/move/overview","https://v2.dataos.info/build/productize/overview","https://v2.dataos.info/readme-1"]},{"title":"Connect Data and Move with Nilus","body":"### Connect Data: make a source reachable\n\nDataOS must have a registered, authenticated connection to a source before it can read or transform data. In DataOS, a data connection is **two Resources that work together**:\n\n- **Secret**: Stores credentials (username, password, API keys, certificates) in an encrypted vault. Credentials are never in manifests or code.\n- **Depot**: Connects DataOS to the external system. It refers to the Secret for authentication. It holds the location of the source and the method to reach it.\n\nWhen a Depot is active, DataOS gives its data an address. This address is a **Uniform Data Link (UDL)**:\n\n```text\ndataos://[depot-name]/[source-path]\n```\n\nEvery tool uses this address. Because of this, there are **no credentials at the point of use**.\n\n> **Tip:** Many teams share Depots. Before you create a Depot, find out whether a connection already exists with `dataos-ctl resource get -t depot -a`. Do not create duplicates.\n\nThis is a Secret manifest from the docs:\n\n```yaml\nname: ${{secret-name}}\nversion: v2alpha\ntype: secret\ndescription: ${{what this secret is for}}\nowner: ${{your-dataos-user-id}}\nsecret:\n  type: key-value\n  data:\n    username: ${{source-username}}\n    password: ${{source-password}}\n```\n\n> **Warning:** Do not commit Secret manifests. The `secret.data` block is plaintext. After you apply the Secret, delete the local file or move it outside your repo.\n\nEnvironment variables are the third way to connect. You use them for local work. In a Vulcan project, you refer to them with `{{ env_var('VAR_NAME') }}`. The rule in the docs is simple: never hard-code credentials. Use `env_var()` locally, and use DataOS Secrets in production.\n\n### A connection is not an engine\n\nMany beginners confuse these two things:\n\n| Question | Answered by |\n|---|---|\n| Where does the source data live, and how do we authenticate to it? | **Data connection** (Secret + Depot) |\n| Where do transformations run, and where do outputs land? | **Engine** |\n\nOne system can have both roles. For example, a Snowflake account can be a Depot that reads source tables. It can also be the engine that runs transforms. But you configure each role separately. You configure the engine later, in Productize.\n\n### Move data with Nilus\n\nIf Understand shows that your engine cannot reach the data, you write a `nilus` resource. Every move has the same three steps. First, pick a source and a destination, and address both through a Depot. Next, write the manifest with the correct `spec.type`. Last, apply the manifest and make sure that the result is correct. This is the batch template from the docs, with some lines removed:\n\n```yaml\nname: ${{pipeline-name}}\nversion: v1alpha\ntype: nilus\nspec:\n  type: batch\n  compute: ${{compute-profile}}\n  source:\n    address: dataos://${{source-depot}}?purpose=ro\n    options:\n      source_table: \"${{schema.table}}\"\n  sink:\n    address: dataos://${{sink-depot}}?purpose=rw\n    options:\n      dest_table: ${{schema.table}}\n      incremental_strategy: replace\n```\n\nBoth the source and the sink are UDLs. The pipeline never contains a password.\n\n```bash\ndataos-ctl resource apply -f ${{path-to-nilus.yaml}}\n```\n\n### Supported sources\n\nThe **Supported connectors** reference has two tables. Each table maps to one stage:\n\n- **Depot and Minerva** support: Can DataOS connect to the source? Can **Minerva**, the federated SQL query engine, query the source live? This is important for data exploration.\n- **Nilus and Vulcan** support: Can Nilus move data in or out (batch, CDC, stream, metadata)? Can Vulcan use the system as an execution engine?\n\n> **Note:** A source can be a Depot and not a Vulcan engine. The opposite is also possible. Look at both tables before you assume full support.\n\n### Explore\n\nOpen [Supported connectors](https://v2.dataos.info/references/supported-connectors). Find PostgreSQL, the source for Orders Analytics. Write down the Nilus types that PostgreSQL supports. Write down whether PostgreSQL can be a Vulcan engine.","sources":["https://v2.dataos.info/build/understand/connect-sources","https://v2.dataos.info/build/move/overview","https://v2.dataos.info/build/move/mode/batch","https://v2.dataos.info/build/productize/connect-engine","https://v2.dataos.info/references/supported-connectors"]},{"title":"Productize with Vulcan, Govern, and Publish","body":"### Vulcan: one object, many components\n\n**Vulcan** is the declarative build stack in DataOS for Data Products. It includes SQL and Python models, validation, a semantic layer, materialization, APIs, and plan and apply workflows in the style of CI/CD. A Vulcan Data Product is a set of components in **one project folder**. The `orders-analytics` example has these components:\n\n| Component | What it is | In orders-analytics |\n|---|---|---|\n| Inputs | Upstream tables that your models read | `inputs.yaml` (9 tables) |\n| Seeds | Static CSV files that load as tables | `order_status_lookup.csv` |\n| Data model | SQL or Python transforms that each make a table or a view | `bronze.*`, `silver.*`, `gold.*` (12 models) |\n| Semantic model | Maps tables to measures, dimensions, segments, and joins | 6 semantic models |\n| Metrics | A measure plus a time column, as one time series that you can query | 5 metrics |\n| Unit test | Tests model logic against mock data | 2 tests |\n| Assertions | Rules that run at materialization and block bad data | inline assertions plus 3 audits |\n| Data quality | Checks that monitor data over time and do not block | 7 DQ packs |\n\nThe models are in layers. People often call this a **medallion** structure. Source tables feed `bronze` (raw shape). Then `bronze` feeds `silver` (facts and dimensions), and `silver` feeds `gold` (ready for analytics). Last, `gold` feeds the semantic models and metrics. Vulcan finds the run order from the SQL dependencies. You declare what a model reads, and you do not orchestrate it.\n\n### Three quality artifacts that you must not confuse\n\n| Artifact | Checks | Blocks the run? |\n|---|---|---|\n| **Unit test** | Model SQL logic against mock fixtures, before real data | Tests the logic before publish |\n| **Assertion** | A rule attached to a model at materialization | **Yes**: if it fails, the run stops |\n| **DQ check** | Real data after a successful run | **No**: records a result and warns |\n\n### Govern: policy that is part of the product\n\nGovernance is part of the product. It is not a separate layer that you add later. In Vulcan, governance has two steps:\n\n1. DataOS authorizes a user. Then a small project plugin decides which **policy group** the user belongs to (for example, `analyst` or `executive`). The project registers this plugin as `after_authorize` in `config.yaml`.\n2. A policy on the **physical model** uses that group. The policy decides which rows the user can query and which columns it masks. Semantic models and metric models inherit those rules.\n\n```yaml\nafter_authorize: \"plugins.auth_ext:resolve_user_groups\"\n```\n\n### Plan, then publish\n\nLocally, `vulcan plan` makes sure that the project is correct. This command finds changes and classifies their impact as breaking or non-breaking. It also materializes the data and runs the assertions. After you apply a plan, `vulcan run` keeps the data current on a schedule.\n\nAfter a successful plan, **Publish** turns the project into a running Data Product that people can discover. A `deployment:` block in `config.yaml` controls the deployment. This block sets the repo, compute, engine, and schedule. From this block, `vulcan create_deploy_yaml` renders the manifest. DataOS then pulls the project from Git, runs it on a schedule, and serves it through APIs. The docs say that a product \"becomes complete when it's deployed, discoverable, trusted, and queryable by others.\"\n\n### Supported engines\n\nThe **engine** is where transformations run and outputs land. DataOS is the control layer above the engine. The Engine guide lists these engines:\n\n| Engine | Adapter type |\n|---|---|\n| Snowflake | `snowflake` |\n| Databricks | `databricks` |\n| Spark | `spark` |\n| Postgres | `postgres` |\n| Redshift | `redshift` |\n| Athena | `athena` |\n| Trino | `trino` |\n| SQL Server | `mssql` |\n| Microsoft Fabric | `fabric` |\n\nOn every engine, Vulcan compiles your SQL and semantic models to native engine SQL. It then materializes tables and views. A serving layer exposes the product through REST and GraphQL endpoints. If the engine supports them, the serving layer also exposes MySQL-wire and Postgres-wire endpoints. The docs end the Build introduction with one principle to remember: **\"The engine is the choice; the pattern does not change.\"**\n\n> **Tip:** The glossary calls this adoption style an **Overlay**. DataOS is a layer on top of the warehouse or lake that you already use. You can start with one product on one source. You do not have to replatform first.","sources":["https://v2.dataos.info/build/productize/overview","https://v2.dataos.info/build/productize/governance","https://v2.dataos.info/build/productize/plan-and-run","https://v2.dataos.info/build/productize/git-and-deploy","https://v2.dataos.info/references/engine-guide/engine-guide","https://v2.dataos.info/references/glossary"]}],"lab":null,"takeaways":["Build has three stages: Understand (before ELP), Move (Extract + Load), Productize (P).","Move is conditional. It never transforms data. It only relocates data with Nilus in batch, CDC, or stream mode.","A data connection is a Secret plus a Depot. A UDL gives its address: dataos://[depot]/[path].","A connection (where data lives) is not an engine (where transforms run). But one system can be both.","Vulcan defines models, semantic models, metrics, tests, assertions, DQ checks, and policy as one object.","The engine is the choice; the pattern does not change."],"quiz":[{"q":"Understand showed that the source tables are already in the Postgres database that your engine reads. What is the next step?","options":["Create a Nilus batch pipeline anyway","Skip Move and go directly to Productize","Create a second Depot for the same source","Copy the tables with a CDC pipeline"],"answer":1,"explain":"Move is conditional. If the engine can already reach the data, you skip Move and go to Productize.","source":"https://v2.dataos.info/build/get-started/readme"},{"q":"Which statement about Move is correct?","options":["Move cleans and joins data before it lands","Move builds the semantic model","Move only relocates raw data and never transforms it","Move publishes the Data Product"],"answer":2,"explain":"The docs state that Move never transforms data. It only relocates data. Productize produces the meaning.","source":"https://v2.dataos.info/build/move/overview"},{"q":"What does a Depot do?","options":["Connects to a source, refers to a Secret, and exposes data via a UDL","Stores passwords in an encrypted vault","Runs transformations and materializes tables","Schedules Vulcan runs"],"answer":0,"explain":"A Depot holds the connection details and refers to a Secret. You then address its data as dataos://[depot]/[path]. The Secret stores the credentials, and the engine runs the transforms.","source":"https://v2.dataos.info/build/understand/connect-sources"},{"q":"Which Vulcan artifact runs against real data after a successful run, and records a result but does not stop the run?","options":["Unit test","Assertion","Audit","Data quality (DQ) check"],"answer":3,"explain":"DQ checks do not block. They monitor data over time and give warnings. Assertions, including audits, block the run. Unit tests test logic against mock data.","source":"https://v2.dataos.info/build/productize/overview"},{"q":"A teammate says: 'Our Snowflake account is a Depot, so it must also be our engine.' What is the correct response?","options":["Correct: every Depot is automatically an engine","Snowflake can be both, but you set up each role on its own","Snowflake cannot be used as an engine in DataOS","Engines are configured inside the Secret"],"answer":1,"explain":"The docs separate a data connection (where data lives and how to authenticate) from an engine (where transforms run). One system can be both, but you configure each role separately.","source":"https://v2.dataos.info/build/understand/connect-sources"}]},{"id":"p5","title":"The platform in one view","duration":"30 min","objectives":["Describe the split between the Control Plane (Instance) and the Data Plane, and what moves between them","Explain Tenants, their isolation layers, and the rule that metadata is shared","Read a Resource manifest and sort Resources into runnable and non-runnable","Name the lifecycle states of a Resource and the core CLI commands","Match each DataOS interface (CLI, Hub, Studio, Workbench, APIs, MCP) to its use"],"lessons":[{"title":"Architecture: Instance, Data Plane, and Tenants","body":"### Control Plane and Data Plane\n\nDataOS uses a **Control Plane–Data Plane architecture**. This architecture keeps management apart from the work that runs.\n\n| Component | Role | Where it runs |\n|---|---|---|\n| **DataOS Instance** (the Control Plane) | Orchestration, governance, metadata management, access control, observability, DataOS applications | Hosted (the glossary calls this environment **Modern Cloud**) |\n| **Data Plane** | Runs Data Products, manages compute, connects to data sources, runs workloads | **Inside the cloud of the customer**, usually on Kubernetes |\n\nThe most i
