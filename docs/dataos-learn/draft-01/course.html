base: mydb\n      user: myuser\n      password: \"{{ env_var('PG_PASSWORD') }}\"\nmodel_defaults:\n  dialect: postgres\n```\n\nThese rules often cause errors:\n\n- **`users` is not optional.** If it is empty or missing, the configuration does not load. Each `username` must be a valid user in your DataOS tenant. `model_defaults.owner` defaults to the first entry.\n- **`tenant` is required by the platform.** Keep it in `config.yaml` (as `vulcan init --tenant` writes it), or export `DATAOS_TENANT_ID` locally. As a third option, let the platform inject it in production. Without a tenant, Vulcan refuses to load.\n- **Never write a password in the file.** Always use `{{ env_var('VAR_NAME') }}`.\n- **`version` is SemVer 2.0**: `0.1.2`, not `v0.1.2`.\n\n### The sections that matter\n\n**Identity and metadata** (`name`, `tenant`, `domain`, `description`, `version`, `alignment` of `source_aligned` or `consumer_aligned`, `tags`, `terms`) appear in catalog search and the Data Product Hub. They do not change how Vulcan runs.\n\n**Gateways** say where to connect. On DataOS, use `type: depot` so that credentials stay in the Depot. On your machine, use the raw engine type with environment variables:\n\n```yaml\ngateways:\n  default:\n    connection:\n      type: depot\n      address: dataos://postgresdepot?purpose=rw\n```\n\n**Model defaults** apply to every model unless a model overrides them. Only `dialect` is required:\n\n```yaml\nmodel_defaults:\n  dialect: postgres\n  start: '2025-01-01'\n  cron: '*/15 * * * *'\n```\n\n**Linter** catches product-level issues during `vulcan plan`. Rules under `linter.rules` block by default. `warn_rules` enforce conventions without blocking:\n\n```yaml\nlinter:\n  enabled: true\n  warn_rules:\n    - nomissingaudits\n    - noselectstar\n    - ambiguousorinvalidcolumn\n```\n\n**Variables** are reusable values. You reference them as `{{ var('name') }}` in models and macros:\n\n```yaml\nvariables:\n  bronze_schema: bronze\n  min_customer_count: 10\n```\n\n**`vde`** turns Virtual Data Environments on or off. It defaults to `false`: direct, forward-only materialization under each model's own name. `vde: true` gives versioned physical tables plus a virtual layer for plan review. But Vulcan rejects it on `spark` and `trino` gateways.\n\nExecution hooks, notification targets, `after_authorize` and the `deployment:` block also live in `config.yaml`. You will meet them in the Governance and Deploy modules.\n\n### `usage.yaml`: what consumers need to know\n\n`usage.yaml` sits beside `config.yaml` and describes the business context. The Data Product Hub shows it to consumers, so that they can judge fit *before* they query a row:\n\n```yaml\ngood_for:\n  - Daily and weekly sales performance reporting by region, category, and product\nnot_for:\n  - Real-time order orchestration or shipment alerting\ncaveats:\n  - title: Demo refresh cadence\n    details: Models refresh every 15 minutes for demonstration only\n    severity: medium\nreferences:\n  - title: Vulcan book\n    url: https://tmdc-io.github.io/vulcan-book/\n    type: doc\n```\n\nCaveats take an optional `severity` of `low`, `medium` or `high`.\n\n### `agreement.md`: optional terms\n\n`agreement.md` holds the agreement text that a consumer accepts before getting access. Vulcan does not parse it. Any Markdown that you write appears verbatim. `config.yaml` points at it with `agreement_path` (default `agreement.md`). If no file resolves there, Vulcan logs a warning and keeps loading. Consumers then get a `404` from `GET /api/v1/metadata/agreement`. The separate `license` field (for example `internal-use`) is not related to `agreement_path`.\n\n> **Warning:** The scaffold writes `usage.yml`, but the `orders-analytics` example in the Build guide uses `usage.yaml`. Keep the name that your project already uses. Do not create both.","sources":["https://v2.dataos.info/build/productize/init-and-configuration","https://v2.dataos.info/references/resources/vulcan/configurations","https://v2.dataos.info/build/productize/plan-and-run"]},{"title":"Connecting an engine: PostgreSQL in depth, others in brief","body":"### Engine selection is one field\n\nEngine configuration lives in the `gateways` block of `config.yaml`, and `connection.type` selects the adapter: `depot`, `snowflake`, `databricks`, `spark`, `trino`, `postgres`, `mssql`, `fabric`, `redshift` or `athena`. Your engine choice sets four things: the SQL dialect, how Vulcan materializes tables, the permissions that you need, and who owns cost and tuning. Where you can, pick the engine where your data already lives, so that you do not move it.\n\n| Engine | `type` | Best for |\n| --- | --- | --- |\n| Snowflake | `snowflake` | Governed, SQL-first enterprise analytics |\n| Databricks | `databricks` | Delta Lake, Unity Catalog and Spark workloads |\n| Spark | `spark` | Iceberg, object storage, large distributed processing |\n| Trino | `trino` | Federated SQL across catalogs and data lakes |\n| Postgres | `postgres` | Smaller products, prototypes, local-first work |\n| SQL Server | `mssql` | Existing SQL Server estates |\n| Microsoft Fabric | `fabric` | Fabric Warehouse with OneLake and Entra ID |\n| Amazon Redshift | `redshift` | AWS warehouse workloads (beta since Sept 2026) |\n| Amazon Athena | `athena` | Serverless SQL over S3 data in Glue (beta since Sept 2026) |\n\n### PostgreSQL in depth\n\nPostgreSQL is the engine behind `orders-analytics`. Before you start, you need a server (12+ recommended), network connectivity, and a database that **already exists**. Postgres has no catalog tier, and Vulcan does not create the database. On DataOS you also need a `roles:id:data-dev`-equivalent role tag, `depot:rw:<postgres-depot-name>`, `Can Use` on Compute, Depots and Secrets, and a git-sync Secret.\n\n**Three roles, not one.** Keep three roles. A superuser/DBA **admin** creates the database, installs extensions and grants privileges. A **Vulcan service role** runs models and creates schemas and tables. A **consumer role** is read-only. The service role needs these permissions:\n\n| Permission | Required for |\n| --- | --- |\n| `CREATE` on the database | Creating schemas |\n| `CREATE` on schemas | Creating tables and views |\n| `SELECT`, `INSERT`, `UPDATE`, `DELETE` on tables | Reading and writing model output |\n| `USAGE` on schemas | Accessing schemas Vulcan uses |\n\n```sql\nGRANT CONNECT ON DATABASE warehouse TO vulcan;\nGRANT CREATE ON DATABASE warehouse TO vulcan;\nGRANT USAGE ON SCHEMA raw TO vulcan;\nGRANT SELECT ON ALL TABLES IN SCHEMA raw TO vulcan;\n```\n\n**Connection options:** `type` (`postgres`), `host`, `port`, `database`, `user`, `password`, and optionally `sslmode` (use `require` in production), `connect_timeout`, `keepalives_idle`, `role`, `application_name`.\n\n```yaml\ngateways:\n  postgres:\n    connection:\n      type: postgres\n      host: <postgres-host>\n      port: 5432\n      database: <database-name>\n      user: <username>\n      password: \"{{ env_var('PG_PASSWORD') }}\"\n      sslmode: require\n```\n\n**Supported kinds:** `SEED`, `FULL`, `VIEW`, `INCREMENTAL_BY_TIME_RANGE`, `INCREMENTAL_BY_UNIQUE_KEY`, `INCREMENTAL_BY_PARTITION`, `INCREMENTAL_UNMANAGED`, `SCD_TYPE_2`, `SCD_TYPE_2_BY_TIME`, `SCD_TYPE_2_BY_COLUMN` and `EMBEDDED`. `INCREMENTAL_BY_UNIQUE_KEY` uses native `MERGE` on Postgres 15+.\n\n**Postgres gotchas:**\n\n- Postgres folds unquoted identifiers to **lowercase**. Write model names, columns, semantic and metric references in lowercase, or quote them the same way everywhere. A semantic `column does not exist` error usually comes from casing.\n- Schema names that start with `pg_` are reserved.\n- Some DDL in `pre_statements`/`post_statements` must run only on real execution. Guard that DDL with `@IF(@runtime_stage = 'evaluating', ...)`. Otherwise, `vulcan plan` runs it.\n- Size `max_connections` for Vulcan workers, API replicas and BI sessions together. Add PgBouncer or a read replica before you raise the instance size.\n\n### Trino and Minerva, briefly\n\nTrino has three paths, and **who owns the cluster** decides the path. With **Dedicated Trino**, Vulcan provisions one cluster for each product. **Minerva** is a shared, DataOS-managed, Trino-compatible cluster that is already in your tenant. **External Trino** is your own Starburst or self-hosted endpoint. These rules apply to every Trino path: `connection.type: trino`, `model_defaults.dialect: trino`, `vde: false`, lowercase three-part names (`catalog.schema.table`), and half-open time windows (`>= @start_dt AND < @end_dt`) instead of `BETWEEN`.\n\n> **Warning:** Minerva supports only the `VIEW` model kind. `FULL`, `SEED` and incremental kinds need a dedicated Trino cluster. The Minerva password is a base64-encoded JSON of `cluster`, `apikey` and `tenant`. You store it in a Secret and project it as `TRINO_PASSWORD`.\n\n### Verify the connection\n\n```bash\nvulcan info\nvulcan plan dev\n```\n\n`vulcan info` tells you three things: `config.yaml` is valid, the connection is reachable, and Vulcan recognizes the model directory. It reports model and macro counts. It tests both the warehouse and the state backend:\n\n```\n$ vulcan info\nModels: 4\nMacros: 0\nData warehouse connection succeeded\nState backend connection succeeded\n```\n\nCorrect each problem that it reports before you move to assets.","sources":["https://v2.dataos.info/build/productize/connect-engine","https://v2.dataos.info/build/productize/connect-engine/postgres","https://v2.dataos.info/build/productize/connect-engine/trino","https://v2.dataos.info/build/productize/connect-engine/trino/minerva","https://v2.dataos.info/references/resources/vulcan/cli"]},{"title":"Inputs and seeds","body":"### Inputs: tables you read but do not own\n\nInputs are the upstream tables that your product reads but does not own. You declare them as **external models**. This tells Vulcan the shape of each table, so that it can resolve dependencies and build lineage. Vulcan does not copy or manage the data. In `orders-analytics`, the nine `public.*_ext` tables that you landed with Nilus stay `EXTERNAL`. Everything built on top of them belongs to the product.\n\nExternal inputs are in one file at the project root, `inputs.yaml`. `inputs.yml` also works. If both exist, `inputs.yaml` wins. You can write the file by hand, or generate it from the connected engine:\n\n```bash\nvulcan create_external_models\n```\n\nIf a table needs a manual definition that discovery cannot produce (or that regeneration will overwrite), put it in the `inputs/` directory. Vulcan loads the main file first, then merges every `.yaml` under `inputs/`.\n\n```yaml\n- name: public.orders_ext\n  grains:\n    - order_id\n  columns:\n    order_id: INTEGER\n    customer_id: INTEGER\n    order_date: TIMESTAMP\n    warehouse_id: INTEGER\n    order_status: VARCHAR\n- name: public.customers_ext\n  grains:\n    - customer_id\n  columns:\n    customer_id: INTEGER\n    region_id: INTEGER\n    name: VARCHAR\n    email: VARCHAR\n    signup_date: DATE\n```\n\nEach entry names the table and lists its columns. Add `grains` to declare the primary key. Vulcan needs grains to infer joins between external tables in the semantic layer. There are two optional fields:\n\n- `dialect`: use it for a source table whose SQL dialect is different from the project default.\n- `remote_engine`: free-text metadata (added September 2026). If a Trino or Spark catalog points at another system, it records where the data really lives, for example `remote_engine: redshift`.\n\n> **Warning:** `inputs.yaml` is a pure contract: name, dialect, grains and columns. It carries no validation rules, and Vulcan never detects drift on it. If someone alters or empties a source table, Vulcan does not know. Test upstream data with assertions or DQ checks on the model that *reads* the input.\n\nTo read an input, reference it in `FROM`. Vulcan detects the dependency:\n\n```sql\nMODEL (\n  name bronze.orders,\n  kind FULL,\n  grains (order_id)\n);\n\nSELECT order_id, customer_id, order_date, order_status\nFROM public.orders_ext;\n```\n\nOn Trino, if the linter cannot resolve a cross-catalog source, you must declare it in `inputs.yaml`. Otherwise you get `Table not found`. On Postgres, `relation ... does not exist` often means a missing grant or a missing `inputs.yaml` entry.\n\n### Seeds: small static data you own\n\nA `SEED` model loads a static CSV from your project into a table. Use seeds for reference data that rarely changes, for example holiday calendars, exclusion lists and status lookups. Vulcan does not reload a seed on every run. It reloads it only after the model definition or the CSV changes. Python models do not support `SEED`.\n\nIn `orders-analytics`, `order_status_lookup` classifies each order status:\n\n```csv\norder_status,status_group,is_fulfilled,is_active_sort,description\nConfirmed,Open,false,1,Order has been accepted but not yet shipped\nShipped,Fulfilled,true,2,Order has been shipped to the customer\nCancelled,Closed,false,3,Order was cancelled and excluded from revenue metrics\n```\n\n```sql\nMODEL (\n  name bronze.order_status_lookup,\n  kind SEED (\n    path '../../seeds/order_status_lookup.csv'\n  ),\n  columns (\n    order_status TEXT,\n    status_group TEXT,\n    is_fulfilled BOOLEAN,\n    is_active_sort INTEGER,\n    description TEXT\n  ),\n  grains (order_status),\n  description 'Static lookup for order status classification.',\n  assertions (\n    unique_values(columns := (order_status)),\n    not_null(columns := (order_status, status_group, is_fulfilled)),\n    accepted_values(column := order_status, is_in := ('Confirmed', 'Shipped', 'Cancelled'))\n  )\n);\n```\n\nTwo things often cause errors:\n\n- `path` is relative to the **`.sql` file**, not the project root. A model in `models/seeds/` that reaches `seeds/` needs `../../`.\n- A schema in the `MODEL` definition takes precedence over CSV header names, so the **column order must match** the CSV.\n\n### Input or seed?\n\nIf the table already lives in your engine and someone else owns it, use an **input**. If you maintain a small reference table yourself and want it versioned in Git, use a **seed**. If the data is not reachable yet, it is neither. Go back to Move.","sources":["https://v2.dataos.info/build/productize/assets","https://v2.dataos.info/build/productize/assets/inputs","https://v2.dataos.info/build/productize/assets/seeds","https://v2.dataos.info/references/resources/vulcan/models/data-models/types/external-models"]}],"lab":{"title":"Scaffold orders-analytics and connect it to PostgreSQL","goal":"A local `orders-analytics` Vulcan project with a valid `config.yaml`, a `usage.yaml`, an `inputs.yaml` for the landed `public.*_ext` tables, and the `order_status_lookup` seed. A clean `vulcan info` run shows that the project works.","duration":"60 min","prereqs":["Module i1 complete (the `public.*_ext` tables exist in PostgreSQL), or any PostgreSQL database that contains equivalent tables","A Python virtual environment with the Vulcan wheel installed with the `[postgres]` extra","A PostgreSQL service user with CONNECT/CREATE on the database and USAGE/SELECT on schema `public`","Your DataOS username (for `users`) and tenant name"],"steps":["**Create and enter the project.** Run these commands from your activated virtual environment:\n\n```bash\nmkdir orders-analytics && cd orders-analytics\nvulcan init postgres --tenant <tenant> --name orders-analytics --description \"Governed e-commerce analytics on PostgreSQL\"\n```\n\nMake sure that `config.yaml` exists and that `.vulcan/` is in `.gitignore`. Create the layered folders: `models/bronze`, `models/silver`, `models/gold`, `models/seeds`, `models/semantics`, `models/metrics`.","**Export credentials as environment variables** (never in the file):\n\n```bash\nexport PG_HOST='<postgres-host>'\nexport PG_DATABASE='<database-name>'\nexport PG_USER='<vulcan-service-user>'\nexport PG_PASSWORD='<password>'\n```","**Edit `config.yaml`.** Replace the generated content with the minimum valid configuration for local work:\n\n```yaml\nname: orders-analytics\ntenant: <tenant>\ndomain: sales_operations\ndescription: Governed e-commerce analytics on PostgreSQL\nversion: 0.1.0\n\nusers:\n  - username: <your-dataos-username>\n    email: <your-email>\n    type: OWNER\n\ngateways:\n  default:\n    connection:\n      type: postgres\n      host: \"{{ env_var('PG_HOST') }}\"\n      port: 5432\n      database: \"{{ env_var('PG_DATABASE') }}\"\n      user: \"{{ env_var('PG_USER') }}\"\n      password: \"{{ env_var('PG_PASSWORD') }}\"\n\nmodel_defaults:\n  dialect: postgres\n  start: '2025-01-01'\n  cron: '*/15 * * * *'\n\nlinter:\n  enabled: true\n  warn_rules:\n    - nomissingaudits\n    - noselectstar\n    - ambiguousorinvalidcolumn\n\nignore_patterns: [\"*-deploy.yaml\"]\n```","**Write `usage.yaml`** (or edit the scaffolded `usage.yml`, and keep one file only):\n\n```yaml\ngood_for:\n  - Daily and weekly sales performance reporting by region, category, and product\nnot_for:\n  - Real-time order orchestration or shipment alerting\ncaveats:\n  - title: Demo refresh cadence\n    details: Models refresh every 15 minutes for demonstration only\n    severity: medium\n```","**Generate inputs from the engine**, then review the file:\n\n```bash\nvulcan create_external_models\n```\n\nOpen `inputs.yaml`. For every `public.*_ext` table, make sure that the column types are correct. Add `grains` with the primary key, for example `order_id` for `public.orders_ext`, `customer_id` for `public.customers_ext` and `region_id` for `public.regions_ext`. If discovery missed a table, add it by hand in `inputs/manual.yaml`. Use the same shape as the lesson example.","**Add the seed.** Save the three-row CSV from the lesson as `seeds/order_status_lookup.csv`. Save the `bronze.order_status_lookup` SEED model from the lesson as `models/seeds/order_status_lookup.sql`. Make sure that `path '../../seeds/order_status_lookup.csv'` is correct relative to the `.sql` file. Make sure that the `columns (...)` order matches the CSV header.","**Validate.**\n\n```bash\nvulcan info\n```\n\nIf you see `database \"<name>\" does not exist`, create the database or correct `PG_DATABASE`. If the state backend fails, make sure that `.vulcan/` is writable.","**Commit the skeleton.** Initialize Git and commit. Make sure that `.vulcan/` and any `.env` file are not staged:\n\n```bash\ngit init\ngit add .\ngit status\ngit commit -m \"Scaffold orders-analytics project\"\n```"],"verify":"`vulcan info` prints a model count of at least 1 (the seed), `Data warehouse connection succeeded` and `State backend connection succeeded`. `inputs.yaml` lists the `public.*_ext` tables with `grains`. `git status` shows no tracked `.vulcan/` files.","sources":["https://v2.dataos.info/build/productize/init-and-configuration","https://v2.dataos.info/build/get-started/prerequisites/ldk-setup","https://v2.dataos.info/build/productize/connect-engine/postgres","https://v2.dataos.info/build/productize/assets/inputs","https://v2.dataos.info/build/productize/assets/seeds","https://v2.dataos.info/references/resources/vulcan/cli"]},"takeaways":["A Data Product is a Vulcan project folder: models, semantics, metrics, quality, policies and config travel together.","`config.yaml` needs name, description, tenant + domain, users, a gateway and `model_defaults.dialect`. Credentials always come from `env_var`.","Use `type: depot` gateways on DataOS and raw engine types with environment variables locally.","On PostgreSQL, keep three roles, create the database first, and write identifiers in lowercase.","Minerva is VIEW-only and every Trino path requires `vde: false`.","Inputs are a contract with grains and no drift detection. Seeds are versioned CSVs, and their path is relative to the `.sql` file."],"quiz":[{"q":"`vulcan plan` refuses to load a new project with an error about configuration. `config.yaml` has `name`, `description`, `tenant`, `domain`, a gateway and `model_defaults.dialect`. What is most likely missing?","options":["A `deployment:` block","At least one entry in `users`","An `agreement.md` file","A `linter` section"],"answer":1,"explain":"`users` is required. If it is empty or missing, the configuration does not load. A missing `agreement.md` only logs a warning, and `deployment:` and `linter` are optional for local work.","source":"https://v2.dataos.info/build/productize/init-and-configuration"},{"q":"A developer wants to connect Vulcan to the shared Minerva cluster and build `FULL` and `INCREMENTAL_BY_TIME_RANGE` models. What do you tell them?","options":["Minerva supports only `VIEW`. Use a dedicated Trino cluster (or another engine) for materialized kinds","Set `vde: true` to enable materialization on Minerva","Use `connection.type: minerva`","Minerva supports every kind if `dialect: postgres` is set"],"answer":0,"explain":"Minerva supports only the VIEW kind. FULL, SEED and incremental kinds require a dedicated Trino cluster. Trino paths also require `vde: false` and `type: trino`.","source":"https://v2.dataos.info/build/productize/connect-engine/trino/minerva"},{"q":"On a PostgreSQL project, a semantic query fails with `column does not exist`, but the column is present in the table. What is the most likely cause?","options":["The input is missing `remote_engine`","`vde` is set to `false`","Identifier casing: Postgres folds unquoted names to lowercase, and the reference used mixed case","The model kind is `FULL`"],"answer":2,"explain":"The Postgres troubleshooting table maps a semantic `column does not exist` error to a casing mismatch. Write identifiers in lowercase, or quote them the same way everywhere.","source":"https://v2.dataos.info/build/productize/connect-engine/postgres"},{"q":"Someone truncates `public.orders_ext` in the source database. The table is declared in `inputs.yaml`. What does Vulcan do about it?","options":["It fails `vulcan plan` with a drift error","It automatically reloads the table from the source","Nothing. Inputs are a pure contract with no drift detection, so add assertions or DQ checks on the model that reads it","It marks the input as stale in the Hub"],"answer":2,"explain":"`inputs.yaml` carries no validation rules, and Vulcan never detects drift on it. Validation belongs on the models that read the input.","source":"https://v2.dataos.info/build/productize/assets/inputs"},{"q":"A SEED model at `models/seeds/order_status_lookup.sql` fails to find its CSV, which lives at `seeds/order_status_lookup.csv`. Which `path` is correct?","options":["`'seeds/order_status_lookup.csv'`","`'/seeds/order_status_lookup.csv'`","`'../seeds/order_status_lookup.csv'`","`'../../seeds/order_status_lookup.csv'`"],"answer":3,"explain":"The seed path is relative to the `.sql` file, not the project root. Thus a model two levels down needs `../../`.","source":"https://v2.dataos.info/build/productize/assets/seeds"}]},{"id":"i3","title":"Modeling: data models, semantic models and metrics","duration":"3 hours","objectives":["Write SQL data models with correct grains and choose a model kind, including incremental kinds","Organize models into bronze, silver and gold layers whose order Vulcan resolves automatically","Define semantic models with dimensions, measures, segments, joins and ai_context","Define metrics with a valid timestamp `ts`, granularity, dimensions and cross-model join paths"],"lessons":[{"title":"Data models and model kinds","body":"### What a data model is\n\nA data model is the transform: SQL or Python that turns raw inputs into something useful. Each model file produces exactly one physical table or view. A SQL model has two parts:\n\n1. A **`MODEL` block** that declares name, kind, schedule, grain, description and assertions.\n2. A **`SELECT` query** with the transformation logic.\n\nVulcan reads dependencies from your `FROM` and `JOIN` clauses. If `silver.fct_daily_sales` selects from `bronze.orders`, Vulcan builds `bronze.orders` first. You never configure run order by hand.\n\n```sql\nMODEL (\n  name silver.fct_daily_sales,\n  kind FULL,\n  cron '*/15 * * * *',\n  grains (order_date, region_id, customer_id, product_id),\n  description 'Daily sales fact by date, customer, product, and region.',\n  assertions (\n    not_null(columns := (order_date, total_revenue))\n  )\n);\n```\n\nThe main properties are:\n\n- **`name`** follows `schema.table_name`.\n- **`grains`** declares the columns that uniquely identify a row, as a tuple in parentheses: `grains (order_id)` or `grains (customer_id, order_date)`. Grains are not decoration. Semantic joins need them to resolve cardinality.\n- Document columns on the `MODEL` block with `column_descriptions`, `column_tags`, `column_terms` and `column_classifications`, not with inline SQL comments.\n- `cron` and `start` override `model_defaults`.\n\n### Bronze, silver, gold\n\n`orders-analytics` organizes its 12 SQL models into three layers. Each layer reads only from the layer above it:\n\n- **Bronze** copies a source table close to its raw shape. It carries the assertions that every later layer trusts.\n- **Silver** joins bronze tables and applies business logic. It holds facts and dimensions such as `silver.fct_daily_sales` and `silver.dim_customer_profile`.\n- **Gold** reshapes silver for one consumer-facing question, such as RFM customer segmentation or a sales funnel.\n\n```sql\nMODEL (\n  name bronze.orders,\n  kind FULL,\n  grains (order_id),\n  description 'Order transactions with status, customer, and warehouse.',\n  assertions (\n    unique_values(columns := (order_id)),\n    not_null(columns := (order_id, customer_id, order_date, order_status))\n  )\n);\n\nSELECT order_id, customer_id, order_date, warehouse_id, order_status\nFROM public.orders_ext;\n```\n\n### Choosing a kind\n\nThe `kind` decides how the model materializes. It is the most important choice that you make for each model.\n\n| Kind | Rebuilds each run | Best for |\n| --- | --- | --- |\n| `VIEW` (default) | No, runs on demand | Lightweight, always-fresh transforms |\n| `FULL` | Yes, full rebuild | Small or aggregate tables |\n| `INCREMENTAL_BY_TIME_RANGE` | Partial, by time interval | Events, logs, transactions |\n| `INCREMENTAL_BY_UNIQUE_KEY` | Partial, upsert by key | Dimension and current-state tables |\n| `INCREMENTAL_BY_PARTITION` | Partial, by partition key | Datasets reprocessed by group |\n| `SEED` | Only when the CSV changes | Static reference data |\n| `SCD_TYPE_2_BY_TIME` / `_BY_COLUMN` | Partial, history tracking | Slowly changing dimensions |\n| `EMBEDDED` | Never. No table is created | Reusable SQL inlined as a subquery |\n\n`orders-analytics` uses `FULL` for all 12 SQL models because the volumes are small. If a table grows continuously and full rebuilds get too slow, use an incremental kind.\n\n### Incremental by time range\n\nAn `INCREMENTAL_BY_TIME_RANGE` model processes only missing or changed intervals. You tell Vulcan two things. The first is the **time column**. The second is a **`WHERE` clause** that filters upstream data with the interval macros `@start_ds`/`@end_ds` (or `@start_date`/`@end_date`):\n\n```sql\nMODEL (\n  name demo.incrementals_demo,\n  kind INCREMENTAL_BY_TIME_RANGE (\n    time_column transaction_date,\n    lookback 2,\n  ),\n  start '2024-10-25',\n  cron '@daily',\n  grains (transaction_id)\n);\n```\n\n- `lookback 2` reprocesses the previous two intervals on each run to catch late-arriving data.\n- Vulcan also adds its **own** filter on the time column of the model to the output. Thus even a buggy `WHERE` cannot write rows outside the target interval.\n- The time column must be in UTC. On Postgres, the strategy is DELETE by time range, then INSERT.\n- Keep queries idempotent (safe to run twice), so that restatement produces the same result.\n\n### Incremental by unique key\n\n`INCREMENTAL_BY_UNIQUE_KEY` behaves like an upsert. Vulcan inserts new keys and updates existing keys. It leaves alone the keys that are missing from new data. On Postgres 15+ it uses native `MERGE`.\n\n```sql\nMODEL (\n  name vulcan_demo.incremental_by_unique_key,\n  kind INCREMENTAL_BY_UNIQUE_KEY (\n    unique_key customer_id\n  ),\n  start '2025-01-01',\n  cron '@daily',\n  grains (customer_id)\n);\n```\n\n> **Tip:** On Trino, use a half-open window (`>= @start_dt AND < @end_dt`) instead of `BETWEEN`. This prevents duplicate rows at interval boundaries.\n\n### SQL or Python\n\nMost models are SQL. If you cannot express the logic in SQL, write a Python model with the `@model` decorator and an `ExecutionContext`. Python models cannot use `VIEW`, `SEED` or `EMBEDDED`, and Trino does not support them. Reusable SQL goes into macros, which you call inline as `@macro_name()`. `orders-analytics` uses `@revenue_order_filter(o.order_status)` to exclude cancelled orders in one consistent place.","sources":["https://v2.dataos.info/build/productize/assets/data-model","https://v2.dataos.info/references/resources/vulcan/models/data-models/model-kinds","https://v2.dataos.info/build/productize/connect-engine/postgres","https://v2.dataos.info/build/productize/connect-engine/trino"]},{"title":"Semantic models: dimensions, measures, segments and joins","body":"### Why a semantic model\n\nA semantic model is the interface between your physical tables and the people, BI tools and AI agents that query them. Without one, consumers must know your table layout and write their own SQL. With one, they query governed definitions that resolve the same way every time. The semantic layer also powers the REST, GraphQL and MySQL wire-protocol APIs.\n\nOne semantic file wraps one physical model. Semantic files live in `models/semantics/`:\n\n```yaml\nkind: semantic\nname: daily_sales\ndepends_on: silver.fct_daily_sales\ndescription: Daily sales performance by customer, product, category, and region.\n\ndimensions:\n  - order_date\n  - region_name\n  - category\n  - customer_id\n\nmeasures:\n  - name: total_daily_revenue\n    type: sum\n    expression: \"{daily_sales.total_revenue}\"\n    description: Total daily gross revenue\n\nsegments:\n  - name: high_revenue_days\n    expression: \"{daily_sales.total_revenue} >= 500\"\n    description: Daily rows with revenue of at least 500\n\njoins:\n  - name: customer_profile\n    type: many_to_one\n    expression: \"{daily_sales.customer_id} = {customer_profile.customer_id}\"\n```\n\nRequired: `kind: semantic`, a lowercase `name` (what consumers reference), `depends_on` (the physical model it wraps) and a non-empty `dimensions` list.\n\n### Dimensions\n\nDimensions are the columns to group and filter by. Use the bare column name, or use the full form to add `description`, `tags` and `terms`. The full form also takes `granularities` (`hour`, `day`, `week`, `month` for timestamps) and `format` (for example `percent`, `currency`). It also takes `behavior.type` (`identifier`, `categorical`, `bucketing`, `ordinal`). `public` defaults to `true`. The exception is the grain dimensions that Vulcan injects from the `grains` of the model. These stay hidden unless you declare them with `public: true`.\n\n### Measures\n\nMeasures are named aggregations that reference columns as `{name.column}`.\n\n- `type` is one of `count`, `count_distinct`, `count_distinct_approx`, `sum`, `avg`, `min`, `max`, `number`, `string`, `time`, `boolean`.\n- `expression` is required for every type except `count`. `count` is reserved, and Vulcan adds it implicitly.\n- `filters` restrict which rows are aggregated. They are not allowed on `number`, `string`, `time` or `boolean`.\n- `behavior.type` (`simple`, `flow`, `stock`, `ratio`, `derived`) tells APIs and AI consumers how to interpret the measure over time. `derived` measures combine other measures through `measure_refs`.\n- Measure names must be unique among measures and segments. They must not be the same as column names.\n\n### Segments\n\nSegments are reusable filter conditions with a `name` and a boolean `expression`. A segment can reference only the columns of its own model.\n\n### Joins\n\nJoins relate semantic models, so that consumers can analyze across them. Measures and segments can then reference joined columns. Vulcan resolves the path from the declared cardinality.\n\n- `name` must match the `name` of another semantic model (not its own).\n- `type` is `one_to_one`, `one_to_many` or `many_to_one`. **`many_to_many` is not supported**. Bridge it through an intermediate model and chain two joins.\n- Set **exactly one** of `on` or `expression`. `on` is a structured equi-join that compiles to `expression`. `expression` is the escape hatch for casts, functions and non-equality.\n\n```yaml\njoins:\n  - name: subscription_plans\n    type: many_to_one\n    on: plan_id\n```\n\nEvery dimension named in `on` must be declared on both sides. A **reciprocal join** is two models that join back to each other. Their types must be proper inverses, and `skip_for_bi` is required on exactly one side. Joins accept no `description`, `tags`, `terms` or `public` keys.\n\n> **Warning:** The physical model behind a joined semantic model must declare `grains (...)`. Without grains, the join cannot resolve cardinality, and validation fails.\n\n### Rollups\n\nA rollup is a pre-aggregated physical table that serves repeated aggregate queries. Rollups are opt-in. To use them, set `enable_rollup: true` in `config.yaml`. Then add a `rollups:` block that names measures, dimensions and an optional `time_dimension`/`granularity`.\n\n### `ai_context`\n\n`ai_context` makes a product safe for an AI agent. It holds instructions, synonyms, caveats and example queries that route natural-language questions to the correct measures. Set it at the top level, or on individual dimensions, measures, segments, joins or granularities.\n\n```yaml\nai_context:\n  instructions: >\n    Daily sales model for revenue, order volume, and shipment-rate analysis.\n    Grain is one order date, region, customer, and product.\n  synonyms:\n    - daily revenue\n    - sales performance\n  examples:\n    - description: daily revenue by region\n      format: sql\n      query: |\n        SELECT daily_sales.region_name, daily_sales.order_date,\n               MEASURE(daily_sales.total_daily_revenue)\n        FROM daily_sales GROUP BY 1, 2;\n```\n\n### Validation and casing\n\n`vulcan plan` makes sure that `depends_on` exists and that `dimensions` is not empty. It also makes sure that measure names do not collide with columns, that segments stay within the model and that join names resolve. Vulcan loads semantic YAML **without camelCase conversion**. Thus it silently ignores `dependsOn`. Always write snake_case keys exactly as the docs show them. Use lowercase on Postgres and uppercase on Snowflake.\n\n> **Note:** You do **not** configure access policies and masks in semantic models. They live in `policies/access/*.yml` against the physical model, and semantic models inherit them. You will do this in the Governance module.","sources":["https://v2.dataos.info/build/productize/assets/semantic-model","https://v2.dataos.info/references/resources/vulcan/models/semantic-models/joins","https://v2.dataos.info/references/resources/vulcan/models/semantic-models","https://v2.dataos.info/build/productize/governance"]},{"title":"Metrics: governed time series","body":"### A metric is one governed time series\n\nA metric is the primary interface for consumers and dashboards. It takes a **measure** from a semantic model and adds a **time column** and a **default granularity**. The result is a single time series that consumers can query. If you define the metric once, every dashboard, report and AI agent uses the same definition of a number. Define one metric per file in `models/metrics/`.\n\nThe smallest valid metric has only `kind`, `name`, `measure`, `ts` and `granularity`:\n\n```yaml\nkind: metric\nname: daily_sales_performance\nmeasure: daily_sales.total_daily_revenue\nts: daily_sales.order_date\ngranularity: day\n```\n\nThe full form adds slicing dimensions, segments and discovery metadata:\n\n```yaml\nkind: metric\nname: daily_sales_performance\nmeasure: daily_sales.total_daily_revenue\nts: daily_sales.order_date\ngranularity: day\ndimensions:\n  - name: region\n    ref: daily_sales.region_name\n  - name: category\n    ref: daily_sales.category\nsegments:\n  - daily_sales.high_revenue_days\ndescription: Daily revenue trends by region and category.\ntags:\n  - sales\n  - revenue\n```\n\n### What each part does\n\n- **`measure`**: the number to compute, as `semantic.measure`.\n- **`ts`**: the time axis, as `semantic.column`. `measure` and `ts` must point at different references.\n- **`granularity`**: the default bucket, from `second` through `year`. Consumers can override it at query time, so you do not need separate daily, weekly and monthly metrics.\n- **`dimensions`**: these let consumers slice. Use a bare reference (`daily_sales.region_name`) or a named slice (`name` + `ref`). Use a named slice to set a different display name or to prevent a collision. Also use it to override `description`, `tags`, `terms` or `ai_context` for this metric only.\n- **`segments`**: predefined filters by plain qualified reference. They take no metadata for each entry. To change one, edit the segment on its semantic model.\n- **`tags`** and **`terms`**: discovery in the Data Product Hub.\n\n> **Warning:** `ts` must resolve to a strict timestamp column (`TIMESTAMP`, `TIMESTAMPTZ`, `DATETIME` or equivalent). Vulcan rejects `DATE`, `TIME` and `INTERVAL` columns outright. Semantic dimensions are plain column references, with no `expression` to cast in. So do the cast **upstream**, in the `SELECT` of the physical model. For example, in `silver.fct_daily_sales` produce `DATE_TRUNC('day', o.order_date) AS order_date` (a timestamp), not `o.order_date::DATE`.\n\n### Cross-model metrics and join paths\n\nA metric can take its measure, time column and dimensions from different semantic models, as long as joins connect them. By default (`join_path: directed`), the path must follow **outgoing** join edges from the anchor model of the measure. `daily_sales` declares a `many_to_one` join to `customer_profile`. Thus a metric anchored on `daily_sales` can slice by `customer_profile.customer_segment`. The reverse is a metric anchored on `customer_profile` that slices by a `daily_sales` column. It reaches that column only by walking the join backwards, so it fails validation under `directed`.\n\nSet `join_path: connected` on the metric (or `metric_join_path: connected` for the whole project) to allow any path in any direction. This is common in one case: the only usable path runs against the non-BI-facing side of a reciprocal join.\n\nIn `orders-analytics`, `customer_lifetime_value` takes its measure and dimensions from `customer_profile`, which already joins to the underlying silver models. The product defines five metrics in total: `daily_sales_performance`, `weekly_revenue_trends`, `customer_lifetime_value`, `rfm_value_by_segment` and `fulfillment_conversion`.\n\n### Validation and legacy keys\n\n`vulcan plan` makes sure that the `measure` and `ts` references are valid and that it recognizes the granularity. It also makes sure that dimension and segment references resolve, and that cross-model join paths exist under the effective `join_path` mode.\n\nVulcan **rejects** two legacy keys:\n\n| Old key | Use instead |\n| --- | --- |\n| `time` | `ts` |\n| `slices` | `dimensions` |\n\n`measure`, `time` and `ts` are reserved. You cannot use them as a dimension `name` or as the auto-derived name of a segment (`<semantic_name>_<segment_name>`).\n\n### Designing good metrics\n\n- Start from a business question (\"How is daily revenue trending by region?\") and pick the measure that answers it.\n- Choose the default granularity that consumers ask for most. They can still override it.\n- Expose only the dimensions that are meaningful for slicing. Every dimension is a promise to support that cut.\n- Add `tags` and a clear `description`. Humans and agents search on these.\n- Keep `ai_context` on the underlying semantic model accurate, because metric dimensions can inherit or override it.\n\n### Seeing the whole chain\n\nThe asset chain always runs in one direction:\n\n```\nInputs + Seeds  -->  Data model (bronze -> silver -> gold)  -->  Semantic model  -->  Metrics\n```\n\nUse `vulcan export dag dag.html` to render the dependency graph. Make sure that bronze sits at the root and that gold depends on silver. Also make sure that every semantic model points at the physical model that you expect. A model that is missing from the graph usually means a wrong `FROM` reference.","sources":["https://v2.dataos.info/build/productize/assets/metrics","https://v2.dataos.info/build/get-started/build-journey-with-ai","https://v2.dataos.info/build/productize/plan-and-run"]}],"lab":{"title":"Build the bronze, silver, gold, semantic and metric layers of orders-analytics","goal":"A `dev` environment that contains bronze models for orders, customers, regions, order items and products, plus `silver.fct_daily_sales`, `silver.dim_customer_profile` and `gold.rfm_customer_segmentation`. It also contains the semantic models `daily_sales` and `customer_profile`, joined many-to-one, and the metrics `daily_sales_performance` and `customer_lifetime_value`.","duration":"2.5 hours","prereqs":["Module i2 lab complete: `vulcan info` succeeds and `inputs.yaml` declares `public.orders_ext`, `public.customers_ext`, `public.regions_ext`, `public.order_items_ext` and `public.products_ext` with grains","PostgreSQL credentials exported as environment variables"],"steps":["**Bronze: orders.** Save as `models/bronze/orders.sql`:\n\n```sql\nMODEL (\n  name bronze.orders,\n  kind FULL,\n  grains (order_id),\n  description 'Order transactions with status, customer, and warehouse.',\n  assertions (\n    unique_values(columns := (order_id)),\n    not_null(columns := (order_id, customer_id, order_date, order_status))\n  )\n);\n\nSELECT order_id, customer_id, order_date, warehouse_id, order_status\nFROM public.orders_ext;\n```","**Bronze: the other four tables.** Use the same pattern to create `models/bronze/customers.sql`, `regions.sql`, `order_items.sql` and `products.sql`. Each is `kind FULL`, declares `grains`, and selects explicit columns. Do not use `SELECT *`, because the `noselectstar` lint rule warns about it:\n\n```sql\nMODEL (\n  name bronze.customers,\n  kind FULL,\n  grains (customer_id),\n  assertions (\n    unique_values(columns := (customer_id)),\n    not_null(columns := (customer_id, region_id))\n  )\n);\n\nSELECT customer_id, region_id, name, email, signup_date\nFROM public.customers_ext;\n```\n\nFor regions, use columns `region_id, region_name` (grain `region_id`). For order items, use `order_id, item_id, product_id, quantity, unit_price` (grains `(order_id, item_id)`). For products, use `product_id, supplier_id, name, category, price` (grain `product_id`).","**Silver: daily sales fact.** Save as `models/silver/fct_daily_sales.sql`. Note that `order_date` has a timestamp type, because metrics reject `DATE`. Also note the explicit filter for cancelled orders:\n\n```sql\nMODEL (\n  name silver.fct_daily_sales,\n  kind FULL,\n  grains (order_date, region_id, customer_id, product_id),\n  description 'Daily sales fact by date, region, customer, and product.',\n  assertions (\n    not_null(columns := (order_date, total_revenue))\n  )\n);\n\nSELECT\n  DATE_TRUNC('day', o.order_date)   AS order_date,\n  c.region_id,\n  r.region_name,\n  o.customer_id,\n  oi.product_id,\n  p.category,\n  COUNT(DISTINCT o.order_id)        AS total_orders,\n  SUM(oi.quantity)                  AS total_items_sold,\n  SUM(oi.quantity * oi.unit_price)  AS total_revenue,\n  ROUND(SUM(oi.quantity * oi.unit_price) / NULLIF(COUNT(DISTINCT o.order_id), 0), 2) AS avg_order_value\nFROM bronze.orders      AS o\nJOIN bronze.customers   AS c  ON o.customer_id = c.customer_id\nJOIN bronze.regions     AS r  ON c.region_id   = r.region_id\nJOIN bronze.order_items AS oi ON o.order_id    = oi.order_id\nJOIN bronze.products    AS p  ON oi.product_id = p.product_id\nWHERE o.order_status <> 'Cancelled'\nGROUP BY 1, 2, 3, 4, 5, 6;\n```","**Silver: customer profile dimension.** Save as `models/silver/dim_customer_profile.sql`:\n\n```sql\nMODEL (\n  name silver.dim_customer_profile,\n  kind FULL,\n  grains (customer_id),\n  description 'One row per customer with lifetime order metrics and segment.'\n);\n\nWITH base AS (\n  SELECT\n    c.customer_id,\n    c.name AS customer_name,\n    c.email,\n    r.region_name,\n    COUNT(DISTINCT o.order_id)                     AS total_orders,\n    COALESCE(SUM(oi.quantity * oi.unit_price), 0)  AS total_revenue,\n    MAX(o.order_date)                              AS last_order_date\n  FROM bronze.customers AS c\n  JOIN bronze.regions AS r ON c.region_id = r.region_id\n  LEFT JOIN bronze.orders AS o\n    ON c.customer_id = o.customer_id AND o.order_status <> 'Cancelled'\n  LEFT JOIN bronze.order_items AS oi ON o.order_id = oi.order_id\n  GROUP BY c.customer_id, c.name, c.email, r.region_name\n)\nSELECT\n  customer_id,\n  customer_name,\n  email,\n  region_name,\n  total_orders,\n  total_revenue,\n  last_order_date,\n  CURRENT_DATE - last_order_date::DATE AS days_since_last_order,\n  CASE\n    WHEN last_order_date IS NULL OR CURRENT_DATE - last_order_date::DATE > 180 THEN 'Churned'\n    WHEN total_revenue >= 1000 THEN 'High Value'\n    WHEN total_revenue >= 500  THEN 'Medium Value'\n    ELSE 'Low Value'\n  END AS customer_segment\nFROM base;\n```","**Gold: RFM segmentation.** Save as `models/gold/rfm_customer_segmentation.sql`. Use the full five-tier scoring and nine segment labels from the worked example in the Build guide. That example is `gold.rfm_customer_segmentation`, which reads `silver.dim_customer_profile`. Keep its `unique_values`, `not_null` and `accepted_values` assertions. Leave out `rfm_score_consistency()` for now. You will write custom audits in module i4.","**Semantic: daily_sales.** Save as `models/semantics/daily_sales.yaml`:\n\n```yaml\nkind: semantic\nname: daily_sales\ndepends_on: silver.fct_daily_sales\ndescription: Daily sales performance by customer, product, category, and region.\n\nai_context:\n  instructions: >\n    Daily sales model for revenue, order volume, and average order value.\n    One row = one order_date x region x customer x product combination.\n  synonyms:\n    - daily revenue\n    - sales performance\n\ndimensions:\n  - order_date\n  - region_name\n  - customer_id\n  - category\n\nmeasures:\n  - name: total_daily_revenue\n    type: sum\n    expression: \"{daily_sales.total_revenue}\"\n    description: Total daily gross revenue (non-cancelled orders)\n  - name: average_order_value\n    type: avg\n    expression: \"{daily_sales.avg_order_value}\"\n    description: Average order value, revenue divided by order count\n\nsegments:\n  - name: high_revenue_days\n    expression: \"{daily_sales.total_revenue} >= 500\"\n    description: Daily rows with total revenue at or above 500\n\njoins:\n  - name: customer_profile\n    type: many_to_one\n    on: customer_id\n```","**Semantic: customer_profile.** Save as `models/semantics/customer_profile.yaml`:\n\n```yaml\nkind: semantic\nname: customer_profile\ndepends_on: silver.dim_customer_profile\ndescription: Customer-level lifetime revenue, order counts, and segment.\n\ndimensions:\n  - customer_id\n  - customer_name\n  - email\n  - region_name\n  - customer_segment\n  - last_order_date\n\nmeasures:\n  - name: total_lifetime_revenue\n    type: sum\n    expression: \"{customer_profile.total_revenue}\"\n    description: Sum of lifetime revenue across customers\n  - name: customer_count\n    type: count_distinct\n    expression: \"{customer_profile.customer_id}\"\n    description: Number of distinct customers\n\nsegments:\n  - name: churned_customers\n    expression: \"{customer_profile.customer_segment} = 'Churned'\"\n```","**Metrics.** Save `models/metrics/daily_sales_performance.yaml` (the full form from the lesson) and add a cross-model slice. Then save `models/metrics/customer_lifetime_value.yaml`:\n\n```yaml\nkind: metric\nname: daily_sales_performance\nmeasure: daily_sales.total_daily_revenue\nts: daily_sales.order_date\ngranularity: day\ndimensions:\n  - name: region\n    ref: daily_sales.region_name\n  - name: segment\n    ref: customer_profile.customer_segment\nsegments:\n  - daily_sales.high_revenue_days\ndescription: Daily revenue trends by region and customer segment.\ntags:\n  - sales\n  - revenue\n```\n\n```yaml\nkind: metric\nname: customer_lifetime_value\nmeasure: customer_profile.total_lifetime_revenue\nts: customer_profile.last_order_date\ngranularity: month\ndimensions:\n  - name: region\n    ref: customer_profile.region_name\ndescription: Lifetime revenue by customer region, bucketed by last order month.\ntags:\n  - customers\n```","**Inspect before you plan.**\n\n```bash\nvulcan lint\nvulcan render silver.fct_daily_sales\nvulcan export dag dag.html\nvulcan evaluate silver.fct_daily_sales --limit 10\n```\n\nOpen `dag.html` and make sure that it shows the chain `public.*_ext -> bronze.* -> silver.* -> gold.*`. In the `evaluate` output, make sure that revenue is not negative and that every row has an `order_date`.","**Plan into a dev environment.**\n\n```bash\nvulcan plan dev\n```\n\nReview the listed models (all `[new]`) and the audit summary, then accept the plan. If validation fails on the join, make sure that both semantic models declare `customer_id` as a dimension. Also make sure that `silver.dim_customer_profile` declares `grains (customer_id)`.","**Experiment with a validation error (then revert).** In `customer_lifetime_value.yaml`, add a dimension `ref: daily_sales.category` and run `vulcan plan dev` again. Look at the join-path validation error. Under the default `directed` mode, the path from `customer_profile` to `daily_sales` walks the join backwards. Revert the change."],"verify":"- `vulcan plan dev` completes. It evaluates all bronze, silver and gold models plus the seed, and the audit summary shows `0 failed`.\n- `vulcan evaluate silver.dim_customer_profile --limit 10` returns one row per customer with a `customer_segment` value.\n- The plan reports no semantic or metric validation errors for `daily_sales`, `customer_profile`, `daily_sales_performance` and `customer_lifetime_value`.\n- `dag.html` shows `gold.rfm_customer_segmentation` depending on `silver.dim_customer_profile`.","sources":["https://v2.dataos.info/build/productize/assets/data-model","https://v2.dataos.info/build/productize/assets/semantic-model","https://v2.dataos.info/build/productize/assets/metrics","https://v2.dataos.info/build/get-started/build-journey-with-ai","https://v2.dataos.info/build/productize/plan-and-run","https://v2.dataos.info/references/resources/vulcan/models/semantic-models/joins"]},"takeaways":["One model file produces one table or view. Vulcan derives run order from FROM and JOIN.","Declare `grains` on every model. Semantic joins depend on them.","Choose the kind on purpose. If rebuilds get slow, move from FULL to an incremental kind.","Semantic models need kind, name, depends_on and dimensions. Use only snake_case keys.","Joins support one_to_one, one_to_many and many_to_one. Set exactly one of `on` or `expression`.","Metric `ts` must be a real timestamp. Cast upstream, and use `ts`/`dimensions`, never `time`/`slices`."],"quiz":[{"q":"An `events` model receives millions of new rows each day, and some events arrive up to two days late. Which configuration fits best?","options":["`kind FULL` with `cron '@daily'`","`kind INCREMENTAL_BY_TIME_RANGE (time_column event_ts, lookback 2)` with a `WHERE` on `@start_ds`/`@end_ds`","`kind VIEW` so it is always fresh","`kind SEED` reloaded when the CSV changes"],"answer":1,"explain":"Time-series data that grows continuously suits INCREMENTAL_BY_TIME_RANGE. `lookback 2` reprocesses recent intervals to catch late data. FULL rebuilds everything every day.","source":"https://v2.dataos.info/references/resources/vulcan/models/data-models/model-kinds"},{"q":"`vulcan plan` fails validation on a join from `daily_sales` to `customer_profile` with a cardinality error. Both semantic models look correct. What do you look at first?","options":["Whether `silver.dim_customer_profile` declares `grains (customer_id)`","Whether the join has a `description`","Whether `vde: true` is set","Whether the metric uses `slices`"],"answer":0,"explain":"The physical model behind a joined semantic model must declare grains. Without them, the join cannot resolve cardinality. Joins do not accept a description key at all.","source":"https://v2.dataos.info/build/productize/assets/semantic-model"},{"q":"A metric uses `ts: daily_sales.order_date`, and validation rejects it. The physical model selects `o.order_date::DATE AS order_date`. What is the fix?","options":["Add `expression: CAST(order_date AS TIMESTAMP)` to the dimension in the semantic model","Change `granularity` to `day`","Produce a timestamp in the physical model's SELECT, for example `DATE_TRUNC('day', o.order_date) AS order_date`","Rename the key to `time`"],"answer":2,"explain":"`ts` must be a strict timestamp, and Vulcan rejects DATE. Semantic dimensions have no `expression` to cast in, so cast upstream in the physical model. `time` is a rejected legacy key.","source":"https://v2.dataos.info/build/productize/assets/metrics"},{"q":"You must relate `students` and `courses`. Each student takes many courses, and each course has many students. How do you model this in Vulcan semantics?","options":["Declare `type: many_to_many` on the join","Use a `segment` instead of a join","Bridge through an intermediate semantic model over the enrollment table and chain two joins","Set `skip_for_bi: true` on both sides"],"answer":2,"explain":"Many-to-many joins are not supported. Bridge them through an intermediate model that wraps the bridge table, and chain two joins.","source":"https://v2.dataos.info/references/resources/vulcan/models/semantic-models/joins"},{"q":"A teammate's semantic file uses `dependsOn: silver.fct_daily_sales`, and the model behaves as if it has no backing table. Why?","options":["Semantic YAML is loaded without camelCase-to-snake_case conversion, so `dependsOn` is silently ignored","`depends_on` must point at a metric","Semantic models must be in `models/metrics/`","The physical model must be a VIEW"],"answer":0,"explain":"Semantic (and DQ) YAML keys must be snake_case exactly as the docs show them. Vulcan does not convert camelCase keys. It silently ignores them.","source":"https://v2.dataos.info/build/productize/assets/semantic-model"}]},{"id":"i4","title":"Quality gates: unit tests, assertions and data quality","duration":"2 hours","objectives":["Tell the difference between unit tests, assertions with audits, and DQ checks by what each one tests and how it fails","Write and run YAML unit tests with partial matching and multiple inputs","Write custom audits and attach them as blocking assertions, and explain Write-Audit-Publish","Write DQ packs with profiles and expectations, and do not use deprecated syntax"],"lessons":[{"title":"Three quality tools, and unit tests first","body":"### Three tools, three jobs\n\nA Data Product makes guarantees about its data. Vulcan gives you three different tools to keep these guarantees. The names sound alike, so learn the difference:\n\n| Tool | Where it lives | What it tests | When it runs | On failure |\n| --- | --- | --- | --- | --- |\n| **Unit test** | `tests/test_*.yaml` | The model's SQL **logic**, against hand-written mock fixtures | On demand (`vulcan test`, CI) and automatically on every plan | The plan stops, and you see a diff of expected and actual rows |\n| **Assertion** (+ audit) | `assertions (...)` in the `MODEL` block, and custom rules in `audits/*.sql` | Real **data** produced by the model | Every time the model materializes | **Blocks**: execution stops, and nothing downstream builds on it |\n| **DQ check** | `dq/*.yml` (`kind: dq`) | Real data, scored **over time** | After a successful run or plan apply | **Warns only**: a result is recorded, the run continues |\n\nThe one-line version from the docs: *unit tests validate logic, audits define a rule, assertions attach that rule to a model and block bad data, and DQ checks watch data over time and warn without blocking.*\n\nIn `orders-analytics`, this means two unit tests, inline assertions with three custom audits, and seven DQ packs.\n\n### Unit tests: logic before data\n\nA unit test runs the SQL of a model against fixtures that you write by hand. A fixture is a set of input rows and expected output rows. A test uses no real data and no warehouse tables. Thus, tests are fast and deterministic (they give the same result every time). They are a good fit for CI.\n\nRules for test files:\n\n- They are in `tests/`. The filename must **start with `test`** and end in `.yaml` or `.yml`. One file can hold several tests.\n- Each test needs three keys: `model` (the model under test), `inputs` (mock rows for each upstream dependency) and `outputs` (expected results).\n\nThe `orders-analytics` test below proves that cancelled orders never count toward revenue. It shows only the essential rows:\n\n```yaml\ntest_fct_daily_sales_excludes_cancelled_orders:\n  model: silver.fct_daily_sales\n  inputs:\n    bronze.orders:\n      - order_id: 1\n        customer_id: 10\n        order_date: '2026-01-01 10:00:00'\n        warehouse_id: 100\n        order_status: Shipped\n      - order_id: 2\n        customer_id: 10\n        order_date: '2026-01-01 11:00:00'\n        warehouse_id: 100\n        order_status: Cancelled\n    bronze.order_items:\n      - order_id: 1\n        item_id: 1\n        product_id: 200\n        quantity: 2\n        unit_price: 10.00\n      - order_id: 2\n        item_id: 1\n        product_id: 200\n        quantity: 5\n        unit_price: 10.00\n    # bronze.customers, bronze.regions and bronze.products rows omitted here\n  outputs:\n    query:\n      partial: true\n      rows:\n        - customer_id: 10\n          total_orders: 1\n          total_revenue: 20.00\n```\n\nTwo orders go in. Only the Shipped order (2 x 10.00) reaches the output.\n\n### Capabilities you will use\n\n- **`partial: true`** (at `outputs.partial` or `outputs.query.partial`) compares only the columns that you list and ignores the other columns.\n- **Column order matters.** Expected output columns must be in the same order as the `SELECT` of the model. If a test fails but the data \"looks right\", the cause is often a mismatch in column order.\n- **Shortcut:** if `rows` is the only key under an input, you can omit the `rows:` level.\n- **Incremental models:** set `vars.start` and `vars.end` to control the `@start_ds`/`@end_ds` macros.\n- **Freeze time:** set `vars.execution_time` so that models that use `CURRENT_TIMESTAMP`/`CURRENT_DATE` are deterministic.\n- **CTEs:** to assert on an intermediate CTE, use `outputs.ctes.<cte_name>.rows`.\n- **Formats:** inputs are YAML rows by default. You can also use `format: csv`, a SQL `query`, or `path` to a file. You cannot use `query` and `rows` together.\n- **Types:** if Vulcan infers the wrong type for a mock column, declare it under `inputs.<model>.columns`.\n- **Fixture schema:** set `<test_name>.schema` to choose the schema where Vulcan creates the fixture views.\n\nTo start a test from real data, run the command below. Then improve the test by hand:\n\n```bash\nvulcan create_test silver.fct_daily_sales --query bronze.orders \"SELECT * FROM bronze.orders LIMIT 5\"\n```\n\n### Running tests\n\n```bash\n# Run all tests\nvulcan test\n\n# Run a specific file\nvulcan test tests/test_fct_daily_sales.yaml\n\n# Run a single test with the :: syntax\nvulcan test tests/test_fct_daily_sales.yaml::test_fct_daily_sales_excludes_cancelled_orders\n```\n\n`vulcan test` also accepts `-k`, which selects tests by substring, and `--preserve-fixtures`, which keeps fixture tables for debugging. A failing test prints a diff of expected (`exp`) and actual (`act`) rows. Tests run automatically on every `vulcan plan`. Thus, a broken business rule stops the plan before any warehouse work starts. Use `--skip-tests` only for a known reason.","sources":["https://v2.dataos.info/build/productize/overview","https://v2.dataos.info/build/productize/unit-test","https://v2.dataos.info/references/resources/vulcan/quality/tests","https://v2.dataos.info/references/resources/vulcan/cli"]},{"title":"Assertions and audits: the blocking layer","body":"### Audits define, assertions attach\n\nTwo terms go together:\n\n- **Audit**: the validation rule itself. It is a named SQL query that returns rows when data is bad.\n- **Assertion**: the attachment of a rule to a model. You declare it in the `assertions (...)` property of the `MODEL` block.\n\nAn assertion passes when its query returns **zero rows**. Each row that the query returns is a failing row. `audits (...)` is an accepted alias for `assertions (...)` on the `MODEL` block. Both block in the same way.\n\n### How a model run uses assertions\n\nFor every model run:\n\n1. Vulcan evaluates the model SQL and inserts the data.\n2. It runs each attached assertion against the new data.\n3. If any assertion returns rows, execution stops and Vulcan reports the failure.\n4. If every assertion returns zero rows, Vulcan promotes the model.\n\nAssertions block by design. When one fails, Vulcan does not apply the plan and does not run the downstream models. Thus, bad data does not spread.\n\n### Inline built-in assertions\n\nThe fastest checks do not need a SQL file:\n\n```sql\nMODEL (\n  name silver.fct_daily_sales,\n  kind FULL,\n  grains (order_date),\n  assertions (\n    not_null(columns := (order_date, total_revenue)),\n    unique_values(columns := (order_date)),\n    accepted_range(column := total_revenue, min_v := 0)\n  )\n);\n```\n\n| Category | Built-ins |\n| --- | --- |\n| Null and rows | `not_null`, `at_least_one`, `not_null_proportion`, `number_of_rows` |\n| Uniqueness | `unique_values`, `unique_combination_of_columns` |\n| Value | `accepted_values`, `not_accepted_values`, `accepted_range`, `not_constant`, `forall`, `sequential_values` |\n| String | `not_empty_string`, `string_length_between`, `valid_uuid`, `valid_email`, `valid_url` |\n| Statistical | `mean_in_range`, `z_score` |\n\nUse `forall(criteria := (price > 0, LENGTH(name) > 0))` for any boolean SQL expression that no built-in covers.\n\n### Custom audits\n\nIf no built-in fits, write a `.sql` file in `audits/` that returns the bad rows. `@this_model` refers to the model that the audit is attached to. For incremental models, Vulcan adds a time-range filter. Thus, the audit tests only the interval that just ran.\n\n```sql\nAUDIT (\n  name daily_sales_metric_consistency\n);\n\nSELECT order_date, region_id, total_orders, total_revenue, avg_order_value\nFROM @this_model\nWHERE total_orders <= 0\n   OR total_revenue < 0\n   OR shipment_rate < 0\n   OR shipment_rate > 1\n   OR ROUND(total_revenue / NULLIF(total_orders, 0), 2) <> avg_order_value;\n```\n\nAttach it by name, together with built-ins. You can use a custom audit again. Define it once and attach it to any model:\n\n```sql\nMODEL (\n  name silver.fct_daily_sales,\n  assertions (\n    not_null(columns := (order_date, region_id)),\n    daily_sales_metric_consistency()\n  )\n);\n```\n\nTo attach audits to **every** model, list them under `model_defaults` in `config.yaml`. The key can be `assertions` or `audits`:\n\n```yaml\nmodel_defaults:\n  assertions:\n    - assert_positive_order_ids\n```\n\n### Write-Audit-Publish: why failures block publication\n\nYou do not build Write-Audit-Publish (WAP) by hand. `vulcan plan` already does it for models with assertions. It writes each model to a new physical table and runs the assertions of that model. It changes production to the new table only after every blocking assertion passes. If any assertion fails, the whole plan stops and nothing publishes at any layer. Consumers continue to see the previous version until someone fixes the problem.\n\nPut the heavy checks where data first becomes trustworthy, which is typically silver. Then gold can stay simple and inherit that trust.\n\n### Plan versus run\n\n| Command | On assertion failure |\n| --- | --- |\n| `vulcan plan` | Production does not change. The bad data stays in the isolated table that Vulcan builds |\n| `vulcan run` | The model writes to the production table first, and then the assertion runs. The run stops. The bad rows can land, but downstream models will not build on them |\n\nBecause of this difference, every production change must go through `vulcan plan`. To run attached audits on demand, use these commands:\n\n```bash\nvulcan audit --start <date> --end <date>\nvulcan audit --model silver.fct_daily_sales\n```\n\nTo see the failing query and rows, the Build guide adds `--verbose` (for example `vulcan plan --verbose` or `vulcan audit --verbose`).\n\n> **Warning:** Do not confuse a failing assertion with a failing DQ check. A failing assertion stopped bad data, which is good. A failing DQ check only tells you that something drifted.","sources":["https://v2.dataos.info/build/productize/assertions","https://v2.dataos.info/references/resources/vulcan/quality/assertions","https://v2.dataos.info/references/resources/vulcan/concepts/write-audit-publish","https://v2.dataos.info/references/resources/vulcan/cli"]},{"title":"Data quality checks: monitor and warn","body":"### What a DQ check is\n\nA DQ check is a promise about the data of a model that Vulcan **scores over time**. A failing assertion stops the run, but a failing DQ check does not. The model still materializes. The check records the failure and builds a history of data health. The Data Product Hub shows this history on its Quality views.\n\n| Use a DQ check for | Use an assertion instead for |\n| --- | --- |\n| Monitoring quality trends over time | A critical rule that must block bad data |\n| Row-count or value-range checks that you do not want to block | Null or uniqueness checks on key columns |\n| Cross-table consistency monitoring | Any rule where a failure must stop the run |\n\n### The shape\n\nDQ checks are in `dq/*.yml`. Each model has one pack, with `kind: dq`:\n\n```yaml\nkind: dq\nname: fct_daily_sales_dq\ndepends_on: silver.fct_daily_sales\n\nprofiles:\n  - order_date\n  - total_revenue\n\nexpectations:\n  - expectation: expect_table_row_count_to_be_between\n    min_value: 20\n    meta:\n      name: minimum_daily_sales_rows\n      dimension: completeness\n      description: Daily sales should contain at least 20 rows\n  - expectation: expect_column_values_to_not_be_null\n    column: order_date\n    meta:\n      name: no_missing_order_date\n      dimension: completeness\n  - expectation: expect_column_values_to_be_between\n    column: total_revenue\n    min_value: 0\n    meta:\n      name: total_revenue_non_negative\n      dimension: validity\n```\n\nEvery pack needs `kind: dq`, a unique `name`, `depends_on` and `expectations`. `profiles` and a pack-level `filter` are optional. This filter is a SQL condition that limits the rows that every check judges. Vulcan loads DQ YAML without key conversion, as it does for semantic YAML. Thus, Vulcan ignores `dependsOn` and shows no message. On Snowflake, write column names in uppercase.\n\n### Profiles observe, expectations validate\n\n**Profiles** collect statistics for the listed columns on every run: null count, distinct count, min, max and distribution. Profiles do not validate anything. Vulcan stores profiles over time. Thus, profile first and learn what \"normal\" looks like. Then set thresholds.\n\n> **Note:** In the past, you configured column profiling through a `profiles` property inside the `MODEL(...)` block. That property is deprecated. Profiling is now only under `profiles:` in a `kind: dq` file.\n\n**Expectations** validate. Each expectation names a check and its limit, with optional `meta` (`name`, `dimension`, `description`). Set `meta.name` on each check that you want to follow over time. Classify every check with `meta.dimension`: `completeness`, `validity`, `accuracy`, `consistency`, `uniqueness`, `timeliness`, `conformity` or `coverage`.\n\n### Check types\n\n- **Missing data:** `expect_column_values_to_not_be_null`\n- **Row count:** `expect_table_row_count_to_be_between` (`min_value`, `max_value`)\n- **Uniqueness:** `expect_column_values_to_be_unique`, `expect_compound_columns_to_be_unique` (with `column_list`)\n- **Validity:** `expect_column_values_to_be_in_set` (with `value_set`), `expect_column_values_to_match_regex`, `expect_column_values_to_be_between`\n- **Numeric:** `expect_column_mean_to_be_between`, `expect_column_min_to_be_between`, `expect_column_max_to_be_between`, `expect_column_sum_to_be_between`\n- **Freshness:** `vulcan_freshness`\n- **Custom SQL:** `unexpected_rows_expectation` with an `unexpected_rows_query`. It fails if the query returns any rows\n\n```yaml\nexpectations:\n  - expectation: vulcan_freshness\n    column: updated_at\n    op: \"<\"\n    threshold_seconds: 86400\n    meta:\n      name: updated_within_a_day\n      dimension: timeliness\n```\n\n### When checks run\n\nDQ checks run after Vulcan writes the data, and only when the write succeeded. When a scheduled run or a plan apply finishes without errors, Vulcan scores the packs for the models that it just built. Vulcan does not score a model that failed to build. If the run or apply hits any error, Vulcan skips scoring for that job. A failed check is a recorded result. It never rolls the table back.\n\n### Deprecations to respect\n\n- **`rules:` syntax.** Packs that list checks under `rules:` still load, and Vulcan converts each rule to an expectation. But `rules:` will be deprecated in **December 2026**. Write new checks as `expectations:` and migrate older packs. A pack contains one list or the other, never both.\n- **Anomaly detection and change-over-time checks** (`vulcan_anomaly_detection`, `vulcan_change_over_time`, and the matching `rules:` lines) are deprecated as of September 2026. Do not use them in new DQ files.\n\n### Choosing the right gate\n\nAsk one question: *if this fails, do you want consumers to see the new data?* If no, it is an assertion. If yes, but someone must know about the failure, it is a DQ check. If the question is \"is my SQL logic right?\", it is a unit test.","sources":["https://v2.dataos.info/build/productize/data-quality","https://v2.dataos.info/references/resources/vulcan/quality/data-quality","https://v2.dataos.info/releasenotes/september-2026"]}],"lab":{"title":"Add unit tests, blocking audits and DQ packs to orders-analytics","goal":"Two passing unit tests, three custom audits attached as assertions, two DQ packs, and proof from your own runs that a failing assertion blocks a plan but a failing DQ check only warns.","duration":"2 hours","prereqs":["Module i3 lab is complete: the bronze, silver, gold, semantic and metric files are applied to `dev`"],"steps":["**Write the cancelled-orders test.** Save the full `test_fct_daily_sales_excludes_cancelled_orders` test from the Unit Test page as `tests/test_fct_daily_sales.yaml`. Include all five bronze inputs. The lesson does not show the inputs for three tables. These inputs are:\n\n```yaml\n    bronze.customers:\n      - customer_id: 10\n        region_id: 1\n        name: Avery Stone\n        email: avery.stone@example.com\n        signup_date: '2025-12-01'\n    bronze.regions:\n      - region_id: 1\n        region_name: North\n    bronze.products:\n      - product_id: 200\n        supplier_id: 300\n        name: Widget Basic\n        category: Widgets\n        price: 10.00\n```","**Write the RFM champion test.** Save this test as `tests/test_rfm_customer_segmentation.yaml`:\n\n```yaml\ntest_rfm_customer_segmentation_champion:\n  model: gold.rfm_customer_segmentation\n  inputs:\n    silver.dim_customer_profile:\n      - customer_id: 1\n        customer_name: Avery Stone\n        email: avery.stone@example.com\n        region_name: North\n        total_orders: 5\n        total_revenue: 1500.00\n        last_order_date: '2026-01-01 10:00:00'\n        days_since_last_order: 10\n        customer_segment: High Value\n  outputs:\n    query:\n      partial: true\n      rows:\n        - customer_id: 1\n          rfm_segment: Champions\n```","**Run the tests.**\n\n```bash\nvulcan test\n```\n\nThe expected output is:\n\n```\ntest_fct_daily_sales_excludes_cancelled_orders          PASS\ntest_rfm_customer_segmentation_champion                 PASS\n```","**Prove the test catches a logic bug.** Temporarily delete the line `WHERE o.order_status <> 'Cancelled'` in `models/silver/fct_daily_sales.sql`. Then run this command:\n\n```bash\nvulcan test tests/test_fct_daily_sales.yaml::test_fct_daily_sales_excludes_cancelled_orders\n```\n\nRead the diff of `exp` and `act` rows. The actual rows show `total_orders: 2` and `total_revenue: 70.00`. Put the line back. Run the test again until it passes.","**Write three custom audits.** Create `audits/daily_sales_metric_consistency.sql`:\n\n```sql\nAUDIT (\n  name daily_sales_metric_consistency\n);\n\nSELECT order_date, region_id, total_orders, total_revenue, avg_order_value\nFROM @this_model\nWHERE total_orders <= 0\n   OR total_revenue < 0\n   OR ROUND(total_revenue / NULLIF(total_orders, 0), 2) <> avg_order_value;\n```\n\nCreate `audits/rfm_score_consistency.sql`:\n\n```sql\nAUDIT (\n  name rfm_score_consistency\n);\n\nSELECT customer_id, rfm_score\nFROM @this_model\nWHERE rfm_score <> recency_score::TEXT || frequency_score::TEXT || monetary_score::TEXT;\n```\n\nCreate `audits/order_status_in_lookup.sql`:\n\n```sql\nAUDIT (\n  name order_status_in_lookup\n);\n\nSELECT o.order_id, o.order_status\nFROM @this_model AS o\nLEFT JOIN bronze.order_status_lookup AS l\n  ON o.order_status = l.order_status\nWHERE l.order_status IS NULL;\n```","**Attach the audits as assertions.** Add `accepted_range(column := total_revenue, min_v := 0)` and `daily_sales_metric_consistency()` to the `assertions (...)` of `silver.fct_daily_sales`. Add `rfm_score_consistency()` to `gold.rfm_customer_segmentation`. Add `order_status_in_lookup()` to `bronze.orders`. Then run this command:\n\n```bash\nvulcan audit\n```\n\nMake sure that all audits report PASS.","**See an assertion block a plan.** Temporarily add `accepted_values(column := order_status, is_in := ('Shipped'))` to `bronze.orders`. Then run this command:\n\n```bash\nvulcan plan dev\n```\n\nThe plan stops on the failing assertion. Vulcan does not publish `silver.*`/`gold.*`. To see the failing rows, run `vulcan plan dev --verbose`. The failing rows are orders with the status Confirmed or Cancelled. Remove the temporary assertion.","**Add DQ packs.** Save the `fct_daily_sales_dq` pack from the lesson as `dq/fct_daily_sales_dq.yml`. Then create `dq/dim_customer_profile_dq.yml`:\n\n```yaml\nkind: dq\nname: dim_customer_profile_dq\ndepends_on: silver.dim_customer_profile\n\nprofiles:\n  - total_revenue\n  - customer_segment\n\nexpectations:\n  - expectation: expect_column_values_to_not_be_null\n    column: email\n    meta:\n      name: no_missing_emails\n      dimension: completeness\n      description: Every customer has an email\n  - expectation: expect_column_values_to_be_in_set\n    column: customer_segment\n    value_set: [High Value, Medium Value, Low Value, Churned]\n    meta:\n      name: valid_customer_segment\n      dimension: validity\n  - expectation: vulcan_freshness\n    column: last_order_date\n    op: \"<\"\n    threshold_seconds: 3600\n    meta:\n      name: recent_orders_within_an_hour\n      dimension: timeliness\n```","**Apply and compare behaviors.** Run `vulcan plan dev` again. Make sure that the plan succeeds. The one-hour freshness expectation is strict on purpose, and it will probably fail on demo data. But the models still materialize, because Vulcan records a DQ failure and does not block. After you see this behavior, relax `threshold_seconds` to a realistic value (for example `604800`, one week)."],"verify":"- `vulcan test` reports both tests `PASS`.\n- `vulcan audit` finishes with `0 audit errors`, including `daily_sales_metric_consistency`, `rfm_score_consistency` and `order_status_in_lookup`.\n- With the temporary `accepted_values` assertion, `vulcan plan dev` stopped. After you removed it, the plan applies.\n- With the strict freshness expectation, the plan still applied and the models materialized. This shows that DQ does not block.","sources":["https://v2.dataos.info/build/productize/unit-test","https://v2.dataos.info/build/productize/assertions","https://v2.dataos.info/build/productize/data-quality","https://v2.dataos.info/references/resources/vulcan/quality/data-quality","https://v2.dataos.info/references/resources/vulcan/cli"]},"takeaways":["Unit tests validate logic with fixtures. Assertions block bad data. DQ checks warn over time.","Test file names start with `test`. Each test needs `model`, `inputs` and `outputs`. Expected columns follow the SELECT order.","An assertion passes when its query returns zero rows. Custom audits use `@this_model`.","`vulcan plan` implements Write-Audit-Publish: nothing publishes unless every blocking assertion passes.","DQ packs (`kind: dq`) run only after successful writes. Use `expectations:`, not `rules:`.","Anomaly-detection and change-over-time checks are deprecated. Profiling is only in DQ files."],"quiz":[{"q":"A rule says `customer_id` must never be null in `silver.dim_customer_profile`, and consumers must never see a version that violates it. Where does it belong?","options":["A DQ pack with `expect_column_values_to_not_be_null`","An assertion such as `not_null(columns := (customer_id))` in the MODEL block","A unit test with `partial: true`","A `profiles:` entry"],"answer":1,"explain":"Rules whose failure must stop bad data belong in assertions, which block. DQ checks only record a result, and profiles only observe.","source":"https://v2.dataos.info/build/productize/data-quality"},{"q":"A unit test fails, but the printed actual rows look the same as the expected rows. What is the most likely cause?","options":["The expected output columns are not in the same order as the model's SELECT","The test file is named `daily_sales_test.yaml`","`partial: true` is set","The model has no assertions"],"answer":0,"explain":"The docs warn that when a test fails but the data looks correct, the cause is often a mismatch in column order. Vulcan does not pick up a misnamed file at all, so that test does not fail.","source":"https://v2.dataos.info/build/productize/unit-test"},{"q":"A scheduled `vulcan run` finds that an assertion on `silver.fct_daily_sales` fails. What happens?","options":["Production is untouched because run uses an isolated table","The bad rows can already be in the production table, but the run stops and downstream models do not build on them","The failure is recorded as a DQ result and the run continues","Vulcan rolls back the table automatically"],"answer":1,"explain":"With `vulcan run`, the model writes to production first, and then the assertion runs. If the assertion fails, the run stops. With `vulcan plan`, production does not change.","source":"https://v2.dataos.info/build/productize/assertions"},{"q":"You are reviewing a DQ pack that uses `vulcan_change_over_time` and lists checks under `rules:`. What do you recommend?","options":["Nothing, because both are the current recommended formats","Move the checks into the MODEL block's `profiles` property","Move checks to `expectations:` and remove the deprecated change-over-time check","Convert the pack to `kind: audit`"],"answer":2,"explain":"`rules:` will be deprecated in December 2026 and `expectations:` replaces it. Change-over-time and anomaly checks were deprecated in September 202
