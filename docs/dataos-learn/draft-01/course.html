 broader roles. But you must understand the view of the consumer, because consumers use your own products this way.\n\n### Two separate kinds of access\n\n| Access | Who grants it | What it gives you |\n| --- | --- | --- |\n| **Tenant access** with the `Data Consumer` role | Your Tenant Admin (DataOS Operator if you do not know the tenant) | Sign in, use the Tenant's UI applications such as the Data Product Hub, search and browse products |\n| **Data Product access** | The product owner or Tenant Admin, per product | **Read-only** access to that product's semantic models, outputs, and APIs |\n\nTenant access does **not** decide which products you can use. Each product has its own access rules. When you request tenant access, state your goal, the tenant name (if you know it), and the products or domain that you need. For product access, find the owner in the **Contacts** section of the product.\n\nRead-only means that you can find, evaluate, and query the products that you are granted. You cannot create Resources, run Data Product workloads, edit products, or manage access. If you need to transform, join, or publish something new, that is Developer work. Request the `Data Developer` role.\n\n### Governance is enforced on every path\n\nThe product owner defines access policies. When you query, DataOS checks the policies against your identity. It applies them across SQL, REST, GraphQL, and the product UI:\n\n- **Masked columns**: the field still appears, but `null`, a hash, or another masked expression replaces its value.\n- **Row-level filters**: you see only your slice, for example your region or business unit.\n\nA masked or empty column, or a total that seems low, is usually policy, not a bug. If you still need the data, tell the owner which field or rows you need and why. The approval reaches you as an audited grant or policy update.\n\n### Create an API token\n\nExternal tools (BI, SQL clients, APIs, AI clients) authenticate with a **DataOS API token**. A token is a credential, not an identity. It can do exactly what your user can do, and your masking and row filters apply to it.\n\n1. Open **Home** in DataOS. From the profile menu (top right), select **API Tokens**.\n2. Select **+ New**, name the token, and set an expiry (hours or a date).\n3. Select **Save** and **copy the value immediately**. DataOS shows it only once.\n4. Store it securely. The list shows the name, creation date, and expiry of each token, for tracking and revocation.\n\nFrom the CLI, the equivalent command is:\n\n```bash\ndataos-ctl user apikey create --name ci-pipeline --duration 24h\n```\n\n`dataos-ctl user apikey get` lists your keys. `dataos-ctl user apikey delete --name <name>` revokes one.\n\nThe use of the token depends on the path. **MySQL clients and BI tools use it as the password**, with your DataOS user ID as the username. APIs and AI clients send it as a **Bearer** token (`Authorization: Bearer <dataos-api-token>`).\n\n> **Warning:** Treat the token like a password. Do not commit it. Set an expiry that matches its purpose. To rotate it, create a new token and replace the old one everywhere that it is used. You cannot renew a token or view it again.\n\n### Choose a path\n\nOpen a product and select **Activate** in the Quick access bar. It lists **MCP**, **BI Tools**, **APIs**, and **Database Client**. The **How to activate** section of the product shows the same options as cards.\n\n| Path | Pick it when |\n| --- | --- |\n| BI tools | Your deliverable is a report or dashboard |\n| Database clients | You want to explore in a familiar desktop SQL tool |\n| APIs | An application or automation needs data programmatically |\n| Consume with AI | An AI client or agent must query within governance |\n\nAll paths query the same governed semantic layer. Thus a number does not change because you asked from Power BI instead of an API.\n\n### Consume responsibly\n\n- **Keep governed logic in DataOS.** Use the metrics, Perspectives, and semantic definitions of the product. Do not export data and rebuild the logic in a spreadsheet.\n- **Check trust first** (module b5), and **re-check after changes**, for example a version bump or a Breaking plan.\n- **Follow** the products that you depend on. Report problems to the owner with specifics: product, metric or column, expected, and observed.","sources":["https://v2.dataos.info/operate/data-consumer/get-access","https://v2.dataos.info/operate/data-consumer/governance-enforced","https://v2.dataos.info/operate/data-consumer/modes-of-consumption","https://v2.dataos.info/operate/data-consumer/trust-and-monitor","https://v2.dataos.info/operate/data-consumer/support-and-changes","https://v2.dataos.info/consume/get-started/before-you-begin","https://v2.dataos.info/references/key-concepts/api-tokens","https://v2.dataos.info/consume/activate/overview"]},{"title":"SQL clients over the MySQL protocol","body":"Any client that speaks the **MySQL wire protocol** can reach the semantic models of a Data Product. This is the route for analysts who prefer a local SQL tool. BI tools use the same endpoint internally. The docs describe two clients: the classic `mysql` command-line client and DBeaver.\n\nOpen a product, then **Activate → Database Client**. The guide in the product gives you a ready-to-run connection command and the exact host, port, and database for that product. Start there. Do not assemble the values yourself.\n\n### The classic `mysql` client\n\n> **Warning:** Use the classic `mysql` client, **not** `mysqlsh` (MySQL Shell). DataOS needs `--enable-cleartext-plugin`, which `mysqlsh` does not support.\n\nInstall the client. On Windows, use MySQL Installer. On macOS, use the MySQL Community Server package. Make sure that `mysql --version` works, then connect:\n\n```bash\nmysql -h <DATAOS_TCP_HOST> -P 3306 -u <DATAOS_USERNAME> -p'<your-api-key>' --enable-cleartext-plugin <tenant>.<data-product-name>\n```\n\n| Part | Meaning |\n| --- | --- |\n| `-h` | Your DataOS TCP host. Copy it from the in-product guide. It looks like the `hub-tcp-fqdn` that `dataos-ctl health` prints |\n| `-P 3306` | MySQL wire-protocol port |\n| `-u` | Your DataOS username (user ID) |\n| `-p'...'` | Your DataOS API token, with no space after `-p`. If it has special characters, quote it. Omit the value to get a prompt |\n| `--enable-cleartext-plugin` | Required. Enables cleartext authentication over TLS |\n| last argument | `<tenant>.<data-product-name>` |\n\nCommon errors have simple fixes. `Access denied` means a wrong or expired token. For `Unknown database`, copy the exact `<tenant>.<data-product-name>` from the product page. A VPN or firewall that blocks port 3306 causes a timeout. `cleartext plugin not loaded` means that the flag is missing.\n\n### DBeaver\n\nCreate a new connection (**Database → New Database Connection**). Pick **MySQL** (MySQL 8 or later), keep **Connect by: Host**, and fill in the **Main** tab:\n\n| Field | Value |\n| --- | --- |\n| Server Host | `<DATAOS_TCP_HOST>` |\n| Port | `3306` |\n| Database | `<tenant>.<data-product-name>` |\n| Username | Your DataOS username |\n| Password | Your DataOS API token |\n\nClick **Test Connection**. The first time, let DBeaver download the MySQL 8 driver. Then open the **SSL** tab and select **Require SSL** under **Advanced**. If your environment needs client certificates, fill in the certificate fields. Otherwise, leave them empty. Test again and click **Finish**. Semantic models appear as tables in the **Database Navigator**. An SSL handshake error that mentions `mysql_clear_password` means that **Require SSL** is not enabled.\n\n### How semantic SQL maps\n\n| Semantic concept | SQL representation |\n| --- | --- |\n| Semantic model or metric | Table |\n| Dimension | Column. Select it directly |\n| Measure | Column. Wrap it with `MEASURE()` or a matching aggregate |\n\nIntrospect the product first:\n\n```sql\nSHOW TABLES;\nSELECT TABLE_NAME,TABLE_COMMENT FROM information_schema.tables WHERE table_schema = 'public';\nDESCRIBE orders;\nSHOW FULL COLUMNS FROM orders;\n```\n\nThe `information_schema` query distinguishes metrics from semantic models. `SHOW FULL COLUMNS` distinguishes measures from dimensions.\n\nThen run a query. Use `MEASURE()` by default:\n\n```sql\nSELECT\n  status,\n  MEASURE(count)\nFROM orders\nWHERE status = 'completed'\nGROUP BY status\nORDER BY MEASURE(count) DESC\nLIMIT 10;\n```\n\n`MEASURE()` works for every measure type. A type-specific aggregate must match exactly (`SUM` for `sum`, `AVG` for `avg`, `COUNT(DISTINCT ...)` for `count_distinct`, and so on). If it does not match, the API returns `Measure aggregation type doesn't match`.\n\n### Joins are already defined\n\nThe semantic layer knows how models relate. You join with a comma list, `CROSS JOIN`, or `LEFT JOIN` on the virtual `__joinField` column. These forms are all equivalent:\n\n```sql\nSELECT p.name, MEASURE(o.count)\nFROM orders o, products p\nGROUP BY 1\nLIMIT 5;\n```\n\nYou never write the join condition yourself. Supported filters include `IN`, `NOT IN`, `LIKE` (case-insensitive), comparison operators, `IS [NOT] NULL`, and `BETWEEN` for time dimensions. `HAVING` filters on measures.\n\n> **Warning:** The documented query form is the only supported form. Native MySQL functions or syntax outside it can work partially or **silently return incorrect results**.","sources":["https://v2.dataos.info/consume/activate/database-clients","https://v2.dataos.info/consume/activate/database-clients/mysql","https://v2.dataos.info/consume/activate/database-clients/dbeaver","https://v2.dataos.info/consume/activate/database-clients/mysql/query","https://v2.dataos.info/consume/activate/querying-data-products"]},{"title":"BI tools: Tableau and Power BI","body":"BI tools reach the same semantic layer over the MySQL wire protocol. Every dimension, measure, and join that you defined is ready to use, with no custom SQL and no re-modeling. The setup has strict version requirements. Most connection failures come from a small error in one of them. From a product, open **Activate → BI Tools**. Each supported tool has a **Get started** link.\n\n| Tool | Pick it when |\n| --- | --- |\n| Power BI Desktop | You build reports locally (Windows) |\n| Power BI Service | You publish reports to the cloud through a gateway |\n| Tableau Desktop | You explore and visualize interactively |\n| Tableau Cloud | You publish dashboards for a team without Tableau Desktop |\n\nIn every case, the username is your **DataOS user ID** (**Profile → Id**) and the password is your **DataOS API token**.\n\n### Tableau Desktop (macOS or Windows)\n\n1. **Driver:** download **MySQL Connector/J `9.2.0` exactly** (`mysql-connector-j-9.2.0.jar`). Put it in `~/Library/Tableau/Drivers/` (macOS) or `C:\\Program Files\\Tableau\\Drivers\\` (Windows). If the folder does not exist, create it. Restart Tableau.\n2. **Connection file:** on the product page, go to **Activate → BI → Tableau** and click **Download**. The ZIP holds a `tables/` folder with the `.tds` file and a `manifest.json` with connection details. **Extract before opening.**\n3. **Open** the `.tds`. Sign in with your user ID and API token. The semantic models appear in the **Data** pane.\n\nIf dimensions or measures are missing, the model changed after you downloaded the `.tds`. Download it again. \"No suitable driver\" means that the JAR is in the wrong folder.\n\n### Tableau Cloud\n\nTableau Cloud cannot reach the DataOS MySQL endpoint on a private network directly. It goes through **Tableau Bridge**. You install Tableau Bridge on a Windows or Linux machine with network access to the DataOS MySQL proxy. The same Connector/J 9.2.0 JAR must be on the **Bridge machine**. To publish, you also need an Enterprise Tableau Cloud subscription and a Tableau Personal Access Token (or username and password). Bridge setup is a one-time task, close to admin work. After the setup, you publish with a few clicks from the product page.\n\n### Power BI Desktop (Windows only)\n\nOne-time setup:\n\n1. Install **MySQL Connector ODBC `8.0.23` exactly**.\n2. In Power BI Desktop, go to **File → Options and settings → Options → Security**. Under **Data Extensions**, select **Allow any extension to load without validation or warning**. Restart.\n3. Put the **`DataOS.mez`** connector in `[My Documents]\\Microsoft Power BI Desktop\\Custom Connectors\\`. If the folder does not exist, create it.\n4. Add the system environment variable **`LIBMYSQL_ENABLE_CLEARTEXT_PLUGIN`** = `1`, then restart Power BI Desktop.\n\nTo connect, open the **Activate → BI Tools → Power BI** guide of the product and **Download** the `.pbip` package. The package is preconfigured with the endpoint and model references. Extract the ZIP and keep its three items together: the `.pbip` entry point, the `.Report/` folder, and the `.SemanticModel/` folder. Open the `.pbip` and enter your user ID and API token. The models load into the **Fields** pane.\n\n| Symptom | Cause |\n| --- | --- |\n| \"There weren't enough elements in the enumeration...\" | Wrong ODBC version. Reinstall 8.0.23 |\n| DataOS connector missing | `.mez` not in Custom Connectors, or the security setting not changed |\n| \"cleartext password not allowed\" | `LIBMYSQL_ENABLE_CLEARTEXT_PLUGIN=1` not set |\n\n### Power BI Service\n\nBuild and test in Desktop (version `2.132.908.0` or later), then publish. Service reaches DataOS through an **on-premises data gateway** inside your network:\n\n1. **Install and register the gateway** on a Windows machine that can reach DataOS. Sign in with an organization (not personal) Microsoft account. Give the gateway a unique name and store the recovery key.\n2. **Add the connector:** put `DataOS.mez` in `C:\\PowerBI\\CustomConnectors\\`. Set that folder under **Connectors** in the gateway app, and restart. Make sure that **DataOS** appears in the list.\n3. **Publish** from Desktop (**Home → Publish**) to a workspace.\n4. **Create the gateway connection** in Service (**Settings → Manage connections and gateway**). Select **On-premises**:\n\n| Field | Value |\n| --- | --- |\n| Connection type | **DataOS** |\n| Server / DataOS Data Source | `DATAOS_TCP_HOST:3306;<tenant>.<data-product-name>` |\n| Database | Leave blank |\n| Authentication | `Basic` (DataOS username + API token) |\n| Encrypted connection | `Not encrypted` |\n\n5. **Map it:** on the **Settings** page of the semantic model, under **Gateway and cloud connections**, pick the new connection and **Apply**.\n\nPort `3306` must be whitelisted between the gateway machine and DataOS. If the model shows no data, the gateway connection is not mapped yet. Schema changes do not propagate automatically. Re-publish the updated `.pbip` from Desktop.","sources":["https://v2.dataos.info/consume/activate/bi-tools","https://v2.dataos.info/consume/activate/bi-tools/tableau","https://v2.dataos.info/consume/activate/bi-tools/tableau-cloud","https://v2.dataos.info/consume/activate/bi-tools/desktop","https://v2.dataos.info/consume/activate/bi-tools/service","https://v2.dataos.info/references/interfaces/bi-tools"]}],"lab":{"title":"Lab: Query a Data Product from your own SQL client","goal":"A working mysql (or DBeaver) connection to a Data Product, with introspection and a governed aggregate query, plus an optional BI connection.","duration":"35 min","prereqs":["Tenant access and read access to at least one Data Product","The classic `mysql` client (`mysql --version` works) or DBeaver","Network access to port 3306 on your DataOS TCP host"],"steps":["**Create an API token.** In DataOS **Home**, open the profile menu > **API Tokens** > **+ New**. Name it `beginner-lab` and set an expiry of a few hours. Select **Save** and copy the value immediately.","**Get the connection values.** Open the product, select **Activate** > **Database Client** > **MySQL**, and copy the connection command. Compare the host with the `hub-tcp-fqdn` from `dataos-ctl health`.","**Connect.**\n\n```bash\nmysql -h <DATAOS_TCP_HOST> -P 3306 -u <DATAOS_USERNAME> -p --enable-cleartext-plugin <tenant>.<data-product-name>\n```\n\nWhen the client prompts for the password, paste the API token.","**Introspect.**\n\n```sql\nSHOW TABLES;\nSELECT TABLE_NAME,TABLE_COMMENT FROM information_schema.tables WHERE table_schema = 'public';\n```\n\nPick one semantic model and run `SHOW FULL COLUMNS FROM <model>;`. List its dimensions and measures.","**Aggregate with MEASURE().** Use a dimension and a measure from the previous step:\n\n```sql\nSELECT <dimension>, MEASURE(<measure>)\nFROM <model>\nGROUP BY <dimension>\nORDER BY MEASURE(<measure>) DESC\nLIMIT 10;\n```","**Compare with Studio.** Run the same dimension and measure in the Visual builder of Studio. The numbers match, because both go through the same semantic layer.","**Cross-model (if the product has related models).** Look at the **Relationships** tab of the model in Assets. Then run a comma-join query such as `SELECT p.<dimension>, MEASURE(o.<measure>) FROM <model_a> o, <model_b> p GROUP BY 1 LIMIT 5;`.","**Optional: DBeaver.** Create a MySQL 8+ connection with Server Host `<DATAOS_TCP_HOST>`, Port `3306`, Database `<tenant>.<data-product-name>`, your username, and your token. On the SSL tab, enable **Require SSL**. Click **Test Connection** and then **Finish**.","**Optional: a BI tool.** Follow the lesson checklist for Tableau Desktop (Connector/J 9.2.0 plus `.tds`) or Power BI Desktop (ODBC 8.0.23, `DataOS.mez`, `LIBMYSQL_ENABLE_CLEARTEXT_PLUGIN=1`, `.pbip`).","**Clean up.** Revoke the `beginner-lab` token from the **API Tokens** panel. If you created it from the CLI, use `dataos-ctl user apikey delete --name beginner-lab`."],"verify":"- `SHOW TABLES;` returns the product's semantic models and metrics.\n- Your `MEASURE()` query returns rows, and the totals match the same selection in Studio.\n- If a column comes back masked or totals look low, you can find the matching policy on the asset's **Policies** tab.\n- The lab token no longer appears (or shows as revoked) in **API Tokens**.","sources":["https://v2.dataos.info/consume/activate/database-clients/mysql","https://v2.dataos.info/consume/activate/database-clients/mysql/query","https://v2.dataos.info/consume/activate/database-clients/dbeaver","https://v2.dataos.info/references/key-concepts/api-tokens"]},"takeaways":["Tenant access lets you browse the Hub. Each Data Product needs its own read-only grant.","An API token acts as you, with your masking and row filters. DataOS shows it only once, so copy it and set an expiry.","SQL and BI clients use the MySQL wire protocol on port 3306: username = DataOS user ID, password = API token, database = `<tenant>.<data-product-name>`.","Use classic `mysql` with `--enable-cleartext-plugin` (not `mysqlsh`). In DBeaver, enable Require SSL.","Wrap measures in `MEASURE()`. Join models with comma lists, CROSS JOIN, or `__joinField`, never with your own join condition.","Exact versions matter: Connector/J 9.2.0 for Tableau, ODBC 8.0.23 plus `DataOS.mez` and `LIBMYSQL_ENABLE_CLEARTEXT_PLUGIN=1` for Power BI."],"quiz":[{"q":"A consumer has Tenant access with the `Data Consumer` role. What can they do without any further grant?","options":["Sign in and search and browse products in the Data Product Hub","Query every Data Product in the tenant","Create Depots for new sources","Edit Data Products they follow"],"answer":0,"explain":"Tenant access gives the Hub and browsing. Access to each Data Product is governed separately and is read-only.","source":"https://v2.dataos.info/operate/data-consumer/get-access"},{"q":"A user runs `mysqlsh` with `--enable-cleartext-plugin` and gets `unknown option`. What must they do?","options":["Remove the flag","Switch to port 33060","Base64-encode the API token","Use the classic `mysql` client, because MySQL Shell does not support the required flag"],"answer":3,"explain":"DataOS requires `--enable-cleartext-plugin`, which only the classic `mysql` client supports.","source":"https://v2.dataos.info/consume/activate/database-clients/mysql"},{"q":"Which query is the safest way to aggregate a measure named `revenue` of type `sum`?","options":["`SELECT region, AVG(revenue) FROM orders GROUP BY region;`","`SELECT region, MEASURE(revenue) FROM orders GROUP BY region;`","`SELECT region, revenue FROM orders;` with no aggregate","`SELECT region, SUM(orders.revenue * 1) FROM orders GROUP BY region;`"],"answer":1,"explain":"`MEASURE()` works for every measure type. `AVG` does not match a `sum` measure and raises `Measure aggregation type doesn't match`. Arbitrary expressions are outside the supported query form.","source":"https://v2.dataos.info/consume/activate/database-clients/mysql/query"},{"q":"Power BI Desktop fails with \"cleartext password not allowed\". What is missing?","options":["The system environment variable `LIBMYSQL_ENABLE_CLEARTEXT_PLUGIN` set to `1`","The MySQL Connector/J 9.2.0 JAR","A Tableau Bridge","Encrypted connection set to `Encrypted`"],"answer":0,"explain":"Power BI needs `LIBMYSQL_ENABLE_CLEARTEXT_PLUGIN=1` so that the MySQL driver can authenticate with `mysql_clear_password`. Restart Power BI after you add it.","source":"https://v2.dataos.info/consume/activate/bi-tools/desktop"},{"q":"When you configure the gateway connection in Power BI Service, what goes in **Server / DataOS Data Source**?","options":["`https://<instance-url>/powerbi`","The path to `DataOS.mez`","`DATAOS_TCP_HOST:3306;<tenant>.<data-product-name>`","`<tenant>.<data-product-name>` only, with the host in Database"],"answer":2,"explain":"The Server field combines the TCP host, port 3306, and the `<tenant>.<data-product-name>`. Database stays blank, Authentication is Basic, and Encrypted connection is Not encrypted.","source":"https://v2.dataos.info/consume/activate/bi-tools/service"}]}],"exam":{"passMark":70,"timeMinutes":45,"questions":[{"domain":"Environment setup","q":"Where do you get the install command for the DataOS CLI on macOS or Linux?","options":["From a public package manager such as Homebrew","From the **Setup DataOS CLI** section on your DataOS instance home page, after logging in","From `pip install dataos-ctl`","From the Vulcan wheel"],"answer":1,"explain":"The install command is specific to each instance. It pipes an installer through your bearer token. You copy it from **Setup DataOS CLI** on the landing page of the instance.","source":"https://v2.dataos.info/build/get-started/prerequisites/cli-setup"},{"domain":"Environment setup","q":"After `pip install \"./vulcan-...whl[snowflake]\"`, your shell prints `zsh: no matches found`. What is wrong?","options":["Your Python version is unsupported","The Snowflake extra does not exist","The virtual environment is not activated","The shell interpreted the `[snowflake]` brackets. The path needs quotes"],"answer":3,"explain":"Zsh treats brackets as a glob. The fix in the docs is to put quotes around the wheel path. An unsupported Python version gives `is not a supported wheel on this platform` instead.","source":"https://v2.dataos.info/build/get-started/prerequisites/ldk-setup"},{"domain":"Environment setup","q":"Your `dataos-ctl health` output shows `DataOS® CLI...OK` and `DataOS® CK...OK`. What does `CK...OK` confirm?","options":["Your Compute is active","Your API token is valid for BI tools","The checksum of the download matched","The CLI reached the instance's control kernel"],"answer":3,"explain":"`CLI...OK` shows that the binary works. `CK...OK` shows that the CLI reached the control kernel of the instance.","source":"https://v2.dataos.info/references/interfaces/command-line-interface"},{"domain":"Environment setup","q":"A new Data Developer authored a product locally and now wants to deploy it. The developer has no access to shared Compute or Depots. Why, and what must they do?","options":["DataOS is deny-by-default. They request `Can Use` grants from their tenant admin","Access is self-served. They can create their own Compute","They must re-run `dataos-ctl init`","They need to upgrade Vulcan"],"answer":0,"explain":"A new Data Developer starts with no access to shared Compute, Depots, or Secrets. These are not self-served. The tenant admin gives access through `Can Use` grants.","source":"https://v2.dataos.info/build/get-started/prerequisites"},{"domain":"Local build with Vulcan","q":"Which `vulcan` command must succeed, and print `Data warehouse connection succeeded`, before you add any models?","options":["`vulcan plan`","`vulcan audit`","`vulcan info`","`vulcan test`"],"answer":2,"explain":"The Quickstart says: do not continue until `vulcan info` shows that the warehouse connection works.","source":"https://v2.dataos.info/build/get-started/quickstart"},{"domain":"Local build with Vulcan","q":"In a `MODEL (...)` block, what does `grains (order_id, item_id)` declare?","options":["The columns used to partition the table","The column(s) that uniquely identify a row, here a composite key","The columns that must not be null","The columns exposed as dimensions"],"answer":1,"explain":"Grains declare the unique identity of a row. `not_null` is an assertion, and you declare dimensions in the semantic model.","source":"https://v2.dataos.info/build/get-started/quickstart"},{"domain":"Local build with Vulcan","q":"You want a rule that records quality over time and warns, but must not stop the model from materializing. Which tool do you use?","options":["An inline assertion","A named audit attached through `assertions(...)`","A DQ check in `dq/*.yml` with `kind: dq`","A unit test in `tests/`"],"answer":2,"explain":"DQ checks are non-blocking. A failure is recorded, but the model still materializes. Assertions (built-in or named audits) block the run. Unit tests check logic against fixtures.","source":"https://v2.dataos.info/build/productize/data-quality"},{"domain":"Local build with Vulcan","q":"What happens when you run `vulcan plan` in the Quickstart project?","options":["Vulcan validates the models, shows what it will materialize, and asks `Apply the plan? [y/n]`","The project is deployed to DataOS","Only the unit tests run","Vulcan renders the deploy manifest"],"answer":0,"explain":"`plan` computes the changes and shows them. Then it asks for confirmation before it applies them. To deploy, you pipe `create_deploy_yaml` into `dataos-ctl resource apply`.","source":"https://v2.dataos.info/build/get-started/quickstart"},{"domain":"Local build with Vulcan","q":"In the semantic model, the measure is written as `expression: \"{order_lines.line_revenue}\"` with `type: sum`. What does it compute?","options":["A count of order lines","The average revenue per region","A running total over `order_date`","The sum of the `line_revenue` column from the model the semantic model depends on"],"answer":3,"explain":"The measure `total_line_revenue` sums `line_revenue` from `workspace.order_lines_enriched`. It refers to that model through the semantic model name.","source":"https://v2.dataos.info/build/get-started/quickstart"},{"domain":"Local build with Vulcan","q":"As of the September 2026 release, how do you write new data quality checks?","options":["With the `rules:` key only","With the new `expectations:` format. Legacy `rules:` still works","As SQL files in `audits/`","As assertions in the semantic model"],"answer":1,"explain":"DQ checks move to an `expectations:` format. Legacy `rules:` definitions keep working, so projects can migrate gradually.","source":"https://v2.dataos.info/releasenotes/september-2026"},{"domain":"Understanding data sources","q":"A Depot manifest refers to `\"engineering:pg-cred\"`, but nobody created the Secret yet. What happens when you apply the Depot?","options":["Apply fails or the Depot does not become active, because DataOS validates the Secret reference at apply time. Apply the Secret first","The Depot is created and waits for the Secret","DataOS creates an empty Secret automatically","The Depot falls back to anonymous access"],"answer":0,"explain":"The docs say to apply the Secret first and then the Depot, because DataOS validates the Secret reference at apply time.","source":"https://v2.dataos.info/operate/tenant-admin/add-data-sources-and-secrets"},{"domain":"Understanding data sources","q":"For a BigQuery JSON key, which part of the Secret manifest holds the credential?","options":["`secret.data`","`spec.secrets`","`secret.files`","`secret.type: image-pull`"],"answer":2,"explain":"File-based credentials (BigQuery JSON key, Snowflake RSA key) use `secret.files`. `spec.secrets` belongs to the Depot, and `image-pull` is for container registries.","source":"https://v2.dataos.info/build/understand/connect-sources"},{"domain":"Understanding data sources","q":"What does a Depot do with the data in the source system?","options":["Copies it into the DataOS Lakehouse","Nothing: it makes the source reachable without moving or duplicating it","Snapshots it daily","Encrypts it in place"],"answer":1,"explain":"A Depot gives access without moving data. To ingest or copy data, you need a Stack such as Nilus.","source":"https://v2.dataos.info/references/resources/depot"},{"domain":"Understanding data sources","q":"On a dataset in Datasets, which tab shows who queries it and how often?","options":["Overview","Lineage","Columns","Queries"],"answer":3,"explain":"The Queries tab shows recent activity: submission time, who ran the query, and frequency. This shows active use and who has working knowledge of the data.","source":"https://v2.dataos.info/build/understand/explore-data/datasets"},{"domain":"Understanding data sources","q":"In Workbench, what is the benefit of running a cell against a cell reference?","options":["It bypasses access policies","It saves the bench automatically","It runs the query on Minerva","It queries the previous cell's output locally and skips the round trip to the source, so it is faster and cheaper"],"answer":3,"explain":"Cell references run locally on the previous result. Performance depends on the dataset size and the memory of your machine.","source":"https://v2.dataos.info/build/understand/explore-data/workbench"},{"domain":"Resources and the CLI","q":"Which of these Resource types is runnable?","options":["Nilus","Depot","Secret","Compute"],"answer":0,"explain":"Nilus runs pipelines, so it has runtime state and logs. Depot, Secret, and Compute hold configuration only.","source":"https://v2.dataos.info/references/resources/overview"},{"domain":"Resources and the CLI","q":"You omit `owner` from a manifest. What happens?","options":["Apply fails because `owner` is required","The Resource is owned by `system`","It is auto-populated from the authenticated user","The Resource is created in the `system` layer"],"answer":2,"explain":"`owner` is listed as required. But if you do not give it, DataOS fills it in from the authenticated user.","source":"https://v2.dataos.info/references/resources/overview"},{"domain":"Resources and the CLI","q":"You want to delete a Secret, but you do not know what uses it. Which command do you run first?","options":["`dataos-ctl resource delete -t secret -n <name> --cascade`","`dataos-ctl resource deps -t secret -n <name>`","`dataos-ctl resource get -t secret -n <name> --unSanitize`","`dataos-ctl resource log -t secret -n <name>`"],"answer":1,"explain":"`resource deps` shows inbound dependents and outbound dependencies. `--cascade` deletes the dependents too, and you cannot undo a deletion.","source":"https://v2.dataos.info/references/interfaces/command-line-interface/resource"},{"domain":"Resources and the CLI","q":"Which command lists Depots created by every owner in the tenant, not just you?","options":["`dataos-ctl resource get -t depot`","`dataos-ctl depot types get`","`dataos-ctl resource get -t depot -a`","`dataos-ctl resource get --runnable`"],"answer":2,"explain":"`-a` / `--all` returns Resources for every owner. `depot types get` lists the supported Depot types, not Depot instances.","source":"https://v2.dataos.info/references/interfaces/command-line-interface/resource"},{"domain":"Resources and the CLI","q":"A Stack manifest contains `${ENV}` placeholders that must reach the platform unexpanded. Which flag do you add to `resource apply`?","options":["`--disable-interpolation`","`--lint`","`--de-ref`","`--in`"],"answer":0,"explain":"`--disable-interpolation` stops the CLI from interpolating `$ENV` / `${ENV}` references. You do not need it for Secret or Depot manifests.","source":"https://v2.dataos.info/operate/cli"},{"domain":"Resources and the CLI","q":"A Workflow defines `use.projection` at its top-level `spec`. Validation passes, but the environment variables are missing at runtime. Why?","options":["Liquid templates are not supported in Workflows","The Secret must be base64-encoded first","Projections only work in Stacks","For Workflows, projections must sit under each DAG step (`spec.dag[].spec.use.projection`). A top-level one is silently dropped"],"answer":3,"explain":"The top-level `spec` of a Workflow has no `use` field. Validation can pass, but the projection is still dropped.","source":"https://v2.dataos.info/references/resources/projections"},{"domain":"Discover and evaluate","q":"A Hub card shows a **Last run** warning. What does it indicate?","options":["The product has open quality issues","The most recent run failed, so outputs can be stale or broken","The product has not been followed by anyone","The product's owner left"],"answer":1,"explain":"If the most recent run failed, the Last run indicator shows a warning. The Quality indicator shows open quality issues.","source":"https://v2.dataos.info/consume/discover/search-the-hub"},{"domain":"Discover and evaluate","q":"Where does the **Is it a right fit for me?** panel (Good for, Not good for, Caveats) get its content?","options":["From the product's `usage.yml`","From the Hub's AI summary","From the product's quality rules","From follower comments"],"answer":0,"explain":"The panel comes from the usage file of the product: the `usage.yml` that `vulcan init` scaffolds.","source":"https://v2.dataos.info/consume/evaluate/overview"},{"domain":"Discover and evaluate","q":"On a Semantics asset, which tab shows which other models you can combine in one query and on which key?","options":["Columns","Dependencies","Relationships","Policies"],"answer":2,"explain":"The Relationships tab lists the related model, the relationship type (for example, one-to-many), and the join key.","source":"https://v2.dataos.info/consume/evaluate/assets/semantics"},{"domain":"Discover and evaluate","q":"What does AI-readiness Tier A mean on the Trust and freshness page?","options":["All quality rules pass","The product is production-ready for AI agents and MCP-aware tools","The product was built with an AI agent","The product has an MCP server only"],"answer":1,"explain":"Tier A means that you can connect AI clients with confidence. Lower tiers come with a checklist of gaps, such as MCP server, validated prompts, rich descriptions, and semantic layer.","source":"https://v2.dataos.info/consume/evaluate/trust-and-freshness"},{"domain":"Discover and evaluate","q":"You are drafting a Perspective that is not ready for colleagues. Which **Visibility** setting do you choose?","options":["Everyone","Followers","Domain","Only me"],"answer":3,"explain":"Keep it at **Only me** while you draft it. Then open it up to share it.","source":"https://v2.dataos.info/consume/evaluate/query-in-studio/save-as-perspective"},{"domain":"Activation","q":"A user created an API token yesterday with a 24h expiry. A BI connection now fails with `Access denied`. What is the right fix?","options":["Extend the token's expiry in the API Tokens panel","Use the DataOS password instead","Disable `--enable-cleartext-plugin`","Create a new token and update the connection. You cannot renew or view tokens again"],"answer":3,"explain":"To rotate a token, you create a new token and replace the old one everywhere it is used. Expired tokens stop authenticating.","source":"https://v2.dataos.info/references/key-concepts/api-tokens"},{"domain":"Activation","q":"In DBeaver, a connection test fails with an SSL handshake error that mentions `mysql_clear_password`. What do you look at?","options":["That **Require SSL** is enabled on the SSL tab","That the MySQL driver is version 5","That the port is 5432","That a client certificate is uploaded"],"answer":0,"explain":"The fix in the docs is to enable **Require SSL**. Leave the certificate fields empty unless your environment requires them.","source":"https://v2.dataos.info/consume/activate/database-clients/dbeaver"},{"domain":"Activation","q":"You need to join two semantic models over SQL. Which form is supported?","options":["`LEFT JOIN products p ON o.product_id = p.id`","A subquery with a `USING` clause","`FROM orders o, products p` or `LEFT JOIN ... ON o.__joinField = p.__joinField`","Joins are not supported over SQL"],"answer":2,"explain":"The semantic layer defines relationships. You use a comma list, `CROSS JOIN`, or `LEFT JOIN` on the virtual `__joinField`. You never write the join condition yourself.","source":"https://v2.dataos.info/consume/activate/database-clients/mysql/query"},{"domain":"Activation","q":"Tableau Desktop does not show some dimensions after the product owner added fields. What do you do?","options":["Install a newer Connector/J version","Re-download the `.tds` from the Data Product page","Recreate your API token","Enable cleartext authentication"],"answer":1,"explain":"If the semantic model changed after you downloaded the `.tds`, download it again. Connector/J must stay at 9.2.0.","source":"https://v2.dataos.info/consume/activate/bi-tools/tableau"}]},"reviewNotes":["CLI install: the curl URL `https://<instance-url>/home/dataos/cli-dev-v2/install.sh` and the bearer-token flow are copied from the docs; the real command is instance-specific (Setup DataOS CLI). Confirm the path is stable across instances.","Vulcan wheel version `0.228.1.30` is hard-coded in the docs and labs; it will drift. Consider a placeholder or a note to use the downloaded file name.","`dataos-ctl resource ... -v` defaults to `v1` per the resource reference, yet most doc examples (e.g. `resource get -t depot`, `resource delete -t secret -n ...`) omit `-v` for v2alpha Resources. The course tells learners to add `-v v2alpha` if a by-name lookup finds nothing. SME: confirm actual CLI behavior.","Identity-string format is inconsistent in the docs: the Resources overview shows `-i \"<name:version:type>\"`, the resource reference shows `--id type:version:name` and the pipe form `name|version|type`. The course teaches the reference forms.","Projections test commands appear as `dataos-ctl develop use/resource` (Resources overview) and as `dataos develop use/resource` (Projections page). The course uses `dataos-ctl develop ...`; verify the correct binary name and flags.","The course states that `${ENV}` references in manifests are filled from the shell environment at `resource apply` time. The docs imply this (the `--disable-interpolation` description and the Deploy Stacks hint about passing values as environment variables) but never say it outright. Please confirm.","b4 lab step 4 assumes `resource apply -l` rejects a hyphenated Depot name. The naming rule (alphanumeric only) is documented, but whether lint catches it is not. Please verify.","The b6 lab and lessons treat `<DATAOS_TCP_HOST>` as the same host as `hub-tcp-fqdn` from `dataos-ctl health` (for example `tcp.<instance-fqdn>`). This is a reasonable inference, but the docs do not say so. Learners are told to copy the value from the in-product Activate guide.","In-product navigation labels differ slightly between pages (for example `Activate → BI → Tableau` vs `Activate → BI Tools`; `Profile → Tokens` vs profile menu `API Tokens`). The course uses each page's own wording. Check against the current UI.","Repository setup: the git-sync Secret example uses `workspace: system`, while the Resources overview has no `workspace` field for Secrets. The course shows the doc snippet without that field in b1 and does not make learners apply it. Please confirm whether `workspace` is valid or needed.","Depot `spec.type` casing is inconsistent: Connect sources shows `POSTGRES`/`SNOWFLAKE`, while the PostgreSQL Depot page uses `postgresql` (also listed by `depot types get`). The course uses `postgresql`.","Nilus metadata pipelines use `version: v1alpha`, while the Resources overview says to use `v2alpha` for all current Resources. The course flags Nilus as an exception; please confirm.","Release-note items included: DQ `expectations:` format with legacy `rules:` still supported (Sept 2026), `repo.secret_id` optional for public repos (Sept 2026), and the Studio rerun warning. The Vulcan/Nilus runtime moved to Python 3.13 (Sept 2026), but local LDK support is still 3.10-3.13. The plural deployment resource keys (`resources`/`requests`/`limits`) are not taught at this level.","The b5 and b6 labs need a deployed product in the learner's tenant. The examples use the docs' `Orders Analytics Platform` (semantic models such as `customer_profile`); tenants without it must pick another product. The query examples `orders`/`products`/`MEASURE(count)` are generic doc samples.","Power BI connector download (`DataOS.mez`) is a docs-hosted file, and the Service page links a GitHub path on the `september-2026` branch. Verify the current download location before publishing.","Projections docs list `defaultProjections.heimdallUrl` and `metisUrl` (v1-era service names) and a Spark example with `spark.metrics.namespace=flare`. The course does not teach these; check whether they are still current."]}</script>
<script type="application/json" id="data-intermediate">{"id":"intermediate","title":"Developer","tagline":"Move, model, test, govern, deploy and serve a production-grade Data Product on DataOS with Nilus and Vulcan.","audience":"This level is for data engineers and data product developers who completed the Beginner level (CLI, LDK, Quickstart, Secrets and Depots, Resources, Hub and Studio). They now build and own Data Products from start to finish.","prerequisites":["DataOS Beginner level (or equivalent): `dataos-ctl` installed and logged in, LDK and Vulcan wheel installed in a virtual environment","Working knowledge of SQL, including joins and aggregations, and basic knowledge of YAML and Git","Basic Python: you can read and edit a small function","Access to a DataOS tenant with the Data Developer role, plus a PostgreSQL database in which you can create schemas","A Git repository you can push to"],"duration":"~15 hours (about 7 hours of lessons and 8 hours of labs)","outcomes":["Select batch, CDC or streaming movement, then write and apply Nilus pipelines with the correct write strategy and make sure that they work","Create and configure a Vulcan project, connect it to PostgreSQL, and explain the trade-offs of other engines, including Trino/Minerva","Build layered data models, semantic models with joins, and timestamp-based metrics for the orders-analytics product","Enforce the product contract with unit tests, blocking assertions and non-blocking data quality checks","Control access with standalone policies on physical models, column masks, row filters and an after_authorize plugin","Deploy a product from Git with a deployment block, monitor its runtime components, find and fix problems, and promote it across tenants","Use a product through the APIs and SDKs, GraphQL, pagination, transpile-only SQL, data applications and MCP clients"],"examBlueprint":[{"domain":"Data movement with Nilus","weight":12},{"domain":"Vulcan project foundations","weight":13},{"domain":"Modeling: data, semantic and metric models","weight":18},{"domain":"Quality gates","weight":15},{"domain":"Governance and access","weight":15},{"domain":"Plan, deploy and operate","weight":15},{"domain":"Programmatic and AI consumption","weight":12}],"modules":[{"id":"i1","title":"Move data with Nilus","duration":"2 hours","objectives":["Decide whether a source needs to be moved at all, and choose between batch, CDC and streaming","Author a `type: nilus` manifest with the correct source, sink and write strategy","Before you productize moved data, make sure that it is complete and has the correct types","Provision both permission layers a Nilus pipeline needs: DataOS `Can Use` grants and source/destination SQL grants"],"lessons":[{"title":"When to move data, and what Nilus can move","body":"### Move is the \"E\" and \"L\" of the build pattern\n\nDataOS describes the build of a Data Product as three verbs: **Extract**, **Load**, **Productize** (ELP). Moving data covers the first two. A Nilus pipeline pulls raw records out of a source system. It lands them, unchanged, in a place where your engine can query them. It never reshapes or enriches the data. That work belongs to Productize, which you will do with Vulcan in the next modules.\n\nThis gives you a decision rule:\n\n- The Understand step scans metadata and explores datasets. If it showed that the data **already lives where your engine can read it**, skip Move and go straight to Productize.\n- Sometimes the data is in a system that your engine **cannot query directly**, for example an operational database, a SaaS API or an event broker. If so, use Move to close that gap.\n\nWhen you move data that you do not need, it costs compute, adds a second copy to govern, and adds latency. Use Move to fill gaps, not as a default first step.\n\n### Nilus in one sentence\n\n**Nilus** is the DataOS data movement framework. Every pipeline is a `type: nilus` resource with the same basic shape: a **source address**, a **sink address**, and a **pipeline type** in `spec.type`. The runtime handles credentials, schema inference, state, retries and loading for you. Every type follows the same Extract, Normalize, Load lifecycle.\n\n### Choosing the pipeline type\n\nThe type is the one real decision in Move. Two questions decide it: how fresh must the data be, and what does the source expose?\n\n| `spec.type` | Use it when | Freshness |\n| --- | --- | --- |\n| `batch` | Periodic full or incremental loads are acceptable. The source is a database, warehouse, SaaS API or file system | Minutes to hours |\n| `cdc` | You need every insert, update and delete from a transactional database without full reloads | Near real-time |\n| `stream` | The source is a message broker (Kafka or NATS JetStream) that produces continuous events | Near real-time |\n| `metadata` | You want schemas, lineage, profiles and usage in the DataOS catalog **without copying rows** | n/a |\n\nIf you are not sure, start with **batch**. It has the widest source support and the simplest setup. The Nilus quick start recommends a narrow first pipeline: one PostgreSQL table into one destination table. After that, move on to CDC or streaming.\n\n### What can be moved where\n\nSupport depends on the type, because CDC and streaming need the source to expose a change log or an event stream.\n\n- **Batch** reaches the widest set: Snowflake, Databricks, PostgreSQL, MySQL, MS SQL Server, AWS Redshift, Google BigQuery, Delta Lake, Salesforce, HubSpot, Stripe, Google Analytics, Google Sheets and more. If a system has no first-party connector, build a **custom source**.\n- **CDC** supports five transactional sources: PostgreSQL, MySQL, MongoDB, Microsoft SQL Server and IBM Db2. Each needs setup on the source side (a transaction log, binlog, oplog or CDC tables).\n- **Streaming** supports two brokers: Apache Kafka (topics) and NATS JetStream (subjects).\n\nYou configure destinations as a **sink**. The destinations are in these groups:\n\n| Destination group | Targets |\n| --- | --- |\n| DataOS Lakehouse | AWS-backed, Azure-backed, GCP-backed |\n| Cloud warehouses | BigQuery, Databricks, Redshift, Snowflake |\n| Databases | MongoDB, Microsoft SQL Server, PostgreSQL |\n\nMicrosoft Fabric Lakehouse (OneLake) became a destination in the August 2026 release. Always read the References connector list before you commit to a design. New connectors ship there first.\n\n> **Note:** If your source is not listed for the type that you want, use batch with a custom source. Or land the data with the type that the source *does* support.\n\n### Cross-cutting behavior you must know\n\nTwo behaviors apply to every type, and the docs describe them once:\n\n- **Schema evolution** is how Nilus reacts to new columns, removed columns, type changes and nested fields. New nullable columns on the source object usually appear on the next extraction. Type changes sometimes need `type_hints` or a destination migration. Columns that you invent inside a `query:` `SELECT` are *not* schema evolution. For those, use a new `dest_table`. Do not overlay a query shape onto an existing table.\n- **Data masking**: Nilus can mask values in flight with a `mask` map (for example `email: hash`). Masking is a *handling policy*, not a transform. Thus it stays compatible with the \"Move never transforms\" rule. Define it under `sink.options`. Older examples show it under `source.options`.\n\n### Where this fits in `orders-analytics`\n\nThe worked example in this course, `orders-analytics`, reads nine raw tables named `public.*_ext` from a PostgreSQL database. The tables are orders, order items, customers, products, regions, shipments, warehouses, suppliers and dates. In this module you are the developer who lands those tables with Nilus. Later modules declare them as Vulcan inputs and build bronze, silver and gold layers on top.\n\n> **Tip:** Before you write a manifest, make sure that you have access to the tenant and a compute profile. You also need a Depot for the source and one for the destination, or a direct URI with projected secrets. Finally, you need read access on the source and write access on the destination.","sources":["https://v2.dataos.info/build/move/overview","https://v2.dataos.info/build/move/supported-sources-and-destinations","https://v2.dataos.info/build/move/mode","https://v2.dataos.info/references/resources/nilus","https://v2.dataos.info/references/resources/nilus/quick-start-guides","https://v2.dataos.info/references/resources/nilus/concepts/schema-evolution","https://v2.dataos.info/references/resources/nilus/concepts/understanding-data-masking"]},{"title":"Anatomy of a Nilus manifest: batch, CDC and stream","body":"### The manifest shape\n\nAll Nilus types share one manifest shape. Only `spec.type` and a few blocks for each type change. Here is the batch template from the Move guide:\n\n```yaml\nname: ${{pipeline-name}}\nversion: v1alpha\ntype: nilus\ntags:\n  - nilus-batch\ndescription: ${{description}}\nspec:\n  type: batch\n  compute: ${{compute-profile}}\n  logLevel: INFO\n  schedule:                       # optional; omit for a one-time run\n    crons:\n      - \"0 2 * * *\"              # daily at 02:00 UTC\n    timezone: UTC\n    concurrencyPolicy: Forbid\n  source:\n    address: dataos://${{source-depot}}?purpose=ro\n    options:\n      source_table: \"${{schema.table}}\"\n      incremental_key: updated_at  # optional; for delta loads\n  sink:\n    address: dataos://${{sink-depot}}?purpose=rw\n    options:\n      dest_table: ${{schema.table}}\n      incremental_strategy: replace\n```\n\nRead it from top to bottom:\n\n- `spec.compute` is the compute profile that the pipeline runs on.\n- `spec.schedule` is an optional cron schedule. Omit it for a one-time run.\n- `source.address` / `sink.address` is a `dataos://` Depot reference with a `purpose` (`ro` for reading, `rw` for writing). Nilus gets the credentials from the Depot automatically.\n- `source.options.source_table` is always fully qualified as `<schema>.<table>`. There is no separate `schema` option for SQL sources.\n- `sink.options.dest_table` and `incremental_strategy` set where and how rows land.\n\n### Write strategies\n\nEvery sink uses one of three `incremental_strategy` values:\n\n| Strategy | Behavior | Best for |\n| --- | --- | --- |\n| `replace` | Drops and re-creates the destination table on every run | Small dimension tables, snapshots, SaaS data |\n| `append` | Adds new rows. Never updates or deletes | Immutable events, logs, CDC change history |\n| `merge` | Upserts on `primary_key` | Mutable entity tables, CDC current-state views |\n\nFor tables that grow, set `incremental_key` to a monotonically increasing column (typically `updated_at` or a sequence-backed `id`). After each successful run, Nilus records the last value that it saw. On the next run, it uses that value as the lower bound. If you use `merge`, also set `primary_key` so that Nilus knows which column identifies a row. If your incremental column is not truly monotonic, every run extracts the full table.\n\n### Credentials: Depots or projected secrets\n\nNilus resolves secrets in one of three ways:\n\n1. **Depot inference**: a `dataos://...?purpose=` address tells Nilus to resolve the connection of the Depot for you. This is the recommended production pattern.\n2. **Explicit projection**: some connectors use a direct URI that contains placeholders such as `{PG_USERNAME}`. For these, you declare the Secret under `spec.use.projection.secrets`. Then you expose values through `spec.use.projection.projections.envVars`.\n3. **Repo-auth**: `spec.repo.secretId` is only for syncing custom source code from Git.\n\nSome connectors accept only a direct URI (for example Databricks sources and IBM Db2 CDC sources). Read the connector page to find out.\n\n### CDC specifics\n\nA CDC pipeline reads the transaction log of a database. It needs **source-side setup before it can run**:\n\n| Source | Required setup |\n| --- | --- |\n| PostgreSQL | `wal_level = logical`, a dedicated replication slot, a user with the `REPLICATION` role |\n| MySQL | `binlog_format = ROW` and a user with `REPLICATION SLAVE` |\n| MongoDB | A replica set, and a user with `read` on the target and the `local` database |\n| Microsoft SQL Server | CDC enabled on database and tables, and SQL Server Agent running |\n| IBM Db2 | Db2 CDC tables enabled for the target schema |\n\nThe CDC manifest adds a `cdc:` block under `source`:\n\n```yaml\nspec:\n  type: cdc\n  compute: ${{compute-profile}}\n  logLevel: INFO\n  source:\n    address: dataos://${{source-depot}}?purpose=rw\n    options:\n      strategy: flatten            # flatten nested events into rows\n      max_table_nesting: \"0\"\n    cdc:\n      table.include.list: \"${{schema.table}}\"\n      topic.prefix: \"${{prefix}}\"  # connector identity; keep stable in production\n      slot.name: \"${{slot-name}}\"  # PostgreSQL only; must be unique per pipeline\n  sink:\n    address: dataos://${{sink-depot}}?purpose=rw\n    options:\n      dest_table: ${{schema.table}}\n      incremental_strategy: append\n```\n\n> **Warning:** `topic.prefix` is the connector identity, and Nilus appends it to the destination table name. Never change it after the pipeline is in production. On PostgreSQL, every pipeline needs its own `slot.name`. If two pipelines use the same slot, replication conflicts occur. Keep the change-feed retention of the source longer than any expected downtime. Otherwise, the connector possibly needs a new snapshot.\n\nFor CDC sinks, `append` keeps the full change history. `merge` makes the destination show the current state. Since September 2026 the embedded CDC JVM heap defaults to 25% of the pod memory limit. You can raise it with the `NILUS_JVM_HEAP_PERCENT` environment variable.\n\n### Streaming specifics\n\nA stream pipeline runs a long-lived consumer that reads micro-batches from Kafka or NATS JetStream. There is no snapshot, cursor or extraction window. `source_table` names the topic or subject. Sinks typically use `append`:\n\n```yaml\nspec:\n  type: stream\n  compute: ${{compute-profile}}\n  source:\n    address: dataos://${{source-depot}}?purpose=ro\n    options:\n      source_table: \"${{topic-or-subject}}\"   # Kafka topic or NATS subject\n  sink:\n    address: dataos://${{sink-depot}}?purpose=rw\n    options:\n      dest_table: ${{schema.table}}\n      incremental_strategy: append\n```\n\n### Applying the manifest\n\nThe workflow is the same for all three types. Lint the manifest, apply it, then get its status:\n\n```bash\ndataos-ctl resource apply -f ${{path-to-manifest.yaml}} --lint\ndataos-ctl resource apply -f ${{path-to-manifest.yaml}}\ndataos-ctl resource get -t nilus -n ${{pipeline-name}}\n```\n\nA status of `active` means that the pipeline is running. It does not mean that the data is right. The next lesson shows how to prove that.","sources":["https://v2.dataos.info/build/move/mode/batch","https://v2.dataos.info/build/move/mode/cdc","https://v2.dataos.info/build/move/mode/stream","https://v2.dataos.info/references/resources/nilus","https://v2.dataos.info/references/resources/nilus/concepts/secrets-and-projections","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Verify, troubleshoot and secure a pipeline","body":"### \"Active\" is not \"correct\"\n\nAfter you apply a pipeline, `dataos-ctl resource get -t nilus -n <name>` can report `active`. This tells you that the resource is running. It does not tell you that the right rows landed with the right types. Before you productize, test the move in three steps, in this order:\n\n1. **The pipeline ran.** Read the resource status and run history with `dataos-ctl resource get -t nilus -n ${{pipeline-name}}`.\n2. **The tables are discoverable.** Open **Datasets** and find the destination tables. Make sure that the schema, columns and types match the source, and that row counts are in the expected range.\n3. **The values are correct.** Open the destination in **Workbench** and sample the data:\n   - Row counts match the source (or match the increment for scheduled and change-based runs).\n   - Key columns are populated, and they are unique where they must be unique.\n   - Dates, numbers and categories landed in the right types, not as strings.\n   - For CDC, updates and deletes appear the way that the sink strategy intends.\n\n### Reading symptoms\n\n| Symptom | Where to look |\n| --- | --- |\n| Tables missing in Datasets | The pipeline failed, or the sink Depot is wrong. Read the manifest and run history again. |\n| Fewer rows than expected | Scope filters, an incremental key that excludes rows, or a first run that is still in progress |\n| Wrong types or shapes | Schema evolution behavior, or a source change that Nilus did not pick up yet. Consider `type_hints` |\n| Sensitive fields visible | Add data masking to the move |\n| Duplicate rows | `append` used for mutable entities, or a missing or unstable `primary_key`. Use `merge` with `primary_key` |\n\n### Logs and common errors\n\nLogs are the fastest way to find the exact failure. Set the verbosity with `spec.logLevel`. Use `INFO` normally, and use `DEBUG` only for a focused investigation. Read the logs from the **first** error, not from the last stack-trace frame. These patterns are useful to search for:\n\n| Pattern | Meaning |\n| --- | --- |\n| `Nilus app execution failed` | The runtime raised an exception during execution |\n| `Source not supported.` / `Sink not supported.` | The URI or mode did not resolve to a supported connector |\n| `Table name must be in the format <schema>.<table>` | `source_table` or `dest_table` has no schema prefix |\n| `invalid resource dependency, not found: depot:<name>` | The pipeline references a Depot that does not exist in the tenant. Create the Depot before you apply |\n\n> **Warning:** If you apply an *unchanged* `type: nilus` resource, Nilus does not run it again. To run a changed specification (for example after you switch `source_table` to a `query:` shape), delete and recreate the resource. Or apply it under a new name.\n\n### Two independent permission layers\n\nEvery Nilus pipeline needs two separate sets of permissions. DataOS lets you create the resource without the second set. But then the pipeline fails to connect at runtime.\n\n**Layer 1: DataOS access (RBAC).** A user with the **Tenant Admin**, **Data Admin** or **Data Developer** tenant role can create a Nilus resource. The user must also hold `Can Use` on the dependencies of the resource:\n\n| Dependency | Permission needed |\n| --- | --- |\n| Compute | `Can Use` |\n| Depot | `Can Use` |\n| The Secret linked to that Depot | `Can Use` |\n\nUse of a Depot does **not** include the Secret behind it. Each needs its own grant. Access is deny-by-default. Ownership of one resource never extends to the resources that it depends on. Ownership of a resource does not even include `Can Use` on it. An owner grants that to themself with `Can Manage Access`, and DataOS audits the self-grant. When you create a Nilus resource, you automatically get `Can Edit` and `Can Manage Access` on it. There is no `Can Use` permission on a Nilus resource itself.\n\n**Layer 2: source and destination privileges.** The credential that the pipeline connects with needs its own SQL `GRANT`s or IAM roles. Scope them to the pipeline mode:\n\n- A PostgreSQL Depot for a nightly **batch** extract needs only `SELECT` on the source schema.\n- If you use the same server for **CDC**, it also needs `wal_level = logical` and the `REPLICATION` attribute.\n- If you use the same server for **metadata** ingestion, it also needs `pg_stat_statements` and `pg_read_all_stats`.\n\nThe minimum batch read grants for PostgreSQL are:\n\n```sql\nGRANT CONNECT ON DATABASE <database_name> TO <username>;\nGRANT USAGE ON SCHEMA <schema_name> TO <username>;\nGRANT SELECT ON ALL TABLES IN SCHEMA <schema_name> TO <username>;\nALTER DEFAULT PRIVILEGES IN SCHEMA <schema_name>\n  GRANT SELECT ON TABLES TO <username>;\n```\n\nOn a PostgreSQL **destination**, the user needs `CONNECT` and `USAGE` on the schema. If Nilus auto-creates tables, the user also needs `CREATE`. Grant `INSERT`/`UPDATE`/`DELETE`/`SELECT` according to the `incremental_strategy`.\n\n> **Tip:** Give each credential only the grants that its pipelines need. A batch-only pipeline needs no write grants on the source and no replication privileges.\n\n### When something is still missing\n\nIf `dataos-ctl resource get` shows that you cannot see a Compute, Depot or Secret, you cannot fix this yourself. Ask the resource owner or your Tenant Admin for a `Can Use` grant.","sources":["https://v2.dataos.info/build/move/explore-moved-data","https://v2.dataos.info/references/resources/nilus/troubleshooting/checking-logs","https://v2.dataos.info/references/resources/nilus/troubleshooting/common-errors","https://v2.dataos.info/references/resources/nilus/roles-and-permissions","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/nilus-access-control","https://v2.dataos.info/references/resources/nilus/batch/batch-sources/postgresql"]}],"lab":{"title":"Land the orders-analytics source tables with a Nilus batch pipeline","goal":"Two working Nilus batch pipelines that land `orders` (merge) and `customers` (replace) from an operational PostgreSQL source. They land in the `public` schema of the orders-analytics PostgreSQL database as `public.orders_ext` and `public.customers_ext`. Workbench shows that the data is correct.","duration":"75 min","prereqs":["Completed Beginner level: `dataos-ctl` installed and `dataos-ctl login` working against your tenant","A Depot for the operational source database (shown as `<orders-src-depot>`) and a Depot for the orders-analytics PostgreSQL database (shown as `postgresdepot`). If you do not have them, ask your Tenant Admin to create them","`Can Use` on a Compute (shown as `<compute-profile>`), on both Depots and on the Secrets behind them","A database admin who can run SQL GRANTs on the source and destination"],"steps":["**Make sure that you have DataOS access.** Make sure that you can see each dependency. If a command reports no access, ask the owner or Tenant Admin for a `Can Use` grant. Do this before you continue.\n\n```bash\ndataos-ctl resource get -t compute -n <compute-profile>\ndataos-ctl resource get -t depot -n <orders-src-depot>\ndataos-ctl resource get -t depot -n postgresdepot\ndataos-ctl resource get -t secret -n <secret-behind-each-depot>\n```","**Get the source privileges.** Ask the source DBA to grant the batch-read minimum to the user behind `<orders-src-depot>`. Replace the placeholders:\n\n```sql\nGRANT CONNECT ON DATABASE <database_name> TO <username>;\nGRANT USAGE ON SCHEMA <schema_name> TO <username>;\nGRANT SELECT ON ALL TABLES IN SCHEMA <schema_name> TO <username>;\nALTER DEFAULT PRIVILEGES IN SCHEMA <schema_name>\n  GRANT SELECT ON TABLES TO <username>;\n```\n\nOn the destination, the user behind `postgresdepot` needs `CONNECT`, `USAGE` and `CREATE` on schema `public`. The user also needs `INSERT`, `UPDATE`, `DELETE`, `SELECT` on the target tables.","**Write the customers pipeline (replace).** Customers is a small dimension, so a full reload on each run is acceptable. Save this manifest as `nilus-customers-ext.yaml`:\n\n```yaml\nname: orders-customers-ext\nversion: v1alpha\ntype: nilus\ntags:\n  - nilus-batch\ndescription: Land operational customers into public.customers_ext for orders-analytics\nspec:\n  type: batch\n  compute: <compute-profile>\n  logLevel: INFO\n  source:\n    address: dataos://<orders-src-depot>?purpose=ro\n    options:\n      source_table: <schema>.customers\n  sink:\n    address: dataos://postgresdepot?purpose=rw\n    options:\n      dest_table: public.customers_ext\n      incremental_strategy: replace\n```","**Write the orders pipeline (merge, scheduled).** The status of an order changes over time, so upsert on the key. Save this manifest as `nilus-orders-ext.yaml`. If your source table has a monotonic `updated_at` column, keep `incremental_key`. If not, remove that line.\n\n```yaml\nname: orders-orders-ext\nversion: v1alpha\ntype: nilus\ntags:\n  - nilus-batch\ndescription: Land operational orders into public.orders_ext for orders-analytics\nspec:\n  type: batch\n  compute: <compute-profile>\n  logLevel: INFO\n  schedule:\n    crons:\n      - \"0 2 * * *\"\n    timezone: UTC\n    concurrencyPolicy: Forbid\n  source:\n    address: dataos://<orders-src-depot>?purpose=ro\n    options:\n      source_table: <schema>.orders\n      incremental_key: updated_at\n      primary_key: order_id\n  sink:\n    address: dataos://postgresdepot?purpose=rw\n    options:\n      dest_table: public.orders_ext\n      incremental_strategy: merge\n```","**Lint, then apply both manifests.**\n\n```bash\ndataos-ctl resource apply -f nilus-customers-ext.yaml --lint\ndataos-ctl resource apply -f nilus-orders-ext.yaml --lint\ndataos-ctl resource apply -f nilus-customers-ext.yaml\ndataos-ctl resource apply -f nilus-orders-ext.yaml\n```\n\nIf you see `invalid resource dependency, not found: depot:<name>`, correct the Depot name. Then apply again.","**Check status and logs.**\n\n```bash\ndataos-ctl resource get -t nilus -n orders-customers-ext\ndataos-ctl resource get -t nilus -n orders-orders-ext\ndataos-ctl resource log -t nilus -n orders-orders-ext --tailLines 100\n```\n\nSearch the log for `Nilus app execution failed` (failure) or `Final metrics push successful` (the run reached the end).","**Test the data in Workbench.** Open Datasets and find `public.orders_ext` and `public.customers_ext`. Make sure that the columns and types are correct. Then run these queries in Workbench. Adjust the source schema for the comparison:\n\n```sql\nSELECT COUNT(*) AS rows, COUNT(DISTINCT order_id) AS distinct_orders\nFROM public.orders_ext;\n\nSELECT order_status, COUNT(*) FROM public.orders_ext GROUP BY 1;\n```\n\n`rows` must equal `distinct_orders`, because the merge on `order_id` prevents duplicates. `order_date` must be a timestamp, not text.","**Repeat for the remaining inputs.** Create one pipeline each for order items, products, regions, shipments, warehouses, suppliers and dates. Land them as `public.order_items_ext`, `public.products_ext`, `public.regions_ext`, `public.shipments_ext`, `public.warehouses_ext`, `public.suppliers_ext` and `public.dim_dates_ext`. Use `replace` for small reference tables. Use `merge` + `primary_key` for tables that change.","**(Optional stretch) Sketch a CDC variant.** With your DBA, find out whether the source has `wal_level = logical` and a user with `REPLICATION`. If it does, write a `spec.type: cdc` manifest for orders. Do not apply it in a shared tenant. Give it a unique `slot.name`, a stable `topic.prefix`, and `incremental_strategy: append` that lands in `public.orders_changes`. Note how the `cdc:` block is different from the batch manifest."],"verify":"- `dataos-ctl resource get -t nilus -n orders-orders-ext` and `... -n orders-customers-ext` both show `active`.\n- `public.orders_ext` and `public.customers_ext` appear in Datasets with the expected columns (`order_id`, `customer_id`, `order_date`, `warehouse_id`, `order_status` / `customer_id`, `region_id`, `name`, `email`, `signup_date`).\n- In Workbench, the row count of `public.orders_ext` equals its distinct `order_id` count. It also roughly matches the source count.\n- The orders pipeline runs again on its schedule and does not create duplicate order rows.","sources":["https://v2.dataos.info/build/move/mode/batch","https://v2.dataos.info/build/move/explore-moved-data","https://v2.dataos.info/references/resources/nilus/batch/batch-sources/postgresql","https://v2.dataos.info/references/resources/nilus/destinations/databases/postgresql","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/nilus-access-control","https://v2.dataos.info/references/resources/nilus/troubleshooting/checking-logs"]},"takeaways":["Use Move only for data that your engine cannot already reach. Move never transforms.","Every pipeline is a `type: nilus` resource: source address, sink address, and `spec.type` of batch, cdc, stream or metadata.","Pick `replace`, `append` or `merge` on purpose. `merge` needs a stable `primary_key`.","CDC needs log setup on the source first. Never change `topic.prefix`, and use a unique `slot.name` for each PostgreSQL pipeline.","`active` means running, not correct. Test the data in Datasets and Workbench.","DataOS `Can Use` grants (Compute, Depot, Secret) and source SQL grants are independent. You need both."],"quiz":[{"q":"During Understand, you found that the `orders` table already sits in the PostgreSQL database that your Vulcan engine connects to. What do you do next?","options":["Create a Nilus batch pipeline to copy it into the Lakehouse first","Skip Move and declare the table as an input in Productize","Create a Nilus metadata pipeline to copy the rows","Create a CDC pipeline so the data is fresher"],"answer":1,"explain":"Move only closes a reachability gap. If the engine can already read the data, go straight to Productize. A metadata pipeline never copies rows. If no move is necessary, CDC is not necessary either.","source":"https://v2.dataos.info/build/move/overview"},{"q":"A team needs every insert, update and delete from an operational MySQL database in near real-time, without full reloads. Which pipeline type fits?","options":["`batch` with `incremental_strategy: replace`","`stream` reading the MySQL binlog as a topic","`cdc` after enabling `binlog_format = ROW` and granting `REPLICATION SLAVE`","`metadata` with lineage enabled"],"answer":2,"explain":"Row-level change capture from a transactional database is CDC. MySQL first needs ROW binlog format and a replication user. Streaming is for Kafka/NATS brokers, not database logs.","source":"https://v2.dataos.info/build/move/mode/cdc"},{"q":"A batch pipeline lands a mutable `customers` table with `incremental_strategy: append`. Analysts now see several rows for each customer. What is the right fix?","options":["Switch to `merge` and set `primary_key` in the source options","Switch to `stream` mode","Lower `page_size` to 10000","Add `max_table_nesting: \"2\"`"],"answer":0,"explain":"Duplicate rows for mutable entities come from append or a missing primary key. `merge` upserts on `primary_key`. The other settings tune performance or nesting, not row identity.","source":"https://v2.dataos.info/references/resources/nilus/troubleshooting/common-errors"},{"q":"A developer has the Data Developer role and `Can Use` on the Compute and the Depot. The developer applies a Nilus pipeline, but it fails with an authorization error as it resolves credentials. What is the most likely missing grant?","options":["`Can Edit` on the Nilus resource","`Can Use` on the Nilus resource","`Can Use` on the Secret linked to the Depot","The Tenant Admin role"],"answer":2,"explain":"Use of a Depot does not include the Secret behind it. The Secret needs its own `Can Use` grant. There is no `Can Use` permission on a Nilus resource, and the creator already has `Can Edit`.","source":"https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/nilus-access-control"},{"q":"In production, you change the `topic.prefix` of an existing PostgreSQL CDC pipeline from `orders` to `orders_v2`. What is the risk?","options":["None. `topic.prefix` is only a label in the UI","It is the connector identity and is appended to the destination table name, so changing it breaks continuity","It changes the replication slot, which is harmless","It switches the sink to `replace`"],"answer":1,"explain":"The docs warn that `topic.prefix` is the connector identity, and that Nilus appends it to the destination table name. Do not change it after the pipeline is in production. `slot.name` is a separate setting.","source":"https://v2.dataos.info/build/move/mode/cdc"}]},{"id":"i2","title":"Vulcan project foundations","duration":"2 hours","objectives":["Scaffold a Vulcan project with `vulcan init` and organize it into bronze, silver and gold layers","Write a valid `config.yaml`, `usage.yaml` and (optional) `agreement.md`","Connect a project to PostgreSQL with the correct roles and grants, and compare the other supported engines, including Trino/Minerva","Declare upstream tables as external inputs and load reference data as seeds"],"lessons":[{"title":"Project init and layout","body":"### A Data Product is a Vulcan project\n\nIn DataOS 2.0 you build a Data Product with the **Vulcan** resource. On your machine, that product is a folder of files (a Vulcan *project*) plus configuration at its root. The main idea of Productize is that you create the transform, semantic model, quality contract and access policy **as one object**, in one folder. Thus they cannot drift apart. This also makes the product safe for an AI agent to consume, because its meaning travels with it.\n\n### Set up the local toolchain (LDK)\n\nYou installed the LDK in Beginner. Here is the minimum that you need for a PostgreSQL project. Work in a virtual environment, never in the system Python. Install the Vulcan wheel with the engine extra in quotes, so that your shell does not interpret the brackets:\n\n```bash\nsource .venv/bin/activate\npip install --upgrade pip\npip install \"./vulcan-0.228.1.30-py3-none-any.whl[postgres]\"\n```\n\n> **Tip:** The wheel version changes with each release (`0.228.1.30` shipped in September 2026). Use the wheel that your platform team distributes.\n\n### `vulcan init`\n\n`vulcan init` creates a new Vulcan repository. Learn its options:\n\n```\nUsage: vulcan init [OPTIONS] [ENGINE]\n\nOptions:\n  -t, --template TEXT  Project template. Supported values: default, empty.\n  --tenant TEXT        Project tenant to write into config.yaml.\n  --name TEXT          Project name to write into config.yaml.\n  --description TEXT   Project description to write into config.yaml.\n```\n\nIf you pass the engine (for example `vulcan init postgres`), Vulcan initializes the project for that engine. Since July 2026 new projects initialize **empty** by default, so a first plan does not fail on demo scaffolding. To get the starter template, choose `-t default`. `vulcan init` also adds `.vulcan/` to `.gitignore`. That folder holds the default local state database, and you must not commit it.\n\n### The project layout\n\nThe scaffold gives you these folders and files:\n\n| Folder / file | What goes here |\n| --- | --- |\n| `config.yaml` | Project configuration: connections, model defaults, linting, deployment |\n| `usage.yaml` | Intended use, out-of-scope use and caveats, shown in the Data Product Hub |\n| `agreement.md` | Optional data-sharing agreement text that consumers accept |\n| `models/` | SQL and Python models. Each produces a table or view |\n| `models/semantics/` | Semantic models (`kind: semantic`) |\n| `models/metrics/` | Metric definitions (`kind: metric`) |\n| `seeds/` | CSV files loaded as static tables |\n| `audits/` | SQL audits. An audit that returns rows blocks the run |\n| `dq/` | Non-blocking data quality checks (`kind: dq`) |\n| `tests/` | YAML unit tests run with `vulcan test` |\n| `macros/` | Reusable SQL snippets and Jinja macros |\n| `plugins/` | The `after_authorize` auth extension hook |\n| `policies/` | Access and masking policies |\n| `.vulcan/` | Local state, git-ignored |\n\nAs a product grows, organize models by layer. `orders-analytics` expands the scaffold into bronze, silver and gold:\n\n```\norders-analytics/\n├── config.yaml\n├── usage.yaml\n├── inputs.yaml\n├── audits/\n├── dq/\n├── macros/\n├── seeds/\n├── linter/\n├── tests/\n└── models/\n    ├── bronze/\n    ├── silver/\n    ├── gold/\n    ├── seeds/\n    ├── semantics/\n    └── metrics/\n```\n\n### The build order\n\nThe Build guide puts the work in sequence, and the rest of this course follows it:\n\n1. Init and configuration: scaffold the project and set `config.yaml`.\n2. Connect engine: connect the project to your warehouse.\n3. Assets: declare inputs and seeds, then write data models, semantics and metrics.\n4. Unit tests, assertions and data quality: make the product enforce its own contract.\n5. Governance: set the access policy.\n6. Plan & run: test locally before anything ships.\n7. Git & deploy: render the deploy manifest, apply it, and make sure that the product is live.\n\nVulcan finds the run order from the SQL dependencies in your models. You declare what a model reads. You never orchestrate it.\n\n> **Note:** The deploy manifest that Vulcan renders (`<project_name>-deploy.yaml`) is in the project root. Add `ignore_patterns: [\"*-deploy.yaml\"]` to `config.yaml` so that Vulcan never parses it as a model.","sources":["https://v2.dataos.info/build/productize/overview","https://v2.dataos.info/build/productize/init-and-configuration","https://v2.dataos.info/build/get-started/prerequisites/ldk-setup","https://v2.dataos.info/references/resources/vulcan/cli","https://v2.dataos.info/releasenotes/july-2026"]},{"title":"config.yaml, usage.yaml and agreement.md","body":"### `config.yaml`: how Vulcan runs\n\n`config.yaml` is the central configuration file of the project. It tells Vulcan how to connect, which defaults to apply across models, and how to enforce conventions. Its values apply to the whole project. Individual models can override scheduling and kind.\n\nAt minimum, you need a non-empty `name` and `description`, and `tenant` (and `domain` after you set `tenant`). You also need at least one entry in `users`, one gateway with a working `connection`, and `model_defaults.dialect`:\n\n```yaml\nname: my-data-product\ntenant: default\ndomain: my-domain\ndescription: My project description\n\nusers:\n  - username: jane\n    email: jane@example.com\n    type: OWNER\n\ngateways:\n  default:\n    connection:\n      type: postgres\n      host: localhost\n      port: 5432\n      data
