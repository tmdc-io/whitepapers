6. MODEL-level profiles are also deprecated.","source":"https://v2.dataos.info/references/resources/vulcan/quality/data-quality"},{"q":"A DQ pack is attached to a model whose build failed during a plan apply. What happens to the pack's checks for that job?","options":["They run and all fail","They run against the previous version of the table","They block the next plan","The model is left unscored, because DQ checks only run after a successful write"],"answer":3,"explain":"DQ checks run only after Vulcan writes the data successfully. Vulcan does not score a model that failed to build. If the job hits any error, Vulcan skips scoring.","source":"https://v2.dataos.info/build/productize/data-quality"}]},{"id":"i5","title":"Governance: policies, plugins and permissions","duration":"2 hours","objectives":["Write standalone access policies on physical models with masks and row filters","Write and register an `after_authorize` plugin that maps DataOS role tags to policy groups","Explain how semantic models, metrics and MCP inherit physical-model policies","Separate engine grants, DataOS resource permissions and product access policies, and set a service runtime identity"],"lessons":[{"title":"Access policies on physical models","body":"### Governance is part of the product\n\nDifferent users need different slices of the same data. For example, an executive sees every row. An analyst sees only active customers, and the email is hidden. In Vulcan, you write that rule **with the product**. A separate access layer does not add it later. It works in two steps:\n\n1. After DataOS authorizes a user, a small **project plugin** that you write decides the **policy group** of that user (for example `analyst` or `executive`).\n2. A **policy attached to the backing physical model** uses that group to decide which rows the user can query and which columns are masked. Semantic and metric models **inherit** those rules. They never define a policy directly.\n\n### Policies are standalone files on physical models\n\nThis rule changed in July 2026 and it is the most important rule in this module:\n\n> **Warning:** Policies attach to **physical models only**. A policy whose `depends_on` points at a semantic or metric model fails with `attach policy to a physical model only`. Inline `policies:` blocks on a semantic model are **ignored with a warning**. Vulcan removes any per-dimension `mask_expression` at load time. If you inherit an older project, move that logic into `policies/access/*.yml` and into the `column_mask_expressions` of the physical model. If you do not, the rules quietly stop applying.\n\nPolicy enforcement uses four locations:\n\n| Location | You author | Purpose |\n| --- | --- | --- |\n| `policies/access/*.yml` | `type: policy`, one `depends_on` physical model, `rules[]` with `group`, `mask`, `filter` | Which groups see which rows, which columns are masked |\n| `plugins/*.py` | An `after_authorize` hook that returns a `SecurityContext` | Resolve the caller into a policy group and claims |\n| Physical model `MODEL(...)` block | `column_mask_expressions` | How each masked column is replaced |\n| `config.yaml` | `after_authorize: \"module:callable\"` | Wire the hook into request authorization |\n\n### The policy file\n\n```yaml\ntype: policy\nname: customer_profile_access\ndepends_on:\n  - silver.dim_customer_profile\n\nrules:\n  - group: vulcan_ap_user1\n  - group: vulcan_ap_user2\n    mask:\n      - email\n    filter:\n      - member: customer_segment\n        operator: notEquals\n        values:\n          - Churned\n      - member: region_name\n        operator: in\n        values:\n          - North\n          - South\n```\n\nSchema rules:\n\n- `type` (or `kind`) must resolve to `policy`.\n- `depends_on` is a list with **exactly one** entry, a physical model. Only **one** policy file can target a given physical model.\n- A rule with only `group` grants that group unrestricted access.\n- `group` must be lowercase snake_case that matches `^[a-z][a-z0-9_]{0,63}$`.\n- `mask` takes **bare column names** only. It does not take wildcards or inline expressions.\n\n**Access is deny-by-default.** If the group of a caller matches no rule, Vulcan denies the query. Write a rule for every group that must be able to query the model.\n\n### Masking: who vs how\n\nThe policy decides **who** is masked and **which** columns are masked. The physical model decides **how**:\n\n```sql\nMODEL (\n  name silver.dim_customer_profile,\n  column_mask_expressions (\n    email = CAST(NULL AS TEXT)\n  )\n);\n```\n\nThe keys are column names. The values are SQL expressions that Vulcan evaluates in place of the raw column. Use bare column names inside the expressions. Never use `{model.column}` references. Every column in the `mask` of any rule must have a matching `column_mask_expressions` entry. If not, the project fails to load with `column_mask_expression is missing for proposed masking on column <name>`.\n\n`column_classifications` (for example `plan_type = restricted`) is catalog metadata only. It documents sensitivity for discovery but **masks nothing** at query time.\n\n### Row filters\n\nA `filter` entry is either a unary filter (`member`, `operator`, `values`) or a logical filter (nested `and` / `or` lists). `member` must be a column on the protected physical model. The docs use the operators `equals`, `notEquals`, `in` and `notIn`.\n\n```yaml\nrules:\n  - group: regional_manager\n    filter:\n      - or:\n          - member: region_name\n            operator: equals\n            values: [North]\n          - member: region_name\n            operator: equals\n            values: [South]\n```\n\nA `values` entry can be a literal or a `{securityContext.<key>}` template. Vulcan resolves the template from the claims that your plugin returns. If a key is missing at query time, the query returns `403`.\n\nResponses that a policy governs can include `filter_display`. This is a read-only summary of the row filter that Vulcan applied for the group of the caller. Database clients that support `SHOW WARNINGS` get a warning when a policy is the reason for an empty result.\n\n### Masking and rollups\n\nWith `enable_rollup: true`, the `group by` dimension of a rollup can only use a column with a **constant** mask expression. Examples are `CAST(NULL AS TIMESTAMP)` and a string literal. A mask that references the value, like `CONCAT(LEFT(email, 2), '***')`, cannot be derived again from aggregated data. Vulcan rejects such a mask for rollup dimensions.\n\n### Inheritance at export\n\nAt export time, Vulcan resolves the physical anchor of each semantic model. Then it pulls the policy and the `column_mask_expressions` of that anchor. Thus, one policy protects every semantic model and metric that is built on the physical model. It also protects every access path: SQL, REST, GraphQL, BI tools and Data Product MCP.","sources":["https://v2.dataos.info/build/productize/governance","https://v2.dataos.info/references/resources/vulcan/policies","https://v2.dataos.info/releasenotes/july-2026","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Plugins and auth: from DataOS tags to policy groups","body":"### What the plugin does\n\nA policy rule matches on `group`. But DataOS does not give Vulcan a \"group\". It gives an authenticated user with **tags** such as `roles:id:operator`. In the `plugins/` folder, your project translates that identity into the policy group names that your YAML uses. The folder is a plain Python package that Vulcan loads at runtime.\n\nRequired files:\n\n```\nplugins/\n  __init__.py\n  auth_ext.py\n```\n\n`plugins/__init__.py` marks the folder as a package. The file can be empty, but it must exist so that Vulcan can import the hook path.\n\n### Wiring the hook\n\nIn `config.yaml`, set the root-level `after_authorize` field to an import path of the form `module:function`:\n\n```yaml\nafter_authorize: \"plugins.auth_ext:resolve_user_groups\"\n```\n\n`plugins` is the package, `auth_ext` is the module, and `resolve_user_groups` is the function that Vulcan calls.\n\n### Input and output types\n\n```python\nfrom schema.auth import AuthExtensionContext, SecurityContext\n```\n\n- **`AuthExtensionContext`** (input) carries `user_id`, `user_tags` and `request_headers`. DataOS returns these values after it processes the request.\n- **`SecurityContext`** (output) names the primary `group` that Vulcan uses for policy matching. Any additional keyword fields become **claims**. Row-filter templates can use them as `{securityContext.<key>}`. By convention, `groups` carries all resolved groups as a comma-separated string.\n\nThe hook can be sync or async.\n\n### A priority-based example\n\n```python\nfrom __future__ import annotations\n\nfrom schema.auth import AuthExtensionContext, SecurityContext\n\nROLE_ID_TAG_PREFIX = \"roles:id:\"\nGROUP_DELIMITER = \",\"\nPOLICY_GROUP_PRIORITY = (\"operator\", \"developer\")\n\n\nasync def resolve_user_groups(ctx: AuthExtensionContext) -> SecurityContext:\n    groups = [\n        tag.replace(ROLE_ID_TAG_PREFIX, \"\", 1)\n        for tag in ctx.user_tags\n        if tag.startswith(ROLE_ID_TAG_PREFIX)\n    ]\n\n    group = next(\n        (policy_group for policy_group in POLICY_GROUP_PRIORITY if policy_group in groups),\n        groups[0] if groups else \"\",\n    )\n    return SecurityContext(group=group, groups=GROUP_DELIMITER.join(groups))\n```\n\nHow it works:\n\n1. The hook keeps only tags that start with `roles:id:` and removes the prefix (`roles:id:operator` becomes `operator`).\n2. If the user has several roles, the hook picks the first role that is in `POLICY_GROUP_PRIORITY`. Thus, a user with both `operator` and `developer` resolves to `operator`.\n3. If no role is in that list, the hook uses the first role. If the user has no roles, it uses an empty string.\n\nThe `orders-analytics-with-auth` example adds one more step: `.replace(\"-\", \"_\")`. This step is necessary because DataOS role tags use hyphens (`roles:id:vulcan-ap-user2`), but policy groups must be snake_case (`vulcan_ap_user2`). The plugin is the correct place for that translation.\n\n### Claims for dynamic filters\n\nWith extra fields on `SecurityContext`, one rule can serve many users:\n\n```python\nasync def resolve_user_groups(ctx: AuthExtensionContext) -> SecurityContext:\n    if \"pii-team\" in ctx.user_tags:\n        return SecurityContext(group=\"analyst\", status=\"active\")\n    return SecurityContext(group=\"viewer\")\n```\n\n```yaml\nrules:\n  - group: executive\n  - group: analyst\n    mask:\n      - email\n      - industry\n    filter:\n      - member: status\n        operator: equals\n        values:\n          - \"{securityContext.status}\"\n```\n\n### Failure mode you must design for\n\n> **Warning:** If `after_authorize` is not configured, or the hook raises an exception, or Vulcan cannot import the path, Vulcan attaches **no** `SecurityContext`. Then every rule that matches on `group` fails to match, with no error. Access is deny-by-default, so Vulcan denies callers on any model with a policy. Any model with an attached policy needs a working plugin. After the September 2026 move to Python 3.13, test custom plugins again on the new runtime and make sure that they work.\n\n### End-to-end request flow\n\n```\nBearer token\n  -> Authorization\n  -> after_authorize hook\n  -> SecurityContext(group=..., claims...)\n  -> policy rule matched by SecurityContext.group\n  -> row filters and column masks applied to the physical model query\n```\n\n1. A user sends a semantic query through SQL, REST or GraphQL.\n2. DataOS authorizes the request and returns user tags.\n3. Vulcan calls your plugin.\n4. The plugin returns a `SecurityContext` with a primary `group`.\n5. Vulcan applies the masks and filters of the matching rule before it runs the query.\n\n### Testing policies locally\n\n`vulcan transpile` and `vulcan rewrite` accept a caller id and security-context attributes. Thus, you can see how row and column security apply to a query before you deploy:\n\n```bash\nvulcan transpile \"SELECT * FROM sales.daily_sales\" --format sql --environment prod\nvulcan rewrite --file ./query.sql --security-context group=alpha --style compact\n```\n\nUse the same group names in the plugin output and in the policy YAML. If the plugin returns `vulcan_ap_user2`, the policy must say `group: vulcan_ap_user2`.","sources":["https://v2.dataos.info/references/resources/vulcan/plugins-and-auth","https://v2.dataos.info/build/productize/governance","https://v2.dataos.info/references/resources/vulcan/cli","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Roles and permissions for Vulcan, and managing product access","body":"### Three different permission layers\n\nIn a Vulcan project, \"Permissions\" means three unrelated things. Most access tickets start when people mix them up.\n\n| Layer | Question it answers | Where it is configured |\n| --- | --- | --- |\n| **Engine privileges** | Can Vulcan's service account create and write tables on the warehouse? | SQL `GRANT`s / IAM on the engine |\n| **DataOS resource permissions** | Who can create, edit and run the Vulcan resource, and what can it use? | DataOS RBAC (`Can Use`, `Can Edit`, `Can Manage Access`) |\n| **Product access policy** | Which rows and columns does each consumer see? | `policies/access/*.yml` + plugin (previous lessons) |\n\n### Layer 1: engine privileges\n\nBefore a Vulcan resource can connect, the engine must grant the Vulcan service account a minimal set of privileges. These privileges cover only what Vulcan does at each stage of a run. The PostgreSQL, Snowflake, Databricks, Spark and External Trino guides divide privileges into three **tiers**. Each tier matches a deployment topology:\n\n| Tier pattern | Use when |\n| --- | --- |\n| `<engine>-semantic-readonly` | Vulcan only exposes existing tables or views through the semantic layer, and no models run |\n| `<engine>-single-*-full` | Source and target objects live in a single database, catalog or schema |\n| `<engine>-cross-*-full` | Vulcan reads from one or more sources and writes into a separate target |\n\nGrant the tier that matches, and no more. PostgreSQL is single-catalog, so all source schemas and the Vulcan target schema must be in the same database. Dedicated Trino has no Trino-level grants. Access is on the data source of each depot. Redshift uses SQL grants on the service user. Athena uses IAM policies.\n\n> **Note:** A Depot grant alone does not give Vulcan permission to create or write tables on the engine. Engine grants are provisioned separately.\n\n### Layer 2: DataOS resource permissions for Vulcan\n\nA Vulcan resource follows the same deny-by-default model as every DataOS resource:\n\n- If a user has the **Tenant Admin**, **Data Admin** or **Data Developer** tenant role, that user can create one. The user must also hold the permissions that the resource depends on.\n- A Vulcan resource runs on Compute, so it needs **`Can Use` on that Compute**.\n- The creator becomes owner and receives `Can Edit` and `Can Manage Access`. But owners do **not** receive `Can Use` on resources that they own. Owners grant it to themselves, and the grant is audited.\n- There is **no `Can Use` permission on a Vulcan resource itself**.\n- A Tenant Admin has the same authority as an owner over every Vulcan resource in the tenant. A tenant role alone does not grant access to a specific resource.\n\nAs a Data Developer, you start with **no access** to shared resources. Before you deploy, request `Can Use` from your Tenant Admin for the Compute and for the Depots that you read and write. Also request it for each Secret that your workload references directly. If you use the Lakehouse Depot, request it for that Depot too. The Data Developer role includes tenant-wide **discovery** (searching the Data Product Hub, using tenant apps). But permission to see a product is not permission to consume it.\n\nSince August 2026, resource-level permissions can be **granted to tenant roles** as well as to individuals. For production, the docs still recommend individual grants to limit the blast radius (the damage that one wrong grant can cause).\n\n### Runtime identity: `run_as_user`\n\nA product that runs as a person breaks when the access of that person changes or when the person leaves. For anything beyond a first test, run the product as an **ApplicationUser**. Your Tenant Admin or Operator creates one and grants you **`Can Use ApiKey`**. Then you set it as `run_as_user` in the `deployment:` block. Internally, DataOS tracks three identities separately: **owner**, **submitter** and **runAsUser**. `runAsUser` controls only the runtime identity. Deletion follows ownership, never `runAsUser`. DataOS rejects a manifest that sets a run-as identity without the explicit consent grant.\n\n### Layer 3 in practice: managing who consumes the product\n\nThe Operate guide gives these practices for Data Developers:\n\n- Define masking and row filters **before** publishing the product.\n- Test the product as **each** policy group, and make sure that the masks and filters are as expected.\n- Test what happens when a user matches **no** configured group (Vulcan must deny that user).\n- Document the purpose of every grant, group, mask and filter.\n- Keep group names consistent between the plugin and the policy YAML.\n- Treat changes to grants, masks and filters as consumer-facing changes, and communicate them before they take effect.\n\n### Consumers through AI follow the same rules\n\nData Product MCP runs every call through the same policy enforcement point as the rest of the platform. It uses the credentials of the caller. A masked column comes back masked to an AI assistant. A product that the user cannot access never appears in the discovery results of the assistant. Vulcan APIs also enforce **tenant-scoped authorization** (September 2026). A user can reach a product only with permission inside the correct tenant.","sources":["https://v2.dataos.info/references/resources/vulcan/roles-and-permissions","https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/vulcan-access-control","https://v2.dataos.info/operate/data-developer/access-and-readiness","https://v2.dataos.info/operate/data-developer/manage-data-product-access","https://v2.dataos.info/operate/access-control/roles-and-permissions/runasuser-permissions","https://v2.dataos.info/consume/consume-with-ai/overview","https://v2.dataos.info/releasenotes/august-2026"]}],"lab":{"title":"Govern customer_profile with a standalone policy and an auth plugin","goal":"A physical-model policy on `silver.dim_customer_profile`. It gives `data_developer` full access. It gives `data_consumer` masked `email`/`customer_name` and filters out churned customers. An `after_authorize` plugin resolves the groups, and you test the policy locally with `vulcan transpile`.","duration":"90 min","prereqs":["Module i4 lab complete (`vulcan plan dev` applies cleanly)","Your own role tags, from `dataos-ctl user get` (look for `roles:id:...` in the TAGS column)"],"steps":["**Check your role tags.**\n\n```bash\ndataos-ctl user get\n```\n\nWrite down the `roles:id:*` tags. This lab uses the tenant roles `roles:id:data-developer` and `roles:id:data-consumer`. If the real role tags of your tenant are different, use them instead. Then change the group names to match.","**Add mask expressions to the physical model.** Edit the `MODEL` block of `models/silver/dim_customer_profile.sql`:\n\n```sql\nMODEL (\n  name silver.dim_customer_profile,\n  kind FULL,\n  grains (customer_id),\n  description 'One row per customer with lifetime order metrics and segment.',\n  column_mask_expressions (\n    email = CAST(NULL AS TEXT),\n    customer_name = CONCAT(LEFT(customer_name, 1), '***')\n  ),\n  column_classifications (\n    email = restricted\n  )\n);\n```\n\nRemember that `column_classifications` is only catalog metadata. The masking comes from `column_mask_expressions` together with the policy.","**Write the policy file.** Save it as `policies/access/customer_profile_access.yml`:\n\n```yaml\ntype: policy\nname: customer_profile_access\ndepends_on:\n  - silver.dim_customer_profile\n\nrules:\n  - group: data_developer\n  - group: data_consumer\n    mask:\n      - email\n      - customer_name\n    filter:\n      - member: customer_segment\n        operator: notEquals\n        values:\n          - Churned\n```","**Write the plugin.** Create an empty `plugins/__init__.py`. Then create `plugins/auth_ext.py`:\n\n```python\nfrom schema.auth import AuthExtensionContext, SecurityContext\n\nROLE_ID_TAG_PREFIX = \"roles:id:\"\nGROUP_DELIMITER = \",\"\nPOLICY_GROUP_PRIORITY = (\n    \"data_developer\",\n    \"data_consumer\",\n)\n\n\nasync def resolve_user_groups(ctx: AuthExtensionContext) -> SecurityContext:\n    groups = [\n        tag.replace(ROLE_ID_TAG_PREFIX, \"\", 1).replace(\"-\", \"_\")\n        for tag in ctx.user_tags\n        if tag.startswith(ROLE_ID_TAG_PREFIX)\n    ]\n\n    group = next(\n        (policy_group for policy_group in POLICY_GROUP_PRIORITY if policy_group in groups),\n        groups[0] if groups else \"\",\n    )\n    return SecurityContext(group=group, groups=GROUP_DELIMITER.join(groups))\n```","**Register the hook.** Add this line to the root of `config.yaml`:\n\n```yaml\nafter_authorize: \"plugins.auth_ext:resolve_user_groups\"\n```","**Plan.**\n\n```bash\nvulcan plan dev\n```\n\nIf the plan fails with `column_mask_expression is missing for proposed masking on column ...`, a column in `mask` has no `column_mask_expressions` entry. If the plan fails with `attach policy to a physical model only`, `depends_on` points at a semantic model. Change it to `silver.dim_customer_profile`.","**Test each group locally with `vulcan transpile`.** Save the query below as `query.sql`. Then transpile it with each group:\n\n```sql\nSELECT customer_profile.customer_name, customer_profile.email, customer_profile.customer_segment\nFROM customer_profile\nLIMIT 10\n```\n\n```bash\nvulcan transpile --file ./query.sql --format sql --environment dev --security-context group=data_developer\nvulcan transpile --file ./query.sql --format sql --environment dev --security-context group=data_consumer\nvulcan transpile --file ./query.sql --format sql --environment dev --security-context group=nobody\n```\n\nCompare the generated SQL. Make sure that the `data_consumer` version replaces `email` and `customer_name` with the mask expressions and adds a `customer_segment` filter. Make sure that Vulcan denies the `nobody` version, because no rule matches.","**Commit.** Commit `policies/`, `plugins/`, the updated model and `config.yaml`. In module i6, after you deploy, you will make sure that the policy works for real users."],"verify":"- `vulcan plan dev` applies with the policy loaded and no masking-contract errors.\n- `vulcan transpile ... group=data_consumer` output contains the `CAST(NULL AS TEXT)` mask for `email`, the `customer_name` mask, and a filter that excludes `Churned`. The `data_developer` output contains none of these.\n- Vulcan denies a group with no matching rule and returns no data.","sources":["https://v2.dataos.info/build/productize/governance","https://v2.dataos.info/references/resources/vulcan/policies","https://v2.dataos.info/references/resources/vulcan/plugins-and-auth","https://v2.dataos.info/references/resources/vulcan/cli","https://v2.dataos.info/operate/data-developer/manage-data-product-access"]},"takeaways":["Policies are standalone `policies/access/*.yml` files whose single `depends_on` is a physical model.","Access is deny-by-default. Write a rule for every group that must be able to query the model.","Policies say who is masked, and `column_mask_expressions` say how. `column_classifications` masks nothing.","The `after_authorize` plugin turns DataOS tags into a `SecurityContext`. If the plugin fails, no group rule matches.","Engine grants, DataOS `Can Use` grants and product policies are three separate layers.","Run production products as an ApplicationUser with `run_as_user`, not as a person."],"quiz":[{"q":"A team upgrades an older project. After the upgrade, their email masking does not apply. The semantic model `customer_profile.yaml` still contains an inline `policies:` block. What happened?","options":["Inline semantic policies are now ignored with a warning. Move the rules to `policies/access/*.yml` on the physical model and the SQL to `column_mask_expressions`","The plugin path is wrong","Masks only apply to metrics","Policies require `enable_rollup: true`"],"answer":0,"explain":"Since July 2026 policies are on physical models only. Vulcan ignores inline `policies:` on a semantic model with a warning. It also removes per-dimension `mask_expression` at load.","source":"https://v2.dataos.info/build/productize/governance"},{"q":"A policy file lists `mask: [email]` for group `analyst`, but `vulcan plan` fails on load. The physical model has `column_classifications (email = restricted)`. What is missing?","options":["A `filter` on the analyst rule","A `column_mask_expressions` entry for `email` on the physical model","`public: true` on the email dimension","A second policy file for the semantic model"],"answer":1,"explain":"Every masked column needs a matching `column_mask_expressions` entry. `column_classifications` is catalog metadata with no masking effect.","source":"https://v2.dataos.info/references/resources/vulcan/policies"},{"q":"After deployment, every consumer gets denied on `customer_profile`, including users in groups that have rules. Logs show the `after_authorize` module failed to import. Why are all users denied?","options":["The policy has too many rules","Masks were applied to every column","Without a working hook, no SecurityContext is attached, so no group rule matches and access is deny-by-default","Tenant-scoped authorization blocks plugins"],"answer":2,"explain":"If the hook is missing, raises an exception or fails to import, Vulcan attaches no SecurityContext. Every group rule then fails to match with no error, and deny-by-default applies.","source":"https://v2.dataos.info/references/resources/vulcan/plugins-and-auth"},{"q":"DataOS returns the tag `roles:id:vulcan-ap-user2`, and the policy rule says `group: vulcan-ap-user2`. What is wrong?","options":["Nothing, the names match","Group names must be lowercase snake_case, so the plugin must translate hyphens and the rule must use `vulcan_ap_user2`","Groups must start with `roles:id:`","The rule needs `mask` to be valid"],"answer":1,"explain":"`group` must match `^[a-z][a-z0-9_]{0,63}$`, so hyphens are invalid. The example plugin uses `.replace(\"-\", \"_\")` to translate role tags into group names.","source":"https://v2.dataos.info/build/productize/governance"},{"q":"A Data Developer can see a Compute in the Hub but `dataos-ctl resource apply` for their Vulcan resource is rejected for that Compute. What do they need?","options":["`Can Use` on the Compute, granted by its owner or someone with `Can Manage Access`","`Can Use` on the Vulcan resource","The Data Steward role","A `column_classifications` block"],"answer":0,"explain":"A Vulcan resource needs `Can Use` on the Compute it references. Discovery visibility is not a grant, and there is no `Can Use` on a Vulcan resource itself.","source":"https://v2.dataos.info/operate/access-control/roles-and-permissions/resource-level-permissions/vulcan-access-control"}]},{"id":"i6","title":"Plan, run, deploy and monitor","duration":"2.5 hours","objectives":["Choose correctly between `vulcan plan` and `vulcan run`, and use plan options and debugging commands","Configure a `deployment:` block and a git-sync Secret, then render, lint and apply the Vulcan resource","Monitor runtime components, read logs, troubleshoot common errors, and delete a product safely","Promote a product across environment tenants with the same Git ref"],"lessons":[{"title":"Plan and run","body":"### The local validation cycle\n\nBefore you ship anything, make sure that the whole project works on your machine. Fix each layer before you move to the next one:\n\n```\nvulcan info       check project structure and connection\nvulcan test       unit tests against mock data\nvulcan evaluate   inspect model output\nvulcan plan       detect changes, materialize, run audits\nvulcan run        refresh data on an already-applied shape\n```\n\n### Plan versus run: the most common Vulcan mistake\n\n`plan` and `run` answer different questions:\n\n| Question | `vulcan plan` | `vulcan run` |\n| --- | --- | --- |\n| Did model SQL or Python change? | Yes | No |\n| Did a metric, semantic model, check or metadata change? | Yes | No |\n| Do you need Vulcan to review what changed? | Yes | No |\n| Do you only need to process new data? | No | Yes |\n| Do you want scheduled refreshes? | No | Yes |\n\n**Plan** does these steps, in this order:\n\n- It loads the project and builds the dependency graph.\n- It compares the local state with the applied state.\n- It classifies each change: added, removed, breaking, non-breaking or metadata-only.\n- It computes the intervals that need backfill or restatement.\n- It runs the unit tests and the attached assertions.\n- It shows you the result before it applies the changes:\n\n```\nPlan: 13 models to evaluate, 1 seed to load\n  bronze.orders               (full)  [new]\n  silver.fct_daily_sales      (full)  [new]\n  gold.rfm_customer_segmentation (full) [new]\nAudits: 15 passed, 0 failed\n```\n\n**Run** processes new or missing intervals on a shape that is **already applied**. It never picks up local code changes, and it is not a substitute for plan. Scheduled production refreshes use run.\n\n### What `vde` changes\n\nWith the default `vde: false`, plan writes each model directly under its own name. This mode is simple and forward-only, and it has no virtual-layer safety boundary. With `vde: true`, Vulcan builds a versioned physical snapshot and swaps a virtual-layer view to point at it. Vulcan rejects this mode on `spark` and `trino` gateways. The swap is the \"apply the virtual update?\" prompt that you answer with `y`.\n\n### Environments\n\n`vulcan plan dev` plans into a development environment named `dev`. By default, Vulcan creates it from `prod` (`--create-from`). `vulcan environments` lists the environments and their expiry. Develop in `dev`. Without an environment name, plan uses `prod`. Production changes go through plan into this environment.\n\n### Plan options you will use\n\n| Option | Purpose |\n| --- | --- |\n| `--auto-apply` | Apply without a prompt (the deployed `plan` component uses this option) |\n| `--skip-tests` / `--skip-linter` | Skip tests or linting before planning |\n| `-r, --restate-model` | Restate data for a model and everything downstream |\n| `--skip-backfill`, `--dry-run` | Create only a virtual update, no backfill |\n| `--forward-only` | Plan forward-only changes |\n| `--explain` | Explain the plan instead of applying it |\n| `--no-prompts` | Turn off interactive prompts (the plan fails on uncategorized changes) |\n| `-s/--start`, `-e/--end` | Set the limits of the interval |\n| `-v, --verbose` | Show detail, including failing assertion rows |\n\n### Debugging tools\n\n- **`vulcan render silver.fct_daily_sales`**: shows the exact SQL after macro expansion. Add `--expand` to inline the referenced models.\n- **`vulcan export dag dag.html`**: writes the dependency graph. A missing model usually means a wrong `FROM`.\n- **`vulcan evaluate <model> --limit 10`**: previews the output. Look at three things: are there rows, are the measures sane, and do the counts match the grain?\n- **`vulcan audit`**: runs the attached assertions against the current state.\n- **`vulcan lint`**: runs the linter rules. A `linter.rules` violation blocks a plan. A `warn_rules` violation only gives a warning.\n- **`vulcan table_diff`** and **`vulcan diff`**: compare tables, or compare local state against an environment.\n\n### Common plan-time issues\n\n| Issue | Likely cause | Fix |\n| --- | --- | --- |\n| Empty model output | Missing upstream or wrong filter | Run the plan. Then examine the ordering and the filter logic |\n| `Relation does not exist` | Upstream not materialized | Run the plan first. Then make sure that the `FROM` name is correct |\n| `Column not found` | The SELECT and the MODEL block do not match | Match names exactly |\n| Assertion fails unexpectedly | Data variance exceeds the rule | Run again with `--verbose` to see the rows |\n| YAML parse error | Bad indentation in a test or DQ file | Fix indentation |\n| Plan stops on a lint error | A `linter.rules` violation | Fix it, or move the rule to `warn_rules` |\n\n> **Warning:** `vulcan migrate` and `vulcan rollback` change the internal state of Vulcan for **all** users. Coordinate with your Vulcan administrator before you run either command.","sources":["https://v2.dataos.info/build/productize/plan-and-run","https://v2.dataos.info/references/resources/vulcan/concepts/run-and-plan","https://v2.dataos.info/references/resources/vulcan/cli"]},{"title":"Git and deploy","body":"### From local project to running product\n\nDeployment turns a tested local project into a running Data Product that people can discover. DataOS pulls your project from Git, runs it on a schedule, and serves it through APIs. Before you begin, you need these items:\n\n- A passing `vulcan plan`\n- The project pushed to a Git branch\n- A Depot with read/write access\n- A valid engine\n- A Compute\n- The minimum grants of the engine for the Vulcan service account\n\nTo make sure that each item is available, run:\n\n```bash\ndataos-ctl resource get -t <depot|stack|compute> -a\n```\n\nIf `get -a` shows that you do not have access, ask your Tenant Admin for a `Can Use` grant.\n\n### Repository secret\n\nDataOS pulls code with **git-sync**. For a **private** repository (GitHub, Bitbucket or AWS CodeCommit), store read-only credentials in a Secret:\n\n```yaml\nname: git-sync\nversion: v2alpha\ntype: secret\nworkspace: system\nlayer: user\ndescription: \"Secret for git-sync authentication\"\nsecret:\n  type: key-value\n  data:\n    GITSYNC_USERNAME: \"<your-git-username>\"\n    GITSYNC_PASSWORD: \"<your-personal-access-token>\"\n```\n\n```bash\ndataos-ctl resource apply -f git-sync-secret.yml\ndataos-ctl resource get -t secret -n git-sync\n```\n\n> **Warning:** Never commit this file. Add it to `.gitignore`. Use a dedicated service account, give the token read-only scope on one repository, and rotate it regularly. Since September 2026, public repositories need no secret. `repo.secret_id` is required only for a repository that needs authentication.\n\n### The `deployment:` block\n\nA `deployment:` block in `config.yaml` controls all of the deployment. You never write or edit the manifest by hand.\n\n```yaml\ndeployment:\n  repo:\n    url: https://bitbucket.org/your-org/your-repo\n    base_dir: your-repo/path/to/orders-analytics\n  compute: pacific\n  run_as_user: \"johndoetmdcio\"\n  engine: postgres   # required only when the gateway connection is type: depot\n```\n\nOnly `repo.url`, `repo.base_dir`, `compute` and `run_as_user` are required. Some fields are **derived**, and you never write them under `deployment:`:\n\n- `name`, `description` and `tags` come from the top of `config.yaml`.\n- `depots` comes from the depot-typed gateway. You can override it.\n- `workflow.schedule.crons` is the deduplicated union of the effective cron of every model. You cannot override it.\n\n`version` is always `v1alpha`, and `concurrency_policy` is always `Forbid`.\n\nThe optional keys include `repo.secret_id`, `repo.sync_flags` (default `--ref=main`, `--submodules=off`), `schedule.end_on` and `schedule.timezone`, `workflow.log_level`, and `api.replicas`. They also include `use.secrets`/`use.env_vars` for projection, and the advanced `state_store_connection`/`object_store_connection` overrides.\n\n> **Warning:** Set the workflow and API sizing with the **plural** keys `resources`, `requests` and `limits`. The singular keys `resource`/`request`/`limit` still load, but they are deprecated (September 2026). `create_deploy_yaml` prints a warning for them.\n\n```yaml\ndeployment:\n  workflow:\n    resources:\n      requests:\n        cpu: 200m\n        memory: 512Mi\n      limits:\n        cpu: 1000m\n        memory: 1Gi\n```\n\nThe engine-specific configuration is **engine-gated**. `deployment.spark_conf` is valid only with the `spark` engine, and `deployment.trino` is valid only with the `trino` engine. A key for the wrong engine fails at render time. The number of depots also depends on the engine. Spark and Trino allow several depots. Every other engine requires exactly one depot. A standalone `trino-deploy.yaml` no longer exists.\n\n### Render, lint, apply\n\n`vulcan create_deploy_yaml` is a **deterministic renderer**. Every value comes from your project or the `deployment:` block, and no placeholders stay in the output. By default, it writes `<project_name>-deploy.yaml`. Use `--overwrite` to replace the file, or `-o -` to write to stdout. If a value is wrong, fix `config.yaml` and render again. Do not edit the output.\n\n```bash\n# lint (dry-run) until clean\nvulcan create_deploy_yaml -o - | dataos-ctl resource apply --in -l\n\n# apply for real\nvulcan create_deploy_yaml -o - | dataos-ctl resource apply --in\n```\n\nThe rendered resource is `type: vulcan`. It has `spec.run_as_user`, `compute`, `engine`, `repo`, `depots`, `api` (replicas) and a `workflow`. The workflow holds the schedule, a `plan` that runs `vulcan --log-to-stdout plan --auto-apply`, and a `run` that runs `vulcan --log-to-stdout run`.\n\n### Three runtime components\n\nA deployed product is not one container. DataOS creates three components: a **plan** component that runs `vulcan plan --auto-apply`, a **run** component that runs `vulcan run` on the schedule, and an **api** component that serves the endpoints.\n\n> **Tip:** Set `schedule.end_on` one or two years in the future. An expired schedule stops silently, with no error. In production, make `run_as_user` a service identity (ApplicationUser), not your personal ID.","sources":["https://v2.dataos.info/build/productize/git-and-deploy","https://v2.dataos.info/references/resources/vulcan/deployment","https://v2.dataos.info/build/get-started/prerequisites/repository-setup","https://v2.dataos.info/references/resources/vulcan/cli","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Monitor, troubleshoot and delete","body":"### One resource to watch\n\nA deployed Data Product is a single `vulcan` resource. A separate `data-product` resource type does not exist. You inspect and delete the same resource that you deployed.\n\n### Check status and runtime\n\n```bash\ndataos-ctl resource get -t vulcan -n orders-analytics\ndataos-ctl resource get runtime -t vulcan -n orders-analytics -r\n```\n\nThe runtime output lists the container groups that DataOS creates for the product:\n\n| Component | Aggregate ID | Container group type | Example | Healthy phase |\n| --- | --- | --- | --- | --- |\n| API stateful pods | `vulcan-api` | `cgroup-stateful` | `orders-analytics-api-0` | `running` |\n| API stateless service pods | `vulcan-api` | `cgroup-stateless` | `servicev2alphaordersanalyticsapi-...` | `running` |\n| Plan execution | `vulcan-plan` | `cgroup-workflow` | `orders-analytics-plan-execute` | `completed` |\n| Scheduled run | `vulcan-run` | `cgroup-workflow` | `orders-analytics-r-execute` | `completed` |\n\nEach group can hold a `primary` container, `initSideCar` containers that prepare the workload, and `sideCar` helpers such as `wait`. Read the `PHASE` column. `running` means that the API is live. `completed` means that a plan or run finished successfully. A failed, pending or stuck phase needs investigation.\n\n### Logs\n\n```bash\ndataos-ctl resource log -t vulcan -n orders-analytics\ndataos-ctl resource log -t vulcan -n orders-analytics --container-group orders-analytics-plan-execute\ndataos-ctl resource log -t vulcan -n orders-analytics --container-group <api-container-group> -c <container-name>\n```\n\nPick the log that matches the question: **run** for model execution, **plan** for planning and migration, and **api** for query and endpoint issues. Add `--tailLines 100` or `--follow` as necessary. On Spark gateways, the run and plan pods act as the Spark driver. Start with the DataOS run logs, then read the driver and executor logs.\n\n### Runtime controls\n\n`dataos-ctl resource runtime run|re-run|pause|resume|stop -t <type> -n <name>` triggers, re-runs, pauses, resumes or stops a runnable resource. You do not change the manifest. In September 2026 DataOS extended stop, resume and re-run to `service` and `worker`.\n\n### Deploy-time troubleshooting\n\n| Issue | What to inspect |\n| --- | --- |\n| Repository does not sync | Git URL, branch (`sync_flags`), `base_dir`, git-sync secret |\n| Depot connection fails | Depot name, credentials, permissions |\n| Plan fails | `config.yaml`, gateway, model defaults, migrations |\n| Run fails | Model SQL, dependencies, permissions, engine logs |\n| API fails | API resource allocation, service status, sidecar logs |\n| Product not visible | Metadata registration, product spec, target tenant |\n| Deploy manifest parsed as a model | Add `*-deploy.yaml` to `ignore_patterns` |\n| Schedule silently stopped | `end_on` in the past |\n\n### API-time errors\n\nThe Vulcan API returns specific codes. Search the troubleshooting reference for the exact string:\n\n| Code | Meaning | First fix |\n| --- | --- | --- |\n| `COMMON.AUTH.UNAUTHORIZED` | Missing or malformed `Authorization` header | Send `Authorization: Bearer <token>` |\n| `COMMON.AUTH.INVALID_TOKEN` | Token expired, malformed or revoked | Refresh it. Make sure that the tenant/environment is correct |\n| `COMMON.AUTH.FORBIDDEN` | Authenticated, but policy denies | Inspect the roles/tags and the access policy |\n| `DATA_MANIPULATION_DETECTED` | Write SQL sent to the read-only SQL endpoint | Send read-only SQL. Move writes into a model |\n| `TRANSPILER.QUERY.INVALID` | Semantic query structurally invalid | Inspect the measures/dimensions. Preview with `vulcan transpile` |\n| `SEMANTIC_QUERY_ERROR` | Bad aggregation or grouping | Put every non-aggregated column in `GROUP BY` |\n\n### Deleting a product\n\nDeletion is irreversible. You can delete only through the CLI, because the Hub has no delete action. Look for dependents first:\n\n```bash\ndataos-ctl resource deps -t vulcan -n orders-analytics\ndataos-ctl resource delete -t vulcan -n orders-analytics\n```\n\nThe forms `dataos-ctl resource delete -i \"orders-analytics|v1alpha|vulcan\"` and `dataos-ctl resource delete -f <manifest>` do the same thing. `--cascade` also deletes every dependent resource. `--force` deletes the resource past a blocking dependency check. DataOS removes the api, plan and run components one after another, so the teardown takes a few minutes. Run `get` again until the resource no longer returns. The Hub updates automatically.","sources":["https://v2.dataos.info/build/productize/monitor-and-delete","https://v2.dataos.info/references/resources/vulcan/monitor-and-delete","https://v2.dataos.info/references/resources/vulcan/troubleshooting","https://v2.dataos.info/operate/data-developer/cli-dev-cheatsheet","https://v2.dataos.info/build/productize/connect-engine/trino"]},{"title":"Deploy and promote across environments","body":"### Deploying is not promoting\n\nA single deployment is mechanics. To **promote** a product reliably from experimentation to production is an operational discipline. The way that you promote depends on how your Operator divided the tenants. The common blueprint gives each environment its own tenant: `dev`, `stg` and `prod`. Promotion is a controlled progression of the **same project** across these tenants.\n\n### The promotion path\n\n1. **Build and validate in dev.** Plan and run locally, then deploy to the dev tenant. Make sure that the runs, quality checks and served APIs work correctly.\n2. **Promote to staging**: deploy the same Git ref to the staging tenant. Point it at the staging data sources and compute. Test against production-like data and access.\n3. **Promote to production**: deploy the same ref to the prod tenant. Nothing reaches production without a pass in staging.\n\nThe CLI switches between tenant contexts:\n\n```bash\ndataos-ctl tenant list\ndataos-ctl tenant select --name <context>\ndataos-ctl login\n```\n\n### What changes between environments\n\nThe configuration changes, not the code. DataOS resolves these items per tenant: the tenant, the Depots and Compute that it points at, and the Secrets that hold the source credentials. Keep the project identical, and let each environment supply its connections. For this reason, the gateway uses `type: depot` on DataOS, and credentials live behind `env_var` locally. Also, the platform can inject `tenant` (or you can use `DATAOS_TENANT_ID`), so you do not hard-code it per branch.\n\n> **Tip:** Since September 2026, App links can be plain paths (for example `/orders-dashboard`) instead of full URLs. Thus the same App definition promotes unchanged across environments.\n\n### Operating practices\n\n- **One source of truth.** Promote a specific, tagged Git ref forward. Pin it through `repo.sync_flags`, for example `--ref=<tag>`. Never edit directly in a higher environment.\n- **Same project, different config.** Parameterize the connections. Never fork the project per environment.\n- **Promote on green.** A product moves up only after its plan, tests and quality checks pass in the environment below.\n- **Coordinate breaking changes.** A dropped column, a changed grain or a renamed measure breaks consumers. Vulcan catches the break at author time, but you still owe consumers notice. Communicate the change, give a migration window, and then ship.\n- **Record what is where.** Track which ref is deployed in each tenant. Then you can reason about a release, and roll it back.\n\n### Keeping it healthy after promotion\n\nA deployed product is not done. It is running. As the named owner, do these tasks:\n\n- **Watch runs and schedules.** A missed or failing run means stale data downstream.\n- **Handle failures.** Read the error and the failing model. Fix the data or the logic, and run again. Plan and audit locally before you deploy again.\n- **Read quality signals correctly.** A failing assertion blocked bad data, which is good. A drifting DQ check warns you that something changed. Both signals tell you to act.\n- **Version deliberately.** Increase the SemVer `version` in `config.yaml` for each meaningful change.\n- **Promote, do not hotfix.** Move changes through the environments. Do not edit production.\n- **Mind the cost.** Give Compute the correct size. Where data grows, use incremental builds instead of full rebuilds. Retire products that no one consumes.\n- **Keep the contract honest.** `usage.yaml` must stay true as the product changes. Your contact details must stay current so that consumers can reach you.\n\n### Optional: AI-readiness review before promotion\n\n`vulcan review` (beta) runs an AI-assisted review of model changes against a target environment. It writes an HTML report under `.vulcan/reviews`. It requires the `review` extra, a `review.model` in `config.yaml`, and an LLM provider key in the environment. Use its output as advice, not as a gate, because the results depend on the provider that you choose.","sources":["https://v2.dataos.info/operate/data-developer/deploy-and-promote","https://v2.dataos.info/operate/data-developer/monitor-data-product","https://v2.dataos.info/operate/data-developer/cli-dev-cheatsheet","https://v2.dataos.info/references/resources/vulcan/cli","https://v2.dataos.info/releasenotes/august-2026"]}],"lab":{"title":"Deploy orders-analytics to DataOS and monitor it","goal":"A running `orders-analytics` Vulcan resource in your dev tenant, rendered from a `deployment:` block. Its plan and run components are `completed`. Its API is `running` and answers the liveness probe. You make sure that the governance policy works for a real user.","duration":"2 hours","prereqs":["Modules i2-i5 labs complete and committed","A Git repository (GitHub, Bitbucket or AWS CodeCommit) that you can push to. For a private repository, a read-only access token","`Can Use` on the Compute (shown as `<compute>`) and on `postgresdepot` and its Secret","An ApplicationUser that you can run as (`Can Use ApiKey`), or your own user ID for a first test"],"steps":["**Confirm readiness.**\n\n```bash\ndataos-ctl resource get -t compute -a\ndataos-ctl resource get -t depot -a\ndataos-ctl resource get -t stack -a\n```\n\nMake sure that the output shows `<compute>`, `postgresdepot`, and a healthy Vulcan stack.","**Switch the default gateway to the Depot.** In `config.yaml`, rename the raw local connection to a second gateway. Make the depot gateway the default:\n\n```yaml\ngateways:\n  default:\n    connection:\n      type: depot\n      address: dataos://postgresdepot?purpose=rw\n  local:\n    connection:\n      type: postgres\n      host: \"{{ env_var('PG_HOST') }}\"\n      port: 5432\n      database: \"{{ env_var('PG_DATABASE') }}\"\n      user: \"{{ env_var('PG_USER') }}\"\n      password: \"{{ env_var('PG_PASSWORD') }}\"\n```\n\nFrom now on, run local commands with `vulcan --gateway local ...`. For example, run `vulcan --gateway local plan dev`.","**Add the `deployment:` block** (plural resource keys only):\n\n```yaml\ndeployment:\n  repo:\n    url: <git repo url>\n    base_dir: <repo-name>/<path-to-orders-analytics>\n    secret_id: <workspace>:git-sync     # omit for a public repository\n    sync_flags:\n      - '--ref=main'\n      - '--submodules=off'\n  compute: <compute>\n  run_as_user: <service-user>\n  engine: postgres\n  schedule:\n    end_on: '2027-12-31T00:00:00-00:00'\n    timezone: UTC\n  workflow:\n    resources:\n      requests: { cpu: 200m,  memory: 512Mi }\n      limits:   { cpu: 1000m, memory: 1Gi }\n  api:\n    replicas: 1\n```\n\nMake sure that `ignore_patterns: [\"*-deploy.yaml\"]` is still present.","**Create the git-sync Secret (private repos only).** Save the Secret manifest from the lesson as `git-sync-secret.yml`. Add the file to `.gitignore`. Then run:\n\n```bash\ndataos-ctl resource apply -f git-sync-secret.yml\ndataos-ctl resource get -t secret -n git-sync\n```","**Push the project.**\n\n```bash\ngit add .\ngit commit -m \"Add deployment config, policies and quality gates\"\ngit push origin main\n```","**Render and lint until clean.**\n\n```bash\nvulcan create_deploy_yaml -o - | dataos-ctl resource apply --in -l\n```\n\nFix each reported error in `config.yaml`, never in the rendered output. Then run the command again. (Optional) To inspect the file, write it with `vulcan create_deploy_yaml --overwrite`. Then open `orders-analytics-deploy.yaml`.","**Apply.**\n\n```bash\nvulcan create_deploy_yaml -o - | dataos-ctl resource apply --in\n```","**Watch the runtime.**\n\n```bash\ndataos-ctl resource get -t vulcan -n orders-analytics\ndataos-ctl resource get runtime -t vulcan -n orders-analytics -r\ndataos-ctl resource log -t vulcan -n orders-analytics --container-group orders-analytics-plan-execute\n```\n\nWait until the plan container group reaches `completed` and the API groups reach `running`.","**Hit the liveness probe.** The health endpoints are at the product root. They need no authentication:\n\n```bash\nexport PRODUCT_BASE_URL=\"https://<DATAOS_FQDN>/vulcan/tenants/<TENANT_ID>/data-products/<TENANT_ID>-orders-analytics\"\ncurl \"$PRODUCT_BASE_URL/livez\"\n```\n\nThe expected output is `{\"status\": \"alive\"}`.","**Verify discovery and governance.** In the Data Product Hub, open `orders-analytics`. Make sure that the metadata, owner, description, inputs, outputs and quality signals appear. In Studio, query `customer_profile` and select `customer_name` and `email`. As a `data-developer` user, you see raw values. Ask a colleague who has only the consumer role to run the same query. Make sure that your colleague sees masked values and no `Churned` rows.","**(Optional) Practice teardown in a sandbox tenant only.**\n\n```bash\ndataos-ctl resource deps -t vulcan -n orders-analytics\ndataos-ctl resource delete -t vulcan -n orders-analytics\ndataos-ctl resource get -t vulcan -n orders-analytics\n```\n\nDo not delete a shared or production product. If you still need the product for module i7, apply it again after the teardown."],"verify":"- The lint command passes with no errors.\n- `dataos-ctl resource get runtime -t vulcan -n orders-analytics -r` shows `orders-analytics-plan-execute` as `completed` and the API container groups as `running`.\n- `curl \"$PRODUCT_BASE_URL/livez\"` returns `{\"status\": \"alive\"}`.\n- The product appears in the Data Product Hub. A consumer-role user sees masked `email` values.","sources":["https://v2.dataos.info/build/productize/git-and-deploy","https://v2.dataos.info/references/resources/vulcan/deployment","https://v2.dataos.info/build/get-started/prerequisites/repository-setup","https://v2.dataos.info/build/productize/monitor-and-delete","https://v2.dataos.info/references/interfaces/apis/data-product-apis/api-reference/health"]},"takeaways":["Did you change the shape? Run `vulcan plan`. Do you only refresh an applied shape? Run `vulcan run`.","Deployment is a `deployment:` block in config.yaml that `vulcan create_deploy_yaml` renders. Never edit the output by hand.","Lint with `| dataos-ctl resource apply --in -l` before you apply. Use the plural keys `resources/requests/limits`.","A deployed product is one `vulcan` resource with api, plan and run components. Read the phases and logs for each component.","Delete only through the CLI, and only after `resource deps`. Deletion is irreversible.","Promote the same Git ref through dev, stg and prod. The environments differ in configuration, not in code."],"quiz":[{"q":"A developer edited `silver.fct_daily_sales.sql` and ran `vulcan run`, but the production table still uses the old logic. Why?","options":["`run` only processes missing intervals on the already-applied shape and never picks up local code changes. Use `vulcan plan`","`run` needs `--auto-apply`","The model must be a VIEW","The DQ pack blocked the change"],"answer":0,"explain":"Plan applies project changes. Run only refreshes data for the applied version. The docs call this confusion the most common Vulcan mistake.","source":"https://v2.dataos.info/build/productize/plan-and-run"},{"q":"`vulcan create_deploy_yaml` prints a deprecation warning about `deployment.workflow.resource.request`. What must you change?","options":["Edit the rendered YAML to remove the field","Move sizing to `deployment.trino`","Use the plural keys `resources`, `requests` and `limits` in `config.yaml`","Delete the `workflow` block entirely"],"answer":2,"explain":"Since September 2026 the singular keys are deprecated, so use the plural keys. Never edit the rendered output, because it is a deterministic render of config.yaml.","source":"https://v2.dataos.info/references/resources/vulcan/deployment"},{"q":"A Postgres-backed project sets `deployment.trino.workers.replicas: 3`. What happens?","options":["Vulcan provisions a Trino cluster for the Postgres product","Validation fails at `create_deploy_yaml` time because `trino` is valid only with the trino engine","The setting is silently ignored","DataOS rejects it only at apply time"],"answer":1,"explain":"`spark_conf` and `trino` are engine-gated and fail at render time, not at DataOS apply time.","source":"https://v2.dataos.info/references/resources/vulcan/deployment"},{"q":"A deployed product stopped refreshing months ago with no error anywhere. The plan container group is `completed`. What is a likely cause?","options":["The API replicas are set to 1","The deploy manifest was linted with `-l`","`concurrency_policy` is `Forbid`","`schedule.end_on` passed. An expired schedule stops silently"],"answer":3,"explain":"The docs say to set `end_on` one or two years in the future, because an expired schedule stops silently with no error. `Forbid` is always rendered and is normal.","source":"https://v2.dataos.info/build/productize/git-and-deploy"},{"q":"Your Operator uses separate dev, stg and prod tenants. What is the correct way for `orders-analytics` to reach production?","options":["Fork the repository per environment and edit connection strings in each fork","Hotfix directly in prod, then backport to dev","Deploy the same tagged Git ref to each tenant in turn, letting each tenant supply its Depots, Compute and Secrets","Copy the rendered deploy YAML from dev and edit it for prod"],"answer":2,"explain":"Promotion deploys the same ref forward. The configuration that each tenant resolves changes, never the code. Promote on green. Do not hotfix or fork.","source":"https://v2.dataos.info/operate/data-developer/deploy-and-promote"}]},{"id":"i7","title":"Programmatic and AI consumption","duration":"2.5 hours","objectives":["Call Data Product APIs with a Bearer token using Postman, the Python SDK and the TypeScript SDK","Query semantic models with GraphQL, page large Semantic REST results, and transpile semantic queries to native SQL","Register data applications with `app` and `link` resources that link to a Data Product","Connect MCP clients and agent frameworks to Data Product MCP and explain how governance applies"],"lessons":[{"title":"Data Product APIs and SDKs","body":"### When to use the APIs\n\nIf an application, script or automation needs governed access **outside** BI tools and SQL clients, use Data Product APIs. Every deployed Vulcan product exposes API groups for GraphQL, data (semantic and raw query), metadata, activity and quality. On a product page, **Activate → APIs** opens three cards:\n\n- The **Postman collection**\n- The in-product **APIs documentation**, with the base URL, request bodies and live response samples for each endpoint\n- **SDK** links for Python and TypeScript\n\nBefore you automate anything, do these steps:\n\n1. Generate a DataOS API token.\n2. If you plan to query data, make sure that the product exposes semantic models.\n3. Make sure that the fields that you need exist. Use Studio, or find them through the metadata endpoints.\n\n### Base URL and authentication\n\nAll groups share one product base URL, and every data call uses a Bearer token:\n\n```\nhttps://<instance-url>/vulcan/tenants/<tenant>/data-products/<tenant>-<data-product>/\n```\n\n```http\nAuthorization: Bearer <your-token>\n```\n\nThe API reference splits this URL into two variables. One is the product root, where the unauthenticated health probes such as `/livez` and `/readyz` are. The other is the versioned API under `/api/v1`:\n\n```bash\nexport PRODUCT_BASE_URL=\"https://<DATAOS_FQDN>/vulcan/tenants/<TENANT_ID>/data-products/<TENANT_ID>-<RESOURCE_NAME>\"\nexport API_BASE_URL=\"$PRODUCT_BASE_URL/api/v1\"\nexport DATAOS_TOKEN=\"<dataos-access-token>\"\n```\n\n> **Warning:** API tokens are secrets. Keep them out of source code. Inject them through environment variables or a secret store.\n\n### The Postman collection\n\nDownload it from **Activate → APIs → Postman collection**. It imports with grouped folders: Health, Metadata, Exports, Data Quality, Plans, Runs, Semantic REST, Semantic SQL and Semantic GraphQL. Set two values. Set `baseUrl` in the Variables tab of the collection, with the value from **Connect → APIs**. Set `token` as a Bearer token in the Authorization tab. Start with **Health → Liveness probe** to make sure that the base URL works. Then run the requests that you need.\n\n### The asynchronous query pattern\n\nSemantic SQL and Semantic REST queries are **asynchronous**. You submit the query, poll the statement, and then fetch the result.\n\n1. `POST $API_BASE_URL/query/semantic/sql` (body `{\"sql\": \"...\"}`) or `.../query/semantic/rest` (body `{\"query\": {...}}`) returns a statement `id` and a status such as `QUEUED`.\n2. `GET $API_BASE_URL/query/statement/<statement-id>` until the status leaves `ACCEPTED`, `QUEUED` or `IN_PROGRESS`.\n3. `GET $API_BASE_URL/query/statement/<statement-id>/result?format=json` (or `format=parquet`).\n\nGraphQL is the exception. It returns data and execution metadata in one response.\n\n### Python SDK\n\nBoth SDKs wrap the API groups in a single `VulcanClient`. The client builds the base URL for you:\n\n```\nhttps://{fqdn}/vulcan/tenants/{tenant}/data-products/{tenant}-{dp_name}/api/v1\n```\n\nInstall the wheel that your platform distributes (Python 3.9+). Then create a client:\n\n```python\nfrom vulcan_sdk import VulcanClient\n\nclient = VulcanClient(\n    fqdn=\"example.dataos.io\",\n    dp_name=\"b2b_saas\",\n    access_token=\"<your-dataos-api-token>\",\n    tenant=\"public\",\n)\n```\n\nThe constructor has two optional options: `timeout` (default `30.0` seconds) and `verify_ssl` (default `True`). The groups are `client.metadata`, `client.query`, `client.activity`, `client.dq`, `client.perspectives`, `client.notifications` and `client.followers`.\n\nPick the query method that matches the layer that you want:\n\n| Goal | Python | TypeScript |\n| --- | --- | --- |\n| Measures and dimensions | `client.query.submit_semantic_rest(query={...})` | `client.query.submitSemanticRest({ query: {...} })` |\n| Semantic SQL | `client.query.submit_semantic_sql(\"SELECT ...\")` | `client.query.submitSemanticSQL({ sql: \"SELECT ...\" })` |\n| Raw SQL on physical tables | `client.query.submit_statement(sql)` | `client.query.submitStatement({ sql: \"SELECT ...\" })` |\n| A named metric | `client.query.get_metric(name, ...)` / `post_metric(name, body=...)` | `client.query.getMetric(...)` / `postMetric(...)` |\n\nThen poll and fetch:\n\n```python\nimport time\n\nwhile stmt.status.upper() not in {\"SUCCESS\", \"SUCCEEDED\", \"FAILED\", \"CANCELLED\"}:\n    time.sleep(2)\n    stmt = client.query.get_statement(stmt.id)\n\nresult = client.query.get_statement_result(stmt.id)\nprint(result.cols)\nfor row in result.rows:\n    print(row)\n```\n\nUse `client.metadata.get_semantic()` to list models and columns before you query. Errors raise `VulcanError`, with `status_code` and `detail`.\n\n### TypeScript SDK\n\nThe TypeScript SDK uses native `fetch` on Node.js 18+. It installs from the distributed `.tgz`, and it takes `fqdn`, `dpName`, `accessToken` and `tenant`. The methods are camelCase (`getStatement`, `getStatementResult`). Errors raise `VulcanAPIError` with `statusCode` and `detail`.\n\n> **Tip:** Raw SQL against physical tables bypasses the governed definitions of the semantic layer. Use semantic SQL, REST or GraphQL instead, so that every app computes \"revenue\" the same way.","sources":["https://v2.dataos.info/consume/activate/apis","https://v2.dataos.info/consume/activate/apis/collection","https://v2.dataos.info/consume/activate/apis/sdk","https://v2.dataos.info/consume/activate/apis/sdk/python-sdk","https://v2.dataos.info/consume/activate/apis/sdk/typescript-sdk","https://v2.dataos.info/references/interfaces/apis/data-product-apis/sdks/python-sdk","https://v2.dataos.info/references/interfaces/apis/data-product-apis/api-reference"]},{"title":"GraphQL, pagination and transpile-only queries","body":"### Semantic GraphQL: exact fields, one response\n\nIf your application already speaks GraphQL, needs only selected measures and dimensions, and wants JSON immediately, use the GraphQL endpoint. Semantic SQL and REST need polling. GraphQL returns the result **and** the execution metadata in the same response. Vulcan still creates a `statement_id`. But if the status is `SUCCESS`, you do not need to poll.\n\n```bash\ncurl --location \\\n  'https://<DATAOS_FQDN>/vulcan/tenants/<DATAOS_TENANT_ID>/data-products/<DATAOS_TENANT_ID>-<resource-name>/api/v1/query/semantic/graphql' \\\n  --header 'Content-Type: application/json' \\\n  --header \"Authorization: Bearer ${DATAOS_TOKEN}\" \\\n  --data '{\n    \"query\": \"query {\\n  table(limit: 10) {\\n    customer_profile {\\n      count\\n      region_id\\n    }\\n  }\\n}\",\n    \"variables\": {}\n  }'\n```\n\nThe response has two parts. **`data`** mirrors the fields that you selected (`table → customer_profile → count, region_id`). **`extensions`** carries the execution metadata:\n\n| Field | What to inspect |\n| --- | --- |\n| `statement_id` | Unique id for this execution |\n| `status` | Must be `SUCCESS` |\n| `strategy` | Whether the query was executed or reused |\n| `fingerprint` | Normalized query identity for matching or reuse |\n| `is_stale` | Whether the result is marked stale |\n| `_links.self`, `_links.result` | Statement and result endpoints |\n\nBefore you process a response, make sure that these conditions are true:\n\n- No top-level `errors` array exists (GraphQL can fail with HTTP 200).\n- The expected object exists under `data`.\n- `extensions.status` is `SUCCESS`.\n- The `is_stale` value is acceptable.\n- Each record has the requested fields.\n\nPass runtime values as **variables**. Do not build query strings:\n\n```json\n{\n  \"query\": \"query CustomerProfile($limit: Int!) {\\n  table(limit: $limit) {\\n    customer_profile {\\n      count\\n      region_id\\n    }\\n  }\\n}\",\n  \"variables\": { \"limit\": 10 }\n}\n```\n\nThe Python SDK also accepts GraphQL through `client.query.submit_semantic_rest(query={}, graphql_body=\"query { ... }\")`. Studio has an Interactive GraphQL Explorer, where you build queries without writing syntax.\n\n### Pagination for more than 50,000 records\n\nIf a Semantic REST result has more than 50,000 records, page through it. Put `limit`, `offset` and a **deterministic** `order` in the POST body:\n\n```bash\ncurl --request POST \\\n  'https://<DATAOS_FQDN>/vulcan/tenants/<DATAOS_TENANT_ID>/data-products/<DATAOS_TENANT_ID>-<resource-name>/api/v1/query/semantic/rest' \\\n  --header 'Content-Type: application/json' \\\n  --header \"Authorization: Bearer ${DATAOS_TOKEN}\" \\\n  --data '{\n    \"query\": {\n      \"measures\": [\"customer_profile.count\"],\n      \"dimensions\": [\"customer_profile.region_id\"],\n      \"order\": { \"customer_profile.region_id\": \"asc\" },\n      \"limit\": 50000,\n      \"offset\": 0,\n      \"timezone\": \"UTC\"\n    }\n  }'\n```\n\nPoll the returned statement id until the status is `SUCCESS`. Fetch the result with `?format=json`. Then send the request again with the **same** `order`, and increase only the `offset` (`0`, `50000`, `100000`, ...). Stop after a batch returns fewer records than `limit`.\n\n| Issue | Resolution |\n| --- | --- |\n| Status `FAILED` | Inspect the `error` field in the statement response |\n| Duplicate or missing records between batches | Keep `order` identical. Change only `offset` |\n| `limit`/`offset` seem ignored | `format=parquet` ignores `limit`, `offset` and `columns` and returns the complete result as one file |\n\nFor large exports, a single Parquet download (`.../result?format=parquet --output result.parquet`) is usually better than many JSON batches.\n\n### Transpile to native warehouse SQL\n\nAdd `transpile_only=true` to the Semantic SQL or REST endpoint to see the native SQL of a semantic query in the warehouse dialect. The query does not run:\n\n```bash\ncurl --location \\\n  'https://<DATAOS_FQDN>/vulcan/tenants/<DATAOS_TENANT_ID>/data-products/<DATAOS_TENANT_ID>-<resource-name>/api/v1/query/semantic/sql?transpile_only=true' \\\n  --header 'Content-Type: application/json' \\\n  --header \"Authorization: Bearer ${DATAOS_TOKEN}\" \\\n  --data '{\n    \"sql\": \"SELECT customer_profile.region_id, MEASURE(customer_profile.count) FROM customer_profile GROUP BY customer_profile.region_id LIMIT 10\"\n  }'\n```\n\n| Standard execution | Transpile-only |\n| --- | --- |\n| Executes the query | Does not execute |\n| Creates a statement id | No statement id |\n| Requires polling | Returns directly |\n| Produces results | Produces native SQL |\n| Can use cached results | Only translates |\n\nUse it to debug translation (filters, joins, aggregations, grouping), to copy the SQL into a warehouse client, or to compare dialects. Locally, `vulcan transpile` does the same against an environment. It also accepts a security context, so you can see how policies rewrite a query.\n\n> **Note:** Vulcan evaluates every one of these paths (GraphQL, REST, SQL and transpile) with the identity of the caller. Thus the policy masks and filters from the Governance module apply.","sources":["https://v2.dataos.info/consume/recipes/query-semantic-model-with-graphql","https://v2.dataos.info/consume/recipes/retrieve-large-result-sets-with-pagination","https://v2.dataos.info/consume/recipes/transpile-semantic-queries-to-native-warehouse-sql","https://v2.dataos.info/references/resources/vulcan/cli"]},{"title":"Data applications: deploy and link","body":"### What a data application is\n\nA data application is an application built on top of a Data Product. It calls the APIs of the product and shows results to a specific team, for example a KPI dashboard or an operational view. It can use any language or framework. DataOS gives you two patterns. Both create a **catalog entry linking the application to its source Data Product**. Then consumers can find and open the application from DataOS, wherever it runs.\n\n| Pattern | Resource type | Use when | You provide |\n| --- | --- | --- | --- |\n| Deploy | `app` | You want DataOS to run it from a container image | Image, command, port and runtime config |\n| Link | `link` | It is already hosted and running elsewhere | The hosted URL |\n\nHow the connection works:\n\n| What | How |\n| --- | --- |\n| API connection at runtime | Environment variables (`VULCAN_BASE_URL`, an auth token) |\n| Catalog relationship | `spec.app.products` or `spec.link.products` |\n\n### Deploying an `app`\n\nThis is a developer task (container image + `dataos-ctl`). The prerequisites include these items:\n\n- The Data Consumer and Data Developer roles\n- Permission to create the resource in the tenant\n- A target compute, a run-as user, a port and an ingress path\n- The product API base URL and a token\n- An image pull Secret for private images\n\nThis manifest is the documented Orders360 Streamlit example, cut down to its structure:\n\n```yaml\nversion: v1alpha\ntype: app\nname: orders360-dashboard\ntitle: Orders360 Dashboard\nowner: iamgroottmdcio\nspec:\n  compute: pacific\n  runAsUser: iamgroottmdcio\n  replicas: 1\n  resources:\n    requests:\n      cpu: 250m\n      memory: 256Mi\n    limits:\n      cpu: 500m\n      memory: 512Mi\n  service:\n    type: python\n    image: dockerkk97/orders360-dashboard:0.0.1\n    imagePullSecret: docker-secret\n    command:\n      - streamlit\n    arguments:\n      - run\n      - app.py\n      - --server.port=8501\n    port: 8501\n    envs:\n      VULCAN_BASE_URL: \"https://<instance-url>/vulcan/tenants/<tenant>/data-products/<tenant>-orders360/api/v1\"\n      VULCAN_AUTH_TOKEN: \"${VULCAN_AUTH_TOKEN}\"\n    http:\n      path: /orders360-dashboard\n      stripPath: false\n      ingress:\n        enabled: true\n        path: /orders360-dashboard\n        stripPath: false\n        appDetailSpec: orders360-dashboard\n  app:\n    domain: sales_operations\n    description: Overview of physical models, semantics, quality, runs, plans, and query usage.\n    owners:\n      - iamgroottmdcio\n    products:\n      - orders360\n    link:\n      title: Open dashboard\n      url: /orders360-dashboard\n    visibility:\n      scope: tenants\n      tenants:\n        - <tenant>\n```\n\nKey rules:\n\n- **Set `spec.app.link.url` as a path** (for example `/orders360-dashboard`), not a full URL. Then the manifest works unchanged across environments. Full URLs still work, but support for them will be removed (September 2026). If you omit the URL, DataOS falls back to `spec.service.http.ingress.path`, then `spec.service.http.path`, then `/`.\n- **Visibility** (`spec.app.visibility.scope`) is `global`, `tenants` (with a `tenants` list) or `pattern` (a glob such as `\"eng-*\"`). If you omit it, the App is visible only to its own tenant.\n- For a **public image**, omit `imagePullSecret`. To expose a path without network authorization, set `noNetworkAuthorization: true` under `spec.service.http`.\n- If the app writes to protected folders such as `/var/cache` or `/run`, declare them under `workingDirs`. In July 2026 DataOS tightened the default permissions.\n\nApply with `dataos-ctl resource apply -f app.yaml`. If the app uses network authorization, an administrator also configures path-ingress access for the path of the app (`get-path-ingress`, `put-path-ingress`, ...).\n\n**Troubleshooting:**\n\n- If the image pull fails, add or fix `imagePullSecret`.\n- If the app opens on the wrong path, make `http.path`, `ingress.path` and `app.link.url` agree.\n- If the catalog shows no product relationship, fix `spec.app.products`.\n- If API calls fail, examine `VULCAN_BASE_URL` and `VULCAN_AUTH_TOKEN` in `spec.service.envs`.\n\n### Linking an external application\n\nIf the app is already hosted, register it with a `link` resource. You need `roles:id:data-developer` in your tags. To see your tags, run `dataos-ctl user get`.\n\n```yaml\nversion: v1alpha\ntype: link\nname: <link-resource-name>\ntitle: <display-title>\ndescription: <short-description>\nowner: <dataos-username>\nspec:\n  link:\n    domain: <domain-name>\n    description: <app-description>\n    owners:\n      - <dataos-username>\n    products:\n      - <data-product-name>\n    references:\n      - title: Data Product\n        url: <data-product-url>\n    title: Open application\n    url: <hosted-app-url>\n    visibility:\n      scope: tenants\n      tenants:\n        - <tenant>\n```\n\nThe required fields are `version`, `type`, `name`, `owner`, `spec.link.url`, `spec.link.domain` and `spec.link.owners`. `spec.link.products` creates the catalog relationship, and `spec.link.icon` takes a base64-encoded image. Apply with `dataos-ctl resource apply -f app-link.yaml`. Then make sure that the link opens and that the product appears under **Products** on its catalog entry.","sources":["https://v2.dataos.info/consume/activate/apis/data-application","https://v2.dataos.info/consume/activate/apis/data-application/deploy","https://v2.dataos.info/consume/activate/apis/data-application/link","https://v2.dataos.info/releasenotes/september-2026","https://v2.dataos.info/releasenotes/july-2026"]},{"title":"Connecting MCP clients and agent frameworks","body":"### Data Product MCP\n\n**Data Product MCP** connects AI assistants and agent frameworks that are compatible with Model Context Protocol (MCP) to your Data Products. After the connection, users discover products, ask business questions, inspect health and lineage, and find owners in natural language. The assistant never gets an unrestricted database connection. It calls MCP tools, and these tools route through Data Product APIs, authorization, semantic definitions, quality checks, lineage and ownership metadata.\n\n| Need | What MCP does |\n| --- | --- |\n| Find | Locate products by topic, domain, owner, metric or question |\n| Trust | Review semantic fields, quality, run history, lineage, profile, limitations and owner |\n| Ask | Query governed metrics and dimensions through the semantic layer |\n| Act | Use failure details and owner context to follow up |\n\n### Governance and trust\n\nEvery MCP tool call runs through the **same policy enforcement point (PEP)** as the rest of the platform, with the credentials of the user. The assistant sees only the products, columns and values that the user can access. A masked column comes back masked. An inaccessible product never appears in discovery, lineage, profile or query responses. By default, results include a **trust summary** that flags quality or pipeline issues. Results also link to the source dataset, and they tell you about output that the row limit capped. Results return a clear limitation, and they do not invent a measure.\n\nAccess works as for any platform service. You need the `mcp-tool-read` grant under the `use-mcp-service` policy use case, or a tenant role such as `data_consumer` or `data_developer`. Since August 2026 all platform users get MCP access by default. If you get authentication errors, ask your administrator for one of these grants.\n\nYour earlier modules help here. An agent routes a question to the right measure because of these items: `ai_context` instructions, synonyms and examples on semantic models, clear metric descriptions and tags, and an honest `usage.yaml`.\n\n### Endpoints and auth methods\n\nEvery client connects over **streamable HTTP**. The endpoint depends on the auth method:\n\n| Method | Endpoint |\n| --- | --- |\n| OAuth (platform sign-in) | `https://<instance-url>/mcp/api/v1` |\n| API token | `https://<instance-url>/dataproduct-mcp/api/v1` with header `apikey: <API_TOKEN>` |\n\nOAuth avoids long-lived tokens, and organizations use it to roll out MCP to all users. API tokens are for clients or environments where OAuth is not available.\n\n### Clients\n\n**Claude Code**: add the server for your user, so that it is available across projects:\n\n```bash\nclaude mcp add --scope user --transport http DataProduct-MCP \\\n  https://<instance-url>/dataproduct-mcp/api/v1 --header \"apikey: <API_TOKEN>\"\n```\n\nWithout the `--header`, the same command uses OAuth. Restart Claude Code, run `/mcp`, select **DataProduct-MCP** and authorize.\n\n**Claude Desktop / claude.ai**: add a custom connector named `DataProduct-MCP` with the MCP server URL. On Team and Enterprise plans, an admin adds it once under **Organization settings → Connectors**. The admin sets Authentication to **Sign in now**, sets the OAuth client to **Use Claude's published identity**, and adds no request headers. Each member connects with their own DataOS sign-in, so the admin never shares their access. On Free, Pro or Max plans, you add it yourself under **Customize → Connectors**. If you cannot add custom connectors, use `mcp-remote` with an API token in the Desktop configuration file.\n\n**Cursor**: use **Open in Cursor** from DataOS, which gives a pre-filled `streamableHttp` server. Or add the server manually under **Tools & MCP**:\n\n```json\n{\n  \"mcpServers\": {\n    \"DataProduct-MCP\": {\n      \"url\": \"https://<instance-url>/dataproduct-mcp/api/v1\",\n      \"headers\": {\n        \"apikey\": \"<API_TOKEN>\"\n      }\n    }\n  }\n}\n```\n\n**Copilot in VS Code**: use a project-level `.vscode/mcp.json` with `\"servers\"`, `\"type\": \"http\"` and the URL. For token authentication, also add the `apikey` header. Reload the window. Because this file is at the project root, a user-level configuration or an environment variable is better. If the file holds a token, **add it to `.gitignore`**.\n\n**Custom clients**: use the server name `DataProduct-MCP`, the transport Streamable HTTP, and the URL for your auth method. For tokens, use the header key `apikey`. Copy the values from **Home → Connect to Data Product MCP**.\n\n### Agent frameworks\n\nFrameworks get the same tool surface and the same enforcement. All of them use `https://<instance-url>/dataproduct-mcp/api/v1` with the header `apikey`:\n\n| Framework | Package |\n| --- | --- |\n| LangChain (Python 3.9+) | `pip install langchain-mcp-adapters`, HTTP transport. Make sure that `get_tools()` returns tools |\n| Vercel AI SDK (Node 18+) | `npm install @ai-sdk/mcp ai @ai-sdk/openai` |\n| AgentScope | Register the tools in an AgentScope toolkit |\n| Custom | Most MCP libraries accept `{\"transport\": \"http\", \"url\": ..., \"headers\": {\"apikey\": ...}}` |\n\nUse prompts at the application level to keep citation discipline. Tell the agent to show the **metric, source product, filters and time window** for every analytical answer. Pass tokens through environment
