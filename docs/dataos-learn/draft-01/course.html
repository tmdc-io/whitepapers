an audit\n```\n\nAll assertions on the models must pass. If one fails, Vulcan prints sample failing rows. Correct the seed data and run again.\n\n> **Tip:** Break it on purpose. Change one `unit_price` in `raw_order_items.csv` to `-1` and run `vulcan plan` again. The `forall(criteria := (unit_price >= 0))` assertion stops the run. The fastest way to trust a gate is to see it fire.\n\n### What you have, and what you do not\n\nYou now have a complete Data Product on your machine. It has raw inputs, a tested transform, blocking quality gates, a semantic model, and one defined metric. After deployment, REST, GraphQL, and MySQL wire-protocol APIs can serve it. You wrote no API code and used no cloud.\n\nYou do not have a deployment yet. A deployment needs the parts from module b1: a Git repo, the `deployment:` block, and grants for Compute and the run-as user. The Intermediate level covers deployment. At deploy time, DataOS creates three runtime components for the product:\n\n- A `plan` component, which runs `vulcan plan --auto-apply`.\n- A `run` component, which runs `vulcan run` on the schedule.\n- An `api` component, which serves the endpoints.","sources":["https://v2.dataos.info/build/get-started/quickstart","https://v2.dataos.info/build/productize/assets/semantic-model","https://v2.dataos.info/build/productize/assets/metrics","https://v2.dataos.info/build/productize/git-and-deploy","https://v2.dataos.info/build/productize/unit-test"]}],"lab":{"title":"Lab: Daily revenue by region, end to end on your laptop","goal":"A local Vulcan project with three seed models, one view, a semantic model, and the `daily_revenue_by_region` metric, with all assertions passing.","duration":"45 min","prereqs":["Module b1 lab complete: activated `.venv` with Vulcan[postgres] and the `warehouse` Postgres container running on port 5433"],"steps":["**Set a placeholder tenant and scaffold.**\n\n```bash\nexport DATAOS_TENANT_ID=local\nvulcan init\n```\n\nChoose `DEFAULT` for the project type and `postgres` for the engine.","**Point `config.yaml` at the local engine.** Replace its contents with:\n\n```yaml\nname: workspace\ndescription: Local quickstart product tracking daily revenue by region.\n\nusers:\n  - username: vulcan\n    type: OWNER\n\ndefault_gateway: postgres\ngateways:\n  postgres:\n    connection:\n      type: postgres\n      host: localhost\n      port: 5433\n      database: warehouse\n      user: vulcan\n      password: vulcan\n    state_connection:\n      type: duckdb\n      database: ./.state/vulcan.db\nmodel_defaults:\n  dialect: postgres\n  start: 2025-01-01\n  cron: '@daily'\n```\n\nThen run `vulcan info` and wait for `Data warehouse connection succeeded`.","**Add the seed CSVs** under `seeds/`:\n\n`seeds/raw_customers.csv`\n```csv\ncustomer_id,name,email,region\n1,Ava Stone,ava@example.com,North\n2,Ben Cole,ben@example.com,South\n3,Cara Diaz,cara@example.com,East\n4,Dan Frost,dan@example.com,West\n```\n\n`seeds/raw_orders.csv`\n```csv\norder_id,customer_id,order_date\n101,1,2025-01-03\n102,2,2025-01-03\n103,3,2025-01-04\n104,4,2025-01-05\n105,1,2025-01-06\n```\n\n`seeds/raw_order_items.csv`\n```csv\norder_id,item_id,product_id,quantity,unit_price\n101,1,SKU-1,2,19.99\n101,2,SKU-2,1,5.00\n102,1,SKU-1,3,19.99\n103,1,SKU-3,1,49.50\n104,1,SKU-2,5,5.00\n105,1,SKU-3,2,49.50\n```","**Create the seed models** under `models/`:\n\n`models/raw_customers.sql`\n```sql\nMODEL (\n  name workspace.raw_customers,\n  kind SEED (path '../seeds/raw_customers.csv'),\n  columns (customer_id INTEGER, name TEXT, email TEXT, region TEXT),\n  grains (customer_id),\n  assertions (\n    not_null(columns := (customer_id, name, email, region)),\n  ),\n);\n```\n\n`models/raw_orders.sql`\n```sql\nMODEL (\n  name workspace.raw_orders,\n  kind SEED (path '../seeds/raw_orders.csv'),\n  columns (order_id INTEGER, customer_id INTEGER, order_date DATE),\n  grains (order_id),\n  references customer_id,\n  assertions (\n    not_null(columns := (order_id, customer_id, order_date)),\n  ),\n);\n```\n\n`models/raw_order_items.sql`\n```sql\nMODEL (\n  name workspace.raw_order_items,\n  kind SEED (path '../seeds/raw_order_items.csv'),\n  columns (\n    order_id INTEGER, item_id INTEGER, product_id TEXT,\n    quantity INTEGER, unit_price DOUBLE PRECISION\n  ),\n  grains (order_id, item_id),\n  references order_id,\n  assertions (\n    not_null(columns := (order_id, item_id, product_id, quantity, unit_price)),\n    forall(criteria := (quantity > 0)),\n    forall(criteria := (unit_price >= 0)),\n  ),\n);\n```","**Create the transform** `models/order_lines_enriched.sql`:\n\n```sql\nMODEL (\n  name workspace.order_lines_enriched,\n  kind VIEW,\n  grains (order_id, item_id),\n  assertions (\n    not_null(columns := (order_id, item_id, customer_id, order_date, region, line_revenue)),\n    forall(criteria := (line_revenue >= 0)),\n  ),\n);\n\nSELECT\n  i.order_id, i.item_id, i.product_id, i.quantity, i.unit_price,\n  (i.quantity * i.unit_price)::DOUBLE PRECISION AS line_revenue,\n  o.customer_id, o.order_date,\n  c.name AS customer_name, c.email AS customer_email, c.region\nFROM workspace.raw_order_items AS i\nINNER JOIN workspace.raw_orders AS o ON i.order_id = o.order_id\nINNER JOIN workspace.raw_customers AS c ON o.customer_id = c.customer_id;\n```","**Add the semantic model** `models/semantics/order_lines.yml`:\n\n```yaml\nkind: semantic\nname: order_lines\ndepends_on: workspace.order_lines_enriched\ndescription: Order lines enriched with customer region and line revenue.\ndimensions:\n  - order_date\n  - region\nmeasures:\n  - name: total_line_revenue\n    type: sum\n    expression: \"{order_lines.line_revenue}\"\n    description: Sum of line-level revenue.\n```","**Add the metric** `models/metrics/daily_revenue_by_region.yml`:\n\n```yaml\nkind: metric\nname: daily_revenue_by_region\nmeasure: order_lines.total_line_revenue\nts: order_lines.order_date\ngranularity: day\ndimensions:\n  - order_lines.region\ndescription: Daily gross revenue from order lines, broken out by customer region.\n```","**Plan and apply.** Run `vulcan plan`. Review the listed models. At `Apply the plan? [y/n]`, answer `y`.","**Audit.** Run `vulcan audit`. Make sure that every assertion passes.","**Stretch: trip a gate.** Change one `unit_price` in `raw_order_items.csv` to `-1`. Run `vulcan plan` again. Look at the failure and the sample rows. Put back the original value. Run the plan again until it is clean."],"verify":"- `vulcan plan` lists the three seed models, the `order_lines_enriched` view, the `order_lines` semantic model, and the `daily_revenue_by_region` metric. It applies with no errors.\n- `vulcan audit` reports that all assertions pass.\n- In the stretch step, a negative `unit_price` stops the run and shows failing sample rows.","sources":["https://v2.dataos.info/build/get-started/quickstart"]},"takeaways":["The build chain is one-way: Inputs + Seeds -> Data model -> Semantic model -> Metrics.","A SEED model loads a CSV and declares columns, grains, references, and assertions.","Assertions block bad data at materialization. DQ checks give a warning and do not block. Unit tests test logic against fixtures.","A semantic model maps columns to dimensions and measures. It powers REST, GraphQL, and MySQL APIs with no API code.","A metric is a semantic measure plus a time column (`ts`), a granularity, and dimensions. It gives one definition to every consumer.","`vulcan plan` shows changes and applies them. `vulcan audit` runs the quality gates. Neither command needs a DataOS deployment."],"quiz":[{"q":"In the Quickstart `config.yaml`, what does `state_connection` of type `duckdb` store?","options":["The seed CSV files","The materialized models","Vulcan's plan and interval state, locally, so no second database is needed","The API tokens used to deploy"],"answer":2,"explain":"Models materialize in the `connection` (Postgres). Vulcan keeps its own state in the `state_connection`. Here, that is a local DuckDB file at `./.state/vulcan.db`.","source":"https://v2.dataos.info/build/get-started/quickstart"},{"q":"A row in `raw_order_items.csv` has `unit_price` of `-5`. What happens when you run `vulcan plan` and apply?","options":["The row is silently dropped","The `forall(criteria := (unit_price >= 0))` assertion fails and the model does not materialize","A warning is logged but the model materializes","The semantic model excludes the row"],"answer":1,"explain":"Assertions are the blocking layer: any failing row stops the run. A non-blocking warning is the behavior of a DQ check, not of an assertion.","source":"https://v2.dataos.info/build/productize/assertions"},{"q":"What must a metric definition reference?","options":["Raw columns of the view, such as `line_revenue`","A seed CSV path","A Depot UDL","A semantic model's measure and time dimension, such as `order_lines.total_line_revenue` and `order_lines.order_date`"],"answer":3,"explain":"The metric uses the semantic model, not raw columns. That keeps every consumer on the same definition.","source":"https://v2.dataos.info/build/get-started/quickstart"},{"q":"You run Vulcan locally with no DataOS access, and it reports a missing tenant. What is the documented fix?","options":["Run `dataos-ctl login` first","Create an API token","Re-run `vulcan init` with a different project type","Export a placeholder such as `export DATAOS_TENANT_ID=local`, or set `tenant` in `config.yaml`"],"answer":3,"explain":"Vulcan always requires a tenant, even locally. A placeholder value is enough for the Quickstart. You do not need an API token or a login.","source":"https://v2.dataos.info/build/get-started/quickstart"},{"q":"Which statement about the semantic model `order_lines` is correct?","options":["It exposes `order_date` and `region` as dimensions and `total_line_revenue` as a sum measure, and drives the auto-generated APIs","It must be written as a SQL `MODEL` block","It replaces the `order_lines_enriched` view in the warehouse","It is only used by BI tools"],"answer":0,"explain":"Semantic models are YAML (`kind: semantic`) wrappers over a physical model. They map columns to dimensions and measures and power REST, GraphQL, and MySQL wire-protocol APIs.","source":"https://v2.dataos.info/build/get-started/quickstart"}]},{"id":"b3","title":"Understand your data","duration":"70 min","objectives":["Look for an existing Depot before you create a new connection","Create a PostgreSQL Secret and Depot and address data through a UDL with a purpose","Configure a Nilus metadata pipeline in shallow or deep mode with a sensible scope","Inspect a dataset's Overview, Lineage, and Queries tabs in Datasets","Test the actual values in Workbench with the correct Secret purpose"],"lessons":[{"title":"Connect sources with Secrets and Depots","body":"**Understand** is the first stage of a build. It answers one question: *is this the right data?* Before you write a model, you find out what you already have, whether it is trustworthy, and what is missing. Understand has three tasks, in this order: **connect sources**, **scan metadata** (only for a source with no metadata in DataOS yet), and **explore data**. At the end, you go to Productize, or you Move data in first, or you continue to look.\n\n### A data connection is two Resources\n\n| Resource | Role |\n| --- | --- |\n| **Secret** | Stores credentials (username, password, keys, certificates) in an encrypted vault, so they are never in manifests or code |\n| **Depot** | Registers the external system in DataOS, holds the connection details, and references the Secret |\n\nA Depot gives DataOS access to data **without moving or duplicating it**. To ingest or copy data, you use a Stack such as Nilus.\n\n### Step 1: check before you create\n\nTeams share Depots. Possibly, a connection to your source is already live:\n\n```bash\ndataos-ctl resource get -t depot -a\n```\n\n`-a` lists Resources for every owner, not only for you. If a Depot for your source is `active`, note its name and use it. You can also look for the source in the **Datasets** tree in the UI. Do not create a duplicate.\n\nTo create Secrets and Depots, you need a suitable role (Tenant Admin, Data Admin, or Data Developer). To see your roles, run `dataos-ctl user get`. Without the role, apply fails with a permission error such as `forbidden: user does not have required role`.\n\n### Step 2: the Secret\n\nFor PostgreSQL, the Secret is a `key-value` pair of username and password:\n\n```yaml\nname: ${{postgres-secret-name}}\nversion: v2alpha\ntype: secret\ntags:\n  - ${{tag-1}}\n  - ${{tag-2}}\ndescription: \"PostgreSQL read/write credentials\"\nlayer: user\nsecret:\n  type: key-value\n  data:\n    username: ${{postgres-username}}\n    password: ${{postgres-password}}\n```\n\nFor file-based credentials (a BigQuery JSON key, a Snowflake RSA private key), use `secret.files` instead of `secret.data`. A Secret name must start with a lowercase letter and end with a lowercase letter or digit. The name must be shorter than 60 characters. For example, `test-secret-` is not valid.\n\n> **Warning:** The `secret.data` block is plaintext. Never commit a Secret manifest. After you apply it, delete the local file or move it out of your repo.\n\n### Step 3: the Depot\n\n```yaml\nname: ${{depotname}}\nversion: v2alpha\ntype: depot\ntags:\n  - PostgreSQL\n  - depot\n  - rdbms\ndescription: \"PostgreSQL relational database depot for data storage and querying\"\nspec:\n  type: postgresql\n  spec:\n    host: ${{postgres-host}} #mandatory\n    port: 5432 #mandatory\n    database: ${{postgres-database}} #mandatory\n    subprotocol: \"postgresql\" #mandatory\n  secrets:\n    - id: \"${{tenant-id}}:${{postgres-secret-name}}\"\n      purpose: scan\n    - id: \"${{tenant-id}}:${{postgres-secret-name}}\"\n      purpose: query\n    - id: \"${{tenant-id}}:${{postgres-secret-name}}\"\n      purpose: rw\n```\n\nThe outer `spec.type` names the Depot type. The inner `spec.spec` holds the connection fields for the source. The `secrets` list connects the Depot to one or more Secrets. Each Secret has a **purpose** label. Common conventions:\n\n| Purpose | Typical use |\n| --- | --- |\n| `rw` | Read-write access, where necessary and permitted |\n| `scan` | Metadata scanning and schema discovery |\n| `query` | Querying and exploring only |\n| `full` / `masked` | A credential with complete access / a credential that masks some data |\n\nYou can use one Secret for every purpose, or use different Secrets. The roles in the source system set what a credential can do. Purpose values are lowercase alphanumerics with underscores, and each value is unique in the Depot.\n\n> **Note:** Depot names have stricter rules than other Resources: **alphanumeric only**, up to 63 characters. `postgresorders` is valid. `postgres-orders` is not valid.\n\nApply the Secret first, then the Depot. At apply time, DataOS makes sure that the Secret reference is valid:\n\n```bash\ndataos-ctl resource apply -f ${{path-to-secret.yaml}}\ndataos-ctl resource apply -f ${{path-to-depot.yaml}}\ndataos-ctl resource get -t depot\n```\n\nA `STATUS` of `active` means that the Depot Service registered the Depot. If the status is different, inspect the Depot with `dataos-ctl resource get -t depot -n ${{depot-name}} --details`. The usual causes are wrong credentials, a wrong host, port, or database, or a network restriction.\n\n### Step 4: address data with a UDL\n\nAfter the Depot is active, you address it through a **Uniform Data Link**:\n\n```\ndataos://[depot]/[source-path]?purpose=<value>\n```\n\nFor a PostgreSQL Depot, `public/orders` names the `public` schema and the `orders` table. The optional `purpose` parameter does not change the dataset. It selects which purpose-labeled Secret the Depot Service resolves. Every tool in DataOS uses this address, so no credentials appear at the point of use.\n\nTo delete, use the reverse order. You cannot delete a Secret while a Depot depends on it, so delete the Depot first.","sources":["https://v2.dataos.info/build/understand/overview","https://v2.dataos.info/build/understand/connect-sources","https://v2.dataos.info/references/resources/secret/data-sources/postgresql","https://v2.dataos.info/references/resources/depot/supported-sources/postgresql","https://v2.dataos.info/references/resources/depot","https://v2.dataos.info/references/resources/secret/manifest-configuration"]},{"title":"Scan metadata with a Nilus metadata pipeline","body":"A connected source is reachable. But if its tables do not appear in **Datasets**, nobody can explore or trust them. A **metadata scan** corrects that. It collects technical and business context from a connected system and registers it for discovery. It does not copy or move the data.\n\nIf a source is connected but its tables do not show up, run a scan. If the metadata is already in DataOS, skip the scan and go directly to exploration.\n\n### One pipeline, several stages\n\nIn DataOS v2, a **Nilus metadata pipeline** does the scan. It is a single Resource of `type: nilus` with `spec.type: metadata`. It runs a small DAG of stages:\n\n| Stage | What it lands in the catalog |\n| --- | --- |\n| `metadata` | Database, schema, table, and column entities. These are the foundation for everything else |\n| `lineage` | Column-level lineage parsed from query history |\n| `profiler` | Statistics for each column (null counts, distinct counts, min/max, distributions) |\n| `classification` | Auto-classification tags on columns, such as PII heuristics |\n| `usage` | Query history and usage frequency |\n\nMetadata pipelines support six sources: Snowflake, Databricks, DataOS Lakehouse, PostgreSQL, MongoDB, and Microsoft Fabric. The available stages depend on the source.\n\n### Choose a mode\n\n`mode` is **required** on every metadata pipeline:\n\n| Mode | Stages | Use it for |\n| --- | --- | --- |\n| `shallow` | `metadata` + `lineage` | An inventory and lineage that stay current. It is lighter, so it can run often |\n| `deep` | adds `profiler`, `classification`, `usage` | The full enrichment. It is heavier, so it runs less often |\n\n`deep` is a strict superset of `shallow`. A common pattern is a frequent `shallow` pipeline plus a less frequent `deep` pipeline.\n\n### A PostgreSQL example\n\n```yaml\nname: postgresql-metadata\nversion: v1alpha\ntype: nilus\ntags: [nilus, metadata]\ndescription: Catalog PostgreSQL metadata, schema, lineage, and query usage\nspec:\n  type: metadata\n  mode: deep\n  compute: comet-compute\n  schedule:\n    crons:\n      - \"0 */6 * * *\"\n    concurrencyPolicy: Forbid\n  source:\n    address: dataos://postgresmetadatadepot?purpose=rw\n    options:\n      service_type: postgres\n      database_filter:\n        includes: [\"warehouse\"]\n      schema_filter:\n        includes: [\"^public$\", \"^analytics_\"]\n        excludes: [\"^pg_\", \"^information_schema$\"]\n      table_filter:\n        excludes: [\"^_tmp\", \"^audit_\"]\n      query_log_duration: 3\n      result_limit: 10000\n      threads: 4\n```\n\nNote these points:\n\n- **`version: v1alpha`** is the current Nilus resource shape. Not every Resource type uses `v2alpha`. Always copy the version from the docs for that type.\n- **`compute`** is the Compute profile that each DAG node runs on. The reference template uses `comet-compute`. Use a Compute profile that you have a grant for.\n- **`schedule`** is optional. Without it, you must start the pipeline manually.\n- **`source.address`** is a Depot UDL with a purpose, so credentials stay out of the pipeline file. A direct connector URI is allowed only in one case: no Depot exists, and your team approved the URI.\n- **Filters** keep the scan scoped. A scan of a large warehouse with no filters takes a long time. PostgreSQL changes unquoted identifiers to lower case, so write lower-case patterns.\n- **`query_log_duration`** (days) and **`result_limit`** (rows) limit how much query history goes into lineage and usage. Start with small values.\n\n### Run and monitor\n\n```bash\ndataos-ctl resource apply -f ./postgresql-metadata.yaml -w <your-workspace>\ndataos-ctl resource get -t nilus -n postgresql-metadata -w <your-workspace>\n```\n\nA Nilus pipeline executes code, so it is a **runnable** Resource. It has runtime state and logs. You inspect them with the CLI in module b4.\n\n### Verify in Datasets\n\nWhen the assets appear in the places where people look for them, the scan is complete:\n\n| Where | What to look for |\n| --- | --- |\n| Source list | The connected source appears |\n| Dataset list | Tables and views from the scoped source are visible |\n| Overview | Columns, tags, descriptions, and update information appear |\n| Lineage | Table or column lineage appears where query history supports it |\n| Queries | Query activity appears after usage extraction ran |\n\nIf something is missing, review the scope, the connection, the `service_type`, and the permissions. Then run the pipeline again.\n\n> **Tip:** Metadata scanning usually needs three things: Compute, a Depot with a `scan` or `rw` purpose, and source permission to read catalog views and query history. If you are a beginner, possibly a Data Admin already runs these pipelines. Look in Datasets before you write your own pipeline.","sources":["https://v2.dataos.info/build/understand/scan-metadata","https://v2.dataos.info/references/resources/nilus/metadata-pipelines/metadata-sources/postgresql","https://v2.dataos.info/references/resources/overview"]},{"title":"Explore datasets and query values in Workbench","body":"Metadata tells you what a dataset *claims* to be. The values tell you what it *actually* is. To explore, you examine both before you commit a source to a model. Do this in two places and in a specific order: **Datasets** first, then **Workbench**.\n\n### Datasets: the catalog view\n\n```\nDataOS Home -> Datasets -> Select source -> Search or filter -> Open dataset\n```\n\nOpen **Datasets** from the left navigation. The source tree lists connected systems (Snowflake, PostgreSQL, Iceberg, and more). Select one, then search by name, schema, or keyword. You can hide or show datasets that are already productized. To decide which datasets to open, scan the name, source path, tags, owner, and productized indicator.\n\n> **Note:** The list can include datasets that other Tenants on the same Instance ingested. **Visibility is not access.** To open a dataset does not give you the Depot, Secret, or access policy that you need to read its data.\n\nA dataset page has three tabs:\n\n| Tab | Shows |\n| --- | --- |\n| **Overview** | Columns, tags, descriptions, version, update time, productization status |\n| **Lineage** | Upstream and downstream flow at table or column level |\n| **Queries** | Recent query activity: submission time, who ran it, frequency |\n\nOn **Overview**, go column by column and ask: *can I safely use this column in a model, metric, or contract?* A primary-key indicator marks a join key. The data type tells you what casting and validation you need. **Last updated** tells you whether the metadata is current.\n\nOn **Lineage**, use the **Columns** toggle to switch between table-level flow and column-level dependencies. Column lineage shows which inputs feed an output. It also shows which downstream outputs a change affects. That is the difference between general discovery and impact analysis.\n\nOn **Queries**, active use and named users are trust signals. They also tell you who has working knowledge of the data.\n\n> **Tip:** If a dataset shows \"Productized into 1 data product\", inspect that Data Product before you build a new one. Possibly, it already solves your need.\n\n### Decide what to do next\n\n| Decision | Choose it when |\n| --- | --- |\n| Productize the dataset | It has the fields, quality, and lineage you need |\n| Explore the values | Metadata looks right but samples need validation |\n| Inspect a related Data Product | It is already productized |\n| Contact the owner | Meaning, access, or reliability is unclear |\n| Move data in | The data you need is missing |\n| Avoid the dataset | It is incomplete, stale, unowned, or unsuitable |\n\n### Workbench: the query view\n\nIn Workbench, you connect to a source, run SQL, and browse schemas and tables in one workspace.\n\n1. Open **Workbench** from the left navigation. The home page shows saved benches and drafts.\n2. Click **New bench**.\n3. Choose the **data source** (a Depot) and then the **Secret** to connect with.\n\nWorkbench asks for both because a Depot can have several Secrets for different permission contexts. Workbench does not guess. Select the purpose that matches your intent. For exploration, this is usually `query`.\n\n> **Note:** At share time, the Secret that you selected for the bench sets the permission context that others inherit. As owner, you can choose a masked, read-only Secret. Then colleagues can explore and not see sensitive fields.\n\nAfter the bench opens, the left panel lists schemas, tables, and columns. Before you write SQL, look for identifiers, categorical fields, possible measures, and fields that need filters. Type a query and run a cell, or use **Run all**. The execution time and the row count tell you whether the query did what you expected. For the `orders` data, you can start with this query:\n\n```sql\nSELECT * FROM public.orders LIMIT 100;\n```\n\n### Iterate cheaply with cell references\n\nAfter the first result, add a cell and enable the cell-reference icon. The new cell then queries the **previous cell's output** locally, and does not go back to the source. This is faster and cheaper. Performance depends on the memory of your machine.\n\nEach bench is a tab, so you can compare sources side by side. Save a bench to continue later, to hand off a query, or to share your exploration.\n\nAt the end of Understand, you can answer this question: *is this dataset the right input for my Data Product?* If yes and your engine can reach it, go to Productize. If yes but your engine cannot reach it, Move it in. If no, you found out before you wrote a line of SQL.","sources":["https://v2.dataos.info/build/understand/explore-data","https://v2.dataos.info/build/understand/explore-data/datasets","https://v2.dataos.info/build/understand/explore-data/workbench"]}],"lab":{"title":"Lab: Connect, inspect, and query an orders source on PostgreSQL","goal":"An active PostgreSQL Secret and Depot, or an existing Depot that is active. Also a dataset that you inspected in Datasets, and a saved Workbench bench with a query that tests the values.","duration":"45 min","prereqs":["Module b1 lab complete (CLI initialized and logged in)","A role that can create Secrets and Depots (to see your roles, run `dataos-ctl user get`)","Host, port, database, username, and password for a PostgreSQL database that DataOS can reach. Ask your admin for them. DataOS in the cloud cannot reach a local Docker Postgres"],"steps":["**Look for an existing Depot.**\n\n```bash\ndataos-ctl resource get -t depot -a\n```\n\nIf an `active` PostgreSQL Depot for your source already exists, note its name. Skip to step 6, and use that Depot.","**Write the Secret** as `postgres-orders-cred.yaml`, outside your Git repo:\n\n```yaml\nname: postgres-orders-cred\nversion: v2alpha\ntype: secret\ntags:\n  - orders\n  - postgresql\ndescription: \"PostgreSQL read/write credentials\"\nlayer: user\nsecret:\n  type: key-value\n  data:\n    username: <postgres-username>\n    password: <postgres-password>\n```","**Write the Depot** as `postgresorders.yaml`. The name must be alphanumeric only:\n\n```yaml\nname: postgresorders\nversion: v2alpha\ntype: depot\ntags:\n  - PostgreSQL\n  - depot\n  - rdbms\ndescription: \"PostgreSQL relational database depot for data storage and querying\"\nspec:\n  type: postgresql\n  spec:\n    host: <postgres-host>\n    port: 5432\n    database: <postgres-database>\n    subprotocol: \"postgresql\"\n  secrets:\n    - id: \"<tenant-id>:postgres-orders-cred\"\n      purpose: scan\n    - id: \"<tenant-id>:postgres-orders-cred\"\n      purpose: query\n    - id: \"<tenant-id>:postgres-orders-cred\"\n      purpose: rw\n```","**Apply the Secret first, then the Depot.**\n\n```bash\ndataos-ctl resource apply -f postgres-orders-cred.yaml\ndataos-ctl resource get -t secret\ndataos-ctl resource apply -f postgresorders.yaml\ndataos-ctl resource get -t depot\n```\n\nThen move `postgres-orders-cred.yaml` out of your working folder.","**If the Depot is not `active`**, inspect it:\n\n```bash\ndataos-ctl resource get -t depot -n postgresorders --details\n```\n\nMake sure that the credentials, host, port, database, and network access are correct.","**Find the data in Datasets.** Open **Datasets**. Select your PostgreSQL source in the tree and search for an orders table. If nothing appears, nobody scanned the source yet. In that case, ask your Data Admin. If you have Compute, you can also adapt the `postgresql-metadata` Nilus example from the lesson. Use `mode: shallow` and the UDL of your Depot. Then apply it with `dataos-ctl resource apply -f ./postgresql-metadata.yaml -w <your-workspace>`.","**Inspect the dataset.** On **Overview**, record the key column and two columns that you can use as dimensions. On **Lineage**, toggle **Columns** and note any downstream dependency. On **Queries**, note who uses the dataset.","**Test the values in Workbench.** Open **Workbench** > **New bench**. Choose your Depot, and choose the Secret with the `query` purpose. Expand the schema and run this query:\n\n```sql\nSELECT * FROM public.orders LIMIT 100;\n```\n\nReplace `public.orders` with the table that you found. Add a second cell with a cell reference to the first result. Filter or aggregate that result locally.","**Save the bench** with a descriptive name. Then write one sentence: is this dataset the right input for an orders Data Product, and why?"],"verify":"- `dataos-ctl resource get -t depot` lists your Depot (or the shared Depot that you chose) with `STATUS` `active`.\n- The dataset is visible in **Datasets**, and its **Overview** tab shows its columns.\n- Your saved bench returns rows, and a cell-reference cell runs against the previous result.\n- You can state the UDL for your table, for example `dataos://postgresorders/public/orders`.","sources":["https://v2.dataos.info/build/understand/connect-sources","https://v2.dataos.info/references/resources/secret/data-sources/postgresql","https://v2.dataos.info/references/resources/depot/supported-sources/postgresql","https://v2.dataos.info/build/understand/scan-metadata","https://v2.dataos.info/build/understand/explore-data/workbench"]},"takeaways":["Understand comes before Extract, Load, and Productize. Connect first. Scan only a source that has no metadata yet. Then explore.","A data connection is a Secret (credentials) plus a Depot (connection details) that references it. Apply the Secret first.","Depot names are alphanumeric only. A UDL is `dataos://[depot]/[source-path]?purpose=<value>`.","Nilus metadata pipelines need a `mode`: `shallow` (metadata + lineage) or `deep` (adds profiler, classification, usage).","In Datasets, read Overview, Lineage, and Queries. You can see a dataset without access to its data.","Workbench needs a Depot and a Secret. Choose the purpose that matches your intent, and use cell references to iterate cheaply."],"quiz":[{"q":"Which name is valid for a Depot?","options":["`postgres-orders`","`postgres_orders`","`postgresorders`","`postgres.orders`"],"answer":2,"explain":"Depot names allow only alphanumeric characters (max 63). Other Resource types allow hyphens, underscores, and dots, but Depots do not.","source":"https://v2.dataos.info/references/resources/overview"},{"q":"In `dataos://postgresorders/public/orders?purpose=query`, what does `purpose=query` change?","options":["The table that is read","Which purpose-labeled Secret the Depot Service resolves for the connection","The schema that is read","Whether the data is copied into DataOS"],"answer":1,"explain":"The purpose parameter never changes the dataset or path. It selects the credential labeled with that purpose under the `spec.secrets` of the Depot.","source":"https://v2.dataos.info/references/resources/depot"},{"q":"You need fresh inventory and lineage for a source every hour, without heavy profiling. Which Nilus metadata `mode` fits?","options":["`deep`","`profile`","`shallow`","Leave `mode` out. It defaults to inventory only"],"answer":2,"explain":"`shallow` runs `metadata` + `lineage` and is light enough for a frequent schedule. `mode` is required, so you cannot leave it out. `deep` adds the heavier profiler, classification, and usage stages.","source":"https://v2.dataos.info/build/understand/scan-metadata"},{"q":"A dataset ingested by another Tenant appears in your Datasets list. What does that mean for you?","options":["You can see its metadata, but you still need your own Depot, Secret, or access policy to read the data","You can query it immediately in Workbench","It is already part of your Data Product","It will be deleted from the other Tenant"],"answer":0,"explain":"The metadata of an ingested dataset is visible across the Instance for discovery. But visibility is not access.","source":"https://v2.dataos.info/build/understand/explore-data/datasets"},{"q":"Why does Workbench ask you to pick a Secret after you pick a Depot?","options":["Workbench cannot read Depot connection details","Each bench needs its own new Secret","The Secret determines which SQL dialect is used","A Depot can carry several Secrets for different permission contexts, so Workbench will not choose one for you"],"answer":3,"explain":"Purposes such as `query`, `rw`, or `masked` represent different permission contexts. You choose the purpose that matches your intent, and shared benches inherit that choice.","source":"https://v2.dataos.info/build/understand/explore-data/workbench"}]},{"id":"b4","title":"Working with Resources and the CLI","duration":"75 min","objectives":["Read and write a Resource manifest: name, version, type, tags, owner, layer, and spec","Tell runnable Resources from non-runnable Resources, and predict which commands apply to each","Use apply, lint, get, log, runtime, deps, and delete to manage the lifecycle of a Resource","Use `${ENV}` interpolation and basic Projections to keep manifests independent of the environment"],"lessons":[{"title":"Anatomy of a Resource manifest","body":"DataOS **Resources** are the declarative building blocks of a Data Product. You do not manage infrastructure. You describe the desired state in YAML, and DataOS provisions the Resource, reconciles it, and manages its lifecycle for you. You already wrote three Resources: a git-sync Secret, a PostgreSQL Secret, and a Depot. This lesson names the parts that they share.\n\n### Required and optional fields\n\n| Field | Required? | Purpose |\n| --- | --- | --- |\n| `name` | Yes | Unique identifier for the Resource |\n| `version` | Yes | API version of the schema. Current Resources use `v2alpha` |\n| `type` | Yes | Resource type: `workflow`, `service`, `worker`, `nilus`, `app`, `link`, `depot`, `secret`, `compute`, `dataplane`, `volume`, `bundle` |\n| `owner` | Yes (auto-filled) | Owner ID. If you omit it, DataOS fills it from the authenticated user |\n| `spec` | Yes | Configuration for the type. The structure is different for each type |\n| `description` | Optional | Summary for human readers. Recommended for every Resource |\n| `tags` | Optional | Labels for grouping, filtering, and discovery |\n| `title` | Optional | Display title in the UI |\n| `layer` | Optional | `user` or `system`. Used for access control (default `user`) |\n\n> **Note:** The block for the type is not always called `spec`. A Secret puts its configuration under `secret:` (with `secret.type`, `secret.data`, `secret.files`). Also, not every type uses `v2alpha`. The current Nilus shape is `version: v1alpha`. Always copy the header from the reference page of the type.\n\n### An annotated example\n\n```yaml\nname: customerordersdepot\nversion: v2alpha\ntype: depot\ndescription: \"PostgreSQL database containing customer and order data\"\ntags:\n  - sales\n  - postgresql\n  - production\nowner: data-engineering-team\nlayer: user\nspec:\n  type: postgresql\n  spec:\n    host: ${DEPOT_POSTGRES_HOST}\n    port: 5432\n    database: ${DEPOT_POSTGRES_DATABASE}\n  secrets:\n    - id: \"public:postgres-credentials\"\n      purpose: query\n    - id: \"public:postgres-credentials\"\n      purpose: rw\n```\n\nThe top block (name through layer) is the **Resource meta section**. It is common to every type. Everything under `spec` is **resource-specific**. The `${DEPOT_POSTGRES_HOST}` placeholders are environment references. They are the topic of lesson 3.\n\n### Naming rules\n\n| Resource type | Allowed characters | Max length |\n| --- | --- | --- |\n| Depot | Alphanumeric only (`a-z`, `A-Z`, `0-9`) | 63 |\n| All others | Alphanumeric, dots, underscores, hyphens | 253 |\n\nSome types have stricter rules. For example, a Secret name must match `[a-z]([-_.a-z0-9]*[a-z0-9])`. It must start with a lowercase letter, end with a lowercase letter or digit, and be under 60 characters. Secret names must be unique. If you apply a second Secret with an existing name, DataOS updates that Secret. It does not create a duplicate.\n\n### Tags that pay off later\n\nTags make Resources easy to find and filter. The command `dataos-ctl resource get --tags` filters on them. Recommended dimensions:\n\n| Dimension | Example values |\n| --- | --- |\n| `domain` | `sales`, `finance`, `operations` |\n| `team` | `data-engineering`, `analytics` |\n| `environment` | `dev`, `staging`, `prod` |\n| `owner` | Username or team handle |\n| `project` | Product name or initiative |\n\n### Runnable vs. non-runnable\n\nThis one split decides whether a Resource has logs and runtime state:\n\n| Runnable (executes code, has runtime state and logs) | Non-runnable (configuration only) |\n| --- | --- |\n| Workflow, Service, Worker, Minerva, Lakehouse, **Vulcan**, **Nilus**, App | **Depot**, **Secret**, Compute, Volume, Bundle, Link |\n\nThe docs give this test. If you ever ask \"what are its logs?\", the Resource is runnable. If a Resource only describes a connection, a credential, or a capacity profile, it is not runnable. Log and runtime commands do not apply to it. After you deploy your Quickstart product, it is a `vulcan` Resource, and it is runnable. The Depot that you made in b3 is non-runnable.\n\nTo see the runnable status of every type in your environment:\n\n```bash\ndataos-ctl develop types versions\n```\n\n### Lifecycle states\n\n| State | Meaning |\n| --- | --- |\n| `creating` | Submitted and being provisioned |\n| `active` | Deployed and available |\n| `failed` | An error occurred during provisioning or reconciliation |\n| `deleted` | Removed. If you need it again, redeploy with `apply` |\n\nWhen you apply a changed YAML again, DataOS performs a **rolling update**. The new version must be healthy before DataOS removes the old one. DataOS retains both versions for audit.","sources":["https://v2.dataos.info/references/resources/overview","https://v2.dataos.info/references/resources/secret/manifest-configuration","https://v2.dataos.info/build/understand/scan-metadata"]},{"title":"The Resource lifecycle with dataos-ctl","body":"You manage every Resource type through one command group: `dataos-ctl resource` (aliases `resources`, `rs`, `re`). Secrets, Depots, Compute, and Stacks do not have their own command group. You scope the generic commands with `-t <type>`. This lesson follows the lifecycle in the order that you use it.\n\n### Targeting a Resource\n\nMost commands accept the same flags to target a Resource:\n\n| Form | Example |\n| --- | --- |\n| `-t` / `-n` / `-v` | `-t depot -n postgresorders -v v2alpha` |\n| `--id` (`type:version:name`) | `--id depot:v2alpha:postgresorders` |\n| `-i` (also pipe form `name\\|version\\|type`) | `-i \"postgresorders\\|v2alpha\\|depot\"` |\n| `-f` | the manifest file itself |\n\n> **Warning:** The `-v` flag **defaults to `v1`**. The reference says to pass `-v` explicitly for `v1alpha` or `v2alpha` Resources. If a `get` or `delete` by name finds nothing, add `-v v2alpha` (or `-v v1alpha` for Nilus).\n\n### 1. Validate, then create or update\n\n```bash\ndataos-ctl resource apply -f <file-path> -l      # lint only, nothing is created\ndataos-ctl resource apply -f <file-path>         # create or update\n```\n\nAlways lint before you apply. `apply` is idempotent (safe to run twice). If the Resource is new, the command creates it. If the Resource exists, the command updates it. Two stricter variants exist. If the Resource already exists, `resource create` fails. `resource update` requires that the Resource exists. Other useful `apply` flags:\n\n| Flag | Effect |\n| --- | --- |\n| `--in` | Read the manifest from stdin (used with `vulcan create_deploy_yaml -o -`) |\n| `-R` | Apply every manifest under a directory |\n| `-r` | Run the Resource again immediately after apply |\n| `--disable-interpolation` | Do not expand `$ENV` / `${ENV}` references |\n\n### 2. Inspect\n\n```bash\ndataos-ctl resource get -t depot                 # yours\ndataos-ctl resource get -t depot -a              # every owner in the tenant\ndataos-ctl resource get -t depot -n postgresorders -d   # one, with full manifest\n```\n\nThe default columns are `NAME`, `VERSION`, `TYPE`, `STATUS`, `RUNTIME`, and `OWNER`. `-d` (`--details`) includes the manifest, with sensitive fields masked. `--runnable` limits the results to `service`, `worker`, and `workflow`. `-r` refreshes the output automatically. `get` has the aliases `ls` and `list`.\n\n> **Warning:** `--unSanitize` shows sensitive fields without masks. It is reserved for the DataOS Operator (or an equivalent role) during root cause analysis. Do not use it for routine inspection.\n\n### 3. Runtime and logs (runnable only)\n\n```bash\ndataos-ctl resource get runtime -t vulcan -n orders-analytics\ndataos-ctl resource log -t vulcan -n orders-analytics --tailLines 100\ndataos-ctl resource log -t vulcan -n orders-analytics --follow\n```\n\n`get runtime` (identical to `resource runtime get`) shows replica counts, conditions, and container groups. With `-d`, it shows detailed failure messages, for example crash loops or insufficient CPU. By default, `log` shows the last 40 lines. `--follow` streams the log. A deployed Vulcan product has `plan`, `run`, and `api` components. Read the `run` log for model execution, the `plan` log for planning, and the `api` log for query issues.\n\nThe `runtime` subcommands control runnable Resources: `run`, `re-run`, `stop`, `pause`, `resume`, `suspend`.\n\n> **Note:** `dataos-ctl resource runtime run` triggers a run of an **existing** Resource. `dataos-ctl resource run -f <manifest>` **creates** a Resource and runs it in one step. Then it waits for success or failure.\n\n### 4. Check dependencies, then delete\n\n```bash\ndataos-ctl resource deps -t secret -n postgres-orders-cred\ndataos-ctl resource delete -t depot -n postgresorders\ndataos-ctl resource delete -t secret -n postgres-orders-cred\n```\n\nDeletion is **permanent**. You cannot restore a deleted Secret. The platform checks for dependents first. Here is an example. If a Depot still uses a Secret, the delete of that Secret fails with `cannot delete resource, it is a dependency of 'depot:v2alpha:...'`. Delete the dependents first. `--cascade` also deletes the dependents, and `--force` overrides the check. Run `deps` before you use either flag. Ownership decides who can delete a Resource, not `runAsUser`.\n\n### Developer cheatsheet\n\n| Goal | Command |\n| --- | --- |\n| Am I pointed at the right tenant? | `dataos-ctl tenant list` |\n| Is my Compute/Depot/Secret there? | `dataos-ctl resource get -t <type> -n <name>` |\n| What Depot types exist? | `dataos-ctl depot types get` |\n| Validate a manifest | `dataos-ctl resource apply -f <file> --lint` |\n| Status and recent logs | `resource get` / `resource log --tailLines 100` |\n| Re-run after a fix | `dataos-ctl resource runtime re-run -t <type> -n <name>` |\n| My roles / my API keys | `dataos-ctl user get` / `dataos-ctl user apikey get` |\n\nIf a Compute, Depot, or Secret that you need is missing, ask your Tenant Admin for it. You do not provision it yourself.","sources":["https://v2.dataos.info/references/interfaces/command-line-interface/resource","https://v2.dataos.info/references/resources/overview","https://v2.dataos.info/operate/data-developer/cli-dev-cheatsheet","https://v2.dataos.info/references/resources/secret/data-sources/postgresql","https://v2.dataos.info/build/productize/git-and-deploy"]},{"title":"Manifests that work in every environment: interpolation and Projections","body":"Hardcoded hosts, tenant IDs, or credentials in a manifest cause two problems. Secrets leak into Git, and you must maintain a different file for each environment. DataOS gives you two mechanisms to prevent this. One works at **apply** time. The other works while the workload **runs**.\n\n### At apply time: `${ENV}` references\n\nThe example Depot from lesson 1 contained this block:\n\n```yaml\nspec:\n  type: postgresql\n  spec:\n    host: ${DEPOT_POSTGRES_HOST}\n    port: 5432\n    database: ${DEPOT_POSTGRES_DATABASE}\n```\n\nBy default, `dataos-ctl resource apply` interpolates `$ENV` and `${ENV}` references in the manifest. You set the values as environment variables in the shell where you run the command. Thus you can apply the same file to `dev` and `prod` with different values. The `--disable-interpolation` flag turns this off. It exists for Stack manifests that contain placeholders that must survive apply. Secret and Depot manifests do not need it.\n\n> **Warning:** Do not confuse `${ENV}` (shell environment interpolation by the CLI) with `${{...}}`. The `${{postgres-host}}` style in doc templates is only a fill-in-the-blank placeholder. You replace it by hand.\n\n### At runtime: Projections\n\n**Projections** are a DataOS templating system. At runtime, they inject environment variables, configuration files, and command arguments into the containers of a workload. They fill the templates from Secrets, Depots, addresses, and the default DataOS context. In short:\n\n```\nTemplate + Runtime context = Container-ready configuration\n```\n\nCompare a hardcoded spec:\n\n```yaml\nspec:\n  environmentVars:\n    DATABASE_URL: \"postgresql://user:pass@prod-db:5432/mydb\"\n    TENANT_ID: \"production-tenant\"\n```\n\nwith a projected one:\n\n```yaml\nspec:\n  use:\n    projection:\n      secrets:\n        - id: \"database-credentials\"\n          contextAlias: \"db\"\n      projections:\n        envVars:\n          - key: \"DATABASE_URL\"\n            template: \"postgresql://{{ secrets['db'].username | base64_decode }}:{{ secrets['db'].password | base64_decode }}@{{ secrets['db'].host | base64_decode }}:5432/{{ secrets['db'].database | base64_decode }}\"\n          - key: \"TENANT_ID\"\n            template: \"{{ defaultProjections.dataOsTenantId }}\"\n```\n\nThe building blocks:\n\n- **Data sources**: `secrets` (with an optional `contextAlias`), `depots`, `addresses`, and built-in context such as `defaultProjections.dataOsTenantId` or `defaultProjections.dataOsFqdn`.\n- **Outputs**: `envVars` (each with `key` and `template`), `files`, `args`, and `dictionary`.\n- **Template engine**: Liquid by default. Reference values without a leading dot. Secret values are base64-encoded in the context, so add `| base64_decode`.\n\n> **Note:** Every projection item needs `template`. There is no `value` field. Go-template syntax with a leading dot (`{{.secrets.db.url}}`) is not supported.\n\n### A real example that you already saw\n\nThe PostgreSQL Nilus metadata docs show a pipeline that connects without a Depot. It projects the credentials into environment variables:\n\n```yaml\n  use:\n    projection:\n      secrets:\n        - id: engineering:postgres-secret\n          contextAlias: pgsecret\n      projections:\n        envVars:\n          - key: PG_USER\n            template: \"{{ secrets['pgsecret'].username | base64_decode }}\"\n          - key: PG_PASSWORD\n            template: \"{{ secrets['pgsecret'].password | base64_decode }}\"\n```\n\nThe credentials stay in the Secret. The pipeline file only says where to put them.\n\n### Where projections go\n\nYou can define projections at the **stack level** or at the **application level** under `spec.use.projection`. A stack-level projection applies to every workload that uses the stack. If both levels define the same environment variable, the application-level value wins. For Workflows, put `use.projection` under each DAG step (`spec.dag[].spec.use.projection`). DataOS silently drops a projection at the top-level `spec` of a Workflow.\n\n### Test before you deploy\n\nThe docs show local test commands. They render a projection or a full Resource without a deployment:\n\n```bash\ndataos-ctl develop use \\\n  --template-file ./my-projection.yaml \\\n  --binding-context ./context.json\n\ndataos-ctl develop resource \\\n  --resource-file ./my-workflow.yaml \\\n  --dry-run\n```\n\nThe recommended loop is: write the template, test its output locally, validate the full Resource, preview the generated output, and then deploy.\n\n### Which one do I need?\n\n| Need | Use |\n| --- | --- |\n| Different host or database per environment in a Depot | `${ENV}` interpolation at apply time |\n| Credentials inside a running container | Projections from a Secret |\n| Tenant or instance values inside a workload | `defaultProjections` |\n| Keep Stack placeholders intact at apply | `--disable-interpolation` |\n\nAt the Beginner level, you mainly read projections in the manifests of other people. You write them for your own Services and Workflows at the Intermediate level.","sources":["https://v2.dataos.info/references/resources/projections","https://v2.dataos.info/references/resources/overview","https://v2.dataos.info/references/interfaces/command-line-interface/resource","https://v2.dataos.info/operate/cli","https://v2.dataos.info/operate/tenant-admin/add-data-sources-and-secrets","https://v2.dataos.info/references/resources/nilus/metadata-pipelines/metadata-sources/postgresql"]}],"lab":{"title":"Lab: Drive a Resource through its lifecycle","goal":"Lint, apply, inspect, update, and delete a Secret and Depot pair from the CLI with environment interpolation. Observe the difference between non-runnable and runnable Resources.","duration":"40 min","prereqs":["The module b3 lab is complete, or you have permission to create a throwaway Secret and Depot in a sandbox tenant","Your PostgreSQL connection details"],"steps":["**Confirm the target tenant.**\n\n```bash\ndataos-ctl tenant list\ndataos-ctl health\n```\n\nIf the `*` is not on your sandbox context, run `dataos-ctl tenant select --name <context>`.","**Make the Depot environment-agnostic.** Create `labdepot.yaml`:\n\n```yaml\nname: labordersdepot\nversion: v2alpha\ntype: depot\ndescription: \"PostgreSQL database containing customer and order data\"\ntags:\n  - sales\n  - postgresql\n  - dev\nlayer: user\nspec:\n  type: postgresql\n  spec:\n    host: ${DEPOT_POSTGRES_HOST}\n    port: 5432\n    database: ${DEPOT_POSTGRES_DATABASE}\n    subprotocol: \"postgresql\"\n  secrets:\n    - id: \"<tenant-id>:postgres-orders-cred\"\n      purpose: query\n    - id: \"<tenant-id>:postgres-orders-cred\"\n      purpose: rw\n```\n\n(Use the Secret from module b3, or create one first as in that lab.)","**Set the environment and lint.**\n\n```bash\nexport DEPOT_POSTGRES_HOST=<postgres-host>\nexport DEPOT_POSTGRES_DATABASE=<postgres-database>\ndataos-ctl resource apply -f labdepot.yaml -l\n```\n\nFix every error that the lint reports.","**Break it on purpose.** Rename the Depot to `lab-orders-depot`. Lint again and read the error. Hyphens are not allowed in Depot names. Change the name back to `labordersdepot`.","**Apply and inspect.**\n\n```bash\ndataos-ctl resource apply -f labdepot.yaml\ndataos-ctl resource get -t depot -n labordersdepot\ndataos-ctl resource get -t depot -n labordersdepot -d\n```\n\nIf `get` by name returns nothing, retry with `-v v2alpha`. In the `-d` output, make sure that DataOS resolved the host from your environment variable.","**Update.** Add the tag `domain-sales` to the manifest. Run `dataos-ctl resource apply -f labdepot.yaml` again. Make sure that `dataos-ctl resource get -t depot --tags domain-sales` shows the Depot.","**Try a runnable-only command on a non-runnable Resource.**\n\n```bash\ndataos-ctl resource log -t depot -n labordersdepot\n```\n\nA Depot has no logs or runtime. If you have a runnable Resource available (for example a Nilus pipeline from b3), compare with `dataos-ctl resource get runtime -t nilus -n <name> -v v1alpha`.","**Check dependencies, then try deleting the Secret first.**\n\n```bash\ndataos-ctl resource deps -t secret -n postgres-orders-cred\ndataos-ctl resource delete -t secret -n postgres-orders-cred\n```\n\nThe delete fails with a dependency error that names your Depot or Depots. Do not use `--force` or `--cascade`.","**Clean up in the right order.** Delete only the lab Depot. If you still need the b3 Depot and Secret, keep them:\n\n```bash\ndataos-ctl resource delete -t depot -n labordersdepot\ndataos-ctl resource get -t depot\n```"],"verify":"- Lint passes for `labordersdepot` and fails for `lab-orders-depot`.\n- `resource get ... -d` shows the interpolated host value.\n- `resource get -t depot --tags domain-sales` returns the lab Depot after the update.\n- If you delete the Secret while a Depot depends on it, the delete fails with a `cannot delete resource, it is a dependency of 'depot:v2alpha:...'` style error.\n- After cleanup, `labordersdepot` no longer appears in `dataos-ctl resource get -t depot`.","sources":["https://v2.dataos.info/references/interfaces/command-line-interface/resource","https://v2.dataos.info/references/resources/overview","https://v2.dataos.info/references/resources/secret/data-sources/postgresql","https://v2.dataos.info/references/resources/depot/supported-sources/postgresql"]},"takeaways":["Every manifest has name, version, type, owner (auto-filled), and a block for the type. Description, tags, title, and layer are optional.","Depot names are alphanumeric only (63 max). Other Resources allow dots, underscores, and hyphens (253 max).","Runnable Resources (Vulcan, Nilus, Workflow, Service, Worker...) have logs and runtime. Depots and Secrets do not.","Lifecycle: lint with `apply -l`, then `apply`, `get` (`-a`, `-d`), `log`, `get runtime`, `deps`, and `delete`.","`-v` defaults to `v1`. When you target a Resource by name, pass `-v v2alpha` or `-v v1alpha` explicitly.","The CLI interpolates `${ENV}` at apply time. Projections inject Secret and context values into containers at runtime."],"quiz":[{"q":"Which command validates a manifest without creating or changing anything?","options":["`dataos-ctl resource create -f depot.yaml`","`dataos-ctl resource apply -f depot.yaml -l`","`dataos-ctl resource get -f depot.yaml -d`","`dataos-ctl resource apply -f depot.yaml -r`"],"answer":1,"explain":"`-l` / `--lint` validates the manifest and does not apply it. `-r` runs the Resource again after apply, and `create` creates the Resource.","source":"https://v2.dataos.info/references/interfaces/command-line-interface/resource"},{"q":"You run `dataos-ctl resource log -t secret -n postgres-orders-cred`. What output do you expect?","options":["No useful output: a Secret is non-runnable and has no logs or runtime state","The last 40 lines of the Secret's log","The decrypted Secret values","An audit trail of who used the Secret"],"answer":0,"explain":"Secrets and Depots are configuration-only. Log and runtime commands apply only to runnable Resources such as Vulcan, Nilus, Workflow, Service, and Worker.","source":"https://v2.dataos.info/references/resources/overview"},{"q":"`dataos-ctl resource get -t depot -n postgresorders` returns nothing, but `resource get -t depot -a` lists `postgresorders` with version `v2alpha`. What is the most likely fix?","options":["Re-apply the Depot","Add `--unSanitize`","Add `-v v2alpha`, because `-v` defaults to `v1`","Run `dataos-ctl login` again"],"answer":2,"explain":"The resource reference states that `-v` defaults to `v1`, and that you must pass it explicitly for `v1alpha` or `v2alpha` Resources. `--unSanitize` is only for root cause analysis by the Operator.","source":"https://v2.dataos.info/references/interfaces/command-line-interface/resource"},{"q":"What is the difference between `dataos-ctl resource runtime run` and `dataos-ctl resource run`?","options":["They are aliases","`runtime run` triggers a run of an existing runnable Resource. `resource run -f` creates a Resource from a manifest and runs it in one step","`runtime run` only works for Depots","`resource run` deletes the Resource first"],"answer":1,"explain":"The reference warns about exactly this. Use `runtime run` for an existing Resource. Use `resource run -f` to start from a manifest.","source":"https://v2.dataos.info/references/interfaces/command-line-interface/resource"},{"q":"In a projection, why does the template read `{{ secrets['db'].password | base64_decode }}`?","options":["Because Liquid requires every value to be encoded","Because the password must be stored encoded in the container","Because `base64_decode` validates the password","Because Secret values are base64-encoded in the projection context, and `contextAlias: db` makes the Secret available as `secrets['db']`"],"answer":3,"explain":"The alias exposes the Secret as `secrets['db']`. Secret values arrive base64-encoded, so the filter returns the plain value.","source":"https://v2.dataos.info/references/resources/projections"}]},{"id":"b5","title":"Discover and evaluate Data Products","duration":"60 min","objectives":["Search, filter, and switch scope (Data Products, Perspectives, Metrics) in the Data Product Hub","Evaluate a product's assets: seeds, inputs, outputs, semantics, and metrics","Read trust signals: quality, freshness, AI-readiness, runs, and plans","Query a product in Studio and save the query as a Perspective"],"lessons":[{"title":"Search the Data Product Hub","body":"Before you build something new, find out whether it already exists. The consumer journey has three steps: **Discover**, **Evaluate**, and **Activate**. As a practitioner, you will walk this journey often. You reuse a product, you look at your own deployed product the way that others see it, or you answer a question from a stakeholder. Discovery happens in the **Data Product Hub** (the Hub).\n\n### What you need first\n\nThree things must be in place: **tenant access** (it decides what appears in the Hub), a **deployed Data Product**, and, for external tools later, a **DataOS API token**. The Hub itself needs only the first two.\n\n### Open the Hub and read the cards\n\nFrom the DataOS home page, select **Products**. The Hub shows every product in the selected tenant as a card. Each card gives enough signal for you to decide whether to open it:\n\n- The icon and name.\n- A short description.\n- A **Quality** indicator that warns of open quality issues.\n- A **Last run** indicator that warns that the most recent run failed.\n\nA card with no indicators is a quick sign that quality is clean and that the last run succeeded. Hover over a card to show the info (**i**) icon and preview the details without opening the product.\n\n### Narrow the list\n\n| Control | Use it to |\n| --- | --- |\n| Grid / list toggle | Switch between visual cards and rows of names and glossary terms (faster for large sets) |\n| **All** / **My Data Products** | Restrict to products you own or are a member of |\n| Filter icon (**Filter by** panel) | Narrow by structured metadata |\n| Search field | Match text in name, description, tags, or topic, with a live result count |\n\nFilter categories are **Domain**, **Type** (select `dataproduct` for Data Products only), **Quality** (*Passing* or *Failing*), **Last run** (*Successful* or *Failed*), **Tags**, and **Members**. Memorize the combination logic:\n\n- Multiple values **within** one category match **any** of them.\n- Values across **different** categories must **all** match.\n\nSo Domain = `sales` + `marketing` with Quality = *Passing* returns passing products from either domain.\n\n### Switch the search scope\n\nSometimes the fastest answer is not a whole product. The scope selector next to the search field offers **Data Products**, **Perspectives**, and **Metrics**.\n\n**Perspectives** are saved, governed queries on the semantic layer of a product. They keep the dimensions, measures, filters, and time window that someone selected. Thus you can reuse the result, share it, or serve it through a Data API. Filter them by **Visibility** (*Everyone* or *Only Me*), **Data Product**, **Tags**, and **Owner**. When you click one, a panel opens with the description, visibility, product, and owner. **Know more** opens the full page with **Data**, **Columns**, **Lineage**, and **Data APIs** tabs.\n\n**Metrics** are computed business measures that are defined on the semantic layer of a product, for example `active_customers` or `customer_lifetime_value`. The panel of a metric shows its **Description** and its **Composition** (the measure, dimensions, and time field that make it up). It also shows its **Product** and **Owner**, and **Tags**. **Open in Studio** lets you explore it immediately.\n\n> **Tip:** Recognize what you built in module b2. After you deploy your `daily_revenue_by_region` metric, it appears here. Its composition is `order_lines.total_line_revenue` over `order_lines.order_date`, broken out by `order_lines.region`.\n\n### Discovery in natural language\n\nIf you only know your intent, a connected AI client can find candidates. For example, ask *\"I need to report on quarterly sales revenue. What data products exist for orders and revenue?\"* Then narrow the list to products that expose the exact metric. Look at quality and runs, and make sure that you know the owner. This is the AI mode of discovery. The same trust checks apply.\n\n### When to stop discovering\n\nDiscovery answers these questions: Is there a product for this use case? Does the name, description, or tag match? Is there a metric or perspective that already answers the question? Who owns it? Is it worth a detailed review? When a product looks promising, open it and move to Evaluate.","sources":["https://v2.dataos.info/consume/get-started/before-you-begin","https://v2.dataos.info/consume/discover/overview","https://v2.dataos.info/consume/discover/search-the-hub","https://v2.dataos.info/consume/discover/search-the-hub/filters","https://v2.dataos.info/consume/discover/search-the-hub/perspectives","https://v2.dataos.info/consume/discover/search-the-hub/metrics","https://v2.dataos.info/consume/recipes/find-a-data-product"]},{"title":"Evaluate a product: assets, trust, and activity","body":"When you open a product, its product page appears. You evaluate the product on this page. You no longer ask \"does this exist?\". You now ask \"is this fit for what I need, and can I rely on it?\". The deployed example in the docs is **Orders Analytics Platform**, the published form of the `orders-analytics` project.\n\n### Read the header and stats first\n\nThe header shows the name and type, a plain-language description, metadata chips (source, domain, documentation), the **version**, and the **owner**. If a quality dimension (**Completeness**, **Validity**, **Uniqueness**) needs attention, it gets a flag. You can **Follow** the product to track changes. If the product has a data-sharing agreement, you first see **Accept & Follow** with the text of the agreement. You can also copy the identifier of the product for queries and support requests.\n\nThe stats bar shows four live signals: **data quality** (rules passed out of total), **freshness** (time since last refresh), **queries**, and **followers**. Below the stats bar, sections answer specific questions: **Overview**, **What it answers** (metric cards), **Trust and freshness**, **How to activate**, **How it is being used**, and **Contacts**. The **Is it a right fit for me?** panel in the Overview shows *Good for*, *Not good for*, and *Caveats*. These come from the `usage.yml` file of the product, the same file that `vulcan init` scaffolded for you.\n\n### Explore assets\n\nSelect **Assets** in the Quick access bar. The left panel groups the assets into **Overview**, **Seeds**, **Inputs**, **Outputs**, **Semantics**, and **Metrics**:\n\n| Section | Answers | Orders Analytics Platform example |\n| --- | --- | --- |\n| Overview | How does data flow end to end? | Graph from inputs to metrics |\n| Seeds | Which reference values classify the data? | `ORDER_STATUS_LOOKUP` |\n| Inputs | Where does data originate? | `CUSTOMERS_EXT` |\n| Outputs | Which governed datasets can I consume? | `CUSTOMERS` |\n| Semantics | Which dimensions and measures are exposed? | `CUSTOMER_PROFILE`, `DAILY_SALES` |\n| Metrics | Which governed measures can I reuse? | `customer_lifetime_value` |\n\nThe Overview graph shows assets as nodes and data flow as arrows. Turn on the **Columns** toggle to follow one field across assets. In a big graph, use the **Chart configuration** (gear) panel to hide node types. **View lineage** on any asset opens its full dependency graph.\n\nThe detail view of each asset has **Columns** and **Dependencies** tabs, plus a summary of **Kind**, **Last run**, and **Schedule**. Semantic models add a **Relationships** tab (related model, relationship type, join key). Their columns show **Kind** as dimension or measure. Metric columns show measure, dimension, time, or segment. If a policy applies, a shield icon marks the asset. A **Policies** tab then shows **Policies applied for you** and the **Full policy**. An example of the first: \"3 columns are masked and 1 row filter applied on you\".\n\n### Trust and freshness\n\nClick **Quality** in the Quick access bar. The **Summary** tab combines three signals:\n\n- **Data quality**: a gauge of passing rules, plus **Validity**, **Uniqueness**, and **Completeness** counts and a trend chart.\n- **Data freshness**: time since last run, run duration, and a run trend (green success, red failure). If recent refreshes failed, an **Issues detected** label appears.\n- **AI-readiness**: Tier A means production-ready for AI agents and MCP tools. Lower tiers come with a checklist of what is missing.\n\nThe **Details** tab lists one rule per row with a five-run heatmap. **Group** by Models or Dimensions. Switch to **Without rules** to find columns and models with no checks at all. These are coverage gaps.\n\n### Track activity\n\nClick **Runs** in the Quick access bar. **Runs** lists every execution. The panel of a run has two tabs. The **Errors** tab shows failing models with badges such as `UndefinedColumn`. The **Models evaluated** tab shows kind, row count, and quality result. **Plans** is the version history: Added, Removed, Modified (with code diffs and **Breaking** and **Backfill** badges), Impacted, Metadata changes, and Backfills. If you depend on a product, scan the **Breaking** badge and the **Impacted** list.\n\n> **Note:** A masked column or a total lower than expected usually comes from governance (masking or a row filter). It is usually not a data-quality bug. Look at the Policies tab before you raise an issue.\n\n### You are done when\n\nYou know what the product provides, you trust its signals, and you can decide whether to activate it. If the signals are poor, look at recent activity or contact the owner listed under **Contacts**.","sources":["https://v2.dataos.info/consume/evaluate/overview","https://v2.dataos.info/consume/evaluate/assets","https://v2.dataos.info/consume/evaluate/assets/overview","https://v2.dataos.info/consume/evaluate/assets/seeds","https://v2.dataos.info/consume/evaluate/assets/inputs","https://v2.dataos.info/consume/evaluate/assets/outputs","https://v2.dataos.info/consume/evaluate/assets/semantics","https://v2.dataos.info/consume/evaluate/assets/metrics","https://v2.dataos.info/consume/evaluate/trust-and-freshness","https://v2.dataos.info/consume/evaluate/track-activity"]},{"title":"Query in Studio and save a Perspective","body":"Signals and metadata suggest that a product fits. A query shows that it does. **Studio** lets you query the governed semantic models of a product in the browser, before you connect it to a BI tool or application.\n\n### Four ways to query\n\nFrom the product page, select **Explore**. The menu offers four modes:\n\n| Mode | Goes through the semantic layer? | Use it to |\n| --- | --- | --- |\n| **Visual builder** | Yes | Point-and-click fields, filters, and result shape |\n| **Semantic SQL** | Yes | Write SQL against semantic model names |\n| **GraphQL** | Yes | Mirror what a downstream application sends |\n| **Source SQL** | **No** | Query the physical models directly, Workbench-style |\n\nThe three semantic modes apply the same governed definitions. Thus the same selection returns the same result in each mode. Source SQL bypasses the semantic layer. Use it to inspect physical data independently of the model.\n\n### Visual builder\n\nThe left panel lists the semantic models. Expand one and select dimensions and measures. Each model has **Select all** and **Clear all**, and the **Selected** tab shows a running count. **Filters** are grouped into Dimensions and Measures, and they combine with AND/OR. Query settings include **Sort by**, **Limit** (100 up to 10K rows), **Offset**, and **Zone** (time zone). Select **Run**. The results appear in the **Results** tab. The **Source SQL** tab shows the generated SQL. The **REST API** tab shows how to run the same query programmatically with a Bearer token.\n\n### Semantic SQL\n\nYou write SQL against model names, not warehouse tables. The engine translates the SQL and applies joins, aggregations, and access controls. Start with an exploration of the surface:\n\n```sql\nSHOW TABLES;          -- semantic models the product exposes\nDESCRIBE customer_profile;   -- its dimensions and measures\n```\n\n```sql\nSELECT customer_profile.customer_id, customer_profile.region_name, customer_profile.total_revenue\nFROM customer_profile\nWHERE customer_profile.is_active_customer = true\nLIMIT 100;\n```\n\nYou cannot reference raw tables or warehouse-specific syntax. Every selected field must be a dimension or measure that the model exposes.\n\n### GraphQL\n\nThe playground points at the native GraphQL endpoint of the product. Thus what you test is what an application calls. Set the Authorization Bearer token in the **Headers** panel. The root `table` field takes `where`, `limit`, `offset`, `timezone`, `orderBy`, and `ungrouped`:\n\n```graphql\n{\n  table(limit: 100, timezone: \"UTC\",\n        where: { customer_profile: { is_active_customer: { equals: true } } }) {\n    customer_profile { customer_id region_name total_revenue }\n  }\n}\n```\n\n### Read the result status\n\nA violet Zap icon (tooltip \"Cache: Yes\") means that the result came from cache. A grey, crossed-out Zap (\"Cache: No\") means that the query ran fresh. Look at the icon before you cite a number. If a query fails, the error box shows the backend error code and message. Thus you can tell a permissions issue from a syntax issue. If you edit a query that already ran, Studio warns you and prompts a rerun.\n\n### What to validate\n\n- The fields that you need exist as dimensions or measures.\n- Values look right: decimals at full precision, string-typed dates shown as strings.\n- Filters scope correctly to the segment or date range.\n- The result size is manageable.\n- The query is worth reuse. If it is, save it.\n\n### Save as Perspective\n\nA **Perspective** is a saved, governed query. It keeps the dimensions, measures, filters, and time window that you chose. After you run a query, open **Save as Perspective** and fill in these fields:\n\n- **Name** (required)\n- **Glossary term**, to tie it to a shared business definition\n- **Description** of what it returns\n- **Tags** for finding and grouping\n- **Visibility**: keep **Only me** while you draft. Open it to share.\n- **Auto refresh**: whether the result stays current automatically\n\nSelect **Save**, then **View details**. The perspective page has an **About** panel and these tabs:\n\n- **Data**: result, last-updated time, row and column counts\n- **Columns**: tags and profile\n- **Lineage**: how it is built from inputs, outputs, and semantic models\n- **Data APIs**: endpoint, required `Authorization` header, and response schema\n\nThe Data APIs tab is the bridge to activation. It gives an application everything that it needs to consume the perspective.\n\n> **Tip:** Before you save a new perspective, switch the Hub scope to **Perspectives** and filter by the Data Product. Reuse of an existing governed query is better than a near-duplicate.","sources":["https://v2.dataos.info/consume/evaluate/query-in-studio","https://v2.dataos.info/consume/evaluate/query-in-studio/save-as-perspective","https://v2.dataos.info/releasenotes/september-2026"]}],"lab":{"title":"Lab: Vet a product and save a reusable query","goal":"A written fit-for-use assessment of one Data Product in your tenant and a private Perspective saved from a Studio query.","duration":"35 min","prereqs":["Tenant access with at least one deployed Data Product (ideally an orders or sales product such as Orders Analytics Platform)","Read access to that product"],"steps":["**Open the Hub.** From DataOS home, select **Products**. Note how many products are listed.","**Filter.** Open the **Filter by** panel and set **Type** = `dataproduct`, **Quality** = *Passing*, and **Last run** = *Successful*. Then type `orders` (or `sales`) in search. Record the result count.","**Switch scope.** Use the scope selector to view **Metrics**. Open one metric and record its **Composition** (measure, dimensions, time field) and owner. Then switch to **Perspectives** and filter by the same Data Product.","**Evaluate the product.** Open the product. Record the version, the owner, and the four values in the stats bar (quality, freshness, queries, followers). Read **Is it a right fit for me?**.","**Explore assets.** Select **Assets**. On **Overview**, turn on **Columns** and trace one field from an Input to a Semantic model. Open one **Semantics** model and list two dimensions, two measures, and one relationship. Record any shield (policy) icons.","**Check trust.** Select **Quality**. On **Summary**, record the quality gauge and the AI-readiness tier. On **Details**, switch to **Without rules** and record one uncovered column or model.","**Check activity.** Select **Runs**. Open the latest run and look at **Models evaluated**. In **Plans**, look for **Breaking** badges on the latest version.","**Query in Studio.** Select **Explore** > **Semantic SQL** and run:\n\n```sql\nSHOW TABLES;\n```\n\nPick a model and run `DESCRIBE <model>;`. Then select one dimension and one measure with a `LIMIT 100`. Repeat the same selection in the **Visual builder** and compare the results. Look at the Zap icon for the cache status.","**Save as Perspective.** Open **Save as Perspective**. Give it a name, a description, and a tag, and set **Visibility** to **Only me**. Select **Save**, then **View details**, and open the **Data APIs** tab."],"verify":"- Your notes record: filtered result count, a metric's composition, the product's owner and version, two dimensions and two measures, the AI-readiness tier, and the latest run status.\n- The Visual builder and Semantic SQL return the same rows for the same selection.\n- If you set the Hub scope to **Perspectives** with **Visibility** = *Only Me*, your Perspective appears. Its **Data APIs** tab shows an endpoint and the required `Authorization` header.","sources":["https://v2.dataos.info/consume/discover/search-the-hub","https://v2.dataos.info/consume/evaluate/overview","https://v2.dataos.info/consume/evaluate/query-in-studio","https://v2.dataos.info/consume/evaluate/query-in-studio/save-as-perspective"]},"takeaways":["Discover in the Hub (DataOS home > Products): search text, filter structured metadata, and switch scope to Perspectives or Metrics.","Filters: values in one category match any. Different categories must all match.","Assets are grouped into Overview, Seeds, Inputs, Outputs, Semantics, and Metrics. Shields and the Policies tab show governance.","Trust = quality, freshness, and AI-readiness. Activity = Runs (executions) and Plans (versions, Breaking, Impacted).","The Visual builder, Semantic SQL, and GraphQL modes in Studio share the semantic layer. Source SQL bypasses it.","A Perspective saves a governed query with name, visibility, and auto refresh, and exposes it through a Data API."],"quiz":[{"q":"In the Hub you select Domain = `sales` and `marketing`, and Quality = *Passing*. Which products are shown?","options":["Products in both sales and marketing domains at once","All sales products plus all passing products","Only marketing products, because the last value wins","Passing products in either the sales or the marketing domain"],"answer":3,"explain":"Values in one category match any of them. Selected categories must all match.","source":"https://v2.dataos.info/consume/discover/search-the-hub/filters"},{"q":"Which Studio mode bypasses the semantic layer?","options":["Source SQL","Visual builder","Semantic SQL","GraphQL"],"answer":0,"explain":"Source SQL queries the physical models directly. The other three go through the semantic layer and apply the same governed definitions.","source":"https://v2.dataos.info/consume/evaluate/query-in-studio"},{"q":"You want to find the columns and models in a product that have no quality checks at all. Where do you look?","options":["Assets > Overview with the Columns toggle","Runs > Models evaluated","Quality > Details, switched to **Without rules**","Plans > Impacted"],"answer":2,"explain":"The *Without rules* view of the Details tab lists the columns and models that have no checks. This is how you find coverage gaps.","source":"https://v2.dataos.info/consume/evaluate/trust-and-freshness"},{"q":"A product's latest plan shows a **Breaking** badge on a model you query. What does this tell you?","options":["The last run failed","The change in that version can break downstream consumers, so see whether what you use is impacted","The model needs a full backfill","The product is deprecated"],"answer":1,"explain":"If you depend on the product, scan two things in Plans: the Breaking badge and the Impacted list. Run failures appear under Runs instead.","source":"https://v2.dataos.info/consume/evaluate/track-activity"},{"q":"Which tab on a saved Perspective gives an application the endpoint and required `Authorization` header?","options":["Data","Columns","Data APIs","Lineage"],"answer":2,"explain":"The Data APIs tab gives the endpoint, header, and response schema. It is the bridge from evaluation to activation.","source":"https://v2.dataos.info/consume/evaluate/query-in-studio/save-as-perspective"}]},{"id":"b6","title":"Activate: SQL clients and BI tools","duration":"60 min","objectives":["Describe what Tenant access, Data Product access, and an API token each grant a consumer","Connect the classic mysql client and DBeaver to a Data Product over the MySQL wire protocol","Write semantic SQL with dimensions, `MEASURE()`, and `__joinField` joins","Configure Tableau and Power BI (Desktop and Service) with the exact driver and connection configuration that DataOS requires"],"lessons":[{"title":"Getting access as a consumer","body":"Every activation path depends on three things: access to the **Tenant**, access to the specific **Data Product**, and an **API token** that lets an external tool act as you. Practitioners often have
