uery** as Degraded and everything else as Healthy. What do the docs recommend first?","options":["Restart every Minerva Cluster in every Tenant","Check what changed on the Instance recently, then inspect the logs for that service","Declare an Instance incident and escalate immediately","Ignore it. Degraded is informational only"],"answer":1,"explain":"Degraded means that the endpoint responds slowly or intermittently. First look at recent changes, then at the logs. Immediate incident handling is the documented response to Down, not to Degraded.","source":"https://v2.dataos.info/operate/instance-status"},{"q":"A Tenant Admin must decide whether the Data Plane can absorb a new Tenant with heavy workloads. Which source is correct for this decision?","options":["The Instance Status page's Dataplane Readiness group alone","Data Product Hub trust signals","The Data Plane's workload and Compute signals in the Operations application and Data Plane observability","`dataos-ctl version --all`"],"answer":2,"explain":"The status page covers Instance services only. Capacity before you attach Tenants comes from Data Plane workload and Compute health. Readiness shows registration, not capacity.","source":"https://v2.dataos.info/operate/dataos-operator/monitoring"},{"q":"You upgrade from the July to the September 2026 release. Your Lakehouse manifests size Spark under `sparkCluster.server`. What must you do?","options":["Nothing. `server` remains the only supported location","Delete and recreate the Lakehouses","Move CPU and memory settings to `sparkCluster.resources`. If both are set, `resources` wins","Move sizing into `sherpa.resources`"],"answer":2,"explain":"September deprecates `server` for sizing and replaces it with `resources`. It still accepts the old field for a limited time. You do not need to recreate Lakehouses.","source":"https://v2.dataos.info/releasenotes/september-2026"},{"q":"After the August 2026 upgrade, one Lakehouse shows as quarantined. What does the release note tell you to do?","options":["Redeploy the Lakehouse to restore it to healthy","Drop and recreate its PostgreSQL metastore database","Ask the Data Admin to unquarantine it","Downgrade the Spark operator image"],"answer":0,"explain":"The Spark operator image was upgraded, and you must redeploy Lakehouses in error or quarantined state. Data Admins cannot release quarantined Resources. That is a Tenant Admin capability.","source":"https://v2.dataos.info/releasenotes/august-2026"},{"q":"During an incident, a Tenant Admin sees that every workflow in the Tenant fails. `dataos-ctl resource get` shows that Compute and Stacks are healthy, and the Instance Status page is green. What is the documented next step?","options":["Escalate to the Operator because the Data Plane must be down","Grant all developers `Can Edit` on the shared Compute","Restart the Data Plane with `dataos-ctl domain apply`","Direct developers to their product runs and logs, because Tenant resources are healthy"],"answer":3,"explain":"The Tenant Admin monitoring guide says this: if Tenant Resources are healthy, send developers to their runs and logs. If the whole Tenant looks down, escalate to the Operator. A `Can Edit` grant does not fix runtime failures.","source":"https://v2.dataos.info/operate/tenant-admin/monitoring"}]},{"id":"e5","title":"Engine Mastery","track":"Advanced Engineering & AI","duration":"2 h 30 min","objectives":["Select an engine and a Trino deployment shape from the model kinds, casing rules, state store and serving limits that the design needs","Give least-privilege grants on the engine and in DataOS with the three-role pattern and a separate scanner principal","Predict the native operation that each model kind produces on an engine, and avoid the materialization traps of each engine","Diagnose common failures and apply the documented tuning order for each engine","Tune a Nilus pipeline with the measurement loop, file-size heuristics and CDC heap rules"],"lessons":[{"title":"Choosing an engine: the adapter matrix and Trino shapes","body":"### Why engine choice is an architecture decision\n\nEvery Vulcan Data Product follows the same pattern on every engine. A gateway connects to the engine. `model_defaults.dialect` tells Vulcan which SQL dialect you write in. Models compile to native engine SQL. A scheduled workflow plans and runs them. A serving layer exposes REST, GraphQL and, where the engine supports it, SQL-wire endpoints. Five things change from engine to engine: the supported model kinds, the identifier-casing rule, the authentication method, the location of Vulcan state, and the operational ceilings. At expert level, you must be able to look at a workload and predict which of those differences will cause problems.\n\n### The adapter matrix\n\n| Engine | Adapter / dialect | Choose it when | Watch out for |\n| --- | --- | --- | --- |\n| Snowflake | `snowflake` / `snowflake` | Data already lands in Snowflake, elastic per-query compute, SQL + Snowpark | UPPERCASE identifiers. Dynamic Tables (`MANAGED`) and masking/row policies need Enterprise+ |\n| Databricks | `databricks` / `databricks` | Unity Catalog Delta tables on a SQL warehouse | State cannot live in the warehouse, so an external Postgres `state_connection` is mandatory. The UC catalog must already exist |\n| Spark | `spark` / `spark2` | Iceberg lakehouse on S3/ABFSS, big batch, multi-year backfills | No `VIEW` kind on the lakehouse path, single catalog, `vde: true` rejected, not a sub-second serving engine |\n| Trino | `trino` / `trino` | Federating several catalogs, materializing into a lakehouse | Lowercase identifiers, no Python models, views run with definer rights |\n| Postgres | `postgres` / `postgres` | Smaller products, full DB control, no cold start | Lowercase folding, no elastic scale-out, no cross-database queries |\n| SQL Server | `mssql` / `tsql` | Existing SQL Server / Windows estates | Bare `VARCHAR` means `VARCHAR(1)`. No `MANAGED` kind or table cloning |\n| Microsoft Fabric | `fabric` / `fabric` | Fabric Warehouse SQL endpoint with Entra auth | Community-supported adapter, Warehouse only (no Lakehouse/OneLake), no indexes or explicit transactions |\n| Redshift | `redshift` / `redshift` | AWS warehouse with SQL `GRANT`-based access | Set `dialect: redshift`, not `postgres`. Run `ANALYZE` after large loads |\n| Athena | `athena` / `athena` | Serverless pay-per-scan SQL over Glue/S3 | No SQL `GRANT`. Access is through IAM/Lake Formation. Requires `s3_warehouse_location` and `s3_staging_dir` |\n\n> **Note:** The September 2026 release notes describe the Athena and Redshift engine stacks as **beta**. Their engine-guide pages describe the SQL path as GA. Treat them as beta for production commitments until your platform team tells you otherwise.\n\n### Model-kind support is not uniform\n\nThe supported kinds differ more than most teams expect:\n\n* **Snowflake**: `FULL`, `SEED`, `VIEW`, all three incrementals, `MANAGED`, `SCD_TYPE_2`, `SCD_TYPE_2_BY_TIME`, `SCD_TYPE_2_BY_COLUMN`.\n* **Postgres** and **SQL Server/Fabric** add `INCREMENTAL_UNMANAGED` and `EMBEDDED`. Python models on these engines materialize an in-process Pandas DataFrame and cannot use `VIEW`, `EMBEDDED`, `SEED` or `MANAGED`.\n* **Databricks**: `FULL`, `VIEW`, the three incrementals and `SCD_TYPE_2`.\n* **Spark**: `FULL`, `SEED`/`EMBEDDED`, `INCREMENTAL_BY_TIME_RANGE`, `INCREMENTAL_BY_PARTITION`, `INCREMENTAL_BY_UNIQUE_KEY` (only with Iceberg `physical_properties`), and `SCD_TYPE_2`.\n* **Trino**: `VIEW`, `FULL`, `SEED`, `INCREMENTAL_BY_TIME_RANGE`, `INCREMENTAL_BY_PARTITION`. Trino has no Python models and no `INCREMENTAL_BY_PARTITION` on Postgres catalogs.\n* **Redshift** and **Athena**: `FULL`, `VIEW` and the three incrementals. You must validate Python models for each image.\n\nIf your design needs an SCD2 dimension, that requirement alone rules out Trino, Redshift and Athena.\n\n### Trino has three deployment shapes\n\nAll three shapes run the same model, semantic, metric and DQ code. Only `config.yaml`, the deploy resource and the secrets change.\n\n| Shape | Who owns the cluster | How you connect | Kinds you can materialize |\n| --- | --- | --- | --- |\n| Dedicated | Vulcan provisions a coordinator and workers per product | `spec.engine: trino` **with** a `spec.trino` block. Vulcan generates catalogs from `spec.depots[]`, and the first depot is the write target | `VIEW`, `FULL`, `SEED`, incrementals |\n| Minerva (shared) | DataOS platform team | `spec.engine: trino` **without** `spec.trino`. A secret projects the endpoint and the API-key password | `VIEW` only |\n| External | You, outside DataOS (Starburst, self-hosted) | Gateway points at the coordinator host and port, with `vde: false` | `VIEW`, `FULL`, `SEED`, incrementals |\n\nThe Minerva restriction surprises many people. If you need `FULL` or incremental materialization on Trino, you need a dedicated or external cluster.\n\n### Casing and state: two silent failure sources\n\nSnowflake, Spark and Databricks semantics expect **UPPERCASE** identifiers (alias raw lowercase Databricks columns to UPPERCASE in staging). Postgres, Trino, Redshift and Athena fold to **lowercase** or follow physical casing. A lowercase dimension on Snowflake produces `object does not exist`. The same mistake on Databricks produces `column not found`.\n\nVulcan state (plans, snapshots, intervals) needs a transactional store. Databricks requires an external Postgres `state_connection`. On Spark and Trino, use DuckDB locally and the platform-provisioned Postgres in production. If the docs say that the platform wires the production state connection, do not put it in the project `config.yaml`.\n\n### A decision sequence\n\n1. Where does the data already land? Start there. DataOS runs over the warehouse or lakehouse that you already own.\n2. Which model kinds does the design need (SCD2, unique-key upserts, managed tables)?\n3. What is the serving SLO? Spark and federated Trino are batch-shaped. For sub-second surfaces, pre-aggregate or pick a lower-latency engine.\n4. Who owns compute? Shared Minerva is cheap but supports only `VIEW`. With dedicated Trino, you own JVM sizing.\n5. What is the cost model? Warehouse credits, DBUs, RPUs, or bytes scanned on Athena.","sources":["https://v2.dataos.info/references/engine-guide/engine-guide","https://v2.dataos.info/references/engine-guide/trino-1","https://v2.dataos.info/references/engine-guide/trino-1/minerva-1","https://v2.dataos.info/references/engine-guide/trino-1/external-trino","https://v2.dataos.info/references/engine-guide/spark-1","https://v2.dataos.info/references/engine-guide/databricks","https://v2.dataos.info/references/engine-guide/microsoft-fabric","https://v2.dataos.info/references/engine-guide/athena","https://v2.dataos.info/references/engine-guide/redshift","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Grants and materialization behavior across engines","body":"### One pattern, many grant dialects\n\nEvery engine guide opens with an **Authorize** stage, and every guide uses the same three-role pattern. Do not merge the roles:\n\n| Role | Purpose |\n| --- | --- |\n| Admin role | Provisions warehouses/clusters/catalogs, resource monitors, policies. Runs once. |\n| Vulcan service role | The identity Vulcan connects as. Reads sources, creates and writes target schemas. |\n| Consumer role | Reads published outputs through endpoints. No write access. |\n\nAdd a fourth role, the **read-only scanner principal**, for metadata scanning. The cross-engine rules state that you must not reuse the Vulcan service role for scanning.\n\n### The DataOS side is identical on every engine\n\n| Permission | What it allows |\n| --- | --- |\n| Tenant access | Build and manage Data Products in the tenant |\n| `roles:id:data-dev` (or your tenant's equivalent) | Create and apply Vulcan resources. Find the role in the **TAGS** column of `dataos-ctl user get` |\n| `depot:rw:<depot>` / `depot:r:<depot>` | Read-write for the build, read-only for consumers |\n| **Can Use** on Compute, Depots, Secrets | Resource access is deny-by-default. A role tag alone is not enough |\n| `git-sync` Secret | Lets Vulcan pull model code. Request a git-sync Secret, not raw Git credentials |\n\n### Engine-specific grants worth memorizing\n\n**Snowflake.** The service role needs `USAGE` on the warehouse and database, `CREATE SCHEMA` on the database, and `USAGE, CREATE TABLE, CREATE VIEW ON FUTURE SCHEMAS`. On the target schema it needs `SELECT, INSERT, UPDATE, DELETE, TRUNCATE` on all and future tables. `DELETE` is for incremental rebuilds (delete a time slice, then insert it again). `TRUNCATE` is for full refreshes. If DataOS manages the schema lifecycle, grant `OWNERSHIP`. Otherwise, do not grant it. The scanner needs `IMPORTED PRIVILEGES ON DATABASE SNOWFLAKE`. This grant requires `ACCOUNTADMIN`. Without it, lineage, tags and Dynamic Table history are missing. Vulcan reads the Snowflake `role` from the secret projection, not the depot spec.\n\n**Databricks (Unity Catalog).** Grant `USE CATALOG`, `CREATE SCHEMA`, `CREATE TABLE`, `CREATE VIEW` on the catalog. Schema-level `SELECT`/`MODIFY` automatically covers future objects, so there is no `FUTURE` step. The catalog in `connection.catalog` must exist before `vulcan apply`. Vulcan cannot create it.\n\n**Postgres.** Grant `CONNECT` and `CREATE` on the existing database. Grant `USAGE`/`SELECT` and `ALTER DEFAULT PRIVILEGES` on source schemas. The database must exist, and all sources must be in that one database.\n\n**SQL Server.** The service login gets `db_ddladmin`, `db_datareader`, `db_datawriter` and `GRANT CREATE SCHEMA`. Consumers and the scanner get `db_datareader`.\n\n**Fabric.** Authorization is a Fabric **workspace role**: Contributor (or higher) for the Entra service principal, Viewer for consumers and the scanner.\n\n**Redshift.** Grant `USAGE` and `CREATE` on target schemas, and add table grants. The adapter supports SQL `GRANT` for consumer roles.\n\n**Athena.** There is no SQL `GRANT`. The service principal needs IAM actions on Athena (`StartQueryExecution`, `GetQueryResults`, ...), Glue (`GetTable`, `CreateTable`, ...). It also needs S3 access on both the staging and warehouse prefixes.\n\n**Spark.** The lakehouse depot owns the storage credentials. On its backing storage, grant `s3:GetObject/PutObject/DeleteObject/ListBucket` or **Storage Blob Data Contributor** on ABFSS.\n\nThe minimum-permissions references organize grants into `secret_name` tiers, for example `snowflake-semantic-readonly`, `snowflake-single-db-full` and `snowflake-cross-db-full`. Pick the narrowest tier that the topology allows.\n\n### Materialization: know the operation before you run it\n\n| Kind | Snowflake | Databricks | Spark/Iceberg | Postgres | SQL Server | Fabric |\n| --- | --- | --- | --- | --- | --- | --- |\n| `FULL` | `CREATE OR REPLACE TABLE` | `INSERT OVERWRITE` | `INSERT OVERWRITE` | `DROP` + `CREATE` + `INSERT` | `SELECT * INTO`, then `TRUNCATE` + `INSERT` | `SELECT * INTO`, then delete-and-insert |\n| `INCREMENTAL_BY_TIME_RANGE` | delete window + insert | overwrite partition | overwrite partition | delete window + insert | delete + insert | `DELETE_INSERT`, no transaction |\n| `INCREMENTAL_BY_UNIQUE_KEY` | `MERGE` | `MERGE` | Iceberg `MERGE INTO` | native `MERGE` on 15+ | native `MERGE` | native `MERGE` |\n\nEngine traps that follow from this table:\n\n* **Spark**: Without `physical_properties(format = 'iceberg')`, a unique-key model silently does nothing, or it inserts instead of upserting. Align `grain` with `unique_key`.\n* **Fabric**: Time-range and partition overwrites are a `DELETE` and then an `INSERT`, with no transaction around them. Thus overlapping runs can race. `concurrencyPolicy: Forbid` is mandatory, not optional. Column type changes trigger a four-step rewrite (add, cast, drop, `sp_rename`).\n* **SQL Server**: To skip identical updates, set `mssql_merge_exists = true` in `physical_properties`. Do not set it on tables with `GEOMETRY`, `XML`, `TEXT`, `NTEXT` or `IMAGE` columns.\n* **Trino**: `virtual_properties (creatable_type = SECURE)` is Snowflake-only. Trino returns a syntax error at apply time. Trino views run with the Vulcan principal's rights, so never treat a view as an access-control boundary.\n\n### Guard lifecycle DDL\n\nBy default, `vulcan plan` executes `pre_statements`, `post_statements`, `before_all` and `after_all`. Wrap DDL that must run only during real evaluation:\n\n```sql\n@IF(@runtime_stage = 'evaluating',\n  ALTER TABLE myproj.gold.orders CLUSTER BY (order_date, nation_name)\n);\n```\n\nThe same guard pattern applies to Databricks `OPTIMIZE ... ZORDER BY`, Postgres `CREATE INDEX` and SQL Server triggers.","sources":["https://v2.dataos.info/references/engine-guide/snowflake/permissions-and-grants","https://v2.dataos.info/references/engine-guide/databricks/permissions-and-grants","https://v2.dataos.info/references/engine-guide/postgres/permissions-and-grants","https://v2.dataos.info/references/engine-guide/sql-server/permissions-and-grants","https://v2.dataos.info/references/engine-guide/microsoft-fabric/permissions-and-grants","https://v2.dataos.info/references/engine-guide/athena/permissions-and-grants","https://v2.dataos.info/references/engine-guide/spark-1/permissions-and-grants","https://v2.dataos.info/references/engine-guide/snowflake/materialization-behavior","https://v2.dataos.info/references/engine-guide/sql-server/materialization-behavior","https://v2.dataos.info/references/engine-guide/trino-1/capabilities-and-limitations","https://v2.dataos.info/references/resources/vulcan/roles-and-permissions/snowflake-minimum-permissions"]},{"title":"Limits, performance and troubleshooting","body":"### Two bottlenecks, two levers\n\nOne rule repeats in every engine guide: **API replicas and engine compute are different bottlenecks.** The Vulcan API is stateless. For request concurrency, add replicas (1-2 for one team, 3-5 for multi-team dashboards, 5+ for high volume). For query execution, add warehouse size, executors or Trino workers. The API buffers results of up to about 50,000 rows in memory. Thus keep `api.resources.limits.memory` near 3 GiB and never below 1.5 GiB (Spark recommends at least 2 GiB). Use the plural `resources`/`requests`/`limits` keys. The singular forms still load. But they emit deprecation warnings from September 2026.\n\n```yaml\napi:\n  replicas: 2\n  resources:\n    requests: { cpu: \"200m\", memory: \"512Mi\" }\n    limits:   { cpu: \"2000m\", memory: \"2Gi\" }\n```\n\n### Scheduling rules that apply everywhere\n\nSchedule runs after upstream data lands. Set `timezone: UTC`. Set the end of the schedule 1-2 years in the future. Use `concurrencyPolicy: Forbid`. An expired end date stops the workflow **silently**. Forbid prevents overlapping Iceberg commits on Spark, connection pile-ups on Postgres, MERGE deadlocks on SQL Server and the DELETE/INSERT race on Fabric.\n\n### Engine-specific tuning order\n\n**Snowflake.** Size warehouses by workload: X-SMALL/SMALL for dev, LARGE/X-LARGE for the first backfill, MEDIUM for daily incrementals, one size up for Snowpark. Set `MAX_CONCURRENCY_LEVEL` to 8 for runs, or 12-16 with a live semantic API. Keep `concurrent_tasks` at or below `MAX_CONCURRENCY_LEVEL / 3`. Cap spend with a resource monitor and statement timeouts. Tag queries with `ALTER SESSION SET QUERY_TAG = 'vulcan:<project>:<model>'`. Cross-join-shaped semantic queries can run 30 times slower, so fix the SQL shape first.\n\n**Spark.** Executor parallelism is approximately `executor.cores x executor.instances`. The tuning order is: `spark.sql.shuffle.partitions`, AQE plus coalescing, skew-join handling, `spark.sql.files.maxPartitionBytes`, executor memory/instances, then Iceberg `commit.retry.*`. Driver and executor sizing is under `spec.workflow.resources.driver` and `.executor`. `spec.workflow.sparkConf` tunes migrate/plan/run. `spec.sparkConf` tunes the separate Spark session of the API track. Python models must return Spark DataFrames. `toPandas()` on large outputs causes driver OOM.\n\n**Dedicated Trino.** The most common deployment failure is an unmanaged JVM heap. Set `-Xmx` in `trinoServerConfig.jvmConfig` for the coordinator and the workers, below the pod memory limit. The reference is `-Xmx4G` with a `4Gi` limit. Vulcan does not render autoscaling, so set `spec.trino.workers.replicas`. Keep `retry-policy=NONE`, because no exchange manager is deployed. Add workers, not coordinators. Any `configProperties` block replaces the validated default. Thus add memory caps and timeouts only after you test them.\n\n**Postgres / SQL Server.** These engines have no cold start, but they also have no elastic scale. The fix order is: remove cross-join queries, index hot filter and join columns, add a pooler such as PgBouncer, add a read replica, and size up last. Each API replica uses connections. Size `max_connections` for workers, replicas and BI together.\n\n**Athena.** Athena bills by bytes scanned. Set a bytes-scanned limit on every workgroup. Use separate workgroups for build work and interactive work. If a query times out, fix partitions and filters. Do not raise the limits.\n\n**Redshift.** Align `concurrent_tasks` with WLM queue slots. Set `statement_timeout` and `query_group` in `before_all`, and reset them in `after_all`. Run `ANALYZE` after large loads.\n\n> **Note:** Spark cluster CPU and memory in Lakehouse resource manifests moved from `sparkCluster.server` to `sparkCluster.resources` in September 2026. If both are set, `resources` wins. This change applies to the Lakehouse resource, not to the Vulcan Spark workflow block.\n\n### A shared troubleshooting vocabulary\n\nMost failure tables share the same rows. Learn the cause once:\n\n| Symptom | Usual cause | Fix |\n| --- | --- | --- |\n| `vulcan plan` runs DDL | Unguarded lifecycle SQL | `@IF(@runtime_stage = 'evaluating', ...)` |\n| `Table not found` for a source | External or cross-catalog table not declared | Add it to `inputs.yaml` with the fully qualified name |\n| Incremental reprocesses all history | Wrong `time_column` or no interval-macro filter | Fix the kind configuration. Filter with the interval macros |\n| `Depot not resolvable` | Depot name mismatch | Match `dataos://<depot>?purpose=rw` to the depot manifest |\n| Duplicate apply skipped | Stale state | New `state_schema`, then `vulcan migrate` (dev only) |\n| Endpoint OOM | API memory below 1.5 GiB | Raise to 3 GiB |\n| Workflow stopped | Expired end date | Update it and re-apply |\n\nLearn to recognize these engine-specific signatures:\n\n* `NameError: 'col' is not defined`: Snowpark imports at module scope. Import inside `execute()`.\n* `NO_SUCH_CATALOG_EXCEPTION`: the Databricks catalog is missing.\n* `CommitFailedException`: concurrent Iceberg writers.\n* A cluster that forms with 0 workers: the Trino heap.\n* `String or binary data would be truncated`: a bare `VARCHAR` on SQL Server.\n* `ItemDisplayNameNotAvailableYet`: the Fabric warehouse was recreated too soon.\n* `s3_warehouse_location was expected`: the Athena configuration.\n\n### Recovery procedures\n\nTime-range incrementals are safe to re-run because they overwrite the window. `vulcan run --rebuild <model>` rebuilds one drifted model. `vulcan rollback <plan_id>` replays an earlier plan. On Spark and Athena, a rollback uses compute and creates new snapshots or scan charges, so it is not free. If a unique-key MERGE committed bad data on Iceberg, restore it with Iceberg snapshot rollback. Do this together with the platform SRE team.","sources":["https://v2.dataos.info/references/engine-guide/snowflake/limits-and-performance","https://v2.dataos.info/references/engine-guide/spark-1/limits-and-performance","https://v2.dataos.info/references/engine-guide/trino-1/dedicated-cluster","https://v2.dataos.info/references/engine-guide/postgres/limits-and-performance","https://v2.dataos.info/references/engine-guide/athena/limits-and-performance","https://v2.dataos.info/references/engine-guide/redshift/limits-and-performance","https://v2.dataos.info/references/engine-guide/spark-1/troubleshooting","https://v2.dataos.info/references/engine-guide/databricks/troubleshooting-databricks","https://v2.dataos.info/references/engine-guide/spark-1/recipes/deployment-recipes","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Nilus pipeline optimization","body":"### Optimize only with a symptom\n\nNilus pipeline optimization is a measured change toward one of three outcomes: shorter runtime, lower resource use, or a better destination layout. The docs select the start point by symptom:\n\n| Symptom | Start with |\n| --- | --- |\n| Pipeline takes too long | Optimizing for time |\n| Too much CPU or memory, OOMKilled | Optimizing for resource |\n| CDC lag, snapshot OOM, Debezium heap pressure | Optimizing CDC |\n| Too many files, poor partitioning, costly queries | Optimize sink datasets |\n| Failures or unexpected data | Troubleshooting (read the error first) |\n\n### The measurement loop\n\n1. Capture the current run: status, duration, records processed, CPU, memory, source, destination, config.\n2. Pick **one** hypothesis: extraction, load, destination layout, source throttling or resource pressure.\n3. Change one knob.\n4. Re-run the same workload.\n5. Compare duration, throughput, cost and destination correctness.\n6. Keep the change only if it improves the symptom and does not hide a correctness problem.\n\n### The knobs and where they live\n\n| Knob | Placement | Default | Use for |\n| --- | --- | --- | --- |\n| `page_size` | `source.options` | 50000 | The in-memory writer buffer, and the largest user of extraction memory |\n| `extract_parallelism` | `source.options` | 5 | Concurrent extraction workers, each with its own page buffer |\n| `loader_file_size` | `sink.options` | 100000 rows | Rows per output file |\n| `partition_by`, `cluster_by` | `sink.options` | unset | Destination query pruning and locality |\n| `DATA_WRITER__FILE_MAX_BYTES` | runtime env | 128 MB | Per-file byte cap, the primary Iceberg file-size lever |\n| `LOAD__WORKERS` | runtime env | ~5 | Loader concurrency, the biggest write-throughput knob |\n| `NORMALIZE__WORKERS` | runtime env | ~1 | Normalization concurrency. Keep it low, and at the default on CDC |\n| `NILUS_JVM_HEAP_PERCENT` | runtime env | 25 | CDC only: share of pod memory for the Debezium JVM |\n\nYou project runtime variables through `spec.use.projection.projections.envVars`:\n\n```yaml\nspec:\n  type: batch\n  compute: <compute-name>\n  use:\n    projection:\n      projections:\n        envVars:\n          - key: DATA_WRITER__FILE_MAX_BYTES\n            template: \"536870912\"\n          - key: LOAD__WORKERS\n            template: \"16\"\n  source:\n    address: dataos://<source-depot>?purpose=rw\n    options:\n      source_table: \"dbo.events\"\n      page_size: 100000\n  sink:\n    address: dataos://<lakehouse-depot>?purpose=rw\n    options:\n      dest_table: \"analytics.events\"\n      incremental_strategy: append\n```\n\n> **Warning:** Both `source.options` and `sink.options` are `additionalProperties: false` in the stack schema. An unknown key, or a correctness key in the wrong section (for example `incremental_strategy` under `source.options`), fails YAML validation. Set runtime-only flags such as `SCHEMA_NAMING` as environment variables.\n\n### The sizing playbook\n\n1. **Baseline** with defaults and conservative compute. If the pod is OOMKilled, lower `extract_parallelism`, `LOAD__WORKERS` and `page_size` (to 25k). Keep `loader_file_size` large.\n2. **Size files first.** Calculate `row_bytes ~= raw_table_size_bytes / total_rows`. Target 128-512 MB Parquet files. Calculate `loader_file_size ~= target_file_bytes / row_bytes`. Calculate `expected_files = ceil(total_rows / loader_file_size)`, and aim for 20-200 files on a very large table.\n3. **Bound memory** with `page_size x row_bytes`. Start at 50k-100k, and drop to 25k-50k for wide rows.\n4. **Set parallelism** near 60-80% of allocatable vCPU for `extract_parallelism` and `LOAD__WORKERS`.\n5. **Validate on a slice** with `sql_limit` or a tight `interval_start`/`interval_end`. Never use `sql_limit` as a production speed fix.\n6. **Iterate by bottleneck**. For a long commit tail, raise `loader_file_size`. For low CPU and long runtime, raise parallelism. For source throttling, lower parallelism or `page_size`. For memory spikes, lower parallelism first.\n7. **Partition last**, and align partitions with consumer filters. `type: identity` on a high-cardinality column creates too many partitions. Use `type: bucket` with a sensible `bucket_count`.\n\n### Lakehouse (Iceberg) loads\n\nFile size has the largest effect on large Iceberg loads. If people query the table, keep files at or below 512 MB. This size keeps the file-level statistics for pruning. Go to 2 GB only for wide write-only archives. On **wide** tables, defaults are almost as fast as a tuned run. On **narrow, high-row-count** tables, defaults can be 34 minutes to nearly two hours slower. When time matters, do not resource-optimize narrow tables. Do not run a full-table `merge` on very large Lakehouse tables. Load only the changed rows in each run.\n\n### CDC is a two-runtime pod\n\nA CDC pod splits memory between the Debezium JVM and Nilus/dlt. The JVM holds the change-event queue. Nilus/dlt does the extract, normalize and load work. The JVM max heap is `pod_memory_limit x NILUS_JVM_HEAP_PERCENT / 100`. The tested high-volume reference is a 12 GiB / 2000m pod with the heap at 30%. It sets `max.batch.size: 500000` / `max.queue.size: 700000` under `spec.source.cdc` and keeps the dlt worker env vars at their defaults. These rules follow:\n\n* Size the pod first. The heap percent is only a share of it.\n* Never raise `max.queue.size` unless you also raise the heap or the pod memory. The queue lives on the heap.\n* If destination writes OOM while the JVM log shows a healthy heap, **lower** the heap percent.\n* `NORMALIZE__WORKERS=20` on CDC caused clean-exit restarts in testing.\n* Make sure that the log line `Configured JVM MaxRAMPercentage=30%` shows the setting.","sources":["https://v2.dataos.info/references/resources/nilus/pipeline-optimization","https://v2.dataos.info/references/resources/nilus/pipeline-optimization/optimizing-for-time","https://v2.dataos.info/references/resources/nilus/pipeline-optimization/optimizing-for-resource","https://v2.dataos.info/references/resources/nilus/pipeline-optimization/optimize-sink-datasets","https://v2.dataos.info/references/resources/nilus/pipeline-optimization/optimize-sink-datasets/optimize-shape-knobs","https://v2.dataos.info/references/resources/nilus/pipeline-optimization/optimizing-cdc"]}],"lab":{"title":"Engine readiness review and a measured Nilus tuning pass","goal":"Write a readiness report for one Vulcan engine that covers grants, casing, lifecycle-DDL guards and API sizing. Also record the before and after state of one Nilus pipeline tuning change that you make with the measurement loop.","duration":"75 min","prereqs":["You completed the Intermediate track, and orders-analytics is built and deployed on any engine","`roles:id:data-dev` (or tenant equivalent) and Can Use on the target Compute, Depot and Secret","An existing Nilus batch pipeline writing to a Lakehouse depot (placeholder name `<pipeline-name>`)","Access to the engine's SQL console with the Vulcan service identity"],"steps":["**Confirm DataOS access.** Run `dataos-ctl user get`. Make sure that the **TAGS** column shows your developer role tag. Then make sure that you have depot, stack and compute access:\n```bash\ndataos-ctl get depot\ndataos-ctl resource get -t compute -a\n```\nRecord each missing **Can Use** grant. You cannot fix it yourself.","**Verify engine-side grants with the documented health checks.** Run the health check for your engine as the Vulcan service identity. For Postgres:\n```sql\nSELECT current_user, current_database(), current_schema();\nSELECT count(*) AS conns, state\nFROM pg_stat_activity\nWHERE datname = current_database()\nGROUP BY state;\n```\nFor Snowflake, inspect recent Vulcan activity:\n```sql\nSELECT query_id, query_text, execution_status,\n       total_elapsed_time / 1000 AS seconds, warehouse_name\nFROM snowflake.account_usage.query_history\nWHERE query_tag LIKE 'vulcan:%'\n  AND start_time > DATEADD(hour, -2, CURRENT_TIMESTAMP())\nORDER BY start_time DESC\nLIMIT 50;\n```\nFor Databricks: `SELECT current_user() AS user, current_catalog() AS catalog, current_schema() AS schema;`","**Audit identifier casing.** Open every semantic YAML file in orders-analytics. Make sure that identifiers follow the engine rule: UPPERCASE on Snowflake/Spark/Databricks, lowercase on Postgres/Trino, physical casing on Redshift/Athena. Fix each mismatch. Run `vulcan plan`. Make sure that no `object does not exist` / `column not found` errors occur.","**Audit lifecycle DDL.** Search `pre_statements`, `post_statements`, `before_all` and `after_all` for DDL. Wrap each statement that must run only on real execution:\n```sql\n@IF(@runtime_stage = 'evaluating',\n  CREATE INDEX IF NOT EXISTS ix_orders_customer ON sales.orders (customer_id)\n);\n```\nRun `vulcan plan`. Make sure that the DDL does not execute during the plan.","**Check API sizing and deprecated keys.** Open the `deployment:` block of `config.yaml`. Make sure that the resource keys are plural (`resources`, `requests`, `limits`). Make sure that the API memory limit is at least 1.5 GiB, with a target of 3 GiB. Make sure that the schedule uses UTC and Forbid. Lint the rendered manifest:\n```bash\nvulcan create_deploy_yaml -o - | dataos-ctl resource apply --in -l\n```","**Baseline the Nilus pipeline.** For the last run of `<pipeline-name>`, record status, duration, records processed, peak CPU/memory and destination file count:\n```bash\ndataos-ctl resource get -t nilus -n <pipeline-name>\n```","**Compute a file-size hypothesis.** Estimate `row_bytes = raw_table_size_bytes / total_rows`. Choose a target file size of 128-512 MB. Calculate `loader_file_size = target_file_bytes / row_bytes`. Calculate `expected_files = ceil(total_rows / loader_file_size)`. Write the numbers in your report.","**Validate on a slice.** Add `sql_limit: 100000` under `source.options`, and only there. Apply the pipeline with `dataos-ctl resource apply -f <pipeline-file>.yaml`. Make sure that memory headroom and file count are acceptable. Then remove `sql_limit`. It is a sampling knob, not a production setting.","**Change exactly one knob.** Apply your calculated `loader_file_size` under `sink.options`. For a wide Iceberg table, set `DATA_WRITER__FILE_MAX_BYTES` through `spec.use.projection.projections.envVars` instead. Run the same workload again. Record the same metrics as the baseline.","**Decide.** Keep the change only if duration or cost improved and the destination row count and schema did not change. Write down the decision and the next hypothesis to test."],"verify":"Your report contains five items. (1) The results of the DataOS permission check. (2) The output of the engine health check. (3) A list of casing fixes and guarded DDL statements, with a clean `vulcan plan`. (4) A lint-clean `create_deploy_yaml` render that uses plural resource keys. (5) A before/after table for the Nilus pipeline. The table shows exactly one changed knob, matching row counts, and a keep/revert decision. `sql_limit` must not remain in the committed pipeline manifest.","sources":["https://v2.dataos.info/references/engine-guide/engine-guide","https://v2.dataos.info/references/engine-guide/postgres/troubleshooting","https://v2.dataos.info/references/engine-guide/snowflake/troubleshooting","https://v2.dataos.info/references/resources/nilus/pipeline-optimization","https://v2.dataos.info/references/resources/nilus/pipeline-optimization/optimizing-for-time","https://v2.dataos.info/build/productize/git-and-deploy"]},"takeaways":["Model-kind support, identifier casing and the location of the state store are different on each engine. Make sure that you know all three before you commit to a design","Minerva supports only VIEW. FULL and incremental materialization on Trino needs a dedicated or external cluster","Use the three-role pattern and a separate read-only scanner. DataOS resources are deny-by-default until you get the Can Use grant","Guard lifecycle DDL with `@IF(@runtime_stage = 'evaluating', ...)`. If you do not, `vulcan plan` will execute it","API replicas fix request concurrency. Warehouse size, executors or workers fix query execution","Tune Nilus one knob at a time, and size files first. For CDC, the pod memory is split between the JVM and dlt"],"quiz":[{"q":"A team must build an SCD Type 2 customer dimension. To avoid paying for dedicated compute, they want to run it on the shared Minerva cluster. What is the correct assessment?","options":["Minerva supports only the `VIEW` kind and Trino does not list SCD2 at all, so they need an engine that supports `SCD_TYPE_2` such as Snowflake, Postgres or Spark","It works if they set `vde: true` on the Trino gateway","It works on Minerva as long as the deploy resource includes a `spec.trino` block","It works on Minerva but only with `INCREMENTAL_BY_UNIQUE_KEY`"],"answer":0,"explain":"Minerva materializes only `VIEW` models, and no Trino shape lists SCD2 among its supported kinds. If you add `spec.trino`, it becomes a dedicated cluster, which also has no SCD2. Do not set `vde: true` for Trino.","source":"https://v2.dataos.info/references/engine-guide/trino-1/minerva-1"},{"q":"A Spark model declared as `INCREMENTAL_BY_UNIQUE_KEY (unique_key c_custkey)` plans and runs without error, but no rows are ever updated. What is the most likely fix?","options":["Switch the gateway to `vde: true`","Raise `spark.sql.shuffle.partitions`","Add `physical_properties(format = 'iceberg')` (or `table_format iceberg`) so the model compiles to Iceberg `MERGE INTO`","Convert the model to `kind VIEW`"],"answer":2,"explain":"On the Spark lakehouse path, unique-key upserts require the Iceberg format. Without it, the model silently does nothing, or it inserts instead of upserting. Spark rejects VDE, and the lakehouse path does not support VIEW.","source":"https://v2.dataos.info/references/engine-guide/spark-1/materialization-behaviour"},{"q":"On Microsoft Fabric, a failed time-range run left a table with rows deleted but not re-inserted. Why is this more likely on Fabric than on most engines, and what prevents it from happening again?","options":["Fabric uses `MERGE` for time ranges. Switch to `INCREMENTAL_BY_UNIQUE_KEY`","Fabric needs `mssql_merge_exists = true` on every model","Fabric has no indexes. Add `CREATE INDEX` in `post_statements`","The DELETE_INSERT strategy of Fabric runs as separate statements with no explicit transaction. Re-run the window and enforce `concurrencyPolicy: Forbid` so runs never overlap"],"answer":3,"explain":"Fabric replaces the insert-overwrite strategy with DELETE_INSERT and does not support explicit transactions. Thus Fabric does not roll back a run that fails partway. A new run processes the window again. Forbid stops the DELETE of a second run from racing the INSERT of the first run. Fabric does not support index DDL at all.","source":"https://v2.dataos.info/references/engine-guide/microsoft-fabric/materialization-behavior"},{"q":"A dedicated Trino deployment applies cleanly, but the cluster forms with 0 workers and the plan pod hangs. What must the engineer look at first?","options":["That autoscaling is enabled under `spec.trino.workers`","That `-Xmx` is set explicitly in `trinoServerConfig.jvmConfig` for coordinator and workers and fits under the pod memory limit","That `retry-policy` is set to `TASK`","That the deploy resource uses `type: vulcan-trino`"],"answer":1,"explain":"The most common documented failure is an unmanaged JVM heap that is larger than the pod limit. Workers then OOM or never register. Vulcan does not render autoscaling. Fault-tolerant retry needs an exchange manager, and none is deployed. The resource type is always `vulcan` with `spec.engine: trino`.","source":"https://v2.dataos.info/references/engine-guide/trino-1/dedicated-cluster"},{"q":"A high-volume MongoDB CDC pipeline on a 12 GiB pod shows growing lag, and CPU is low. The engineer raised `max.queue.size` to 700000 and left everything else at defaults. Now the pod shows Java heap OOM. What is the documented correction?","options":["Set `NORMALIZE__WORKERS` to 20 to drain the queue faster","Set `NILUS_JVM_HEAP_PERCENT` near 100 so the queue fits","Raise the heap to the tested 30% with the large queue (`max.batch.size: 500000`), and keep dlt worker env vars at defaults","Lower `page_size` to 10000"],"answer":2,"explain":"The queue lives on the JVM heap. If you raise it without heap headroom, the pod OOMs. The tested reference pairs 12 GiB, 30% heap and 500000/700000. A higher NORMALIZE__WORKERS caused clean-exit restarts. A heap near 100% leaves no memory for Nilus/dlt.","source":"https://v2.dataos.info/references/resources/nilus/pipeline-optimization/optimizing-cdc"}]},{"id":"e6","title":"Advanced Vulcan Patterns","track":"Advanced Engineering & AI","duration":"2 h 45 min","objectives":["Compose a downstream Data Product on upstream outputs through an `inputs.yaml` contract","Configure model defaults, variables, overrides, usage and agreement files for multi-team projects","Write production-grade Python and Spark ML models with explicit schemas, dependencies and safe fallbacks","Gate runs on data readiness with signals and route plan/run failures to Slack, Teams or email","Implement SCD Type 2 history and role-based column masking with standalone policies"],"lessons":[{"title":"Composing products and configuration depth","body":"### Reuse before you rebuild\n\nThe first advanced pattern is restraint: look in the catalog before you build. If an upstream product already publishes trusted outputs, a downstream product reads them as **read-only inputs**. It does not copy the SQL. The upstream product (for example `customer-orders`, `source_aligned`) owns facts and dimensions. The downstream product (`customer-insights`, `consumer_aligned`) declares those outputs in `inputs.yaml` and transforms them. It then publishes its own semantics and metrics. Each product keeps its own outputs, state and deployment.\n\n```yaml\n- name: '\"warehouse\".\"customer_orders\".\"order_facts\"'\n  columns:\n    order_id: INT\n    customer_id: INT\n    order_date: DATE\n    status: TEXT\n    net_revenue: DECIMAL(12, 2)\n```\n\n`inputs.yaml` is the contract. Vulcan validates downstream SQL against it and records cross-product lineage. Thus the downstream graph has external lineage to the upstream product and internal lineage between its own models. The operating rules are:\n\n* Apply the upstream product first, then the downstream one.\n* If the upstream contract changes, update the downstream `inputs.yaml` before the next plan.\n* Use the fully qualified name exactly as the upstream product names its output.\n* Never copy upstream SQL unless you intentionally move the ownership of that logic. Copied SQL makes the two products drift apart.\n\nReuse gives more than a read of a table. The downstream product gets its **own governed query surface**. Consumers of `customer-insights` query `customer_lifetime_value` and do not need to know that the upstream product exists.\n\n### Configuration depth: config.yaml beyond the basics\n\n`config.yaml` keys are `snake_case`. Vulcan keeps the `gateways/**` subtree as written. Vulcan loads asset YAML (semantic, metric, dq, policy) **without** key conversion. Thus Vulcan silently ignores a camelCase key such as `dependsOn` and does not convert it.\n\n**`model_defaults`** is required and must set `dialect`. Three behaviors matter at scale:\n\n* **Owner enforcement.** `owner` defaults to the first `username` in `config.users`. The `owner` of every model must be a listed user, or the configuration does not load. `config.users` must contain at least one entry.\n* **Identifier normalization.** Append a strategy to the dialect, for example `dialect: \"databricks,normalization_strategy=case_sensitive\"`.\n* **Gateway-specific defaults.** A gateway can override `model_defaults`. A Postgres gateway can declare `dialect: \"snowflake,normalization_strategy=case_insensitive\"` With this setting, Snowflake-dialect models transpile to Postgres and keep Snowflake-like case behavior.\n\nThe default model kind is `VIEW` unless `kind` is set.\n\n**Variables and overrides.** Secrets come from `{{ env_var('NAME') }}`. Vulcan auto-loads a project `.env` file. To use a different file, set `--dotenv <path>` (put it **before** the subcommand) or `VULCAN_DOTENV_PATH`. Environment variables named `VULCAN__<ROOT>__<NESTED>__<FIELD>` override configuration values with the highest precedence. An example is `VULCAN__GATEWAYS__MY_GATEWAY__CONNECTION__PASSWORD`. `default_target_environment: dev_{{ user() }}` gives every developer an isolated environment.\n\n**Semantic-layer flags.** `strict_semantic_validation`, `enable_rollup`, `rollup_schema`, `allow_reciprocal_joins` and `metric_join_path` live at project level.\n\n**Consumer-facing sidecars.** `usage.yaml` (via `usage_path`) documents `good_for`, `not_for`, `caveats` (with `severity` low/medium/high), `references` and `pricing_plans`. It has no runtime effect. Vulcan reads `agreement.md` (via `agreement_path`) verbatim and shows it as the **Accept & Follow** step. If the file is missing, Vulcan logs a warning, and `GET /api/v1/metadata/agreement` returns 404.\n\n**Deployment.** The `deployment:` block drives `vulcan create_deploy_yaml`, a deterministic renderer. `repo.url`, `repo.base_dir`, `compute` and `run_as_user` are required. `engine` is required only when the gateway connection type is `depot`. Fix values in `config.yaml` and render the manifest again. Never edit the rendered manifest by hand.\n\n> **Tip:** Run production products as an ApplicationUser service identity, not a personal `run_as_user`. A personal identity breaks when the access of that person changes.","sources":["https://v2.dataos.info/build/recipes/reuse-data-products","https://v2.dataos.info/references/resources/vulcan/configurations","https://v2.dataos.info/references/resources/vulcan/configurations/model-defaults","https://v2.dataos.info/references/resources/vulcan/configurations/variables","https://v2.dataos.info/references/resources/vulcan/configurations/usage","https://v2.dataos.info/references/resources/vulcan/configurations/agreement","https://v2.dataos.info/build/productize/git-and-deploy"]},{"title":"Python models, Spark ML and custom materializations","body":"### When a Python model is justified\n\nVulcan transpiles and optimizes SQL models across engines. Use Python models only for logic that SQL cannot express: training or scoring an ML model, statistical forecasting, or complex DataFrame work. A join or `CASE WHEN` in Python loses SQL-level optimization and gives nothing in return. The engine guides give these limits. Trino does not support Python models. Postgres and SQL Server materialize an in-process Pandas DataFrame. Snowflake runs Python through Snowpark. On Databricks, Redshift and Athena, you must validate the Python path for each image.\n\n### Anatomy of a Python model\n\n```python\nimport typing as t\nfrom datetime import datetime\nimport pandas as pd\nfrom vulcan import ExecutionContext, ModelKindName, model\n\n@model(\n    \"warehouse.ml.refund_severity_monitor\",\n    columns={\n        \"ds\": \"date\",\n        \"city\": \"string\",\n        \"refund_severity_band\": \"string\",\n        \"refund_events\": \"int\",\n        \"total_refund_amount\": \"double\",\n    },\n    kind=dict(name=ModelKindName.FULL),\n    grains=[\"ds\", \"city\", \"refund_severity_band\"],\n    tags=[\"python\", \"ml\", \"monitoring\"],\n    depends_on=[\"warehouse.silver.refund_enriched\"],\n)\ndef execute(context: ExecutionContext, start: datetime, end: datetime,\n            execution_time: datetime, **kwargs: t.Any) -> pd.DataFrame:\n    table = context.resolve_table(\"warehouse.silver.refund_enriched\")\n    df = context.fetchdf(f\"SELECT * FROM {table}\")\n    if df.empty:\n        yield from ()\n        return\n    ...\n```\n\nFive rules are the most important:\n\n1. **`columns` is mandatory.** Without it, Vulcan raises `ConfigError: Python model must define column schema.` It is also the contract that Vulcan uses to create the target table.\n2. **Declare `depends_on` explicitly.** ML code often builds queries dynamically with f-strings, and static parsing does not find these dependencies.\n3. **Use the context.** `context.resolve_table(...)` maps a model name to its physical table. `context.fetchdf` returns pandas, or a PySpark DataFrame on Spark engines.\n4. **Yield, and guard empties.** If there is no data, use `yield from (); return`. An empty DataFrame with the wrong dtypes breaks the write when you yield it.\n5. **Cast once, right before yielding.** A dtype mismatch (`int32` where you declared `int`) is the most common write-time error.\n\nAdd `column_tags` to separate dimensions from predictions. Include a `model_version` column in every prediction table, so that you can trace rows to a retrain.\n\n### Imports and dependencies\n\nPut ML imports in the function body. Then Vulcan can parse the file for dependency inference, even where the library is not installed. On Snowflake, the same rule is stricter: Snowpark functions imported at module scope raise `NameError: 'col' is not defined`.\n\n| Dependency | Location | Loaded how |\n| --- | --- | --- |\n| Python wheels | `dependencies/python/` (nested folders allowed) | Importable in the Vulcan process |\n| JVM JARs | `dependencies/java/` (flat, no nested folders) | Auto-loaded for Spark driver and executors |\n\n### The Spark ML pattern: distribute when possible, degrade safely\n\nOn a Spark-backed engine, `context.spark` is a live `SparkSession`. MLlib estimators are JVM classes, so it is not sufficient to install `pyspark`. Put the MLlib JAR on the classpath through the gateway configuration.\n\n```yaml\ngateways:\n  spark:\n    connection:\n      type: spark\n      config:\n        spark.jars: dependencies/java/spark-mllib_2.12-3.5.1.jar\n```\n\nCopy the structure of the recipe for any portable ML model:\n\n* A `_run_spark_kmeans_if_available` helper returns `None` if `context.spark` is missing, if the `pyspark.ml` import fails, or if fit/transform raises.\n* A scikit-learn fallback runs when the Spark path returns `None`. For fewer than two rows, a single-cluster fallback runs.\n* `k = int(min(3, row_count))` caps clusters at the batch size, because KMeans fails when `k` exceeds the number of points.\n* An `engine_used` column records which path produced each row. Silent fallback is only safe if it is observable.\n* Seed stochastic algorithms (`seed=42`, `random_state=42`) so that results are reproducible.\n\nIf the model always falls back, even on the cluster, temporarily narrow the broad `except Exception` to log the real error. Then restore it.\n\n> **Warning:** The Spark engine guide warns that `toPandas()` and `collect()` on large tables pull data to the driver and cause OOM. The recipe converts only the scored, bounded output. For large outputs, return a Spark DataFrame instead.\n\n### Custom materializations\n\nIf no built-in kind gives the write behavior that you need, subclass `CustomMaterialization` in `materializations/`. Give it a `NAME`, and implement `insert` (and optionally `create`/`delete`). Reference it with `kind CUSTOM (materialization 'simple_custom')`. The docs state that most workloads fit `FULL` or an incremental kind. A custom materialization replaces the built-in DDL/DML of Vulcan, so you own its correctness across engines.","sources":["https://v2.dataos.info/build/recipes/build-a-python-model","https://v2.dataos.info/build/recipes/spark-ml-python-model","https://v2.dataos.info/references/engine-guide/spark-1/materialization-behaviour","https://v2.dataos.info/references/engine-guide/snowflake/materialization-behavior","https://v2.dataos.info/references/engine-guide/trino-1/capabilities-and-limitations","https://v2.dataos.info/references/resources/vulcan/advanced-features/custom-materializations"]},{"title":"Signals, execution hooks and failure notifications","body":"### Signals: wait for data, not the clock\n\nBy default, the scheduler runs a model when its `cron` interval ends and its upstream dependencies are done. Neither condition tells you that the data arrived. A **signal** adds a third gate. It is a Python function with the `@signal()` decorator in `signals/__init__.py`, and it inspects a batch of intervals.\n\n```python\nfrom vulcan import signal, DatetimeRanges, ExecutionContext\n\n@signal()\ndef data_available_for_today(batch: DatetimeRanges, context: ExecutionContext) -> bool:\n    overall_start = min(s for s, _ in batch)\n    overall_end = max(e for _, e in batch)\n    query = f\"\"\"\n        SELECT COUNT(*) AS cnt\n        FROM vulcan_demo.orders\n        WHERE order_date::timestamp BETWEEN '{overall_start}' AND '{overall_end}'\n    \"\"\"\n    df = context.engine_adapter.fetchdf(query)\n    return int(df.iloc[0]['cnt']) > 0\n```\n\nWire it with `signals ( data_available_for_today() )` in the `MODEL` block. The key semantics are:\n\n* Return `True`, `False`, or a **filtered list of the exact `(start, end)` tuples** that you received. Never modify interval bounds.\n* Multiple signals are an **AND**: every signal must agree.\n* `batch_size` controls how many intervals arrive at one time. If a batch covers several days, return a filtered list so that one late day does not block the rest.\n* Vulcan ships no built-in signals.\n* A commented-out `signals` block silently reverts to clock-only scheduling.\n\nTest against a deployed environment. Run `vulcan plan my_dev`. Then compare the output of `vulcan check_intervals my_dev --select-model <model>` with and without `--no-signals`. `check_intervals` evaluates only deployed environments. Thus it cannot see local signal edits until you plan them.\n\n### Execution hooks and runtime variables\n\n`before_all` and `after_all` run once for each `vulcan plan` or `vulcan run`, before and after all model processing. Entries can be inline SQL, a macro call such as `\"@grant_select_privileges()\"`, a `file:` object or a path string. Macros in hooks can read `evaluator.views`, `evaluator.schemas`, `evaluator.this_env` and `evaluator.gateway`.\n\n```yaml\nafter_all:\n  - \"@IF(@this_env = 'prod', @grant_schema_usage())\"\n  - \"@IF(@this_env != 'prod', @cleanup_dev_tables())\"\n```\n\nUse `/* sqlglot.meta replace=false */` in a generated `GRANT ... ON VIEW` so that Vulcan does not replace the view name with the physical table. Make hooks idempotent (safe to run twice), for example with `IF NOT EXISTS`, because a failed plan can retry. Use model-level `pre_statements`/`post_statements` for single-model work.\n\n`@runtime_stage` takes values `loading`, `creating`, `evaluating`, `promoting`, `demoting`, `auditing` and `testing`. `@this_model` gives the physical table. `@model_kind_name` gives the kind. `@{var}` interpolates into identifiers, and `@var` substitutes values.\n\n### Notifications: route failures to people\n\n```yaml\nnotification_targets:\n  - type: slack_webhook\n    url: \"{{ env_var('SLACK_WEBHOOK_URL') }}\"\n    notify_on:\n      - apply_failure\n      - run_failure\n  - type: teams_webhook\n    url: \"{{ env_var('TEAMS_WEBHOOK_URL') }}\"\n    notify_on:\n      - apply_failure\n      - run_failure\n```\n\n| Target | Reaches | Credential |\n| --- | --- | --- |\n| `slack_webhook` | One channel | Incoming Webhook URL |\n| `slack_api` | A channel or a specific user (member ID in `channel`) | API token |\n| `teams_webhook` | One Teams channel | Workflows (or legacy connector) URL |\n| `smtp` | Email recipients | Host, user, password, sender |\n\nThe events are `apply_start`, `apply_end`, `apply_failure`, `run_start`, `run_end`, `run_failure`, and data-quality `dq_start`/`dq_end` (you must migrate older `check_*` names to `dq_*`). Keys are snake_case only, so Vulcan does not recognize `notifyOn`. A top-level target fires for everyone. A target under a `users` entry pages that user **in addition**. A top-level `username` (best in `~/.vulcan/config.yaml`) sends every notification only to the targets of that user. This setting keeps local iteration from spamming the channel.\n\nMake sure that the full path works. First, send a request to the webhook directly with `curl`. Teams returns HTTP 202 on success. Then add a deliberate failure and run `vulcan plan prod --select-model \"<model>\" --auto-apply`. `teams_webhook` needs a recent Vulcan build (it is in `0.228.1.26`). In a managed deployment, store the webhook in a DataOS Secret and project it into the environment.","sources":["https://v2.dataos.info/build/recipes/wait-for-data-with-signals","https://v2.dataos.info/references/resources/vulcan/advanced-features/signals","https://v2.dataos.info/references/resources/vulcan/configurations/execution-hooks","https://v2.dataos.info/references/resources/vulcan/advanced-features/macros/variables","https://v2.dataos.info/build/recipes/route-failures-to-slack-or-teams","https://v2.dataos.info/references/resources/vulcan/configurations/notifications"]},{"title":"SCD Type 2 history and role-based masking","body":"### SCD Type 2: when history is a requirement\n\n`FULL` and `INCREMENTAL_BY_UNIQUE_KEY` keep only the current value. `SCD_TYPE_2` upserts on a key, but it keeps every earlier version with `valid_from` and `valid_to`. Use it only when something downstream asks \"what was true at time X\". It costs more storage and compute.\n\n| Variant | Detects change by | `valid_from` means |\n| --- | --- | --- |\n| `SCD_TYPE_2_BY_TIME` (recommended) | An updated-at column in the source | When the source actually changed |\n| `SCD_TYPE_2_BY_COLUMN` | Watching listed columns between runs | When Vulcan **detected** the change |\n\nConversion changes only the `kind` block. The query stays the same:\n\n```sql\nMODEL (\n  name warehouse.dim_customer_profile,\n  kind SCD_TYPE_2_BY_TIME (\n    unique_key customer_id,\n    invalidate_hard_deletes true\n  ),\n  grains (customer_id),\n  cron '@daily'\n);\nSELECT customer_id, name AS customer_name, email, plan_tier, updated_at\nFROM raw.customers\n```\n\n```sql\nkind SCD_TYPE_2_BY_COLUMN (\n  unique_key ARRAY[customer_id],\n  columns ARRAY[name, email, plan_tier]\n),\n```\n\nExperts must expect these effects:\n\n* **Switching kinds is breaking.** `vulcan plan` recreates the table and does a full backfill. Rows that existed before get `valid_from` at the epoch. Schedule the switch outside heavy production windows.\n* **No partial restatement.** A restatement of an SCD2 model recreates the whole table, so Vulcan disables restatement by default. Add `disable_restatement: false` to the `kind` block only when you intend to restate. Remove it after the restatement.\n* Vulcan adds `valid_from`/`valid_to` automatically. Do not declare them.\n* `invalidate_hard_deletes` (default `false`) controls whether a source row that disappears closes its version.\n* `valid_to IS NULL` means **current**, not deleted. Point-in-time queries must bound both sides:\n\n```sql\nSELECT * FROM warehouse.dim_customer_profile\nWHERE customer_id = 42\n  AND valid_from <= '2026-01-02 15:00:00'\n  AND (valid_to IS NULL OR valid_to > '2026-01-02 15:00:00');\n```\n\nEngine support is different. Snowflake, Postgres, SQL Server and Fabric support all three SCD2 kinds. Databricks and Spark list `SCD_TYPE_2`. Trino, Redshift and Athena do not list SCD2.\n\n### Masking sensitive columns by role, without forking\n\nOne semantic model can serve operators (masked) and developers (unmasked) at query time. Since July 2026 policies are **standalone files** that attach to a **physical** model. They do not attach to semantic or metric models anymore. You need four pieces:\n\n1. **Auth extension.** Create `plugins/__init__.py` (empty) and `plugins/auth_ext.py`. The second file has an async `resolve_user_groups(ctx: AuthExtensionContext) -> SecurityContext` function. The function removes `roles:id:` from `ctx.user_tags`, picks a winner with `POLICY_GROUP_PRIORITY`, and returns `SecurityContext(group=..., groups=...)`.\n2. **Wire it** at the root of `config.yaml`:\n\n```yaml\nafter_authorize: \"plugins.auth_ext:resolve_user_groups\"\n```\n\n3. **Mask expressions on the physical model:**\n\n```sql\nMODEL (\n  name silver.dim_customer_profile,\n  column_mask_expressions (\n    customer_name = CAST(NULL AS TEXT),\n    email = CAST(NULL AS TEXT)\n  )\n);\n```\n\n4. **Policy file** under `policies/access/`:\n\n```yaml\ntype: policy\nname: customer_profile_access\ndepends_on:\n  - silver.dim_customer_profile\nrules:\n  - group: developer\n  - group: operator\n    mask:\n      - email\n      - customer_name\n    filter:\n      - member: customer_segment\n        operator: notEquals\n        values:\n          - Churned\n```\n\nA rule with only `group` grants unrestricted access. `group` must match `^[a-z][a-z0-9_]{0,63}$`. `mask` lists bare column names. The SQL is in `column_mask_expressions`. The semantic model declares none of this. At export time, it inherits the policy of its anchor model.\n\nLearn to recognize these validation failures: `attach policy to a physical model only` (the policy `depends_on` points at a semantic or metric model), `column_mask_expression is missing for proposed masking on column <name>`, and every caller sees unmasked data (no `after_authorize`). With `enable_rollup: true`, a rollup group-by column needs a **constant** mask such as `CAST(NULL AS TIMESTAMP)`. Vulcan rejects masks that reference values, like `CONCAT(LEFT(email, 2), '***')`.\n\n> **Warning:** The API/query layer enforces policies. `vulcan fetchdf` and direct warehouse connections bypass them. Thus, test masking with two real tokens against the deployed `/api/v1/query` endpoint.","sources":["https://v2.dataos.info/build/recipes/track-dimension-history-with-scd-type-2","https://v2.dataos.info/build/recipes/mask-sensitive-columns-by-role","https://v2.dataos.info/references/resources/vulcan/configurations","https://v2.dataos.info/releasenotes/july-2026"]}],"lab":{"title":"Harden orders-analytics: SCD2 history, role-based masking and failure alerts","goal":"Convert the customer dimension of orders-analytics to SCD_TYPE_2_BY_TIME. Mask PII for an operator role through a standalone policy. Prove that a failed prod plan pages a Slack or Teams channel.","duration":"90 min","prereqs":["orders-analytics deployed from the Intermediate track, with a customer dimension model (here `silver.dim_customer_profile`) and a semantic model that wraps it","A source column that records the time of the last change (for example `updated_at`). If there is no such column, use SCD_TYPE_2_BY_COLUMN","Two DataOS identities or API tokens whose role tags resolve to different groups (placeholders `<operator-token>`, `<developer-token>`)","A Slack Incoming Webhook or Teams Workflows webhook URL you are allowed to use","An engine that supports SCD2 (Snowflake, Postgres, SQL Server, Fabric, Databricks or Spark)"],"steps":["**Convert the dimension to SCD2.** Change only the `kind` block of the dimension model:\n```sql\nMODEL (\n  name warehouse.dim_customer_profile,\n  kind SCD_TYPE_2_BY_TIME (\n    unique_key customer_id\n  ),\n  grains (customer_id),\n  cron '@daily'\n);\n```\nDo not declare `valid_from` or `valid_to`. Change the model name to match the naming in your project.","**Review the breaking plan.** Run `vulcan plan dev --select-model \"warehouse.dim_customer_profile\"`. Make sure that the plan shows a full rebuild of this model only. Then apply the plan.","**Decide hard-delete semantics.** If a removed source row must close its history, add `invalidate_hard_deletes true` to the `kind` block. Record your decision and the reason for it.","**Write the auth extension.** Create `plugins/__init__.py` (empty). Create `plugins/auth_ext.py` with the documented `resolve_user_groups` function. To match your role taxonomy, set `POLICY_GROUP_PRIORITY = (\"operator\", \"developer\")`. Add `after_authorize: \"plugins.auth_ext:resolve_user_groups\"` at the root of `config.yaml`.","**Add mask expressions to the physical model.** In the `MODEL(...)` block of the dimension, add:\n```sql\ncolumn_mask_expressions (\n  customer_name = CAST(NULL AS TEXT),\n  email = CAST(NULL AS TEXT)\n)\n```","**Create the standalone policy.** Add `policies/access/customer_profile_access.yml` with `type: policy`. Point `depends_on` at the physical dimension. Add a `developer` rule with no restrictions. Add an `operator` rule that masks `email` and `customer_name`. Remove each `policies:` block or `mask_expression` from the semantic model. Run `vulcan plan`. Fix each `attach policy to a physical model only` or `column_mask_expression is missing` error.","**Wire failure notifications.** Export the webhook URL (`export SLACK_WEBHOOK_URL=...` or `TEAMS_WEBHOOK_URL`). Test it directly with `curl`. Add a `notification_targets` entry with `notify_on: [apply_failure, run_failure]` to `config.yaml`. If you must silence channel alerts while you work locally, set a top-level `username` in `~/.vulcan/config.yaml`.","**Commit and deploy.** Push to your branch. Then render and apply:\n```bash\nvulcan create_deploy_yaml -o - | dataos-ctl resource apply --in -l\nvulcan create_deploy_yaml -o - | dataos-ctl resource apply --in\n```\nFor the managed resource, store the webhook URL in a DataOS Secret. Project it as an environment variable. Do not hard-code it.","**Prove masking per role.** Send the same query with both tokens:\n```bash\ncurl --location 'https://<env-fqn>/<tenant>/vulcan/<data-product-name>/api/v1/query' \\\n  --header 'Authorization: Bearer <operator-token>' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\"query\": {\"dimensions\": [\"customer_profile.customer_id\", \"customer_profile.email\"], \"measures\": [\"customer_profile.total_customers\"]}}'\n```\nRepeat with `<developer-token>`.","**Prove alerting.** Temporarily point a model at a column that does not exist. Run `vulcan plan prod --select-model \"<that-model>\" --auto-apply`. Make sure that an `apply_failure` message arrives in the channel. Revert the change and run the plan again."],"verify":"The lab succeeds when you see these results. (1) After two runs with a changed `plan_tier`, the point-in-time query bounded on both `valid_from` and `valid_to` returns the historical row. Exactly one row per key has `valid_to IS NULL`. (2) The operator token returns `null` for `email` and `customer_name` and excludes `Churned` rows. The developer token returns real values from the identical query. (3) The channel shows an `apply_failure` notification within seconds of the deliberate failure. After you revert the failure, the plan is clean.","sources":["https://v2.dataos.info/build/recipes/track-dimension-history-with-scd-type-2","https://v2.dataos.info/build/recipes/mask-sensitive-columns-by-role","https://v2.dataos.info/build/recipes/route-failures-to-slack-or-teams","https://v2.dataos.info/references/resources/vulcan/configurations/notifications","https://v2.dataos.info/build/productize/git-and-deploy"]},"takeaways":["Reuse upstream products through `inputs.yaml`. Copied SQL makes products drift","Asset YAML keys must already be snake_case. Vulcan silently ignores camelCase keys and does not convert them","Python models need explicit `columns` and `depends_on` and must yield. Record which engine path ran","Signals add a data-readiness gate, and Vulcan combines them with AND. You can test them only with `check_intervals` against a deployed environment","A switch to SCD2 is a full rebuild, and restatement is disabled by default","Masking needs the physical model, a standalone policy and an `after_authorize` hook. Test it through the API, not `fetchdf`"],"quiz":[{"q":"The upstream `customer-orders` team added a column. Right after that, the plan of a downstream `customer-insights` product fails with an error that a referenced column cannot be validated. What must the downstream engineer do?","options":["Copy the upstream model SQL into the downstream project so it is always in sync","Delete the downstream state schema and run `vulcan migrate`","Point the downstream model directly at the upstream product's state schema","Add the missing column to the downstream `inputs.yaml`, matching the upstream schema exactly, and re-plan"],"answer":3,"explain":"`inputs.yaml` is the read-only contract. When the upstream contract changes, you must update the downstream declaration before the next plan. The docs name copied SQL as the cause of drift.","source":"https://v2.dataos.info/build/recipes/reuse-data-products"},{"q":"A Python forecasting model builds its source query with an f-string. `vulcan plan` shows the model with no upstream dependency, and its first run fails at write time with a dtype error. Which pair of changes corrects both problems?","options":["Declare `depends_on` explicitly in `@model`, and cast every output column to the dtype declared in `columns` right before `yield`","Move the model to SQL and add `grains`","Remove `columns` so Vulcan infers the schema, and return instead of yield","Import pandas inside `execute()` and set `kind VIEW`"],"answer":0,"explain":"Dependency parsing cannot read dynamic queries, so `depends_on` must be explicit. Dtype mismatches against `columns` are the most common write-time error. Cast in one place before you yield. `columns` is mandatory, and Python models must yield.","source":"https://v2.dataos.info/build/recipes/build-a-python-model"},{"q":"A daily model uses `batch_size` to process three days at one time and has a signal that returns a single boolean. The source data for one day is late, and the other two days also wait. What is the recommended fix?","options":["Add a second signal that always returns True","Widen the end bound of each interval so the late day is covered","Return a filtered list containing only the ready `(start, end)` tuples from the batch","Comment out the `signals` block until the data arrives"],"answer":2,"explain":"Signals can return a subset of the exact intervals that they received. Ready days then process while late days wait. Vulcan combines multiple signals with AND. You must never modify the bounds. A commented-out block silently reverts to clock-only scheduling.","source":"https://v2.dataos.info/build/recipes/wait-for-data-with-signals"},{"q":"After adding a policy under `policies/access/` that masks `email` for the `operator` group, `vulcan plan` fails with `column_mask_expression is missing for proposed masking on column email`. What is the fix?","options":["Add `mask_expression` to the `email` dimension in the semantic model","Add `email = CAST(NULL AS TEXT)` (or another expression) to `column_mask_expressions` in the physical model's `MODEL(...)` block","Add an inline `policies:` block to the semantic model","Rename the group to `Operator`"],"answer":1,"explain":"The mask SQL is in `column_mask_expressions` on the physical model. The policy lists only bare column names. Vulcan strips a `mask_expression` on a semantic model and ignores an inline `policies:` block. Groups must be lowercase snake_case.","source":"https://v2.dataos.info/build/recipes/mask-sensitive-columns-by-role"},{"q":"An analyst wants to restate last month on an SCD_TYPE_2_BY_TIME dimension, but the restatement is refused. What is true?","options":["Restatement is disabled by default because it recreates the whole table and can lose history. Set `disable_restatement: false` on the kind block only for an intentional restatement","SCD2 supports partial restatement only with `invalidate_hard_deletes true`","Restatement requires switching to SCD_TYPE_2_BY_COLUMN","The model must be converted to VIEW first"],"answer":0,"explain":"SCD2 has no partial restatement. Each restatement recreates the entire table, so Vulcan disables it by default. To opt in, set `disable_restatement: false`, and remove it after the restatement.","source":"https://v2.dataos.info/build/recipes/track-dimension-history-with-scd-type-2"}]},{"id":"e7","title":"Orchestration and Data Applications","track":"Advanced Engineering & AI","duration":"2 h 30 min","objectives":["Choose between Workflow, Service, Worker and Bundle based on lifecycle, ports and storage needs","Write Workflows with the correct execution mode, per-step projections and scheduling policy","Configure Services and Workers with safe storage choices, replicas and high-availability placement","Package multi-resource deployments as Bundles with dependency conditions and verification steps","Deploy or link data applications, including an app on a Perspective, with path-based links and correct access settings"],"lessons":[{"title":"Workflows: DAGs, execution modes and runtime control","body":"### Choosing the right runnable resource\n\nDataOS has three runnable workload resources and one packaging resource. The correct choice depends mostly on the lifecycle:\n\n| Resource | Lifecycle | Exposes ports | Typical use |\n| --- | --- | --- | --- |\n| **Workflow** | Runs a DAG of steps to completion | No | Scheduled jobs, validations, backfills, verification steps |\n| **Service** | Reconciled as a running workload until you update, suspend or delete it | Yes (`servicePorts`) | API servers, model-serving endpoints, webhook receivers, test databases |\n| **Worker** | Long-running, reconciled like a Service | No | Stream processors, queue consumers, sinkers, reconciliation loops |\n| **Bundle** | Applies a DAG of other resources | n/a | Deploy a Service with its Secret and a verification Workflow as one unit |\n\nAll four use `version: v2alpha` manifests and the same CLI verbs: `dataos-ctl resource apply -f`, `get -t <type> -n <name> -d`, `log -t <type> -n <name>`, `delete -t <type> -n <name>` (or `delete -i \"<name>|v2alpha|<type>\"`).\n\n### Workflow: a DAG with an execution mode\n\nThe `spec.dag` of a Workflow is a list of steps. Each step has a unique `name`, an optional `depends`, and its own `spec`. This spec has `compute`, `stack`, `stackSpec`, optional `resources.requests`/`limits`, `runAsUser`, `use.volumes` and `use.projection`. Independent steps run in parallel. A step that lists two upstream steps waits for both.\n\n`spec.type` sets how the whole Workflow runs:\n\n| `spec.type` | Behavior |\n| --- | --- |\n| `instance` | Runs the DAG once each time you apply or re-run it |\n| `schedule` | Runs on each cron in `spec.schedule.crons`. Requires `spec.schedule`, including `concurrencyPolicy` |\n| `template` | Registers the definition without running it. Start it with the run or re-run action |\n\nIf you omit `spec.type` and `spec.schedule` has crons, the default is `schedule`. Otherwise, the default is `instance`. `concurrencyPolicy` (`Allow`, `Forbid`, `Replace`) **has no default** and is required for scheduled workflows. With `instance` or `template`, a cron in `spec.schedule` does not trigger runs.\n\n```yaml\nversion: v2alpha\ntype: workflow\nname: run-nightly\nspec:\n  type: schedule\n  schedule:\n    crons:\n      - \"0 2 * * *\"\n    timezone: UTC\n    concurrencyPolicy: Forbid\n  dag:\n    - name: step-a\n      spec:\n        runAsUser: ${RUN_AS_USER}\n        compute: runnable-default\n        stack: container\n        stackSpec:\n          image: docker.io/library/alpine:3.20\n          command: [sh, -c]\n          arguments: [\"echo nightly\"]\n```\n\nThese restrictions catch experienced engineers:\n\n* All steps must use Compute on the **same Data Plane**.\n* If a Workflow has `spec.type: schedule` and `concurrencyPolicy: Allow`, its steps cannot attach persistent volumes.\n* `spec.type` (execution mode) is not the top-level `type: workflow` (resource kind).\n\n### Projections belong to steps\n\nSecrets and runtime configuration reach a step through `spec.dag[].spec.use.projection`:\n\n```yaml\nuse:\n  projection:\n    secrets:\n      - id: my-secret\n        contextAlias: app\n    projections:\n      envVars:\n        - key: API_TOKEN\n          template: \"{{ secrets['app']['API_TOKEN'] | base64_decode }}\"\n        - key: WORKFLOW_ID\n          template: \"{{ defaultProjections.dataOsRunId }}\"\n```\n\n> **Warning:** The top-level `spec` of a Workflow has no `use` field. If you put a projection there, DataOS **silently drops** it. Validation passes, and the variables are missing at runtime. Steps do not inherit projections, so repeat the block in every step that needs it. You can also use a stack-level projection. If both set the same variable, the step wins. Each projection item uses `template`. There is no `value` field.\n\nIf steps must share files across the DAG, use `use.volumes` (`id`, `directory`, `readOnly`). The extract, validate, publish example does this.\n\n### Runtime lifecycle control\n\nThe `dataos-ctl resource runtime` group controls runnable resources: `run`, `re-run`, `stop`, `pause`, `resume` and `suspend`. Since September 2026 these commands also work on Services and Workers, not only on Workflows. Thus you can pause or restart workloads without editing the manifests:\n\n```bash\ndataos-ctl resource runtime stop -t service -n orders-api -v v1\ndataos-ctl resource runtime get -t workflow -n echo-workflow\n```\n\n`dataos-ctl resource runtime run` triggers an existing resource. `dataos-ctl resource run` creates a resource from a manifest and runs it in one step. A Workflow goes through these states: `creating`, `active`, `running`, `succeeded` or `failed`, and `deleted`. To see the details of a runtime failure, such as crash loops or pods that cannot be scheduled, use `get ... -d`.","sources":["https://v2.dataos.info/references/resources/workflow","https://v2.dataos.info/references/resources/workflow/core-concepts","https://v2.dataos.info/references/resources/workflow/create-a-workflow","https://v2.dataos.info/references/resources/workflow/field-reference","https://v2.dataos.info/references/resources/workflow/example","https://v2.dataos.info/references/interfaces/command-line-interface/resource","https://v2.dataos.info/releasenotes/september-2026"]},{"title":"Services and Workers: long-running workloads","body":"### Services: long-running and reachable\n\nA Service needs `name`, `type: service`, `spec.compute`, `spec.stack` and `spec.stackSpec`. Add `servicePorts`, each with a `name` and a numeric `port`. Add `replicas`, `resources`, and `use.projection` for secrets. If the Service needs storage, add it too.\n\n```yaml\nspec:\n  hostname: ${TCP_PG_SERVICE_NAME}\n  compute: ${COMPUTE_NAME}\n  stateful: true\n  replicas: 1\n  servicePorts:\n    - name: postgres\n      port: 5432\n  disk:\n    size: 10Gi\n    type: disk\n    mountPath: /var/lib/postgresql/data\n  use:\n    projection:\n      templateType: liquid\n      secrets:\n        - id: ${ENTITY_TENANT_ID}:${TCP_PG_SECRET_NAME}\n          contextAlias: pgSecret\n      projections:\n        envVars:\n          - key: POSTGRES_PASSWORD\n            template: \"{{ secrets['pgSecret'].POSTGRES_PASSWORD }}\"\n          - key: POSTGRES_USER\n            templateType: none\n            template: \"postgres\"\n  stack: container\n  stackSpec:\n    image: docker.io/library/postgres:18-alpine\n```\n\nLook at the `templateType: none` on one item. It marks a literal value next to the `liquid` default.\n\n### Storage: disk versus volume\n\nThis decision can cause real data loss:\n\n| Option | Lifecycle | On Service/Worker delete |\n| --- | --- | --- |\n| Inline `disk` (`size`, `type: disk`, `mountPath`), with `stateful: true` | Belongs to the workload | **Disk
